<body>
<h1 style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0">Random Slideshow</h1>
    <div id="slideshow">
        <!-- Images will be dynamically added here -->
    </div>

    <script>
        var imageUrls = [
            "https://www.themostusefulsiteintheworld.com/images/image1.jpg",
            "https://www.themostusefulsiteintheworld.com/images/image2.jpg",
            "https://www.themostusefulsiteintheworld.com/images/image3.jpg"
            // Add more image URLs as needed
        ];

        function preloadImages(urls, allImagesLoadedCallback) {
            var loadedCounter = 0;
            var images = [];

            urls.forEach(function(url, index) {
                var img = new Image();
                img.onload = function() {
                    loadedCounter++;
                    if (loadedCounter === urls.length) {
                        allImagesLoadedCallback(images);
                    }
                };
                img.onerror = function() {
                    console.error("Failed to load image: " + url);
                    loadedCounter++;
                    if (loadedCounter === urls.length) {
                        allImagesLoadedCallback(images);
                    }
                };
                img.src = url;
                images.push(img);
            });
        }

        function startSlideshow(images) {
            var slideshow = document.getElementById("slideshow");

            images.forEach(function(img) {
                slideshow.appendChild(img);
            });

            var currentIndex = 0;
            var interval = 3000; // Interval between slides in milliseconds

            function showNextImage() {
                images.forEach(function(img) {
                    img.style.display = "none";
                });
                images[currentIndex].style.display = "block";
                currentIndex = (currentIndex + 1) % images.length;
                setTimeout(showNextImage, interval);
            }

            showNextImage(); // Start slideshow
        }

        // Preload images and start slideshow
        preloadImages(imageUrls, startSlideshow);
    </script>
