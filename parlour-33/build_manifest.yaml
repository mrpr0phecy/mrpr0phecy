# PARLOUR XXXIII — build manifest.  THE WEAVE.
# Machine-readable form of 02-masterplan.md + 03-thirty-three-stations.md
# + 06-secondlife-constraints.md.
# If this file and the drawings disagree, regenerate tools/gen_plans.py and fix THIS file.

