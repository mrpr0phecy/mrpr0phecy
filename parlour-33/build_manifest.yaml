    seats: 8
    motion: kfm
    route: "station L5 -> lift to +60.00 -> roof loop x2 -> Crown Loop inversion -> dive through the Warren glass at 119/137 to +50.00 -> Warren hang -> out at 110/99 -> back to station"
    interior_crossings: 1
    apertures: 2
