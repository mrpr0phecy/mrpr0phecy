  name: PARLOUR XXXIII
  name_short: PARLOUR 33
  alternates: [HARE & LODGE, The Gilded Warren, The Nine of Cups, SNAPDRAGON]
  version: 2.0
  date: 2026-11-14
  system: THE WEAVE — no atrium, halls in alternating pairs, glazed gallery per deck
  currency: metres (region-relative), Lindens of land impact
  drawings: plans/*.svg
  generator: tools/gen_plans.py

