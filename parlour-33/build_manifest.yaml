attractions:
  - key: bowling
    name: The Lane
    deck: L2
    footprint: {x0: 104, z0: 103, x1: 130, z1: 120}
    lanes: 10
    lane_axis: east-west
    li: 2050
    motion: kfm
    scripts: [P33_L2_lane_ball, P33_L2_lane_pins, P33_L2_lane_console]
    test: "20 balls from 4 avatars, no cross-lane drift > 0.2 m, board matches console"
  - key: ice_rink
    name: The Mirror
    deck: L1
    footprint: {x0: 107, z0: 114, x1: 121, z1: 142}
    li: 950
    overlay: {of: pool, material: glass, mode: alpha_mask, portholes: true}
    scripts: [P33_L1_rink_hire, P33_L1_rink_anim]
    test: "pool visible through portholes, gallery visible through the boards, no alpha flicker"
  - key: pool
    name: The Flood
    deck: L0
    footprint: {x0: 104, z0: 116, x1: 122, z1: 140}
    water_y: 25.60
    depth: 2.10
    li: 1150
    scripts: [P33_L0_pool_swim, P33_L0_grotto_bar]
    test: "swim 24 m without leaving the volume; overrides cleared on exit"
  - key: flume
    name: The Water Chute
    deck: L5
    to: L0
    tubes: 1
    fall_m: 29.4
    li: 560
    motion: kfm
    scripts: [P33_L5_chute_run, P33_L0_chute_splash]
    test: "three rides end to end, splashdown at 118/126, camera restored within 2 s"
  - key: laser_quest
    name: The Undercroft
    deck: B1
    area_m2: 1400
    teams: 2
    per_team: 12
    li: 1500
    scripts: [P33_B1_lasr_vest, P33_B1_lasr_airlock, P33_B1_lasr_board]
    test: "24 avatars, 12 min, >=95% clean hits, no raycast leaves the field"
  - key: arcade
    name: Cabinet Row
    deck: L2
    cabinets: 24
    li: 1750
    plus: {name: The Penny Parlour, deck: L0, machines: 8, li: 620}
    test: "all 24 startable in one touch, finishable under 3 min, produce a number"
  - key: casino
    name: The Lodge
    deck: L3
    tables: 12
    li: 1450
    wagering: none
    tokens_transferable: false
    purchase_path: none
    test: "every table completes and returns to idle; nothing of value acquirable"
  - key: karting
    name: The Spiral
    deck: L4
    hall: E
    karts: 6
    circuit_m: 250
    li: 1850
    motion: kfm
    shared_wall: {with: the Warren, length_m: 58, openings_every_m: 12}
    scripts: [P33_L4_spir_kart, P33_L4_spir_pit, P33_L4_spir_timing]
    test: "6 riders, 3 laps, no wall clipping, board matches kart timer"
  - key: mini_golf
    name: The Ribbon
    deck: "L1-ROOF"
    holes: 18
    ledge: {r_band_m: 5.0, laps: 6}
    li: 1600
    physics_objects: 18
    scripts: [P33_RIBB_golf_ball, P33_RIBB_golf_hole]
    test: "18 holes completable in one round, no lost balls"
  - key: coaster
    name: The Thread
    deck: L5
    trains: 3
    seats: 8
    length_m: 380
    duration_s: 130
    li: 1800
    motion: kfm
    lift_top: 60.00
    interior_crossings: 1
    apertures: 2
    route: "station L5 -> lift through L5 ceiling at 150/146 to +60.00 -> roof loop twice -> Crown Loop inversion over the Belvedere -> dive through the Warren glass at 119/137 to +50.00 -> Warren hang -> out at 110/99 -> back to the station"
    rule: "never crosses an occupied hall: no 4.90 m deck can take a 2.80 m under / 2.40 m over envelope"
    scripts: [P33_L5_tird_train_01, P33_L5_tird_train_02, P33_L5_tird_train_03, P33_L5_tird_station]
    test: "3 trains x 8, 3 circuits, no clip, no desync, ride time 130 s +/- 4"
  - key: jungle_gym
    name: The Warren
    deck: L4
    volume: {x: [99, 125], z: [99, 157], y0: 47.00, y1: 58.00}
    no_slab_at_L5: true
    li: 1400
    test: "full net circuit at 30 fps with 20 avatars; the Jacob's ladder works both ways"

