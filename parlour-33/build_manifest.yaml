# -------------------------------------------------------------- sandbox ---
# 11-sandbox-edition.md — the P33 BOX, for a 512 m2 parcel.
sandbox:
  name: THE P33 BOX
  footprint_m: [20, 20]
  height_m: 6.0
  li_total: 111
  parcel_li: 117
  linksets: 7
  scripts: 9
  constraints:
    physics: 0
    sensors: 0
    cabinet_listeners: 0
    experience_tools: false
    notecards: false
    menus: false
    land_settings: false
    channels: derived_from_owner
  linksets_detail:
    - {name: shell,      li: 14, note: "walls, glazing, mullions, marquee, roof edge"}
    - {name: lanes,      li: 14, note: "2 lanes + 2 pinsets (10 pins one mesh)"}
    - {name: cabinets,   li: 40, note: "8 cabinets, 3 with games"}
    - {name: flume,      li: 8,  note: "one glass tube + splashdown"}
    - {name: bell,       li: 6,  note: "the Bell + clapper"}
    - {name: ledger,     li: 11, note: "ledger, dispenser, 3 plaques, the 34th door"}
    - {name: dressing,   li: 16, note: "benches, rail, clock, signs, the mirror"}
    - {name: board,      li: 2,  note: "the Board of the House (12-the-loop.md 3.5)"}
  keeps: [gallery, two_lanes, three_cabinets, house_hand, ledger, bell, flume, 34th_door]
  cuts: [coaster, karts, rink, pool, laser, casino, golf, 30_of_33_degrees, croupier, hare, stewards, rituals]
  upgrade_path: "every script in tools/lsl runs unmodified in the full Weave"

# ---------------------------------------------------------- the loop ----
# 12-the-loop.md — why a guest plays a second game.
loop:
  spine: "every surface, a gap; the House is always best + 1"
  loops:
    - {name: two_seconds, owner: marquee, proof: "attract mode with the ghost; input under 100 ms"}
    - {name: two_minutes, owner: the run, proof: "one gap, one bell, the ratchet"}
    - {name: two_hours,   owner: the room, proof: "the queue, the Tell, the Board"}
    - {name: two_weeks,   owner: the ledger, proof: "streaks, degrees, the 34th door"}
  innovations:
    - {name: the_ghost,   li: 0, how: "seeded LCG + input tape in linkset data; attract replays the best run"}
    - {name: the_ratchet, li: 0, how: "hand = best + 1 + tolls, announced on the marquee"}
    - {name: the_tell,    li: 0, how: "frame glow breathes at 0.5 Hz within 2 of the House"}
    - {name: the_queue,   li: 0, how: "a second toucher is remembered and starts after the run"}
    - {name: the_board,   li: 2, how: "ten names, degrees and gap, on the gallery end wall"}
    - {name: the_streak,  li: 0, how: "visits and last-seen per UUID; noticed, never paid"}
    - {name: the_toll,    li: 0, how: "on the hour the Bell rings and every hand rises one"}
    - {name: the_door,    li: 0, how: "three seconds on the hour, once a day, first guest only"}
  refusals: [no_linden_wagering, no_purchasable_advantage, no_newbie_punishment, no_griefing,
             no_loss_of_progress, no_punishment_for_absence, the_exit_is_always_open]

# -------------------------------------------------------- the finish ----
# 13-finish.md — why it feels expensive.
finish:
  min_thickness_m: 0.02
  min_prim_axis_m: 0.05
  faces_per_repeated_prim: 6
  texture_size: 512
  max_glow: 0.60
  local_lights_per_10m: 2
  light_falloff: 0.75
  signage_tiers: [wayfinding, zone, object, whisper]
  hovertext: {max_lines: 3, max_chars: 32, one_per_prim: true}
  cabinet_states: [ATTRACT, ATTRACT_WHISPER, ARM, RUN, OVER, COOLDOWN, ABANDON]
  acceptance_tests: 25
  simulator: tools/cabinet-sim.html   # the Adder in a browser; verifies the ghost's determinism
  definition_of_done:
    - "passes the twenty-five tests"
    - "a stranger can use it without being told anything"
    - "it says something in the Croupier's voice worth reading twice"
    - "removing it would be a loss"

# ------------------------------------------------------- the twist ----
# 14-the-root.md — the House and the Root, in one building.
root:
  premise: "the lodge catalogues what it cannot remove; the Root keeps growing anyway"
  voices:
    house: "capitals, arithmetic, third person, never argues"
    root: "lowercase, three to six words, always true"
  contested_number:
    toll: "+1 on the hour (the House)"
    pull: "-1 on a cabinet's 33rd run (the Root)"
    reset: "a guest beating the hand -> best + 1 + raised"
  infestation:
    - {stage: 0, name: CLEAN,     trigger: "install"}
    - {stage: 1, name: SPROUTING, trigger: "33 distinct guests or 100 runs"}
    - {stage: 2, name: CHOKING,   trigger: "200 runs and 20 degrees"}
    - {stage: 3, name: SQUATTER,  trigger: "500 runs, 100 degrees, 33 guests since 2"}
  stages_cost_li: 0          # three arrangements of one set of prims, never more prims
  marquee_war: {house: 7, root: 1}
  second_palette:
    verdigris: "#2E6B57"
    rust: "#7E3B1E"
    wet_concrete: "#22252A"
    sodium: "#FFB85C"       # the only warm light in the building
    sharpie: "#0B0B0C"
    indicator: "#3CE07A"
    sheeting: "#B9B2A4"
  scriber:
    cabinet: 12
    grid: "12 x 12"
    stroke_max: 16
    seconds: 20
    judging: {axis_symmetry: 3, rotational_symmetry: 3, closure: 2, coverage: 1, heretic_bonus: 4}
    leaves_behind: "the best stroke is drawn again in attract mode, forever"
