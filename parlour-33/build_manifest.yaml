non_negotiables:
  - No atrium. No opening in any slab larger than 14 x 10 m, and never two stacked.
  - Every deck holds two attractions separated by a glazed gallery.
  - Floor to floor stays 5.50 m.
  - The rink stays over the pool and stays glass; the Flume stays glass for all 33 m.
  - Laser quest never gets a window.
  - The Lodge keeps its ceiling.
  - The Zigzag stays continuous: four stairs, four corners.
  - Nothing is physical that does not need to be.
  - One region. No sim crossings in any ride envelope.
  - No L$ wagering. Anywhere.

