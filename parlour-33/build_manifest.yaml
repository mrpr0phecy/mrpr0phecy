non_negotiables:
  - The Oculus is never obstructed below +35.00 except by the lane bridge, the slides, the nets, the Lodestone and the two coaster crossings.
  - Floor to floor stays 5.50 m.
  - The bowling lanes stay 25 m and stay over the void.
  - The rink stays over the pool and stays glass (masked, with portholes).
  - Laser quest never gets a window.
  - The Lodge keeps its ceiling.
  - Nothing is physical that does not need to be.
  - The Thread is continuous from +14.00 to +57.00.
  - One region. No sim crossings in any ride envelope.
  - No L$ wagering. Anywhere.

