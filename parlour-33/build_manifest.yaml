# ----------------------------------------------------------------- lore ---
lore:
  premise: "A lodge of croupiers, machinists and spiritualists built a hall that could play any game, to find the one game that could beat them. In 1937 they played it. The House did not lose. It is still open."
  year_built: 1933
  the_work: "the lodge's heresy: a game is a device for measuring a person"
  numbers: {degrees: 33, the_door: 34, floor_to_roof_m: 33.00, house_edge: 1}
  cast:
    - {key: house,       name: The House,    kind: character, build: "the building itself", voice: "exact, numeric, courteous"}
    - {key: croupier,    name: The Croupier, kind: effect,    build: "reflections only, 2.1 m, 1 prim, alpha 0.55, never walkable", voice: "the House's mouth"}
    - {key: hare,        name: The Hare,     kind: npc,       build: "1.9 m, 2 prims, bottle green, brass watch", voice: "breathless, over-formal"}
    - {key: stewards,    name: The Stewards, kind: player_roles, count: 4, roles: [Doorman, Dealer, Mechanic, Medium]}
    - {key: guests,      name: The Guests,   kind: props,     count: 4, note: "the Widow, the Two Brothers, the Child, the Man Who Won"}
  rules:
    - The House is always open. The House is never full.
    - Play is free. Winning costs.
    - Nothing here is for sale except the games.
    - The House wins by one. This is how you know it is playing.
    - Touch nothing that is counting.
    - If a machine asks your name, give it another name.
    - The 34th door is not locked.
    - Do not thank the Croupier.
    - Leave by the door you came in, or don't leave.
  rituals:
    - {key: toll,    name: THE TOLL,           when: "hourly, :00",     where: "the whole house"}
    - {key: seance,  name: THE SEANCE,         when: "21:00 nightly",   where: L3, players: 8, minutes: 12}
    - {key: third,   name: THE THIRD HOUR,     when: "03:00",           where: "Croupier's Pit"}
    - {key: door,    name: THE HOUR OF THE DOOR, when: "on 33 degrees", where: L5, guests: 1}
  endings: [THE GUEST, THE STEWARD, THE FOOL]
  secrets: 12
  house_hand: {rule: "hand = best + 1, always", stored_on: cabinet, persisting: linkset_data}

