attractions:
  - key: bowling
    name: The Lane
    deck: L2
    footprint: {x0: 121, z0: 114, x1: 135, z1: 144}
    lanes: 8
    li: 2050
    motion: kfm
    scripts: [P33_L2_lane_ball, P33_L2_lane_pins, P33_L2_lane_console]
    test: "20 balls, 4 avatars, no cross-lane drift > 0.2 m, board matches console"
  - key: ice_rink
    name: The Mirror
    deck: L1
    footprint: {x0: 113, z0: 97, x1: 143, z1: 115}
    li: 950
    overlay: {of: pool, material: glass, mode: alpha_mask, portholes: true}
    scripts: [P33_L1_rink_hire, P33_L1_rink_anim]
    test: "pool visible through portholes, no alpha flicker on a full circuit"
  - key: pool
    name: The Flood
    deck: L0
    footprint: {x0: 115, z0: 100, x1: 141, z1: 115}
    water_y: 23.30
    depth: 2.10
    li: 1150
    scripts: [P33_L0_pool_swim, P33_L0_grotto_bar]
    test: "swim grotto -> Sunbeam without leaving volume; overrides cleared on exit"
  - key: slides
    name: The Water Chute
    deck: L4
    to: L0
    flumes: 3
    fall_m: 23.0
    li: 560
    motion: kfm
    scripts: [P33_L4_chute_run, P33_L4_chute_splash]
    test: "3 rides end to end, splashdown in the Sunbeam, camera restored within 2 s"
  - key: laser_quest
    name: The Undercroft
    deck: U2
    area_m2: 1400
    teams: 2
    per_team: 12
    li: 1500
    scripts: [P33_U2_lasr_vest, P33_U2_lasr_airlock, P33_U2_lasr_board]
    test: "24 avatars, 12 min, >=95% clean hits, no raycast leaves the field"
  - key: arcade
    name: Cabinet Row
    deck: L2
    cabinets: 24
    li: 1750
    plus: {name: The Penny Parlour, deck: L0, machines: 8, li: 620}
    test: "all 24 startable in one touch, finishable under 3 min, produce a number"
  - key: casino
    name: The Lodge
    deck: L3
    tables: 12
    li: 1450
    wagering: none
    tokens_transferable: false
    purchase_path: none
    test: "every table completes and returns to idle; nothing of value acquirable"
  - key: karting
    name: The Spiral
    deck: L5
    to: plaza
    karts: 6
    lap_m: 370
    li: 1850
    motion: kfm
    scripts: [P33_L5_spir_kart, P33_L5_spir_pit, P33_L5_spir_timing]
    test: "6 riders, 3 laps, no facade clipping, board matches kart timer"
  - key: mini_golf
    name: The Ribbon
    deck: "L1-L5"
    holes: 18
    ledge: {r0: 31.0, r1: 36.0}
    li: 1600
    physics_objects: 18
    scripts: [P33_RIBB_golf_ball, P33_RIBB_golf_hole]
    test: "18 holes completable in one round, no lost balls"
  - key: coaster
    name: The Thread
    deck: L5
    trains: 3
    seats: 8
    length_m: 420
    duration_s: 130
    li: 1800
    motion: kfm
    scripts: [P33_L5_tird_train_01, P33_L5_tird_train_02, P33_L5_tird_train_03, P33_L5_tird_station]
    test: "3 trains x 8, 3 circuits, no clip, no desync, ride time 130 s +/- 4"
  - key: jungle_gym
    name: The Warren
    deck: L4
    volume: {r0: 1.0, r1: 13.6, a0: -72, a1: 72, y0: 43.0, y1: 51.0}
    li: 1400
    test: "full net circuit at 30 fps with 20 avatars; outer-edge fall is caught"

