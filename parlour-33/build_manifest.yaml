systems:
  zigzag:
    stairs: 4
    corners: [{id: I, at: [159.5, 159.5]}, {id: II, at: [96.5, 159.5]},
              {id: III, at: [96.5, 96.5]}, {id: IV, at: [159.5, 96.5]}]
    legs: [B1>L0 via III, "L0>L1 via II", "L1>L2 via I", "L2>L3 via IV",
           "L3>L4 via III", "L4>L5 via II", "L5>Roof via I"]
    rule: "every stair turns the visitor ninety degrees"
  ribbon:
    kind: golf ledge
    width_m: 5.0
    lap_per_deck: 1
    holes: 18
    from: L1
    to: ROOF
  watch:
    kind: floor openings
    count: 11
    max_size_m: [14, 10]
    rule: "no two openings stacked; never an atrium"
  flume:
    from: {x: 150, z: 150, y: 55.00}
    to: {x: 118, z: 126, y: 25.60}
    internal_m: 1.70
    fall_m: 29.40
    duration_s: 14
    material: glass
  thread:
    length_m: 380
    duration_s: 130
    trains: 3
    seats: 8
    motion: kfm
    route: "station L5 -> lift to +60.00 -> roof loop x2 -> Crown Loop inversion -> dive through the Warren glass at 119/137 to +50.00 -> Warren hang -> out at 110/99 -> back to station"
    interior_crossings: 1
    apertures: 2
    rule: "never crosses an occupied hall: no 4.90 m deck can take a 2.80 m under / 2.40 m over envelope"
    lift_top: 60.00
  spiral:
    length_m: 250
    deck: L4
    hall: E
    karts: 6
    lap_s: 150
    motion: kfm

