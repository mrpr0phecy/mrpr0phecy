<h2 id="tcct-title" style="margin-top:0;color:var(--accent);">🔠 Text Case Converter Toolkit</h2>

<form aria-describedby="tcct-desc" onsubmit="event.preventDefault();">
  <p id="tcct-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Instantly convert text between UPPERCASE, lowercase, Title Case, Sentence case, camelCase, PascalCase, snake_case, kebab-case, CONSTANT_CASE, dot.case, aLtErNaTiNg and reversed. One click to copy. Nothing leaves your browser.
  </p>

  <textarea id="tcct-in" rows="6" placeholder="Type or paste your text here..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;resize:vertical;line-height:1.6;font-family:inherit;margin-bottom:10px;"></textarea>

  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;" id="tcct-btns">
    <button type="button" data-tcct="upper" style="padding:7px 12px;border-radius:8px;background:rgba(45,212,255,0.12);border:1px solid rgba(45,212,255,0.35);color:var(--accent);font-size:0.78rem;cursor:pointer;">UPPERCASE</button>
    <button type="button" data-tcct="lower" style="padding:7px 12px;border-radius:8px;background:rgba(45,212,255,0.12);border:1px solid rgba(45,212,255,0.35);color:var(--accent);font-size:0.78rem;cursor:pointer;">lowercase</button>
    <button type="button" data-tcct="title" style="padding:7px 12px;border-radius:8px;background:rgba(45,212,255,0.12);border:1px solid rgba(45,212,255,0.35);color:var(--accent);font-size:0.78rem;cursor:pointer;">Title Case</button>
    <button type="button" data-tcct="sentence" style="padding:7px 12px;border-radius:8px;background:rgba(45,212,255,0.12);border:1px solid rgba(45,212,255,0.35);color:var(--accent);font-size:0.78rem;cursor:pointer;">Sentence case</button>
    <button type="button" data-tcct="camel" style="padding:7px 12px;border-radius:8px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.3);color:#39ff14;font-size:0.78rem;cursor:pointer;">camelCase</button>
    <button type="button" data-tcct="pascal" style="padding:7px 12px;border-radius:8px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.3);color:#39ff14;font-size:0.78rem;cursor:pointer;">PascalCase</button>
    <button type="button" data-tcct="snake" style="padding:7px 12px;border-radius:8px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.3);color:#39ff14;font-size:0.78rem;cursor:pointer;">snake_case</button>
    <button type="button" data-tcct="kebab" style="padding:7px 12px;border-radius:8px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.3);color:#39ff14;font-size:0.78rem;cursor:pointer;">kebab-case</button>
    <button type="button" data-tcct="constant" style="padding:7px 12px;border-radius:8px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.3);color:#39ff14;font-size:0.78rem;cursor:pointer;">CONSTANT_CASE</button>
    <button type="button" data-tcct="dot" style="padding:7px 12px;border-radius:8px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.3);color:#39ff14;font-size:0.78rem;cursor:pointer;">dot.case</button>
    <button type="button" data-tcct="alt" style="padding:7px 12px;border-radius:8px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.3);color:#ffa500;font-size:0.78rem;cursor:pointer;">aLtErNaTiNg</button>
    <button type="button" data-tcct="inverse" style="padding:7px 12px;border-radius:8px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.3);color:#ffa500;font-size:0.78rem;cursor:pointer;">iNVERSE</button>
    <button type="button" data-tcct="reverse" style="padding:7px 12px;border-radius:8px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.3);color:#ffa500;font-size:0.78rem;cursor:pointer;">esreveR</button>
    <button type="button" data-tcct="slug" style="padding:7px 12px;border-radius:8px;background:rgba(157,78,221,0.12);border:1px solid rgba(157,78,221,0.35);color:#c99bff;font-size:0.78rem;cursor:pointer;">url-slug</button>
    <button type="button" data-tcct="trim" style="padding:7px 12px;border-radius:8px;background:rgba(157,78,221,0.12);border:1px solid rgba(157,78,221,0.35);color:#c99bff;font-size:0.78rem;cursor:pointer;">Trim spaces</button>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;">
    <span id="tcct-label" style="font-size:0.75rem;color:var(--text-secondary);text-transform:uppercase;">Result</span>
    <div style="display:flex;gap:6px;">
      <button type="button" id="tcct-copy" style="padding:6px 12px;border-radius:8px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);color:var(--accent);font-size:0.78rem;cursor:pointer;">Copy result</button>
      <button type="button" id="tcct-replace" style="padding:6px 12px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.78rem;cursor:pointer;">Use as input ↑</button>
    </div>
  </div>
  <textarea id="tcct-out" rows="6" readonly aria-live="polite" style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(57,255,20,0.2);background:rgba(0,0,0,0.35);color:var(--text);font-size:14px;resize:vertical;line-height:1.6;font-family:inherit;"></textarea>
  <div id="tcct-stats" style="font-size:0.72rem;color:var(--text-secondary);margin-top:6px;"></div>
</form>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var inp=$('tcct-in'), out=$('tcct-out'), mode='upper';
  var small=['a','an','the','and','but','or','for','nor','on','at','to','from','by','of','in','as','vs','via'];
  function words(s){
    // split camelCase / PascalCase / separators into word list
    return s.replace(/([a-z0-9])([A-Z])/g,'$1 $2').replace(/([A-Z]+)([A-Z][a-z])/g,'$1 $2').split(/[^A-Za-z0-9\u00C0-\u024F]+/).filter(Boolean);
  }
  var fns={
    upper:function(s){return s.toUpperCase();},
    lower:function(s){return s.toLowerCase();},
    title:function(s){ return s.toLowerCase().replace(/\b([a-z\u00E0-\u024F])([a-z\u00E0-\u024F']*)/g,function(m,a,b,i){ return (i!==0 && small.indexOf(m)>-1) ? m : a.toUpperCase()+b; }); },
    sentence:function(s){ return s.toLowerCase().replace(/(^\s*[a-z\u00E0-\u024F])|([.!?]\s+[a-z\u00E0-\u024F])/g,function(m){return m.toUpperCase();}).replace(/\bi\b/g,'I'); },
    camel:function(s){ return s.split(/\n/).map(function(line){ var w=words(line).map(function(x){return x.toLowerCase();}); return w.map(function(x,i){return i?x.charAt(0).toUpperCase()+x.slice(1):x;}).join(''); }).join('\n'); },
    pascal:function(s){ return s.split(/\n/).map(function(line){ return words(line).map(function(x){x=x.toLowerCase();return x.charAt(0).toUpperCase()+x.slice(1);}).join(''); }).join('\n'); },
    snake:function(s){ return s.split(/\n/).map(function(line){ return words(line).join('_').toLowerCase(); }).join('\n'); },
    kebab:function(s){ return s.split(/\n/).map(function(line){ return words(line).join('-').toLowerCase(); }).join('\n'); },
    constant:function(s){ return s.split(/\n/).map(function(line){ return words(line).join('_').toUpperCase(); }).join('\n'); },
    dot:function(s){ return s.split(/\n/).map(function(line){ return words(line).join('.').toLowerCase(); }).join('\n'); },
    alt:function(s){ var i=0; return s.split('').map(function(c){ if(/[a-z]/i.test(c)){ var r=(i%2? c.toUpperCase(): c.toLowerCase()); i++; return r;} return c; }).join(''); },
    inverse:function(s){ return s.split('').map(function(c){ var u=c.toUpperCase(); return c===u? c.toLowerCase(): u; }).join(''); },
    reverse:function(s){ return Array.from(s).reverse().join(''); },
    slug:function(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); },
    trim:function(s){ return s.split('\n').map(function(l){return l.trim().replace(/\s{2,}/g,' ');}).join('\n').replace(/\n{3,}/g,'\n\n').trim(); }
  };
  var labels={upper:'UPPERCASE',lower:'lowercase',title:'Title Case',sentence:'Sentence case',camel:'camelCase',pascal:'PascalCase',snake:'snake_case',kebab:'kebab-case',constant:'CONSTANT_CASE',dot:'dot.case',alt:'aLtErNaTiNg',inverse:'iNVERSE',reverse:'Reversed',slug:'URL slug',trim:'Trimmed'};
  function run(){
    var s=inp.value; var r=fns[mode](s); out.value=r;
    $('tcct-label').textContent='Result — '+labels[mode];
    var w=s.trim()?s.trim().split(/\s+/).length:0;
    $('tcct-stats').textContent=w+' words · '+s.length+' characters in · '+r.length+' characters out';
  }
  $('tcct-btns').addEventListener('click',function(e){ var b=e.target.closest('[data-tcct]'); if(!b) return; mode=b.getAttribute('data-tcct'); run();
    Array.prototype.forEach.call(this.querySelectorAll('button'),function(x){ x.style.outline= x===b ? '2px solid rgba(255,255,255,0.6)':'none'; });
  });
  inp.addEventListener('input',run);
  $('tcct-replace').addEventListener('click',function(){ inp.value=out.value; run(); });
  $('tcct-copy').addEventListener('click',function(){
    var btn=this; function done(){ btn.textContent='Copied ✓'; setTimeout(function(){btn.textContent='Copy result';},1200); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(out.value).then(done,function(){}); }
    else { out.select(); try{document.execCommand('copy');}catch(e){} done(); }
  });
  run();
})();
</script>
