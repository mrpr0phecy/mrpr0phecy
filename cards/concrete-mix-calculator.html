<!-- cards/concrete-mix-calculator.html -->
<h2 id="concmix-title" style="margin-top:0;color:var(--accent);">🧱 Concrete Mix Calculator</h2>

<form aria-describedby="concmix-desc" onsubmit="event.preventDefault();">
  <p id="concmix-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Calculate cement, sand, gravel, and water for any concrete project — from fence posts to shed bases.
  </p>

  <div style="margin-bottom:12px;">
    <label for="concmix-project" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Project Type</label>
    <select id="concmix-project" onchange="concmixUpdate()" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="path">Garden Path / Patio (C15)</option>
      <option value="base" selected>Shed Base / Foundation (C20)</option>
      <option value="driveway">Driveway / Garage Floor (C25)</option>
      <option value="structural">Structural / Footings (C30)</option>
      <option value="post">Fence Post (Postcrete or C20)</option>
    </select>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="concmix-w" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Width (m)</label>
      <input id="concmix-w" type="number" step="0.1" min="0.1" value="3" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="concmix-l" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Length (m)</label>
      <input id="concmix-l" type="number" step="0.1" min="0.1" value="3" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="concmix-d" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Depth (cm)</label>
      <input id="concmix-d" type="number" step="1" min="1" value="10" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
  </div>

  <div style="margin-bottom:14px;">
    <label for="concmix-method" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Mix Method</label>
    <select id="concmix-method" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="bags" selected>Ready-mix bags (easier)</option>
      <option value="bulk">Bulk ingredients (cheaper for large areas)</option>
    </select>
  </div>

  <button type="button" onclick="concmixCalc()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🧱 Calculate Mix
  </button>

  <div id="concmix-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);">
    <div style="text-align:center;margin-bottom:12px;">
      <div style="font-size:0.8rem;color:var(--text-secondary);">Volume Needed</div>
      <div id="concmix-vol" style="font-size:2rem;color:var(--accent);font-weight:700;"></div>
    </div>
    <div id="concmix-materials" style="font-size:0.9rem;color:var(--text);line-height:1.8;margin-bottom:12px;"></div>
    <div id="concmix-cost" style="font-size:1rem;color:var(--accent);font-weight:700;text-align:center;margin-bottom:10px;"></div>
    <div id="concmix-tips" style="font-size:0.8rem;color:var(--text-secondary);line-height:1.6;"></div>
  </div>
</form>

<script>
(function(){
  var concmixRatios={
    path:{c:1,s:2,a:4,label:'C15 — light domestic'},
    base:{c:1,s:2,a:3,label:'C20 — general purpose'},
    driveway:{c:1,s:1.5,a:3,label:'C25 — heavy domestic'},
    structural:{c:1,s:1,a:2,label:'C30 — structural'},
    post:{c:1,s:2,a:3,label:'C20 — post mix'}
  };

  window.concmixUpdate=function(){};

  window.concmixCalc=function(){
    var w=parseFloat(document.getElementById('concmix-w').value);
    var l=parseFloat(document.getElementById('concmix-l').value);
    var d=parseFloat(document.getElementById('concmix-d').value)/100;
    var proj=document.getElementById('concmix-project').value;
    var method=document.getElementById('concmix-method').value;
    var vol=w*l*d;
    var volL=vol*1000;
    var ratio=concmixRatios[proj];
    var totalParts=ratio.c+ratio.s+ratio.a;
    if(method==='bags'){
      var bagSize=25;
      var bagsNeeded=Math.ceil(volL/(bagSize*0.7));
      document.getElementById('concmix-vol').textContent=vol.toFixed(2)+' m³ ('+volL.toFixed(0)+' litres)';
      document.getElementById('concmix-materials').innerHTML='🛒 <strong>'+bagsNeeded+'×</strong> 25kg ready-mix concrete bags<br>💧 Water: follow bag instructions (typically 2–3 litres per bag)<br>📊 Mix ratio: '+ratio.label;
      document.getElementById('concmix-cost').innerHTML='💰 Estimated: <strong>£'+(bagsNeeded*4.5).toFixed(2)+'</strong> (at ~£4.50/bag)';
    } else {
      var cementKg=Math.round(vol*totalParts*0.035);
      var sandKg=Math.round(vol*ratio.s*1700);
      var gravelKg=Math.round(vol*ratio.a*1600);
      var waterL=Math.round(cementKg*0.5);
      var cementBags=Math.ceil(cementKg/25);
      document.getElementById('concmix-vol').textContent=vol.toFixed(2)+' m³';
      document.getElementById('concmix-materials').innerHTML='🏗️ <strong>Cement:</strong> '+cementKg+' kg ('+cementBags+' × 25kg bags)<br>🏖️ <strong>Sand:</strong> '+sandKg+' kg ('+(sandKg/1000).toFixed(1)+' tonnes)<br>🪨 <strong>Gravel:</strong> '+gravelKg+' kg ('+(gravelKg/1000).toFixed(1)+' tonnes)<br>💧 <strong>Water:</strong> ~'+waterL+' litres<br>📊 Ratio: 1:'+ratio.s+':'+ratio.a+' ('+ratio.label+')';
      document.getElementById('concmix-cost').innerHTML='💰 Estimated: <strong>£'+(cementBags*7+sandKg/1000*50+gravelKg/1000*45).toFixed(2)+'</strong>';
    }
    document.getElementById('concmix-tips').innerHTML='💡 <strong>Order 10% extra</strong> — you always need more than you think.<br>💡 <strong>Weather:</strong> Don\'t pour below 5°C or in direct hot sun. Cover with plastic sheeting after pouring.<br>💡 <strong>Curing:</strong> Keep concrete damp for 7 days. Mist with water or cover with wet hessian.<br>💡 <strong>Compaction:</strong> Tap the sides of the formwork and use a shovel to remove air pockets.';
    document.getElementById('concmix-result').style.display='block';
  };
})();
</script>
