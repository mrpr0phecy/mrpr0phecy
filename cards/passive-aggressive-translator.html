<!-- cards/passive-aggressive-translator.html -->
<h2 id="patrans-title" style="margin-top:0;color:var(--accent);">📧 Passive Aggressive Email Translator</h2>

<form aria-describedby="patrans-desc" onsubmit="event.preventDefault();">
  <p id="patrans-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Type what you <em>actually</em> want to say. We'll make it sound professional. Ish.
  </p>

  <div style="margin-bottom:16px;">
    <label for="patrans-input" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:600;">What you want to say:</label>
    <textarea id="patrans-input" rows="3" placeholder="e.g., You missed the deadline AGAIN and I'm losing my mind" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;resize:vertical;box-sizing:border-box;"></textarea>
  </div>

  <div style="margin-bottom:16px;">
    <label style="display:block;margin-bottom:6px;color:var(--accent);font-weight:600;">Politeness Level</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button type="button" onclick="patransSetLevel(1)" id="patrans-l1" style="padding:8px 14px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:rgba(45,212,255,0.2);color:var(--accent);cursor:pointer;font-size:0.85rem;">😤 Barely Civil</button>
      <button type="button" onclick="patransSetLevel(2)" id="patrans-l2" style="padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:inherit;cursor:pointer;font-size:0.85rem;">😊 Corporate Nice</button>
      <button type="button" onclick="patransSetLevel(3)" id="patrans-l3" style="padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:inherit;cursor:pointer;font-size:0.85rem;">🌸 Toxic Positivity</button>
    </div>
  </div>

  <button type="button" onclick="patransTranslate()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    ✨ Translate My Rage
  </button>

  <div id="patrans-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);">
    <div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:8px;">📋 Your "professional" email:</div>
    <div id="patrans-output" style="font-size:1rem;color:var(--text);line-height:1.6;white-space:pre-wrap;"></div>
    <div id="patrans-warning" style="margin-top:10px;font-size:0.75rem;color:#ff4d4d;display:none;"></div>
  </div>
</form>

<script>
(function(){
  var patransLevel = 2;

  window.patransSetLevel = function(l) {
    patransLevel = l;
    for (var i = 1; i <= 3; i++) {
      var btn = document.getElementById('patrans-l' + i);
      if (i === l) {
        btn.style.background = 'rgba(45,212,255,0.2)';
        btn.style.borderColor = 'rgba(45,212,255,0.3)';
        btn.style.color = 'var(--accent)';
      } else {
        btn.style.background = 'rgba(255,255,255,0.03)';
        btn.style.borderColor = 'rgba(255,255,255,0.1)';
        btn.style.color = 'inherit';
      }
    }
  };

  var patransPrefixes = {
    1: ['Look,', 'Right,', 'So,', 'Right, so,', 'Listen,'],
    2: ['I hope this email finds you well.', 'Thank you for your email.', 'Just following up on this.', 'Hope you\'re having a great week!', 'Thanks for reaching out.'],
    3: ['GOOD MORNING SUNSHINE! ☀️🌈', 'Hiiiii! Hope you\'re having the BEST day ever!!! 💖', 'Sending you ALL the positive vibes today! ✨🦋', 'Hey bestie! 🌸🌺🌻']
  };

  var patransSuffixes = {
    1: ['Regards.', 'Thanks, I guess.', 'Do better.', 'Please advise (urgently).', 'Awaiting your response.'],
    2: ['Best regards,', 'Kind regards,', 'Many thanks,', 'Thanks in advance,', 'Looking forward to hearing from you,'],
    3: ['Sending SO much love and light! 💕✨🙏', 'You\'re AMAZING and don\'t forget it! 🌟💖', 'Hugs and sparkles! 🤗✨💫', 'Stay blessed! 🌈🦋☀️💖']
  };

  var patransReplacements = [
    [/you missed the deadline/gi, {
      1: 'you failed to meet the deadline (again)',
      2: 'it appears the deadline may have slipped',
      3: 'I noticed the timeline might have shifted a teensy bit! No worries at all! 😊'
    }],
    [/you('re| are) wrong/gi, {
      1: 'that\'s incorrect',
      2: 'I think there may be a slight misunderstanding',
      3: 'I love your perspective! Just a tiny thought — maybe we could explore another angle? 🤔💕'
    }],
    [/do your job/gi, {
      1: 'do what you\'re paid to do',
      2: 'I\'d appreciate it if we could ensure all responsibilities are being met',
      3: 'I just KNOW you\'re going to absolutely CRUSH your responsibilities because you\'re a STAR! ⭐'
    }],
    [/I don't care/gi, {
      1: 'I have no strong feelings on this',
      2: 'I\'m happy to go with whatever the team decides',
      3: 'I\'m SO flexible and easygoing! Whatever makes everyone happy! 🌈'
    }],
    [/this is stupid/gi, {
      1: 'this is a waste of everyone\'s time',
      2: 'I\'m not sure this is the best use of our resources',
      3: 'What a fun creative exercise! I wonder if we might explore some other exciting directions too? 🎨'
    }]
  ];

  window.patransTranslate = function() {
    var input = document.getElementById('patrans-input').value.trim();
    if (!input) { document.getElementById('patrans-output').textContent = 'Please type something first — even rage needs direction.'; document.getElementById('patrans-result').style.display = 'block'; return; }

    var prefix = patransPrefixes[patransLevel][Math.floor(Math.random() * patransPrefixes[patransLevel].length)];
    var suffix = patransSuffixes[patransLevel][Math.floor(Math.random() * patransSuffixes[patransLevel].length)];

    var output = input;
    for (var i = 0; i < patransReplacements.length; i++) {
      output = output.replace(patransReplacements[i][0], patransReplacements[i][1][patransLevel]);
    }

    if (patransLevel === 1) {
      output = prefix + '\n\n' + output + '\n\n' + suffix;
    } else if (patransLevel === 2) {
      output = prefix + '\n\n' + output + '\n\n' + suffix;
    } else {
      output = prefix + '\n\n' + output + '\n\n' + suffix;
    }

    document.getElementById('patrans-output').textContent = output;
    document.getElementById('patrans-result').style.display = 'block';

    var warn = document.getElementById('patrans-warning');
    if (patransLevel === 3) {
      warn.textContent = '⚠️ Warning: This level of positivity may cause the recipient to question your sincerity.';
      warn.style.display = 'block';
    } else if (patransLevel === 1) {
      warn.textContent = '⚠️ Warning: HR may want a word. Proceed with caution.';
      warn.style.display = 'block';
    } else {
      warn.style.display = 'none';
    }
  };
})();
</script>
