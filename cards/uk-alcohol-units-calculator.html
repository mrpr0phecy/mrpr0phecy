<h2 id="ualc-title" style="margin-top:0;color:var(--accent);">🍺 UK Alcohol Units Calculator</h2>

<form aria-describedby="ualc-desc" onsubmit="event.preventDefault();">
  <p id="ualc-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    UK units = ABV (%) × volume (ml) ÷ 1,000. The NHS low-risk guideline is 14 units a week, spread out, with several drink-free days. This is arithmetic, not medical advice.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="ualc-abv" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">ABV %</label>
      <input id="ualc-abv" type="number" min="0" step="any" value="4.5" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ualc-ml" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Volume ml</label>
      <input id="ualc-ml" type="number" min="0" step="any" value="568" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ualc-n" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">How many</label>
      <input id="ualc-n" type="number" min="1" step="1" value="1" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
  <div id="ualc-presets" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"></div>
</form>
<div id="ualc-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var presets = [
    ['Pint bitter 4%', 4, 568],
    ['Pint lager 5%', 5, 568],
    ['Bottle beer 330 ml', 4.5, 330],
    ['Can 440 ml 5.2%', 5.2, 440],
    ['Wine 175 ml 12%', 12, 175],
    ['Wine 250 ml 13%', 13, 250],
    ['Bottle wine 750 ml', 12.5, 750],
    ['Single spirit 25 ml', 40, 25],
    ['Double 50 ml 40%', 40, 50],
    ['Cider pint 4.5%', 4.5, 568]
  ];
  var box = $('ualc-presets');
  presets.forEach(function (p) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = p[0];
    b.style.cssText = 'padding:7px 10px;border-radius:999px;border:1px solid rgba(45,212,255,.35);background:rgba(45,212,255,.08);color:var(--accent);font-size:.75rem;font-weight:700;cursor:pointer;min-height:36px;';
    b.addEventListener('click', function () {
      $('ualc-abv').value = p[1];
      $('ualc-ml').value = p[2];
      $('ualc-n').value = 1;
      run();
    });
    box.appendChild(b);
  });
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var abv = Number($('ualc-abv').value), ml = Number($('ualc-ml').value), n = Number($('ualc-n').value);
    if (!(abv >= 0) || !(ml >= 0) || !(n >= 1)) {
      $('ualc-out').textContent = 'Enter ABV, volume and a count.';
      return;
    }
    var one = abv * ml / 1000;
    var total = one * n;
    var week = 14;
    var pct = week ? (total / week) * 100 : 0;
    $('ualc-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Units each', one.toFixed(2)) +
      cell('This sitting', total.toFixed(2) + ' units') +
      cell('Share of 14-unit week', pct.toFixed(0) + '%') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">A 175 ml glass of 12% wine is 2.1 units; a 25 ml single of 40% spirit is 1 unit. Spreading drinks and having drink-free days is the NHS advice — this page does not assess your health.</p>';
  }
  ['ualc-abv', 'ualc-ml', 'ualc-n'].forEach(function (id) {
    $(id).addEventListener('input', run);
  });
  run();
})();
</script>
