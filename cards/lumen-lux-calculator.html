<h2 id="lmlx-title" style="margin-top:0;color:var(--accent);">💡 Lumens ⇄ Lux</h2>

<form aria-describedby="lmlx-desc" onsubmit="event.preventDefault();">
  <p id="lmlx-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Lux = lumens ÷ area (m²) when light is spread evenly. A 800 lm bulb over a 10 m² desk is 80 lux — offices often want 300–500 lux. Beam angle and bounce are ignored.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="lmlx-lm" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Lumens (lm)</label>
      <input id="lmlx-lm" type="number" min="0" step="any" value="800" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="lmlx-m2" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Area (m²)</label>
      <input id="lmlx-m2" type="number" min="0.01" step="any" value="10" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="lmlx-cd" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Candela (optional)</label>
      <input id="lmlx-cd" type="number" min="0" step="any" value="" placeholder="leave blank" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="lmlx-d" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Distance (m)</label>
      <input id="lmlx-d" type="number" min="0.1" step="any" value="1" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="lmlx-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var lm = Number($('lmlx-lm').value), a = Number($('lmlx-m2').value);
    var cd = Number($('lmlx-cd').value), d = Number($('lmlx-d').value);
    if (!(lm >= 0 && a > 0)) return;
    var lux = lm / a;
    var inv = (cd > 0 && d > 0) ? cd / (d * d) : null;
    var note = lux < 100 ? 'dim / accent' : lux < 300 ? 'home living' : lux < 500 ? 'office desk' : lux < 1000 ? 'detailed work' : 'very bright / retail';
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('lmlx-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Illuminance', lux.toFixed(0) + ' lux  (' + note + ')') +
      cell('Foot-candles', (lux / 10.764).toFixed(1) + ' fc') +
      (inv != null ? cell('Inverse-square at ' + d + ' m', inv.toFixed(0) + ' lux') : '') +
      cell('lm needed for 500 lux', Math.round(500 * a) + ' lm') +
      '</div>';
  }
  ['lmlx-lm', 'lmlx-m2', 'lmlx-cd', 'lmlx-d'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
