<!-- cards/awkward-silence-filler.html -->
<h2 id="awksil-title" style="margin-top:0;color:var(--accent);">🗣️ Awkward Silence Filler</h2>

<form aria-describedby="awksil-desc" onsubmit="event.preventDefault();">
  <p id="awksil-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    The silence is deafening. Someone needs to say something. Let us help. (Results may make it worse.)
  </p>

  <div style="margin-bottom:16px;">
    <label style="display:block;margin-bottom:6px;color:var(--accent);font-weight:600;">How awkward is the silence?</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button type="button" onclick="awksilSetLevel(1)" id="awksil-l1" style="padding:8px 14px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:rgba(45,212,255,0.2);color:var(--accent);cursor:pointer;font-size:0.85rem;">😐 Mild</button>
      <button type="button" onclick="awksilSetLevel(2)" id="awksil-l2" style="padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:inherit;cursor:pointer;font-size:0.85rem;">😬 Medium</button>
      <button type="button" onclick="awksilSetLevel(3)" id="awksil-l3" style="padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:inherit;cursor:pointer;font-size:0.85rem;">💀 Critical</button>
    </div>
  </div>

  <div style="margin-bottom:16px;">
    <label style="display:block;margin-bottom:6px;color:var(--accent);font-weight:600;">Who are you with?</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button type="button" onclick="awksilSetWho('colleague')" id="awksil-w-colleague" style="padding:8px 14px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:rgba(45,212,255,0.2);color:var(--accent);cursor:pointer;font-size:0.85rem;">👔 Colleague</button>
      <button type="button" onclick="awksilSetWho('date')" id="awksil-w-date" style="padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:inherit;cursor:pointer;font-size:0.85rem;">💕 Date</button>
      <button type="button" onclick="awksilSetWho('family')" id="awksil-w-family" style="padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:inherit;cursor:pointer;font-size:0.85rem;">👨‍👩‍👧 Family</button>
      <button type="button" onclick="awksilSetWho('stranger')" id="awksil-w-stranger" style="padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:inherit;cursor:pointer;font-size:0.85rem;">🤷 Stranger</button>
    </div>
  </div>

  <button type="button" onclick="awksilGenerate()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🎲 Break The Silence
  </button>

  <div id="awksil-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);margin-bottom:12px;">
    <div id="awksil-phrase" style="font-size:1.1rem;color:var(--text);line-height:1.5;margin-bottom:10px;text-align:center;"></div>
    <div id="awksil-warning" style="font-size:0.8rem;color:var(--text-secondary);text-align:center;"></div>
  </div>

  <div id="awksil-counter" style="text-align:center;font-size:0.8rem;color:var(--text-secondary);"></div>
</form>

<script>
(function(){
  var awksilLevel = 1;
  var awksilWho = 'colleague';
  var awksilCount = 0;

  window.awksilSetLevel = function(l) {
    awksilLevel = l;
    for (var i = 1; i <= 3; i++) {
      var btn = document.getElementById('awksil-l' + i);
      if (i === l) { btn.style.background='rgba(45,212,255,0.2)'; btn.style.borderColor='rgba(45,212,255,0.3)'; btn.style.color='var(--accent)'; }
      else { btn.style.background='rgba(255,255,255,0.03)'; btn.style.borderColor='rgba(255,255,255,0.1)'; btn.style.color='inherit'; }
    }
  };

  window.awksilSetWho = function(w) {
    awksilWho = w;
    var btns = ['colleague','date','family','stranger'];
    for (var i = 0; i < btns.length; i++) {
      var btn = document.getElementById('awksil-w-' + btns[i]);
      if (btns[i] === w) { btn.style.background='rgba(45,212,255,0.2)'; btn.style.borderColor='rgba(45,212,255,0.3)'; btn.style.color='var(--accent)'; }
      else { btn.style.background='rgba(255,255,255,0.03)'; btn.style.borderColor='rgba(255,255,255,0.1)'; btn.style.color='inherit'; }
    }
  };

  var awksilPhrases = {
    colleague: {
      1: ['So... how about that quarterly report?','Did you see the email about the thing?','Nice weather we\'re having. Inside. In this office.','How about that local sports team?','So, any holidays planned?'],
      2: ['Do you think pigeons have feelings?','If you were a sandwich, what sandwich would you be?','Have you ever wondered if our office plants judge us?','What\'s the deal with printer paper? It\'s always the wrong size.','Do you think the vending machine has a favourite customer?'],
      3: ['If this building was sinking, who would you save first? (Besides yourself.)','Do you ever think about how we\'re all just pretending to know what we\'re doing?','Quick: name three things you could buy with your salary that would confuse your ancestors.','If the office was a reality show, who\'d be voted off first?','Do you think our desks miss us on weekends?']
    },
    date: {
      1: ['So, what do you do for fun?','Have you been here before? The food looks great.','I love this song. Do you know it?','What\'s the best trip you\'ve ever been on?','Do you have any pets?'],
      2: ['If you could have dinner with anyone, living or dead, who would you NOT pick?','What\'s your most controversial food opinion?','Have you ever accidentally waved at someone who wasn\'t waving at you?','What\'s the worst gift you\'ve ever received?','If you were a ghost, who would you haunt?'],
      3: ['On a scale of 1 to 10, how much are you regretting this right now?','If we had to rob a bank together right now, what would your role be?','What\'s the weirdest thing you\'ve Googled this week?','If you had to fight one horse-sized duck or 100 duck-sized horses, which would you pick and why is it the horses?','Do you think fish know they\'re wet?']
    },
    family: {
      1: ['How\'s the garden doing?','Did you see that thing on the news?','The drive here was fine, thanks for asking.','So what\'s new?','This is nice, isn\'t it?'],
      2: ['Remember that time at the family reunion when... actually, let\'s not go there.','Who do you think is the favourite child? (It\'s me, right?)','If our family was a TV show, what would it be called?','Do you think the dog actually likes us or is just waiting for food?','What would you do if you won the lottery? Be honest.'],
      3: ['If aliens visited Earth and you had to explain our family to them, where would you start?','Which family member would survive a zombie apocalypse and why is it Aunt Linda?','Do you ever think about how every family dinner is technically a meeting with no agenda?','If our family had a theme song, what would it be?','Quick: everyone say what they\'d bring to a desert island. GO.']
    },
    stranger: {
      1: ['Waiting for something too?','This queue is something, isn\'t it?','Have you been waiting long?','Nice day, isn\'t it?','Is this the line for...?'],
      2: ['Do you think pigeons ever get imposter syndrome?','If you had to describe the colour blue to someone who\'s never seen it, how would you do it?','Do you think dogs know their own names or just tolerate us?','What do you think clouds taste like?','Have you ever thought about how weird handshakes are?'],
      3: ['If you had to fight one person in this room, who would it NOT be? (Don\'t look at me like that.)','Do you think we\'re in a simulation? Because this queue feels simulated.','What\'s the most illegal thing you\'ve done? (I won\'t tell anyone.)','If you could read one person\'s mind right now, who would you pick? (Not me. Definitely not me.)','Quick: what\'s the capital of Mongolia? No Googling.']
    }
  };

  var awksilWarnings = {
    1: '⚠️ Risk level: Low. This is a normal human interaction.',
    2: '⚠️ Risk level: Medium. You may get a confused look. Commit to it.',
    3: '⚠️ Risk level: HIGH. You may never recover socially. But at least the silence is broken.'
  };

  window.awksilGenerate = function() {
    var pool = awksilPhrases[awksilWho][awksilLevel];
    var phrase = pool[Math.floor(Math.random() * pool.length)];

    document.getElementById('awksil-phrase').textContent = '"' + phrase + '"';
    document.getElementById('awksil-warning').textContent = awksilWarnings[awksilLevel];
    document.getElementById('awksil-result').style.display = 'block';

    awksilCount++;
    document.getElementById('awksil-counter').innerHTML = '🗣️ Silences broken: <strong>' + awksilCount + '</strong>' + (awksilCount > 5 ? ' — <span style="color:#ff4d4d;">You should probably just leave.</span>' : '');
  };
})();
</script>
