<!-- cards/gravel-calculator.html -->
<h2 id="grvlcalc-title" style="margin-top:0;color:var(--accent);">🪨 Gravel & Aggregate Calculator</h2>

<form aria-describedby="grvlcalc-desc" onsubmit="event.preventDefault();">
  <p id="grvlcalc-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Calculate how much gravel, slate, chippings, or aggregate you need for driveways, paths, patios, or garden beds. Includes tonnes, bulk bags, and cost.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="grvlcalc-w" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Area Width (m)</label>
      <input id="grvlcalc-w" type="number" step="0.1" min="0.5" value="3" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="grvlcalc-l" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Area Length (m)</label>
      <input id="grvlcalc-l" type="number" step="0.1" min="0.5" value="5" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="grvlcalc-depth" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Depth</label>
      <select id="grvlcalc-depth" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="20">20 mm — light garden path</option>
        <option value="40" selected>40 mm — standard path / patio</option>
        <option value="50">50 mm — decorative border</option>
        <option value="75">75 mm — driveway (light use)</option>
        <option value="100">100 mm — driveway (regular use)</option>
        <option value="150">150 mm — heavy-duty driveway</option>
      </select>
    </div>
    <div>
      <label for="grvlcalc-type" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Aggregate Type</label>
      <select id="grvlcalc-type" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="gravel" selected>Gravel / Shingle (1.5 t/m³)</option>
        <option value="slate">Slate Chippings (1.6 t/m³)</option>
        <option value="limestone">Limestone Chippings (1.5 t/m³)</option>
        <option value="cobbles">Cobbles / Pebbles (1.7 t/m³)</option>
        <option value="mot">MOT Type 1 Sub-base (1.9 t/m³)</option>
        <option value="sand">Sharp Sand (1.7 t/m³)</option>
        <option value="ballast">Ballast (1.8 t/m³)</option>
      </select>
    </div>
  </div>

  <div style="margin-bottom:14px;">
    <label style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.85rem;cursor:pointer;">
      <input type="checkbox" id="grvlcalc-membrane" checked style="accent-color:var(--accent);"> Include weed membrane underneath
    </label>
  </div>

  <button type="button" onclick="grvlcalcCalc()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🪨 Calculate Aggregate
  </button>

  <div id="grvlcalc-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;">
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(45,212,255,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">Volume</div>
        <div id="grvlcalc-vol" style="font-size:1.3rem;color:var(--accent);font-weight:700;"></div>
      </div>
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(57,255,20,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">Weight</div>
        <div id="grvlcalc-weight" style="font-size:1.3rem;color:#39ff14;font-weight:700;"></div>
      </div>
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(255,215,0,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">Bulk Bags</div>
        <div id="grvlcalc-bags" style="font-size:1.3rem;color:#ffd700;font-weight:700;"></div>
      </div>
    </div>
    <div id="grvlcalc-breakdown" style="font-size:0.85rem;color:var(--text);line-height:1.8;margin-bottom:10px;"></div>
    <div id="grvlcalc-cost" style="font-size:1rem;color:var(--accent);font-weight:700;text-align:center;margin-bottom:8px;"></div>
    <div id="grvlcalc-tips" style="font-size:0.8rem;color:var(--text-secondary);line-height:1.6;"></div>
  </div>
</form>

<script>
(function(){
  var grvlTypes={gravel:{density:1.5,price:55,name:'Gravel / Shingle'},slate:{density:1.6,price:70,name:'Slate Chippings'},limestone:{density:1.5,price:50,name:'Limestone'},cobbles:{density:1.7,price:80,name:'Cobbles / Pebbles'},mot:{density:1.9,price:35,name:'MOT Type 1'},sand:{density:1.7,price:40,name:'Sharp Sand'},ballast:{density:1.8,price:38,name:'Ballast'}};

  window.grvlcalcCalc=function(){
    var w=parseFloat(document.getElementById('grvlcalc-w').value);
    var l=parseFloat(document.getElementById('grvlcalc-l').value);
    var depth=parseInt(document.getElementById('grvlcalc-depth').value)/1000;
    var type=document.getElementById('grvlcalc-type').value;
    var membrane=document.getElementById('grvlcalc-membrane').checked;
    var t=grvlTypes[type];
    var area=w*l;
    var vol=area*depth;
    var tonnes=vol*t.density;
    var bulkBags=Math.ceil(tonnes/0.85);
    var looseM3=Math.ceil(tonnes/1.5);
    document.getElementById('grvlcalc-vol').textContent=vol.toFixed(2)+' m³';
    document.getElementById('grvlcalc-weight').textContent=tonnes.toFixed(2)+' tonnes';
    document.getElementById('grvlcalc-bags').textContent=bulkBags+' bags';
    document.getElementById('grvlcalc-breakdown').innerHTML=
      '📐 Area: <strong>'+area.toFixed(1)+' m²</strong><br>'+
      '📏 Depth: <strong>'+(depth*1000).toFixed(0)+' mm</strong><br>'+
      '📦 Bulk bags (850kg each): <strong>'+bulkBags+'</strong><br>'+
      '🚛 Loose delivery: <strong>'+looseM3+' m³</strong> (minimum for loose delivery is usually 10m³)<br>'+
      (membrane?'✅ Weed membrane: <strong>'+Math.ceil(area*1.1)+' m²</strong> (10% overlap)':'');
    var bagCost=bulkBags*t.price;
    document.getElementById('grvlcalc-cost').innerHTML='💰 Bulk bags at £'+t.price+' each: <strong>£'+bagCost.toFixed(0)+'</strong> | Loose at ~£'+Math.round(t.price*0.6)+'/tonne: <strong>£'+Math.round(tonnes*t.price*0.6)+'</strong>';
    document.getElementById('grvlcalc-tips').innerHTML='💡 <strong>Bulk bags are cheaper</strong> than small bags for areas over 2 m². A bulk bag (850kg / ~0.6m³) covers ~15 m² at 40mm depth.<br>💡 <strong>Always use weed membrane</strong> under gravel — it prevents weeds growing through and stops gravel sinking into the soil.<br>💡 <strong>Driveways need a sub-base:</strong> Put 100mm MOT Type 1 below your decorative gravel for a stable surface.<br>💡 <strong>Gravel depth rule:</strong> Paths need 40mm, driveways 75–100mm, decorative borders 50mm.';
    document.getElementById('grvlcalc-result').style.display='block';
  };
})();
</script>
