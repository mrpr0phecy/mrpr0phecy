<h2 id="prsa-title" style="margin-top:0;color:var(--accent);">💷 Pro Rata Salary Calculator</h2>

<form aria-describedby="prsa-desc" onsubmit="event.preventDefault();">
  <p id="prsa-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Scale a full-time equivalent salary to part-time hours, or the other way. Uses working hours only — not tax, NI, or pension. UK job ads often quote FTE then “pro rata”.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="prsa-mode" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Direction</label>
      <select id="prsa-mode" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="down">FTE → actual pay</option>
        <option value="up">Actual pay → FTE</option>
      </select>
    </div>
    <div>
      <label for="prsa-pay" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Salary £ / year</label>
      <input id="prsa-pay" type="number" min="0" step="any" value="32000" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="prsa-ft" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Full-time hours / week</label>
      <input id="prsa-ft" type="number" min="0.1" step="any" value="37.5" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="prsa-pt" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Your hours / week</label>
      <input id="prsa-pt" type="number" min="0.1" step="any" value="22.5" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="prsa-weeks" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Paid weeks / year</label>
      <input id="prsa-weeks" type="number" min="1" max="52" step="any" value="52" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="prsa-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function gbp(n) {
    return '£' + n.toLocaleString('en-GB', { maximumFractionDigits: 0 });
  }
  function run() {
    var pay = Number($('prsa-pay').value), ft = Number($('prsa-ft').value), pt = Number($('prsa-pt').value), weeks = Number($('prsa-weeks').value);
    var mode = $('prsa-mode').value;
    if (!(pay >= 0) || !(ft > 0) || !(pt > 0) || !(weeks > 0)) {
      $('prsa-out').textContent = 'Enter salary and hours.';
      return;
    }
    var frac = pt / ft;
    var actual, fte;
    if (mode === 'down') { fte = pay; actual = pay * frac; }
    else { actual = pay; fte = pay / frac; }
    var hourly = actual / (pt * weeks);
    var monthly = actual / 12;
    $('prsa-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('FTE equivalent', gbp(fte)) +
      cell('Pro rata pay', gbp(actual)) +
      cell('Fraction of FTE', (frac * 100).toFixed(1) + '%') +
      cell('Rough monthly', gbp(monthly)) +
      cell('Hourly (paid weeks)', '£' + hourly.toFixed(2)) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Term-time only roles often use fewer than 52 paid weeks — drop that box to match the contract. Overtime and unsocial enhancements are extra.</p>';
  }
  ['prsa-mode', 'prsa-pay', 'prsa-ft', 'prsa-pt', 'prsa-weeks'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
