<!-- cards/decking-calculator.html -->
<h2 id="deckcalc-title" style="margin-top:0;color:var(--accent);">🪵 Decking Calculator</h2>

<form aria-describedby="deckcalc-desc" onsubmit="event.preventDefault();">
  <p id="deckcalc-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Calculate boards, joists, posts, screws, and total cost for a timber decking project. Works for softwood, hardwood, and composite decking.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="deckcalc-w" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Deck Width (m)</label>
      <input id="deckcalc-w" type="number" step="0.1" min="0.5" value="4" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="deckcalc-l" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Deck Length (m)</label>
      <input id="deckcalc-l" type="number" step="0.1" min="0.5" value="3" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="deckcalc-mat" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Decking Material</label>
      <select id="deckcalc-mat" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="treated" selected>Treated Softwood (£3–5/m)</option>
        <option value="hardwood">Hardwood / Balau (£8–15/m)</option>
        <option value="composite">Composite (£15–30/m)</option>
      </select>
    </div>
    <div>
      <label for="deckcalc-board" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Board Width</label>
      <select id="deckcalc-board" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="90">90 mm (3.5″)</option>
        <option value="120" selected>120 mm (4.7″) — standard</option>
        <option value="140">140 mm (5.5″)</option>
        <option value="145">145 mm (composite standard)</option>
      </select>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="deckcalc-gap" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Gap Between Boards</label>
      <select id="deckcalc-gap" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="3">3 mm (composite)</option>
        <option value="5" selected>5 mm (softwood — recommended)</option>
        <option value="8">8 mm (wet timber)</option>
      </select>
    </div>
    <div>
      <label for="deckcalc-height" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Deck Height (above ground)</label>
      <select id="deckcalc-height" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="low">Low (on ground, skids only)</option>
        <option value="medium" selected>Medium (15–30 cm, posts needed)</option>
        <option value="high">High (30+ cm, posts + railing)</option>
      </select>
    </div>
  </div>

  <div style="margin-bottom:14px;">
    <label for="deckcalc-angle" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Board Direction</label>
    <select id="deckcalc-angle" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="0" selected>Parallel to length (standard)</option>
      <option value="45">45° diagonal (uses ~15% more boards)</option>
    </select>
  </div>

  <button type="button" onclick="deckcalcCalc()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🪵 Calculate Decking Materials
  </button>

  <div id="deckcalc-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;">
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(45,212,255,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">Deck Boards</div>
        <div id="deckcalc-boards" style="font-size:1.3rem;color:var(--accent);font-weight:700;"></div>
      </div>
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(57,255,20,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">Joists</div>
        <div id="deckcalc-joists" style="font-size:1.3rem;color:#39ff14;font-weight:700;"></div>
      </div>
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(255,215,0,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">Posts</div>
        <div id="deckcalc-posts" style="font-size:1.3rem;color:#ffd700;font-weight:700;"></div>
      </div>
    </div>
    <div id="deckcalc-breakdown" style="font-size:0.85rem;color:var(--text);line-height:1.8;margin-bottom:10px;"></div>
    <div id="deckcalc-cost" style="font-size:1rem;color:var(--accent);font-weight:700;text-align:center;margin-bottom:8px;"></div>
    <div id="deckcalc-tips" style="font-size:0.8rem;color:var(--text-secondary);line-height:1.6;"></div>
  </div>
</form>

<script>
(function(){
  window.deckcalcCalc=function(){
    var dw=parseFloat(document.getElementById('deckcalc-w').value);
    var dl=parseFloat(document.getElementById('deckcalc-l').value);
    var mat=document.getElementById('deckcalc-mat').value;
    var boardW=parseInt(document.getElementById('deckcalc-board').value);
    var gap=parseInt(document.getElementById('deckcalc-gap').value);
    var angle=parseInt(document.getElementById('deckcalc-angle').value);
    var height=document.getElementById('deckcalc-height').value;
    var area=dw*dl;
    var effBoard=(boardW+gap)/1000;
    var numBoards=Math.ceil(dw/effBoard)+1;
    var boardLen=angle===45?Math.ceil(dl*Math.SQRT2*10)/10:dl;
    var boardM=angle===45?dl*Math.SQRT2:dl;
    var totalBoardLen=numBoards*boardM;
    var standardLen=mat==='composite'?3.6:4.8;
    var boardsPerRun=Math.ceil(boardM/standardLen);
    var totalBoards=numBoards*boardsPerRun;
    var joistSpacing=0.4;
    var numJoists=Math.ceil(dl/joistSpacing)+1;
    var joistLen=dw;
    var totalJoistLen=numJoists*joistLen;
    var numPosts=height==='low'?0:Math.ceil(numJoists/2)*Math.ceil(dw/1.8);
    var postLen=height==='high'?3:2.4;
    var screws=Math.ceil(area*18);
    var screwBoxes=Math.ceil(screws/200);
    var pricePerM=mat==='treated'?4:mat==='hardwood'?12:22;
    var joistPrice=8;
    var postPrice=12;
    document.getElementById('deckcalc-boards').textContent=totalBoards+' boards';
    document.getElementById('deckcalc-joists').textContent=numJoists+' joists';
    document.getElementById('deckcalc-posts').textContent=numPosts>0?numPosts+' posts':'No posts';
    document.getElementById('deckcalc-breakdown').innerHTML=
      '📏 Deck area: <strong>'+area.toFixed(1)+' m²</strong><br>'+
      '🪵 Boards: <strong>'+numBoards+' rows</strong> × '+boardsPerRun+' lengths ('+standardLen+'m) = <strong>'+totalBoards+' boards</strong><br>'+
      '📐 Joists: <strong>'+numJoists+' × '+joistLen.toFixed(1)+'m</strong> (400mm centres) — 100×50mm treated timber<br>'+
      (numPosts>0?'🏗️ Posts: <strong>'+numPosts+' × '+postLen+'m</strong> — 100×100mm treated posts<br>':'')+
      '🔩 Screws: ~<strong>'+screws+'</strong> ('+screwBoxes+' boxes of 200) — use 65mm stainless steel or coated deck screws';
    var boardCost=totalBoards*standardLen*pricePerM;
    var joistCost=totalJoistLen*joistPrice;
    var postCost=numPosts*postLen*postPrice;
    var screwCost=screwBoxes*12;
    var totalCost=boardCost+joistCost+postCost+screwCost;
    document.getElementById('deckcalc-cost').innerHTML='💰 Estimated total: <strong>£'+totalCost.toFixed(0)+'</strong> (boards £'+boardCost.toFixed(0)+' + joists £'+joistCost.toFixed(0)+' + posts £'+postCost.toFixed(0)+' + fixings £'+screwCost.toFixed(0)+')';
    document.getElementById('deckcalc-tips').innerHTML='💡 <strong>Leave 5mm gaps</strong> between boards for drainage and expansion. Timber swells when wet.<br>💡 <strong>Use joist tape</strong> (self-adhesive butyl strip) on top of joists — it doubles the lifespan by preventing water pooling.<br>💡 <strong>Stainless steel screws</strong> for hardwood (tannins corrode normal screws). Coated screws are fine for treated softwood.<br>💡 <strong>Planning permission:</strong> In England, decking under 30cm high and covering less than 50% of the garden doesn\'t need permission.';
    document.getElementById('deckcalc-result').style.display='block';
  };
})();
</script>
