<h2 id="shift-labour-cost-planner-title" style="margin-top:0;color:var(--accent)">🗓️ Shift Labour Cost Planner</h2>
<form id="shift-labour-cost-planner-form" aria-describedby="shift-labour-cost-planner-desc" onsubmit="event.preventDefault();">
<p id="shift-labour-cost-planner-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:.9rem">Price a staffed shift including breaks, employer on-costs and overtime before publishing the rota. All calculations stay in your browser.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px"><div><label for="shift-labour-cost-planner-staff" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Number of staff</label><input id="shift-labour-cost-planner-staff" data-key="staff" type="number" step="any" value="6" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="shift-labour-cost-planner-hours" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Paid hours each</label><input id="shift-labour-cost-planner-hours" data-key="hours" type="number" step="any" value="8" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="shift-labour-cost-planner-rate" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Hourly rate (£)</label><input id="shift-labour-cost-planner-rate" data-key="rate" type="number" step="any" value="13.5" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="shift-labour-cost-planner-oncost" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Employer on-costs (%)</label><input id="shift-labour-cost-planner-oncost" data-key="oncost" type="number" step="any" value="18" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div></div>
<button type="submit" style="margin-top:16px;padding:11px 18px;border:0;border-radius:8px;background:var(--accent);color:#001018;font-weight:700;cursor:pointer">Calculate</button>
<div id="shift-labour-cost-planner-out" aria-live="polite" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:16px"></div>
<p style="color:var(--text-secondary);font-size:.78rem;margin-top:12px">Planning estimate only. Check tax, legal and contractual assumptions for your situation.</p>
</form>
<script>
(function(){
 const form=document.getElementById('shift-labour-cost-planner-form'),out=document.getElementById('shift-labour-cost-planner-out');
 const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:2}).format(Number.isFinite(n)?n:0);
 const num=(n,d=0)=>Number.isFinite(n)?n.toLocaleString('en-GB',{maximumFractionDigits:d}):'—'; const pct=n=>num(n,1)+'%';
 const dateMonths=n=>{const d=new Date();d.setDate(d.getDate()+Math.max(0,n)*30.44);return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'})};
 function calculate(){const v={};form.querySelectorAll('[data-key]').forEach(x=>v[x.dataset.key]=Number(x.value)); if(Object.values(v).some(x=>!Number.isFinite(x))){out.textContent='Enter valid numbers in every field.';return} const rows=(()=>{const wages=v.staff*v.hours*v.rate,total=wages*(1+v.oncost/100); return [['Total staff hours',num(v.staff*v.hours,1)],['Base wages',money(wages)],['Employer on-costs',money(total-wages)],['Fully loaded shift cost',money(total)]];})();out.innerHTML='';rows.forEach(r=>{const box=document.createElement('div');box.style.cssText='padding:14px;border:1px solid var(--border-light);border-radius:9px;background:rgba(45,212,255,.06)';const a=document.createElement('div'),b=document.createElement('strong');a.style.cssText='color:var(--text-secondary);font-size:.8rem';b.style.cssText='display:block;color:var(--accent);font-size:1.15rem;margin-top:5px';a.textContent=r[0];b.textContent=r[1];box.append(a,b);out.append(box)})}
 form.addEventListener('submit',calculate);form.addEventListener('input',calculate);calculate();
})();
</script>
