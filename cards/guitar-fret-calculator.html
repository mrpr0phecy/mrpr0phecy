<h2 id="gfrt-title" style="margin-top:0;color:var(--accent);">🎸 Guitar Fret Position Calculator</h2>

<form aria-describedby="gfrt-desc" onsubmit="event.preventDefault();">
  <p id="gfrt-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Equal-temperament fret rule: distance from nut to fret n = L × (1 − 1/2^(n/12)) where L is scale length. 12th fret is the octave (halfway). Not a CNC file.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="gfrt-l" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Scale length mm</label>
      <input id="gfrt-l" type="number" min="100" step="any" value="648" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="gfrt-n" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Frets</label>
      <input id="gfrt-n" type="number" min="12" max="27" step="1" value="22" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
  <div id="gfrt-presets" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"></div>
</form>
<div id="gfrt-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  [['Fender 25.5″', 647.7], ['Gibson 24.75″', 628.65], ['PRS 25″', 635], ['Bass 34″', 863.6]].forEach(function (p) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = p[0];
    b.style.cssText = 'padding:7px 10px;border-radius:999px;border:1px solid rgba(45,212,255,.35);background:rgba(45,212,255,.08);color:var(--accent);font-size:.75rem;font-weight:700;cursor:pointer;min-height:36px;';
    b.addEventListener('click', function () { $('gfrt-l').value = p[1]; run(); });
    $('gfrt-presets').appendChild(b);
  });
  function run() {
    var L = Number($('gfrt-l').value), n = Number($('gfrt-n').value);
    if (!(L > 0) || !(n >= 1)) {
      $('gfrt-out').textContent = 'Enter scale length and fret count.';
      return;
    }
    var rows = '';
    var prev = 0;
    for (var i = 1; i <= n; i++) {
      var pos = L * (1 - Math.pow(2, -i / 12));
      var space = pos - prev;
      rows += '<tr><td style="padding:3px 8px;">' + i + '</td><td style="padding:3px 8px;">' + pos.toFixed(2) + '</td><td style="padding:3px 8px;">' + (pos / 25.4).toFixed(3) + '</td><td style="padding:3px 8px;">' + space.toFixed(2) + '</td></tr>';
      prev = pos;
    }
    $('gfrt-out').innerHTML = '<p style="font-size:.8rem;color:var(--text-secondary);margin:0 0 8px;">Nut at 0. 12th fret at ' + (L / 2).toFixed(2) + ' mm. Bridge compensation is extra.</p>' +
      '<table style="width:100%;border-collapse:collapse;font-size:.8rem;"><thead><tr><th style="text-align:left;padding:3px 8px;">Fret</th><th style="text-align:left;padding:3px 8px;">From nut mm</th><th style="text-align:left;padding:3px 8px;">inches</th><th style="text-align:left;padding:3px 8px;">Spacing mm</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }
  $('gfrt-l').addEventListener('input', run);
  $('gfrt-n').addEventListener('input', run);
  run();
})();
</script>
