<h2 id="unit-converter-title" style="margin-top:0;color:var(--accent);">🔬 Scientific &amp; Everyday Unit Converter</h2>

<form aria-describedby="uc-desc" onsubmit="event.preventDefault();">
  <p id="uc-desc" class="small" style="color:rgba(230,250,255,0.7);margin-bottom:16px;">
    Convert between common scientific and everyday units — length, mass, temperature, energy and pressure. Runs entirely in your browser.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
    <div>
      <label for="uc-category" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">📊 Category</label>
      <select id="uc-category" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;">
        <option value="length" selected>Length</option>
        <option value="mass">Mass</option>
        <option value="temperature">Temperature</option>
        <option value="energy">Energy</option>
        <option value="pressure">Pressure</option>
      </select>
    </div>
    <div>
      <label for="uc-value" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">🔢 Value</label>
      <input id="uc-value" type="number" step="any" value="100"
             style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(57,255,20,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    </div>
    <div>
      <label for="uc-from" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">From</label>
      <select id="uc-from" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,165,0,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;"></select>
    </div>
    <div>
      <label for="uc-to" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">To</label>
      <select id="uc-to" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,64,129,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;"></select>
    </div>
  </div>

  <div style="display:flex;gap:8px;">
    <button type="button" id="uc-go"
            style="padding:12px 24px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:600;">Convert</button>
    <button type="button" id="uc-reset"
            style="padding:12px 24px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(230,250,255,0.7);cursor:pointer;">Reset</button>
  </div>
</form>

<div class="results" aria-live="polite" style="background:rgba(0,0,0,0.3);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,0.05);margin-top:16px;">
  <div style="text-align:center;">
    <div style="font-size:0.8rem;color:rgba(230,250,255,0.5);margin-bottom:4px;">Converted Value</div>
    <div id="uc-res" style="font-size:1.8rem;font-weight:700;color:var(--accent);">–</div>
    <div id="uc-detail" style="font-size:0.85rem;color:rgba(230,250,255,0.4);margin-top:4px;"></div>
  </div>
</div>

<script>
(function(){
  var card = document.currentScript.parentNode;
  var $ = function(id){ return card.querySelector('#'+id); };
  var catEl=$('uc-category'), valEl=$('uc-value'), fromEl=$('uc-from'), toEl=$('uc-to'),
      resEl=$('uc-res'), detEl=$('uc-detail');

  // Linear units: factor to SI base (metre / gram / joule / pascal).
  var UNITS = {
    length:      { base:'m',  units:{ mm:0.001, cm:0.01, m:1, km:1000, 'in':0.0254, ft:0.3048, yd:0.9144, mi:1609.344, nmi:1852 } },
    mass:        { base:'g',  units:{ mg:0.001, g:1, kg:1000, t:1000000, oz:28.349523125, lb:453.59237 } },
    energy:      { base:'J',  units:{ J:1, kJ:1000, cal:4.184, kcal:4184, Wh:3600 } },
    pressure:    { base:'Pa', units:{ Pa:1, kPa:1000, bar:100000, atm:101325, psi:6894.757293168, mmHg:133.322387415 } }
  };
  var TEMPS = { '°C':1, '°F':1, K:1 };
  var fmt = function(n, d){ return n.toLocaleString('en-GB', { maximumFractionDigits: d == null ? 6 : d }); };

  function unitsFor(cat){
    return cat === 'temperature' ? Object.keys(TEMPS) : Object.keys(UNITS[cat].units);
  }
  function fillUnits(){
    var cat = catEl.value, list = unitsFor(cat);
    var oldFrom = fromEl.value, oldTo = toEl.value;
    fromEl.innerHTML = list.map(function(u){ return '<option value="'+u+'">'+u+'</option>'; }).join('');
    toEl.innerHTML   = list.map(function(u){ return '<option value="'+u+'">'+u+'</option>'; }).join('');
    if (list.indexOf(oldFrom) >= 0) fromEl.value = oldFrom;
    if (list.indexOf(oldTo)   >= 0) toEl.value   = oldTo;
    else if (list.length > 1) toEl.selectedIndex = 1;
  }
  function convert(){
    var cat = catEl.value, v = parseFloat(valEl.value) || 0, from = fromEl.value, to = toEl.value;
    var r;
    if (cat === 'temperature') {
      var kel = from === '°C' ? v + 273.15 : from === '°F' ? (v - 32) * 5 / 9 + 273.15 : v;
      r = to === '°C' ? kel - 273.15 : to === '°F' ? (kel - 273.15) * 9 / 5 + 32 : kel;
    } else {
      var u = UNITS[cat].units;
      r = v * (u[from] / u[to]);
    }
    resEl.textContent = fmt(r);
    resEl.style.color = 'var(--accent)';
    detEl.textContent = from === to ? 'Same unit' : (fmt(v) + ' ' + from + ' = ' + fmt(r) + ' ' + to);
  }

  catEl.addEventListener('change', function(){ fillUnits(); convert(); });
  valEl.addEventListener('input', convert);
  fromEl.addEventListener('change', convert);
  toEl.addEventListener('change', convert);
  $('uc-go').addEventListener('click', convert);
  $('uc-reset').addEventListener('click', function(){
    catEl.value = 'length'; valEl.value = '100'; fillUnits();
    resEl.textContent = '–'; detEl.textContent = '';
  });

  fillUnits();
})();
</script>
