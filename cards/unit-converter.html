<h2 id="unit-converter-title" style="margin-top:0;color:var(--accent);">📐 Unit Converter</h2>

<div class="uc-container" style="font-family:inherit;color:var(--text);">
  <p class="small" style="color:rgba(230,250,255,0.7);margin-bottom:16px;">
    Convert between common scientific units — length, mass, temperature, and energy.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
    <div>
      <label for="uc-category" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">📊 Category</label>
      <select id="uc-category" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;">
        <option value="length" selected>Length</option>
        <option value="mass">Mass</option>
        <option value="temperature">Temperature</option>
        <option value="energy">Energy</option>
      </select>
    </div>
    <div>
      <label for="uc-value" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">🔢 Value</label>
      <input id="uc-value" type="number" step="any" value="100"
             style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(57,255,20,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    </div>
    <div>
      <label for="uc-from" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">From</label>
      <select id="uc-from" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,165,0,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;">
        <option value="cm" selected>cm</option><option value="m">m</option><option value="km">km</option><option value="mm">mm</option>
        <option value="g">g</option><option value="kg">kg</option><option value="mg">mg</option>
        <option value="c">°C</option><option value="f">°F</option><option value="k">K</option>
        <option value="j">J</option><option value="kj">kJ</option><option value="cal">cal</option>
      </select>
    </div>
    <div>
      <label for="uc-to" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">To</label>
      <select id="uc-to" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,64,129,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;">
        <option value="m">m</option><option value="cm" selected>cm</option><option value="km">km</option><option value="mm">mm</option>
        <option value="g">g</option><option value="kg">kg</option><option value="mg">mg</option>
        <option value="c">°C</option><option value="f">°F</option><option value="k">K</option>
        <option value="j">J</option><option value="kj">kJ</option><option value="cal">cal</option>
      </select>
    </div>
  </div>

  <div style="display:flex;gap:8px;">
    <button type="button" onclick="(function(b){var c=b.closest('.uc-container');var v=parseFloat(c.querySelector('#uc-value').value)||0;var from=c.querySelector('#uc-from').value;var to=c.querySelector('#uc-to').value;var len={mm:0.001,cm:0.01,m:1,km:1000};var mass={mg:0.001,g:1,kg:1000};var energy={j:1,kj:1000,cal:4.184};var isLen=function(u){return u in len;};var isMass=function(u){return u in mass;};var isEnergy=function(u){return u in energy;};var isTemp=function(u){return u==='c'||u==='f'||u==='k';};var res=c.querySelector('#uc-res');var det=c.querySelector('#uc-detail');if(from===to){res.textContent=v.toLocaleString('en-GB',{maximumFractionDigits:4});det.textContent='Same unit';res.style.color='var(--accent)';}else if(isLen(from)&&isLen(to)){var r=v*(len[from]/len[to]);res.textContent=r.toLocaleString('en-GB',{maximumFractionDigits:6});det.textContent=v+' '+from+' = '+r.toLocaleString('en-GB',{maximumFractionDigits:6})+' '+to;res.style.color='var(--accent)';}else if(isMass(from)&&isMass(to)){var r=v*(mass[from]/mass[to]);res.textContent=r.toLocaleString('en-GB',{maximumFractionDigits:6});det.textContent=v+' '+from+' = '+r.toLocaleString('en-GB',{maximumFractionDigits:6})+' '+to;res.style.color='var(--accent)';}else if(isEnergy(from)&&isEnergy(to)){var r=v*(energy[from]/energy[to]);res.textContent=r.toLocaleString('en-GB',{maximumFractionDigits:6});det.textContent=v+' '+from+' = '+r.toLocaleString('en-GB',{maximumFractionDigits:6})+' '+to;res.style.color='var(--accent)';}else if(isTemp(from)&&isTemp(to)){var kel=0;if(from==='c')kel=v+273.15;else if(from==='f')kel=(v-32)*5/9+273.15;else kel=v;var r=0;if(to==='c')r=kel-273.15;else if(to==='f')r=(kel-273.15)*9/5+32;else r=kel;res.textContent=r.toLocaleString('en-GB',{maximumFractionDigits:4});det.textContent=v+' '+from+' = '+r.toLocaleString('en-GB',{maximumFractionDigits:4})+' '+to;res.style.color='var(--accent)';}else{res.textContent='⚠ Incompatible';det.textContent='Cannot convert between different unit types';res.style.color='#ffa500';}})(this)"
            style="padding:12px 24px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:600;">Convert</button>
    <button type="button" onclick="(function(b){var c=b.closest('.uc-container');c.querySelector('#uc-value').value='100';c.querySelector('#uc-from').value='cm';c.querySelector('#uc-to').value='m';c.querySelector('#uc-res').textContent='–';c.querySelector('#uc-detail').textContent='';})(this)"
            style="padding:12px 24px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(230,250,255,0.7);cursor:pointer;">Reset</button>
  </div>
</div>

<div class="results" aria-live="polite" style="background:rgba(0,0,0,0.3);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,0.05);margin-top:16px;">
  <div style="text-align:center;">
    <div style="font-size:0.8rem;color:rgba(230,250,255,0.5);margin-bottom:4px;">Converted Value</div>
    <div id="uc-res" style="font-size:1.8rem;font-weight:700;color:var(--accent);">–</div>
    <div id="uc-detail" style="font-size:0.85rem;color:rgba(230,250,255,0.4);margin-top:4px;"></div>
  </div>
</div>
