<h2 id="dcf-title" style="margin-top:0;color:var(--accent);">✨ Curiosity Fact Deck</h2>
<p id="dcf-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;">48 verified fascinating facts across space, nature, history, the body, Earth and technology — with a fact of the day, favourites and a quiz mode that turns trivia into knowledge.</p>

<div id="dcf-daily" style="margin-bottom:12px;padding:12px 14px;background:linear-gradient(135deg,rgba(255,215,0,.1),rgba(255,215,0,.03));border:1px solid rgba(255,215,0,.35);border-radius:10px;font-size:.88rem;"></div>

<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center;">
  <select id="dcf-cat" aria-label="Category filter" style="padding:9px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    <option value="all">🌈 All categories</option>
    <option value="Space">🚀 Space</option>
    <option value="Nature">🦎 Nature</option>
    <option value="History">🏺 History</option>
    <option value="Body">🧠 Human body</option>
    <option value="Earth">🌋 Earth</option>
    <option value="Tech">💡 Technology</option>
  </select>
  <button type="button" id="dcf-next" style="padding:9px 18px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-weight:800;">🎲 New fact</button>
  <button type="button" id="dcf-fav" style="padding:9px 14px;background:rgba(255,255,255,.07);color:var(--text);border:1px solid rgba(255,255,255,.18);border-radius:8px;cursor:pointer;font-weight:700;">♡ Save</button>
  <button type="button" id="dcf-showfav" style="padding:9px 14px;background:rgba(255,255,255,.07);color:var(--text);border:1px solid rgba(255,255,255,.18);border-radius:8px;cursor:pointer;font-weight:700;">★ Saved (<span id="dcf-favcount">0</span>)</button>
  <button type="button" id="dcf-quiz" style="padding:9px 14px;background:rgba(57,255,20,.12);color:#7dff6a;border:1px solid rgba(57,255,20,.4);border-radius:8px;cursor:pointer;font-weight:800;">🧠 Quiz me</button>
</div>

<div id="dcf-card" style="background:#071019;border:1px solid rgba(45,212,255,.3);border-radius:12px;padding:22px;min-height:150px;"></div>
<div id="dcf-list" style="display:none;margin-top:10px;"></div>

<script>
(function(){
  function $(id){ return document.getElementById(id); }
  var EMOJI = { Space: "🚀", Nature: "🦎", History: "🏺", Body: "🧠", Earth: "🌋", Tech: "💡" };
  var F = [
    ["Space","Neutron stars spin up to 600 times per second — a city-sized ball with more mass than the Sun.","They are the densest known objects: a teaspoon would weigh about a billion tonnes."],
    ["Space","A day on Venus is longer than its year — it spins so slowly that it orbits the Sun first.","Venus also spins backwards compared to most planets, likely from an ancient collision."],
    ["Space","Saturn would float in water — it is the only planet less dense than water.","Its average density is about 0.69 g/cm³, thanks to being mostly hydrogen and helium."],
    ["Space","Light from the Sun takes 8 minutes 20 seconds to reach Earth.","When you look at the Sun, you see it as it was over 8 minutes ago."],
    ["Space","There are more stars in the universe than grains of sand on all Earth's beaches.","Estimates run to about 200 sextillion stars — 200,000,000,000,000,000,000,000."],
    ["Space","Footprints on the Moon will last millions of years.","With no wind or water, there is almost nothing to erase them."],
    ["Space","Jupiter's Great Red Spot is a storm wider than planet Earth.","It has been raging for at least 190 years — possibly over 300."],
    ["Space","You could fit every other planet between Earth and the Moon.","The average distance is about 384,400 km — room to spare, with the planets lined up."],
    ["Nature","Octopuses have three hearts — and two stop beating when they swim.","That is why octopuses prefer crawling: swimming literally exhausts their hearts."],
    ["Nature","Honeybees dance to give directions — the waggle dance points to flowers.","The angle of the dance matches the angle from the Sun; duration signals distance."],
    ["Nature","Tardigrades have survived the vacuum of space.","These 1 mm 'water bears' endure radiation, freezing and boiling by shutting down."],
    ["Nature","A group of flamingos is called a flamboyance.","Flamingos are pink because of the algae and shrimp they eat."],
    ["Nature","Sharks existed before trees — by about 50 million years.","Sharks are around 450 million years old; the first trees about 390 million."],
    ["Nature","Cows have best friends and get stressed when separated.","Studies show cows paired with friends produce measurably more milk."],
    ["Nature","The mantis shrimp punches with the force of a bullet.","Its club moves so fast it boils the water around it — a phenomenon called cavitation."],
    ["Nature","Bananas are berries, but strawberries are not.","Botanically, a berry has seeds inside its flesh — strawberry 'seeds' sit outside."],
    ["History","Oxford University is older than the Aztec Empire.","Teaching began at Oxford by 1096; the Aztec capital was founded around 1325."],
    ["History","Cleopatra lived closer in time to the Moon landing than to the pyramids' construction.","The pyramids were already 2,500 years old when she was born."],
    ["History","The first computer programmer was a woman in the 1840s.","Ada Lovelace wrote an algorithm for Babbage's Analytical Engine — a century before computers."],
    ["History","Woolly mammoths were still alive while the pyramids were being built.","A small population survived on Wrangel Island until about 1700 BC."],
    ["History","The Eiffel Tower grows about 15 cm taller in summer.","Iron expands in heat — the tower also leans slightly away from the Sun."],
    ["History","Ancient Romans used urine as mouthwash.","Ammonia cleans and whitens — urine was even taxed and traded for laundry."],
    ["History","The Great Fire of London destroyed 80% of the city — yet recorded only 6 deaths.","The verified death toll is astonishingly low, though exact records are debated."],
    ["History","Paper money is over 1,000 years old.","China's Song dynasty issued the first true banknotes around the year 1000."],
    ["Body","Your brain runs on about 20 watts — a dim light bulb's worth of power.","Despite that, it holds roughly 86 billion neurons making trillions of connections."],
    ["Body","Bones are stronger than concrete ounce for ounce.","The femur can support about 30 times an adult's body weight."],
    ["Body","Your nose can detect about a trillion different scents.","Far more than the old '10,000 smells' myth suggested."],
    ["Body","You spend about 6 months of your life waiting for red lights.","Time-use studies turn everyday waiting into surprisingly large lifetime totals."],
    ["Body","Goosebumps are leftovers from when we had thick fur.","The reflex once fluffed fur to look bigger — now it just ripples skin."],
    ["Body","Your stomach gets a new lining every few days.","Otherwise it would digest itself with its own acid."],
    ["Body","Humans and giraffes have the same number of neck vertebrae: seven.","Nearly all mammals share this count — necks just stretch the bones."],
    ["Body","You can't hum while holding your nose closed.","Try it: humming needs air escaping through the nose."],
    ["Earth","Antarctica is the largest desert in the world.","Deserts are defined by dryness, not heat — Antarctica gets under 200 mm of rain a year."],
    ["Earth","Lightning strikes Earth about 100 times every second.","That is roughly 8 million strikes per day worldwide."],
    ["Earth","The Dead Sea is so salty you float without trying.","At about 34% salinity, it is nearly 10 times saltier than the ocean."],
    ["Earth","Russia has a larger surface area than Pluto.","Russia spans about 17 million km²; Pluto's surface is about 16.6 million km²."],
    ["Earth","The Sahara was green savannah just 6,000 years ago.","Rock art shows hippos and giraffes where desert now stretches."],
    ["Earth","There is a lake in Antarctica buried under 4 km of ice.","Lake Vostok has been sealed off for millions of years — a possible alien-like habitat."],
    ["Earth","Mount Everest grows about 4 mm taller every year.","India's tectonic plate keeps pushing into Asia."],
    ["Earth","One teaspoon of soil holds more microbes than there are people on Earth.","Healthy soil contains billions of organisms in a single gram."],
    ["Tech","The first computer bug was a real moth, found in 1947.","It was taped into a Harvard logbook — the term 'bug' stuck forever."],
    ["Tech","More computing power sits in a greeting card than guided Apollo 11.","The Apollo Guidance Computer ran at about 0.04 MHz with 4 KB of RAM."],
    ["Tech","The QWERTY layout was designed to slow typists down.","Early typewriters jammed if keys were struck too fast in sequence."],
    ["Tech","About 90% of the world's data was created in just the last few years.","Humanity now produces roughly 120 zettabytes of data per year."],
    ["Tech","The first webcam watched a coffee pot.","Cambridge researchers pointed it at the office kettle in 1991 to avoid wasted trips."],
    ["Tech","Email is older than the World Wide Web by decades.","The first network email was sent in 1971; the web arrived around 1991."],
    ["Tech","A single Google search uses more computing than Apollo 11's entire mission.","Modern data centres perform trillions of operations per query."],
    ["Tech","The Nokia 3310 could last a week on one charge.","Its legendary battery reflected a simpler era: tiny screen, no apps, no 5G."]
  ];
  var cur = -1, favs = [];
  try { favs = JSON.parse(localStorage.getItem("dcf-favs") || "[]"); } catch (e) { favs = []; }
  function paintFavCount(){ $("dcf-favcount").textContent = favs.length; }
  paintFavCount();
  function dayIndex(){ var d = new Date(); return (d.getFullYear() * 372 + (d.getMonth() + 1) * 31 + d.getDate()) % F.length; }
  (function(){
    var f = F[dayIndex()];
    $("dcf-daily").innerHTML = "<b>📅 Fact of the day " + EMOJI[f[0]] + " (" + f[0] + "):</b> " + f[1];
  })();
  function pool(){
    var c = $("dcf-cat").value;
    var idx = [];
    F.forEach(function(f, i){ if (c === "all" || f[0] === c) idx.push(i); });
    return idx;
  }
  function show(i){
    cur = i; var f = F[i];
    $("dcf-list").style.display = "none"; $("dcf-card").style.display = "block";
    var saved = favs.indexOf(i) !== -1;
    $("dcf-card").innerHTML = "<div style='font-size:.75rem;color:var(--text-secondary);letter-spacing:.1em;margin-bottom:8px;'>" + EMOJI[f[0]] + " " + f[0].toUpperCase() + " · FACT " + (i + 1) + "/48</div>"
      + "<div style='font-size:1.15rem;font-weight:700;line-height:1.5;margin-bottom:10px;'>" + f[1] + "</div>"
      + "<div style='font-size:.88rem;color:var(--text-secondary);border-left:3px solid var(--accent);padding-left:10px;'>💡 Why it matters: " + f[2] + "</div>";
    $("dcf-fav").textContent = saved ? "♥ Saved" : "♡ Save";
  }
  $("dcf-next").addEventListener("click", function(){
    var p = pool(), n = p[Math.floor(Math.random() * p.length)];
    if (p.length > 1 && n === cur) n = p[(p.indexOf(n) + 1) % p.length];
    show(n);
  });
  $("dcf-cat").addEventListener("change", function(){
    var p = pool(); show(p[Math.floor(Math.random() * p.length)]);
  });
  $("dcf-fav").addEventListener("click", function(){
    if (cur < 0) return;
    var at = favs.indexOf(cur);
    if (at === -1) favs.push(cur); else favs.splice(at, 1);
    try { localStorage.setItem("dcf-favs", JSON.stringify(favs)); } catch (e) {}
    paintFavCount(); show(cur);
  });
  $("dcf-showfav").addEventListener("click", function(){
    var L = $("dcf-list");
    if (!favs.length) { L.style.display = "block"; L.innerHTML = "<div style='font-size:.85rem;color:var(--text-secondary);'>No saved facts yet — tap ♡ Save on any fact you love.</div>"; return; }
    L.style.display = "block"; $("dcf-card").style.display = "none";
    L.innerHTML = "<b>★ Your saved facts (" + favs.length + ")</b>" + favs.map(function(i){
      var f = F[i];
      return "<div data-dcf-open='" + i + "' style='cursor:pointer;margin-top:8px;padding:10px 12px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:.85rem;'><b>" + EMOJI[f[0]] + "</b> " + f[1] + "</div>";
    }).join("");
    L.querySelectorAll("[data-dcf-open]").forEach(function(el){
      el.addEventListener("click", function(){ show(+el.getAttribute("data-dcf-open")); });
    });
  });
  $("dcf-quiz").addEventListener("click", function(){
    var order = F.map(function(_, i){ return i; });
    for (var i = order.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = order[i]; order[i] = order[j]; order[j] = t; }
    order = order.slice(0, 10);
    var qn = 0, score = 0, box = $("dcf-card"), L = $("dcf-list");
    L.style.display = "none"; box.style.display = "block";
    var cats = ["Space", "Nature", "History", "Body", "Earth", "Tech"];
    (function ask(){
      var f = F[order[qn]];
      box.innerHTML = "<div style='font-size:.78rem;color:var(--text-secondary);margin-bottom:8px;'>QUIZ " + (qn + 1) + "/10 · score <b style='color:var(--accent);'>" + score + "</b></div>"
        + "<div style='font-weight:700;margin-bottom:12px;'>Which category does this fact belong to?</div>"
        + "<div style='font-size:.95rem;background:rgba(0,0,0,.25);border-radius:8px;padding:12px;margin-bottom:12px;'>“" + f[1] + "”</div>"
        + "<div id='dcf-qopts' style='display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;'></div>";
      var ob = document.getElementById("dcf-qopts");
      cats.forEach(function(c){
        var b = document.createElement("button");
        b.type = "button"; b.textContent = EMOJI[c] + " " + c;
        b.style.cssText = "padding:10px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.18);border-radius:8px;cursor:pointer;font-weight:700;";
        b.addEventListener("click", function(){
          if (ob.dataset.done) return; ob.dataset.done = "1";
          var btns = ob.querySelectorAll("button");
          for (var k = 0; k < btns.length; k++) if (btns[k].textContent.indexOf(f[0]) !== -1) btns[k].style.cssText += "background:rgba(57,255,20,.15);border-color:#39ff14;color:#7dff6a;";
          if (c === f[0]) score++; else b.style.cssText += "background:rgba(255,77,77,.15);border-color:#ff4d4d;";
          setTimeout(function(){
            qn++;
            if (qn < 10) ask();
            else box.innerHTML = "<div style='text-align:center;padding:10px;'><div style='font-size:2.2rem;'>" + (score >= 8 ? "🏆" : score >= 5 ? "🎉" : "📖") + "</div><b>You scored " + score + "/10</b><div style='font-size:.85rem;color:var(--text-secondary);margin:6px 0 12px;'>" + (score >= 8 ? "Certified curiosity champion!" : score >= 5 ? "Nicely curious — keep exploring!" : "Browse the deck and try again!") + "</div><button type='button' id='dcf-qagain' style='padding:9px 20px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-weight:800;'>↻ Quiz again</button></div>";
            var ag = document.getElementById("dcf-qagain");
            if (ag) ag.addEventListener("click", function(){ $("dcf-quiz").click(); });
          }, 900);
        });
        ob.appendChild(b);
      });
    })();
  });
  show(dayIndex());
})();
</script>
