<h2 id="ftic-title" style="margin-top:0;color:var(--accent);">📏 Feet &amp; Inches ⇄ cm</h2>

<form aria-describedby="ftic-desc" onsubmit="event.preventDefault();">
  <p id="ftic-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Convert height between feet+inches, centimetres and metres. Uses the international inch (exactly 25.4 mm). Edit any box — the others update.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="ftic-ft" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Feet</label>
      <input id="ftic-ft" type="number" min="0" step="1" value="5" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ftic-in" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Inches</label>
      <input id="ftic-in" type="number" min="0" max="36" step="any" value="10" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ftic-cm" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Centimetres</label>
      <input id="ftic-cm" type="number" min="0" step="any" value="177.8" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ftic-m" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Metres</label>
      <input id="ftic-m" type="number" min="0" step="any" value="1.778" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ftic-totalin" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Total inches</label>
      <input id="ftic-totalin" type="number" min="0" step="any" value="70" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="ftic-out" style="margin-top:14px;font-size:.84rem;color:var(--text);"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var lock = false;
  function round(v, d) { return Number(v.toFixed(d)); }
  function apply(cm) {
    if (!(cm >= 0) || lock) return;
    var totalIn = cm / 2.54;
    var ft = Math.floor(totalIn / 12);
    var inch = totalIn - ft * 12;
    lock = true;
    $('ftic-cm').value = round(cm, 2);
    $('ftic-m').value = round(cm / 100, 4);
    $('ftic-ft').value = ft;
    $('ftic-in').value = round(inch, 2);
    $('ftic-totalin').value = round(totalIn, 2);
    lock = false;
    $('ftic-out').textContent = ft + ' ft ' + round(inch, 1) + ' in  =  ' + round(cm, 1) + ' cm  =  ' + round(cm / 100, 3) + ' m  (' + round(totalIn, 2) + ' in)';
  }
  $('ftic-ft').addEventListener('input', function () { apply((Number($('ftic-ft').value) * 12 + Number($('ftic-in').value)) * 2.54); });
  $('ftic-in').addEventListener('input', function () { apply((Number($('ftic-ft').value) * 12 + Number($('ftic-in').value)) * 2.54); });
  $('ftic-cm').addEventListener('input', function () { apply(Number($('ftic-cm').value)); });
  $('ftic-m').addEventListener('input', function () { apply(Number($('ftic-m').value) * 100); });
  $('ftic-totalin').addEventListener('input', function () { apply(Number($('ftic-totalin').value) * 2.54); });
  apply(177.8);
})();
</script>
