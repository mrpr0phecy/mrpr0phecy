<h2 id="dcwr-title" style="margin-top:0;color:var(--accent);">🎲 Diceware Passphrase</h2>

<form aria-describedby="dcwr-desc" onsubmit="event.preventDefault();">
  <p id="dcwr-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Six words from a 256-word list, picked with <code>crypto.getRandomValues</code> (~48 bits). Not the official 7,776-word EFF list — treat this as a strong memorable password, then store it in a manager. Generated on-device.
  </p>
  <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:end;">
    <div>
      <label for="dcwr-n" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Words</label>
      <input id="dcwr-n" type="number" min="4" max="8" value="6" inputmode="numeric" style="width:90px;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <button type="button" id="dcwr-go" style="padding:10px 14px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-weight:800;font-size:.84rem;">Roll</button>
    <button type="button" id="dcwr-copy" style="padding:10px 14px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-weight:700;font-size:.84rem;">Copy</button>
  </div>
</form>
<pre id="dcwr-out" style="margin-top:12px;padding:14px;border-radius:10px;background:#071019;border:1px solid rgba(45,212,255,.28);color:#91f7ff;font-size:1.05rem;letter-spacing:.02em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;"></pre>
<p id="dcwr-bits" style="margin:8px 0 0;font-size:.75rem;color:var(--text-secondary);"></p>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var W = 'able acid aged also area army atom aunt baby ball band bank barn belt bird boat bold bone book born bowl bulk burn calm camp card cart cave chip city clap clay clip club coal coat coin cold cook cord corn cost crab crew crop cube curl cute dark dash dawn deal desk dive dock doll door dose down drag draw drip drop drum duck dune dust each east edge even face fact fall farm fast fear feed felt fern film fire fish flag flat flow foam fold food foot ford fork form fort frog fuel full fuse gain game gate gear gift girl glow glue gold golf grab grit gulf hair half hall halt hand hang hard harp hate have head heal heap heat held helm herb hero hide high hill hire hold hole home hook hope horn host hour huge hunt idea inch iron item jade jazz join joke jump kale keep kick kind king kite knob lack lake lamp land lane last lawn leaf left lens liar lime line lion list load loaf loan lock loft long look loop lord loss loud love luck lump lung lute made mail main make male mall malt map mark mash mate maze meal mean melt menu mesh mild mile milk mill mint mist moan mole monk moon more moss most moth move much mule must nail name navy near neck need nest news noon nose note oak oath obey odor often okay open orbit oven pace pack page paid pail pain pair pale palm park part pass past path peak pear peat peck peel perk pest pick pile pine pink pint pipe plan play plot plug plus poem pole pond pony pool port pose post pour pull pump'.split(' ').slice(0, 256);
  var phrase = '';
  function roll() {
    var n = Math.max(4, Math.min(8, Number($('dcwr-n').value) || 6));
    var out = [];
    var buf = new Uint8Array(n);
    (window.crypto || window.msCrypto).getRandomValues(buf);
    for (var i = 0; i < n; i++) out.push(W[buf[i]]);
    phrase = out.join(' ');
    $('dcwr-out').textContent = phrase;
    $('dcwr-bits').textContent = n + ' × 8 bits ≈ ' + (n * 8) + ' bits of entropy (256-word list). Official Diceware is 12.9 bits/word.';
  }
  $('dcwr-go').addEventListener('click', roll);
  $('dcwr-n').addEventListener('change', roll);
  $('dcwr-copy').addEventListener('click', function () {
    var btn = this;
    function done() { btn.textContent = '✓ Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(phrase).then(done); else done();
  });
  roll();
})();
</script>
