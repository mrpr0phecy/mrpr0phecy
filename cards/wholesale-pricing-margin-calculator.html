<h2 id="wholesale-pricing-margin-calculator-title" style="margin-top:0;color:var(--accent)">🏷️ Wholesale Pricing & Margin</h2>
<form id="wholesale-pricing-margin-calculator-form" aria-describedby="wholesale-pricing-margin-calculator-desc" onsubmit="event.preventDefault();">
<p id="wholesale-pricing-margin-calculator-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:.9rem">Set retail and wholesale prices while seeing your margin and the retailer’s margin side by side. All calculations stay in your browser.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px"><div><label for="wholesale-pricing-margin-calculator-cost" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Unit cost (£)</label><input id="wholesale-pricing-margin-calculator-cost" data-key="cost" type="number" step="any" value="12" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="wholesale-pricing-margin-calculator-wholesale" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Wholesale price (£)</label><input id="wholesale-pricing-margin-calculator-wholesale" data-key="wholesale" type="number" step="any" value="24" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="wholesale-pricing-margin-calculator-retail" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Retail price (£)</label><input id="wholesale-pricing-margin-calculator-retail" data-key="retail" type="number" step="any" value="48" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="wholesale-pricing-margin-calculator-units" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Order quantity</label><input id="wholesale-pricing-margin-calculator-units" data-key="units" type="number" step="any" value="100" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div></div>
<button type="submit" style="margin-top:16px;padding:11px 18px;border:0;border-radius:8px;background:var(--accent);color:#001018;font-weight:700;cursor:pointer">Calculate</button>
<div id="wholesale-pricing-margin-calculator-out" aria-live="polite" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:16px"></div>
<p style="color:var(--text-secondary);font-size:.78rem;margin-top:12px">Planning estimate only. Check tax, legal and contractual assumptions for your situation.</p>
</form>
<script>
(function(){
 const form=document.getElementById('wholesale-pricing-margin-calculator-form'),out=document.getElementById('wholesale-pricing-margin-calculator-out');
 const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:2}).format(Number.isFinite(n)?n:0);
 const num=(n,d=0)=>Number.isFinite(n)?n.toLocaleString('en-GB',{maximumFractionDigits:d}):'—'; const pct=n=>num(n,1)+'%';
 const dateMonths=n=>{const d=new Date();d.setDate(d.getDate()+Math.max(0,n)*30.44);return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'})};
 function calculate(){const v={};form.querySelectorAll('[data-key]').forEach(x=>v[x.dataset.key]=Number(x.value)); if(Object.values(v).some(x=>!Number.isFinite(x))){out.textContent='Enter valid numbers in every field.';return} const rows=(()=>{const gp=v.wholesale-v.cost; return [['Your gross profit/order',money(gp*v.units)],['Your gross margin',pct(gp/v.wholesale*100)],['Retailer gross margin',pct((v.retail-v.wholesale)/v.retail*100)],['Retail sales value',money(v.retail*v.units)]];})();out.innerHTML='';rows.forEach(r=>{const box=document.createElement('div');box.style.cssText='padding:14px;border:1px solid var(--border-light);border-radius:9px;background:rgba(45,212,255,.06)';const a=document.createElement('div'),b=document.createElement('strong');a.style.cssText='color:var(--text-secondary);font-size:.8rem';b.style.cssText='display:block;color:var(--accent);font-size:1.15rem;margin-top:5px';a.textContent=r[0];b.textContent=r[1];box.append(a,b);out.append(box)})}
 form.addEventListener('submit',calculate);form.addEventListener('input',calculate);calculate();
})();
</script>
