<h2 id="fwss-title" style="margin-top:0;color:var(--accent);">✨ Sparkler Safety Checklist</h2>
<div id="fwss-root">
  <p id="fwss-desc" class="small">Check the essentials before using sparklers, and know when to stop.</p>
  <p class="fwss-note">Sparklers stay hot after they go out. Follow the instructions on the product.</p><div class="fwss-panel"><label class="fwss-item"><input type="checkbox"> <span>Check the venue allows sparklers and read the manufacturer’s instructions.</span></label>
<label class="fwss-item"><input type="checkbox"> <span>Keep sparklers away from children under five.</span></label>
<label class="fwss-item"><input type="checkbox"> <span>An adult supervises children and lights sparklers one at a time.</span></label>
<label class="fwss-item"><input type="checkbox"> <span>Wear gloves and hold sparklers at arm’s length, away from faces and clothing.</span></label>
<label class="fwss-item"><input type="checkbox"> <span>Keep a safe space from other people and never run with a sparkler.</span></label>
<label class="fwss-item"><input type="checkbox"> <span>Put used sparklers hot end down in a bucket of water and leave them to cool.</span></label>
<label class="fwss-item"><input type="checkbox"> <span>Keep unlit and spent sparklers away from children; never touch the hot end.</span></label></div>
    <p id="fwss-progress" class="fwss-result" aria-live="polite"></p><button type="button" id="fwss-reset">Clear ticks</button>
  <p class="fwss-note">Reference: <a href="https://www.london-fire.gov.uk/safety/the-home/fireworks/">London Fire Brigade: fireworks safety</a>.</p>
  <p class="fwss-note">More for the night: <a href="/tool/fireworks-night-checklist.html">event checklist</a> · <a href="/tool/fireworks-pet-preparation.html">pets</a> · <a href="/tool/fireworks-burn-first-aid.html">burn first aid</a> · <a href="/tool/fireworks-night-budget.html">budget</a></p>
  <style>
#fwss-root {color:var(--text);}
#fwss-root .fwss-panel {background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:16px;margin:14px 0;}
#fwss-root .fwss-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;}
#fwss-root label {display:block;line-height:1.45;}
#fwss-root input:not([type=checkbox]), #fwss-root select {box-sizing:border-box;width:100%;margin-top:5px;padding:10px;border-radius:8px;border:1px solid #64748b;background:#101a28;color:#fff;font:inherit;}
#fwss-root input[type=checkbox] {width:18px;height:18px;flex:none;accent-color:#f59e0b;}
#fwss-root .fwss-item {display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.1);}
#fwss-root button {background:#fbbf24;color:#111827;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;margin:8px 8px 0 0;}
#fwss-root button:focus-visible, #fwss-root input:focus-visible, #fwss-root select:focus-visible {outline:3px solid #fbbf24;outline-offset:2px;}
#fwss-root .fwss-result {white-space:pre-line;line-height:1.6;}
#fwss-root .fwss-note {font-size:.88rem;color:var(--text-secondary);line-height:1.5;}
#fwss-root a {color:var(--accent);}
</style>
</div>
<script>
(function() {
  'use strict';
  function init() {
    const root = document.getElementById('fwss-root');
    if (!root || root.dataset.ready) return;
    root.dataset.ready = 'true';
    const boxes = Array.from(root.querySelectorAll('input[type="checkbox"]'));
    const progress = root.querySelector('#fwss-progress');
    function update() { progress.textContent = boxes.filter(b => b.checked).length + ' of ' + boxes.length + ' checked'; }
    boxes.forEach(b => b.addEventListener('change', update));
    root.querySelector('#fwss-reset').addEventListener('click', () => { boxes.forEach(b => b.checked = false); update(); });
    update();
  }
  init();
})();
</script>
