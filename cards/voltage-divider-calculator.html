<h2 id="vdiv-title" style="margin-top:0;color:var(--accent);">⚡ Voltage Divider</h2>

<form aria-describedby="vdiv-desc" onsubmit="event.preventDefault();">
  <p id="vdiv-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    V<sub>out</sub> = V<sub>in</sub> × R2 / (R1 + R2). R1 is the top resistor from the supply; R2 is the bottom resistor to ground. Unloaded — a low-impedance load pulls the output down.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="vdiv-vin" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">V<sub>in</sub></label>
      <input id="vdiv-vin" type="number" min="0" step="any" value="12" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="vdiv-r1" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">R1 (top) Ω</label>
      <input id="vdiv-r1" type="number" min="0" step="any" value="10000" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="vdiv-r2" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">R2 (bottom) Ω</label>
      <input id="vdiv-r2" type="number" min="0" step="any" value="10000" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="vdiv-vout" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">V<sub>out</sub> (solve R2)</label>
      <input id="vdiv-vout" type="number" min="0" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="vdiv-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var lock = false;
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function paint(vin, r1, r2, vout) {
    var i = (r1 + r2) > 0 ? vin / (r1 + r2) : 0;
    $('vdiv-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;">' +
      cell('Vout', vout.toFixed(3) + ' V') +
      cell('Ratio R2/(R1+R2)', (vout / vin * 100).toFixed(2) + '%') +
      cell('Current', (i * 1000).toFixed(3) + ' mA') +
      cell('Power in R1', (i * i * r1 * 1000).toFixed(2) + ' mW') +
      cell('Power in R2', (i * i * r2 * 1000).toFixed(2) + ' mW') +
      '</div>';
  }
  function fromR() {
    if (lock) return;
    var vin = Number($('vdiv-vin').value), r1 = Number($('vdiv-r1').value), r2 = Number($('vdiv-r2').value);
    if (!(vin >= 0 && r1 >= 0 && r2 >= 0 && r1 + r2 > 0)) return;
    var vout = vin * r2 / (r1 + r2);
    lock = true; $('vdiv-vout').value = String(Number(vout.toFixed(4))); lock = false;
    paint(vin, r1, r2, vout);
  }
  function fromVout() {
    if (lock) return;
    var vin = Number($('vdiv-vin').value), r1 = Number($('vdiv-r1').value), vout = Number($('vdiv-vout').value);
    if (!(vin > 0 && r1 > 0 && vout >= 0 && vout < vin)) return;
    var r2 = r1 * vout / (vin - vout);
    lock = true; $('vdiv-r2').value = String(Number(r2.toFixed(2))); lock = false;
    paint(vin, r1, r2, vout);
  }
  ['vdiv-vin', 'vdiv-r1', 'vdiv-r2'].forEach(function (id) { $(id).addEventListener('input', fromR); });
  $('vdiv-vout').addEventListener('input', fromVout);
  fromR();
})();
</script>
