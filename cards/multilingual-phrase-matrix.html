<h2 id="multilingual-phrase-matrix-title" style="margin-top:0;color:var(--accent);">🌐 PolyglotMatrix: 10-Language Global Travel Phrasebook</h2>

<form aria-describedby="multilingual-phrase-matrix-desc" onsubmit="event.preventDefault();">
  <p id="multilingual-phrase-matrix-desc" class="small" style="color:var(--muted);margin-bottom:14px;">
    Compare, learn, and pronounce essential survival phrases side-by-side across 10 of the world's most spoken languages with instant native audio speech synthesis.
  </p>

  <!-- Phrase Selector -->
  <div style="margin-bottom:14px;">
    <label for="polyglot-phrase-select" style="display:block;font-size:0.8rem;font-weight:600;color:var(--text);margin-bottom:4px;">
      Select Essential Travel Situation:
    </label>
    <select id="polyglot-phrase-select" style="width:100%;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(0,255,204,0.3);color:#e6faff;font-size:0.9rem;">
      <option value="hello" selected>👋 Hello / Greetings</option>
      <option value="thanks">🙏 Thank You Very Much</option>
      <option value="please">✨ Please / If you would</option>
      <option value="help">🚨 Help me! / Emergency</option>
      <option value="bathroom">🚻 Where is the restroom?</option>
      <option value="howmuch">💰 How much does this cost?</option>
      <option value="delicious">😋 This is delicious!</option>
      <option value="goodbye">👋 Goodbye / See you again</option>
    </select>
  </div>

  <!-- Languages Comparison Grid -->
  <div id="polyglot-languages-grid" style="display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));gap:8px;max-height:360px;overflow-y:auto;padding-right:4px;"></div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:0.75rem;color:var(--muted);">
    <span>💡 Click any phrase card to listen in native pronunciation</span>
    <span>10 Languages</span>
  </div>
</form>

<script>
(function() {
  const PHRASES_DATABASE = {
    hello: [
      { lang: '🇪🇸 Spanish', code: 'es-ES', text: '¡Hola! Buenos días', phon: 'OH-lah BWEH-nohs DEE-ahs' },
      { lang: '🇫🇷 French', code: 'fr-FR', text: 'Bonjour !', phon: 'bohn-ZHOOR' },
      { lang: '🇩🇪 German', code: 'de-DE', text: 'Guten Tag!', phon: 'GOO-ten TAHK' },
      { lang: '🇮🇹 Italian', code: 'it-IT', text: 'Ciao! Buongiorno', phon: 'CHOW bwon-JOHR-noh' },
      { lang: '🇯🇵 Japanese', code: 'ja-JP', text: 'こんにちは', phon: 'kohn-NEE-chee-wah' },
      { lang: '🇨🇳 Mandarin', code: 'zh-CN', text: '你好 (Nǐ hǎo)', phon: 'nee how' },
      { lang: '🇰🇷 Korean', code: 'ko-KR', text: '안녕하세요', phon: 'ahn-nyung-hah-seh-yoh' },
      { lang: '🇵🇹 Portuguese', code: 'pt-PT', text: 'Olá! Bom dia', phon: 'oh-LAH bohm DEE-ah' },
      { lang: '🇷🇺 Russian', code: 'ru-RU', text: 'Здравствуйте', phon: 'ZDRAHST-vuy-tyeh' },
      { lang: '🇸🇦 Arabic', code: 'ar-SA', text: 'مرحباً (Marhaban)', phon: 'MAR-hah-bahn' }
    ],
    thanks: [
      { lang: '🇪🇸 Spanish', code: 'es-ES', text: 'Muchas gracias', phon: 'MOO-chahs GRAH-syahs' },
      { lang: '🇫🇷 French', code: 'fr-FR', text: 'Merci beaucoup', phon: 'mair-SEE boh-KOO' },
      { lang: '🇩🇪 German', code: 'de-DE', text: 'Vielen Dank', phon: 'FEE-len DAHN-k' },
      { lang: '🇮🇹 Italian', code: 'it-IT', text: 'Grazie mille', phon: 'GRAHT-syeh MEEL-leh' },
      { lang: '🇯🇵 Japanese', code: 'ja-JP', text: 'ありがとうございます', phon: 'ah-ree-gah-TOH goh-zah-ee-mahs' },
      { lang: '🇨🇳 Mandarin', code: 'zh-CN', text: '非常感谢 (Fēicháng gǎnxiè)', phon: 'fay-chahng gahn-shyeh' },
      { lang: '🇰🇷 Korean', code: 'ko-KR', text: '감사합니다', phon: 'gahm-sah-hahm-nee-dah' },
      { lang: '🇵🇹 Portuguese', code: 'pt-PT', text: 'Muito obrigado', phon: 'MOO-ee-too oh-bree-GAH-doo' },
      { lang: '🇷🇺 Russian', code: 'ru-RU', text: 'Большое спасибо', phon: 'bahl-SHOY-eh spah-SEE-bah' },
      { lang: '🇸🇦 Arabic', code: 'ar-SA', text: 'شكراً جزيلاً (Shukran)', phon: 'shook-RAHN jah-ZEE-lan' }
    ],
    help: [
      { lang: '🇪🇸 Spanish', code: 'es-ES', text: '¡Ayuda, por favor!', phon: 'ah-YOO-dah por fah-VOR' },
      { lang: '🇫🇷 French', code: 'fr-FR', text: 'Aidez-moi, s\'il vous plaît !', phon: 'eh-day MWAH seel voo PLEH' },
      { lang: '🇩🇪 German', code: 'de-DE', text: 'Hilfe, bitte!', phon: 'HIL-feh BIT-teh' },
      { lang: '🇮🇹 Italian', code: 'it-IT', text: 'Aiuto, per favore!', phon: 'ah-YOO-toh pair fah-VOH-reh' },
      { lang: '🇯🇵 Japanese', code: 'ja-JP', text: '助けてください！', phon: 'tah-skay-teh koo-dah-sah-ee' },
      { lang: '🇨🇳 Mandarin', code: 'zh-CN', text: '救命！(Jiùmìng!)', phon: 'jyoh-ming' },
      { lang: '🇰🇷 Korean', code: 'ko-KR', text: '도와주세요!', phon: 'doh-wah-joo-seh-yoh' },
      { lang: '🇵🇹 Portuguese', code: 'pt-PT', text: 'Socorro, por favor!', phon: 'soh-KOH-hoo poor fah-VOHR' },
      { lang: '🇷🇺 Russian', code: 'ru-RU', text: 'Помогите, пожалуйста!', phon: 'pah-mah-GEE-tyeh pah-ZHAHL-oo-stah' },
      { lang: '🇸🇦 Arabic', code: 'ar-SA', text: 'ساعدني من فضلك', phon: 'sah-id-NEE min FAD-lak' }
    ],
    bathroom: [
      { lang: '🇪🇸 Spanish', code: 'es-ES', text: '¿Dónde está el baño?', phon: 'DOHN-deh es-TAH el BAHN-yoh' },
      { lang: '🇫🇷 French', code: 'fr-FR', text: 'Où sont les toilettes ?', phon: 'oo sohn lay twah-LET' },
      { lang: '🇩🇪 German', code: 'de-DE', text: 'Wo ist die Toilette?', phon: 'voh ist dee twah-LET-teh' },
      { lang: '🇮🇹 Italian', code: 'it-IT', text: 'Dov\'è il bagno?', phon: 'doh-VEH eel BAHN-yoh' },
      { lang: '🇯🇵 Japanese', code: 'ja-JP', text: 'お手洗いはどこですか？', phon: 'oh-teh-ah-rah-ee wah DOH-koh des-kah' },
      { lang: '🇨🇳 Mandarin', code: 'zh-CN', text: '洗手间在哪里？', phon: 'xǐ-shǒu-jiān zài nǎ-lǐ?' },
      { lang: '🇰🇷 Korean', code: 'ko-KR', text: '화장실이 어디예요?', phon: 'hwah-jahng-sheel-ee uh-dee-yeh-yoh' },
      { lang: '🇵🇹 Portuguese', code: 'pt-PT', text: 'Onde fica a casa de banho?', phon: 'OHN-deh FEE-kah ah KAH-zah' },
      { lang: '🇷🇺 Russian', code: 'ru-RU', text: 'Где туалет?', phon: 'gdeh too-ah-LYEHT' },
      { lang: '🇸🇦 Arabic', code: 'ar-SA', text: 'أين الحمام؟', phon: 'AYN al-ham-MAM?' }
    ],
    howmuch: [
      { lang: '🇪🇸 Spanish', code: 'es-ES', text: '¿Cuánto cuesta esto?', phon: 'KWAHN-toh KWEHS-tah EHS-toh' },
      { lang: '🇫🇷 French', code: 'fr-FR', text: 'Combien ça coûte ?', phon: 'kohm-BYEHN sah KOOT' },
      { lang: '🇩🇪 German', code: 'de-DE', text: 'Wie viel kostet das?', phon: 'vee feel KOS-tet dahs' },
      { lang: '🇮🇹 Italian', code: 'it-IT', text: 'Quanto costa questo?', phon: 'KWAHN-toh KOHS-tah KWEHS-toh' },
      { lang: '🇯🇵 Japanese', code: 'ja-JP', text: 'これはいくらですか？', phon: 'koh-reh wah EE-koo-rah des-kah' },
      { lang: '🇨🇳 Mandarin', code: 'zh-CN', text: '这个多少钱？', phon: 'zhè-ge duō-shǎo qián?' },
      { lang: '🇰🇷 Korean', code: 'ko-KR', text: '이거 얼마예요?', phon: 'ee-guh uhl-mah-yeh-yoh' },
      { lang: '🇵🇹 Portuguese', code: 'pt-PT', text: 'Quanto custa isto?', phon: 'KWAHN-too KOOSH-tah EESH-too' },
      { lang: '🇷🇺 Russian', code: 'ru-RU', text: 'Сколько это стоит?', phon: 'SKOHL-kah EH-tah STOH-eet' },
      { lang: '🇸🇦 Arabic', code: 'ar-SA', text: 'بكم هذا؟', phon: 'bee-KAM HAH-dhah?' }
    ]
  };

  const sel = document.getElementById('polyglot-phrase-select');
  const grid = document.getElementById('polyglot-languages-grid');

  function speak(text, langCode) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langCode;
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }
  }

  function render() {
    const pKey = sel.value;
    const items = PHRASES_DATABASE[pKey] || PHRASES_DATABASE.hello;

    grid.innerHTML = '';
    items.forEach(it => {
      const card = document.createElement('div');
      card.style.cssText = 'padding:10px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);cursor:pointer;transition:all 0.15s;';
      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <span style="font-size:0.75rem;font-weight:700;color:var(--accent);">${it.lang}</span>
          <span style="font-size:0.7rem;color:var(--muted);">🔊 Play</span>
        </div>
        <div style="font-size:1.05rem;font-weight:700;color:#fff;">${it.text}</div>
        <div style="font-size:0.72rem;color:#ffd700;margin-top:2px;font-style:italic;">${it.phon}</div>
      `;
      card.addEventListener('mouseenter', () => {
        card.style.borderColor = '#00ffcc';
        card.style.background = 'rgba(0,255,204,0.08)';
      });
      card.addEventListener('mouseleave', () => {
        card.style.borderColor = 'rgba(255,255,255,0.08)';
        card.style.background = 'rgba(255,255,255,0.03)';
      });
      card.addEventListener('click', () => speak(it.text, it.code));
      grid.appendChild(card);
    });
  }

  sel.addEventListener('change', render);
  render();
})();
</script>
