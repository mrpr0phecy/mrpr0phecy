<h2 id="lorip-title" style="margin-top:0;color:var(--accent);">📄 Lorem Ipsum & Placeholder Text</h2>

<form aria-describedby="lorip-desc" onsubmit="event.preventDefault();" style="margin-bottom:14px;">
  <p id="lorip-desc" class="small" style="color:rgba(230,250,255,0.7);margin-bottom:14px;">
    Generate filler text for mockups and layouts: classic Lorem Ipsum, plain English, or themed flavours (tech jargon, cooking, pirate, corporate, hip hop). Choose paragraphs, sentences or words, wrap in HTML tags, and copy in one click.
  </p>

  <div style="display:grid;grid-template-columns:1.3fr 0.7fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="lorip-flavour" style="display:block;font-size:0.8rem;color:rgba(230,250,255,0.75);margin-bottom:5px;">Flavour</label>
      <select id="lorip-flavour" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.35);color:#fff;font-size:0.95rem;">
        <option value="lorem">Classic Lorem Ipsum</option>
        <option value="english">Plain English</option>
        <option value="tech">Tech startup jargon</option>
        <option value="corporate">Corporate buzzword</option>
        <option value="cooking">Cooking & food</option>
        <option value="pirate">Pirate</option>
        <option value="hiphop">UK hip hop</option>
        <option value="space">Space & astronomy</option>
      </select>
    </div>
    <div>
      <label for="lorip-n" style="display:block;font-size:0.8rem;color:rgba(230,250,255,0.75);margin-bottom:5px;">Amount</label>
      <input id="lorip-n" type="number" min="1" max="200" value="3" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.35);color:#fff;font-size:0.95rem;" />
    </div>
    <div>
      <label for="lorip-unit" style="display:block;font-size:0.8rem;color:rgba(230,250,255,0.75);margin-bottom:5px;">Unit</label>
      <select id="lorip-unit" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.35);color:#fff;font-size:0.95rem;">
        <option value="p">paragraphs</option>
        <option value="s">sentences</option>
        <option value="w">words</option>
        <option value="c">characters (approx.)</option>
        <option value="li">list items</option>
      </select>
    </div>
  </div>

  <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:0.8rem;color:rgba(230,250,255,0.7);">
    <label style="display:flex;gap:6px;align-items:center;cursor:pointer;"><input type="checkbox" id="lorip-start" checked /> start with “Lorem ipsum dolor sit amet…”</label>
    <label style="display:flex;gap:6px;align-items:center;cursor:pointer;"><input type="checkbox" id="lorip-html" /> wrap in HTML tags</label>
    <label style="display:flex;gap:6px;align-items:center;cursor:pointer;"><input type="checkbox" id="lorip-md" /> Markdown headings</label>
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button type="button" id="lorip-go" style="flex:1;min-width:140px;padding:11px 18px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:700;">Generate</button>
    <button type="button" id="lorip-copy" style="padding:11px 18px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:rgba(230,250,255,0.85);cursor:pointer;">Copy</button>
  </div>
</form>

<textarea id="lorip-out" aria-label="Generated text" readonly spellcheck="false" style="width:100%;min-height:190px;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.35);color:#e6faff;font-size:0.9rem;line-height:1.6;resize:vertical;"></textarea>
<div id="lorip-meta" aria-live="polite" style="font-size:0.78rem;color:rgba(230,250,255,0.5);margin-top:6px;min-height:1.2em;"></div>

<script>
(function () {
  var card = document.currentScript.parentNode;
  var $ = function (id) { return card.querySelector('#' + id); };
  var out = $('lorip-out'), meta = $('lorip-meta');

  var WORDS = {
    lorem: 'lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum at vero eos accusamus iusto odio dignissimos ducimus blanditiis praesentium voluptatum deleniti atque corrupti quos dolores quas molestias excepturi obcaecati cupiditate provident similique mollitia animi perferendis doloribus asperiores repellat'.split(' '),
    english: 'the quick brown fox jumps over a lazy dog while morning light spreads across quiet fields and small towns wake slowly to the sound of kettles and radios people walk to work past bakeries that smell of warm bread children wait at bus stops kicking stones and talking about nothing in particular clouds drift north the river keeps its steady pace under old stone bridges someone laughs in a doorway a bicycle bell rings twice and the day simply continues as days tend to do without asking anyone for permission'.split(' '),
    tech: 'synergy scalable microservices blockchain cloud-native disruptive pivot leverage stakeholder bandwidth ecosystem agile sprint backlog roadmap MVP iterate deploy pipeline kubernetes serverless containerised latency throughput observability frictionless onboarding retention churn growth-hacking north-star metric platform API-first headless composable data-driven machine-learning inference edge zero-trust unicorn runway burn-rate seed-round product-market-fit dogfooding velocity standup retrospective'.split(' '),
    corporate: 'going forward circle back low-hanging fruit move the needle deep dive touch base action items value-add core competency best practice paradigm shift think outside the box boil the ocean take this offline bandwidth alignment stakeholders deliverables key learnings optics run it up the flagpole quick win win-win holistic robust granular scalable proactive ownership empower streamline synergise strategic ecosystem mindshare thought leadership'.split(' '),
    cooking: 'butter garlic onion simmer gently until golden fold in the flour whisk the eggs season generously with salt and cracked pepper a splash of olive oil fresh basil torn by hand caramelise slowly reduce the sauce by half rest the meat before carving toast the cumin seeds sourdough crust crackles a squeeze of lemon lifts everything sea salt flakes chilli warmth lingers thyme rosemary stock bubbling risotto stirred patiently brown the butter till nutty'.split(' '),
    pirate: 'arr matey avast ye scallywag shiver me timbers hoist the mainsail yo-ho-ho barrel of rum landlubber walk the plank dead men tell no tales pieces of eight buried treasure black spot jolly roger cutlass parley scurvy dog crow\'s nest doubloons weigh anchor batten down the hatches heave ho me hearties cap\'n seven seas plunder galleon marooned davy jones\' locker'.split(' '),
    hiphop: 'bars flow beat drops bassline heavy on the low end mic check one two verse hook chorus sixteen freestyle cypher crate digging vinyl sample chopped and looped boom bap snare cracks hi-hats roll turntables scratch DJ crowd hands up from Luton to the world lyrics layered double-time rhyme scheme internal rhymes wordplay punchline ad-libs studio session headphones on late night mixdown mastering the booth soundscape animated visuals independent grind'.split(' '),
    space: 'nebula supernova neutron star pulsar quasar event horizon redshift parsec light-year exoplanet transit orbit perihelion eclipse corona solar wind aurora asteroid belt comet tail Kuiper belt Oort cloud galaxy spiral arms dark matter cosmic microwave background gravitational lensing black hole accretion disc telescope aperture magnitude constellation zenith azimuth interstellar dust protoplanetary disc fusion hydrogen helium spectrum'.split(' ')
  };
  var LOREM_START = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.';

  var seed = Date.now() % 2147483647;
  function rnd() { seed = (seed * 48271) % 2147483647; return (seed - 1) / 2147483646; }
  function ri(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
  function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }

  function sentence(words) {
    var n = ri(6, 16), parts = [], comma = n > 9 ? ri(3, n - 3) : -1;
    for (var i = 0; i < n; i++) {
      var w = pick(words);
      if (i === 0) w = w.charAt(0).toUpperCase() + w.slice(1);
      if (i === comma) w += ',';
      parts.push(w);
    }
    var end = rnd() < 0.08 ? '?' : (rnd() < 0.05 ? '!' : '.');
    return parts.join(' ') + end;
  }
  function paragraph(words, first) {
    var n = ri(3, 7), s = [];
    for (var i = 0; i < n; i++) s.push(sentence(words));
    if (first) s[0] = LOREM_START;
    return s.join(' ');
  }
  function words(list, n, first) {
    var o = [];
    if (first) { o = LOREM_START.replace(/[.,]/g, '').split(' '); }
    while (o.length < n) o.push(pick(list));
    o = o.slice(0, n);
    o[0] = o[0].charAt(0).toUpperCase() + o[0].slice(1);
    return o.join(' ') + '.';
  }

  function generate() {
    var fl = $('lorip-flavour').value, list = WORDS[fl];
    var n = Math.min(200, Math.max(1, parseInt($('lorip-n').value, 10) || 1));
    var unit = $('lorip-unit').value;
    var first = $('lorip-start').checked && fl === 'lorem';
    var html = $('lorip-html').checked, md = $('lorip-md').checked;
    var blocks = [], text;
    if (unit === 'p') {
      for (var i = 0; i < n; i++) blocks.push(paragraph(list, first && i === 0));
      text = blocks.map(function (p, i) {
        var h = md ? (i === 0 ? '# ' : '## ') + pick(list).replace(/^\w/, function (c) { return c.toUpperCase(); }) + ' ' + pick(list) + '\n\n' : '';
        return h + (html ? '<p>' + p + '</p>' : p);
      }).join('\n\n');
    } else if (unit === 's') {
      for (var j = 0; j < n; j++) blocks.push(first && j === 0 ? LOREM_START : sentence(list));
      text = blocks.join(' ');
      if (html) text = '<p>' + text + '</p>';
    } else if (unit === 'w') {
      text = words(list, n, first);
      if (html) text = '<p>' + text + '</p>';
    } else if (unit === 'c') {
      text = '';
      while (text.length < n) text += (text ? ' ' : '') + sentence(list);
      text = text.slice(0, n).replace(/\s+\S*$/, '') + '.';
      if (first) text = (LOREM_START + ' ' + text).slice(0, n);
      if (html) text = '<p>' + text + '</p>';
    } else {
      for (var k = 0; k < n; k++) blocks.push(sentence(list).replace(/[.?!]$/, ''));
      text = html ? '<ul>\n' + blocks.map(function (b) { return '  <li>' + b + '</li>'; }).join('\n') + '\n</ul>' : blocks.map(function (b) { return (md ? '- ' : '• ') + b; }).join('\n');
    }
    out.value = text;
    var wc = text.replace(/<[^>]+>/g, '').trim().split(/\s+/).length;
    meta.textContent = wc + ' words · ' + text.length + ' characters · ' + Math.max(1, Math.round(wc / 200)) + ' min read';
  }

  ['lorip-flavour', 'lorip-unit'].forEach(function (id) { $(id).addEventListener('change', generate); });
  ['lorip-start', 'lorip-html', 'lorip-md'].forEach(function (id) { $(id).addEventListener('change', generate); });
  $('lorip-n').addEventListener('input', generate);
  $('lorip-go').addEventListener('click', generate);
  $('lorip-copy').addEventListener('click', function () {
    var btn = this, done = function () { btn.textContent = 'Copied!'; setTimeout(function () { btn.textContent = 'Copy'; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(out.value).then(done, function () { out.select(); done(); });
    else { out.select(); try { document.execCommand('copy'); } catch (e) {} done(); }
  });
  generate();
})();
</script>
