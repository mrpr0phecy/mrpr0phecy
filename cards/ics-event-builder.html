<h2 id="icsf-title" style="margin-top:0;color:var(--accent);">📅 ICS Event Builder</h2>

<form aria-describedby="icsf-desc" onsubmit="event.preventDefault();">
  <p id="icsf-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Make a <code>.ics</code> file any calendar app can import. Times are written as floating local (no time-zone math). All-day events use DATE values.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;">
    <div style="grid-column:1/-1;">
      <label for="icsf-sum" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Title</label>
      <input id="icsf-sum" type="text" value="Team standup" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="icsf-start" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Start</label>
      <input id="icsf-start" type="datetime-local" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="icsf-end" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">End</label>
      <input id="icsf-end" type="datetime-local" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="icsf-loc" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Location</label>
      <input id="icsf-loc" type="text" value="Room 4" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--text-secondary);"><input id="icsf-all" type="checkbox" style="accent-color:var(--accent);"> All-day</label>
  </div>
</form>
<pre id="icsf-out" style="margin-top:12px;padding:12px;border-radius:10px;background:#071019;border:1px solid rgba(45,212,255,.28);color:#91f7ff;font-size:.75rem;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;"></pre>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">
  <button type="button" id="icsf-copy" style="padding:8px 12px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:700;">Copy</button>
  <button type="button" id="icsf-dl" style="padding:8px 12px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:800;">Download .ics</button>
</div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function pad(n) { return String(n).padStart(2, '0'); }
  function stamp(d) {
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
  }
  function dateOnly(s) { return s.slice(0, 10).replace(/-/g, ''); }
  function dt(s) { return s.replace(/[-:]/g, '').replace('T', 'T') + '00'; }
  (function init() {
    var n = new Date(); n.setMinutes(0, 0, 0); n.setHours(n.getHours() + 1);
    var e = new Date(n.getTime() + 3600000);
    function loc(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
    $('icsf-start').value = loc(n);
    $('icsf-end').value = loc(e);
  })();
  function esc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }
  function build() {
    var all = $('icsf-all').checked;
    var start = $('icsf-start').value, end = $('icsf-end').value;
    var uid = 'tmus-' + Date.now() + '@local';
    var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//The Most Useful Site//EN', 'BEGIN:VEVENT', 'UID:' + uid, 'DTSTAMP:' + stamp(new Date())];
    if (all) {
      lines.push('DTSTART;VALUE=DATE:' + dateOnly(start));
      lines.push('DTEND;VALUE=DATE:' + dateOnly(end || start));
    } else {
      lines.push('DTSTART:' + dt(start));
      lines.push('DTEND:' + dt(end));
    }
    lines.push('SUMMARY:' + esc($('icsf-sum').value));
    if ($('icsf-loc').value.trim()) lines.push('LOCATION:' + esc($('icsf-loc').value.trim()));
    lines.push('END:VEVENT', 'END:VCALENDAR');
    return lines.join('\r\n');
  }
  function run() { $('icsf-out').textContent = build(); }
  ['icsf-sum', 'icsf-start', 'icsf-end', 'icsf-loc', 'icsf-all'].forEach(function (id) {
    $(id).addEventListener('input', run); $(id).addEventListener('change', run);
  });
  $('icsf-copy').addEventListener('click', function () {
    var btn = this, t = build();
    function done() { btn.textContent = '✓ Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done); else done();
  });
  $('icsf-dl').addEventListener('click', function () {
    var blob = new Blob([build()], { type: 'text/calendar' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'event.ics';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 800);
  });
  run();
})();
</script>
