<h2 id="prtn-title" style="margin-top:0;color:var(--accent);">🥩 Daily Protein Intake</h2>

<form aria-describedby="prtn-desc" onsubmit="event.preventDefault();">
  <p id="prtn-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Estimate a daily protein target from body weight and how hard you train. Sedentary adults often sit near 0.8 g/kg; strength athletes commonly use 1.6–2.2 g/kg. Not a prescription — kidney disease needs a clinician.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="prtn-w" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Body weight</label>
      <input id="prtn-w" type="number" min="20" max="400" step="any" value="75" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="prtn-u" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Unit</label>
      <select id="prtn-u" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="kg">kg</option>
        <option value="lb">lb</option>
      </select>
    </div>
    <div>
      <label for="prtn-lvl" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Activity</label>
      <select id="prtn-lvl" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="0.8">Sedentary — 0.8 g/kg</option>
        <option value="1.2">Active / older adult — 1.2 g/kg</option>
        <option value="1.6" selected>Strength training — 1.6 g/kg</option>
        <option value="2.0">Serious lifting / cut — 2.0 g/kg</option>
        <option value="2.2">Upper common band — 2.2 g/kg</option>
      </select>
    </div>
  </div>
</form>
<div id="prtn-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var w = Number($('prtn-w').value), gkg = Number($('prtn-lvl').value);
    if (!(w > 0 && gkg > 0)) return;
    var kg = $('prtn-u').value === 'lb' ? w * 0.45359237 : w;
    var g = kg * gkg;
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('prtn-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Target', Math.round(g) + ' g / day') +
      cell('Per meal if 3 meals', Math.round(g / 3) + ' g') +
      cell('Per meal if 4 meals', Math.round(g / 4) + ' g') +
      cell('Range 1.6–2.2 g/kg', Math.round(kg * 1.6) + '–' + Math.round(kg * 2.2) + ' g') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">A palm-sized chicken breast is roughly 30 g protein. Spread intake through the day rather than one huge shake if you can.</p>';
  }
  ['prtn-w', 'prtn-u', 'prtn-lvl'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
