<h2 id="prompt-architect-title" style="margin-top:0;color:var(--accent);">⚡ AI Prompt Studio</h2>

<form aria-describedby="prompt-architect-desc" onsubmit="event.preventDefault();">
  <p id="prompt-architect-desc" class="small" style="color:var(--muted);margin-bottom:16px;">
    Turn vague thoughts into high-performance AI prompts used by senior prompt engineers. Constructs rigorous prompts with Chain-of-Thought reasoning, XML delimiters, output schemas, and anti-hallucination guardrails.
  </p>

  <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:12px;margin-bottom:14px;">
    <div>
      <label for="prompt-framework-select" style="display:block;font-size:0.8rem;font-weight:600;color:var(--text);margin-bottom:4px;">
        Engineering Architecture:
      </label>
      <select id="prompt-framework-select" style="width:100%;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.18);color:inherit;font-size:0.85rem;">
        <option value="rtco" selected>RTCO (Role, Task, Context, Output Schema)</option>
        <option value="cot">Chain-of-Thought (Step-by-Step Deep Reasoning)</option>
        <option value="tot">Tree of Thoughts (Multi-Perspective Adversarial)</option>
        <option value="fewshot">Few-Shot Exemplar (High Consistency Patterns)</option>
        <option value="socratic">Socratic Mentor (Deep Diagnostic & Coaching)</option>
      </select>
    </div>

    <div>
      <label for="prompt-target-model" style="display:block;font-size:0.8rem;font-weight:600;color:var(--text);margin-bottom:4px;">
        Target Model Optimization:
      </label>
      <select id="prompt-target-model" style="width:100%;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.18);color:inherit;font-size:0.85rem;">
        <option value="claude" selected>Claude 3.5 / 3.7 Sonnet (XML Tags & Nuance)</option>
        <option value="chatgpt">ChatGPT-4o / o1 (Markdown & Direct System Directives)</option>
        <option value="deepseek">DeepSeek R1 / V3 (CoT & Formal Reasoning)</option>
        <option value="gemini">Gemini 1.5 Pro (Multimodal & Long-Context Framing)</option>
      </select>
    </div>

    <div>
      <label for="prompt-output-format" style="display:block;font-size:0.8rem;font-weight:600;color:var(--text);margin-bottom:4px;">
        Desired Output Schema:
      </label>
      <select id="prompt-output-format" style="width:100%;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.18);color:inherit;font-size:0.85rem;">
        <option value="markdown" selected>Executive Markdown Summary & Action Steps</option>
        <option value="json">Structured Valid JSON Schema</option>
        <option value="bullet">Direct Bulleted Strategic Checklist</option>
        <option value="code">Production Code with Explanatory Comments</option>
      </select>
    </div>
  </div>

  <div style="margin-bottom:14px;">
    <label for="user-raw-goal" style="display:block;font-size:0.82rem;font-weight:600;color:var(--text);margin-bottom:4px;">
      What do you want the AI to achieve? (Your rough idea):
    </label>
    <input type="text" id="user-raw-goal" placeholder="e.g. Audit a software contract for hidden liability risks, or write a viral hook for a music launch" value="Create a launch strategy for an independent music artist transitioning to Web3" style="width:100%;box-sizing:border-box;padding:10px 14px;border-radius:8px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);color:inherit;font-size:0.9rem;">
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
    <div>
      <label for="user-constraints" style="display:block;font-size:0.8rem;color:var(--muted);margin-bottom:4px;">
        Specific Constraints / What to avoid:
      </label>
      <input type="text" id="user-constraints" placeholder="e.g. Zero marketing buzzwords; under 300 words; realistic budget under £500" style="width:100%;box-sizing:border-box;padding:8px 12px;border-radius:6px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.12);color:inherit;font-size:0.82rem;">
    </div>
    <div>
      <label for="user-context" style="display:block;font-size:0.8rem;color:var(--muted);margin-bottom:4px;">
        Target Audience / Persona context:
      </label>
      <input type="text" id="user-context" placeholder="e.g. UK hip-hop listeners aged 18-35 and tech-forward crypto creators" style="width:100%;box-sizing:border-box;padding:8px 12px;border-radius:6px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.12);color:inherit;font-size:0.82rem;">
    </div>
  </div>

  <div style="display:flex;gap:10px;margin-bottom:16px;">
    <button type="button" id="build-prompt-btn" style="flex:1;padding:12px;border-radius:10px;background:linear-gradient(135deg, #00ffcc, #00bbff);border:none;color:#050811;font-weight:800;font-size:0.95rem;cursor:pointer;box-shadow:0 4px 15px rgba(0,255,204,0.25);">
      ⚡ Architect Elite Prompt
    </button>
  </div>

  <!-- Architected Output Box -->
  <div style="position:relative;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <span style="font-size:0.8rem;font-weight:700;color:var(--accent);">Constructed Prompt Canvas</span>
      <span id="prompt-stats" style="font-size:0.75rem;color:var(--muted);">Est. ~140 Tokens</span>
    </div>
    <textarea id="architected-prompt-output" rows="10" readonly style="width:100%;box-sizing:border-box;padding:14px;border-radius:10px;background:#050811;border:1px solid rgba(0,255,204,0.3);color:#e6faff;font-family:'JetBrains Mono', monospace;font-size:0.85rem;line-height:1.5;resize:vertical;"></textarea>
    <button type="button" id="copy-prompt-btn" style="position:absolute;top:38px;right:14px;padding:6px 14px;border-radius:6px;background:var(--accent);color:#050811;border:none;font-weight:700;font-size:0.78rem;cursor:pointer;">
      📋 Copy Prompt
    </button>
  </div>
</form>

<script>
(function() {
  const frameworkSel = document.getElementById('prompt-framework-select');
  const modelSel = document.getElementById('prompt-target-model');
  const formatSel = document.getElementById('prompt-output-format');
  const goalInput = document.getElementById('user-raw-goal');
  const constraintsInput = document.getElementById('user-constraints');
  const contextInput = document.getElementById('user-context');
  const buildBtn = document.getElementById('build-prompt-btn');
  const output = document.getElementById('architected-prompt-output');
  const stats = document.getElementById('prompt-stats');
  const copyBtn = document.getElementById('copy-prompt-btn');

  function synthesizePrompt() {
    const goal = goalInput.value.trim() || 'Provide strategic guidance and concrete execution steps.';
    const constraints = constraintsInput.value.trim() || 'Avoid generic corporate clichés, fluff, and superficial generalities.';
    const context = contextInput.value.trim() || 'Global digital innovators and analytical problem solvers.';
    const framework = frameworkSel.value;
    const model = modelSel.value;
    const format = formatSel.value;

    let result = '';

    if (framework === 'rtco') {
      result = `<system_role>
You are an elite, world-class domain authority and tactical advisor with decades of field-tested mastery. Your thinking is rigorous, direct, and unencumbered by corporate filler.
</system_role>

<context>
Target Stakeholder / Demographic: ${context}
</context>

<task>
Execute the following objective with ruthless clarity:
${goal}
</task>

<constraints>
- ${constraints}
- Ground all recommendations in first-principles logic and empirical feasibility.
- Maintain high information density; prioritize tactical leverage over narrative fluff.
</constraints>

<output_schema>
Deliver your response in formatted ${format}. Ensure all deliverables are actionable without requiring follow-up clarification.
</output_schema>`;
    } else if (framework === 'cot') {
      result = `You are a high-level cognitive strategist and systems architect.

GOAL:
${goal}

OPERATIONAL CONTEXT:
${context}

EXECUTION PROTOCOL (Chain-of-Thought):
1. DECONSTRUCT: Break down the root problem into its atomic variables.
2. HYPOTHESIS & ANALYSIS: Evaluate at least three distinct paths forward, identifying failure modes for each.
3. SYNTHESIS: Formulate the optimal, highest-leverage solution.
4. ACTION MATRIX: Deliver an uncompromising implementation roadmap.

CONSTRAINTS & GUARDRAILS:
- ${constraints}
- Never jump to conclusions before showing your step-by-step intermediate reasoning.

FORMAT:
Present in ${format}.`;
    } else if (framework === 'tot') {
      result = `<role>
You are a panel of three world-class experts (The Pragmatic Operator, The Skeptical Risk Auditor, and The Innovative Growth Architect) analyzing a mission-critical challenge.
</role>

<objective>
${goal}
</objective>

<context>
${context}
</context>

<process>
Step 1: Have each expert propose their independent thesis.
Step 2: Have them challenge each other's vulnerabilities and identify hidden assumptions.
Step 3: Synthesize their consensus into an infallible master blueprint.
</process>

<negative_constraints>
${constraints}
</negative_constraints>

<output>
Deliver in structured ${format}.
</output>`;
    } else if (framework === 'fewshot') {
      result = `Role: Senior Domain Specialist
Task: ${goal}
Audience / Context: ${context}

[EXEMPLAR INPUT]
Scenario: Vague or ineffective execution
Analysis: Surface-level advice with generic platitudes.
Correction: Precise tactical breakdown with measurable KPI milestones.

[LIVE EXECUTION]
Execute for this specific goal:
${goal}

Strict Constraints:
- ${constraints}
- Deliver format: ${format}`;
    } else {
      result = `Act as an uncompromising Socratic Mentor and master diagnostic interviewer.

Objective: ${goal}
Context: ${context}

Protocol:
1. Challenge my premise: What blind spots or false assumptions might I be making?
2. Stress-test the viability against these constraints: "${constraints}".
3. Provide the strongest counter-intuitive insight that most amateurs overlook.
4. Outline the exact tactical solution in ${format}.`;
    }

    output.value = result;
    const words = result.split(/\s+/).length;
    stats.textContent = `Est. ~${Math.round(words * 1.3)} Tokens (${words} words)`;
  }

  buildBtn.addEventListener('click', synthesizePrompt);

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(output.value).then(() => {
      copyBtn.textContent = '✅ Copied!';
      setTimeout(() => copyBtn.textContent = '📋 Copy Prompt', 2000);
    });
  });

  // Initial build
  synthesizePrompt();
})();
</script>
