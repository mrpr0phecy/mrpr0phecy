<h2>🔤 Case Converter</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Convert text between uppercase, lowercase, title case, sentence case, and more. Instant transformation.</p>

<div id="cc-app" style="max-width:600px;margin:0 auto;">
  <div style="margin-bottom:12px;">
    <textarea id="cc-input" style="width:100%;height:120px;padding:12px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;resize:vertical;box-sizing:border-box;" placeholder="Type or paste your text here...">The quick brown fox jumps over the lazy dog.</textarea>
  </div>

  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">
    <button onclick="window._ccConvert('upper')" style="padding:8px 14px;background:rgba(45,212,255,0.1);border:1px solid rgba(45,212,255,0.3);border-radius:6px;color:#2dd4ff;cursor:pointer;font-size:13px;">UPPER</button>
    <button onclick="window._ccConvert('lower')" style="padding:8px 14px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.3);border-radius:6px;color:#39ff14;cursor:pointer;font-size:13px;">lower</button>
    <button onclick="window._ccConvert('title')" style="padding:8px 14px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.3);border-radius:6px;color:#ffa500;cursor:pointer;font-size:13px;">Title Case</button>
    <button onclick="window._ccConvert('sentence')" style="padding:8px 14px;background:rgba(192,96,240,0.1);border:1px solid rgba(192,96,240,0.3);border-radius:6px;color:#c060f0;cursor:pointer;font-size:13px;">Sentence case</button>
    <button onclick="window._ccConvert('toggle')" style="padding:8px 14px;background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.3);border-radius:6px;color:#ff4d4d;cursor:pointer;font-size:13px;">tOGGLE</button>
    <button onclick="window._ccConvert('camel')" style="padding:8px 14px;background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.3);border-radius:6px;color:#ffd700;cursor:pointer;font-size:13px;">camelCase</button>
    <button onclick="window._ccConvert('snake')" style="padding:8px 14px;background:rgba(0,255,255,0.1);border:1px solid rgba(0,255,255,0.3);border-radius:6px;color:#00ffff;cursor:pointer;font-size:13px;">snake_case</button>
    <button onclick="window._ccConvert('kebab')" style="padding:8px 14px;background:rgba(255,192,203,0.1);border:1px solid rgba(255,192,203,0.3);border-radius:6px;color:#ffc0cb;cursor:pointer;font-size:13px;">kebab-case</button>
    <button onclick="window._ccConvert('reverse')" style="padding:8px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:rgba(230,250,255,0.6);cursor:pointer;font-size:13px;">esreveR</button>
  </div>

  <div style="margin-bottom:12px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <label style="color:#2dd4ff;font-size:13px;">Result</label>
      <button onclick="window._ccCopy()" style="padding:4px 10px;background:rgba(45,212,255,0.1);border:1px solid rgba(45,212,255,0.2);border-radius:4px;color:#2dd4ff;cursor:pointer;font-size:12px;">📋 Copy</button>
    </div>
    <textarea id="cc-output" readonly style="width:100%;height:120px;padding:12px;border-radius:8px;border:1px solid rgba(45,212,255,0.1);background:rgba(0,0,0,0.2);color:#39ff14;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>
  </div>

  <div id="cc-stats" style="font-size:12px;color:rgba(230,250,255,0.4);text-align:center;"></div>
</div>

<script>
(function(){
  function convert(type){
    var text=document.getElementById('cc-input').value;
    var result='';
    switch(type){
      case 'upper':result=text.toUpperCase();break;
      case 'lower':result=text.toLowerCase();break;
      case 'title':result=text.toLowerCase().replace(/\b\w/g,function(l){return l.toUpperCase();});break;
      case 'sentence':result=text.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g,function(l){return l.toUpperCase();});break;
      case 'toggle':result=text.split('').map(function(c){return c===c.toUpperCase()?c.toLowerCase():c.toUpperCase();}).join('');break;
      case 'camel':result=text.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g,function(m,c){return c.toUpperCase();}).replace(/^[A-Z]/,function(c){return c.toLowerCase();});break;
      case 'snake':result=text.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');break;
      case 'kebab':result=text.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');break;
      case 'reverse':result=text.split('').reverse().join('');break;
    }
    document.getElementById('cc-output').value=result;
    document.getElementById('cc-stats').textContent=result.length+' characters · '+result.split(/\s+/).filter(function(w){return w;}).length+' words';
  }
  function copy(){
    var out=document.getElementById('cc-output');
    out.select();document.execCommand('copy');
  }
  window._ccConvert=convert;window._ccCopy=copy;
  document.getElementById('cc-input').addEventListener('input',function(){convert('upper');});
  convert('upper');
})();
</script>
