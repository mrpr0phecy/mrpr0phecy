<!-- cards/screw-drill-chart.html -->
<h2 id="scrdrill-title" style="margin-top:0;color:var(--accent);">🔩 Screw & Drill Bit Size Chart</h2>

<form aria-describedby="scrdrill-desc" onsubmit="event.preventDefault();">
  <p id="scrdrill-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Look up the right drill bit for any screw size, wall plug colour, and pilot hole diameter. No more guessing.
  </p>

  <div style="margin-bottom:14px;">
    <label for="scrdrill-screw" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Screw Gauge (e.g. 4, 6, 8, 10)</label>
    <select id="scrdrill-screw" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="3">No. 3 (2.5mm shaft)</option>
      <option value="4">No. 4 (3.0mm shaft)</option>
      <option value="6" selected>No. 6 (3.5mm shaft)</option>
      <option value="8">No. 8 (4.0mm shaft)</option>
      <option value="10">No. 10 (5.0mm shaft)</option>
      <option value="12">No. 12 (5.5mm shaft)</option>
      <option value="14">No. 14 (6.5mm shaft)</option>
    </select>
  </div>

  <div style="margin-bottom:14px;">
    <label for="scrdrill-use" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">What are you fixing into?</label>
    <select id="scrdrill-use" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="softwood">Softwood (pine, cedar)</option>
      <option value="hardwood">Hardwood (oak, walnut, maple)</option>
      <option value="mdf">MDF / Plywood</option>
      <option value="masonry">Brick / Block (with wall plug)</option>
      <option value="plasterboard">Plasterboard (with anchor)</option>
    </select>
  </div>

  <button type="button" onclick="scrdrillLookup()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🔍 Look Up Sizes
  </button>

  <div id="scrdrill-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);">
    <div id="scrdrill-pilot" style="font-size:1.1rem;color:var(--accent);font-weight:700;margin-bottom:10px;"></div>
    <div id="scrdrill-plug" style="font-size:0.95rem;color:var(--text);margin-bottom:10px;"></div>
    <div id="scrdrill-drill" style="font-size:0.95rem;color:var(--text);margin-bottom:10px;"></div>
    <div id="scrdrill-table" style="margin-bottom:12px;"></div>
    <div id="scrdrill-tips" style="font-size:0.8rem;color:var(--text-secondary);line-height:1.6;"></div>
  </div>
</form>

<script>
(function(){
  var scrdrillData={
    3:{shaft:2.5,pilot:{softwood:1.5,hardwood:2.0,mdf:1.5,masonry:5,plasterboard:6},plug:'Yellow (5mm)',drillMasonry:'5mm masonry bit',drillPlaster:'6mm'},
    4:{shaft:3.0,pilot:{softwood:2.0,hardwood:2.5,mdf:2.0,masonry:6,plasterboard:6},plug:'Yellow (5mm) or Red (6mm)',drillMasonry:'6mm masonry bit',drillPlaster:'6mm'},
    6:{shaft:3.5,pilot:{softwood:2.5,hardwood:3.0,mdf:2.5,masonry:6,plasterboard:7},plug:'Red (6mm) or Brown (7mm)',drillMasonry:'6mm or 7mm masonry bit',drillPlaster:'7mm'},
    8:{shaft:4.0,pilot:{softwood:3.0,hardwood:3.5,mdf:3.0,masonry:7,plasterboard:8},plug:'Brown (7mm) or Rawl 8mm',drillMasonry:'7mm or 8mm masonry bit',drillPlaster:'8mm'},
    10:{shaft:5.0,pilot:{softwood:3.5,hardwood:4.0,mdf:3.5,masonry:8,plasterboard:10},plug:'Blue (10mm) or 8mm plug',drillMasonry:'8mm or 10mm masonry bit',drillPlaster:'10mm'},
    12:{shaft:5.5,pilot:{softwood:4.0,hardwood:4.5,mdf:4.0,masonry:10,plasterboard:12},plug:'10mm or 12mm plug',drillMasonry:'10mm masonry bit',drillPlaster:'12mm'},
    14:{shaft:6.5,pilot:{softwood:4.5,hardwood:5.0,mdf:4.5,masonry:12,plasterboard:14},plug:'12mm plug or sleeve anchor',drillMasonry:'12mm masonry bit',drillPlaster:'14mm'}
  };

  window.scrdrillLookup=function(){
    var screw=parseInt(document.getElementById('scrdrill-screw').value);
    var use=document.getElementById('scrdrill-use').value;
    var d=scrdrillData[screw];
    var pilot=d.pilot[use];
    var isMasonry=(use==='masonry');
    var isPlaster=(use==='plasterboard');
    document.getElementById('scrdrill-pilot').innerHTML='🔧 Screw No. '+screw+' ('+d.shaft+'mm shaft)';
    if(isMasonry){
      document.getElementById('scrdrill-plug').innerHTML='🧱 Wall plug: <strong>'+d.plug+'</strong>';
      document.getElementById('scrdrill-drill').innerHTML='🔩 Drill bit: <strong>'+d.drillMasonry+'</strong>';
    } else if(isPlaster){
      document.getElementById('scrdrill-plug').innerHTML='🧱 Anchor: <strong>Use plasterboard anchor rated for your load</strong>';
      document.getElementById('scrdrill-drill').innerHTML='🔩 Drill bit: <strong>'+d.drillPlaster+'</strong>';
    } else {
      document.getElementById('scrdrill-plug').innerHTML='🪵 No wall plug needed — screw goes directly into material';
      document.getElementById('scrdrill-drill').innerHTML='🔩 Pilot hole: <strong>'+pilot+'mm drill bit</strong>';
    }
    var html='<table style="width:100%;border-collapse:collapse;font-size:0.8rem;">';
    html+='<tr style="border-bottom:1px solid rgba(255,255,255,0.1);"><th style="text-align:left;padding:6px;color:var(--accent);">Material</th><th style="text-align:center;padding:6px;color:var(--accent);">Pilot Hole</th></tr>';
    var mats={softwood:'Softwood',hardwood:'Hardwood',mdf:'MDF/Plywood',masonry:'Masonry (plug)',plasterboard:'Plasterboard'};
    for(var m in mats){
      var sel=m===use?' style="color:var(--accent);font-weight:700;"':'';
      html+='<tr'+sel+'><td style="padding:6px;border-bottom:1px solid rgba(255,255,255,0.05);">'+mats[m]+'</td><td style="text-align:center;padding:6px;border-bottom:1px solid rgba(255,255,255,0.05);">'+d.pilot[m]+'mm</td></tr>';
    }
    html+='</table>';
    document.getElementById('scrdrill-table').innerHTML=html;
    document.getElementById('scrdrill-tips').innerHTML='💡 <strong>Pilot hole rule:</strong> For softwood, use 60–70% of the shaft diameter. For hardwood, use 80–90%.<br>💡 <strong>Wall plug colours</strong> (UK standard): Yellow=5mm, Red=6mm, Brown=7mm, Blue=10mm, Grey=12mm.<br>💡 <strong>Always drill pilot holes in hardwood</strong> — without them, screws split the grain.';
    document.getElementById('scrdrill-result').style.display='block';
  };
})();
</script>
