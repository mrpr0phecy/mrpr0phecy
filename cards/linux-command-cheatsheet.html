    catsEl.querySelectorAll('button').forEach(b=>{b.onclick=function(){activeCat=this.dataset.cat;renderCats();render()}});
    catsEl.querySelector('[data-cat="'+activeCat+'"]').style.background='#2a2a10';
    catsEl.querySelector('[data-cat="'+activeCat+'"]').style.color='#f0e040';
  }
  function render(){
    const q=searchEl.value.toLowerCase().trim();
    let filtered=cmds;
    if(activeCat!=='all')filtered=filtered.filter(c=>c.cat===activeCat);
    if(q)filtered=filtered.filter(c=>c.cmd.includes(q)||c.desc.toLowerCase().includes(q)||c.ex.toLowerCase().includes(q)||(c.flags&&c.flags.toLowerCase().includes(q)));
    let html='';
    filtered.forEach(c=>{
      html+='<div style="padding:8px 12px;margin-bottom:4px;background:#0a0a08;border-radius:6px;border:1px solid #1a1a10;cursor:pointer" onclick="navigator.clipboard.writeText(\''+c.ex.replace(/'/g,"\\'")+'\');this.style.borderColor=\'#f0e040\';setTimeout(()=>this.style.borderColor=\'#1a1a10\',800)">'+
        '<div style="display:flex;justify-content:space-between;align-items:center"><span style="color:#f0e040;font-weight:bold;font-family:monospace;font-size:0.95em">'+c.cmd+'</span>'+
        '<span style="font-size:0.75em;color:#606040">'+(catLabels[c.cat]||c.cat)+'</span></div>'+
        '<div style="font-size:0.85em;color:#b0a060;margin-top:2px">'+c.desc+'</div>'+
        '<div style="font-size:0.8em;color:#808060;margin-top:3px;font-family:monospace;background:#060604;padding:3px 6px;border-radius:4px">'+c.ex+'</div>'+
        (c.flags?'<div style="font-size:0.75em;color:#606040;margin-top:3px">Flags: '+c.flags+'</div>':'')+'</div>';
    });
    resultsEl.innerHTML=html||'<div style="text-align:center;padding:20px;color:#606040">No commands found</div>';
    countEl.textContent=filtered.length+' of '+cmds.length+' commands';
  }
  renderCats();render();
  searchEl.oninput=render;
})();
</script>
