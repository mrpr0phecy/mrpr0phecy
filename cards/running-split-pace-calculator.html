<h2 id="rspl-title" style="margin-top:0;color:var(--accent);">🏃 Running Split Pace Calculator</h2>

<form aria-describedby="rspl-desc" onsubmit="event.preventDefault();">
  <p id="rspl-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Target time for a race distance → pace per km and per mile, plus even kilometre splits. Negative splits are a planning aid, not a training plan.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="rspl-dist" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Distance</label>
      <select id="rspl-dist" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="5">5 km</option>
        <option value="10">10 km</option>
        <option value="21.0975" selected>Half marathon</option>
        <option value="42.195">Marathon</option>
        <option value="custom">Custom km</option>
      </select>
    </div>
    <div>
      <label for="rspl-custom" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Custom km</label>
      <input id="rspl-custom" type="number" min="0.1" step="any" value="8" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="rspl-h" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Hours</label>
      <input id="rspl-h" type="number" min="0" step="1" value="1" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="rspl-m" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Minutes</label>
      <input id="rspl-m" type="number" min="0" max="59" step="1" value="45" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="rspl-s" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Seconds</label>
      <input id="rspl-s" type="number" min="0" max="59" step="1" value="0" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="rspl-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function clock(sec) {
    if (!isFinite(sec) || sec < 0) return '—';
    sec = Math.round(sec);
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    function z(n) { return (n < 10 ? '0' : '') + n; }
    return h > 0 ? h + ':' + z(m) + ':' + z(s) : m + ':' + z(s);
  }
  function run() {
    var sel = $('rspl-dist').value;
    var km = sel === 'custom' ? Number($('rspl-custom').value) : Number(sel);
    var total = Number($('rspl-h').value) * 3600 + Number($('rspl-m').value) * 60 + Number($('rspl-s').value);
    if (!(km > 0) || !(total > 0)) {
      $('rspl-out').textContent = 'Enter a distance and a finishing time.';
      return;
    }
    var perKm = total / km;
    var perMi = total / (km / 1.609344);
    var miles = km / 1.609344;
    var rows = '';
    var n = Math.floor(km);
    for (var i = 1; i <= n; i++) {
      rows += '<tr><td style="padding:4px 8px;">' + i + ' km</td><td style="padding:4px 8px;">' + clock(perKm * i) + '</td></tr>';
    }
    if (km - n > 0.01) rows += '<tr><td style="padding:4px 8px;">' + km.toFixed(3) + ' km (finish)</td><td style="padding:4px 8px;">' + clock(total) + '</td></tr>';
    $('rspl-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Pace / km', clock(perKm)) +
      cell('Pace / mile', clock(perMi)) +
      cell('Distance miles', miles.toFixed(2)) +
      '</div><table style="margin-top:12px;width:100%;border-collapse:collapse;font-size:.85rem;"><thead><tr><th style="text-align:left;padding:4px 8px;">Split</th><th style="text-align:left;padding:4px 8px;">Clock</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }
  ['rspl-dist', 'rspl-custom', 'rspl-h', 'rspl-m', 'rspl-s'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
