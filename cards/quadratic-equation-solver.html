<h2 id="quad-title" style="margin-top:0;color:var(--accent);">𝑥² Quadratic Equation Solver</h2>

<form aria-describedby="quad-desc" onsubmit="event.preventDefault();">
  <p id="quad-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Roots of <strong>ax² + bx + c = 0</strong> via the discriminant Δ = b² − 4ac. Complex roots are shown as a ± bi. Coefficients can be any real numbers, with a ≠ 0.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="quad-a" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">a</label>
      <input id="quad-a" type="number" step="any" value="1" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="quad-b" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">b</label>
      <input id="quad-b" type="number" step="any" value="-5" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="quad-c" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">c</label>
      <input id="quad-c" type="number" step="any" value="6" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="quad-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function fmt(n) {
    if (!isFinite(n)) return String(n);
    var s = n.toPrecision(10).replace(/\.?0+$/, '');
    return s;
  }
  function run() {
    var a = Number($('quad-a').value), b = Number($('quad-b').value), c = Number($('quad-c').value);
    if (a === 0 || !isFinite(a) || !isFinite(b) || !isFinite(c)) {
      $('quad-out').textContent = 'a must be a non-zero number; b and c must be finite.';
      return;
    }
    var d = b * b - 4 * a * c;
    var vertex = -b / (2 * a);
    var html;
    if (d > 0) {
      var s = Math.sqrt(d);
      var x1 = (-b + s) / (2 * a), x2 = (-b - s) / (2 * a);
      html = cell('Discriminant Δ', fmt(d)) + cell('Two real roots', fmt(x1) + '  and  ' + fmt(x2));
    } else if (d === 0) {
      html = cell('Discriminant Δ', '0') + cell('Repeated root', fmt(vertex));
    } else {
      var re = -b / (2 * a);
      var im = Math.sqrt(-d) / (2 * Math.abs(a));
      var signIm = a < 0 ? -im : im;
      html = cell('Discriminant Δ', fmt(d)) +
        cell('Complex roots', fmt(re) + ' ± ' + fmt(Math.abs(signIm)) + ' i');
    }
    html += cell('Axis of symmetry', 'x = ' + fmt(vertex)) + cell('Sum −b/a', fmt(-b / a)) + cell('Product c/a', fmt(c / a));
    $('quad-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;">' + html + '</div>';
  }
  ['quad-a', 'quad-b', 'quad-c'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
