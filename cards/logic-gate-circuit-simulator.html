<h2 id="lgs-title" style="margin-top:0;color:var(--accent);">⚡ Logic Gate Simulator</h2>

<form aria-describedby="lgs-desc" onsubmit="event.preventDefault();">
  <p id="lgs-desc" class="small" style="color:var(--muted);margin-bottom:14px;">
    Simulate fundamental boolean logic gates (AND, OR, XOR, NAND) and digital circuits with live voltage probes and dynamic truth tables.
  </p>

  <!-- Gate Selector Tabs -->
  <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;">
    <button type="button" class="lgs-gate-btn active" data-gate="AND" style="padding:5px 10px;border-radius:4px;background:rgba(45,212,255,0.2);border:1px solid #2dd4ff;color:#2dd4ff;font-weight:bold;font-size:0.75rem;cursor:pointer;">AND</button>
    <button type="button" class="lgs-gate-btn" data-gate="OR" style="padding:5px 10px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.75rem;cursor:pointer;">OR</button>
    <button type="button" class="lgs-gate-btn" data-gate="XOR" style="padding:5px 10px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.75rem;cursor:pointer;">XOR</button>
    <button type="button" class="lgs-gate-btn" data-gate="NAND" style="padding:5px 10px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.75rem;cursor:pointer;">NAND</button>
    <button type="button" class="lgs-gate-btn" data-gate="NOR" style="padding:5px 10px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.75rem;cursor:pointer;">NOR</button>
    <button type="button" class="lgs-gate-btn" data-gate="NOT" style="padding:5px 10px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.75rem;cursor:pointer;">NOT</button>
  </div>

  <!-- Interactive Breadboard Canvas -->
  <div style="background:#060a0f;border:1px solid rgba(45,212,255,0.3);border-radius:10px;padding:16px;margin-bottom:14px;position:relative;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div style="font-size:0.7rem;color:var(--muted);">INTERACTIVE LOGIC BREADBOARD</div>
      <div id="lgs-gate-label" style="font-size:0.8rem;font-weight:bold;color:#00ffcc;">AND Gate (Q = A · B)</div>
    </div>

    <!-- Signal Flow Schematic -->
    <div style="display:grid;grid-template-columns:100px 1fr 100px;gap:12px;align-items:center;">
      <!-- Inputs Column -->
      <div style="display:flex;flex-direction:column;gap:16px;">
        <!-- Input A -->
        <div style="display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.4);padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);">
          <span style="font-size:0.75rem;color:var(--muted);">In A:</span>
          <button type="button" id="lgs-toggle-a" style="width:34px;height:26px;border-radius:4px;border:1px solid #ff4d4d;background:rgba(255,77,77,0.2);color:#ff4d4d;font-family:monospace;font-weight:bold;cursor:pointer;">0</button>
        </div>

        <!-- Input B -->
        <div id="lgs-input-b-wrapper" style="display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.4);padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);">
          <span style="font-size:0.75rem;color:var(--muted);">In B:</span>
          <button type="button" id="lgs-toggle-b" style="width:34px;height:26px;border-radius:4px;border:1px solid #ff4d4d;background:rgba(255,77,77,0.2);color:#ff4d4d;font-family:monospace;font-weight:bold;cursor:pointer;">0</button>
        </div>
      </div>

      <!-- Center Gate Icon & Symbol -->
      <div style="text-align:center;padding:10px;">
        <div id="lgs-gate-symbol" style="display:inline-block;padding:12px 20px;border-radius:8px;background:rgba(45,212,255,0.1);border:2px solid #2dd4ff;font-family:monospace;font-size:1.4rem;font-weight:bold;color:#2dd4ff;letter-spacing:2px;">
          [ &amp; ]
        </div>
        <div id="lgs-wire-status" style="font-size:0.7rem;color:var(--muted);margin-top:6px;">Inputs LOW ➔ Output LOW</div>
      </div>

      <!-- Output Column -->
      <div>
        <div style="background:rgba(0,0,0,0.4);padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);text-align:center;">
          <div style="font-size:0.68rem;color:var(--muted);margin-bottom:4px;">OUTPUT (Q)</div>
          <div id="lgs-output-state" style="font-family:monospace;font-size:1.8rem;font-weight:900;color:#ff4d4d;line-height:1;">0</div>
          <div id="lgs-output-voltage" style="font-size:0.68rem;color:var(--muted);margin-top:2px;">0.0 V (LOW)</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Live Truth Table -->
  <div style="background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:10px;">
    <div style="font-size:0.72rem;font-weight:bold;color:var(--accent);margin-bottom:6px;">BOOLEAN TRUTH TABLE:</div>
    <table id="lgs-truth-table" style="width:100%;border-collapse:collapse;font-size:0.75rem;text-align:center;font-family:monospace;">
      <!-- Populated via JS -->
    </table>
  </div>
</form>

<script>
(function() {
  const btnA = document.getElementById('lgs-toggle-a');
  const btnB = document.getElementById('lgs-toggle-b');
  const bWrapper = document.getElementById('lgs-input-b-wrapper');

  const gateLabel = document.getElementById('lgs-gate-label');
  const gateSymbol = document.getElementById('lgs-gate-symbol');
  const wireStatus = document.getElementById('lgs-wire-status');
  const outState = document.getElementById('lgs-output-state');
  const outVolt = document.getElementById('lgs-output-voltage');
  const truthTable = document.getElementById('lgs-truth-table');

  let currentGate = 'AND';
  let stateA = 0;
  let stateB = 0;

  const GATE_DATA = {
    'AND':  { label: 'AND Gate (Q = A · B)', symbol: '[ & ]', fn: (a, b) => a && b },
    'OR':   { label: 'OR Gate (Q = A + B)', symbol: '[ ≥1 ]', fn: (a, b) => a || b },
    'XOR':  { label: 'XOR Gate (Q = A ⊕ B)', symbol: '[ =1 ]', fn: (a, b) => a !== b ? 1 : 0 },
    'NAND': { label: 'NAND Gate (Q = ¬(A · B))', symbol: '[ ¬& ]', fn: (a, b) => !(a && b) ? 1 : 0 },
    'NOR':  { label: 'NOR Gate (Q = ¬(A + B))', symbol: '[ ¬≥1 ]', fn: (a, b) => !(a || b) ? 1 : 0 },
    'NOT':  { label: 'NOT Inverter (Q = ¬A)', symbol: '[ 1 ➔ 0 ]', fn: (a) => !a ? 1 : 0 }
  };

  function update() {
    const isNot = currentGate === 'NOT';
    bWrapper.style.display = isNot ? 'none' : 'flex';

    const gate = GATE_DATA[currentGate];
    gateLabel.textContent = gate.label;
    gateSymbol.textContent = gate.symbol;

    const out = gate.fn(stateA, stateB) ? 1 : 0;

    // Output visual
    if (out === 1) {
      outState.textContent = '1';
      outState.style.color = '#00ffcc';
      outVolt.textContent = '+5.0 V (HIGH)';
      outVolt.style.color = '#00ffcc';
      gateSymbol.style.borderColor = '#00ffcc';
      gateSymbol.style.color = '#00ffcc';
      gateSymbol.style.boxShadow = '0 0 12px rgba(0,255,204,0.3)';
    } else {
      outState.textContent = '0';
      outState.style.color = '#ff4d4d';
      outVolt.textContent = '0.0 V (LOW)';
      outVolt.style.color = 'var(--muted)';
      gateSymbol.style.borderColor = '#2dd4ff';
      gateSymbol.style.color = '#2dd4ff';
      gateSymbol.style.boxShadow = 'none';
    }

    wireStatus.textContent = `A=${stateA}${isNot ? '' : ' & B=' + stateB} ➔ Q=${out}`;

    // Render Truth Table
    let tableHtml = '';
    if (isNot) {
      tableHtml = `
        <thead>
          <tr style="border-bottom:1px solid rgba(255,255,255,0.1);color:var(--muted);">
            <th style="padding:4px;">Input A</th>
            <th style="padding:4px;">Output Q</th>
          </tr>
        </thead>
        <tbody>
          <tr style="${stateA === 0 ? 'background:rgba(0,255,204,0.15);color:#00ffcc;' : ''}"><td style="padding:4px;">0</td><td style="padding:4px;">1</td></tr>
          <tr style="${stateA === 1 ? 'background:rgba(0,255,204,0.15);color:#00ffcc;' : ''}"><td style="padding:4px;">1</td><td style="padding:4px;">0</td></tr>
        </tbody>
      `;
    } else {
      const combinations = [
        [0, 0],
        [0, 1],
        [1, 0],
        [1, 1]
      ];
      tableHtml = `
        <thead>
          <tr style="border-bottom:1px solid rgba(255,255,255,0.1);color:var(--muted);">
            <th style="padding:4px;">Input A</th>
            <th style="padding:4px;">Input B</th>
            <th style="padding:4px;">Output Q</th>
          </tr>
        </thead>
        <tbody>
      `;
      combinations.forEach(([a, b]) => {
        const rowOut = gate.fn(a, b) ? 1 : 0;
        const isActive = (a === stateA && b === stateB);
        tableHtml += `
          <tr style="${isActive ? 'background:rgba(0,255,204,0.15);color:#00ffcc;font-weight:bold;' : 'color:#e6faff;'}">
            <td style="padding:4px;">${a}</td>
            <td style="padding:4px;">${b}</td>
            <td style="padding:4px;color:${rowOut ? '#00ffcc' : '#ff4d4d'};">${rowOut}</td>
          </tr>
        `;
      });
      tableHtml += `</tbody>`;
    }
    truthTable.innerHTML = tableHtml;
  }

  function setBtnState(btn, val) {
    if (val === 1) {
      btn.textContent = '1';
      btn.style.borderColor = '#00ffcc';
      btn.style.background = 'rgba(0,255,204,0.2)';
      btn.style.color = '#00ffcc';
    } else {
      btn.textContent = '0';
      btn.style.borderColor = '#ff4d4d';
      btn.style.background = 'rgba(255,77,77,0.2)';
      btn.style.color = '#ff4d4d';
    }
  }

  btnA.addEventListener('click', () => {
    stateA = stateA === 1 ? 0 : 1;
    setBtnState(btnA, stateA);
    update();
  });

  btnB.addEventListener('click', () => {
    stateB = stateB === 1 ? 0 : 1;
    setBtnState(btnB, stateB);
    update();
  });

  document.querySelectorAll('.lgs-gate-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.lgs-gate-btn').forEach(b => {
        b.classList.remove('active');
        b.style.background = 'rgba(255,255,255,0.06)';
        b.style.borderColor = 'rgba(255,255,255,0.15)';
        b.style.color = '#fff';
      });
      btn.classList.add('active');
      btn.style.background = 'rgba(45,212,255,0.2)';
      btn.style.borderColor = '#2dd4ff';
      btn.style.color = '#2dd4ff';

      currentGate = btn.dataset.gate;
      update();
    });
  });

  update();
})();
</script>
