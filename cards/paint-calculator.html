<!-- cards/paint-calculator.html -->
<h2 id="pntcalc-title" style="margin-top:0;color:var(--accent);">🎨 Paint Calculator</h2>

<form aria-describedby="pntcalc-desc" onsubmit="event.preventDefault();">
  <p id="pntcalc-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Calculate exactly how much paint you need for any room. No more buying 5 tins for a cupboard.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="pntcalc-w" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Room Width (m)</label>
      <input id="pntcalc-w" type="number" step="0.1" min="0.5" value="4" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="pntcalc-l" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Room Length (m)</label>
      <input id="pntcalc-l" type="number" step="0.1" min="0.5" value="5" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="pntcalc-h" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Ceiling Height (m)</label>
      <input id="pntcalc-h" type="number" step="0.1" min="1" value="2.4" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="pntcalc-coats" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Number of Coats</label>
      <select id="pntcalc-coats" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="1">1 coat</option>
        <option value="2" selected>2 coats (recommended)</option>
        <option value="3">3 coats (dark over light)</option>
      </select>
    </div>
  </div>

  <div style="margin-bottom:12px;">
    <label style="display:block;margin-bottom:6px;color:var(--accent);font-size:0.85rem;font-weight:600;">Subtract for:</label>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <label style="display:flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:0.85rem;cursor:pointer;">
        <input type="checkbox" id="pntcalc-door" checked style="accent-color:var(--accent);"> 1 Door (1.9 m²)
      </label>
      <label style="display:flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:0.85rem;cursor:pointer;">
        <input type="checkbox" id="pntcalc-win" style="accent-color:var(--accent);"> 1 Window (1.4 m²)
      </label>
    </div>
  </div>

  <div style="margin-bottom:12px;">
    <label for="pntcalc-tin" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Tin Size (litres)</label>
    <select id="pntcalc-tin" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="0.5">0.5L (touch-ups)</option>
      <option value="1">1L (small room)</option>
      <option value="2.5" selected>2.5L (standard)</option>
      <option value="5">5L (large room)</option>
      <option value="10">10L (bulk)</option>
    </select>
  </div>

  <button type="button" onclick="pntcalcCalc()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🎨 Calculate Paint Needed
  </button>

  <div id="pntcalc-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(45,212,255,0.1);">
        <div style="font-size:0.75rem;color:var(--text-secondary);margin-bottom:4px;">Wall Area</div>
        <div id="pntcalc-area" style="font-size:1.3rem;color:var(--accent);font-weight:700;"></div>
      </div>
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(57,255,20,0.1);">
        <div style="font-size:0.75rem;color:var(--text-secondary);margin-bottom:4px;">Paint Needed</div>
        <div id="pntcalc-litres" style="font-size:1.3rem;color:#39ff14;font-weight:700;"></div>
      </div>
    </div>
    <div id="pntcalc-tins" style="text-align:center;font-size:1rem;color:var(--text);margin-bottom:8px;"></div>
    <div id="pntcalc-tip" style="font-size:0.8rem;color:var(--text-secondary);text-align:center;font-style:italic;"></div>
  </div>
</form>

<script>
(function(){
  window.pntcalcCalc = function(){
    var w=parseFloat(document.getElementById('pntcalc-w').value);
    var l=parseFloat(document.getElementById('pntcalc-l').value);
    var h=parseFloat(document.getElementById('pntcalc-h').value);
    var coats=parseInt(document.getElementById('pntcalc-coats').value);
    var tinSize=parseFloat(document.getElementById('pntcalc-tin').value);
    var door=document.getElementById('pntcalc-door').checked?1.9:0;
    var win=document.getElementById('pntcalc-win').checked?1.4:0;
    var perimeter=2*(w+l);
    var wallArea=perimeter*h;
    var openings=door+win;
    var paintArea=Math.max(wallArea-openings,1);
    var coveragePerLitre=12;
    var litresNeeded=(paintArea*coats)/coveragePerLitre;
    var tinsNeeded=Math.ceil(litresNeeded/tinSize);
    document.getElementById('pntcalc-area').textContent=paintArea.toFixed(1)+' m²';
    document.getElementById('pntcalc-litres').textContent=litresNeeded.toFixed(1)+' L';
    document.getElementById('pntcalc-tins').innerHTML='🛒 Buy <strong>'+tinsNeeded+'×</strong> '+tinSize+'L tin'+(tinsNeeded>1?'s':'');
    var tips=['💡 Stir paint thoroughly before use — shaking isn\'t enough.','💡 Use a primer if going from dark to light colours.','💡 Paint the ceiling first, then walls, then trim.','💡 Keep a small leftover tin for touch-ups later.','💡 Cut in (edges) with a brush before rolling the middle.'];
    document.getElementById('pntcalc-tip').textContent=tips[Math.floor(Math.random()*tips.length)];
    document.getElementById('pntcalc-result').style.display='block';
  };
})();
</script>
