<h2 id="qstr-title" style="margin-top:0;color:var(--accent);">🔗 Query String Parser</h2>

<form aria-describedby="qstr-desc" onsubmit="event.preventDefault();">
  <p id="qstr-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Split a URL or a raw <code style="color:var(--accent);">?a=1&amp;b=2</code> into keys. Duplicate keys become arrays. Build the other way from JSON. Uses the platform URLSearchParams — stays on this device.
  </p>
  <label for="qstr-in" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">URL or query</label>
  <textarea id="qstr-in" rows="4" spellcheck="false" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;">https://example.com/search?q=hello+world&amp;page=2&amp;tag=css&amp;tag=html</textarea>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">
    <button type="button" id="qstr-parse" style="padding:8px 14px;border-radius:8px;border:1px solid rgba(45,212,255,.4);background:rgba(45,212,255,.12);color:var(--accent);font-weight:700;cursor:pointer;min-height:36px;">Parse → JSON</button>
    <button type="button" id="qstr-build" style="padding:8px 14px;border-radius:8px;border:1px solid rgba(45,212,255,.4);background:rgba(45,212,255,.12);color:var(--accent);font-weight:700;cursor:pointer;min-height:36px;">JSON → query</button>
  </div>
</form>
<pre id="qstr-out" style="margin-top:14px;padding:12px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);overflow:auto;font-size:.8rem;white-space:pre-wrap;word-break:break-word;"></pre>
<p id="qstr-msg" style="margin:8px 0 0;font-size:.75rem;color:var(--text-secondary);"></p>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function queryOf(text) {
    var t = text.trim();
    var q = t;
    var hash = '';
    try {
      if (/^https?:/i.test(t)) {
        var u = new URL(t);
        q = u.search.replace(/^\?/, '');
        hash = u.hash || '';
      } else if (t.charAt(0) === '?') q = t.slice(1);
    } catch (e) {}
    var i = q.indexOf('#');
    if (i !== -1) { hash = q.slice(i); q = q.slice(0, i); }
    return { q: q, hash: hash };
  }
  function parse() {
    var parts = queryOf($('qstr-in').value);
    var sp = new URLSearchParams(parts.q);
    var obj = {};
    sp.forEach(function (val, key) {
      if (Object.prototype.hasOwnProperty.call(obj, key)) {
        if (!Array.isArray(obj[key])) obj[key] = [obj[key]];
        obj[key].push(val);
      } else obj[key] = val;
    });
    $('qstr-out').textContent = JSON.stringify(obj, null, 2);
    $('qstr-msg').textContent = (parts.hash ? 'Hash kept out of the query: ' + parts.hash + '. ' : '') + 'Keys: ' + Object.keys(obj).length + '.';
  }
  function build() {
    try {
      var obj = JSON.parse($('qstr-in').value);
      var sp = new URLSearchParams();
      Object.keys(obj).forEach(function (k) {
        var v = obj[k];
        if (Array.isArray(v)) v.forEach(function (x) { sp.append(k, x); });
        else if (v != null) sp.append(k, String(v));
      });
      $('qstr-out').textContent = sp.toString();
      $('qstr-msg').textContent = 'application/x-www-form-urlencoded.';
    } catch (e) {
      $('qstr-msg').textContent = 'JSON build needs an object in the box: ' + e.message;
    }
  }
  $('qstr-parse').addEventListener('click', parse);
  $('qstr-build').addEventListener('click', build);
  parse();
})();
</script>
