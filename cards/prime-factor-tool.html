<section class="math-tool"><h2 id="prime-factor-tool-title">🔍 Prime Factor Finder</h2><p id="prime-factor-tool-desc">Break a whole number into its prime factors and see whether it is prime.</p><input id="pf-n" type="number" min="2" value="360"><button id="pf-go">Factorise</button><div class="answer" id="pf-out"></div></section><style>.math-tool{max-width:720px;margin:auto;color:#e6faff}.math-tool h2{color:#2dd4ff}.math-tool p{color:#b7cbd2}.math-tool input{padding:12px;border-radius:8px;border:1px solid #285268;background:#101c25;color:#fff;font-size:16px;margin:14px 10px 14px 0}.math-tool button{padding:12px 22px;border:0;border-radius:8px;background:#2dd4ff;color:#06151c;font-weight:800;cursor:pointer}.answer{margin-top:18px;padding:18px;border-radius:10px;background:#102833;color:#39ff14;font-size:20px}</style><script>(()=>{const $=x=>document.getElementById(x);function go(){let n=Math.floor(+$('pf-n').value),orig=n,f=[];for(let d=2;d*d<=n;d++)while(n%d===0){f.push(d);n/=d}if(n>1)f.push(n);$('pf-out').textContent=`${orig} = ${f.join(' × ')}${f.length===1?' — prime number':''}`}$('pf-go').onclick=go;go()})()</script>
