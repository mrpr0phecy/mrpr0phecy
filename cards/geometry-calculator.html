<section class="math-tool"><h2>📐 Geometry Calculator</h2><p>Calculate the area, perimeter, or volume of common shapes.</p><label>Shape<select id="geo-shape"><option value="rect">Rectangle</option><option value="circle">Circle</option><option value="tri">Triangle</option><option value="sphere">Sphere</option></select></label><div class="grid"><label id="g1l">Width<input id="g1" type="number" value="8"></label><label id="g2l">Height<input id="g2" type="number" value="5"></label></div><button id="geo-go">Calculate</button><div class="answer" id="geo-out"></div></section><style>.math-tool{max-width:720px;margin:auto;color:#e6faff}.math-tool h2{color:#2dd4ff}.math-tool p{color:#b7cbd2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}.math-tool label{display:grid;gap:7px;color:#9deaff;margin:8px 0}.math-tool input,.math-tool select{padding:12px;border-radius:8px;border:1px solid #285268;background:#101c25;color:#fff;font-size:16px}.math-tool button{padding:12px 22px;border:0;border-radius:8px;background:#2dd4ff;color:#06151c;font-weight:800}.answer{margin-top:18px;padding:18px;border-radius:10px;background:#102833;color:#39ff14;font-size:18px;line-height:1.7}</style><script>(()=>{const $=x=>document.getElementById(x);function labels(){let c=$('geo-shape').value;$('g1l').firstChild.textContent=c==='circle'||c==='sphere'?'Radius':'Width';$('g2l').style.display=c==='circle'||c==='sphere'?'none':'';$('g2l').firstChild.textContent=c==='tri'?'Height':'Height'}function go(){let a=+$('g1').value,b=+$('g2').value,c=$('geo-shape').value,area,extra;if(c==='rect'){area=a*b;extra=`Perimeter: ${2*(a+b)}`}else if(c==='circle'){area=Math.PI*a*a;extra=`Circumference: ${(2*Math.PI*a).toFixed(2)}`}else if(c==='tri'){area=a*b/2;extra=`Perimeter needs all 3 sides`}else{area=4*Math.PI*a*a;extra=`Volume: ${(4/3*Math.PI*a*a*a).toFixed(2)}`} $('geo-out').innerHTML=`Area / surface area: <b>${area.toFixed(2)}</b><br>${extra}`}$('geo-shape').onchange=labels;$('geo-go').onclick=go;labels();go()})()</script>
