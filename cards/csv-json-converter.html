<h2 id="cjsn-title" style="margin-top:0;color:var(--accent);">⇄ CSV ⇄ JSON</h2>

<form aria-describedby="cjsn-desc" onsubmit="event.preventDefault();">
  <p id="cjsn-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    First CSV row is headers. Quoted fields and doubled quotes are honoured. JSON must be an array of objects. Conversion stays on this device.
  </p>
  <label for="cjsn-in" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">CSV or JSON</label>
  <textarea id="cjsn-in" rows="7" spellcheck="false" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;">name,qty
nails,200
screws,80</textarea>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">
    <button type="button" id="cjsn-toj" style="padding:9px 14px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-weight:800;font-size:.84rem;">CSV → JSON</button>
    <button type="button" id="cjsn-toc" style="padding:9px 14px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-weight:700;font-size:.84rem;">JSON → CSV</button>
    <button type="button" id="cjsn-copy" style="padding:9px 14px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-weight:700;font-size:.84rem;">Copy</button>
  </div>
</form>
<pre id="cjsn-out" style="margin-top:10px;padding:12px;border-radius:10px;background:#071019;border:1px solid rgba(45,212,255,.28);color:#91f7ff;font-size:.78rem;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;"></pre>
<p id="cjsn-err" style="margin:8px 0 0;font-size:.75rem;color:#ffb8b8;"></p>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function parseCsv(text) {
    var rows = [], row = [], cur = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text.charAt(i);
      if (q) {
        if (c === '"') {
          if (text.charAt(i + 1) === '"') { cur += '"'; i++; }
          else q = false;
        } else cur += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else if (c !== '\r') cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    if (!rows.length) return [];
    var heads = rows[0], out = [];
    for (var r = 1; r < rows.length; r++) {
      if (rows[r].length === 1 && rows[r][0] === '') continue;
      var o = {};
      for (var h = 0; h < heads.length; h++) o[heads[h]] = rows[r][h] == null ? '' : rows[r][h];
      out.push(o);
    }
    return out;
  }
  function toCsv(arr) {
    if (!arr.length) return '';
    var keys = Object.keys(arr[0]);
    function cell(v) {
      v = String(v == null ? '' : v);
      if (/[",\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
      return v;
    }
    var lines = [keys.map(cell).join(',')];
    arr.forEach(function (o) { lines.push(keys.map(function (k) { return cell(o[k]); }).join(',')); });
    return lines.join('\n');
  }
  $('cjsn-toj').addEventListener('click', function () {
    try {
      $('cjsn-err').textContent = '';
      $('cjsn-out').textContent = JSON.stringify(parseCsv($('cjsn-in').value), null, 2);
    } catch (e) { $('cjsn-err').textContent = 'Could not parse CSV.'; }
  });
  $('cjsn-toc').addEventListener('click', function () {
    try {
      $('cjsn-err').textContent = '';
      var data = JSON.parse($('cjsn-in').value);
      if (!Array.isArray(data)) throw 0;
      $('cjsn-out').textContent = toCsv(data);
    } catch (e) { $('cjsn-err').textContent = 'Need a JSON array of objects.'; }
  });
  $('cjsn-copy').addEventListener('click', function () {
    var btn = this, t = $('cjsn-out').textContent;
    function done() { btn.textContent = '✓ Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done); else done();
  });
})();
</script>
