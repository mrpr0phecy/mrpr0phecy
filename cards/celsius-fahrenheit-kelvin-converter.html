<h2 id="tmpk-title" style="margin-top:0;color:var(--accent);">🌡️ Celsius ⇄ Fahrenheit ⇄ Kelvin</h2>

<form aria-describedby="tmpk-desc" onsubmit="event.preventDefault();">
  <p id="tmpk-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    °F = °C × 9/5 + 32. Kelvin = °C + 273.15. Absolute zero is 0 K (−273.15 °C). Edit any box — weather, ovens and science labs all use different scales.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="tmpk-c" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Celsius</label>
      <input id="tmpk-c" type="number" step="any" value="20" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="tmpk-f" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Fahrenheit</label>
      <input id="tmpk-f" type="number" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="tmpk-k" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Kelvin</label>
      <input id="tmpk-k" type="number" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="tmpk-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var lock = false;
  function applyC(c) {
    if (!isFinite(c) || lock) return;
    var f = c * 9 / 5 + 32, k = c + 273.15;
    lock = true;
    $('tmpk-c').value = String(Number(c.toFixed(2)));
    $('tmpk-f').value = String(Number(f.toFixed(2)));
    $('tmpk-k').value = String(Number(k.toFixed(2)));
    lock = false;
    var note = c <= -273.15 ? 'At or below absolute zero — not a physical temperature.' :
      Math.abs(c) < 0.05 ? 'Water’s melting point at 1 atm is 0 °C / 32 °F / 273.15 K.' :
      Math.abs(c - 100) < 0.05 ? 'Water boils at 100 °C at 1 atm (lower at altitude).' :
      Math.abs(c - 37) < 0.15 ? 'Typical human core temperature is about 37 °C (98.6 °F).' :
      c < 0 ? 'Below freezing (at 1 atm).' : '';
    $('tmpk-out').innerHTML = '<p style="margin:0;font-size:.9rem;color:var(--text);"><strong style="color:var(--accent);">' + c.toFixed(1) + ' °C</strong> = ' + f.toFixed(1) + ' °F = ' + k.toFixed(2) + ' K</p>' +
      (note ? '<p style="margin:8px 0 0;font-size:.75rem;color:var(--text-secondary);">' + note + '</p>' : '');
  }
  $('tmpk-c').addEventListener('input', function () { applyC(Number($('tmpk-c').value)); });
  $('tmpk-f').addEventListener('input', function () { applyC((Number($('tmpk-f').value) - 32) * 5 / 9); });
  $('tmpk-k').addEventListener('input', function () { applyC(Number($('tmpk-k').value) - 273.15); });
  applyC(20);
})();
</script>
