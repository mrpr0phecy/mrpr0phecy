<h2 id="ucas-title" style="margin-top:0;color:var(--accent);">🎓 UCAS Tariff Points</h2>

<form aria-describedby="ucas-desc" onsubmit="event.preventDefault();">
  <p id="ucas-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Add A-level, AS and T Level grades to a running UCAS tariff total. Offers are often “BBB (120)” — this is the current A-level band (A* = 56). Always check the course page; some universities ignore AS or use grade combinations instead of points.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="ucas-kind" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Qualification</label>
      <select id="ucas-kind" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="A">A-level</option>
        <option value="AS">AS-level</option>
        <option value="T">T Level (whole)</option>
      </select>
    </div>
    <div>
      <label for="ucas-grade" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Grade</label>
      <select id="ucas-grade" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);"></select>
    </div>
    <button type="button" id="ucas-add" style="padding:10px 14px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-weight:800;font-size:.84rem;">Add</button>
  </div>
</form>
<div id="ucas-list" style="margin-top:12px;"></div>
<div id="ucas-out" style="margin-top:10px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var TABLES = {
    A: [['A*', 56], ['A', 48], ['B', 40], ['C', 32], ['D', 24], ['E', 16]],
    AS: [['A', 20], ['B', 16], ['C', 12], ['D', 10], ['E', 6]],
    T: [['D*', 168], ['D', 144], ['M', 120], ['P (A*A*-C)', 96], ['P (A*A*-D)', 72]]
  };
  var rows = [];
  function fillGrades() {
    var kind = $('ucas-kind').value;
    $('ucas-grade').innerHTML = TABLES[kind].map(function (g, i) {
      return '<option value="' + i + '">' + g[0] + ' — ' + g[1] + ' pts</option>';
    }).join('');
  }
  function paint() {
    var total = rows.reduce(function (s, r) { return s + r.pts; }, 0);
    $('ucas-list').innerHTML = rows.length ? rows.map(function (r, i) {
      return '<div style="display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.04);margin-bottom:6px;font-size:.82rem;"><span>' + r.kind + ' ' + r.grade + '</span><span style="color:var(--accent);font-weight:800;">' + r.pts + ' <button type="button" data-i="' + i + '" style="margin-left:8px;background:transparent;border:0;color:#ffb8b8;cursor:pointer;">remove</button></span></div>';
    }).join('') : '<p style="font-size:.8rem;color:var(--text-secondary);">No grades yet — add your predicted or achieved set.</p>';
    $('ucas-out').innerHTML = '<div style="padding:12px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);font-size:1.1rem;font-weight:800;color:var(--accent);">Total ' + total + ' points</div><p style="margin:8px 0 0;font-size:.75rem;color:var(--text-secondary);">AAA = 144 · ABB = 128 · BBB = 120 · BBC = 112. EPQ and some BTECs also carry tariff — look up extras on ucas.com.</p>';
    host.querySelectorAll('[data-i]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        rows.splice(Number(btn.getAttribute('data-i')), 1);
        paint();
      });
    });
  }
  $('ucas-kind').addEventListener('change', fillGrades);
  $('ucas-add').addEventListener('click', function () {
    var kind = $('ucas-kind').value;
    var g = TABLES[kind][Number($('ucas-grade').value)];
    rows.push({ kind: kind === 'A' ? 'A-level' : kind === 'AS' ? 'AS' : 'T Level', grade: g[0], pts: g[1] });
    paint();
  });
  fillGrades();
  paint();
})();
</script>
