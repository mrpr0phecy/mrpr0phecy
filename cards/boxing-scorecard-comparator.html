<!-- cards/boxing-scorecard-comparator.html -->
<h2 id="bsc-title" style="margin-top:0;color:var(--accent);">🔍 Boxing Scorecard Comparator</h2>

<form aria-describedby="bsc-desc" onsubmit="event.preventDefault();">
  <p id="bsc-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Compare your card against the official judges round by round. Highlights exactly where you disagreed, measures your agreement rate, and flags the swing rounds that decided the fight.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
    <div>
      <label for="bsc-mine" style="display:block;font-size:0.76rem;font-weight:600;margin-bottom:4px;color:#a0aec0;">Your card (one round per line: <code>A</code>, <code>B</code> or <code>E</code>)</label>
      <textarea id="bsc-mine" rows="6" style="width:100%;padding:8px;background:#070f18;border:1px solid rgba(255,255,255,0.15);color:#e2e8f0;border-radius:6px;font-size:0.75rem;font-family:monospace;resize:vertical;">A A B A B B A A B A A B</textarea>
    </div>
    <div>
      <label for="bsc-off" style="display:block;font-size:0.76rem;font-weight:600;margin-bottom:4px;color:#a0aec0;">Official / judge card (same format)</label>
      <textarea id="bsc-off" rows="6" style="width:100%;padding:8px;background:#070f18;border:1px solid rgba(255,255,255,0.15);color:#e2e8f0;border-radius:6px;font-size:0.75rem;font-family:monospace;resize:vertical;">A B B A B A A B B A A B</textarea>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;">
    <div style="background:#09121d;border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:8px;text-align:center;">
      <div style="font-size:0.65rem;color:var(--text-secondary);text-transform:uppercase;">Agreement</div>
      <div id="bsc-agree" style="font-size:1.35rem;font-weight:800;color:#00ffcc;margin-top:2px;">0%</div>
    </div>
    <div style="background:#09121d;border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:8px;text-align:center;">
      <div style="font-size:0.65rem;color:var(--text-secondary);text-transform:uppercase;">Your Card</div>
      <div id="bsc-mytot" style="font-size:1.15rem;font-weight:800;color:#ffd700;margin-top:4px;font-family:monospace;">–</div>
    </div>
    <div style="background:#09121d;border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:8px;text-align:center;">
      <div style="font-size:0.65rem;color:var(--text-secondary);text-transform:uppercase;">Official</div>
      <div id="bsc-offtot" style="font-size:1.15rem;font-weight:800;color:#ffd700;margin-top:4px;font-family:monospace;">–</div>
    </div>
    <div style="background:#09121d;border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:8px;text-align:center;">
      <div style="font-size:0.65rem;color:var(--text-secondary);text-transform:uppercase;">Disputed</div>
      <div id="bsc-disp" style="font-size:1.35rem;font-weight:800;color:#ff6b6b;margin-top:2px;">0</div>
    </div>
  </div>

  <div id="bsc-grid" style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;"></div>
  <div id="bsc-out" style="background:#070f1a;border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:10px;font-size:0.76rem;color:var(--text-secondary);line-height:1.6;"></div>
</form>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const parse=t=>t.toUpperCase().split(/[\s,;\n]+/).filter(x=>['A','B','E'].includes(x));

  function tot(arr){
    let a=0,b=0;
    arr.forEach(r=>{ if(r==='A'){a+=10;b+=9;} else if(r==='B'){a+=9;b+=10;} else {a+=10;b+=10;} });
    return [a,b];
  }

  function calc(){
    const m=parse($('bsc-mine').value), o=parse($('bsc-off').value);
    const n=Math.min(m.length,o.length);
    if(n===0){
      $('bsc-grid').innerHTML='';
      $('bsc-out').innerHTML='Enter one letter per round in each box — <code>A</code> for the first fighter, <code>B</code> for the second, <code>E</code> for an even round. Separate with spaces, commas or new lines.';
      ['bsc-agree','bsc-disp'].forEach(i=>$(i).textContent='0');
      $('bsc-agree').textContent='0%';
      $('bsc-mytot').textContent=$('bsc-offtot').textContent='–';
      return;
    }
    let same=0; const diffs=[];
    let cells='';
    for(let i=0;i<n;i++){
      const ok=m[i]===o[i];
      if(ok) same++; else diffs.push(i+1);
      cells+=`<div title="Round ${i+1}: you ${m[i]}, official ${o[i]}" style="min-width:44px;text-align:center;padding:5px 4px;border-radius:5px;font-size:0.68rem;font-family:monospace;font-weight:700;
        background:${ok?'rgba(0,255,204,0.12)':'rgba(255,51,102,0.15)'};
        border:1px solid ${ok?'rgba(0,255,204,0.4)':'#ff3366'};
        color:${ok?'#00ffcc':'#ff85a2'};">
        <div style="font-size:0.6rem;opacity:0.7;">R${i+1}</div>${m[i]}/${o[i]}</div>`;
    }
    $('bsc-grid').innerHTML=cells;
    const [ma,mb]=tot(m.slice(0,n)), [oa,ob]=tot(o.slice(0,n));
    const pct=Math.round(same/n*100);
    $('bsc-agree').textContent=pct+'%';
    $('bsc-agree').style.color = pct>=80?'#00ffcc':pct>=60?'#ffd700':'#ff6b6b';
    $('bsc-mytot').textContent=ma+'-'+mb;
    $('bsc-offtot').textContent=oa+'-'+ob;
    $('bsc-disp').textContent=diffs.length;

    const myW=ma>mb?'A':mb>ma?'B':'Draw', ofW=oa>ob?'A':ob>oa?'B':'Draw';
    let msg=`<strong>You agreed on ${same} of ${n} rounds (${pct}%).</strong> `;
    if(diffs.length) msg+=`Disputed rounds: <span style="color:#ff85a2;font-family:monospace;">${diffs.join(', ')}</span>. `;
    msg+= myW===ofW
      ? `<span style="color:#00ffcc;">Both cards produce the same result (${myW==='Draw'?'a draw':'a win for '+myW}).</span> `
      : `<span style="color:#ff6b6b;">Different outcomes — your card says ${myW==='Draw'?'draw':myW+' wins'}, the official card says ${ofW==='Draw'?'draw':ofW+' wins'}.</span> `;
    const swing=Math.abs((ma-mb)-(oa-ob));
    if(swing) msg+=`The margin differs by ${swing} point${swing===1?'':'s'}. `;
    if(m.length!==o.length) msg+=`<span style="color:#ffd700;">Note: cards list different round counts (${m.length} vs ${o.length}); comparison used the first ${n}.</span>`;
    $('bsc-out').innerHTML=msg;
  }

  $('bsc-mine').addEventListener('input',calc);
  $('bsc-off').addEventListener('input',calc);
  calc();
})();
</script>
