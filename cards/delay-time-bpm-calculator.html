<h2 id="dlbm-title" style="margin-top:0;color:var(--accent);">🎛️ Delay Time BPM Calculator</h2>

<form aria-describedby="dlbm-desc" onsubmit="event.preventDefault();">
  <p id="dlbm-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Convert tempo to delay, reverb pre-delay and LFO times. Note length in milliseconds = 240,000 ÷ BPM ÷ denominator (crotchet = 4). Dotted is × 1.5; triplet is × ⅔.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="dlbm-bpm" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">BPM</label>
      <input id="dlbm-bpm" type="number" min="1" step="any" value="120" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="dlbm-hz" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Or LFO Hz → BPM</label>
      <input id="dlbm-hz" type="number" min="0" step="any" value="" placeholder="optional" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="dlbm-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var notes = [
    ['1/1 whole', 1],
    ['1/2', 2],
    ['1/4 crotchet', 4],
    ['1/8', 8],
    ['1/16', 16],
    ['1/32', 32]
  ];
  function ms(bpm, den) { return 240000 / bpm / den; }
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var bpm = Number($('dlbm-bpm').value);
    var hzIn = $('dlbm-hz').value;
    if (hzIn !== '' && Number(hzIn) > 0) {
      bpm = Number(hzIn) * 60;
      $('dlbm-bpm').value = bpm.toFixed(2);
    }
    if (!(bpm > 0)) {
      $('dlbm-out').textContent = 'Enter a tempo.';
      return;
    }
    var q = ms(bpm, 4);
    var rows = notes.map(function (n) {
      var st = ms(bpm, n[1]);
      return '<tr><td style="padding:4px 8px;">' + n[0] + '</td><td style="padding:4px 8px;">' + st.toFixed(1) + '</td><td style="padding:4px 8px;">' + (st * 1.5).toFixed(1) + '</td><td style="padding:4px 8px;">' + (st * 2 / 3).toFixed(1) + '</td></tr>';
    }).join('');
    $('dlbm-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Crotchet', q.toFixed(1) + ' ms') +
      cell('Hz (¼-note LFO)', (bpm / 60).toFixed(3) + ' Hz') +
      cell('Bar (4/4)', (q * 4).toFixed(1) + ' ms') +
      '</div><table style="margin-top:12px;width:100%;border-collapse:collapse;font-size:.82rem;"><thead><tr><th style="text-align:left;padding:4px 8px;">Note</th><th style="text-align:left;padding:4px 8px;">Straight ms</th><th style="text-align:left;padding:4px 8px;">Dotted</th><th style="text-align:left;padding:4px 8px;">Triplet</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }
  $('dlbm-bpm').addEventListener('input', function () { $('dlbm-hz').value = ''; run(); });
  $('dlbm-hz').addEventListener('input', run);
  run();
})();
</script>
