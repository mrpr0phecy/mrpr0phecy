<h2 id="qtcx-title" style="margin-top:0;color:var(--accent);">❤️ QTc Interval (Bazett)</h2>

<form aria-describedby="qtcx-desc" onsubmit="event.preventDefault();">
  <p id="qtcx-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    QTc (Bazett) = QT ÷ √(RR), with RR = 60 / heart-rate. Also shows Fridericia (QT ÷ RR⅓). Educational arithmetic from numbers you type — not an ECG, not a diagnosis. Chest pain or syncope needs emergency care.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="qtcx-qt" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">QT (ms)</label>
      <input id="qtcx-qt" type="number" min="200" max="800" value="400" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="qtcx-hr" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Heart rate (bpm)</label>
      <input id="qtcx-hr" type="number" min="30" max="220" value="70" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="qtcx-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var qt = Number($('qtcx-qt').value), hr = Number($('qtcx-hr').value);
    if (!(qt > 0 && hr > 0)) return;
    var rr = 60 / hr;
    var baz = qt / Math.sqrt(rr);
    var fri = qt / Math.cbrt(rr);
    var note = baz > 500 ? 'A QTc over ~500 ms is often treated as high-risk in clinic — this webpage cannot confirm a tracing.' :
      baz > 470 ? 'Many labs flag QTc above ~450 ms (men) or ~470 ms (women). Only a clinician reading the ECG decides.' :
      'Bazett over-corrects at high heart rates; Fridericia is often preferred then. Still not a diagnosis.';
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('qtcx-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('RR interval', (rr * 1000).toFixed(0) + ' ms') +
      cell('QTc Bazett', baz.toFixed(0) + ' ms') +
      cell('QTc Fridericia', fri.toFixed(0) + ' ms') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">' + note + '</p>';
  }
  $('qtcx-qt').addEventListener('input', run);
  $('qtcx-hr').addEventListener('input', run);
  run();
})();
</script>
