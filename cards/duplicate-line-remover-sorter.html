<h2 id="dups-title" style="margin-top:0;color:var(--accent);">🧹 Duplicate Line Remover</h2>

<form aria-describedby="dups-desc" onsubmit="event.preventDefault();">
  <p id="dups-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Paste a list: drop duplicate lines, sort A→Z or Z→A, trim spaces, ignore case. Stays in this browser — mailing lists and log dumps never leave the device.
  </p>
  <label for="dups-in" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Lines</label>
  <textarea id="dups-in" rows="8" spellcheck="false" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;">apple
banana
apple
Cherry
banana
date</textarea>
  <label style="display:flex;align-items:center;gap:8px;margin:8px 0;font-size:.82rem;color:var(--text-secondary);">
    <input id="dups-trim" type="checkbox" checked style="accent-color:var(--accent);"> Trim each line
  </label>
  <label style="display:flex;align-items:center;gap:8px;margin:8px 0;font-size:.82rem;color:var(--text-secondary);">
    <input id="dups-case" type="checkbox" checked style="accent-color:var(--accent);"> Ignore case when comparing
  </label>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">
    <button type="button" id="dups-go" style="padding:9px 14px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-weight:800;font-size:.84rem;">Remove duplicates</button>
    <button type="button" id="dups-az" style="padding:9px 14px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-weight:700;font-size:.84rem;">Sort A→Z</button>
    <button type="button" id="dups-za" style="padding:9px 14px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-weight:700;font-size:.84rem;">Sort Z→A</button>
    <button type="button" id="dups-copy" style="padding:9px 14px;background:rgba(255,255,255,.07);color:var(--text);border:1px solid rgba(255,255,255,.16);border-radius:8px;cursor:pointer;font-size:.84rem;">Copy</button>
  </div>
</form>
<div id="dups-meta" style="margin-top:10px;font-size:.8rem;color:var(--text-secondary);"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function lines() {
    var raw = $('dups-in').value.split(/\r?\n/);
    if ($('dups-trim').checked) raw = raw.map(function (s) { return s.trim(); });
    return raw;
  }
  function unique(arr) {
    var seen = {}, out = [];
    var fold = $('dups-case').checked;
    arr.forEach(function (s) {
      var k = fold ? s.toLowerCase() : s;
      if (seen[k]) return;
      seen[k] = 1;
      out.push(s);
    });
    return out;
  }
  function set(arr, note) {
    $('dups-in').value = arr.join('\n');
    $('dups-meta').textContent = note;
  }
  $('dups-go').addEventListener('click', function () {
    var all = lines(), out = unique(all);
    set(out, all.length + ' lines in → ' + out.length + ' unique (' + (all.length - out.length) + ' dropped)');
  });
  $('dups-az').addEventListener('click', function () {
    var arr = unique(lines());
    arr.sort(function (a, b) { return a.localeCompare(b, undefined, { sensitivity: $('dups-case').checked ? 'base' : 'variant' }); });
    set(arr, arr.length + ' lines, sorted A→Z');
  });
  $('dups-za').addEventListener('click', function () {
    var arr = unique(lines());
    arr.sort(function (a, b) { return b.localeCompare(a, undefined, { sensitivity: $('dups-case').checked ? 'base' : 'variant' }); });
    set(arr, arr.length + ' lines, sorted Z→A');
  });
  $('dups-copy').addEventListener('click', function () {
    var t = $('dups-in').value, btn = this;
    function done() { btn.textContent = '✓ Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done); else done();
  });
})();
</script>
