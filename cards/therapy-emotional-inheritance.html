<h2>🧬 The Emotions You Inherited (But Never Chose)</h2>
<p class="description">Some of your deepest patterns — guilt, anxiety, people-pleasing, scarcity fear — aren't yours. They were passed down through your family like heirlooms you never asked for. This tool helps you identify which ones to return.</p>
<div id="ei-app" style="max-width:540px;margin:0 auto;"></div>
<script>
(function(){
'use strict';
var step=0,pattern='',source='',belief='';
var patterns=['Chronic guilt (feeling like I\'m never doing enough)','People-pleasing (can\'t say no without anxiety)','Scarcity mindset (always afraid of running out)','Emotional suppression (can\'t express anger or sadness)','Perfectionism (nothing I do is ever good enough)','Hypervigilance (always scanning for danger or disapproval)','Self-sacrifice (my needs always come last)','Shame about success (I don\'t deserve good things)','Fear of abandonment (people will leave)','Control issues (I need to manage everything)'];
function init(){step=0;render();}
function render(){
  var h='';
  if(step===0){
    h+='<div style="text-align:center;margin-bottom:20px;">';
    h+='<div style="font-size:64px;margin-bottom:12px;">🧬</div>';
    h+='<h3 style="color:#ff8800;margin:0 0 8px;">You are running software you didn\'t write</h3>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);">By age 7, your nervous system had already absorbed your family\'s emotional operating system — their fears, their coping mechanisms, their unspoken rules about what\'s allowed and what\'s dangerous. You didn\'t choose these patterns. You <i>inherited</i> them.</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-top:12px;">Your mother\'s anxiety became your baseline. Your father\'s emotional distance became your template for love. Your family\'s financial stress became your permanent sense of scarcity — even when you\'re fine. These aren\'t character flaws. They\'re <b>intergenerational emotional patterns</b> — and the research on them is overwhelming.</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-top:12px;">The first step to changing a pattern you didn\'t choose is <b>seeing it</b>. Most people fight symptoms for decades without ever tracing them to their source.</p>';
    h+='</div>';
    h+='<button onclick="window._eiNext()" style="display:block;margin:0 auto;padding:12px 32px;background:linear-gradient(135deg,#ff8800,#ff5500);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px;">Begin</button>';
  }else if(step===1){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">🔍</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">Which of these patterns feels most familiar? Not which one you <i>think</i> you have — which one you <i>feel</i> in your body right now?</p>';
    patterns.forEach(function(p){
      h+='<button onclick="window._eiPattern(\''+p.replace(/'/g,"\\'")+'\')" style="display:block;width:100%;text-align:left;padding:12px;margin-bottom:6px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,136,0,0.2);border-radius:8px;color:var(--text-secondary);cursor:pointer;font-size:13px;transition:all 0.2s;">'+p+'</button>';
    });
  }else if(step===2){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">👨‍👩‍👧</div><div style="font-size:14px;color:#ff8800;margin-top:8px;font-style:italic;">"'+pattern+'"</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">Now the hard question: <b>who in your family had this same pattern?</b> It might be a parent, grandparent, or sibling. It might be so normalised in your family that everyone has it. Who modelled this for you?</p>';
    h+='<label style="display:block;font-size:13px;color:#ff8800;margin-bottom:6px;font-weight:600;">Where did this pattern come from?</label>';
    h+='<textarea id="ei-src" rows="3" placeholder="e.g. My mum was always anxious about money, even when we were fine. My dad never talked about his feelings. My grandmother sacrificed everything for everyone else..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,136,0,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>';
    h+='<button onclick="window._eiNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#ff8800,#ff5500);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Continue</button>';
  }else if(step===3){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">💭</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">What is the <b>hidden belief</b> underneath this pattern? Inherited patterns always carry a belief — usually one so deep you\'ve never consciously thought it. It\'s just "how things are."</p>';
    h+='<p style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:12px;">Examples: "The world isn\'t safe," "I have to earn love," "Wanting things for myself is selfish," "If I\'m not perfect, I\'ll be abandoned," "There\'s never enough"</p>';
    h+='<label style="display:block;font-size:13px;color:#ff8800;margin-bottom:6px;font-weight:600;">What is the core belief this pattern installed in you?</label>';
    h+='<input type="text" id="ei-bel" placeholder="e.g. If I\'m not useful, I\'ll be abandoned..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,136,0,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;box-sizing:border-box;">';
    h+='<button onclick="window._eiNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#ff8800,#ff5500);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;">See the Truth</button>';
  }else if(step===4){
    h+='<div style="text-align:center;margin-bottom:20px;"><div style="font-size:64px;">🔓</div></div>';
    h+='<div style="background:rgba(255,136,0,0.08);border:1px solid rgba(255,136,0,0.2);border-radius:10px;padding:20px;margin-bottom:16px;">';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0 0 12px;">The pattern: <b style="color:#ff8800;">'+pattern+'</b></p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0 0 12px;">Where it came from: <span style="color:#ff8800;">'+source+'</span></p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0 0 16px;">The hidden belief: <b style="color:#ff8800;">"'+belief+'"</b></p>';
    h+='<p style="font-size:14px;line-height:1.8;color:#e6faff;margin:0;">Here\'s what changes when you see this clearly:</p><br>';
    h+='<p style="font-size:14px;line-height:1.8;color:#e6faff;margin:0;"><b>1. It\'s not yours.</b> This pattern was installed before you had the capacity to evaluate it. You were a child absorbing an adult\'s coping mechanism. You didn\'t choose it — you inherited it, like eye colour or a family recipe.</p><br>';
    h+='<p style="font-size:14px;line-height:1.8;color:#e6faff;margin:0;"><b>2. It made sense for them.</b> The person who modelled this pattern was probably doing their best with what they had. Their pattern was <i>their</i> adaptation to <i>their</i> circumstances. But their circumstances aren\'t yours.</p><br>';
    h+='<p style="font-size:14px;line-height:1.8;color:#e6faff;margin:0;"><b>3. You can return the heirloom.</b> You can honour where the pattern came from while choosing not to carry it forward. This isn\'t betrayal — it\'s evolution. The pattern ends with you when you see it clearly enough to choose differently.</p>';
    h+='</div>';
    h+='<p style="font-size:13px;color:var(--text-secondary);line-height:1.7;">This work is central to <b>Internal Family Systems (IFS)</b> therapy and <b>intergenerational trauma research</b>. Mark Wolynn\'s "It Didn\'t Start with You" documents how family patterns transmit across generations through behaviour, epigenetics, and nervous system regulation. Seeing the pattern is the first step. Choosing your response is the second.</p>';
    h+='<button onclick="window._eiReset()" style="display:block;margin:20px auto 0;padding:10px 24px;background:rgba(255,136,0,0.15);color:#ff8800;border:1px solid rgba(255,136,0,0.3);border-radius:8px;cursor:pointer;font-weight:600;">Start Over</button>';
  }
  document.getElementById('ei-app').innerHTML=h;
}
window._eiNext=function(){
  if(step===2){var s=document.getElementById('ei-src');if(s){source=s.value.trim()||'my family';}}
  if(step===3){var b=document.getElementById('ei-bel');if(b){belief=b.value.trim()||'I\'m not enough';}}
  step++;render();
};
window._eiPattern=function(p){pattern=p;step=2;render();};
window._eiReset=function(){init();};
init();
})();
</script>
