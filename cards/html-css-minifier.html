<h2 id="minf-title" style="margin-top:0;color:var(--accent);">📦 HTML / CSS Minifier</h2>

<form aria-describedby="minf-desc" onsubmit="event.preventDefault();">
  <p id="minf-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Strip comments and collapse idle whitespace in HTML or CSS. Not a full parser — keep &lt;pre&gt; and &lt;textarea&gt; out of the input, and do not minify JavaScript here. Local only.
  </p>
  <label for="minf-in" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Source</label>
  <textarea id="minf-in" rows="8" spellcheck="false" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;">/* card */
.box {
  color: #2dd4ff;
  padding: 12px;
}
</textarea>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">
    <button type="button" id="minf-go" style="padding:9px 14px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-weight:800;font-size:.84rem;">Minify</button>
    <button type="button" id="minf-copy" style="padding:9px 14px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-weight:700;font-size:.84rem;">Copy</button>
  </div>
</form>
<div id="minf-meta" style="margin-top:8px;font-size:.78rem;color:var(--text-secondary);"></div>
<pre id="minf-out" style="margin-top:8px;padding:12px;border-radius:10px;background:#071019;border:1px solid rgba(45,212,255,.28);color:#91f7ff;font-size:.78rem;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;"></pre>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function minify(s) {
    s = s.replace(/<!--[\s\S]*?-->/g, '');
    s = s.replace(/\/\*[\s\S]*?\*\//g, '');
    s = s.replace(/\s+/g, ' ');
    s = s.replace(/\s*([{};:,>~+])\s*/g, '$1');
    s = s.replace(/>\s+</g, '><');
    return s.trim();
  }
  function go() {
    var src = $('minf-in').value;
    var out = minify(src);
    $('minf-out').textContent = out;
    var saved = src.length ? Math.max(0, (1 - out.length / src.length) * 100) : 0;
    $('minf-meta').textContent = src.length + ' → ' + out.length + ' characters (' + saved.toFixed(0) + '% smaller)';
  }
  $('minf-go').addEventListener('click', go);
  $('minf-copy').addEventListener('click', function () {
    var t = $('minf-out').textContent, btn = this;
    function done() { btn.textContent = '✓ Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done); else done();
  });
  go();
})();
</script>
