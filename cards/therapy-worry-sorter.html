<h2>🧠 The Worry Sorter: Actionable vs. Noise</h2>
<p class="description">Your brain treats all worries as equally urgent. They're not. This tool forces you to sort your worries into "I can act on this" and "I'm just spinning" — then creates a concrete plan for the first and a release ritual for the second.</p>
<div id="ws-app" style="max-width:540px;margin:0 auto;"></div>
<script>
(function(){
'use strict';
var step=0,worries=[],actionable=[],nonActionable=[];
function init(){step=0;worries=[];actionable=[];nonActionable=[];render();}
function render(){
  var h='';
  if(step===0){
    h+='<div style="text-align:center;margin-bottom:20px;">';
    h+='<div style="font-size:64px;margin-bottom:12px;">🌀</div>';
    h+='<h3 style="color:#ffcc00;margin:0 0 8px;">Your brain is a terrible triage nurse</h3>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);">When you\'re anxious, your brain treats every worry as a five-alarm fire. "What if I lose my job?" gets the same cortisol response as "What if it rains tomorrow?" You end up spinning on things you can\'t control while neglecting things you can.</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-top:12px;">This is the core insight of <b>Stoic philosophy</b> and modern <b>CBT</b>: the antidote to anxiety isn\'t "stop worrying" — it\'s <b>sorting</b>. Separate what\'s actionable from what\'s noise. Then give each the response it actually deserves.</p>';
    h+='</div>';
    h+='<button onclick="window._wsNext()" style="display:block;margin:0 auto;padding:12px 32px;background:linear-gradient(135deg,#ffcc00,#ff9500);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px;">Begin</button>';
  }else if(step===1){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">📝</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">Dump everything that\'s worrying you right now. Don\'t filter. Don\'t judge. Just get it out of your head and onto the screen. One worry per line.</p>';
    h+='<textarea id="ws-list" rows="8" placeholder="e.g.\nWill I have enough money this month?\nWhat if my partner is losing interest?\nAm I wasting my life?\nDid I say something stupid at work?\nWhat if the test results are bad?\nThe house is a mess..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,204,0,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;resize:vertical;box-sizing:border-box;font-family:inherit;"></textarea>';
    h+='<button onclick="window._wsNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#ffcc00,#ff9500);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Sort My Worries</button>';
  }else if(step===2){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">⚖️</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;"><b>Now sort each worry.</b> For each one, ask: "Is there a concrete action I can take in the next 48 hours?" If yes → actionable. If no → it\'s noise your brain is generating, not a problem to solve.</p>';
    worries.forEach(function(w,i){
      h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px 12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:8px;">';
      h+='<span style="flex:1;font-size:13px;color:#e6faff;">'+w+'</span>';
      h+='<button onclick="window._wsSort('+i+',\'act\')" class="ws-sort-'+i+'" style="padding:6px 12px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.3);border-radius:6px;color:#39ff14;cursor:pointer;font-size:12px;font-weight:600;">Act</button>';
      h+='<button onclick="window._wsSort('+i+',\'noise\')" class="ws-sort-'+i+'" style="padding:6px 12px;background:rgba(255,107,129,0.1);border:1px solid rgba(255,107,129,0.3);border-radius:6px;color:#ff6b81;cursor:pointer;font-size:12px;font-weight:600;">Noise</button>';
      h+='</div>';
    });
    h+='<button onclick="window._wsShowResults()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#ffcc00,#ff9500);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Show Results</button>';
  }else if(step===3){
    h+='<div style="text-align:center;margin-bottom:20px;"><div style="font-size:64px;">'+(actionable.length>0?'⚡':'🕊️')+'</div></div>';
    if(actionable.length>0){
      h+='<div style="background:rgba(57,255,20,0.08);border:1px solid rgba(57,255,20,0.2);border-radius:10px;padding:16px;margin-bottom:12px;">';
      h+='<p style="font-size:14px;font-weight:700;color:#39ff14;margin:0 0 8px;">⚡ ACTIONABLE ('+actionable.length+')</p>';
      h+='<p style="font-size:13px;color:var(--text-secondary);margin:0 0 12px;">These deserve your energy. For each one, write the smallest possible next step — something you can do in 15 minutes or less.</p>';
      actionable.forEach(function(w){
        h+='<div style="margin-bottom:8px;padding:10px;background:rgba(57,255,20,0.05);border-radius:6px;">';
        h+='<div style="font-size:13px;color:#e6faff;margin-bottom:4px;">'+w+'</div>';
        h+='<div style="font-size:12px;color:#39ff14;">→ Next step: [do this in the next 48 hours]</div>';
        h+='</div>';
      });
      h+='</div>';
    }
    if(nonActionable.length>0){
      h+='<div style="background:rgba(255,107,129,0.08);border:1px solid rgba(255,107,129,0.2);border-radius:10px;padding:16px;margin-bottom:12px;">';
      h+='<p style="font-size:14px;font-weight:700;color:#ff6b81;margin:0 0 8px;">🌀 NOISE ('+nonActionable.length+')</p>';
      h+='<p style="font-size:13px;color:var(--text-secondary);margin:0 0 12px;">These are not problems to solve. They are your brain\'s threat-detection system misfiring. You cannot think your way out of them. The practice is:</p>';
      nonActionable.forEach(function(w){
        h+='<div style="margin-bottom:8px;padding:10px;background:rgba(255,107,129,0.05);border-radius:6px;">';
        h+='<div style="font-size:13px;color:#e6faff;">'+w+'</div>';
        h+='<div style="font-size:12px;color:#ff6b81;">→ Acknowledge it. Name it. Let it pass.</div>';
        h+='</div>';
      });
      h+='<p style="font-size:13px;color:var(--text-secondary);margin:8px 0 0;">The technique: when a noise worry arises, say "I notice I\'m worrying about [X]." That\'s it. Don\'t engage. Don\'t solve. Just notice. This is <b>mindfulness-based cognitive therapy</b> — the NHS\'s recommended treatment for generalised anxiety.</p>';
      h+='</div>';
    }
    h+='<p style="font-size:13px;color:var(--text-secondary);line-height:1.7;">The Stoic philosopher Epictetus said it 2,000 years ago: "Make the best use of what is in your power, and take the rest as it happens." This tool is that principle, operationalised.</p>';
    h+='<button onclick="window._wsReset()" style="display:block;margin:20px auto 0;padding:10px 24px;background:rgba(255,204,0,0.15);color:#ffcc00;border:1px solid rgba(255,204,0,0.3);border-radius:8px;cursor:pointer;font-weight:600;">Start Over</button>';
  }
  document.getElementById('ws-app').innerHTML=h;
}
window._wsNext=function(){
  if(step===1){
    var t=document.getElementById('ws-list');
    if(t){
      worries=t.value.split('\n').map(function(s){return s.trim();}).filter(function(s){return s.length>0;});
      if(worries.length<1){alert('Please write at least one worry.');return;}
    }
  }
  step++;render();
};
window._wsSort=function(i,type){
  if(type==='act'){actionable.push(worries[i]);}else{nonActionable.push(worries[i]);}
  var btns=document.querySelectorAll('.ws-sort-'+i);
  btns.forEach(function(b){b.disabled=true;b.style.opacity='0.3';});
};
window._wsShowResults=function(){
  worries.forEach(function(w,i){
    if(actionable.indexOf(w)===-1 && nonActionable.indexOf(w)===-1){nonActionable.push(w);}
  });
  step++;render();
};
window._wsReset=function(){init();};
init();
})();
</script>
