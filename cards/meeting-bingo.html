<!-- cards/meeting-bingo.html -->
<h2 id="meetbingo-title" style="margin-top:0;color:var(--accent);">🎯 Corporate Meeting Bingo</h2>

<form aria-describedby="meetbingo-desc" onsubmit="event.preventDefault();">
  <p id="meetbingo-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Mark off buzzwords as your colleagues say them. First to get 5 in a row wins (and loses, because you're still in the meeting).
  </p>

  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
    <button type="button" onclick="meetbingoNewCard()" style="padding:10px 16px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;cursor:pointer;font-size:0.9rem;">🔄 New Card</button>
    <button type="button" onclick="meetbingoReset()" style="padding:10px 16px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:rgba(45,212,255,0.1);color:var(--accent);cursor:pointer;font-size:0.9rem;">↩️ Reset</button>
    <div id="meetbingo-stats" style="padding:10px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);color:var(--text-secondary);font-size:0.85rem;display:flex;align-items:center;gap:8px;">
      <span>🎯 <span id="meetbingo-count">0</span>/25</span>
      <span>|</span>
      <span>🏆 <span id="meetbingo-lines">0</span> lines</span>
    </div>
  </div>

  <div id="meetbingo-board" style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:16px;"></div>

  <div id="meetbingo-win" style="display:none;padding:16px;border-radius:10px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.3);text-align:center;margin-bottom:12px;">
    <div style="font-size:1.2rem;color:#39ff14;font-weight:700;">🎉 BINGO! You survived the meeting!</div>
    <div style="font-size:0.85rem;color:var(--text-secondary);margin-top:4px;">Your prize: another meeting. It starts in 15 minutes.</div>
  </div>
</form>

<script>
(function(){
  var meetbingoWords = [
    'Synergy','Circle back','Touch base','Low-hanging fruit','Move the needle',
    'Deep dive','Bandwidth','Take this offline','Boil the ocean','Thought leadership',
    'Paradigm shift','Best practice','Action items','Drill down','Leverage',
    'Alignment','Scalable','Ecosystem','Pivot','Stakeholder',
    'Deliverables','End of day','Quick win','Table this','Value-add',
    'Core competency','Game changer','Robust','Seamless','Unpack',
    'Visibility','Empower','Holistic','Streamline','Agile',
    'Touchpoint','Ideate','Cross-functional','Net-net','Run it up the flagpole',
    'Pain point','Synergize','On my radar','Ping me','Let\'s socialize this',
    'Rightsize','Growth hack','Disrupt','Whitespace','Bleeding edge'
  ];
  var meetbingoBoard = [];
  var meetbingoMarked = [];

  function meetbingoShuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function meetbingoRender() {
    var html = '';
    for (var i = 0; i < 25; i++) {
      var isFree = (i === 12);
      var marked = meetbingoMarked[i];
      var bg = isFree ? 'rgba(57,255,20,0.15)' : marked ? 'rgba(45,212,255,0.2)' : 'rgba(255,255,255,0.03)';
      var border = isFree ? 'rgba(57,255,20,0.4)' : marked ? 'rgba(45,212,255,0.5)' : 'rgba(255,255,255,0.1)';
      var color = isFree ? '#39ff14' : marked ? 'var(--accent)' : 'var(--text)';
      var text = isFree ? '☕ FREE<br><small>Coffee Break</small>' : meetbingoBoard[i];
      var strike = marked && !isFree ? 'text-decoration:line-through;opacity:0.7;' : '';
      html += '<div onclick="meetbingoToggle(' + i + ')" style="padding:10px 4px;border-radius:6px;background:' + bg + ';border:1px solid ' + border + ';color:' + color + ';text-align:center;cursor:pointer;font-size:' + (text.length > 12 ? '0.65rem' : '0.75rem') + ';font-weight:600;line-height:1.3;min-height:52px;display:flex;align-items:center;justify-content:center;' + strike + '">' + text + '</div>';
    }
    document.getElementById('meetbingo-board').innerHTML = html;
  }

  function meetbingoCheckWin() {
    var lines = 0;
    for (var r = 0; r < 5; r++) {
      var rowWin = true;
      for (var c = 0; c < 5; c++) { if (!meetbingoMarked[r*5+c]) rowWin = false; }
      if (rowWin) lines++;
    }
    for (var c2 = 0; c2 < 5; c2++) {
      var colWin = true;
      for (var r2 = 0; r2 < 5; r2++) { if (!meetbingoMarked[r2*5+c2]) colWin = false; }
      if (colWin) lines++;
    }
    var d1 = true, d2 = true;
    for (var d = 0; d < 5; d++) { if (!meetbingoMarked[d*6]) d1 = false; if (!meetbingoMarked[d*4+4]) d2 = false; }
    if (d1) lines++;
    if (d2) lines++;

    document.getElementById('meetbingo-lines').textContent = lines;
    if (lines > 0) document.getElementById('meetbingo-win').style.display = 'block';
    return lines;
  }

  window.meetbingoToggle = function(i) {
    if (i === 12) return;
    meetbingoMarked[i] = !meetbingoMarked[i];
    var count = 0;
    for (var j = 0; j < 25; j++) { if (meetbingoMarked[j]) count++; }
    document.getElementById('meetbingo-count').textContent = count;
    meetbingoRender();
    meetbingoCheckWin();
  };

  window.meetbingoNewCard = function() {
    var picked = meetbingoShuffle(meetbingoWords).slice(0, 25);
    meetbingoBoard = picked;
    meetbingoMarked = new Array(25).fill(false);
    meetbingoMarked[12] = true;
    document.getElementById('meetbingo-count').textContent = '0';
    document.getElementById('meetbingo-lines').textContent = '0';
    document.getElementById('meetbingo-win').style.display = 'none';
    meetbingoRender();
  };

  window.meetbingoReset = function() {
    meetbingoMarked = new Array(25).fill(false);
    meetbingoMarked[12] = true;
    document.getElementById('meetbingo-count').textContent = '0';
    document.getElementById('meetbingo-lines').textContent = '0';
    document.getElementById('meetbingo-win').style.display = 'none';
    meetbingoRender();
  };

  meetbingoNewCard();
})();
</script>
