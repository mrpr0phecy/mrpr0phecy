<h2 id="pyth-title" style="margin-top:0;color:var(--accent);">△ Pythagoras Triangle Solver</h2>

<form aria-describedby="pyth-desc" onsubmit="event.preventDefault();">
  <p id="pyth-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Right-angled triangle: a² + b² = c². Leave one side blank (or 0) and it is solved. Optional acute angle (degrees) uses SOH-CAH-TOA with the opposite/adjacent/hypotenuse you fill.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="pyth-a" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Leg a</label>
      <input id="pyth-a" type="number" min="0" step="any" value="3" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="pyth-b" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Leg b</label>
      <input id="pyth-b" type="number" min="0" step="any" value="4" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="pyth-c" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Hypotenuse c</label>
      <input id="pyth-c" type="number" min="0" step="any" value="" placeholder="solve" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="pyth-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function n(id) {
    var v = $(id).value;
    if (v === '' || v == null) return null;
    var x = Number(v);
    return x > 0 ? x : null;
  }
  function run() {
    var a = n('pyth-a'), b = n('pyth-b'), c = n('pyth-c');
    var filled = [a, b, c].filter(function (x) { return x != null; }).length;
    if (filled < 2) {
      $('pyth-out').textContent = 'Enter any two sides.';
      return;
    }
    if (filled === 3) {
      var ok = Math.abs(a * a + b * b - c * c) < 1e-6 * c * c;
      $('pyth-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
        cell('Check a² + b²', (a * a + b * b).toFixed(4)) +
        cell('c²', (c * c).toFixed(4)) +
        cell('Right-angled?', ok ? 'yes (within rounding)' : 'no') +
        '</div>';
      return;
    }
    if (c == null) c = Math.sqrt(a * a + b * b);
    else if (a == null) {
      if (c <= b) { $('pyth-out').textContent = 'Hypotenuse must be longer than each leg.'; return; }
      a = Math.sqrt(c * c - b * b);
    } else {
      if (c <= a) { $('pyth-out').textContent = 'Hypotenuse must be longer than each leg.'; return; }
      b = Math.sqrt(c * c - a * a);
    }
    var area = a * b / 2;
    var per = a + b + c;
    var A = Math.acos(b / c) * 180 / Math.PI;
    var B = Math.acos(a / c) * 180 / Math.PI;
    $('pyth-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('a', a.toFixed(4)) +
      cell('b', b.toFixed(4)) +
      cell('c', c.toFixed(4)) +
      cell('Area', area.toFixed(4)) +
      cell('Perimeter', per.toFixed(4)) +
      cell('Angle at B (opp a)', A.toFixed(2) + '°') +
      cell('Angle at A (opp b)', B.toFixed(2) + '°') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">The right angle sits between legs a and b. Angles are the two acutes; they sum to 90°.</p>';
  }
  ['pyth-a', 'pyth-b', 'pyth-c'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
