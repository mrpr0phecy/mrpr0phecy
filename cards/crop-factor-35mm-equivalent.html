<h2 id="cr35-title" style="margin-top:0;color:var(--accent);">🖼️ Crop Factor &amp; 35 mm Equivalent</h2>

<form aria-describedby="cr35-desc" onsubmit="event.preventDefault();">
  <p id="cr35-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    35 mm-equivalent focal length = actual focal length × crop factor. Also shows equivalent f-number for depth of field (same framing). Field of view matches; light-gathering of the aperture does not magically change.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="cr35-body" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Sensor</label>
      <select id="cr35-body" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="1">Full frame ×1</option>
        <option value="1.5" selected>APS-C Sony/Nikon/Fuji ×1.5</option>
        <option value="1.6">APS-C Canon ×1.6</option>
        <option value="2">Micro Four Thirds ×2</option>
        <option value="2.7">1-inch ×2.7</option>
        <option value="5.6">Typical 1/2.3″ compact ×5.6</option>
      </select>
    </div>
    <div>
      <label for="cr35-f" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Focal length (mm)</label>
      <input id="cr35-f" type="number" min="1" max="2000" value="50" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="cr35-n" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Aperture f/</label>
      <input id="cr35-n" type="number" min="0.7" max="32" step="any" value="1.8" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="cr35-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var crop = Number($('cr35-body').value), f = Number($('cr35-f').value), n = Number($('cr35-n').value);
    if (!(crop > 0 && f > 0 && n > 0)) return;
    var eq = f * crop;
    var eqN = n * crop;
    var fov = 2 * Math.atan((36 / 2) / eq) * 180 / Math.PI;
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('cr35-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('35 mm equivalent', Math.round(eq) + ' mm') +
      cell('DoF-equivalent aperture', 'f/' + eqN.toFixed(1)) +
      cell('Horiz. FoV (full-frame eq.)', fov.toFixed(1) + '°') +
      cell('Crop factor', crop + '×') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">A 50 mm f/1.8 on APS-C (×1.5) frames like 75 mm. Depth of field looks more like f/2.7 on full frame at the same framing. Exposure is still f/1.8.</p>';
  }
  ['cr35-body', 'cr35-f', 'cr35-n'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
