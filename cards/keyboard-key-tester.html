<h2 id="kbts-title" style="margin-top:0;color:var(--accent);">⌨️ Keyboard Tester</h2>

<p id="kbts-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
  Click the box and press keys. Shows <code>event.key</code>, <code>code</code> and modifiers — handy when a laptop key died or a layout is fighting you. Nothing is recorded.
</p>
<div id="kbts-box" tabindex="0" role="textbox" aria-describedby="kbts-desc" style="outline:none;min-height:88px;padding:16px;border-radius:12px;background:#071019;border:1px dashed rgba(45,212,255,.45);color:var(--text-secondary);font-size:.9rem;cursor:text;">Click here, then press a key…</div>
<div id="kbts-out" style="margin-top:14px;"></div>
<p id="kbts-log" style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;"></p>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var box = host.querySelector('#kbts-box');
  var out = host.querySelector('#kbts-out');
  var log = host.querySelector('#kbts-log');
  var last = [];
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;word-break:break-all;"></div></div>';
  }
  box.addEventListener('focus', function () { box.textContent = 'Listening…'; });
  box.addEventListener('blur', function () { box.textContent = 'Click here, then press a key…'; });
  box.addEventListener('keydown', function (e) {
    e.preventDefault();
    var mods = [e.ctrlKey && 'Ctrl', e.altKey && 'Alt', e.shiftKey && 'Shift', e.metaKey && 'Meta'].filter(Boolean).join('+') || 'none';
    var loc = ['standard', 'left', 'right', 'numpad'][e.location] || String(e.location);
    out.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;">' +
      cell('key', '') + cell('code', '') + cell('modifiers', '') + cell('location', '') + cell('repeat', '') + '</div>';
    var vals = [e.key, e.code, mods, loc, e.repeat ? 'yes' : 'no'];
    var divs = out.querySelectorAll('div > div:last-child');
    for (var i = 0; i < 5; i++) divs[i].textContent = vals[i];
    last.unshift((e.key === ' ' ? 'Space' : e.key) + ' · ' + e.code);
    if (last.length > 8) last.pop();
    log.textContent = last.join('  |  ');
  });
})();
</script>
