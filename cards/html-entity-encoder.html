<h2>🔤 HTML Entity Encoder / Decoder</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Encode special characters to HTML entities and decode them back. Essential for web development and email templates.</p>

<div id="he-app" style="max-width:600px;margin:0 auto;">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label style="display:block;margin-bottom:4px;color:#2dd4ff;font-size:12px;">Plain Text</label>
      <textarea id="he-text" style="width:100%;height:120px;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;resize:vertical;box-sizing:border-box;" placeholder="Enter text with special characters..."><div class="container">
  <h1>Hello & Welcome!</h1>
  <p>Price: $100 < $200</p>
  <img src="photo.jpg" alt="A "nice" image">
</div></textarea>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <label style="color:#39ff14;font-size:12px;">HTML Encoded</label>
        <button onclick="window._heCopy()" style="padding:3px 8px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.2);border-radius:3px;color:#39ff14;cursor:pointer;font-size:11px;">📋</button>
      </div>
      <textarea id="he-encoded" readonly style="width:100%;height:120px;padding:10px;border-radius:8px;border:1px solid rgba(57,255,20,0.15);background:rgba(0,0,0,0.2);color:#39ff14;font-family:monospace;font-size:13px;resize:vertical;box-sizing:border-box;"></textarea>
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <button onclick="window._heEncode()" style="flex:1;padding:10px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:#2dd4ff;cursor:pointer;font-weight:600;">Encode</button>
    <button onclick="window._heDecode()" style="flex:1;padding:10px;background:rgba(57,255,20,0.15);border:1px solid rgba(57,255,20,0.4);border-radius:8px;color:#39ff14;cursor:pointer;font-weight:600;">Decode</button>
    <button onclick="window._heSwap()" style="padding:10px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.3);border-radius:8px;color:#ffa500;cursor:pointer;">⇄</button>
  </div>

  <div style="padding:12px;background:rgba(0,0,0,0.2);border-radius:8px;">
    <div style="font-size:12px;color:rgba(230,250,255,0.5);margin-bottom:8px;">Common HTML Entities</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px;font-family:monospace;">
      <div style="color:rgba(230,250,255,0.4);">&amp;lt; → <span style="color:#2dd4ff;">&lt;</span></div>
      <div style="color:rgba(230,250,255,0.4);">&amp;gt; → <span style="color:#2dd4ff;">&gt;</span></div>
      <div style="color:rgba(230,250,255,0.4);">&amp;amp; → <span style="color:#2dd4ff;">&amp;</span></div>
      <div style="color:rgba(230,250,255,0.4);">&amp;quot; → <span style="color:#2dd4ff;">"</span></div>
      <div style="color:rgba(230,250,255,0.4);">&amp;apos; → <span style="color:#2dd4ff;">'</span></div>
      <div style="color:rgba(230,250,255,0.4);">&amp;nbsp; → <span style="color:#2dd4ff;"> </span></div>
      <div style="color:rgba(230,250,255,0.4);">&amp;copy; → <span style="color:#2dd4ff;">©</span></div>
      <div style="color:rgba(230,250,255,0.4);">&amp;reg; → <span style="color:#2dd4ff;">®</span></div>
    </div>
  </div>
</div>

<script>
(function(){
  function encode(){
    var text=document.getElementById('he-text').value;
    var encoded=text
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&apos;');
    document.getElementById('he-encoded').value=encoded;
  }
  function decode(){
    var text=document.getElementById('he-encoded').value;
    var decoded=text
      .replace(/&amp;/g,'&')
      .replace(/&lt;/g,'<')
      .replace(/&gt;/g,'>')
      .replace(/&quot;/g,'"')
      .replace(/&apos;/g,"'")
      .replace(/&nbsp;/g,' ')
      .replace(/&#(\d+);/g,function(m,n){return String.fromCharCode(parseInt(n));})
      .replace(/&#x([0-9a-fA-F]+);/g,function(m,h){return String.fromCharCode(parseInt(h,16));});
    document.getElementById('he-text').value=decoded;
  }
  function swap(){
    var t=document.getElementById('he-text').value;
    var e=document.getElementById('he-encoded').value;
    document.getElementById('he-text').value=e;
    document.getElementById('he-encoded').value=t;
  }
  function copy(){
    var el=document.getElementById('he-encoded');
    if(navigator.clipboard)navigator.clipboard.writeText(el.value);
  }
  window._heEncode=encode;window._heDecode=decode;window._heSwap=swap;window._heCopy=copy;
  document.getElementById('he-text').addEventListener('input',encode);
  encode();
})();
</script>
