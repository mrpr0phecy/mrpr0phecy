<h2 id="spcc-title" style="margin-top:0;color:var(--accent);">⚪ Sphere, Cylinder &amp; Cone Volume</h2>

<form aria-describedby="spcc-desc" onsubmit="event.preventDefault();">
  <p id="spcc-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    V_sphere = 4/3 π r³, A = 4 π r². Cylinder π r² h. Cone (1/3) π r² h. Enter radius and height in the same units; volume comes out in those units cubed.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="spcc-r" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Radius</label>
      <input id="spcc-r" type="number" min="0" step="any" value="3" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="spcc-h" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Height (cyl / cone)</label>
      <input id="spcc-h" type="number" min="0" step="any" value="8" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="spcc-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var r = Number($('spcc-r').value), h = Number($('spcc-h').value);
    if (!(r >= 0) || !(h >= 0)) {
      $('spcc-out').textContent = 'Enter radius and height.';
      return;
    }
    var sphV = 4 / 3 * Math.PI * r * r * r;
    var sphA = 4 * Math.PI * r * r;
    var cylV = Math.PI * r * r * h;
    var cylA = 2 * Math.PI * r * (r + h);
    var coneV = cylV / 3;
    var slant = Math.sqrt(r * r + h * h);
    var coneA = Math.PI * r * (r + slant);
    $('spcc-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Sphere volume', sphV.toPrecision(6)) +
      cell('Sphere surface', sphA.toPrecision(6)) +
      cell('Cylinder volume', cylV.toPrecision(6)) +
      cell('Cylinder surface', cylA.toPrecision(6)) +
      cell('Cone volume', coneV.toPrecision(6)) +
      cell('Cone surface (incl. base)', coneA.toPrecision(6)) +
      cell('Cone slant', slant.toPrecision(6)) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">A hemisphere is half the sphere volume and 3 π r² of surface if you include the disk. Diameter = 2r.</p>';
  }
  $('spcc-r').addEventListener('input', run);
  $('spcc-h').addEventListener('input', run);
  run();
})();
</script>
