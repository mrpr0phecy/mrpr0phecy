<h2 id="hatz-title" style="margin-top:0;color:var(--accent);">🎩 Hat Size Converter</h2>

<form aria-describedby="hatz-desc" onsubmit="event.preventDefault();">
  <p id="hatz-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Convert head circumference to UK, US and cm hat sizes. US size ≈ circumference in inches ÷ π. Measure just above the ears, level around the widest part. Felt hats often want a snug fit; straw can run tighter.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="hatz-cm" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Head circumference (cm)</label>
      <input id="hatz-cm" type="number" min="40" max="70" step="any" value="57" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="hatz-in" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Inches</label>
      <input id="hatz-in" type="number" min="15" max="28" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="hatz-us" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">US size</label>
      <input id="hatz-us" type="number" min="6" max="8.5" step="0.125" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="hatz-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var lock = false;
  function label(cm) {
    if (cm < 54) return 'XS';
    if (cm < 56) return 'S';
    if (cm < 58) return 'M';
    if (cm < 60) return 'L';
    if (cm < 62) return 'XL';
    return 'XXL';
  }
  function apply(cm) {
    if (!(cm > 0) || lock) return;
    var inch = cm / 2.54;
    var us = inch / Math.PI;
    var uk = us - 0.125;
    lock = true;
    $('hatz-cm').value = String(Number(cm.toFixed(1)));
    $('hatz-in').value = String(Number(inch.toFixed(2)));
    $('hatz-us').value = String(Number(us.toFixed(3)));
    lock = false;
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('hatz-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;">' +
      cell('cm', cm.toFixed(1)) +
      cell('Inches', inch.toFixed(2)) +
      cell('US', us.toFixed(2)) +
      cell('UK', uk.toFixed(2)) +
      cell('Letter', label(cm)) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">A UK 7 is often a US 7⅛. If you are between sizes, size up for fitted caps and down for crushable felt you can steam.</p>';
  }
  $('hatz-cm').addEventListener('input', function () { apply(Number($('hatz-cm').value)); });
  $('hatz-in').addEventListener('input', function () { apply(Number($('hatz-in').value) * 2.54); });
  $('hatz-us').addEventListener('input', function () { apply(Number($('hatz-us').value) * Math.PI * 2.54); });
  apply(57);
})();
</script>
