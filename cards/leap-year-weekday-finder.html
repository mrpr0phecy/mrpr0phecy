<h2 id="leap-title" style="margin-top:0;color:var(--accent);">📆 Leap Year &amp; Weekday</h2>

<form aria-describedby="leap-desc" onsubmit="event.preventDefault();">
  <p id="leap-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Gregorian leap years are divisible by 4, except centuries unless divisible by 400. 1900 was not a leap year; 2000 was. Also shows the weekday for any date your browser can represent.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="leap-year" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Year</label>
      <input id="leap-year" type="number" step="1" value="2028" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="leap-date" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Any date</label>
      <input id="leap-date" type="date" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="leap-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function isLeap(y) { return y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0); }
  (function init() {
    var t = new Date();
    $('leap-date').value = t.toISOString().slice(0, 10);
    $('leap-year').value = String(t.getFullYear());
  })();
  function run() {
    var y = Number($('leap-year').value);
    var leap = isLeap(y);
    var d = $('leap-date').value ? new Date($('leap-date').value + 'T12:00:00') : null;
    var next = y;
    while (!isLeap(next)) next++;
    if (leap) { next = y + 4; while (!isLeap(next)) next++; }
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('leap-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell(String(y), leap ? 'leap year — 366 days' : 'common year — 365 days') +
      cell('Next leap year', String(next)) +
      cell('29 Feb exists', leap ? 'yes' : 'no') +
      cell(d ? d.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' }) : 'Date', d ? d.toLocaleDateString(undefined, { weekday: 'long' }) : '—') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">The Julian calendar leapt every 4 years with no century exception. Britain switched in 1752. Weekdays use this device’s Gregorian calendar.</p>';
  }
  $('leap-year').addEventListener('input', run);
  $('leap-date').addEventListener('input', run);
  run();
})();
</script>
