<h2 id="gmq-title" style="margin-top:0;color:var(--accent);">💬 Great Minds Quote Explorer</h2>
<p id="gmq-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;">40 inspiring quotes from history's greatest scientists, inventors and thinkers — each with context about who said it and why it matters. Search, filter by theme, save favourites.</p>

<div id="gmq-daily" style="margin-bottom:12px;padding:12px 14px;background:linear-gradient(135deg,rgba(157,78,221,.12),rgba(157,78,221,.03));border:1px solid rgba(157,78,221,.4);border-radius:10px;font-size:.88rem;"></div>

<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center;">
  <select id="gmq-theme" aria-label="Theme filter" style="padding:9px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    <option value="all">🌈 All themes</option>
    <option value="Curiosity">🔭 Curiosity</option>
    <option value="Perseverance">🔥 Perseverance</option>
    <option value="Creativity">🎨 Creativity</option>
    <option value="Learning">📚 Learning</option>
    <option value="Courage">🦁 Courage</option>
  </select>
  <input id="gmq-search" type="text" placeholder="Search quotes or authors…" aria-label="Search quotes" style="flex:1;min-width:150px;padding:9px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
  <button type="button" id="gmq-random" style="padding:9px 16px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-weight:800;">🎲 Surprise me</button>
  <button type="button" id="gmq-showfav" style="padding:9px 14px;background:rgba(255,255,255,.07);color:var(--text);border:1px solid rgba(255,255,255,.18);border-radius:8px;cursor:pointer;font-weight:700;">★ Saved (<span id="gmq-favcount">0</span>)</button>
</div>

<div id="gmq-card" style="background:#071019;border:1px solid rgba(45,212,255,.3);border-radius:12px;padding:22px;"></div>
<div id="gmq-list" style="display:none;margin-top:10px;"></div>

<script>
(function(){
  function $(id){ return document.getElementById(id); }
  var Q = [
    ["I have no special talent. I am only passionately curious.","Albert Einstein","Theoretical physicist, relativity (1879–1955)","Curiosity"],
    ["The important thing is not to stop questioning.","Albert Einstein","Theoretical physicist, relativity (1879–1955)","Curiosity"],
    ["Nothing in life is to be feared, it is only to be understood.","Marie Curie","Physicist & chemist, two-time Nobel laureate (1867–1934)","Curiosity"],
    ["If I have seen further it is by standing on the shoulders of Giants.","Isaac Newton","Physicist, laws of motion & gravity (1643–1727)","Curiosity"],
    ["Somewhere, something incredible is waiting to be known.","Carl Sagan","Astronomer & science communicator (1934–1996)","Curiosity"],
    ["All truths are easy to understand once they are discovered; the point is to discover them.","Galileo Galilei","Astronomer & physicist (1564–1642)","Curiosity"],
    ["I would rather have questions that can't be answered than answers that can't be questioned.","Richard Feynman","Physicist & legendary teacher (1918–1988)","Curiosity"],
    ["It is the mark of an educated mind to be able to entertain a thought without accepting it.","Aristotle","Greek philosopher & scientist (384–322 BC)","Curiosity"],
    ["Genius is one percent inspiration and ninety-nine percent perspiration.","Thomas Edison","Inventor, 1,093 US patents (1847–1931)","Perseverance"],
    ["I have not failed. I've just found 10,000 ways that won't work.","Thomas Edison","Inventor of the light bulb & phonograph (1847–1931)","Perseverance"],
    ["Many of life's failures are people who did not realize how close they were to success when they gave up.","Thomas Edison","Inventor, 1,093 US patents (1847–1931)","Perseverance"],
    ["It always seems impossible until it's done.","Nelson Mandela","Anti-apartheid leader, Nobel Peace laureate (1918–2013)","Perseverance"],
    ["It does not matter how slowly you go as long as you do not stop.","Confucius","Chinese philosopher (551–479 BC)","Perseverance"],
    ["A man who dares to waste one hour of time has not discovered the value of life.","Charles Darwin","Naturalist, theory of evolution (1809–1882)","Perseverance"],
    ["It's not whether you get knocked down, it's whether you get up.","Vince Lombardi","American football coach (1913–1970)","Perseverance"],
    ["Our greatest weakness lies in giving up. The most certain way to succeed is always to try just one more time.","Thomas Edison","Inventor, 1,093 US patents (1847–1931)","Perseverance"],
    ["Creativity is just connecting things.","Steve Jobs","Co-founder of Apple (1955–2011)","Creativity"],
    ["Every child is an artist. The problem is how to remain an artist once we grow up.","Pablo Picasso","Painter, co-founder of Cubism (1881–1973)","Creativity"],
    ["Logic will get you from A to B. Imagination will take you everywhere.","Albert Einstein","Theoretical physicist, relativity (1879–1955)","Creativity"],
    ["You can't use up creativity. The more you use, the more you have.","Maya Angelou","Poet & civil rights activist (1928–2014)","Creativity"],
    ["The secret of getting ahead is getting started.","Mark Twain","Writer & humorist (1835–1910)","Creativity"],
    ["Imagination is more important than knowledge.","Albert Einstein","Theoretical physicist, relativity (1879–1955)","Creativity"],
    ["Simplicity is the ultimate sophistication.","Leonardo da Vinci","Polymath: artist, inventor, scientist (1452–1519)","Creativity"],
    ["I invent nothing, I rediscover.","Auguste Rodin","Sculptor of The Thinker (1840–1917)","Creativity"],
    ["Education is the most powerful weapon which you can use to change the world.","Nelson Mandela","Anti-apartheid leader (1918–2013)","Learning"],
    ["Live as if you were to die tomorrow. Learn as if you were to live forever.","Mahatma Gandhi","Leader of Indian independence (1869–1948)","Learning"],
    ["An investment in knowledge pays the best interest.","Benjamin Franklin","Polymath & Founding Father (1706–1790)","Learning"],
    ["I know that I know nothing.","Socrates","Greek philosopher (470–399 BC)","Learning"],
    ["I hear and I forget. I see and I remember. I do and I understand.","Confucius","Chinese philosopher (551–479 BC)","Learning"],
    ["Education is not the learning of facts, but the training of the mind to think.","Albert Einstein","Theoretical physicist (1879–1955)","Learning"],
    ["Learning never exhausts the mind.","Leonardo da Vinci","Polymath (1452–1519)","Learning"],
    ["One child, one teacher, one book, one pen can change the world.","Malala Yousafzai","Education activist, youngest Nobel laureate (b. 1997)","Learning"],
    ["I learned that courage was not the absence of fear, but the triumph over it.","Nelson Mandela","From 'Long Walk to Freedom' (1918–2013)","Courage"],
    ["The most difficult thing is the decision to act, the rest is merely tenacity.","Amelia Earhart","Aviation pioneer (1897–1937)","Courage"],
    ["Life is either a daring adventure or nothing at all.","Helen Keller","Author & activist, deafblind from childhood (1880–1968)","Courage"],
    ["Do what you can, with what you have, where you are.","Theodore Roosevelt","26th US President & explorer (1858–1919)","Courage"],
    ["It is not because things are difficult that we do not dare; it is because we do not dare that they are difficult.","Seneca","Roman philosopher (4 BC–65 AD)","Courage"],
    ["Faith is taking the first step even when you don't see the whole staircase.","Martin Luther King Jr.","Civil rights leader (1929–1968)","Courage"],
    ["I have learned over the years that when one's mind is made up, this diminishes fear.","Rosa Parks","Civil rights pioneer (1913–2005)","Courage"],
    ["Courage is what it takes to stand up and speak; courage is also what it takes to sit down and listen.","Winston Churchill","British Prime Minister (1874–1965)","Courage"]
  ];
  var EMOJI = { Curiosity: "🔭", Perseverance: "🔥", Creativity: "🎨", Learning: "📚", Courage: "🦁" };
  var cur = 0, favs = [];
  try { favs = JSON.parse(localStorage.getItem("gmq-favs") || "[]"); } catch (e) { favs = []; }
  function paintFavCount(){ $("gmq-favcount").textContent = favs.length; }
  paintFavCount();
  (function(){
    var d = new Date(), i = (d.getFullYear() * 372 + (d.getMonth() + 1) * 31 + d.getDate()) % Q.length;
    $("gmq-daily").innerHTML = "<b>📅 Quote of the day:</b> <i>“" + Q[i][0] + "”</i> — <b>" + Q[i][1] + "</b>";
  })();
  function show(i){
    cur = i; var q = Q[i];
    $("gmq-list").style.display = "none"; $("gmq-card").style.display = "block";
    var saved = favs.indexOf(i) !== -1;
    $("gmq-card").innerHTML = "<div style='font-size:.75rem;color:var(--text-secondary);letter-spacing:.1em;margin-bottom:10px;'>" + EMOJI[q[3]] + " " + q[3].toUpperCase() + " · " + (i + 1) + "/" + Q.length + "</div>"
      + "<div style='font-size:1.3rem;font-weight:700;line-height:1.5;margin-bottom:10px;'>“" + q[0] + "”</div>"
      + "<div style='font-size:.9rem;color:var(--accent);font-weight:700;'>— " + q[1] + "</div>"
      + "<div style='font-size:.8rem;color:var(--text-secondary);margin-bottom:14px;'>" + q[2] + "</div>"
      + "<div style='display:flex;gap:8px;flex-wrap:wrap;'>"
      + "<button type='button' id='gmq-prev' style='padding:9px 16px;background:rgba(255,255,255,.07);color:var(--text);border:1px solid rgba(255,255,255,.18);border-radius:8px;cursor:pointer;font-weight:700;'>← Prev</button>"
      + "<button type='button' id='gmq-nextb' style='padding:9px 16px;background:rgba(255,255,255,.07);color:var(--text);border:1px solid rgba(255,255,255,.18);border-radius:8px;cursor:pointer;font-weight:700;'>Next →</button>"
      + "<button type='button' id='gmq-fav' style='padding:9px 16px;background:rgba(255,215,0,.1);color:#ffd700;border:1px solid rgba(255,215,0,.4);border-radius:8px;cursor:pointer;font-weight:700;'>" + (saved ? "♥ Saved" : "♡ Save") + "</button>"
      + "<button type='button' id='gmq-copy' style='padding:9px 16px;background:rgba(255,255,255,.07);color:var(--text);border:1px solid rgba(255,255,255,.18);border-radius:8px;cursor:pointer;font-weight:700;'>📋 Copy</button>"
      + "<span id='gmq-msg' style='align-self:center;font-size:.8rem;color:#7dff6a;'></span></div>";
    document.getElementById("gmq-prev").addEventListener("click", function(){ step(-1); });
    document.getElementById("gmq-nextb").addEventListener("click", function(){ step(1); });
    document.getElementById("gmq-fav").addEventListener("click", toggleFav);
    document.getElementById("gmq-copy").addEventListener("click", function(){
      var txt = "“" + q[0] + "” — " + q[1];
      function done(){ document.getElementById("gmq-msg").textContent = "✓ Copied!"; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function(){ fallback(); });
      else fallback();
      function fallback(){ var h = document.createElement("textarea"); h.value = txt; document.body.appendChild(h); h.select(); try { document.execCommand("copy"); } catch (e) {} h.remove(); done(); }
    });
  }
  function pool(){
    var t = $("gmq-theme").value, s = $("gmq-search").value.trim().toLowerCase();
    var idx = [];
    Q.forEach(function(q, i){
      if (t !== "all" && q[3] !== t) return;
      if (s && (q[0] + " " + q[1]).toLowerCase().indexOf(s) === -1) return;
      idx.push(i);
    });
    return idx;
  }
  function step(d){
    var p = pool();
    if (!p.length) return;
    var at = p.indexOf(cur);
    show(p[(at + d + p.length) % p.length]);
  }
  function toggleFav(){
    var at = favs.indexOf(cur);
    if (at === -1) favs.push(cur); else favs.splice(at, 1);
    try { localStorage.setItem("gmq-favs", JSON.stringify(favs)); } catch (e) {}
    paintFavCount(); show(cur);
  }
  $("gmq-random").addEventListener("click", function(){
    var p = pool(); if (!p.length) return;
    show(p[Math.floor(Math.random() * p.length)]);
  });
  $("gmq-theme").addEventListener("change", function(){
    var p = pool(); if (p.length) show(p[0]);
  });
  $("gmq-search").addEventListener("input", function(){
    var p = pool();
    if (!p.length) { $("gmq-card").innerHTML = "<div style='color:var(--text-secondary);'>No quotes match — try another word.</div>"; return; }
    if (p.indexOf(cur) === -1) show(p[0]);
  });
  $("gmq-showfav").addEventListener("click", function(){
    var L = $("gmq-list");
    if (!favs.length) { L.style.display = "block"; L.innerHTML = "<div style='font-size:.85rem;color:var(--text-secondary);'>No saved quotes yet — tap ♡ Save on any quote that moves you.</div>"; return; }
    L.style.display = "block"; $("gmq-card").style.display = "none";
    L.innerHTML = "<b>★ Your saved quotes (" + favs.length + ")</b>" + favs.map(function(i){
      return "<div data-gmq-open='" + i + "' style='cursor:pointer;margin-top:8px;padding:10px 12px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:.85rem;'><i>“" + Q[i][0] + "”</i><br><span style='color:var(--accent);'>— " + Q[i][1] + "</span></div>";
    }).join("");
    L.querySelectorAll("[data-gmq-open]").forEach(function(el){
      el.addEventListener("click", function(){ show(+el.getAttribute("data-gmq-open")); });
    });
  });
  show(new Date().getDate() % Q.length);
})();
</script>
