<h2>🔐 Password Strength Checker</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Analyze password strength in real time. Check length, complexity, common patterns, and estimated crack time.</p>

<div id="ps-app" style="max-width:500px;margin:0 auto;">
  <div style="margin-bottom:16px;">
    <label style="display:block;margin-bottom:6px;color:#2dd4ff;font-size:13px;">Enter Password</label>
    <div style="position:relative;">
      <input id="ps-input" type="password" style="width:100%;padding:12px 40px 12px 12px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:16px;box-sizing:border-box;" placeholder="Type a password..." />
      <button onclick="window._psToggle()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(230,250,255,0.5);cursor:pointer;font-size:18px;">👁</button>
    </div>
  </div>

  <div id="ps-meter" style="height:8px;background:rgba(0,0,0,0.3);border-radius:4px;margin-bottom:8px;overflow:hidden;">
    <div id="ps-bar" style="height:100%;width:0%;border-radius:4px;transition:all 0.3s;"></div>
  </div>

  <div id="ps-label" style="text-align:center;font-size:14px;font-weight:600;margin-bottom:16px;"></div>

  <div id="ps-details" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;"></div>

  <div id="ps-time" style="padding:12px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.05);border-radius:8px;text-align:center;margin-bottom:12px;"></div>

  <div id="ps-tips" style="font-size:12px;color:rgba(230,250,255,0.4);line-height:1.6;"></div>
</div>

<script>
(function(){
  var commonPasswords='password,123456,12345678,qwerty,abc123,monkey,master,dragon,111111,baseball,iloveyou,trustno1,sunshine,princess,football,shadow,superman,michael,ninja,mustang,jessica,charlie,ashley,bailey,passw0rd,letmein,welcome,login,admin,pass,12345,1234,123,qwerty123,pass123,hello,love,star,winter,summer,spring,autumn'.split(',');
  function analyze(){
    var pw=document.getElementById('ps-input').value;
    if(!pw){document.getElementById('ps-bar').style.width='0%';document.getElementById('ps-label').textContent='';document.getElementById('ps-details').innerHTML='';document.getElementById('ps-time').innerHTML='';document.getElementById('ps-tips').innerHTML='';return;}
    var score=0;
    var checks={
      length:pw.length>=8,
      longLength:pw.length>=12,
      veryLong:pw.length>=16,
      upper:/[A-Z]/.test(pw),
      lower:/[a-z]/.test(pw),
      digit:/[0-9]/.test(pw),
      special:/[^A-Za-z0-9]/.test(pw),
      noCommon:commonPasswords.indexOf(pw.toLowerCase())<0,
      noRepeats:!/(.)\1{2,}/.test(pw),
      noSequential:!/(?:abc|bcd|cde|def|efg|fgh|ghi|hij|ijk|jkl|klm|lmn|mno|nop|opq|pqr|qrs|rst|stu|tuv|uvw|vwx|wxy|xyz|012|123|234|345|456|567|678|789)/i.test(pw),
      noKeyboard:!/(?:qwert|asdf|zxcv|qazwsx)/i.test(pw)
    };
    Object.values(checks).forEach(function(v){if(v)score++;});
    var pct=Math.min(100,score/11*100);
    var color,label;
    if(pct<25){color='#ff4d4d';label='Very Weak';}
    else if(pct<50){color='#ff8c42';label='Weak';}
    else if(pct<75){color='#ffa500';label='Fair';}
    else if(pct<90){color='#39ff14';label='Strong';}
    else{color='#00ff88';label='Very Strong';}
    document.getElementById('ps-bar').style.width=pct+'%';
    document.getElementById('ps-bar').style.background=color;
    document.getElementById('ps-label').innerHTML='<span style="color:'+color+';">'+label+'</span>';
    // Details
    var detailsHtml='';
    var items=[
      {ok:checks.length,label:'8+ characters'},
      {ok:checks.longLength,label:'12+ characters'},
      {ok:checks.upper,label:'Uppercase letters'},
      {ok:checks.lower,label:'Lowercase letters'},
      {ok:checks.digit,label:'Numbers'},
      {ok:checks.special,label:'Special characters'},
      {ok:checks.noCommon,label:'Not common'},
      {ok:checks.noRepeats,label:'No repeats'},
      {ok:checks.noSequential,label:'No sequences'},
      {ok:checks.noKeyboard,label:'No keyboard patterns'}
    ];
    items.forEach(function(item){
      detailsHtml+='<div style="display:flex;align-items:center;gap:6px;font-size:12px;">'+
        '<span style="color:'+(item.ok?'#39ff14':'#ff4d4d')+';">'+(item.ok?'✓':'✗')+'</span>'+
        '<span style="color:'+(item.ok?'var(--text)':'rgba(230,250,255,0.4)')+';">'+item.label+'</span></div>';
    });
    document.getElementById('ps-details').innerHTML=detailsHtml;
    // Crack time
    var charset=0;
    if(checks.lower)charset+=26;
    if(checks.upper)charset+=26;
    if(checks.digit)charset+=10;
    if(checks.special)charset+=32;
    if(charset===0)charset=26;
    var combinations=Math.pow(charset,pw.length);
    var perSecond=1e10; // 10 billion guesses/sec
    var seconds=combinations/perSecond;
    var timeStr;
    if(seconds<1)timeStr='Instantly';
    else if(seconds<60)timeStr=Math.round(seconds)+' seconds';
    else if(seconds<3600)timeStr=Math.round(seconds/60)+' minutes';
    else if(seconds<86400)timeStr=Math.round(seconds/3600)+' hours';
    else if(seconds<31536000)timeStr=Math.round(seconds/86400)+' days';
    else if(seconds<31536000*1000)timeStr=Math.round(seconds/31536000)+' years';
    else if(seconds<31536000*1e6)timeStr=Math.round(seconds/31536000/1000)+' thousand years';
    else if(seconds<31536000*1e9)timeStr=Math.round(seconds/31536000/1e6)+' million years';
    else timeStr='Billions of years';
    document.getElementById('ps-time').innerHTML='<div style="font-size:12px;color:rgba(230,250,255,0.5);">Estimated crack time (10B guesses/sec)</div><div style="font-size:1.3em;font-weight:700;color:'+color+';margin-top:4px;">'+timeStr+'</div>';
    // Tips
    var tips=[];
    if(!checks.length)tips.push('Use at least 8 characters');
    if(!checks.upper)tips.push('Add uppercase letters');
    if(!checks.lower)tips.push('Add lowercase letters');
    if(!checks.digit)tips.push('Add numbers');
    if(!checks.special)tips.push('Add special characters (!@#$%^&*)');
    if(checks.commonPasswords)tips.push('Avoid common passwords');
    if(pw.length<16)tips.push('Longer passwords are exponentially harder to crack');
    document.getElementById('ps-tips').innerHTML=tips.length?'<b>Tips:</b> '+tips.join(' · '):'<span style="color:#39ff14;">Excellent password! 🎉</span>';
  }
  function toggle(){
    var el=document.getElementById('ps-input');
    el.type=el.type==='password'?'text':'password';
  }
  window._psToggle=toggle;
  document.getElementById('ps-input').addEventListener('input',analyze);
})();
</script>
