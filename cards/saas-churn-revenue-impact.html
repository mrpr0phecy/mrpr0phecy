<h2 id="saas-churn-revenue-impact-title" style="margin-top:0;color:var(--accent)">📉 SaaS Churn Revenue Impact</h2>
<form id="saas-churn-revenue-impact-form" aria-describedby="saas-churn-revenue-impact-desc" onsubmit="event.preventDefault();">
<p id="saas-churn-revenue-impact-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:.9rem">Model recurring revenue lost to churn and the customers needed to maintain or grow monthly revenue. All calculations stay in your browser.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px"><div><label for="saas-churn-revenue-impact-customers" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Current customers</label><input id="saas-churn-revenue-impact-customers" data-key="customers" type="number" step="any" value="500" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="saas-churn-revenue-impact-arpu" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Monthly revenue per customer (£)</label><input id="saas-churn-revenue-impact-arpu" data-key="arpu" type="number" step="any" value="49" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="saas-churn-revenue-impact-churn" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Monthly customer churn (%)</label><input id="saas-churn-revenue-impact-churn" data-key="churn" type="number" step="any" value="4" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="saas-churn-revenue-impact-newcust" style="display:block;margin-bottom:6px;color:var(--text-secondary)">New customers per month</label><input id="saas-churn-revenue-impact-newcust" data-key="newcust" type="number" step="any" value="30" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div></div>
<button type="submit" style="margin-top:16px;padding:11px 18px;border:0;border-radius:8px;background:var(--accent);color:#001018;font-weight:700;cursor:pointer">Calculate</button>
<div id="saas-churn-revenue-impact-out" aria-live="polite" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:16px"></div>
<p style="color:var(--text-secondary);font-size:.78rem;margin-top:12px">Planning estimate only. Check tax, legal and contractual assumptions for your situation.</p>
</form>
<script>
(function(){
 const form=document.getElementById('saas-churn-revenue-impact-form'),out=document.getElementById('saas-churn-revenue-impact-out');
 const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:2}).format(Number.isFinite(n)?n:0);
 const num=(n,d=0)=>Number.isFinite(n)?n.toLocaleString('en-GB',{maximumFractionDigits:d}):'—'; const pct=n=>num(n,1)+'%';
 const dateMonths=n=>{const d=new Date();d.setDate(d.getDate()+Math.max(0,n)*30.44);return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'})};
 function calculate(){const v={};form.querySelectorAll('[data-key]').forEach(x=>v[x.dataset.key]=Number(x.value)); if(Object.values(v).some(x=>!Number.isFinite(x))){out.textContent='Enter valid numbers in every field.';return} const rows=(()=>{const lost=v.customers*v.churn/100, end=v.customers-lost+v.newcust, mrr=end*v.arpu; return [['Customers lost',num(lost,1)],['Ending customers',num(end,1)],['Ending MRR',money(mrr)],['Net MRR change',money(mrr-v.customers*v.arpu)]];})();out.innerHTML='';rows.forEach(r=>{const box=document.createElement('div');box.style.cssText='padding:14px;border:1px solid var(--border-light);border-radius:9px;background:rgba(45,212,255,.06)';const a=document.createElement('div'),b=document.createElement('strong');a.style.cssText='color:var(--text-secondary);font-size:.8rem';b.style.cssText='display:block;color:var(--accent);font-size:1.15rem;margin-top:5px';a.textContent=r[0];b.textContent=r[1];box.append(a,b);out.append(box)})}
 form.addEventListener('submit',calculate);form.addEventListener('input',calculate);calculate();
})();
</script>
