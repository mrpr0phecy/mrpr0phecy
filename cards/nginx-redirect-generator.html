<h2 id="ngxr-title" style="margin-top:0;color:var(--accent);">🔀 Nginx Redirect Generator</h2>

<form aria-describedby="ngxr-desc" onsubmit="event.preventDefault();">
  <p id="ngxr-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Build <code>return</code> / <code>rewrite</code> snippets for 301/302, HTTP→HTTPS and www/apex. Paste into a <code>server { }</code> block. A looping redirect takes a site down — test with <code>nginx -t</code>.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end;margin-bottom:10px;">
    <div>
      <label for="ngxr-from" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">From path</label>
      <input id="ngxr-from" type="text" placeholder="/old" spellcheck="false" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">
    </div>
    <div>
      <label for="ngxr-to" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">To URL</label>
      <input id="ngxr-to" type="text" placeholder="https://example.com/new" spellcheck="false" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">
    </div>
    <div>
      <label for="ngxr-code" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Status</label>
      <select id="ngxr-code" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="301">301 permanent</option>
        <option value="302">302 temporary</option>
      </select>
    </div>
    <div>
      <label for="ngxr-host" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Canonical host</label>
      <input id="ngxr-host" type="text" placeholder="example.com" spellcheck="false" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">
    </div>
  </div>
  <label style="display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--text-secondary);margin:6px 0;"><input id="ngxr-https" type="checkbox" checked style="accent-color:var(--accent);"> Force HTTPS</label>
  <label style="display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--text-secondary);margin:6px 0;"><input id="ngxr-www" type="checkbox" style="accent-color:var(--accent);"> Force www</label>
  <label style="display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--text-secondary);margin:6px 0;"><input id="ngxr-apex" type="checkbox" style="accent-color:var(--accent);"> Force apex (no www)</label>
</form>
<pre id="ngxr-out" style="margin-top:12px;padding:12px;border-radius:10px;background:#071019;border:1px solid rgba(45,212,255,.28);color:#91f7ff;font-size:.78rem;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;"></pre>
<button type="button" id="ngxr-copy" style="margin-top:8px;padding:8px 12px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:700;">Copy snippet</button>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var lines = [];
    var h = $('ngxr-host').value.trim().replace(/^www\./, '');
    if ($('ngxr-https').checked) {
      lines.push('# HTTPS — put this in the :80 server');
      lines.push('return 301 https://$host$request_uri;');
      lines.push('');
    }
    if ($('ngxr-www').checked && h && !$('ngxr-apex').checked) {
      lines.push('# www');
      lines.push('if ($host = ' + h + ') { return 301 https://www.' + h + '$request_uri; }');
      lines.push('');
    }
    if ($('ngxr-apex').checked && h) {
      lines.push('# apex');
      lines.push('if ($host = www.' + h + ') { return 301 https://' + h + '$request_uri; }');
      lines.push('');
    }
    var from = $('ngxr-from').value.trim() || '';
    var to = $('ngxr-to').value.trim();
    var code = $('ngxr-code').value;
    if (from && to) {
      if (from.charAt(0) !== '/') from = '/' + from;
      lines.push('location = ' + from + ' { return ' + code + ' ' + to + '; }');
    }
    $('ngxr-out').textContent = lines.join('\n') || '# fill a path and a destination';
  }
  ['ngxr-from', 'ngxr-to', 'ngxr-code', 'ngxr-https', 'ngxr-www', 'ngxr-apex', 'ngxr-host'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  $('ngxr-copy').addEventListener('click', function () {
    var btn = this, t = $('ngxr-out').textContent;
    function done() { btn.textContent = '✓ Copied'; setTimeout(function () { btn.textContent = 'Copy snippet'; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done); else done();
  });
  run();
})();
</script>
