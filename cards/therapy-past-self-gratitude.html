<h2>📖 You're Already Living Your Dream (You Just Forgot)</h2>
<p class="description">Five years ago, you wished for what you have now. This tool reconnects you with the gap between longing and having — the most overlooked source of gratitude that exists.</p>
<div id="past-app" style="max-width:540px;margin:0 auto;"></div>
<script>
(function(){
'use strict';
var step=0,wish='',current='';
function init(){step=0;render();}
function render(){
  var h='';
  if(step===0){
    h+='<div style="text-align:center;margin-bottom:20px;">';
    h+='<div style="font-size:64px;margin-bottom:12px;">⏳</div>';
    h+='<h3 style="color:#ffd700;margin:0 0 8px;">The amnesia of the present</h3>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);">Humans are extraordinarily bad at remembering what they used to want. You adapt to every new reality within months — psychologists call it <b>hedonic adaptation</b>. The job you fought for, the relationship you longed for, the health you prayed for, the city you dreamed of moving to — once you have it, it becomes invisible. Background. "Normal."</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-top:12px;">This tool doesn\'t ask you to "be grateful" (which often feels forced). It asks you to <b>remember what you wanted</b> — and notice that you\'re holding it right now.</p>';
    h+='</div>';
    h+='<button onclick="window._pastNext()" style="display:block;margin:0 auto;padding:12px 32px;background:linear-gradient(135deg,#ffd700,#ff9500);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px;">Begin</button>';
  }else if(step===1){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">⏪</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">Close your eyes for a moment. Go back <b>5 years</b>. Where were you? What was hard? What did you lie awake wishing for? What did you think would make everything better?</p>';
    h+='<p style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:12px;">It might be a job, a relationship, a place to live, a health outcome, financial stability, creative recognition, or simply peace of mind.</p>';
    h+='<label style="display:block;font-size:13px;color:#ffd700;margin-bottom:6px;font-weight:600;">What did you desperately want 5 years ago?</label>';
    h+='<textarea id="past-wish" rows="3" placeholder="e.g. I wanted to leave that job so badly. I wanted to find someone who understood me. I wanted to stop feeling anxious all the time..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,215,0,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>';
    h+='<button onclick="window._pastNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#ffd700,#ff9500);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Continue</button>';
  }else if(step===2){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">⏩</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">Now come back to today. Look at your life <i>right now</i>. Not the idealised version — the real one. What from that old wish has actually come true — even partially? What do you have now that you didn\'t then?</p>';
    h+='<p style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:12px;">Be honest. It doesn\'t have to be perfect. Even 30% of a wish fulfilled is 30% more than you had.</p>';
    h+='<label style="display:block;font-size:13px;color:#ffd700;margin-bottom:6px;font-weight:600;">What do you have now that your past self would be amazed by?</label>';
    h+='<textarea id="past-now" rows="3" placeholder="e.g. I actually left. I have a partner who gets me. The anxiety is still there but I have tools now. I have my own place..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,215,0,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>';
    h+='<button onclick="window._pastNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#ffd700,#ff9500);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;">See the Truth</button>';
  }else if(step===3){
    h+='<div style="text-align:center;margin-bottom:20px;"><div style="font-size:64px;">✨</div></div>';
    h+='<div style="background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.2);border-radius:10px;padding:20px;margin-bottom:16px;">';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0;">Five years ago, you wrote in the dark about:</p>';
    h+='<p style="font-size:15px;line-height:1.8;color:#ffd700;margin:8px 0 16px;font-style:italic;">"'+wish+'"</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0;">Today, you have:</p>';
    h+='<p style="font-size:15px;line-height:1.8;color:#ffd700;margin:8px 0 16px;font-style:italic;">"'+current+'"</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:#e6faff;margin:0;"><b>You are not where you started.</b> The distance you\'ve travelled is invisible to you because you travelled it one day at a time. But if you could show your past self your present life — they would weep with relief.</p>';
    h+='</div>';
    h+='<p style="font-size:13px;color:var(--text-secondary);line-height:1.7;">This isn\'t toxic positivity. Your problems are real. But <b>hedonic adaptation</b> means you\'ve already forgotten how far you\'ve come. The things you have now were once the things you\'d have given anything for. That\'s not a reason to stop growing — it\'s a reason to pause and honour the growth.</p>';
    h+='<button onclick="window._pastReset()" style="display:block;margin:20px auto 0;padding:10px 24px;background:rgba(255,215,0,0.15);color:#ffd700;border:1px solid rgba(255,215,0,0.3);border-radius:8px;cursor:pointer;font-weight:600;">Start Over</button>';
  }
  document.getElementById('past-app').innerHTML=h;
}
window._pastNext=function(){
  if(step===1){var w=document.getElementById('past-wish');if(w){wish=w.value.trim()||'something better';}}
  if(step===2){var c=document.getElementById('past-now');if(c){current=c.value.trim()||'more than I realise';}}
  step++;render();
};
window._pastReset=function(){init();};
init();
})();
</script>
