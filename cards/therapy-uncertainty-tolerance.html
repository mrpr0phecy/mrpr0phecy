<h2>🌊 Learning to Swim in Not Knowing</h2>
<p class="description">Most of your suffering comes not from bad outcomes, but from the gap between "I need to know" and "I can't know yet." This tool trains your tolerance for uncertainty — the single most underrated mental health skill.</p>
<div id="ut-app" style="max-width:540px;margin:0 auto;"></div>
<script>
(function(){
'use strict';
var step=0,uncertainty='',cost='';
function init(){step=0;render();}
function render(){
  var h='';
  if(step===0){
    h+='<div style="text-align:center;margin-bottom:20px;">';
    h+='<div style="font-size:64px;margin-bottom:12px;">🌊</div>';
    h+='<h3 style="color:#2dd4ff;margin:0 0 8px;">The addiction no one talks about</h3>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);">Humans are certainty addicts. Your brain would rather have a <i>definite bad outcome</i> than an <i>uncertain maybe</i>. This is why you check your phone 15 times for a reply, rehearse arguments that haven\'t happened, and catastrophise about futures that don\'t exist yet. The uncertainty itself is the pain — not the outcome.</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-top:12px;">Research by Michel Dugas at the Université du Québec shows that <b>intolerance of uncertainty</b> is the single strongest predictor of generalised anxiety — stronger than genetics, trauma, or personality. The good news: it\'s trainable. You can build tolerance for not knowing, the same way you build muscle. This tool shows you how.</p>';
    h+='</div>';
    h+='<button onclick="window._utNext()" style="display:block;margin:0 auto;padding:12px 32px;background:linear-gradient(135deg,#2dd4ff,#1aa3cc);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px;">Begin</button>';
  }else if(step===1){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">❓</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">What uncertainty are you sitting in right now that\'s causing the most distress? Not a problem — an <b>unknown</b>. Something you can\'t resolve no matter how much you think about it.</p>';
    h+='<p style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:12px;">Examples: "Will they offer me the job?" "Is this relationship going to work?" "Are my test results okay?" "Am I on the right path?"</p>';
    h+='<label style="display:block;font-size:13px;color:#2dd4ff;margin-bottom:6px;font-weight:600;">What can\'t you know right now?</label>';
    h+='<textarea id="ut-unc" rows="3" placeholder="e.g. I don\'t know if my business will survive the year. I keep checking the numbers but I can\'t know yet..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>';
    h+='<button onclick="window._utNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#2dd4ff,#1aa3cc);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Continue</button>';
  }else if(step===2){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">💸</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">Now the painful question: <b>what is your need for certainty costing you?</b> Not the uncertainty itself — your <i>reaction</i> to it. What are you losing by trying to resolve something that can\'t be resolved yet?</p>';
    h+='<p style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:12px;">Common costs: sleep, presence with loved ones, enjoyment of the present, energy, peace of mind, productivity on things you can control</p>';
    h+='<label style="display:block;font-size:13px;color:#2dd4ff;margin-bottom:6px;font-weight:600;">What is the need for certainty costing you?</label>';
    h+='<textarea id="ut-cost" rows="3" placeholder="e.g. I can\'t sleep. I\'m irritable with my partner. I spend hours researching worst-case scenarios instead of working..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>';
    h+='<button onclick="window._utNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#2dd4ff,#1aa3cc);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;">See the Shift</button>';
  }else if(step===3){
    h+='<div style="text-align:center;margin-bottom:20px;"><div style="font-size:64px;">🌊</div></div>';
    h+='<div style="background:rgba(45,212,255,0.08);border:1px solid rgba(45,212,255,0.2);border-radius:10px;padding:20px;margin-bottom:16px;">';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0 0 12px;">You\'re sitting in: <span style="color:#2dd4ff;">"'+uncertainty+'"</span></p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0 0 16px;">Your need for certainty is costing you: <span style="color:#ff6b81;">"'+cost+'"</span></p>';
    h+='<p style="font-size:15px;line-height:1.8;color:#e6faff;margin:0;"><b>The shift:</b></p><br>';
    h+='<p style="font-size:14px;line-height:1.8;color:#e6faff;margin:0;">You have been treating uncertainty as a problem to solve. It isn\'t. <b>Uncertainty is a condition to tolerate.</b> The difference is everything:</p><br>';
    h+='<p style="font-size:14px;line-height:1.8;color:#e6faff;margin:0;">• <b>Problem-solving mode:</b> "I need to figure this out." → endless rumination, checking, researching, seeking reassurance. Cost: '+cost+'</p><br>';
    h+='<p style="font-size:14px;line-height:1.8;color:#e6faff;margin:0;">• <b>Tolerance mode:</b> "I don\'t know yet. That\'s uncomfortable, but I can be uncomfortable." → the energy you were spending on certainty is now available for living.</p><br>';
    h+='<p style="font-size:14px;line-height:1.8;color:#2dd4ff;margin:0;font-style:italic;">Try saying this: "I don\'t know. And I\'m going to be okay anyway."</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:#2dd4ff;margin:8px 0 0;font-style:italic;">Not because the outcome will be good. But because you have survived every uncertain moment of your life so far. Your track record for getting through not-knowing is 100%.</p>';
    h+='</div>';
    h+='<p style="font-size:13px;color:var(--text-secondary);line-height:1.7;">This is the foundation of <b>Acceptance and Commitment Therapy (ACT)</b> and <b>Metacognitive Therapy</b> — two of the most effective treatments for anxiety. The goal isn\'t to become certain. It\'s to stop needing certainty before you can function. Every minute you spend trying to resolve an unresolvable uncertainty is a minute stolen from the life you\'re actually living.</p>';
    h+='<button onclick="window._utReset()" style="display:block;margin:20px auto 0;padding:10px 24px;background:rgba(45,212,255,0.15);color:#2dd4ff;border:1px solid rgba(45,212,255,0.3);border-radius:8px;cursor:pointer;font-weight:600;">Start Over</button>';
  }
  document.getElementById('ut-app').innerHTML=h;
}
window._utNext=function(){
  if(step===1){var u=document.getElementById('ut-unc');if(u){uncertainty=u.value.trim()||'something I can\'t know yet';}}
  if(step===2){var c=document.getElementById('ut-cost');if(c){cost=c.value.trim()||'my peace of mind';}}
  step++;render();
};
window._utReset=function(){init();};
init();
})();
</script>
