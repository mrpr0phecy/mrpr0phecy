<h2 id="gpsd-title" style="margin-top:0;color:var(--accent);">🧭 GPS DMS ⇄ Decimal</h2>

<form aria-describedby="gpsd-desc" onsubmit="event.preventDefault();">
  <p id="gpsd-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Convert latitude and longitude between degrees-minutes-seconds and decimal degrees. Decimal = degrees + minutes/60 + seconds/3600. South and west are negative. No map is loaded — nothing leaves the device.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="gpsd-latd" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Lat °</label>
      <input id="gpsd-latd" type="number" step="any" value="51" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="gpsd-latm" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Lat ′</label>
      <input id="gpsd-latm" type="number" min="0" max="59.999" step="any" value="52" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="gpsd-lats" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Lat ″</label>
      <input id="gpsd-lats" type="number" min="0" max="59.999" step="any" value="42" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="gpsd-latns" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">N / S</label>
      <select id="gpsd-latns" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="1">N</option>
        <option value="-1">S</option>
      </select>
    </div>
    <div>
      <label for="gpsd-lond" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Lon °</label>
      <input id="gpsd-lond" type="number" step="any" value="0" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="gpsd-lonm" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Lon ′</label>
      <input id="gpsd-lonm" type="number" min="0" max="59.999" step="any" value="25" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="gpsd-lons" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Lon ″</label>
      <input id="gpsd-lons" type="number" min="0" max="59.999" step="any" value="12" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="gpsd-lonew" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">E / W</label>
      <select id="gpsd-lonew" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="-1" selected>W</option>
        <option value="1">E</option>
      </select>
    </div>
    <div>
      <label for="gpsd-latdec" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Decimal lat</label>
      <input id="gpsd-latdec" type="number" step="any" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="gpsd-londec" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Decimal lon</label>
      <input id="gpsd-londec" type="number" step="any" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="gpsd-out" style="margin-top:14px;font-size:.84rem;color:var(--text);"></div>
<button type="button" id="gpsd-copy" style="margin-top:8px;padding:8px 12px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:700;">Copy decimal pair</button>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var lock = false;
  function toDec(d, m, s, sign) {
    return sign * (Math.abs(d) + Math.abs(m) / 60 + Math.abs(s) / 3600);
  }
  function toDms(dec) {
    var sign = dec < 0 ? -1 : 1;
    var a = Math.abs(dec);
    var d = Math.floor(a);
    var mFloat = (a - d) * 60;
    var m = Math.floor(mFloat);
    var s = (mFloat - m) * 60;
    return { sign: sign, d: d, m: m, s: s };
  }
  function fromDms() {
    if (lock) return;
    var lat = toDec(Number($('gpsd-latd').value), Number($('gpsd-latm').value), Number($('gpsd-lats').value), Number($('gpsd-latns').value));
    var lon = toDec(Number($('gpsd-lond').value), Number($('gpsd-lonm').value), Number($('gpsd-lons').value), Number($('gpsd-lonew').value));
    lock = true;
    $('gpsd-latdec').value = lat.toFixed(6);
    $('gpsd-londec').value = lon.toFixed(6);
    lock = false;
    $('gpsd-out').textContent = lat.toFixed(6) + ', ' + lon.toFixed(6);
  }
  function fromDec() {
    if (lock) return;
    var lat = Number($('gpsd-latdec').value), lon = Number($('gpsd-londec').value);
    var L = toDms(lat), O = toDms(lon);
    lock = true;
    $('gpsd-latd').value = L.d; $('gpsd-latm').value = L.m; $('gpsd-lats').value = Number(L.s.toFixed(2)); $('gpsd-latns').value = String(L.sign);
    $('gpsd-lond').value = O.d; $('gpsd-lonm').value = O.m; $('gpsd-lons').value = Number(O.s.toFixed(2)); $('gpsd-lonew').value = String(O.sign);
    lock = false;
    $('gpsd-out').textContent = lat.toFixed(6) + ', ' + lon.toFixed(6);
  }
  ['gpsd-latd', 'gpsd-latm', 'gpsd-lats', 'gpsd-latns', 'gpsd-lond', 'gpsd-lonm', 'gpsd-lons', 'gpsd-lonew'].forEach(function (id) {
    $(id).addEventListener('input', fromDms);
    $(id).addEventListener('change', fromDms);
  });
  $('gpsd-latdec').addEventListener('input', fromDec);
  $('gpsd-londec').addEventListener('input', fromDec);
  $('gpsd-copy').addEventListener('click', function () {
    var t = $('gpsd-out').textContent, btn = this;
    function done() { btn.textContent = '✓ Copied'; setTimeout(function () { btn.textContent = 'Copy decimal pair'; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done);
    else done();
  });
  fromDms();
})();
</script>
