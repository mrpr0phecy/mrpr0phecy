<!-- cards/brick-calculator.html -->
<h2 id="brkcalc-title" style="margin-top:0;color:var(--accent);">🧱 Brick Calculator</h2>

<form aria-describedby="brkcalc-desc" onsubmit="event.preventDefault();">
  <p id="brkcalc-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Calculate how many bricks you need for any wall — including mortar joints, waste, and pallets to order. Works for UK standard, metric, and imperial bricks.
  </p>

  <div style="margin-bottom:12px;">
    <label for="brkcalc-type" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Brick Type</label>
    <select id="brkcalc-type" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="uk" selected>UK Standard (215×102.5×65 mm)</option>
      <option value="metric">Metric (200×100×65 mm)</option>
      <option value="imperial">Imperial (230×110×73 mm)</option>
      <option value="modular">Modular (194×92×57 mm)</option>
      <option value="engineering">Engineering (215×102.5×65 mm, low porosity)</option>
    </select>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="brkcalc-w" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Wall Width (m)</label>
      <input id="brkcalc-w" type="number" step="0.1" min="0.5" value="6" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="brkcalc-h" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Wall Height (m)</label>
      <input id="brkcalc-h" type="number" step="0.1" min="0.3" value="2.4" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="brkcalc-bond" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Bond Pattern</label>
      <select id="brkcalc-bond" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="stretcher" selected>Stretcher (half-brick / single skin)</option>
        <option value="english">English Bond (one brick / double skin)</option>
        <option value="flemish">Flemish Bond (one brick / double skin)</option>
        <option value="header">Header Bond (one brick thick)</option>
      </select>
    </div>
    <div>
      <label for="brkcalc-joint" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Mortar Joint (mm)</label>
      <select id="brkcalc-joint" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="10" selected>10 mm (standard)</option>
        <option value="8">8 mm (thin joint)</option>
        <option value="12">12 mm (wide joint)</option>
      </select>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
    <div>
      <label for="brkcalc-openings" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Openings (doors/windows)</label>
      <input id="brkcalc-openings" type="number" step="0.1" min="0" value="1.5" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
      <div style="font-size:0.7rem;color:var(--text-secondary);margin-top:2px;">Total area of all openings (m²)</div>
    </div>
    <div>
      <label for="brkcalc-waste" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Waste Allowance</label>
      <select id="brkcalc-waste" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="5">5% — straight walls, no cuts</option>
        <option value="10" selected>10% — standard (recommended)</option>
        <option value="15">15% — lots of corners or openings</option>
      </select>
    </div>
  </div>

  <button type="button" onclick="brkcalcCalc()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🧱 Calculate Bricks Needed
  </button>

  <div id="brkcalc-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;">
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(45,212,255,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">Bricks Needed</div>
        <div id="brkcalc-total" style="font-size:1.4rem;color:var(--accent);font-weight:700;"></div>
      </div>
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(57,255,20,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">Wall Area</div>
        <div id="brkcalc-area" style="font-size:1.4rem;color:#39ff14;font-weight:700;"></div>
      </div>
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(255,215,0,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">Pallets (approx)</div>
        <div id="brkcalc-pallets" style="font-size:1.4rem;color:#ffd700;font-weight:700;"></div>
      </div>
    </div>
    <div id="brkcalc-mortar" style="font-size:0.9rem;color:var(--text);margin-bottom:8px;"></div>
    <div id="brkcalc-cost" style="font-size:1rem;color:var(--accent);font-weight:700;text-align:center;margin-bottom:8px;"></div>
    <div id="brkcalc-tips" style="font-size:0.8rem;color:var(--text-secondary);line-height:1.6;"></div>
  </div>
</form>

<script>
(function(){
  var brkSizes={uk:{l:215,w:102.5,h:65},metric:{l:200,w:100,h:65},imperial:{l:230,w:110,h:73},modular:{l:194,w:92,h:57},engineering:{l:215,w:102.5,h:65}};

  window.brkcalcCalc=function(){
    var type=document.getElementById('brkcalc-type').value;
    var wallW=parseFloat(document.getElementById('brkcalc-w').value);
    var wallH=parseFloat(document.getElementById('brkcalc-h').value);
    var bond=document.getElementById('brkcalc-bond').value;
    var joint=parseInt(document.getElementById('brkcalc-joint').value);
    var openings=parseFloat(document.getElementById('brkcalc-openings').value);
    var waste=parseInt(document.getElementById('brkcalc-waste').value)/100;
    var brick=brkSizes[type];
    var thickness=bond==='stretcher'?1:2;
    var netArea=wallW*wallH-openings;
    if(netArea<0.1)netArea=0.1;
    var effL=(brick.l+joint)/1000;
    var effH=(brick.h+joint)/1000;
    var bricksPerM2=1/(effL*effH);
    var totalBricks=Math.ceil(netArea*bricksPerM2*thickness*(1+waste));
    var pallets=Math.ceil(totalBricks/400);
    var mortarVol=netArea*thickness*0.025;
    var cementBags=Math.ceil(mortarVol*10/6);
    var sandTonnes=(mortarVol*1.5).toFixed(1);
    document.getElementById('brkcalc-total').textContent=totalBricks.toLocaleString();
    document.getElementById('brkcalc-area').textContent=netArea.toFixed(1)+' m²';
    document.getElementById('brkcalc-pallets').textContent=pallets;
    document.getElementById('brkcalc-mortar').innerHTML='🏗️ Mortar: ~<strong>'+cementBags+' bags</strong> cement (25kg) + <strong>'+sandTonnes+' tonnes</strong> sand (1:6 mix)';
    document.getElementById('brkcalc-cost').innerHTML='💰 Bricks at £0.50–£1.20 each: <strong>£'+(totalBricks*0.5).toFixed(0)+' – £'+(totalBricks*1.2).toFixed(0)+'</strong>';
    document.getElementById('brkcalc-tips').innerHTML='💡 <strong>Bricks per m²</strong> (stretcher bond): ~60 for UK standard, ~65 for metric.<br>💡 <strong>Always order from the same batch</strong> — colour varies between firings.<br>💡 <strong>Check brick type:</strong> Facing bricks for visible walls, commons for hidden/internal. Engineering bricks for below DPC.<br>💡 <strong>A pallet holds ~400 bricks</strong> and weighs ~1.7 tonnes — ensure your delivery access can handle a crane lorry.';
    document.getElementById('brkcalc-result').style.display='block';
  };
})();
</script>
