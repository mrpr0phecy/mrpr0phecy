<h2 id="unicode-converter-title">🌐 Unicode Converter</h2>
<p id="unicode-converter-desc" style="color:rgba(214,214,214,0.7);margin-bottom:16px;">Convert text to Unicode code points, HTML entities, and escape sequences. Supports all Unicode characters.</p>

<div id="uc-app" style="max-width:600px;margin:0 auto;">
  <div style="margin-bottom:12px;">
    <label style="display:block;margin-bottom:4px;color:#ffd700;font-size:12px;">Input Text</label>
    <textarea id="uc-input" style="width:100%;height:80px;padding:10px;border-radius:8px;border:1px solid rgba(255,215,0,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;resize:vertical;box-sizing:border-box;" placeholder="Enter text...">Hello 🌍 Café résumé</textarea>
  </div>

  <div style="display:grid;gap:10px;margin-bottom:12px;">
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <label style="color:#d4af37;font-size:12px;">Unicode Code Points (U+XXXX)</label>
        <button onclick="window._ucCopy('uc-unicode')" style="padding:3px 8px;background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.2);border-radius:3px;color:#d4af37;cursor:pointer;font-size:11px;">📋</button>
      </div>
      <textarea id="uc-unicode" readonly style="width:100%;height:50px;padding:8px;border-radius:6px;border:1px solid rgba(212,175,55,0.15);background:rgba(0,0,0,0.2);color:#d4af37;font-family:monospace;font-size:13px;resize:none;box-sizing:border-box;"></textarea>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <label style="color:#a1791f;font-size:12px;">HTML Entities (&#XXXX;)</label>
        <button onclick="window._ucCopy('uc-html')" style="padding:3px 8px;background:rgba(161,121,31,0.1);border:1px solid rgba(161,121,31,0.2);border-radius:3px;color:#a1791f;cursor:pointer;font-size:11px;">📋</button>
      </div>
      <textarea id="uc-html" readonly style="width:100%;height:50px;padding:8px;border-radius:6px;border:1px solid rgba(161,121,31,0.15);background:rgba(0,0,0,0.2);color:#a1791f;font-family:monospace;font-size:13px;resize:none;box-sizing:border-box;"></textarea>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <label style="color:#f0dc9a;font-size:12px;">JavaScript Escape (\\uXXXX)</label>
        <button onclick="window._ucCopy('uc-js')" style="padding:3px 8px;background:rgba(240,220,154,0.1);border:1px solid rgba(240,220,154,0.2);border-radius:3px;color:#f0dc9a;cursor:pointer;font-size:11px;">📋</button>
      </div>
      <textarea id="uc-js" readonly style="width:100%;height:50px;padding:8px;border-radius:6px;border:1px solid rgba(240,220,154,0.15);background:rgba(0,0,0,0.2);color:#f0dc9a;font-family:monospace;font-size:13px;resize:none;box-sizing:border-box;"></textarea>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <label style="color:#ff4d4d;font-size:12px;">CSS Escape (\\XXXXXX)</label>
        <button onclick="window._ucCopy('uc-css')" style="padding:3px 8px;background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.2);border-radius:3px;color:#ff4d4d;cursor:pointer;font-size:11px;">📋</button>
      </div>
      <textarea id="uc-css" readonly style="width:100%;height:50px;padding:8px;border-radius:6px;border:1px solid rgba(255,77,77,0.15);background:rgba(0,0,0,0.2);color:#ff4d4d;font-family:monospace;font-size:13px;resize:none;box-sizing:border-box;"></textarea>
    </div>
  </div>

  <div id="uc-info" style="font-size:12px;color:rgba(214,214,214,0.4);padding:8px;background:rgba(0,0,0,0.2);border-radius:6px;"></div>
</div>

<script>
(function(){
  function convert(){
    var text=document.getElementById('uc-input').value;
    var unicode='',html='',js='',css='';
    for(var i=0;i<text.length;i++){
      var code=text.codePointAt(i);
      var hex=code.toString(16).toUpperCase().padStart(4,'0');
      if(i>0){unicode+=' ';html+='';js+='';css+=' ';}
      unicode+='U+'+hex;
      html+='&#'+code+';';
      if(code>0xFFFF){
        js+='\\u{'+hex+'}';
        css+='\\'+hex+' ';
        i++; // Skip surrogate pair
      }else{
        js+='\\u'+hex;
        css+='\\'+hex+' ';
      }
    }
    document.getElementById('uc-unicode').value=unicode;
    document.getElementById('uc-html').value=html;
    document.getElementById('uc-js').value=js;
    document.getElementById('uc-css').value=css;
    document.getElementById('uc-info').innerHTML='Characters: <b>'+text.length+'</b> · Code points: <b>'+unicode.split(' ').length+'</b>';
  }
  function copy(id){
    var el=document.getElementById(id);
    if(navigator.clipboard)navigator.clipboard.writeText(el.value);
  }
  window._ucCopy=copy;
  document.getElementById('uc-input').addEventListener('input',convert);
  convert();
})();
</script>
