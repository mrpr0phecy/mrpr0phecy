<h2 id="a1cg-title" style="margin-top:0;color:var(--accent);">🩸 HbA1c ⇄ Average Glucose</h2>

<form aria-describedby="a1cg-desc" onsubmit="event.preventDefault();">
  <p id="a1cg-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Convert HbA1c (%) to estimated average glucose with the NGSP/DCCT formula (eAG mg/dL = 28.7 × A1c − 46.7). Educational only — lab methods differ (IFCC mmol/mol vs NGSP %), and this is not a diagnosis.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="a1cg-pct" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">HbA1c %</label>
      <input id="a1cg-pct" type="number" min="4" max="15" step="0.1" value="5.7" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="a1cg-ifcc" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">IFCC mmol/mol</label>
      <input id="a1cg-ifcc" type="number" min="20" max="140" step="any" value="39" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="a1cg-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var lock = false;
  function band(pct) {
    if (pct < 5.7) return 'Often described as in the non-diabetes reference range (lab-dependent).';
    if (pct < 6.5) return 'ADA “prediabetes” band is 5.7–6.4% — a lab and a clinician interpret this, not a webpage.';
    return 'ADA diabetes diagnostic cut-off is 6.5% on a certified lab test, confirmed as they advise.';
  }
  function paint(pct) {
    if (!(pct >= 4 && pct <= 15) || lock) return;
    var ifcc = (pct - 2.15) * 10.929;
    var mg = 28.7 * pct - 46.7;
    var mmol = mg / 18.018;
    lock = true;
    $('a1cg-pct').value = String(Number(pct.toFixed(2)));
    $('a1cg-ifcc').value = String(Number(ifcc.toFixed(1)));
    lock = false;
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('a1cg-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('HbA1c NGSP', pct.toFixed(1) + ' %') +
      cell('IFCC', ifcc.toFixed(0) + ' mmol/mol') +
      cell('eAG', mg.toFixed(0) + ' mg/dL') +
      cell('eAG', mmol.toFixed(1) + ' mmol/L') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">' + band(pct) + ' UK labs report mmol/mol.</p>';
  }
  $('a1cg-pct').addEventListener('input', function () { paint(Number($('a1cg-pct').value)); });
  $('a1cg-ifcc').addEventListener('input', function () {
    var ifcc = Number($('a1cg-ifcc').value);
    paint(ifcc / 10.929 + 2.15);
  });
  paint(5.7);
})();
</script>
