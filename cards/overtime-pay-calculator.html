<h2 id="otpy-title" style="margin-top:0;color:var(--accent);">⏱️ Overtime Pay Calculator</h2>

<form aria-describedby="otpy-desc" onsubmit="event.preventDefault();">
  <p id="otpy-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Split a week into regular hours and overtime at time-and-a-half, double time or a custom multiplier. Gross figures only — your contract and local labour rules still apply.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="otpy-rate" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Hourly rate</label>
      <input id="otpy-rate" type="number" min="0" step="any" value="14.50" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="otpy-reg" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Regular hours</label>
      <input id="otpy-reg" type="number" min="0" step="any" value="40" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="otpy-ot" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Overtime hours</label>
      <input id="otpy-ot" type="number" min="0" step="any" value="6" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="otpy-mult" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">OT multiplier</label>
      <select id="otpy-mult" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="1.5" selected>1.5× time-and-a-half</option>
        <option value="2">2× double time</option>
        <option value="1.25">1.25×</option>
        <option value="1">1× same rate</option>
      </select>
    </div>
    <div>
      <label for="otpy-custom" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Custom multiplier</label>
      <input id="otpy-custom" type="number" min="1" step="any" placeholder="optional" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="otpy-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function money(v) { return v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function run() {
    var rate = Number($('otpy-rate').value), reg = Number($('otpy-reg').value), ot = Number($('otpy-ot').value);
    var custom = Number($('otpy-custom').value);
    var mult = custom >= 1 ? custom : Number($('otpy-mult').value);
    if (!(rate >= 0 && reg >= 0 && ot >= 0 && mult >= 1)) return;
    var base = rate * reg;
    var extra = rate * ot * mult;
    var total = base + extra;
    var hours = reg + ot;
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('otpy-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;">' +
      cell('Regular pay', money(base)) +
      cell('Overtime pay', money(extra)) +
      cell('Gross week', money(total)) +
      cell('Effective rate', hours ? money(total / hours) + '/h' : '—') +
      cell('OT rate', money(rate * mult) + '/h') +
      cell('If no OT', money(base)) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">UK National Minimum Wage still applies to the average across the pay reference period. This is not legal advice.</p>';
  }
  ['otpy-rate', 'otpy-reg', 'otpy-ot', 'otpy-mult', 'otpy-custom'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
