<h2 id="song-title" style="margin-top:0;color:var(--accent);">🎶 Bird Song Mnemonic Trainer</h2>

<form aria-describedby="song-desc" onsubmit="event.preventDefault();">
  <p id="song-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Acoustic field ornithology trainer. Decode avian vocalizations using phonetic mnemonics, pitch contours, and synthesized frequency playback.
  </p>

  <!-- Bird Selection -->
  <div style="margin-bottom:12px;">
    <label for="song-bird-select" style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:4px;color:var(--text);">Select Bird Species &amp; Mnemonic:</label>
    <select id="song-bird-select" style="width:100%;padding:8px;background:rgba(20,30,40,0.8);border:1px solid rgba(45,212,255,0.3);color:var(--text);border-radius:6px;font-size:0.85rem;">
      <option value="whitethroat" selected>White-throated Sparrow — "Poor Sam Peabody, Peabody, Peabody"</option>
      <option value="robin">American Robin — "Cheerily, Cheer Up, Cheer Up, Cheerily"</option>
      <option value="yellow">Yellow Warbler — "Sweet, Sweet, Sweet, I'm So Sweet!"</option>
      <option value="owl">Barred Owl — "Who Cooks For You? Who Cooks For You-All?"</option>
      <option value="chickadee">Chickadee — "Fee-Bee" &amp; "Chick-a-dee-dee-dee"</option>
      <option value="dove">Mourning Dove — "Coo-OOO, Woo, Woo, Woo"</option>
    </select>
  </div>

  <!-- Interactive Mnemonic Card & Pitch Contour -->
  <div style="background:#091018;border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:12px;margin-bottom:12px;">
    <div style="font-size:0.7rem;color:var(--accent);font-weight:700;text-transform:uppercase;margin-bottom:4px;">
      PHONETIC MNEMONIC RHYTHM:
    </div>
    <div id="song-mnemonic-text" style="font-size:1.15rem;font-weight:800;color:#fff;font-style:italic;margin-bottom:6px;">
      "Poor Sam Peabody, Peabody, Peabody"
    </div>
    <div id="song-acoustic-notes" style="font-size:0.75rem;color:var(--text-secondary);line-height:1.4;">
      <!-- Populated via JS -->
    </div>
  </div>

  <!-- Audio Synthesizer Controls -->
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;">
    <button type="button" id="song-play-btn" style="flex:1;padding:10px;background:rgba(0,243,255,0.15);border:1px solid var(--accent);color:var(--accent);border-radius:6px;font-size:0.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">
      <span>🔊</span> <span>Play Synthesized Pitch Contour</span>
    </button>
    <div id="song-freq-tag" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.15);padding:8px 12px;border-radius:6px;font-size:0.75rem;color:#00ffcc;font-family:monospace;">
      ~4,100 Hz Whistle
    </div>
  </div>

  <!-- Ear Birding Identification Strategy -->
  <div id="song-strategy-box" style="background:rgba(255,255,255,0.02);border:1px solid rgba(180,75,255,0.3);border-radius:6px;padding:10px 12px;font-size:0.75rem;color:var(--text-secondary);line-height:1.45;">
    <!-- Injected dynamically -->
  </div>
</form>

<script>
(function initBirdSongLab() {
  const birdSelect = document.getElementById('song-bird-select');
  const mnemonicText = document.getElementById('song-mnemonic-text');
  const acousticNotes = document.getElementById('song-acoustic-notes');
  const freqTag = document.getElementById('song-freq-tag');
  const playBtn = document.getElementById('song-play-btn');
  const strategyBox = document.getElementById('song-strategy-box');

  if (!birdSelect || !playBtn) return;

  const birdSongs = {
    'whitethroat': {
      mnemonic: '"Poor Sam Peabody, Peabody, Peabody"',
      freq: '~4,100 Hz Whistle',
      notes: 'Clear, pure, unslurred whistled tones. Starts with one long high note, drops slightly on note two, followed by three rapid rhythmic triplets.',
      strategy: '<strong style="color:#d896ff;">Ear Birding Tip:</strong> The pure whistling tone carries hundreds of meters through dense boreal spruce and wet brush piles. Look for white throat bib and yellow lores.',
      synth: (ctx) => {
        // High pure whistles: 4186Hz, 3951Hz, then triplets
        const notes = [
          { f: 4186, d: 0.6, p: 0.1 },
          { f: 3951, d: 0.6, p: 0.8 },
          { f: 3951, d: 0.18, p: 1.5 }, { f: 3951, d: 0.18, p: 1.7 }, { f: 3951, d: 0.18, p: 1.9 },
          { f: 3951, d: 0.18, p: 2.2 }, { f: 3951, d: 0.18, p: 2.4 }, { f: 3951, d: 0.18, p: 2.6 },
          { f: 3951, d: 0.18, p: 2.9 }, { f: 3951, d: 0.18, p: 3.1 }, { f: 3951, d: 0.18, p: 3.3 }
        ];
        playNotes(ctx, notes, 'sine');
      }
    },
    'robin': {
      mnemonic: '"Cheerily, Cheer Up, Cheer Up, Cheerily"',
      freq: '~2,800–3,400 Hz Warble',
      notes: 'Liquid, musical, caroling whistle. Composed of 2-to-3 note phrases with variable rising and falling pitch inflections separated by half-second pauses.',
      strategy: '<strong style="color:#ffd700;">Ear Birding Tip:</strong> The quintessential voice of the "dawn chorus". Distinct from the Scarlet Tanager (which sounds like a robin with a sore throat) and Rose-breasted Grosbeak (faster, operatic robin).',
      synth: (ctx) => {
        const notes = [
          { f: 2800, d: 0.2, p: 0.1 }, { f: 3300, d: 0.25, p: 0.35 },
          { f: 2600, d: 0.2, p: 0.8 }, { f: 3100, d: 0.25, p: 1.05 },
          { f: 3400, d: 0.2, p: 1.5 }, { f: 2900, d: 0.25, p: 1.75 },
          { f: 2700, d: 0.2, p: 2.2 }, { f: 3200, d: 0.3, p: 2.45 }
        ];
        playNotes(ctx, notes, 'sine');
      }
    },
    'yellow': {
      mnemonic: '"Sweet, Sweet, Sweet, I\'m So Sweet!"',
      freq: '~4,500–6,200 Hz Accelerando',
      notes: 'Lively, rapid series of high-pitched sweet whistles that accelerate and climb upward in pitch on the terminal syllable.',
      strategy: '<strong style="color:#00ffcc;">Ear Birding Tip:</strong> Abundant in riparian willows, wet thickets, and suburban borders. The rapid rising crescendo is an unmistakable calling card.',
      synth: (ctx) => {
        const notes = [
          { f: 4500, d: 0.15, p: 0.1 },
          { f: 4700, d: 0.15, p: 0.35 },
          { f: 4900, d: 0.15, p: 0.6 },
          { f: 5200, d: 0.12, p: 0.85 },
          { f: 5600, d: 0.12, p: 1.05 },
          { f: 6200, d: 0.25, p: 1.25 }
        ];
        playNotes(ctx, notes, 'sine');
      }
    },
    'owl': {
      mnemonic: '"Who Cooks For You? Who Cooks For You-All?"',
      freq: '~380–520 Hz Low Hoot',
      notes: 'Deep, resonant, syncopated eight-note hooting pattern. The final syllable ("you-all") drops down and draws out in a guttural slide.',
      strategy: '<strong style="color:#ff85a2;">Ear Birding Tip:</strong> Common in mature deciduous woods and swamps. Frequently vocalizes in late afternoon or cloudy days as well as nighttime.',
      synth: (ctx) => {
        const notes = [
          { f: 420, d: 0.22, p: 0.1 }, { f: 420, d: 0.22, p: 0.38 }, { f: 420, d: 0.18, p: 0.65 }, { f: 480, d: 0.4, p: 0.9 },
          { f: 420, d: 0.22, p: 1.6 }, { f: 420, d: 0.22, p: 1.88 }, { f: 420, d: 0.18, p: 2.15 }, { f: 360, d: 0.6, p: 2.4 }
        ];
        playNotes(ctx, notes, 'triangle');
      }
    },
    'chickadee': {
      mnemonic: '"Fee-Bee" (Song) & "Chick-a-dee-dee-dee" (Call)',
      freq: '~3,500 Hz / ~4,500 Hz Buzz',
      notes: 'Clear, sweet 2-note spring whistled song ("Fee-Bee", where the second note drops a whole tone). Contact call adds rapid acoustic "dee" buzzes.',
      strategy: '<strong style="color:#39ff14;">Ear Birding Tip:</strong> Ornithologists discovered the number of "dee" notes at the end of the call communicates predator size and urgency (more "dees" = smaller, more dangerous predator like a pygmy owl).',
      synth: (ctx) => {
        const notes = [
          { f: 3650, d: 0.45, p: 0.1 }, // Fee
          { f: 3100, d: 0.55, p: 0.7 }  // Bee
        ];
        playNotes(ctx, notes, 'sine');
      }
    },
    'dove': {
      mnemonic: '"Coo-OOO, Woo, Woo, Woo"',
      freq: '~420–550 Hz Soft Purr',
      notes: 'Soft, drawn-out mournful blowing sound. Starts with a quick upward hook, followed by three slow descending coos.',
      strategy: '<strong style="color:#ffd700;">Ear Birding Tip:</strong> Often mistaken for an owl by novices due to its low resonant frequency. Distinctly diurnal and rhythmic in suburban yards.',
      synth: (ctx) => {
        const notes = [
          { f: 440, d: 0.18, p: 0.1 }, { f: 550, d: 0.35, p: 0.32 },
          { f: 420, d: 0.45, p: 0.9 },
          { f: 400, d: 0.45, p: 1.5 },
          { f: 380, d: 0.6, p: 2.1 }
        ];
        playNotes(ctx, notes, 'sine');
      }
    }
  };

  function playNotes(ctx, list, waveType) {
    list.forEach(n => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = waveType || 'sine';
      osc.frequency.setValueAtTime(n.f, ctx.currentTime + n.p);
      
      gain.gain.setValueAtTime(0, ctx.currentTime + n.p);
      gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + n.p + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + n.p + n.d);
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.start(ctx.currentTime + n.p);
      osc.stop(ctx.currentTime + n.p + n.d + 0.05);
    });
  }

  function update() {
    const cur = birdSongs[birdSelect.value] || birdSongs['whitethroat'];
    mnemonicText.textContent = cur.mnemonic;
    acousticNotes.textContent = cur.notes;
    freqTag.textContent = cur.freq;
    strategyBox.innerHTML = cur.strategy;
  }

  playBtn.addEventListener('click', () => {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const cur = birdSongs[birdSelect.value] || birdSongs['whitethroat'];
      cur.synth(ctx);
    } catch(e) {
      console.warn(e);
    }
  });

  birdSelect.addEventListener('change', update);
  update();
})();
</script>
