<h2 id="iee7-title" style="margin-top:0;color:var(--accent);">🔢 IEEE-754 Converter</h2>

<form aria-describedby="iee7-desc" onsubmit="event.preventDefault();">
  <p id="iee7-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    32-bit binary32 (float) and 64-bit binary64 (double) bit patterns via typed arrays. Paste a decimal, hex (0x…) or 32/64-bit 0/1 string.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="iee7-in" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Value</label>
      <input id="iee7-in" type="text" value="0.1" autocomplete="off" spellcheck="false" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,Menlo,Consolas,monospace;">
    </div>
    <div>
      <label for="iee7-w" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Width</label>
      <select id="iee7-w" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="32">binary32 (float)</option>
        <option value="64" selected>binary64 (double)</option>
      </select>
    </div>
  </div>
</form>
<div id="iee7-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function bitsFromHex(hex, width) {
    hex = hex.replace(/^0x/i, '').replace(/\s/g, '');
    var n = width / 4;
    while (hex.length < n) hex = '0' + hex;
    var bits = '';
    for (var i = 0; i < hex.length; i++) bits += ('0000' + parseInt(hex.charAt(i), 16).toString(2)).slice(-4);
    return bits.slice(-width);
  }
  function hexFromBits(bits) {
    var hex = '';
    for (var i = 0; i < bits.length; i += 4) hex += parseInt(bits.slice(i, i + 4), 2).toString(16);
    return hex;
  }
  function floatFromBits(bits, width) {
    var buf = new ArrayBuffer(8);
    var view = new DataView(buf);
    if (width === 32) {
      view.setUint32(0, parseInt(bits, 2) >>> 0);
      return view.getFloat32(0);
    }
    var hi = parseInt(bits.slice(0, 32), 2) >>> 0;
    var lo = parseInt(bits.slice(32), 2) >>> 0;
    view.setUint32(0, hi);
    view.setUint32(4, lo);
    return view.getFloat64(0);
  }
  function bitsFromFloat(n, width) {
    var buf = new ArrayBuffer(8);
    var view = new DataView(buf);
    if (width === 32) {
      view.setFloat32(0, n);
      return ('00000000000000000000000000000000' + view.getUint32(0).toString(2)).slice(-32);
    }
    view.setFloat64(0, n);
    var hi = ('00000000000000000000000000000000' + view.getUint32(0).toString(2)).slice(-32);
    var lo = ('00000000000000000000000000000000' + view.getUint32(4).toString(2)).slice(-32);
    return hi + lo;
  }
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;word-break:break-all;">' + v + '</div></div>';
  }
  function run() {
    var raw = $('iee7-in').value.trim();
    var width = Number($('iee7-w').value);
    var expBits = width === 32 ? 8 : 11;
    var bits;
    if (/^[01\s]+$/.test(raw) && raw.replace(/\s/g, '').length === width) bits = raw.replace(/\s/g, '');
    else if (/^0x[0-9a-f]+$/i.test(raw) || /^[0-9a-f]{8}$/i.test(raw) || /^[0-9a-f]{16}$/i.test(raw)) bits = bitsFromHex(raw, width);
    else {
      var n = Number(raw);
      if (!isFinite(n) && raw !== 'Infinity' && raw !== '-Infinity' && raw.toLowerCase() !== 'nan') {
        $('iee7-out').textContent = 'Enter a number, hex, or a ' + width + '-bit string.';
        return;
      }
      bits = bitsFromFloat(n, width);
    }
    var sign = bits.charAt(0);
    var exp = bits.slice(1, 1 + expBits);
    var frac = bits.slice(1 + expBits);
    var value = floatFromBits(bits, width);
    var e = parseInt(exp, 2);
    var bias = width === 32 ? 127 : 1023;
    var kind = e === 0 ? (frac.indexOf('1') === -1 ? 'signed zero / zero' : 'subnormal') : e === (width === 32 ? 255 : 2047) ? (frac.indexOf('1') === -1 ? 'infinity' : 'NaN') : 'normal';
    $('iee7-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;">' +
      cell('Value', String(value)) +
      cell('Hex', '0x' + hexFromBits(bits)) +
      cell('Sign', sign) +
      cell('Exponent bits', exp + ' (raw ' + e + ', unbiased ' + (kind === 'normal' ? (e - bias) : '—') + ')') +
      cell('Fraction', frac) +
      cell('Class', kind) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Why 0.1 + 0.2 ≠ 0.3: 0.1 is recurring in binary. Host endianness is hidden — bits are shown sign-exponent-fraction (network / IEEE document order).</p>';
  }
  $('iee7-in').addEventListener('input', run);
  $('iee7-w').addEventListener('change', run);
  run();
})();
</script>
