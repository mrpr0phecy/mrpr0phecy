<h2>🌌 Scale of Reality</h2>
<p class="description">Zoom from the Planck length (10⁻³⁵m) to the observable universe (10²⁷m). Drag the slider to see where you exist in the full scale of reality.</p>
<div id="scale-app" style="max-width:600px;margin:0 auto;"></div>
<script>
(function(){
'use strict';
var scales=[
  {m:-35,name:'Planck Length',desc:'The smallest meaningful distance in physics. Below this, space itself becomes a quantum foam. The fabric of reality is granular, not smooth.',icon:'⚛️',color:'#8844ff'},
  {m:-24,name:'Yoctometer',desc:'Scale of quarks inside protons and neutrons. Quarks are held together by the strong nuclear force — the most powerful force in nature. They have never been seen alone.',icon:'🔮',color:'#6644ff'},
  {m:-15,name:'Femtometer',desc:'Atomic nuclei. 99.97% of your mass is here — just protons and neutrons. The rest is empty space and the energy of quark-gluon interactions. You are mostly empty.',icon:'⚛️',color:'#4466ff'},
  {m:-12,name:'Picometer',desc:'Electron clouds around atoms. Electrons are not tiny balls — they are probability waves. An atom is 99.9999999999996% empty space.',icon:'💫',color:'#2288ff'},
  {m:-10,name:'Ångström',desc:'Atomic bonds. Chemistry happens here. Every thought you have, every feeling, every memory — it is atoms exchanging electrons at this scale.',icon:'🔗',color:'#00aaff'},
  {m:-8,name:'Nanometer',desc:'DNA double helix. Your entire blueprint — 3.2 billion letters encoding every protein your body can make — is wound into structures 2nm wide.',icon:'🧬',color:'#00ccdd'},
  {m:-6,name:'Micrometer',desc:'A human cell. You are 37.2 trillion of these. Each one is more complex than any city — with power plants (mitochondria), factories (ribosomes), and a library (nucleus).',icon:'🔬',color:'#00ddbb'},
  {m:-4,name:'Grain of sand',desc:'Visible to the naked eye. A single grain contains more atoms than there are stars in the observable universe. Reality is incomprehensibly dense.',icon:'🏖️',color:'#00dd88'},
  {m:-2,name:'Fingertip',desc:'Your scale of touch. Nerve endings here can detect a ridge 13 nanometers high. Your sense of touch is a quantum-scale measurement device.',icon:'👆',color:'#44dd44'},
  {m:0,name:'You',desc:'1.7 meters of organized matter that somehow contemplates its own existence. You are the universe experiencing itself — matter arranged so it can wonder what matter is.',icon:'🧍',color:'#88dd00'},
  {m:3,name:'A mountain',desc:'Geological time made visible. This rock was once seafloor, then molten magma, then compressed by continental collision. Reality operates on timescales that dwarf human life.',icon:'⛰️',color:'#ccaa00'},
  {m:7,name:'Earth',desc:'12,742 km of rock, metal, and life. The only place in the known universe where matter has organized itself into beings that ask "why?" A pale blue dot in an infinite dark.',icon:'🌍',color:'#dd8800'},
  {m:11,name:'The Sun',desc:'A thermonuclear furnace converting 600 million tons of hydrogen into helium every second. Every atom of carbon in your body was forged inside a star like this.',icon:'☀️',color:'#ff6600'},
  {m:16,name:'Solar System',desc:'Light takes 8 minutes from the Sun to you, 4 hours to Neptune. The nearest star is 4 light-years away. Space is mostly emptiness — distances are vast beyond intuition.',icon:'🪐',color:'#ff4400'},
  {m:21,name:'Milky Way Galaxy',desc:'200 billion stars in a spiral 100,000 light-years across. Your Sun is in a quiet arm, orbiting the center once every 230 million years. There are 2 trillion galaxies like this.',icon:'🌌',color:'#ff2244'},
  {m:26,name:'Observable Universe',desc:'93 billion light-years across. Contains 2 trillion galaxies, each with billions of stars. And this is just what we can see — the full universe may be infinite. You are here.',icon:'🔮',color:'#ff0066'},
  {m:35,name:'???',desc:'Beyond the observable universe, we cannot see. Reality may extend infinitely in all directions, or it may curve back on itself. We may never know. And that is the deepest mystery.',icon:'∞',color:'#8800ff'}
];
var idx=9; // start at "You"
function init(){idx=9;render();}
function render(){
  var s=scales[idx];
  var pct=((s.m+35)/70*100).toFixed(1);
  var h='<div style="text-align:center;margin-bottom:12px;">';
  h+='<div style="font-size:48px;margin-bottom:8px;">'+s.icon+'</div>';
  h+='<div style="font-size:20px;font-weight:700;color:'+s.color+';margin-bottom:4px;">'+s.name+'</div>';
  h+='<div style="font-size:13px;color:#9ccbe0;">10^('+s.m+') meters</div>';
  h+='</div>';
  h+='<div style="background:rgba(255,255,255,0.05);border-radius:8px;padding:16px;border:1px solid '+s.color+'40;margin-bottom:16px;font-size:14px;line-height:1.7;color:#e6faff;">'+s.desc+'</div>';
  h+='<input type="range" min="0" max="'+(scales.length-1)+'" value="'+idx+'" id="scale-slider" style="width:100%;accent-color:'+s.color+';">';
  h+='<div style="display:flex;justify-content:space-between;font-size:10px;color:#666;margin-top:4px;"><span>Planck</span><span>Atoms</span><span>You</span><span>Earth</span><span>Universe</span></div>';
  h+='<div style="text-align:center;margin-top:12px;">';
  h+='<button onclick="window._scalePrev()" style="padding:6px 16px;background:rgba(45,212,255,0.15);color:#2dd4ff;border:1px solid rgba(45,212,255,0.3);border-radius:6px;cursor:pointer;font-weight:600;margin-right:8px;">← Smaller</button>';
  h+='<button onclick="window._scaleNext()" style="padding:6px 16px;background:rgba(45,212,255,0.15);color:#2dd4ff;border:1px solid rgba(45,212,255,0.3);border-radius:6px;cursor:pointer;font-weight:600;">Larger →</button>';
  h+='</div>';
  document.getElementById('scale-app').innerHTML=h;
  document.getElementById('scale-slider').addEventListener('input',function(e){idx=parseInt(e.target.value);render();});
}
window._scalePrev=function(){if(idx>0){idx--;render();}};
window._scaleNext=function(){if(idx<scales.length-1){idx++;render();}};
init();
})();
</script>
