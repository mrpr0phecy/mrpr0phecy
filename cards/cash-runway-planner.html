<h2 id="cash-runway-planner-title" style="margin-top:0;color:var(--accent)">🏃 Cash Runway Planner</h2>
<form id="cash-runway-planner-form" aria-describedby="cash-runway-planner-desc" onsubmit="event.preventDefault();">
<p id="cash-runway-planner-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:.9rem">Forecast how long business cash will last and the revenue or cost change needed to reach a target runway. All calculations stay in your browser.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px"><div><label for="cash-runway-planner-cash" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Cash available (£)</label><input id="cash-runway-planner-cash" data-key="cash" type="number" step="any" value="50000" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="cash-runway-planner-revenue" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Monthly revenue (£)</label><input id="cash-runway-planner-revenue" data-key="revenue" type="number" step="any" value="12000" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="cash-runway-planner-costs" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Monthly costs (£)</label><input id="cash-runway-planner-costs" data-key="costs" type="number" step="any" value="18000" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="cash-runway-planner-target" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Target runway (months)</label><input id="cash-runway-planner-target" data-key="target" type="number" step="any" value="12" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div></div>
<button type="submit" style="margin-top:16px;padding:11px 18px;border:0;border-radius:8px;background:var(--accent);color:#001018;font-weight:700;cursor:pointer">Calculate</button>
<div id="cash-runway-planner-out" aria-live="polite" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:16px"></div>
<p style="color:var(--text-secondary);font-size:.78rem;margin-top:12px">Planning estimate only. Check tax, legal and contractual assumptions for your situation.</p>
</form>
<script>
(function(){
 const form=document.getElementById('cash-runway-planner-form'),out=document.getElementById('cash-runway-planner-out');
 const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:2}).format(Number.isFinite(n)?n:0);
 const num=(n,d=0)=>Number.isFinite(n)?n.toLocaleString('en-GB',{maximumFractionDigits:d}):'—'; const pct=n=>num(n,1)+'%';
 const dateMonths=n=>{const d=new Date();d.setDate(d.getDate()+Math.max(0,n)*30.44);return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'})};
 function calculate(){const v={};form.querySelectorAll('[data-key]').forEach(x=>v[x.dataset.key]=Number(x.value)); if(Object.values(v).some(x=>!Number.isFinite(x))){out.textContent='Enter valid numbers in every field.';return} const rows=(()=>{const burn=v.costs-v.revenue; if(burn<=0)return [['Monthly cash flow',money(-burn)],['Runway','Cash-flow positive'],['Target gap','None'],['Target monthly burn',money(v.cash/v.target)]]; const runway=v.cash/burn, targetBurn=v.cash/v.target; return [['Net monthly burn',money(burn)],['Runway',num(runway,1)+' months'],['Runway end',dateMonths(runway)],['Monthly improvement needed',money(Math.max(0,burn-targetBurn))]];})();out.innerHTML='';rows.forEach(r=>{const box=document.createElement('div');box.style.cssText='padding:14px;border:1px solid var(--border-light);border-radius:9px;background:rgba(45,212,255,.06)';const a=document.createElement('div'),b=document.createElement('strong');a.style.cssText='color:var(--text-secondary);font-size:.8rem';b.style.cssText='display:block;color:var(--accent);font-size:1.15rem;margin-top:5px';a.textContent=r[0];b.textContent=r[1];box.append(a,b);out.append(box)})}
 form.addEventListener('submit',calculate);form.addEventListener('input',calculate);calculate();
})();
</script>
