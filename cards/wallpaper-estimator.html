<!-- cards/wallpaper-estimator.html -->
<h2 id="wallpap-title" style="margin-top:0;color:var(--accent);">🧻 Wallpaper Estimator</h2>

<form aria-describedby="wallpap-desc" onsubmit="event.preventDefault();">
  <p id="wallpap-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Calculate how many rolls of wallpaper you need — accounting for pattern repeat, doors, and windows.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="wallpap-w" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Room Width (m)</label>
      <input id="wallpap-w" type="number" step="0.1" min="1" value="4" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="wallpap-l" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Room Length (m)</label>
      <input id="wallpap-l" type="number" step="0.1" min="1" value="5" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="wallpap-h" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Wall Height (m)</label>
      <input id="wallpap-h" type="number" step="0.1" min="1" value="2.4" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="wallpap-doors" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Number of Doors</label>
      <input id="wallpap-doors" type="number" min="0" value="1" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="wallpap-windows" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Number of Windows</label>
      <input id="wallpap-windows" type="number" min="0" value="1" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="wallpap-roll-w" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Roll Width (cm)</label>
      <select id="wallpap-roll-w" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="52" selected>52 cm (standard)</option>
        <option value="70">70 cm (wide)</option>
      </select>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
    <div>
      <label for="wallpap-roll-l" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Roll Length (m)</label>
      <select id="wallpap-roll-l" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="10" selected>10 m (standard)</option>
        <option value="10.05">10.05 m</option>
        <option value="11">11 m</option>
        <option value="25">25 m (paste-the-wall)</option>
      </select>
    </div>
    <div>
      <label for="wallpap-repeat" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Pattern Repeat (cm)</label>
      <select id="wallpap-repeat" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="0">None (plain or stripe)</option>
        <option value="26">26 cm (small pattern)</option>
        <option value="52" selected>52 cm (standard repeat)</option>
        <option value="64">64 cm (large repeat)</option>
      </select>
    </div>
  </div>

  <button type="button" onclick="wallpapCalc()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🧻 Calculate Rolls Needed
  </button>

  <div id="wallpap-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(45,212,255,0.1);">
        <div style="font-size:0.75rem;color:var(--text-secondary);">Wall Area</div>
        <div id="wallpap-area" style="font-size:1.3rem;color:var(--accent);font-weight:700;"></div>
      </div>
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(57,255,20,0.1);">
        <div style="font-size:0.75rem;color:var(--text-secondary);">Rolls Needed</div>
        <div id="wallpap-rolls" style="font-size:1.3rem;color:#39ff14;font-weight:700;"></div>
      </div>
    </div>
    <div id="wallpap-strips" style="font-size:0.85rem;color:var(--text);margin-bottom:8px;"></div>
    <div id="wallpap-cost" style="text-align:center;font-size:1rem;color:var(--accent);font-weight:700;margin-bottom:8px;"></div>
    <div id="wallpap-tips" style="font-size:0.8rem;color:var(--text-secondary);line-height:1.6;"></div>
  </div>
</form>

<script>
(function(){
  window.wallpapCalc=function(){
    var rw=parseFloat(document.getElementById('wallpap-w').value);
    var rl=parseFloat(document.getElementById('wallpap-l').value);
    var rh=parseFloat(document.getElementById('wallpap-h').value);
    var doors=parseInt(document.getElementById('wallpap-doors').value);
    var windows=parseInt(document.getElementById('wallpap-windows').value);
    var rollW=parseFloat(document.getElementById('wallpap-roll-w').value)/100;
    var rollL=parseFloat(document.getElementById('wallpap-roll-l').value);
    var repeat=parseFloat(document.getElementById('wallpap-repeat').value)/100;
    var perimeter=2*(rw+rl);
    var wallArea=perimeter*rh;
    var doorArea=doors*1.9;
    var windowArea=windows*1.4;
    var netArea=Math.max(wallArea-doorArea-windowArea,1);
    var stripsPerRoll=Math.floor(rollL/(rh+repeat));
    var totalStrips=Math.ceil(perimeter/rollW);
    var rollsNeeded=Math.ceil(totalStrips/stripsPerRoll);
    document.getElementById('wallpap-area').textContent=netArea.toFixed(1)+' m²';
    document.getElementById('wallpap-rolls').textContent=rollsNeeded+' rolls';
    document.getElementById('wallpap-strips').innerHTML='📐 Strips needed: <strong>'+totalStrips+'</strong> | Strips per roll: <strong>'+stripsPerRoll+'</strong>'+(repeat>0?' (with '+repeat*100+'cm pattern repeat)':'');
    document.getElementById('wallpap-cost').innerHTML='💰 At ~£20/roll: <strong>£'+(rollsNeeded*20).toFixed(0)+'</strong> | At ~£35/roll: <strong>£'+(rollsNeeded*35).toFixed(0)+'</strong>';
    document.getElementById('wallpap-tips').innerHTML='💡 <strong>Buy all rolls from the same batch</strong> — colour varies between batches.<br>💡 <strong>Pattern matching:</strong> Start each strip at the same point in the pattern for a seamless look.<br>💡 <strong>Paste-the-wall</strong> wallpaper is easier for beginners — no pasting table needed.<br>💡 <strong>Keep one spare roll</strong> for future repairs — it will be discontinued by the time you need it.';
    document.getElementById('wallpap-result').style.display='block';
  };
})();
</script>
