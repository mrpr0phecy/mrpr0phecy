<div id="youth-resume" style="max-width:960px;margin:0 auto;font-family:system-ui,sans-serif;color:#e0d0c0">
  <div style="background:linear-gradient(135deg,#0a0a2a,#0d1b2a);border:1px solid #3a3a5a;border-radius:16px;padding:32px">
    <h2 style="margin:0 0 8px;font-size:1.6em;color:#6080f0">📄 First Resume Builder</h2>
    <p style="margin:0 0 20px;color:#8090b0;font-size:0.95em">Build your first CV or resume — even with no experience. Fill in what you have, get a clean, professional resume</p>
    <div style="display:flex;gap:20px;flex-wrap:wrap">
      <div style="flex:1;min-width:300px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
          <div><label style="font-size:0.78em;color:#8090b0">Full Name</label><input id="yr-name" type="text" value="Alex Johnson" style="width:100%;padding:7px;border-radius:6px;border:1px solid #3a3a5a;background:#0a0a2a;color:#e0d0c0;font-size:0.88em;box-sizing:border-box"></div>
          <div><label style="font-size:0.78em;color:#8090b0">Email</label><input id="yr-email" type="text" value="alex@email.com" style="width:100%;padding:7px;border-radius:6px;border:1px solid #3a3a5a;background:#0a0a2a;color:#e0d0c0;font-size:0.88em;box-sizing:border-box"></div>
          <div><label style="font-size:0.78em;color:#8090b0">Phone</label><input id="yr-phone" type="text" value="07700 900000" style="width:100%;padding:7px;border-radius:6px;border:1px solid #3a3a5a;background:#0a0a2a;color:#e0d0c0;font-size:0.88em;box-sizing:border-box"></div>
          <div><label style="font-size:0.78em;color:#8090b0">Location</label><input id="yr-loc" type="text" value="London, UK" style="width:100%;padding:7px;border-radius:6px;border:1px solid #3a3a5a;background:#0a0a2a;color:#e0d0c0;font-size:0.88em;box-sizing:border-box"></div>
        </div>
        <div style="margin-bottom:8px"><label style="font-size:0.78em;color:#8090b0">Personal Statement</label><textarea id="yr-stmt" style="width:100%;padding:7px;border-radius:6px;border:1px solid #3a3a5a;background:#0a0a2a;color:#e0d0c0;font-size:0.85em;height:50px;resize:vertical;box-sizing:border-box;font-family:inherit" placeholder="Motivated student seeking first work experience..."></textarea></div>
        <div style="margin-bottom:8px"><label style="font-size:0.78em;color:#8090b0">Education (school, grades, dates)</label><textarea id="yr-edu" style="width:100%;padding:7px;border-radius:6px;border:1px solid #3a3a5a;background:#0a0a2a;color:#e0d0c0;font-size:0.85em;height:50px;resize:vertical;box-sizing:border-box;font-family:inherit" placeholder="Greenfield School, 2020-2025&#10;GCSEs: 5x Grade 7, 3x Grade 6"></textarea></div>
        <div style="margin-bottom:8px"><label style="font-size:0.78em;color:#8090b0">Skills (comma separated)</label><input id="yr-skills" type="text" value="Teamwork, Communication, Microsoft Office, Social media, Time management" style="width:100%;padding:7px;border-radius:6px;border:1px solid #3a3a5a;background:#0a0a2a;color:#e0d0c0;font-size:0.88em;box-sizing:border-box"></div>
        <div style="margin-bottom:8px"><label style="font-size:0.78em;color:#8090b0">Experience / Volunteering / Activities</label><textarea id="yr-exp" style="width:100%;padding:7px;border-radius:6px;border:1px solid #3a3a5a;background:#0a0a2a;color:#e0d0c0;font-size:0.85em;height:60px;resize:vertical;box-sizing:border-box;font-family:inherit" placeholder="Volunteer, Charity Shop (2024-present)&#10;- Helped customers and managed stock&#10;School Council Member (2023-2024)"></textarea></div>
        <div style="display:flex;gap:8px">
          <button onclick="window._yrPreview()" style="flex:1;padding:8px;border-radius:6px;border:1px solid #6080f0;background:#1a1a3a;color:#6080f0;cursor:pointer;font-size:0.85em">👁️ Preview</button>
          <button onclick="window._yrCopy()" style="flex:1;padding:8px;border-radius:6px;border:1px solid #6080f0;background:#1a1a3a;color:#6080f0;cursor:pointer;font-size:0.85em">📋 Copy Text</button>
        </div>
      </div>
      <div style="flex:1;min-width:280px">
        <div id="yr-preview" style="background:#fff;color:#1a1a1a;border-radius:8px;padding:20px;font-size:0.85em;line-height:1.5;min-height:400px;font-family:Georgia,serif"></div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  const previewEl=document.getElementById('yr-preview');
  function v(id){return document.getElementById(id).value.trim()}
  function render(){
    const name=v('yr-name')||'Your Name',email=v('yr-email'),phone=v('yr-phone'),loc=v('yr-loc');
    const stmt=v('yr-stmt'),edu=v('yr-edu'),skills=v('yr-skills'),exp=v('yr-exp');
    let html='<div style="text-align:center;border-bottom:2px solid #1a1a1a;padding-bottom:10px;margin-bottom:10px">';
    html+='<div style="font-size:1.4em;font-weight:bold;color:#1a1a1a">'+name+'</div>';
    html+='<div style="font-size:0.85em;color:#555;margin-top:4px">';
    if(email)html+=email;if(email&&phone)html+=' · ';if(phone)html+=phone;if((email||phone)&&loc)html+=' · ';if(loc)html+=loc;
    html+='</div></div>';
    if(stmt){html+='<div style="margin-bottom:12px"><div style="font-weight:bold;color:#1a1a1a;font-size:0.9em;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Personal Statement</div><div style="color:#333">'+stmt+'</div></div>'}
    if(edu){html+='<div style="margin-bottom:12px"><div style="font-weight:bold;color:#1a1a1a;font-size:0.9em;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Education</div><div style="color:#333;white-space:pre-wrap">'+edu+'</div></div>'}
    if(skills){html+='<div style="margin-bottom:12px"><div style="font-weight:bold;color:#1a1a1a;font-size:0.9em;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Skills</div><div style="color:#333">'+skills.split(',').map(s=>'<span style="display:inline-block;padding:2px 8px;margin:2px;background:#eee;border-radius:4px;font-size:0.85em">'+s.trim()+'</span>').join('')+'</div></div>'}
    if(exp){html+='<div style="margin-bottom:12px"><div style="font-weight:bold;color:#1a1a1a;font-size:0.9em;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Experience & Activities</div><div style="color:#333;white-space:pre-wrap">'+exp+'</div></div>'}
    previewEl.innerHTML=html;
  }
  window._yrPreview=render;
  window._yrCopy=function(){
    const name=v('yr-name')||'Your Name',email=v('yr-email'),phone=v('yr-phone'),loc=v('yr-loc');
    let text=name+'\n'+[email,phone,loc].filter(Boolean).join(' | ')+'\n\n';
    if(v('yr-stmt'))text+='PERSONAL STATEMENT\n'+v('yr-stmt')+'\n\n';
    if(v('yr-edu'))text+='EDUCATION\n'+v('yr-edu')+'\n\n';
    if(v('yr-skills'))text+='SKILLS\n'+v('yr-skills')+'\n\n';
    if(v('yr-exp'))text+='EXPERIENCE & ACTIVITIES\n'+v('yr-exp')+'\n';
    navigator.clipboard.writeText(text);
  };
  ['yr-name','yr-email','yr-phone','yr-loc','yr-stmt','yr-edu','yr-skills','yr-exp'].forEach(id=>{document.getElementById(id).oninput=render});
  render();
})();
</script>
