<h2 id="invoice-late-fee-calculator-title" style="margin-top:0;color:var(--accent)">🧾 Invoice Late Fee Calculator</h2>
<form id="invoice-late-fee-calculator-form" aria-describedby="invoice-late-fee-calculator-desc" onsubmit="event.preventDefault();">
<p id="invoice-late-fee-calculator-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:.9rem">Calculate statutory or agreed late-payment interest and a clear updated invoice total. All calculations stay in your browser.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px"><div><label for="invoice-late-fee-calculator-amount" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Overdue invoice (£)</label><input id="invoice-late-fee-calculator-amount" data-key="amount" type="number" step="any" value="2500" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="invoice-late-fee-calculator-rate" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Annual interest rate (%)</label><input id="invoice-late-fee-calculator-rate" data-key="rate" type="number" step="any" value="8" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="invoice-late-fee-calculator-days" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Days overdue</label><input id="invoice-late-fee-calculator-days" data-key="days" type="number" step="any" value="45" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="invoice-late-fee-calculator-fee" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Fixed recovery fee (£)</label><input id="invoice-late-fee-calculator-fee" data-key="fee" type="number" step="any" value="40" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div></div>
<button type="submit" style="margin-top:16px;padding:11px 18px;border:0;border-radius:8px;background:var(--accent);color:#001018;font-weight:700;cursor:pointer">Calculate</button>
<div id="invoice-late-fee-calculator-out" aria-live="polite" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:16px"></div>
<p style="color:var(--text-secondary);font-size:.78rem;margin-top:12px">Planning estimate only. Check tax, legal and contractual assumptions for your situation.</p>
</form>
<script>
(function(){
 const form=document.getElementById('invoice-late-fee-calculator-form'),out=document.getElementById('invoice-late-fee-calculator-out');
 const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:2}).format(Number.isFinite(n)?n:0);
 const num=(n,d=0)=>Number.isFinite(n)?n.toLocaleString('en-GB',{maximumFractionDigits:d}):'—'; const pct=n=>num(n,1)+'%';
 const dateMonths=n=>{const d=new Date();d.setDate(d.getDate()+Math.max(0,n)*30.44);return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'})};
 function calculate(){const v={};form.querySelectorAll('[data-key]').forEach(x=>v[x.dataset.key]=Number(x.value)); if(Object.values(v).some(x=>!Number.isFinite(x))){out.textContent='Enter valid numbers in every field.';return} const rows=(()=>{const interest=v.amount*(v.rate/100)*(v.days/365); return [['Interest accrued',money(interest)],['Daily interest',money(v.amount*(v.rate/100)/365)],['Recovery fee',money(v.fee)],['Total now due',money(v.amount+interest+v.fee)]];})();out.innerHTML='';rows.forEach(r=>{const box=document.createElement('div');box.style.cssText='padding:14px;border:1px solid var(--border-light);border-radius:9px;background:rgba(45,212,255,.06)';const a=document.createElement('div'),b=document.createElement('strong');a.style.cssText='color:var(--text-secondary);font-size:.8rem';b.style.cssText='display:block;color:var(--accent);font-size:1.15rem;margin-top:5px';a.textContent=r[0];b.textContent=r[1];box.append(a,b);out.append(box)})}
 form.addEventListener('submit',calculate);form.addEventListener('input',calculate);calculate();
})();
</script>
