<h2>📜 Lorem Ipsum Generator</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Generate placeholder text for designs, mockups, and layouts. Choose paragraphs, sentences, or words with one click.</p>

<div id="li-app" style="max-width:600px;margin:0 auto;">
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;">
    <div>
      <label style="display:block;margin-bottom:4px;color:#2dd4ff;font-size:12px;">Type</label>
      <select id="li-type" style="width:100%;padding:8px;border-radius:6px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:13px;">
        <option value="paragraphs">Paragraphs</option>
        <option value="sentences">Sentences</option>
        <option value="words">Words</option>
      </select>
    </div>
    <div>
      <label style="display:block;margin-bottom:4px;color:#2dd4ff;font-size:12px;">Count</label>
      <input id="li-count" type="number" min="1" max="100" value="3" style="width:100%;padding:8px;border-radius:6px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:13px;" />
    </div>
    <div>
      <label style="display:block;margin-bottom:4px;color:#2dd4ff;font-size:12px;">Start with</label>
      <select id="li-start" style="width:100%;padding:8px;border-radius:6px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:13px;">
        <option value="classic">"Lorem ipsum dolor..."</option>
        <option value="random">Random text</option>
      </select>
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <button onclick="window._liGenerate()" style="flex:1;padding:10px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.3);border-radius:8px;color:#39ff14;cursor:pointer;font-weight:600;">Generate</button>
    <button onclick="window._liCopy()" style="padding:10px 16px;background:rgba(45,212,255,0.1);border:1px solid rgba(45,212,255,0.3);border-radius:8px;color:#2dd4ff;cursor:pointer;">📋 Copy</button>
  </div>

  <div id="li-output" style="padding:16px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.05);border-radius:8px;font-size:14px;line-height:1.8;color:var(--text);min-height:100px;max-height:400px;overflow-y:auto;"></div>

  <div id="li-stats" style="margin-top:8px;font-size:12px;color:rgba(230,250,255,0.4);text-align:center;"></div>
</div>

<script>
(function(){
  var words=['lorem','ipsum','dolor','sit','amet','consectetur','adipiscing','elit','sed','do','eiusmod','tempor','incididunt','ut','labore','et','dolore','magna','aliqua','enim','ad','minim','veniam','quis','nostrud','exercitation','ullamco','laboris','nisi','aliquip','ex','ea','commodo','consequat','duis','aute','irure','in','reprehenderit','voluptate','velit','esse','cillum','fugiat','nulla','pariatur','excepteur','sint','occaecat','cupidatat','non','proident','sunt','culpa','qui','officia','deserunt','mollit','anim','id','est','laborum','perspiciatis','unde','omnis','iste','natus','error','voluptatem','accusantium','doloremque','laudantium','totam','rem','aperiam','eaque','ipsa','quae','ab','illo','inventore','veritatis','quasi','architecto','beatae','vitae','dicta','explicabo','nemo','ipsam','voluptas','aspernatur','aut','odit','fugit','consequuntur','magni','dolores','eos','ratione','sequi','nesciunt','neque','porro','quisquam','dolorem','adipisci','numquam','eius','modi','tempora','incidunt','magnam','quaerat'];
  var classic='Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.';

  function randWord(){return words[Math.floor(Math.random()*words.length)];}
  function sentence(){
    var len=8+Math.floor(Math.random()*12);
    var s='';for(var i=0;i<len;i++)s+=(i?' ':'')+randWord();
    return s.charAt(0).toUpperCase()+s.slice(1)+'.';
  }
  function paragraph(){
    var len=3+Math.floor(Math.random()*5);
    var p='';for(var i=0;i<len;i++)p+=(i?' ':'')+sentence();
    return p;
  }

  function generate(){
    var type=document.getElementById('li-type').value;
    var count=Math.max(1,Math.min(100,parseInt(document.getElementById('li-count').value)||3));
    var start=document.getElementById('li-start').value;
    var output='';

    if(type==='paragraphs'){
      var paras=[];
      if(start==='classic')paras.push(classic);
      for(var i=paras.length;i<count;i++)paras.push(paragraph());
      output=paras.join('\n\n');
    }else if(type==='sentences'){
      var sents=[];
      if(start==='classic')sents.push(classic);
      for(var i=sents.length;i<count;i++)sents.push(sentence());
      output=sents.join(' ');
    }else{
      var w=[];
      if(start==='classic')w=classic.replace(/[.,]/g,'').split(' ');
      for(var i=w.length;i<count;i++)w.push(randWord());
      output=w.join(' ');
    }

    document.getElementById('li-output').innerHTML=output.replace(/\n\n/g,'</p><p style="margin-top:12px;">').replace(/^/,'<p>').replace(/$/,'</p>');
    var wordCount=output.split(/\s+/).length;
    var charCount=output.length;
    document.getElementById('li-stats').textContent=wordCount+' words · '+charCount+' characters';
  }

  function copy(){
    var text=document.getElementById('li-output').textContent;
    if(navigator.clipboard){navigator.clipboard.writeText(text);}
    else{var t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);}
  }

  window._liGenerate=generate;window._liCopy=copy;
  generate();
})();
</script>
