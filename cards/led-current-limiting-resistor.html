<h2 id="ledr-title" style="margin-top:0;color:var(--accent);">💡 LED Current-Limiting Resistor</h2>

<form aria-describedby="ledr-desc" onsubmit="event.preventDefault();">
  <p id="ledr-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    R = (supply − LED V<sub>f</sub>) / current. Typical V<sub>f</sub>: red ~1.8–2.2 V, green/blue/white ~3.0–3.4 V. Always put a resistor in series with a bare LED on a voltage source — the LED will not self-limit.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="ledr-vs" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Supply V</label>
      <input id="ledr-vs" type="number" min="0" step="any" value="5" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ledr-vf" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">LED V<sub>f</sub></label>
      <input id="ledr-vf" type="number" min="0" step="any" value="2.0" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ledr-ma" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Current mA</label>
      <input id="ledr-ma" type="number" min="0.1" step="any" value="20" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ledr-n" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">LEDs in series</label>
      <input id="ledr-n" type="number" min="1" max="20" step="1" value="1" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="ledr-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var E24 = [1.0, 1.1, 1.2, 1.3, 1.5, 1.6, 1.8, 2.0, 2.2, 2.4, 2.7, 3.0, 3.3, 3.6, 3.9, 4.3, 4.7, 5.1, 5.6, 6.2, 6.8, 7.5, 8.2, 9.1];
  // Smallest E24 value at or above r, so the LED never gets more than the chosen current.
  // 10 is included so values such as 97 Ω round up to 100 Ω, not down to 91 Ω.
  function e24AtOrAbove(r) {
    if (!(r > 0)) return NaN;
    var exp = Math.floor(Math.log(r) / Math.log(10));
    var mant = r / Math.pow(10, exp);
    var list = E24.concat([10]);
    for (var k = 0; k < list.length; k++) {
      if (list[k] >= mant - 1e-9) return Number((list[k] * Math.pow(10, exp)).toPrecision(3));
    }
    return 10 * Math.pow(10, exp);
  }
  // Standard resistor power ratings; choose one at least twice the dissipation.
  var RATINGS = [0.125, 0.25, 0.5, 1, 2, 3, 5, 10, 25, 50];
  function ratingFor(p) {
    for (var k = 0; k < RATINGS.length; k++) if (RATINGS[k] >= 2 * p) return RATINGS[k] + ' W';
    return (2 * p).toFixed(0) + ' W or more';
  }
  function run() {
    var vs = Number($('ledr-vs').value), vf = Number($('ledr-vf').value);
    var ma = Number($('ledr-ma').value), n = Number($('ledr-n').value) || 1;
    var drop = vs - vf * n;
    if (!(vs > 0 && vf > 0 && ma > 0)) return;
    if (drop <= 0) {
      $('ledr-out').innerHTML = '<p style="color:#ffb8b8;font-size:.84rem;">Supply must exceed ' + n + ' × V<sub>f</sub> (' + (vf * n).toFixed(2) + ' V). Use fewer LEDs in series, or a higher rail.</p>';
      return;
    }
    var i = ma / 1000;
    var r = drop / i;
    var p = drop * i;
    var e24 = e24AtOrAbove(r);
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('ledr-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Resistor', Math.round(r) + ' Ω') +
      cell('Nearest E24 (at or above)', (e24 >= 1000 ? Number((e24 / 1000).toFixed(2)) + ' kΩ' : Number(e24.toPrecision(3)) + ' Ω')) +
      cell('Resistor power', (p * 1000).toFixed(0) + ' mW  (use ≥ ' + ratingFor(p) + ')') +
      cell('Voltage across R', drop.toFixed(2) + ' V') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">20 mA is a classic indicator current; many modern LEDs are happy at 5–10 mA and last longer. Check the datasheet.</p>';
  }
  ['ledr-vs', 'ledr-vf', 'ledr-ma', 'ledr-n'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
