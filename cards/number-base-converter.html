<h2>🔢 Number Base Converter</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Convert numbers between binary, octal, decimal, hexadecimal, and any base from 2 to 36. Live conversion as you type.</p>

<div id="nb-app" style="max-width:600px;margin:0 auto;">
  <div style="display:grid;gap:10px;margin-bottom:16px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="width:80px;font-size:13px;color:#ff4444;font-weight:600;">Binary (2)</span>
      <input id="nb-bin" type="text" placeholder="01010101" style="flex:1;padding:8px;border-radius:6px;border:1px solid rgba(255,68,68,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-family:monospace;font-size:14px;" />
      <button onclick="window._nbCopy('bin')" style="padding:6px 10px;background:rgba(255,68,68,0.1);border:1px solid rgba(255,68,68,0.2);border-radius:4px;color:#ff4444;cursor:pointer;font-size:11px;">📋</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="width:80px;font-size:13px;color:#ffa500;font-weight:600;">Octal (8)</span>
      <input id="nb-oct" type="text" placeholder="125" style="flex:1;padding:8px;border-radius:6px;border:1px solid rgba(255,165,0,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-family:monospace;font-size:14px;" />
      <button onclick="window._nbCopy('oct')" style="padding:6px 10px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.2);border-radius:4px;color:#ffa500;cursor:pointer;font-size:11px;">📋</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="width:80px;font-size:13px;color:#2dd4ff;font-weight:600;">Decimal (10)</span>
      <input id="nb-dec" type="text" placeholder="85" style="flex:1;padding:8px;border-radius:6px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-family:monospace;font-size:14px;" />
      <button onclick="window._nbCopy('dec')" style="padding:6px 10px;background:rgba(45,212,255,0.1);border:1px solid rgba(45,212,255,0.2);border-radius:4px;color:#2dd4ff;cursor:pointer;font-size:11px;">📋</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="width:80px;font-size:13px;color:#39ff14;font-weight:600;">Hex (16)</span>
      <input id="nb-hex" type="text" placeholder="55" style="flex:1;padding:8px;border-radius:6px;border:1px solid rgba(57,255,20,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-family:monospace;font-size:14px;" />
      <button onclick="window._nbCopy('hex')" style="padding:6px 10px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.2);border-radius:4px;color:#39ff14;cursor:pointer;font-size:11px;">📋</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="width:80px;font-size:13px;color:#c060f0;font-weight:600;">ASCII</span>
      <input id="nb-ascii" type="text" placeholder="U" style="flex:1;padding:8px;border-radius:6px;border:1px solid rgba(192,96,240,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-family:monospace;font-size:14px;" />
      <button onclick="window._nbCopy('ascii')" style="padding:6px 10px;background:rgba(192,96,240,0.1);border:1px solid rgba(192,96,240,0.2);border-radius:4px;color:#c060f0;cursor:pointer;font-size:11px;">📋</button>
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <div style="flex:1;">
      <label style="display:block;margin-bottom:4px;color:rgba(230,250,255,0.5);font-size:12px;">Custom Base (2-36)</label>
      <div style="display:flex;gap:6px;">
        <input id="nb-custom-base" type="number" min="2" max="36" value="5" style="width:60px;padding:6px;border-radius:4px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.3);color:var(--text);font-size:13px;" />
        <input id="nb-custom-val" type="text" readonly style="flex:1;padding:6px;border-radius:4px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.2);color:#ffd700;font-family:monospace;font-size:13px;" />
      </div>
    </div>
  </div>

  <div id="nb-info" style="font-size:12px;color:rgba(230,250,255,0.4);padding:8px;background:rgba(0,0,0,0.2);border-radius:6px;"></div>
</div>

<script>
(function(){
  var fields={bin:2,oct:8,dec:10,hex:16};
  function fromBase(str,base){
    str=str.trim().toUpperCase();
    var val=parseInt(str,base);
    return isNaN(val)?null:val;
  }
  function toBase(val,base){
    if(val===null)return'';
    return val.toString(base).toUpperCase();
  }
  function update(source){
    var val;
    if(source==='ascii'){
      var ch=document.getElementById('nb-ascii').value;
      if(ch.length>0)val=ch.charCodeAt(0);else val=null;
    }else{
      val=fromBase(document.getElementById('nb-'+source).value,fields[source]);
    }
    if(val===null||isNaN(val)){
      ['bin','oct','dec','hex'].forEach(function(f){if(f!==source)document.getElementById('nb-'+f).value='';});
      document.getElementById('nb-ascii').value='';
      document.getElementById('nb-custom-val').value='';
      return;
    }
    ['bin','oct','dec','hex'].forEach(function(f){
      if(f!==source)document.getElementById('nb-'+f).value=toBase(val,fields[f]);
    });
    document.getElementById('nb-ascii').value=(val>=32&&val<=126)?String.fromCharCode(val):'';
    var customBase=parseInt(document.getElementById('nb-custom-base').value)||10;
    document.getElementById('nb-custom-val').value=toBase(val,customBase);
    // Info
    var bits=val>0?Math.floor(Math.log2(val))+1:1;
    document.getElementById('nb-info').innerHTML=
      'Decimal: <b>'+val+'</b> · Bits: <b>'+bits+'</b> · Bytes: <b>'+Math.ceil(bits/8)+'</b>'+
      (val>=32&&val<=126?' · ASCII: <b>'+String.fromCharCode(val)+'</b>':'')+
      ' · Signed 8-bit: <b>'+(val>127?val-256:val)+'</b>';
  }
  ['bin','oct','dec','hex'].forEach(function(f){
    document.getElementById('nb-'+f).addEventListener('input',function(){update(f);});
  });
  document.getElementById('nb-ascii').addEventListener('input',function(){update('ascii');});
  document.getElementById('nb-custom-base').addEventListener('input',function(){update('dec');});
  function copy(fmt){
    var el=document.getElementById('nb-'+fmt);
    if(navigator.clipboard)navigator.clipboard.writeText(el.value);
  }
  window._nbCopy=copy;
  // Default
  document.getElementById('nb-dec').value='85';
  update('dec');
})();
</script>
