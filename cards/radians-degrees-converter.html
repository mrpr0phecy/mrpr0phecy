<h2 id="radg-title" style="margin-top:0;color:var(--accent);">∠ Radians ⇄ Degrees Converter</h2>

<form aria-describedby="radg-desc" onsubmit="event.preventDefault();">
  <p id="radg-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    π rad = 180°. Also shows revolutions and a reduced π-fraction when it is close to a simple multiple of π.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="radg-mode" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">From</label>
      <select id="radg-mode" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="deg">Degrees</option>
        <option value="rad">Radians</option>
        <option value="rev">Revolutions</option>
        <option value="grad">Gradians</option>
      </select>
    </div>
    <div>
      <label for="radg-v" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Value</label>
      <input id="radg-v" type="number" step="any" value="180" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="radg-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a || 1; }
  function piFrac(rad) {
    var n = rad / Math.PI;
    for (var den = 1; den <= 16; den++) {
      var num = Math.round(n * den);
      if (Math.abs(n * den - num) < 1e-4) {
        var g = gcd(num, den);
        num /= g; den /= g;
        if (num === 0) return '0';
        if (den === 1) return num === 1 ? 'π' : num === -1 ? '−π' : num + 'π';
        var top = num === 1 ? '' : num === -1 ? '−' : String(num);
        return top + 'π/' + den;
      }
    }
    return null;
  }
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var v = Number($('radg-v').value), mode = $('radg-mode').value;
    if (!isFinite(v)) {
      $('radg-out').textContent = 'Enter a number.';
      return;
    }
    var deg;
    if (mode === 'deg') deg = v;
    else if (mode === 'rad') deg = v * 180 / Math.PI;
    else if (mode === 'rev') deg = v * 360;
    else deg = v * 0.9;
    var rad = deg * Math.PI / 180;
    var frac = piFrac(rad);
    $('radg-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Degrees', deg.toPrecision(8)) +
      cell('Radians', rad.toPrecision(8)) +
      cell('As π', frac || '—') +
      cell('Revolutions', (deg / 360).toPrecision(6)) +
      cell('Gradians', (deg / 0.9).toPrecision(8)) +
      '</div>';
  }
  $('radg-mode').addEventListener('change', run);
  $('radg-v').addEventListener('input', run);
  run();
})();
</script>
