<h2 id="tvvd-title" style="margin-top:0;color:var(--accent);">📺 TV Viewing Distance Calculator</h2>

<form aria-describedby="tvvd-desc" onsubmit="event.preventDefault();">
  <p id="tvvd-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Recommend a sofa distance from screen diagonal and resolution. Uses SMPTE 30° field-of-view, THX 40°, and a sharpness seat where 4K/1080p pixels sit at about 1 arc-minute. Advice, not a living-room survey.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="tvvd-diag" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Diagonal</label>
      <input id="tvvd-diag" type="number" min="20" max="200" value="55" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="tvvd-unit" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Unit</label>
      <select id="tvvd-unit" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="in">inches</option>
        <option value="cm">centimetres</option>
      </select>
    </div>
    <div>
      <label for="tvvd-res" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Resolution</label>
      <select id="tvvd-res" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="3840x2160">4K UHD (3840×2160)</option>
        <option value="2560x1440">1440p</option>
        <option value="1920x1080" selected>1080p</option>
        <option value="1280x720">720p</option>
      </select>
    </div>
    <div>
      <label for="tvvd-ar" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Aspect</label>
      <select id="tvvd-ar" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="1.7778">16:9</option>
        <option value="2.37">21:9</option>
        <option value="1.3333">4:3</option>
      </select>
    </div>
  </div>
</form>
<div id="tvvd-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };

  function run() {
    var diagIn = Number($('tvvd-diag').value);
    if ($('tvvd-unit').value === 'cm') diagIn = diagIn / 2.54;
    if (!(diagIn > 0)) return;
    var ar = Number($('tvvd-ar').value);
    var heightIn = diagIn / Math.sqrt(1 + ar * ar);
    var widthIn = heightIn * ar;
    var res = $('tvvd-res').value.split('x').map(Number);
    var ppi = res[0] / widthIn;
    function distForAngle(deg) {
      var rad = deg * Math.PI / 180;
      return (widthIn / 2) / Math.tan(rad / 2);
    }
    var smpte = distForAngle(30);
    var thx = distForAngle(40);
    var pixel = (heightIn / res[1]) / Math.tan((1 / 60) * Math.PI / 180);
    function both(inches) {
      return inches.toFixed(1) + ' in  /  ' + (inches * 2.54).toFixed(0) + ' cm  /  ' + (inches / 12).toFixed(1) + ' ft';
    }
    $('tvvd-out').innerHTML =
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:10px;">' +
      card('SMPTE 30°', both(smpte), 'Cinema-standard field of view') +
      card('THX 40°', both(thx), 'More immersive, sit closer') +
      card('Pixel-sharp 4K/HD', both(pixel), 'About 1 arc-minute per pixel') +
      '</div>' +
      '<div style="font-size:.8rem;color:var(--text-secondary);">Screen is ' + widthIn.toFixed(1) + ' × ' + heightIn.toFixed(1) + ' in (' + ppi.toFixed(0) + ' PPI). A mixed-use living room usually lands between SMPTE and THX.</div>';
  }
  function card(title, value, note) {
    return '<div style="padding:12px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.72rem;color:var(--accent);font-weight:800;">' + title + '</div><div style="font-weight:800;color:var(--text);margin:6px 0 4px;">' + value + '</div><div style="font-size:.74rem;color:var(--text-secondary);">' + note + '</div></div>';
  }
  ['tvvd-diag', 'tvvd-unit', 'tvvd-res', 'tvvd-ar'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
