<h2 id="mapc-title" style="margin-top:0;color:var(--accent);">❤️ Mean Arterial Pressure</h2>

<form aria-describedby="mapc-desc" onsubmit="event.preventDefault();">
  <p id="mapc-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    MAP ≈ (systolic + 2 × diastolic) / 3, plus pulse pressure. A resting MAP near 70–100 mmHg is often cited as adequate organ perfusion. This is arithmetic, not a diagnosis — chest pain or a very high reading needs emergency care.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="mapc-sys" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Systolic (top)</label>
      <input id="mapc-sys" type="number" min="60" max="250" value="120" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="mapc-dia" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Diastolic (bottom)</label>
      <input id="mapc-dia" type="number" min="30" max="150" value="80" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="mapc-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var s = Number($('mapc-sys').value), d = Number($('mapc-dia').value);
    if (!(s > 0 && d > 0)) return;
    if (d >= s) {
      $('mapc-out').innerHTML = '<p style="color:#ffb8b8;font-size:.84rem;">Diastolic should be lower than systolic. Check the reading.</p>';
      return;
    }
    var map = (s + 2 * d) / 3;
    var pp = s - d;
    var note = map < 60 ? 'MAP under ~60 mmHg is often treated as hypotensive in hospital — seek care if you feel unwell.' :
      (s >= 180 || d >= 120) ? 'Very high pair — if this is real and you have symptoms (chest pain, weakness, vision loss), call emergency services.' :
      (s >= 140 || d >= 90) ? 'Clinic hypertension bands start around 140/90 (NICE). One home reading is not a diagnosis.' :
      'A single home reading is a snapshot. Rest 5 minutes, feet on the floor, arm supported, then repeat.';
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('mapc-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('MAP', map.toFixed(0) + ' mmHg') +
      cell('Pulse pressure', pp + ' mmHg') +
      cell('Reading', s + ' / ' + d) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">' + note + '</p>';
  }
  $('mapc-sys').addEventListener('input', run);
  $('mapc-dia').addEventListener('input', run);
  run();
})();
</script>
