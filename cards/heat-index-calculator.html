<h2 id="htix-title" style="margin-top:0;color:var(--accent);">🥵 Heat Index Calculator</h2>

<form aria-describedby="htix-desc" onsubmit="event.preventDefault();">
  <p id="htix-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    NWS Rothfusz heat index from shade air temperature and relative humidity. Officially for ≥ 27 °C. Full sun can feel several degrees worse. Not medical advice — heatstroke is an emergency.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="htix-t" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Air temperature °C</label>
      <input id="htix-t" type="number" step="any" value="32" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="htix-rh" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Relative humidity %</label>
      <input id="htix-rh" type="number" min="0" max="100" value="70" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="htix-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function hiF(T, R) {
    var HI = -42.379 + 2.04901523 * T + 10.14333127 * R - 0.22475541 * T * R
      - 0.00683783 * T * T - 0.05481717 * R * R + 0.00122874 * T * T * R
      + 0.00085282 * T * R * R - 0.00000199 * T * T * R * R;
    if (R < 13 && T >= 80 && T <= 112) HI -= ((13 - R) / 4) * Math.sqrt((17 - Math.abs(T - 95)) / 17);
    if (R > 85 && T >= 80 && T <= 87) HI += ((R - 85) / 10) * ((87 - T) / 5);
    return HI;
  }
  function run() {
    var tc = Number($('htix-t').value), rh = Number($('htix-rh').value);
    var tf = tc * 9 / 5 + 32;
    var f = hiF(tf, rh);
    var c = (f - 32) * 5 / 9;
    var band = f < 80 ? 'below caution band' : f < 91 ? 'caution' : f < 104 ? 'extreme caution' : f < 125 ? 'danger' : 'extreme danger';
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('htix-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Heat index', c.toFixed(1) + ' °C') +
      cell('Fahrenheit', f.toFixed(0) + ' °F') +
      cell('NWS band', band) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Drink water, seek shade. Formula assumes light wind and a shady spot.</p>';
  }
  $('htix-t').addEventListener('input', run);
  $('htix-rh').addEventListener('input', run);
  run();
})();
</script>
