<h2>🌐 HTTP Status Code Reference</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Complete reference of all HTTP status codes with descriptions, causes, and solutions. Search and filter instantly.</p>

<div id="hs-app" style="max-width:700px;margin:0 auto;">
  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <input id="hs-search" type="text" placeholder="Search codes (e.g. 404, Not Found, redirect)..." style="flex:1;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
  </div>

  <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
    <button onclick="window._hsFilter('all')" class="hs-btn" style="padding:6px 12px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.3);border-radius:6px;color:#2dd4ff;cursor:pointer;font-size:12px;">All</button>
    <button onclick="window._hsFilter('1')" class="hs-btn" style="padding:6px 12px;background:rgba(230,250,255,0.05);border:1px solid rgba(230,250,255,0.1);border-radius:6px;color:rgba(230,250,255,0.6);cursor:pointer;font-size:12px;">1xx Info</button>
    <button onclick="window._hsFilter('2')" class="hs-btn" style="padding:6px 12px;background:rgba(57,255,20,0.05);border:1px solid rgba(57,255,20,0.1);border-radius:6px;color:#39ff14;cursor:pointer;font-size:12px;">2xx Success</button>
    <button onclick="window._hsFilter('3')" class="hs-btn" style="padding:6px 12px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.1);border-radius:6px;color:#2dd4ff;cursor:pointer;font-size:12px;">3xx Redirect</button>
    <button onclick="window._hsFilter('4')" class="hs-btn" style="padding:6px 12px;background:rgba(255,165,0,0.05);border:1px solid rgba(255,165,0,0.1);border-radius:6px;color:#ffa500;cursor:pointer;font-size:12px;">4xx Client</button>
    <button onclick="window._hsFilter('5')" class="hs-btn" style="padding:6px 12px;background:rgba(255,77,77,0.05);border:1px solid rgba(255,77,77,0.1);border-radius:6px;color:#ff4d4d;cursor:pointer;font-size:12px;">5xx Server</button>
  </div>

  <div id="hs-list" style="max-height:500px;overflow-y:auto;"></div>
</div>

<script>
(function(){
  var codes=[
    {code:100,name:'Continue',desc:'Server received request headers, client should send body',cat:'1'},
    {code:101,name:'Switching Protocols',desc:'Server is switching protocols as requested',cat:'1'},
    {code:102,name:'Processing',desc:'Server has received and is processing the request',cat:'1'},
    {code:103,name:'Early Hints',desc:'Used to return some response headers before final response',cat:'1'},
    {code:200,name:'OK',desc:'Standard success response',cat:'2'},
    {code:201,name:'Created',desc:'Request succeeded, new resource created',cat:'2'},
    {code:202,name:'Accepted',desc:'Request accepted for processing but not completed',cat:'2'},
    {code:203,name:'Non-Authoritative Info',desc:'Response from a third-party copy',cat:'2'},
    {code:204,name:'No Content',desc:'Success but no content to return',cat:'2'},
    {code:205,name:'Reset Content',desc:'Reset the document view',cat:'2'},
    {code:206,name:'Partial Content',desc:'Partial resource returned (range request)',cat:'2'},
    {code:300,name:'Multiple Choices',desc:'Multiple options for the resource',cat:'3'},
    {code:301,name:'Moved Permanently',desc:'Resource permanently moved to new URL',cat:'3'},
    {code:302,name:'Found',desc:'Resource temporarily moved',cat:'3'},
    {code:303,name:'See Other',desc:'Redirect to another URL (GET)',cat:'3'},
    {code:304,name:'Not Modified',desc:'Resource not modified since last request',cat:'3'},
    {code:307,name:'Temporary Redirect',desc:'Temporary redirect preserving method',cat:'3'},
    {code:308,name:'Permanent Redirect',desc:'Permanent redirect preserving method',cat:'3'},
    {code:400,name:'Bad Request',desc:'Server cannot understand the request',cat:'4'},
    {code:401,name:'Unauthorized',desc:'Authentication required',cat:'4'},
    {code:403,name:'Forbidden',desc:'Server refuses to authorize the request',cat:'4'},
    {code:404,name:'Not Found',desc:'Resource not found at the given URL',cat:'4'},
    {code:405,name:'Method Not Allowed',desc:'HTTP method not allowed for this resource',cat:'4'},
    {code:406,name:'Not Acceptable',desc:'Resource cannot generate acceptable content',cat:'4'},
    {code:407,name:'Proxy Auth Required',desc:'Authentication with proxy required',cat:'4'},
    {code:408,name:'Request Timeout',desc:'Server timed out waiting for request',cat:'4'},
    {code:409,name:'Conflict',desc:'Request conflicts with current state',cat:'4'},
    {code:410,name:'Gone',desc:'Resource permanently removed',cat:'4'},
    {code:411,name:'Length Required',desc:'Content-Length header required',cat:'4'},
    {code:412,name:'Precondition Failed',desc:'Precondition in headers evaluated to false',cat:'4'},
    {code:413,name:'Payload Too Large',desc:'Request body exceeds server limit',cat:'4'},
    {code:414,name:'URI Too Long',desc:'Request URI exceeds server limit',cat:'4'},
    {code:415,name:'Unsupported Media Type',desc:'Media format not supported',cat:'4'},
    {code:416,name:'Range Not Satisfiable',desc:'Cannot fulfill range request',cat:'4'},
    {code:417,name:'Expectation Failed',desc:'Expect header cannot be met',cat:'4'},
    {code:418,name:"I'm a Teapot",desc:'April Fools joke (RFC 2324)',cat:'4'},
    {code:421,name:'Misdirected Request',desc:'Request directed at incapable server',cat:'4'},
    {code:422,name:'Unprocessable Entity',desc:'Well-formed but semantically erroneous',cat:'4'},
    {code:423,name:'Locked',desc:'Resource is locked',cat:'4'},
    {code:424,name:'Failed Dependency',desc:'Previous request caused this failure',cat:'4'},
    {code:425,name:'Too Early',desc:'Risk of replay attack',cat:'4'},
    {code:426,name:'Upgrade Required',desc:'Client should switch protocols',cat:'4'},
    {code:428,name:'Precondition Required',desc:'Request must be conditional',cat:'4'},
    {code:429,name:'Too Many Requests',desc:'Rate limited — slow down',cat:'4'},
    {code:431,name:'Request Header Too Large',desc:'Headers exceed server limit',cat:'4'},
    {code:451,name:'Unavailable For Legal Reasons',desc:'Resource blocked for legal reasons',cat:'4'},
    {code:500,name:'Internal Server Error',desc:'Server encountered an unexpected error',cat:'5'},
    {code:501,name:'Not Implemented',desc:'Server does not support the functionality',cat:'5'},
    {code:502,name:'Bad Gateway',desc:'Invalid response from upstream server',cat:'5'},
    {code:503,name:'Service Unavailable',desc:'Server temporarily overloaded or maintained',cat:'5'},
    {code:504,name:'Gateway Timeout',desc:'Upstream server timed out',cat:'5'},
    {code:505,name:'HTTP Version Not Supported',desc:'HTTP version not supported',cat:'5'},
    {code:506,name:'Variant Also Negotiates',desc:'Content negotiation error',cat:'5'},
    {code:507,name:'Insufficient Storage',desc:'Server storage full',cat:'5'},
    {code:508,name:'Loop Detected',desc:'Infinite loop detected',cat:'5'},
    {code:510,name:'Not Extended',desc:'Further extensions required',cat:'5'},
    {code:511,name:'Network Auth Required',desc:'Network authentication required',cat:'5'}
  ];
  var filter='all';
  function render(){
    var search=document.getElementById('hs-search').value.toLowerCase();
    var filtered=codes.filter(function(c){
      if(filter!=='all'&&c.cat!==filter)return false;
      if(!search)return true;
      return c.code.toString().indexOf(search)>=0||c.name.toLowerCase().indexOf(search)>=0||c.desc.toLowerCase().indexOf(search)>=0;
    });
    var html='';
    var colors={'1':'rgba(230,250,255,0.5)','2':'#39ff14','3':'#2dd4ff','4':'#ffa500','5':'#ff4d4d'};
    filtered.forEach(function(c){
      html+='<div style="display:flex;gap:12px;padding:10px 12px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.03);border-radius:6px;margin-bottom:4px;">'+
        '<div style="width:50px;font-size:18px;font-weight:700;color:'+colors[c.cat]+';font-family:monospace;">'+c.code+'</div>'+
        '<div style="flex:1;"><div style="font-weight:600;color:var(--text);">'+c.name+'</div>'+
        '<div style="font-size:13px;color:rgba(230,250,255,0.5);">'+c.desc+'</div></div></div>';
    });
    document.getElementById('hs-list').innerHTML=html||'<div style="text-align:center;padding:40px;color:rgba(230,250,255,0.3);">No matching codes found</div>';
  }
  window._hsFilter=function(f){filter=f;render();};
  document.getElementById('hs-search').addEventListener('input',render);
  render();
})();
</script>
