<h2 id="unitconverter-title" style="margin-top:0;color:var(--accent);">📐 Unit Converter</h2>

<form style="margin-bottom:16px;">
  <p class="small" style="color:rgba(230,250,255,0.7);margin-bottom:16px;">
    Convert between common units of length, weight, and temperature.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;">
    <div>
      <label for="unitconverter-value" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">🔢 Value</label>
      <input id="unitconverter-value" type="number" step="any" value="1"
             style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    </div>
    <div>
      <label for="unitconverter-from" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">From</label>
      <select id="unitconverter-from"
              style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(57,255,20,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;">
        <option value="m">Metres</option>
        <option value="km">Kilometres</option>
        <option value="ft">Feet</option>
        <option value="mi">Miles</option>
        <option value="kg">Kilograms</option>
        <option value="lb">Pounds</option>
        <option value="c">Celsius</option>
        <option value="f">Fahrenheit</option>
      </select>
    </div>
    <div>
      <label for="unitconverter-to" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">To</label>
      <select id="unitconverter-to"
              style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,165,0,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;">
        <option value="m">Metres</option>
        <option value="km" selected>Kilometres</option>
        <option value="ft">Feet</option>
        <option value="mi">Miles</option>
        <option value="kg">Kilograms</option>
        <option value="lb">Pounds</option>
        <option value="c">Celsius</option>
        <option value="f">Fahrenheit</option>
      </select>
    </div>
  </div>

  <div style="display:flex;gap:8px;">
    <button type="button" onclick="(function(b){var f=b.closest('form');var v=parseFloat(f.querySelector('#unitconverter-value').value)||0;var from=f.querySelector('#unitconverter-from').value;var to=f.querySelector('#unitconverter-to').value;var result=v;var len={m:1,km:1000,ft:0.3048,mi:1609.34};var wt={kg:1,lb:0.453592};if(from in len&&to in len){result=v*(len[from]/len[to]);}else if(from in wt&&to in wt){result=v*(wt[from]/wt[to]);}else if(from==='c'&&to==='f'){result=(v*9/5)+32;}else if(from==='f'&&to==='c'){result=(v-32)*5/9;}else if(from===to){result=v;}var res=f.parentElement.querySelector('#unitconverter-res');res.textContent=result.toLocaleString('en-GB',{maximumFractionDigits:4});var fromText=f.querySelector('#unitconverter-from').options[f.querySelector('#unitconverter-from').selectedIndex].text;var toText=f.querySelector('#unitconverter-to').options[f.querySelector('#unitconverter-to').selectedIndex].text;f.parentElement.querySelector('#unitconverter-detail').textContent=v+' '+fromText+' = '+result.toLocaleString('en-GB',{maximumFractionDigits:4})+' '+toText;})(this)"
            style="padding:12px 24px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:600;">Convert</button>
    <button type="button" onclick="(function(b){var f=b.closest('form');f.reset();f.parentElement.querySelector('#unitconverter-res').textContent='–';f.parentElement.querySelector('#unitconverter-detail').textContent='';})(this)"
            style="padding:12px 24px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(230,250,255,0.7);cursor:pointer;">Reset</button>
  </div>
</form>

<div class="results" aria-live="polite" style="background:rgba(0,0,0,0.3);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,0.05);">
  <div style="text-align:center;">
    <div style="font-size:0.8rem;color:rgba(230,250,255,0.5);margin-bottom:4px;">Converted Value</div>
    <div id="unitconverter-res" style="font-size:2rem;font-weight:700;color:var(--accent);">–</div>
    <div id="unitconverter-detail" style="font-size:0.85rem;color:rgba(230,250,255,0.4);margin-top:4px;"></div>
  </div>
</div>
