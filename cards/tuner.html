<h2 id="tuner-title" style="margin-top:0;color:var(--accent);">🎸 Instrument Tuner Reference</h2>

<div class="tn-container" style="font-family:inherit;color:var(--text);">
  <p class="small" style="color:rgba(230,250,255,0.7);margin-bottom:16px;">
    Reference notes for tuning your instrument. Educational only — verify with your ear or a professional tuner.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
    <div>
      <label for="tn-instrument" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">🎵 Instrument</label>
      <select id="tn-instrument" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;">
        <option value="guitar" selected>Guitar (EADGBE)</option>
        <option value="bass">Bass (EADG)</option>
        <option value="violin">Violin (GDAE)</option>
        <option value="ukulele">Ukulele (GCEA)</option>
      </select>
    </div>
    <div>
      <label for="tn-note" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">音符 Target Note</label>
      <select id="tn-note" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(57,255,20,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;">
        <option value="E2">E2 (82.41 Hz)</option>
        <option value="A2">A2 (110.00 Hz)</option>
        <option value="D3">D3 (146.83 Hz)</option>
        <option value="G3">G3 (196.00 Hz)</option>
        <option value="B3">B3 (246.94 Hz)</option>
        <option value="E4">E4 (329.63 Hz)</option>
        <option value="C4">C4 (261.63 Hz)</option>
        <option value="A4">A4 (440.00 Hz)</option>
      </select>
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
    <button type="button" onclick="(function(b){var c=b.closest('.tn-container');var inst=c.querySelector('#tn-instrument').value;var note=c.querySelector('#tn-note').value;var tuning={guitar:['E2','A2','D3','G3','B3','E4'],bass:['E2','A2','D3','G3'],violin:['G3','D4','A4','E5'],ukulele:['G4','C4','E4','A4']};var names={guitar:'Guitar',bass:'Bass',violin:'Violin',ukulele:'Ukulele'};var freqs={'E2':82.41,'A2':110.00,'D3':146.83,'G3':196.00,'B3':246.94,'E4':329.63,'C4':261.63,'A4':440.00,'G4':392.00,'D4':293.66,'E5':659.25};var notes=tuning[inst];var isStandard=notes.indexOf(note)>=0;var out=names[inst]+' standard tuning: '+notes.join(' - ')+'\\n\\nSelected: '+note+' ('+(freqs[note]||'?')+' Hz)'+(isStandard?'\\n✓ This is a standard string for '+names[inst]:'\\n⚠ This note is not in standard '+names[inst]+' tuning');c.querySelector('#tn-output').value=out;c.querySelector('#tn-hint').textContent='Reference displayed.';})(this)"
            style="padding:10px 20px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:600;font-size:14px;">Show Reference</button>
    <button type="button" onclick="(function(b){var c=b.closest('.tn-container');var out=c.querySelector('#tn-output').value;if(!out.trim())return;navigator.clipboard&&navigator.clipboard.writeText(out).then(function(){c.querySelector('#tn-hint').textContent='Copied.';setTimeout(function(){c.querySelector('#tn-hint').textContent='';},1600);});})(this)"
            style="padding:10px 20px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(230,250,255,0.7);cursor:pointer;font-size:14px;">📋 Copy</button>
    <button type="button" onclick="(function(b){var c=b.closest('.tn-container');c.querySelector('#tn-instrument').value='guitar';c.querySelector('#tn-note').value='E2';c.querySelector('#tn-output').value='';c.querySelector('#tn-hint').textContent='';})(this)"
            style="padding:10px 20px;background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.2);border-radius:8px;color:#ff4d4d;cursor:pointer;font-size:14px;">Reset</button>
  </div>

  <div style="background:rgba(0,0,0,0.3);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,0.05);">
    <textarea id="tn-output" rows="6" readonly style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.15);background:transparent;color:var(--text);font-size:14px;resize:vertical;" placeholder="Tuning reference will appear here..."></textarea>
    <div id="tn-hint" style="font-size:0.8rem;color:rgba(230,250,255,0.4);margin-top:8px;"></div>
  </div>
</div>
