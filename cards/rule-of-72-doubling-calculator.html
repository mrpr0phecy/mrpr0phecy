<h2 id="r72x-title" style="margin-top:0;color:var(--accent);">⏳ Rule of 72 Doubling Time</h2>

<form aria-describedby="r72x-desc" onsubmit="event.preventDefault();">
  <p id="r72x-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Years to double ≈ 72 ÷ annual %. At 6% that’s about 12 years; at 9% about 8. The exact figure is ln(2)/ln(1+r). A back-of-envelope for interest, inflation and population — not a guarantee.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="r72x-rate" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Annual rate %</label>
      <input id="r72x-rate" type="number" step="any" value="7" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="r72x-start" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Starting amount</label>
      <input id="r72x-start" type="number" min="0" step="any" value="1000" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="r72x-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var r = Number($('r72x-rate').value), s = Number($('r72x-start').value);
    if (!(r > 0 && r < 100 && s >= 0)) {
      $('r72x-out').innerHTML = '<p style="color:#ffb8b8;font-size:.84rem;">Rate must be between 0 and 100% (not including 0).</p>';
      return;
    }
    var approx = 72 / r;
    var exact = Math.log(2) / Math.log(1 + r / 100);
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('r72x-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Rule of 72', approx.toFixed(1) + ' years') +
      cell('Exact doubling', exact.toFixed(2) + ' years') +
      cell('After that', (s * 2).toLocaleString(undefined, { maximumFractionDigits: 2 })) +
      cell('10 years at this rate', (s * Math.pow(1 + r / 100, 10)).toLocaleString(undefined, { maximumFractionDigits: 2 })) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Rule of 69.3 is closer for continuous compounding. Rule of 72 is nicest in the 6–10% band.</p>';
  }
  $('r72x-rate').addEventListener('input', run);
  $('r72x-start').addEventListener('input', run);
  run();
})();
</script>
