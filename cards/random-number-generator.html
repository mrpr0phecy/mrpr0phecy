<h2>🎲 Random Number Generator</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Generate random numbers within any range. Supports integers, decimals, multiple values, and custom distributions.</p>

<div id="rn-app" style="max-width:600px;margin:0 auto;">
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;">
    <div>
      <label style="display:block;margin-bottom:4px;color:#2dd4ff;font-size:12px;">Min</label>
      <input id="rn-min" type="number" value="1" style="width:100%;padding:8px;border-radius:6px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;box-sizing:border-box;" />
    </div>
    <div>
      <label style="display:block;margin-bottom:4px;color:#2dd4ff;font-size:12px;">Max</label>
      <input id="rn-max" type="number" value="100" style="width:100%;padding:8px;border-radius:6px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;box-sizing:border-box;" />
    </div>
    <div>
      <label style="display:block;margin-bottom:4px;color:#2dd4ff;font-size:12px;">Count</label>
      <input id="rn-count" type="number" min="1" max="10000" value="1" style="width:100%;padding:8px;border-radius:6px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;box-sizing:border-box;" />
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
    <label style="font-size:12px;color:rgba(230,250,255,0.5);display:flex;align-items:center;gap:4px;">
      <input id="rn-decimal" type="checkbox" style="accent-color:#2dd4ff;"> Decimal
    </label>
    <label style="font-size:12px;color:rgba(230,250,255,0.5);display:flex;align-items:center;gap:4px;">
      <input id="rn-unique" type="checkbox" style="accent-color:#2dd4ff;"> Unique only
    </label>
    <label style="font-size:12px;color:rgba(230,250,255,0.5);display:flex;align-items:center;gap:4px;">
      <input id="rn-sort" type="checkbox" style="accent-color:#2dd4ff;"> Sort
    </label>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <button onclick="window._rnGenerate()" style="flex:1;padding:12px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.3);border-radius:8px;color:#39ff14;cursor:pointer;font-weight:700;font-size:16px;">🎲 Generate</button>
    <button onclick="window._rnCopy()" style="padding:12px 16px;background:rgba(45,212,255,0.1);border:1px solid rgba(45,212,255,0.3);border-radius:8px;color:#2dd4ff;cursor:pointer;">📋 Copy</button>
  </div>

  <div id="rn-result" style="padding:16px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.05);border-radius:8px;font-family:monospace;font-size:18px;color:#39ff14;text-align:center;min-height:50px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;word-break:break-all;"></div>

  <div id="rn-stats" style="margin-top:8px;font-size:12px;color:rgba(230,250,255,0.4);text-align:center;"></div>

  <div style="margin-top:16px;padding:12px;background:rgba(0,0,0,0.2);border-radius:8px;">
    <div style="font-size:12px;color:rgba(230,250,255,0.5);margin-bottom:8px;">Quick Presets</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <button onclick="window._rnPreset(1,6,1)" style="padding:6px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:rgba(230,250,255,0.6);cursor:pointer;font-size:12px;">🎲 Dice (1-6)</button>
      <button onclick="window._rnPreset(1,49,6)" style="padding:6px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:rgba(230,250,255,0.6);cursor:pointer;font-size:12px;">🎰 Lottery (6 from 49)</button>
      <button onclick="window._rnPreset(1,10,1)" style="padding:6px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:rgba(230,250,255,0.6);cursor:pointer;font-size:12px;">🔢 1-10</button>
      <button onclick="window._rnPreset(0,1,5)" style="padding:6px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:rgba(230,250,255,0.6);cursor:pointer;font-size:12px;">📊 5 decimals (0-1)</button>
      <button onclick="window._rnPreset(1000,9999,1)" style="padding:6px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:rgba(230,250,255,0.6);cursor:pointer;font-size:12px;">🔐 PIN (4 digits)</button>
    </div>
  </div>
</div>

<script>
(function(){
  function generate(){
    var min=parseFloat(document.getElementById('rn-min').value)||0;
    var max=parseFloat(document.getElementById('rn-max').value)||100;
    var count=Math.max(1,Math.min(10000,parseInt(document.getElementById('rn-count').value)||1));
    var decimal=document.getElementById('rn-decimal').checked;
    var unique=document.getElementById('rn-unique').checked;
    var sort=document.getElementById('rn-sort').checked;
    if(min>max){var t=min;min=max;max=t;}
    var nums=[];
    var attempts=0;
    while(nums.length<count&&attempts<count*100){
      attempts++;
      var n;
      if(decimal)n=min+Math.random()*(max-min);
      else n=Math.floor(Math.random()*(max-min+1))+min;
      if(unique&&nums.indexOf(n)>=0)continue;
      nums.push(n);
    }
    if(sort)nums.sort(function(a,b){return a-b;});
    var fmt=decimal?function(n){return n.toFixed(4);}:function(n){return n.toString();};
    var html='';
    if(count<=50){
      nums.forEach(function(n){html+='<span style="display:inline-block;padding:4px 10px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.2);border-radius:4px;margin:2px;">'+fmt(n)+'</span>';});
    }else{
      html='<div style="font-size:14px;line-height:2;">'+nums.map(fmt).join(', ')+'</div>';
    }
    document.getElementById('rn-result').innerHTML=html;
    // Stats
    if(count>1){
      var sum=nums.reduce(function(a,b){return a+b;},0);
      var avg=sum/count;
      var minV=Math.min.apply(null,nums);
      var maxV=Math.max.apply(null,nums);
      document.getElementById('rn-stats').textContent='Min: '+fmt(minV)+' · Max: '+fmt(maxV)+' · Avg: '+avg.toFixed(2)+' · Sum: '+sum.toFixed(2);
    }else{
      document.getElementById('rn-stats').textContent='';
    }
  }
  function copy(){
    var text=document.getElementById('rn-result').textContent;
    if(navigator.clipboard)navigator.clipboard.writeText(text);
  }
  function preset(min,max,count){
    document.getElementById('rn-min').value=min;
    document.getElementById('rn-max').value=max;
    document.getElementById('rn-count').value=count;
    document.getElementById('rn-decimal').checked=(min===0&&max===1);
    generate();
  }
  window._rnGenerate=generate;window._rnCopy=copy;window._rnPreset=preset;
  generate();
})();
</script>
