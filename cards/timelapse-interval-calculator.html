<h2 id="tlps-title" style="margin-top:0;color:var(--accent);">⏱️ Timelapse Interval</h2>

<form aria-describedby="tlps-desc" onsubmit="event.preventDefault();">
  <p id="tlps-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Shots needed = clip length × frame rate. Real time covered = shots × interval. Leave the battery and a bigger card than you think. Sunset clouds often want 2–5 s; construction days want 30–60 s.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="tlps-clip" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Finished clip (s)</label>
      <input id="tlps-clip" type="number" min="1" step="any" value="10" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="tlps-fps" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Playback fps</label>
      <select id="tlps-fps" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="24">24</option>
        <option value="25" selected>25 (PAL)</option>
        <option value="30">30</option>
      </select>
    </div>
    <div>
      <label for="tlps-int" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Interval (s)</label>
      <input id="tlps-int" type="number" min="0.1" step="any" value="4" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="tlps-mb" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">MB per still</label>
      <input id="tlps-mb" type="number" min="0" step="any" value="8" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="tlps-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function fmt(sec) {
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.round(sec % 60);
    if (h) return h + ' h ' + m + ' min';
    if (m) return m + ' min ' + s + ' s';
    return s + ' s';
  }
  function run() {
    var clip = Number($('tlps-clip').value), fps = Number($('tlps-fps').value);
    var interval = Number($('tlps-int').value), mb = Number($('tlps-mb').value);
    if (!(clip > 0 && fps > 0 && interval > 0)) return;
    var shots = Math.ceil(clip * fps);
    var real = shots * interval;
    var gb = shots * mb / 1024;
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('tlps-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Shots', shots.toLocaleString()) +
      cell('Real time to film', fmt(real)) +
      cell('Speed-up', (real / clip).toFixed(0) + '×') +
      cell('Card space', gb.toFixed(2) + ' GB') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Lock exposure and white balance. Turn off long-exposure noise reduction — it doubles the interval.</p>';
  }
  ['tlps-clip', 'tlps-fps', 'tlps-int', 'tlps-mb'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
