<h2 id="motp-title" style="margin-top:0;color:var(--accent);">🕒 Meeting Overlap Planner</h2>

<form aria-describedby="motp-desc" onsubmit="event.preventDefault();">
  <p id="motp-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Find hours when two or three cities are all awake. Uses IANA time zones and this device’s DST tables — no calendar is connected, nothing is booked.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end;margin-bottom:12px;">
    <div>
      <label for="motp-a" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Person A</label>
      <select id="motp-a" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);"></select>
    </div>
    <div>
      <label for="motp-b" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Person B</label>
      <select id="motp-b" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);"></select>
    </div>
    <div>
      <label for="motp-c" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Person C (optional)</label>
      <select id="motp-c" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);"></select>
    </div>
    <div>
      <label for="motp-from" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Local work start</label>
      <input id="motp-from" type="time" value="09:00" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="motp-to" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Local work end</label>
      <input id="motp-to" type="time" value="18:00" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="motp-out"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var ZONES = [
    ['', '— none —'],
    ['Europe/London', 'London'],
    ['Europe/Paris', 'Paris / Berlin / Rome'],
    ['Europe/Athens', 'Athens / Helsinki'],
    ['Europe/Moscow', 'Moscow'],
    ['Asia/Dubai', 'Dubai'],
    ['Asia/Kolkata', 'Mumbai / Delhi'],
    ['Asia/Singapore', 'Singapore'],
    ['Asia/Shanghai', 'Beijing / Shanghai'],
    ['Asia/Tokyo', 'Tokyo'],
    ['Australia/Sydney', 'Sydney'],
    ['Pacific/Auckland', 'Auckland'],
    ['America/New_York', 'New York'],
    ['America/Chicago', 'Chicago'],
    ['America/Denver', 'Denver'],
    ['America/Los_Angeles', 'Los Angeles'],
    ['America/Sao_Paulo', 'São Paulo'],
    ['Africa/Johannesburg', 'Johannesburg'],
    ['UTC', 'UTC']
  ];
  function fill(sel, def) {
    sel.innerHTML = ZONES.map(function (z) {
      return '<option value="' + z[0] + '"' + (z[0] === def ? ' selected' : '') + '>' + z[1] + '</option>';
    }).join('');
  }
  fill($('motp-a'), 'Europe/London');
  fill($('motp-b'), 'America/New_York');
  fill($('motp-c'), '');

  function hm(str) { var p = str.split(':'); return Number(p[0]) * 60 + Number(p[1]); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function localMinutes(date, tz) {
    var parts = new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(date);
    var h = 0, m = 0;
    parts.forEach(function (p) { if (p.type === 'hour') h = Number(p.value); if (p.type === 'minute') m = Number(p.value); });
    return h * 60 + m;
  }
  function fmtClock(min, tz, utcMs) {
    var d = new Date(utcMs);
    return new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(d);
  }
  function run() {
    var zones = [$('motp-a').value, $('motp-b').value, $('motp-c').value].filter(Boolean);
    if (zones.length < 2) { $('motp-out').innerHTML = '<p style="color:var(--text-secondary);font-size:.84rem;">Pick at least two cities.</p>'; return; }
    var start = hm($('motp-from').value), end = hm($('motp-to').value);
    if (!(end > start)) { $('motp-out').innerHTML = '<p style="color:#ffb8b8;font-size:.84rem;">Work end must be after start (same local day).</p>'; return; }
    var now = new Date();
    now.setUTCHours(0, 0, 0, 0);
    var hits = [];
    for (var i = 0; i < 24 * 4; i++) {
      var t = now.getTime() + i * 15 * 60000;
      var ok = zones.every(function (z) {
        var lm = localMinutes(new Date(t), z);
        return lm >= start && lm < end;
      });
      if (ok) hits.push(t);
    }
    if (!hits.length) {
      $('motp-out').innerHTML = '<div style="padding:12px;border-radius:10px;background:rgba(255,77,77,.1);border:1px solid rgba(255,77,77,.35);color:#ffb8b8;">No overlap today with those working hours. Try a wider window, or drop a city.</div>';
      return;
    }
    var ranges = [];
    var cur = [hits[0], hits[0]];
    for (var j = 1; j < hits.length; j++) {
      if (hits[j] === cur[1] + 15 * 60000) cur[1] = hits[j];
      else { ranges.push(cur); cur = [hits[j], hits[j]]; }
    }
    ranges.push(cur);
    var html = ranges.map(function (r) {
      var a = r[0], b = r[1] + 15 * 60000;
      var lines = zones.map(function (z) {
        var label = ZONES.filter(function (x) { return x[0] === z; })[0][1];
        return '<div style="font-size:.8rem;color:var(--text);"><strong style="color:var(--accent);">' + label + '</strong> ' + fmtClock(0, z, a) + ' – ' + fmtClock(0, z, b) + '</div>';
      }).join('');
      return '<div style="padding:12px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);margin-bottom:8px;">' + lines + '</div>';
    }).join('');
    $('motp-out').innerHTML = '<div style="font-size:.78rem;color:var(--text-secondary);margin-bottom:8px;">' + ranges.length + ' overlap window' + (ranges.length === 1 ? '' : 's') + ' in the next 24 hours (15-minute steps, using today\'s DST).</div>' + html;
  }
  ['motp-a', 'motp-b', 'motp-c', 'motp-from', 'motp-to'].forEach(function (id) {
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
