<h2 id="ndfe-title" style="margin-top:0;color:var(--accent);">🕶️ ND Filter Exposure</h2>

<form aria-describedby="ndfe-desc" onsubmit="event.preventDefault();">
  <p id="ndfe-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    New shutter = old shutter × 2^(stops). ND8 is 3 stops, ND64 is 6, ND1000 is 10. Use it for silky water and daytime video at 180° shutter. Recheck highlights — filters are not perfectly even.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="ndfe-sh" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Unfiltered shutter (s)</label>
      <input id="ndfe-sh" type="number" min="0.0001" step="any" value="0.002" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ndfe-nd" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Filter</label>
      <select id="ndfe-nd" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="1">ND2 — 1 stop</option>
        <option value="2">ND4 — 2 stops</option>
        <option value="3">ND8 — 3 stops</option>
        <option value="4">ND16 — 4 stops</option>
        <option value="6">ND64 — 6 stops</option>
        <option value="10" selected>ND1000 — 10 stops</option>
        <option value="15">ND32000 — 15 stops</option>
      </select>
    </div>
    <div>
      <label for="ndfe-custom" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Custom stops</label>
      <input id="ndfe-custom" type="number" min="0" max="20" step="any" placeholder="optional" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="ndfe-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function fmt(t) {
    if (t < 0.5) return '1/' + Math.round(1 / t) + ' s';
    if (t < 60) return t.toFixed(t < 10 ? 2 : 1) + ' s';
    var m = Math.floor(t / 60), s = Math.round(t % 60);
    return m + ' min ' + s + ' s';
  }
  function run() {
    var sh = Number($('ndfe-sh').value);
    var custom = Number($('ndfe-custom').value);
    var stops = custom > 0 ? custom : Number($('ndfe-nd').value);
    if (!(sh > 0 && stops >= 0)) return;
    var next = sh * Math.pow(2, stops);
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('ndfe-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Without ND', fmt(sh) + '  (' + sh + ' s)') +
      cell('With ND', fmt(next) + '  (' + (next >= 1 ? next.toFixed(1) + ' s' : next.toExponential(2) + ' s') + ')') +
      cell('Stops', String(stops)) +
      cell('Factor', Math.pow(2, stops).toLocaleString() + '×') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">1/500 s + ND1000 ≈ 2 s. Stacking two filters adds the stops. Use a tripod and disable long-exposure NR if you want the true time.</p>';
  }
  ['ndfe-sh', 'ndfe-nd', 'ndfe-custom'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
