<h2 id="cflt-title" style="margin-top:0;color:var(--accent);">🎛️ CSS Filter Generator</h2>

<p id="cflt-desc" class="small" style="color:var(--text-secondary);margin-bottom:16px;">
  Combine brightness, contrast, saturation, hue, blur and monochrome effects with a live visual preview, then copy one
  <code>filter</code> declaration. Useful for hero images, hover states and quick image treatments without an editor.
</p>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:12px;">
  <label for="cflt-brightness" style="font-size:.76rem;color:var(--text-secondary);">Brightness <strong id="cflt-brightness-v" style="float:right;color:var(--accent);">100%</strong><input id="cflt-brightness" type="range" min="0" max="200" value="100" style="display:block;width:100%;margin-top:5px;accent-color:var(--accent);"></label>
  <label for="cflt-contrast" style="font-size:.76rem;color:var(--text-secondary);">Contrast <strong id="cflt-contrast-v" style="float:right;color:var(--accent);">100%</strong><input id="cflt-contrast" type="range" min="0" max="200" value="100" style="display:block;width:100%;margin-top:5px;accent-color:var(--accent);"></label>
  <label for="cflt-saturate" style="font-size:.76rem;color:var(--text-secondary);">Saturate <strong id="cflt-saturate-v" style="float:right;color:var(--accent);">100%</strong><input id="cflt-saturate" type="range" min="0" max="300" value="100" style="display:block;width:100%;margin-top:5px;accent-color:var(--accent);"></label>
  <label for="cflt-hue" style="font-size:.76rem;color:var(--text-secondary);">Hue rotate <strong id="cflt-hue-v" style="float:right;color:var(--accent);">0°</strong><input id="cflt-hue" type="range" min="0" max="360" value="0" style="display:block;width:100%;margin-top:5px;accent-color:var(--accent);"></label>
  <label for="cflt-blur" style="font-size:.76rem;color:var(--text-secondary);">Blur <strong id="cflt-blur-v" style="float:right;color:var(--accent);">0px</strong><input id="cflt-blur" type="range" min="0" max="20" value="0" style="display:block;width:100%;margin-top:5px;accent-color:var(--accent);"></label>
  <label for="cflt-gray" style="font-size:.76rem;color:var(--text-secondary);">Grayscale <strong id="cflt-gray-v" style="float:right;color:var(--accent);">0%</strong><input id="cflt-gray" type="range" min="0" max="100" value="0" style="display:block;width:100%;margin-top:5px;accent-color:var(--accent);"></label>
  <label for="cflt-sepia" style="font-size:.76rem;color:var(--text-secondary);">Sepia <strong id="cflt-sepia-v" style="float:right;color:var(--accent);">0%</strong><input id="cflt-sepia" type="range" min="0" max="100" value="0" style="display:block;width:100%;margin-top:5px;accent-color:var(--accent);"></label>
  <label for="cflt-invert" style="font-size:.76rem;color:var(--text-secondary);">Invert <strong id="cflt-invert-v" style="float:right;color:var(--accent);">0%</strong><input id="cflt-invert" type="range" min="0" max="100" value="0" style="display:block;width:100%;margin-top:5px;accent-color:var(--accent);"></label>
  <label for="cflt-opacity" style="font-size:.76rem;color:var(--text-secondary);">Opacity <strong id="cflt-opacity-v" style="float:right;color:var(--accent);">100%</strong><input id="cflt-opacity" type="range" min="0" max="100" value="100" style="display:block;width:100%;margin-top:5px;accent-color:var(--accent);"></label>
</div>

<div style="display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:-2px 0 13px;"><span style="font-size:.75rem;color:var(--text-secondary);">Presets:</span><button type="button" class="cflt-preset" data-filter="105,110,120,0,0,0,0,0,100" style="padding:6px 9px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.15);border-radius:7px;cursor:pointer;font-size:.75rem;">Crisp</button><button type="button" class="cflt-preset" data-filter="105,95,130,345,0,0,18,0,100" style="padding:6px 9px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.15);border-radius:7px;cursor:pointer;font-size:.75rem;">Warm film</button><button type="button" class="cflt-preset" data-filter="110,125,0,0,0,100,0,0,100" style="padding:6px 9px;background:rgba(45,212,255,.08);color:var(--accent);border:1px solid rgba(45,212,255,.3);border-radius:7px;cursor:pointer;font-size:.75rem;">Monochrome</button><button type="button" class="cflt-preset" data-filter="95,90,75,18,0,0,65,0,100" style="padding:6px 9px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.15);border-radius:7px;cursor:pointer;font-size:.75rem;">Vintage</button><button type="button" class="cflt-preset" data-filter="105,110,145,185,0,0,0,0,100" style="padding:6px 9px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.15);border-radius:7px;cursor:pointer;font-size:.75rem;">Cool shift</button></div>

<div style="padding:18px;border:1px solid rgba(45,212,255,.26);border-radius:11px;background:#08131e;overflow:hidden;">
  <div id="cflt-preview" aria-label="CSS filter live preview" style="position:relative;min-height:188px;border-radius:9px;overflow:hidden;background:linear-gradient(135deg,#ffbe55 0%,#f05b74 36%,#6546d4 65%,#2dd4ff 100%);">
    <div style="position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.84);top:20px;left:12%;box-shadow:0 0 32px rgba(255,255,255,.65);"></div>
    <div style="position:absolute;right:12%;bottom:20px;width:42%;height:44%;border-radius:60% 40% 0 0;background:rgba(8,25,55,.78);"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:36%;background:linear-gradient(135deg,rgba(9,75,94,.76),rgba(41,158,143,.66));"></div>
    <div style="position:absolute;left:18px;bottom:15px;color:#fff;text-shadow:0 2px 9px rgba(0,0,0,.7);font-size:.81rem;font-weight:800;letter-spacing:.08em;">FILTER PREVIEW</div>
  </div>
</div>

<label for="cflt-output" style="display:block;font-size:.78rem;color:var(--text-secondary);margin:13px 0 5px;">CSS declaration</label>
<textarea id="cflt-output" rows="4" readonly spellcheck="false" aria-label="Generated CSS filter declaration" style="width:100%;box-sizing:border-box;padding:11px;border-radius:9px;background:rgba(0,0,0,.3);color:#91f7ff;border:1px solid rgba(45,212,255,.3);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.79rem;line-height:1.5;resize:vertical;"></textarea>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;"><button type="button" id="cflt-copy" style="padding:8px 13px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-weight:800;font-size:.81rem;">Copy CSS</button><button type="button" id="cflt-reset" style="padding:8px 12px;background:transparent;color:var(--text-secondary);border:1px solid rgba(255,255,255,.16);border-radius:8px;cursor:pointer;font-size:.8rem;">Reset</button><span id="cflt-status" aria-live="polite" style="font-size:.76rem;color:var(--text-secondary);"></span></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var fields = ['brightness', 'contrast', 'saturate', 'hue', 'blur', 'gray', 'sepia', 'invert', 'opacity'];
  var defaults = [100, 100, 100, 0, 0, 0, 0, 0, 100];
  function declaration() {
    return 'filter: brightness(' + $('cflt-brightness').value + '%) contrast(' + $('cflt-contrast').value + '%) saturate(' + $('cflt-saturate').value + '%) hue-rotate(' + $('cflt-hue').value + 'deg) blur(' + $('cflt-blur').value + 'px) grayscale(' + $('cflt-gray').value + '%) sepia(' + $('cflt-sepia').value + '%) invert(' + $('cflt-invert').value + '%) opacity(' + $('cflt-opacity').value + '%);';
  }
  function update() {
    fields.forEach(function (field) { var suffix = field === 'hue' ? '°' : (field === 'blur' ? 'px' : '%'); $('cflt-' + field + '-v').textContent = $('cflt-' + field).value + suffix; });
    var css = declaration(); $('cflt-output').value = css; $('cflt-preview').style.filter = css.replace(/^filter:\s*|;$/g, '');
    $('cflt-status').textContent = 'Applied ' + fields.filter(function (field) { return Number($('cflt-' + field).value) !== (field === 'brightness' || field === 'contrast' || field === 'saturate' || field === 'opacity' ? 100 : 0); }).length + ' non-default effects.';
  }
  function setValues(values) { fields.forEach(function (field, index) { $('cflt-' + field).value = values[index]; }); update(); }
  function copyText(text, done) { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { fallback(text, done); }); else fallback(text, done); }
  function fallback(text, done) { var helper = document.createElement('textarea'); helper.value = text; helper.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(helper); helper.select(); try { document.execCommand('copy'); } catch (e) {} helper.remove(); done(); }
  fields.forEach(function (field) { $('cflt-' + field).addEventListener('input', update); });
  Array.prototype.forEach.call(host.querySelectorAll('.cflt-preset'), function (button) { button.addEventListener('click', function () { setValues(this.dataset.filter.split(',')); }); });
  $('cflt-copy').addEventListener('click', function () { copyText($('cflt-output').value, function () { $('cflt-copy').textContent = '✓ Copied'; setTimeout(function () { $('cflt-copy').textContent = 'Copy CSS'; }, 1400); }); });
  $('cflt-reset').addEventListener('click', function () { setValues(defaults); });
  update();
})();
</script>
