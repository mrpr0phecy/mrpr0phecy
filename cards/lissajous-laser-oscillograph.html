<h2 id="llo-title" style="margin-top:0;color:var(--accent);">⚡ Lissajous Laser Projector</h2>

<form aria-describedby="llo-desc" onsubmit="event.preventDefault();">
  <p id="llo-desc" class="small" style="color:var(--muted);margin-bottom:14px;">
    Dual-galvanometer laser projector simulating orthogonal harmonic oscillations, phase shifts, and phosphorescent persistence curves.
  </p>

  <!-- Ratio Presets -->
  <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;">
    <button type="button" class="llo-ratio-btn active" data-fx="1" data-fy="1" style="padding:4px 10px;border-radius:4px;background:rgba(0,255,102,0.2);border:1px solid #00ff66;color:#00ff66;font-size:0.75rem;font-weight:bold;cursor:pointer;white-space:nowrap;">1:1 (Circle / Ellipse)</button>
    <button type="button" class="llo-ratio-btn" data-fx="1" data-fy="2" style="padding:4px 10px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.75rem;cursor:pointer;white-space:nowrap;">1:2 (Figure-8)</button>
    <button type="button" class="llo-ratio-btn" data-fx="3" data-fy="2" style="padding:4px 10px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.75rem;cursor:pointer;white-space:nowrap;">3:2 (Musical Fifth)</button>
    <button type="button" class="llo-ratio-btn" data-fx="3" data-fy="4" style="padding:4px 10px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.75rem;cursor:pointer;white-space:nowrap;">3:4 (Complex Knot)</button>
    <button type="button" class="llo-ratio-btn" data-fx="5" data-fy="6" style="padding:4px 10px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.75rem;cursor:pointer;white-space:nowrap;">5:6 (Lattice Net)</button>
  </div>

  <!-- Phosphor Oscilloscope Screen -->
  <div style="background:#010804;border:1px solid rgba(0,255,102,0.35);border-radius:8px;padding:8px;margin-bottom:12px;text-align:center;box-shadow:0 0 16px rgba(0,255,102,0.1) inset;">
    <canvas id="llo-canvas" width="560" height="240" style="width:100%;height:240px;display:block;background:#010704;border-radius:6px;"></canvas>

    <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.7rem;color:var(--muted);margin-top:6px;padding:0 4px;">
      <span id="llo-status" style="color:#00ff66;font-family:monospace;">Galvanometer Frequency Ratio fx:fy = 1:1</span>
      <span id="llo-trail-info" style="color:var(--muted);">CRT Phosphor Decay: Active</span>
    </div>
  </div>

  <!-- Parameter Controls -->
  <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin-bottom:12px;">
    <!-- X Frequency -->
    <div>
      <div style="display:flex;justify-content:space-between;font-size:0.68rem;color:var(--muted);margin-bottom:2px;">
        <span>X Frequency (fx)</span>
        <span id="llo-val-fx">1.0</span>
      </div>
      <input type="range" id="llo-slider-fx" min="1" max="9" step="1" value="1" style="width:100%;">
    </div>

    <!-- Y Frequency -->
    <div>
      <div style="display:flex;justify-content:space-between;font-size:0.68rem;color:var(--muted);margin-bottom:2px;">
        <span>Y Frequency (fy)</span>
        <span id="llo-val-fy">1.0</span>
      </div>
      <input type="range" id="llo-slider-fy" min="1" max="9" step="1" value="1" style="width:100%;">
    </div>

    <!-- Phase Shift Delta -->
    <div>
      <div style="display:flex;justify-content:space-between;font-size:0.68rem;color:var(--muted);margin-bottom:2px;">
        <span>Phase Shift (δ)</span>
        <span id="llo-val-delta">90°</span>
      </div>
      <input type="range" id="llo-slider-delta" min="0" max="360" value="90" style="width:100%;">
    </div>
  </div>

  <!-- Color Selector & Action -->
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div style="display:flex;gap:8px;align-items:center;">
      <span style="font-size:0.72rem;color:var(--muted);">Laser:</span>
      <button type="button" class="llo-col-btn active" data-col="#00ff66" style="width:20px;height:20px;border-radius:50%;background:#00ff66;border:2px solid #fff;cursor:pointer;"></button>
      <button type="button" class="llo-col-btn" data-col="#00eeff" style="width:20px;height:20px;border-radius:50%;background:#00eeff;border:2px solid transparent;cursor:pointer;"></button>
      <button type="button" class="llo-col-btn" data-col="#ff007f" style="width:20px;height:20px;border-radius:50%;background:#ff007f;border:2px solid transparent;cursor:pointer;"></button>
      <button type="button" class="llo-col-btn" data-col="#ffb700" style="width:20px;height:20px;border-radius:50%;background:#ffb700;border:2px solid transparent;cursor:pointer;"></button>
    </div>
    <button type="button" id="llo-btn-sweep" style="padding:6px 14px;border-radius:6px;background:rgba(0,255,102,0.2);border:1px solid #00ff66;color:#00ff66;font-size:0.75rem;font-weight:bold;cursor:pointer;">▶ Continuous Phase Sweep</button>
  </div>
</form>

<script>
(function() {
  const canvas = document.getElementById('llo-canvas');
  const ctx = canvas.getContext('2d');

  const sFx = document.getElementById('llo-slider-fx');
  const sFy = document.getElementById('llo-slider-fy');
  const sDelta = document.getElementById('llo-slider-delta');

  const vFx = document.getElementById('llo-val-fx');
  const vFy = document.getElementById('llo-val-fy');
  const vDelta = document.getElementById('llo-val-delta');
  const statusEl = document.getElementById('llo-status');

  const btnSweep = document.getElementById('llo-btn-sweep');

  let fx = 1;
  let fy = 1;
  let deltaDeg = 90;
  let laserColor = '#00ff66';
  let isSweeping = true;
  let beamT = 0;

  function drawGrid() {
    ctx.strokeStyle = 'rgba(0, 255, 102, 0.08)';
    ctx.lineWidth = 1;

    const step = 28;
    for (let x = 0; x < canvas.width; x += step) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
      ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += step) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
      ctx.stroke();
    }

    // Crosshairs
    ctx.strokeStyle = 'rgba(0, 255, 102, 0.2)';
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.moveTo(0, canvas.height / 2);
    ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.stroke();
  }

  function render() {
    // Phosphor persistence decay (fading previous frames)
    ctx.fillStyle = 'rgba(1, 8, 4, 0.18)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawGrid();

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const ampX = 180;
    const ampY = 95;
    const deltaRad = (deltaDeg * Math.PI) / 180;

    // Draw full harmonic trace
    ctx.beginPath();
    ctx.strokeStyle = laserColor;
    ctx.lineWidth = 2.2;
    ctx.shadowBlur = 12;
    ctx.shadowColor = laserColor;

    const steps = 600;
    for (let i = 0; i <= steps; i++) {
      const t = (i / steps) * Math.PI * 2;
      const x = cx + ampX * Math.sin(fx * t + deltaRad);
      const y = cy + ampY * Math.sin(fy * t);
      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Draw active laser beam spot point
    const curX = cx + ampX * Math.sin(fx * beamT + deltaRad);
    const curY = cy + ampY * Math.sin(fy * beamT);

    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 16;
    ctx.shadowColor = '#ffffff';
    ctx.beginPath();
    ctx.arc(curX, curY, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    beamT += 0.05;

    if (isSweeping) {
      deltaDeg = (deltaDeg + 0.6) % 360;
      sDelta.value = Math.floor(deltaDeg);
      vDelta.textContent = `${Math.floor(deltaDeg)}°`;
    }

    requestAnimationFrame(render);
  }

  sFx.addEventListener('input', () => {
    fx = parseInt(sFx.value, 10);
    vFx.textContent = fx.toFixed(1);
    statusEl.textContent = `Galvanometer Frequency Ratio fx:fy = ${fx}:${fy}`;
  });

  sFy.addEventListener('input', () => {
    fy = parseInt(sFy.value, 10);
    vFy.textContent = fy.toFixed(1);
    statusEl.textContent = `Galvanometer Frequency Ratio fx:fy = ${fx}:${fy}`;
  });

  sDelta.addEventListener('input', () => {
    deltaDeg = parseFloat(sDelta.value);
    vDelta.textContent = `${Math.floor(deltaDeg)}°`;
  });

  document.querySelectorAll('.llo-ratio-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.llo-ratio-btn').forEach(b => {
        b.classList.remove('active');
        b.style.background = 'rgba(255,255,255,0.06)';
        b.style.borderColor = 'rgba(255,255,255,0.15)';
        b.style.color = '#fff';
      });
      btn.classList.add('active');
      btn.style.background = 'rgba(0,255,102,0.2)';
      btn.style.borderColor = '#00ff66';
      btn.style.color = '#00ff66';

      fx = parseInt(btn.dataset.fx, 10);
      fy = parseInt(btn.dataset.fy, 10);
      sFx.value = fx;
      sFy.value = fy;
      vFx.textContent = fx.toFixed(1);
      vFy.textContent = fy.toFixed(1);
      statusEl.textContent = `Galvanometer Frequency Ratio fx:fy = ${fx}:${fy}`;
    });
  });

  document.querySelectorAll('.llo-col-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.llo-col-btn').forEach(b => b.style.borderColor = 'transparent');
      btn.style.borderColor = '#fff';
      laserColor = btn.dataset.col;
    });
  });

  btnSweep.addEventListener('click', () => {
    isSweeping = !isSweeping;
    btnSweep.textContent = isSweeping ? '⏸ Pause Phase Sweep' : '▶ Continuous Phase Sweep';
  });

  requestAnimationFrame(render);
})();
</script>
