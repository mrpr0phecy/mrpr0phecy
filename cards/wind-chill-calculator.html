<h2 id="wchl-title" style="margin-top:0;color:var(--accent);">🌬️ Wind Chill Calculator</h2>

<form aria-describedby="wchl-desc" onsubmit="event.preventDefault();">
  <p id="wchl-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    NWS/JAG/TI wind-chill (2001): valid when air is ≤ 10 °C and wind ≥ 4.8 km/h. It estimates how cold exposed skin feels — not a frostbite timer, and not for indoor fans.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="wchl-t" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Air temperature °C</label>
      <input id="wchl-t" type="number" step="any" value="-5" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="wchl-v" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Wind km/h</label>
      <input id="wchl-v" type="number" min="0" step="any" value="30" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="wchl-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var tc = Number($('wchl-t').value), kmh = Number($('wchl-v').value);
    var tf = tc * 9 / 5 + 32, mph = kmh / 1.609344;
    var valid = tf <= 50 && mph >= 3;
    var wcF = 35.74 + 0.6215 * tf - 35.75 * Math.pow(mph, 0.16) + 0.4275 * tf * Math.pow(mph, 0.16);
    var wcC = (wcF - 32) * 5 / 9;
    var note = !valid ? 'Outside the official range — still shown as arithmetic only.' :
      wcC <= -27 ? 'Frostbite can become a risk on exposed skin in under 30 minutes in severe wind chill — seek shelter.' :
      'Cover skin. Wind chill is not the thermometer reading.';
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('wchl-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Wind chill', wcC.toFixed(1) + ' °C') +
      cell('In Fahrenheit', wcF.toFixed(0) + ' °F') +
      cell('Air (for ref)', tc.toFixed(1) + ' °C / ' + tf.toFixed(0) + ' °F') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">' + note + '</p>';
  }
  $('wchl-t').addEventListener('input', run);
  $('wchl-v').addEventListener('input', run);
  run();
})();
</script>
