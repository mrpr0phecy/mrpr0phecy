<h2 id="ctsl-title" style="margin-top:0;color:var(--accent);">⏳ Countdown Timer & Stopwatch with Laps</h2>

<form aria-describedby="ctsl-desc" onsubmit="event.preventDefault();">
  <p id="ctsl-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    A precise stopwatch with lap splits and a countdown timer with presets, keyboard shortcuts (Space = start/stop, L = lap, R = reset) and a gentle beep when the countdown finishes. Keeps accurate time even if the tab is in the background.
  </p>

  <div style="display:flex;gap:6px;margin-bottom:12px;" id="ctsl-tabs">
    <button type="button" data-ctsl-tab="sw" style="flex:1;padding:8px;border-radius:8px;background:rgba(45,212,255,0.2);border:1px solid rgba(45,212,255,0.5);color:var(--accent);font-size:0.85rem;cursor:pointer;">⏱ Stopwatch</button>
    <button type="button" data-ctsl-tab="cd" style="flex:1;padding:8px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.85rem;cursor:pointer;">⏳ Countdown</button>
  </div>

  <div id="ctsl-sw">
    <div id="ctsl-swdisp" aria-live="off" style="text-align:center;font-size:clamp(2.4rem,9vw,4rem);font-weight:800;color:var(--accent);font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;background:rgba(0,0,0,0.35);border:1px solid rgba(45,212,255,0.2);border-radius:14px;padding:18px 10px;margin-bottom:10px;">00:00.00</div>
    <div style="display:flex;gap:6px;margin-bottom:10px;">
      <button type="button" id="ctsl-swstart" style="flex:2;padding:12px;border-radius:10px;background:rgba(57,255,20,0.15);border:1px solid rgba(57,255,20,0.4);color:#39ff14;font-weight:800;font-size:1rem;cursor:pointer;">Start</button>
      <button type="button" id="ctsl-swlap" style="flex:1;padding:12px;border-radius:10px;background:rgba(45,212,255,0.12);border:1px solid rgba(45,212,255,0.35);color:var(--accent);font-weight:700;cursor:pointer;">Lap</button>
      <button type="button" id="ctsl-swreset" style="flex:1;padding:12px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-weight:700;cursor:pointer;">Reset</button>
    </div>
    <div id="ctsl-laps" style="display:grid;grid-template-columns:1fr;gap:4px;max-height:220px;overflow:auto;"></div>
    <div id="ctsl-lapstat" style="font-size:0.75rem;color:var(--text-secondary);margin-top:6px;text-align:center;"></div>
  </div>

  <div id="ctsl-cd" style="display:none;">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px;">
      <div><label for="ctsl-h" style="display:block;font-size:0.68rem;color:var(--text-secondary);text-transform:uppercase;text-align:center;">Hours</label><input id="ctsl-h" type="number" min="0" max="99" value="0" style="width:100%;padding:10px;text-align:center;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:1.2rem;font-family:ui-monospace,monospace;"></div>
      <div><label for="ctsl-m" style="display:block;font-size:0.68rem;color:var(--text-secondary);text-transform:uppercase;text-align:center;">Minutes</label><input id="ctsl-m" type="number" min="0" max="59" value="5" style="width:100%;padding:10px;text-align:center;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:1.2rem;font-family:ui-monospace,monospace;"></div>
      <div><label for="ctsl-s" style="display:block;font-size:0.68rem;color:var(--text-secondary);text-transform:uppercase;text-align:center;">Seconds</label><input id="ctsl-s" type="number" min="0" max="59" value="0" style="width:100%;padding:10px;text-align:center;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:1.2rem;font-family:ui-monospace,monospace;"></div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;">
      <button type="button" data-ctsl-pre="60" style="padding:5px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.75rem;cursor:pointer;">1 min</button>
      <button type="button" data-ctsl-pre="180" style="padding:5px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.75rem;cursor:pointer;">3 min</button>
      <button type="button" data-ctsl-pre="300" style="padding:5px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.75rem;cursor:pointer;">5 min</button>
      <button type="button" data-ctsl-pre="600" style="padding:5px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.75rem;cursor:pointer;">10 min</button>
      <button type="button" data-ctsl-pre="900" style="padding:5px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.75rem;cursor:pointer;">15 min</button>
      <button type="button" data-ctsl-pre="1500" style="padding:5px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.75rem;cursor:pointer;">25 min</button>
      <button type="button" data-ctsl-pre="3600" style="padding:5px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.75rem;cursor:pointer;">1 hour</button>
      <button type="button" data-ctsl-pre="420" style="padding:5px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.75rem;cursor:pointer;">🥚 Soft egg 7m</button>
    </div>
    <div id="ctsl-cddisp" aria-live="off" style="text-align:center;font-size:clamp(2.4rem,9vw,4rem);font-weight:800;color:var(--accent);font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;background:rgba(0,0,0,0.35);border:1px solid rgba(45,212,255,0.2);border-radius:14px;padding:18px 10px;margin-bottom:6px;">05:00</div>
    <div style="height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;margin-bottom:10px;"><div id="ctsl-bar" style="height:100%;width:100%;background:linear-gradient(90deg,#2dd4ff,#39ff14);transition:width 0.25s linear;"></div></div>
    <div style="display:flex;gap:6px;margin-bottom:8px;">
      <button type="button" id="ctsl-cdstart" style="flex:2;padding:12px;border-radius:10px;background:rgba(57,255,20,0.15);border:1px solid rgba(57,255,20,0.4);color:#39ff14;font-weight:800;font-size:1rem;cursor:pointer;">Start</button>
      <button type="button" id="ctsl-cdreset" style="flex:1;padding:12px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-weight:700;cursor:pointer;">Reset</button>
    </div>
    <label style="font-size:0.78rem;color:var(--text);display:flex;gap:5px;align-items:center;"><input type="checkbox" id="ctsl-beep" checked> Beep when finished</label>
    <div id="ctsl-done" aria-live="assertive" style="text-align:center;font-weight:800;color:#39ff14;margin-top:8px;min-height:1.2em;"></div>
  </div>
</form>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var pad=function(n,l){ n=String(n); while(n.length<(l||2)) n='0'+n; return n; };
  function fmtSw(ms){ var cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000)%60, m=Math.floor(ms/60000)%60, h=Math.floor(ms/3600000); return (h?pad(h)+':':'')+pad(m)+':'+pad(s)+'.'+pad(cs); }
  function fmtCd(ms){ ms=Math.max(0,Math.ceil(ms/1000)*1000); var s=Math.floor(ms/1000)%60, m=Math.floor(ms/60000)%60, h=Math.floor(ms/3600000); return (h?pad(h)+':':'')+pad(m)+':'+pad(s); }
  var tab='sw';
  $('ctsl-tabs').addEventListener('click',function(e){ var b=e.target.closest('[data-ctsl-tab]'); if(!b) return; tab=b.getAttribute('data-ctsl-tab'); $('ctsl-sw').style.display=tab==='sw'?'':'none'; $('ctsl-cd').style.display=tab==='cd'?'':'none';
    Array.prototype.forEach.call(this.querySelectorAll('button'),function(x){ var on=x===b; x.style.background=on?'rgba(45,212,255,0.2)':'rgba(255,255,255,0.06)'; x.style.borderColor=on?'rgba(45,212,255,0.5)':'rgba(255,255,255,0.15)'; x.style.color=on?'var(--accent)':'var(--text)'; }); });

  // stopwatch
  var swRun=false, swStart=0, swAcc=0, swRaf=null, laps=[];
  function swNow(){ return swAcc+(swRun?performance.now()-swStart:0); }
  function swTick(){ $('ctsl-swdisp').textContent=fmtSw(swNow()); if(swRun) swRaf=requestAnimationFrame(swTick); }
  function swToggle(){ if(swRun){ swAcc+=performance.now()-swStart; swRun=false; cancelAnimationFrame(swRaf); $('ctsl-swstart').textContent='Resume'; $('ctsl-swstart').style.color='#39ff14'; } else { swStart=performance.now(); swRun=true; $('ctsl-swstart').textContent='Stop'; $('ctsl-swstart').style.color='#ff4081'; swTick(); } }
  function swLap(){ if(!swRun&&swNow()===0) return; var t=swNow(), prev=laps.length?laps[laps.length-1].t:0; laps.push({t:t,d:t-prev}); renderLaps(); }
  function renderLaps(){ if(!laps.length){ $('ctsl-laps').innerHTML=''; $('ctsl-lapstat').textContent=''; return; }
    var ds=laps.map(function(l){return l.d;}), best=Math.min.apply(null,ds), worst=Math.max.apply(null,ds);
    $('ctsl-laps').innerHTML=laps.slice().reverse().map(function(l,i){ var n=laps.length-i; var c= l.d===best&&laps.length>1?'#39ff14': l.d===worst&&laps.length>1?'#ff4081':'var(--text)'; return '<div style="display:flex;justify-content:space-between;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.06);border-radius:6px;padding:6px 10px;font-family:ui-monospace,monospace;font-size:0.85rem;"><span style="color:var(--text-secondary);">Lap '+n+'</span><span style="color:'+c+';">+'+fmtSw(l.d)+'</span><span style="color:var(--text-secondary);">'+fmtSw(l.t)+'</span></div>'; }).join('');
    var avg=ds.reduce(function(a,b){return a+b;},0)/ds.length; $('ctsl-lapstat').textContent='Best '+fmtSw(best)+' · Worst '+fmtSw(worst)+' · Average '+fmtSw(avg); }
  function swReset(){ swRun=false; cancelAnimationFrame(swRaf); swAcc=0; laps=[]; $('ctsl-swdisp').textContent='00:00.00'; $('ctsl-swstart').textContent='Start'; $('ctsl-swstart').style.color='#39ff14'; renderLaps(); }
  $('ctsl-swstart').addEventListener('click',swToggle); $('ctsl-swlap').addEventListener('click',swLap); $('ctsl-swreset').addEventListener('click',swReset);

  // countdown
  var cdRun=false, cdEnd=0, cdLeft=300000, cdTotal=300000, cdIv=null;
  function cdSet(){ var h=+$('ctsl-h').value||0, m=+$('ctsl-m').value||0, s=+$('ctsl-s').value||0; cdTotal=cdLeft=(h*3600+m*60+s)*1000; $('ctsl-cddisp').textContent=fmtCd(cdLeft); $('ctsl-bar').style.width='100%'; $('ctsl-done').textContent=''; }
  function beep(){ if(!$('ctsl-beep').checked) return; try{ var AC=window.AudioContext||window.webkitAudioContext; var ctx=new AC(); var t=ctx.currentTime; for(var i=0;i<3;i++){ var o=ctx.createOscillator(), g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=880; g.gain.setValueAtTime(0.0001,t+i*0.35); g.gain.exponentialRampToValueAtTime(0.3,t+i*0.35+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.35+0.3); o.start(t+i*0.35); o.stop(t+i*0.35+0.32); } setTimeout(function(){ ctx.close&&ctx.close(); },1500); }catch(e){} }
  function cdTick(){ cdLeft=cdEnd-Date.now(); if(cdLeft<=0){ cdLeft=0; cdRun=false; clearInterval(cdIv); $('ctsl-cdstart').textContent='Start'; $('ctsl-cdstart').style.color='#39ff14'; $('ctsl-done').textContent='⏰ Time\'s up!'; document.title='⏰ Time\'s up!'; beep(); }
    $('ctsl-cddisp').textContent=fmtCd(cdLeft); $('ctsl-bar').style.width=(cdTotal?cdLeft/cdTotal*100:0)+'%'; if(cdRun) document.title=fmtCd(cdLeft)+' ⏳'; }
  function cdToggle(){ if(cdRun){ cdRun=false; clearInterval(cdIv); cdLeft=cdEnd-Date.now(); $('ctsl-cdstart').textContent='Resume'; $('ctsl-cdstart').style.color='#39ff14'; }
    else { if(cdLeft<=0) cdSet(); if(cdLeft<=0) return; cdEnd=Date.now()+cdLeft; cdRun=true; $('ctsl-cdstart').textContent='Pause'; $('ctsl-cdstart').style.color='#ffa500'; $('ctsl-done').textContent=''; cdIv=setInterval(cdTick,200); cdTick(); } }
  function cdReset(){ cdRun=false; clearInterval(cdIv); cdSet(); $('ctsl-cdstart').textContent='Start'; $('ctsl-cdstart').style.color='#39ff14'; }
  ['ctsl-h','ctsl-m','ctsl-s'].forEach(function(id){ $(id).addEventListener('input',function(){ if(!cdRun) cdSet(); }); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-ctsl-pre]'),function(b){ b.addEventListener('click',function(){ var s=+b.getAttribute('data-ctsl-pre'); $('ctsl-h').value=Math.floor(s/3600); $('ctsl-m').value=Math.floor(s%3600/60); $('ctsl-s').value=s%60; cdReset(); }); });
  $('ctsl-cdstart').addEventListener('click',cdToggle); $('ctsl-cdreset').addEventListener('click',cdReset);
  cdSet();

  document.addEventListener('keydown',function(e){ if(!document.body.contains($('ctsl-title'))) return; var t=e.target.tagName; if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT') return; var vis=$('ctsl-title').offsetParent!==null; if(!vis) return;
    if(e.code==='Space'){ e.preventDefault(); tab==='sw'?swToggle():cdToggle(); } else if(e.key==='l'||e.key==='L'){ if(tab==='sw') swLap(); } else if(e.key==='r'||e.key==='R'){ tab==='sw'?swReset():cdReset(); } });
})();
</script>
