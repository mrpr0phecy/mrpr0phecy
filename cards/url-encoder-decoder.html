<h2>🔗 URL Encoder / Decoder</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Encode text to URL-safe format or decode URL-encoded strings. Handles special characters, Unicode, and query parameters.</p>

<div id="ue-app" style="max-width:600px;margin:0 auto;">
  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <button onclick="window._ueMode('encode')" id="ue-enc-btn" style="flex:1;padding:10px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:#2dd4ff;cursor:pointer;font-weight:600;">Encode</button>
    <button onclick="window._ueMode('decode')" id="ue-dec-btn" style="flex:1;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(230,250,255,0.6);cursor:pointer;">Decode</button>
  </div>

  <div style="margin-bottom:12px;">
    <label style="display:block;margin-bottom:6px;color:#2dd4ff;font-size:13px;">Input</label>
    <textarea id="ue-input" style="width:100%;height:100px;padding:12px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-family:monospace;font-size:14px;resize:vertical;box-sizing:border-box;" placeholder="Enter text or URL to encode...">https://example.com/search?q=hello world&lang=en</textarea>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <button onclick="window._ueConvert()" style="flex:1;padding:10px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.3);border-radius:8px;color:#39ff14;cursor:pointer;font-weight:600;">Convert</button>
    <button onclick="window._ueSwap()" style="padding:10px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.3);border-radius:8px;color:#ffa500;cursor:pointer;">⇄ Swap</button>
    <button onclick="window._ueClear()" style="padding:10px;background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.3);border-radius:8px;color:#ff4d4d;cursor:pointer;">Clear</button>
  </div>

  <div style="margin-bottom:12px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <label style="color:#2dd4ff;font-size:13px;">Output</label>
      <button onclick="window._ueCopy()" style="padding:4px 10px;background:rgba(45,212,255,0.1);border:1px solid rgba(45,212,255,0.2);border-radius:4px;color:#2dd4ff;cursor:pointer;font-size:12px;">📋 Copy</button>
    </div>
    <textarea id="ue-output" readonly style="width:100%;height:100px;padding:12px;border-radius:8px;border:1px solid rgba(45,212,255,0.1);background:rgba(0,0,0,0.2);color:#39ff14;font-family:monospace;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>
  </div>

  <div id="ue-info" style="font-size:12px;color:rgba(230,250,255,0.4);padding:8px;background:rgba(0,0,0,0.2);border-radius:6px;"></div>
</div>

<script>
(function(){
  var mode='encode';
  function setMode(m){
    mode=m;
    document.getElementById('ue-enc-btn').style.cssText=m==='encode'?'flex:1;padding:10px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:#2dd4ff;cursor:pointer;font-weight:600;':'flex:1;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(230,250,255,0.6);cursor:pointer;';
    document.getElementById('ue-dec-btn').style.cssText=m==='decode'?'flex:1;padding:10px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:#2dd4ff;cursor:pointer;font-weight:600;':'flex:1;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(230,250,255,0.6);cursor:pointer;';
  }
  function convert(){
    var input=document.getElementById('ue-input').value;
    var output='',info='';
    try{
      if(mode==='encode'){
        output=encodeURIComponent(input);
        var origLen=input.length,encLen=output.length;
        info='Original: '+origLen+' chars → Encoded: '+encLen+' chars'+(encLen>origLen?' ('+Math.round((encLen/origLen-1)*100)+'% longer)':'');
      }else{
        output=decodeURIComponent(input);
        info='Decoded successfully. '+output.length+' characters.';
      }
    }catch(e){
      output='Error: '+e.message;
      info='⚠️ Invalid input for '+mode;
    }
    document.getElementById('ue-output').value=output;
    document.getElementById('ue-info').innerHTML=info;
  }
  function swap(){
    var inp=document.getElementById('ue-input');
    var out=document.getElementById('ue-output');
    var tmp=inp.value;inp.value=out.value;out.value=tmp;
    setMode(mode==='encode'?'decode':'encode');
  }
  function clear(){document.getElementById('ue-input').value='';document.getElementById('ue-output').value='';document.getElementById('ue-info').innerHTML='';}
  function copy(){
    var out=document.getElementById('ue-output');
    out.select();document.execCommand('copy');
    var btn=event.target;var orig=btn.textContent;btn.textContent='✓ Copied!';setTimeout(function(){btn.textContent=orig;},1500);
  }
  window._ueMode=setMode;window._ueConvert=convert;window._ueSwap=swap;window._ueClear=clear;window._ueCopy=copy;
  document.getElementById('ue-input').addEventListener('input',convert);
  convert();
})();
</script>
