<h2 id="hdi-title" style="margin-top:0;color:var(--accent);">⚠️ Herb &amp; Prescription Safety</h2>

<form aria-describedby="hdi-desc" onsubmit="event.preventDefault();">
  <p id="hdi-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Clinical botanical pharmacodynamics checker. Cross-references herbal compounds against prescription drug classes to prevent CYP450 enzyme conflicts and adverse events.
  </p>

  <!-- Herb & Drug Selectors -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
    <div>
      <label for="hdi-herb" style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:4px;color:var(--text);">Botanical Remedy</label>
      <select id="hdi-herb" style="width:100%;padding:8px;background:rgba(20,30,40,0.8);border:1px solid rgba(45,212,255,0.3);color:var(--text);border-radius:6px;font-size:0.82rem;">
        <option value="sjw" selected>St. John's Wort (Hypericum)</option>
        <option value="ginkgo">Ginkgo Biloba (Leaf Extract)</option>
        <option value="licorice">Licorice Root (Glycyrrhizin)</option>
        <option value="ashwagandha">Ashwagandha (Withania somnifera)</option>
        <option value="garlic">Garlic (High-Dose Allicin / Aged)</option>
        <option value="berberine">Berberine / Goldenseal</option>
        <option value="valerian">Valerian Root / Kava Kava</option>
      </select>
    </div>
    <div>
      <label for="hdi-drug" style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:4px;color:var(--text);">Prescription Drug Class</label>
      <select id="hdi-drug" style="width:100%;padding:8px;background:rgba(20,30,40,0.8);border:1px solid rgba(45,212,255,0.3);color:var(--text);border-radius:6px;font-size:0.82rem;">
        <option value="ssri" selected>SSRIs / Antidepressants (Sertraline, Fluoxetine)</option>
        <option value="thinner">Anticoagulants / Thinners (Warfarin, Eliquis, Aspirin)</option>
        <option value="bp">Antihypertensives / Blood Pressure Medications</option>
        <option value="bc">Oral Contraceptives / Birth Control Pills</option>
        <option value="sedative">Sedatives / Benzodiazepines / Sleep Meds</option>
        <option value="diabetes">Hypoglycemics / Metformin / Insulin</option>
      </select>
    </div>
  </div>

  <!-- Safety Status Banner -->
  <div id="hdi-status-banner" style="border-radius:8px;padding:12px;margin-bottom:12px;text-align:center;">
    <!-- Injected dynamically -->
  </div>

  <!-- Pharmacological Mechanism Analysis Box -->
  <div style="background:#091018;border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:12px;margin-bottom:12px;">
    <div style="font-size:0.75rem;font-weight:700;color:var(--accent);margin-bottom:6px;text-transform:uppercase;">
      🔬 Pharmacological Mechanism &amp; CYP Profile:
    </div>
    <div id="hdi-mech-text" style="font-size:0.78rem;color:var(--text-secondary);line-height:1.45;">
      <!-- Injected dynamically -->
    </div>
  </div>

  <!-- Actionable Recommendation -->
  <div id="hdi-action-box" style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:10px 12px;font-size:0.75rem;color:var(--text-secondary);line-height:1.4;">
    <!-- Injected dynamically -->
  </div>
</form>

<script>
(function initHerbDrugSafety() {
  const herbEl = document.getElementById('hdi-herb');
  const drugEl = document.getElementById('hdi-drug');
  const bannerEl = document.getElementById('hdi-status-banner');
  const mechText = document.getElementById('hdi-mech-text');
  const actionBox = document.getElementById('hdi-action-box');

  if (!herbEl || !drugEl) return;

  function evaluate() {
    const herb = herbEl.value;
    const drug = drugEl.value;

    let level = 'safe'; // 'danger', 'caution', 'safe'
    let title = 'Generally Low Interaction Risk';
    let mech = 'No severe pharmacokinetic or CYP450 enzyme conflict documented at standard dietary dosages. Monitor for individual tolerance.';
    let action = 'Can generally be used concurrently, but always consult your prescribing physician before starting new high-potency extracts.';

    // Check high-risk interactions
    if (herb === 'sjw') {
      if (drug === 'ssri') {
        level = 'danger';
        title = '🚨 SEVERE CONTRAINDICATION: Serotonin Syndrome';
        mech = 'Hyperforin and hypericin in St. John\'s Wort inhibit reuptake of serotonin, dopamine, and norepinephrine. Co-administration with SSRIs/SNRIs can trigger life-threatening Serotonin Syndrome (hyperthermia, autonomic instability, seizures).';
        action = '<strong>Action:</strong> Never take St. John\'s Wort alongside prescription antidepressants. Requires medical taper under clinical supervision.';
      } else if (drug === 'bc') {
        level = 'danger';
        title = '🚨 SEVERE HAZARD: Contraceptive Failure';
        mech = 'St. John\'s Wort is a potent inducer of hepatic CYP3A4 and intestinal P-glycoprotein. It rapidly accelerates the metabolic clearance of estrogen and progestins, leading to unplanned pregnancy.';
        action = '<strong>Action:</strong> Discontinue St. John\'s Wort immediately or utilize non-hormonal barrier contraception.';
      } else {
        level = 'caution';
        title = '⚠️ HIGH CAUTION: CYP3A4 Enzyme Inducer';
        mech = 'St. John\'s Wort significantly lowers blood plasma levels of numerous medications metabolized by CYP3A4 and P-gp, including statins, immunosuppressants, and cardiac drugs.';
        action = '<strong>Action:</strong> Avoid St. John\'s Wort with any narrow therapeutic index medication.';
      }
    } else if (herb === 'ginkgo') {
      if (drug === 'thinner') {
        level = 'danger';
        title = '🚨 SEVERE WARNING: Hemorrhage / Bleeding Risk';
        mech = 'Ginkgolide B is a potent antagonist of Platelet-Activating Factor (PAF). Combined with anticoagulants (Warfarin, Eliquis) or antiplatelets (Aspirin), it synergistically impairs clotting, causing spontaneous bruising and cranial bleeding.';
        action = '<strong>Action:</strong> Cease Ginkgo Biloba use at least 2 weeks prior to any surgery or if taking prescription blood thinners.';
      } else {
        level = 'caution';
        title = '⚠️ Moderate Caution: Mild Antiplatelet Effects';
        mech = 'May mildly increase bleeding tendencies. Avoid combining with high-dose NSAIDs (Ibuprofen).';
        action = '<strong>Action:</strong> Keep dosage to standard recommended levels (120mg-240mg daily).';
      }
    } else if (herb === 'licorice') {
      if (drug === 'bp') {
        level = 'danger';
        title = '🚨 SEVERE CONFLICT: Rebound Hypertension';
        mech = 'Glycyrrhizin inhibits 11-beta-hydroxysteroid dehydrogenase type 2 (11-beta-HSD2). This allows cortisol to bind mineralocorticoid receptors, causing sodium/water retention, severe hypokalemia (potassium drop), and elevated blood pressure.';
        action = '<strong>Action:</strong> Use only Deglycyrrhizinated Licorice (DGL) for ulcers/reflux if taking blood pressure or cardiac medications.';
      } else {
        level = 'caution';
        title = '⚠️ Caution with Long-Term High Dosing';
        mech = 'Continuous high-dose consumption (>4 weeks) of natural whole licorice root can disrupt electrolyte homeostasis.';
        action = '<strong>Action:</strong> Cycle usage or switch to DGL extracts.';
      }
    } else if (herb === 'garlic' && drug === 'thinner') {
      level = 'caution';
      title = '⚠️ Moderate Caution: Additive Antiplatelet Action';
      mech = 'Ajoene and allicin in therapeutic garlic extracts inhibit platelet aggregation and thromboxane synthesis, mildly potentiating pharmaceutical anticoagulants.';
      action = '<strong>Action:</strong> Culinary garlic is completely safe; avoid high-dose concentrated garlic capsules (over 1000mg) alongside Warfarin/Aspirin.';
    } else if (herb === 'berberine' && drug === 'diabetes') {
      level = 'caution';
      title = '⚠️ Moderate Caution: Synergistic Hypoglycemia';
      mech = 'Berberine activates AMPK (similar to Metformin) and improves insulin sensitivity. Combined with insulin or sulfonylureas, it can cause blood sugar to plummet too low.';
      action = '<strong>Action:</strong> Frequently monitor blood glucose levels; medication dose reduction may be required by doctor.';
    } else if (herb === 'valerian' && drug === 'sedative') {
      level = 'danger';
      title = '🚨 SEVERE CAUTION: Synergistic CNS Depression';
      mech = 'Valerenic acid acts on GABA-A receptors and inhibits GABA degradation. When combined with benzodiazepines or Z-drugs, it creates profound sedation, impaired motor reflexes, and respiratory depression.';
      action = '<strong>Action:</strong> Do not combine potent botanical sedatives with pharmaceutical sleep aids or anxiolytics.';
    } else if (herb === 'ashwagandha' && drug === 'sedative') {
      level = 'caution';
      title = '⚠️ Caution: Mild Additive Sedation';
      mech = 'Withanolides display mild GABA-mimetic activity, slightly increasing drowsiness when combined with central nervous system depressants.';
      action = '<strong>Action:</strong> Space intake 4 to 6 hours away from sedatives and avoid driving if drowsy.';
    }

    // Render Banner
    if (level === 'danger') {
      bannerEl.style.background = 'rgba(255,51,102,0.12)';
      bannerEl.style.border = '1px solid #ff3366';
      bannerEl.style.color = '#ff85a2';
    } else if (level === 'caution') {
      bannerEl.style.background = 'rgba(255,215,0,0.12)';
      bannerEl.style.border = '1px solid #ffd700';
      bannerEl.style.color = '#ffd700';
    } else {
      bannerEl.style.background = 'rgba(57,255,20,0.1)';
      bannerEl.style.border = '1px solid #39ff14';
      bannerEl.style.color = '#39ff14';
    }

    bannerEl.innerHTML = `<div style="font-weight:800;font-size:0.95rem;">${title}</div>`;
    mechText.innerHTML = mech;
    actionBox.innerHTML = action;
  }

  herbEl.addEventListener('change', evaluate);
  drugEl.addEventListener('change', evaluate);
  evaluate();
})();
</script>
