<h2 id="dlsp-title" style="margin-top:0;color:var(--accent);">💡 Downlight Spacing Calculator</h2>

<form aria-describedby="dlsp-desc" onsubmit="event.preventDefault();">
  <p id="dlsp-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    A common rule is spacing ≈ 0.5–0.75 × ceiling height, with the first lamp about half that from the wall. Check beam angle and joists — this is a layout sketch, not a lighting design.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="dlsp-l" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Room length m</label>
      <input id="dlsp-l" type="number" min="0.5" step="any" value="4.8" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="dlsp-w" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Room width m</label>
      <input id="dlsp-w" type="number" min="0.5" step="any" value="3.6" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="dlsp-h" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Ceiling height m</label>
      <input id="dlsp-h" type="number" min="2" step="any" value="2.4" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="dlsp-f" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Spacing factor × height</label>
      <input id="dlsp-f" type="number" min="0.4" max="1" step="0.05" value="0.6" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="dlsp-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function count(length, spacing) {
    var n = Math.max(1, Math.round(length / spacing));
    var gap = length / n;
    var edge = gap / 2;
    return { n: n, gap: gap, edge: edge };
  }
  function run() {
    var L = Number($('dlsp-l').value), W = Number($('dlsp-w').value), H = Number($('dlsp-h').value), f = Number($('dlsp-f').value);
    if (!(L > 0) || !(W > 0) || !(H > 0) || !(f > 0)) {
      $('dlsp-out').textContent = 'Enter room size and a spacing factor.';
      return;
    }
    var s = H * f;
    var x = count(L, s), y = count(W, s);
    var total = x.n * y.n;
    $('dlsp-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Target spacing', s.toFixed(2) + ' m') +
      cell('Grid', x.n + ' × ' + y.n) +
      cell('Downlights', String(total)) +
      cell('Along length', x.gap.toFixed(2) + ' m centres, ' + x.edge.toFixed(2) + ' m from wall') +
      cell('Along width', y.gap.toFixed(2) + ' m centres, ' + y.edge.toFixed(2) + ' m from wall') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Keep fire-rated cans in a fire-rated ceiling. Watch insulation clearance (or use IC-rated fittings) and don’t cut joists. Kitchen task areas often need a tighter grid than a hallway.</p>';
  }
  ['dlsp-l', 'dlsp-w', 'dlsp-h', 'dlsp-f'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
