<h2 id="grcc-title" style="margin-top:0;color:var(--accent);">φ Golden Ratio Crop Calculator</h2>

<form aria-describedby="grcc-desc" onsubmit="event.preventDefault();">
  <p id="grcc-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Grow or crop a rectangle to φ ≈ 1.618, place a golden-section grid, and convert any length into its complementary pair. Used by photographers and layout designers. Pure geometry — no image upload.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="grcc-w" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Width</label>
      <input id="grcc-w" type="number" min="1" step="any" value="1920" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="grcc-h" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Height</label>
      <input id="grcc-h" type="number" min="1" step="any" value="1080" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="grcc-len" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Any length → pair</label>
      <input id="grcc-len" type="number" min="0" step="any" value="100" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="grcc-out" style="margin-top:14px;"></div>
<div style="margin-top:12px;position:relative;width:100%;max-width:360px;aspect-ratio:1.618;border:1px solid rgba(45,212,255,.4);border-radius:8px;overflow:hidden;background:#071019;">
  <div style="position:absolute;inset:0;border-right:1px dashed rgba(45,212,255,.45);width:61.8%;"></div>
  <div style="position:absolute;inset:0;border-bottom:1px dashed rgba(45,212,255,.45);height:61.8%;"></div>
  <div style="position:absolute;left:61.8%;top:0;bottom:0;width:1px;background:rgba(255,215,0,.7);"></div>
  <div style="position:absolute;top:61.8%;left:0;right:0;height:1px;background:rgba(255,215,0,.7);"></div>
</div>
<p style="margin:8px 0 0;font-size:.72rem;color:var(--text-secondary);">Golden-section grid (φ split at 61.8%).</p>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var PHI = (1 + Math.sqrt(5)) / 2;

  function run() {
    var w = Number($('grcc-w').value), h = Number($('grcc-h').value), L = Number($('grcc-len').value);
    if (!(w > 0 && h > 0)) return;
    var ratio = w / h;
    var cropW = h * PHI, cropH = w / PHI;
    var growW = h * PHI, growH = w / PHI;
    var longerIsW = w >= h;
    var crop = longerIsW ? [h * PHI, h] : [w, w * PHI];
    if (longerIsW && crop[0] > w) crop = [w, w / PHI];
    if (!longerIsW && crop[1] > h) crop = [h / PHI, h];
    var grow = longerIsW ? [w, w / PHI] : [h * PHI, h];
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('grcc-out').innerHTML =
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Current ratio', ratio.toFixed(4) + '  (' + (ratio > PHI ? 'wider than φ' : ratio < PHI ? 'taller than φ' : 'exactly φ') + ')') +
      cell('Crop to φ', crop[0].toFixed(1) + ' × ' + crop[1].toFixed(1)) +
      cell('Grow to φ', grow[0].toFixed(1) + ' × ' + grow[1].toFixed(1)) +
      cell('Complement of ' + L, isFinite(L) ? (L / PHI).toFixed(2) + '  and  ' + (L * PHI).toFixed(2) : '—') +
      '</div>';
  }
  ['grcc-w', 'grcc-h', 'grcc-len'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
