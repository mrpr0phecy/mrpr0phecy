<h2>🔢 The Constants of Reality</h2>
<p class="description">The universe is governed by a handful of numbers. Change any one of them slightly — and atoms, stars, chemistry, and life cannot exist. Why these numbers?</p>
<div id="const-app" style="max-width:560px;margin:0 auto;"></div>
<script>
(function(){
'use strict';
var constants=[
  {name:'Speed of Light',symbol:'c',value:'299,792,458 m/s',desc:'The cosmic speed limit. Nothing with mass can reach it. Massless particles (photons) travel at exactly this speed — always, in every reference frame. Time and space warp to keep it constant.',effect:'If faster: causality breaks. If slower: atoms collapse.',color:'#ff4400'},
  {name:'Gravitational Constant',symbol:'G',value:'6.674 × 10⁻¹¹',desc:'Determines how strongly mass attracts mass. It is 10³⁶ times weaker than electromagnetism — yet it shapes the entire large-scale structure of the cosmos: galaxies, stars, black holes.',effect:'If stronger: stars burn out in years. If weaker: no stars form.',color:'#ff8800'},
  {name:'Planck\'s Constant',symbol:'ℏ',value:'1.055 × 10⁻³⁴ J·s',desc:'The quantum of action. Below this scale, reality becomes probabilistic. Energy comes in discrete packets — quanta. This constant sets the grain size of the universe.',effect:'If larger: quantum effects dominate daily life. If smaller: no quantum mechanics, no chemistry.',color:'#4488ff'},
  {name:'Boltzmann Constant',symbol:'k_B',value:'1.381 × 10⁻²³ J/K',desc:'Connects temperature to energy. Defines what "hot" and "cold" mean at the atomic level. Entropy is measured in units of this constant.',effect:'If different: all thermodynamics changes. Stars, chemistry, life — everything.',color:'#ff44ff'},
  {name:'Elementary Charge',symbol:'e',value:'1.602 × 10⁻¹⁹ C',desc:'The charge of a single proton. All of chemistry, all of electricity, all of light — everything electromagnetic — comes from multiples of this one number.',effect:'If stronger: atoms are smaller, chemistry changes. If weaker: atoms fall apart.',color:'#39ff14'},
  {name:'Fine-Structure Constant',symbol:'α',value:'1/137.036',desc:'The most mysterious number in physics. Dimensionless — it has no units. It governs how strongly light interacts with matter. Feynman said: "All good theoretical physicists should write this number on the wall."',effect:'If 1/136: no stable atoms. If 1/138: no stable atoms. Only 1/137 works.',color:'#2dd4ff'},
  {name:'Electron Mass',symbol:'mₑ',value:'9.109 × 10⁻³¹ kg',desc:'The mass of the lightest charged particle. 1,836 times lighter than a proton. This ratio determines the size of atoms and the speed of chemical reactions.',effect:'If heavier: atoms are smaller, chemistry is slower. If lighter: no stable molecules.',color:'#8844ff'},
  {name:'Cosmological Constant',symbol:'Λ',value:'1.1056 × 10⁻⁵² m⁻²',desc:'The energy density of empty space itself. Einstein called it his "biggest blunder" — but it\'s real. It drives the accelerating expansion of the universe. It is the most finely-tuned number in all of physics.',effect:'If 10× larger: universe expands too fast for galaxies. If 10× smaller: universe collapses.',color:'#ff0066'}
];
var idx=5;
function init(){idx=5;render();}
function render(){
  var c=constants[idx];
  var h='<div style="text-align:center;margin-bottom:12px;">';
  h+='<div style="font-size:36px;font-weight:700;color:'+c.color+';font-family:serif;">'+c.symbol+'</div>';
  h+='<div style="font-size:16px;font-weight:700;color:#e6faff;margin-top:4px;">'+c.name+'</div>';
  h+='<div style="font-size:14px;color:'+c.color+';margin-top:2px;">'+c.value+'</div>';
  h+='</div>';
  h+='<div style="background:rgba(255,255,255,0.05);border-radius:8px;padding:14px;border:1px solid '+c.color+'40;margin-bottom:10px;font-size:13px;line-height:1.7;color:#e6faff;">'+c.desc+'</div>';
  h+='<div style="background:rgba(255,68,68,0.08);border-radius:8px;padding:10px;border:1px solid rgba(255,68,68,0.2);margin-bottom:14px;font-size:12px;color:#ff8888;">⚠️ '+c.effect+'</div>';
  h+='<input type="range" min="0" max="'+(constants.length-1)+'" value="'+idx+'" id="const-sl" style="width:100%;accent-color:'+c.color+';">';
  h+='<div style="display:flex;justify-content:space-between;font-size:10px;color:#666;margin-top:4px;">';
  for(var i=0;i<constants.length;i++)h+='<span style="color:'+(i===idx?constants[i].color:'#444')+';">'+constants[i].symbol+'</span>';
  h+='</div>';
  h+='<div style="margin-top:14px;font-size:13px;line-height:1.7;color:#e6faff;background:rgba(255,255,255,0.05);border-radius:8px;padding:12px;border:1px solid rgba(45,212,255,0.2);">';
  h+='<b>The Fine-Tuning Problem:</b> The constants appear exquisitely calibrated for complexity and life. Change any one by a fraction of a percent and the universe is sterile — no atoms, no stars, no chemistry, no observers. Why?';
  h+='<br><br>Three possibilities: (1) We are incredibly lucky. (2) There are many universes with different constants, and we find ourselves in one that permits us. (3) There is a deeper theory that explains why these values are necessary. We don\'t know which.';
  h+='</div>';
  document.getElementById('const-app').innerHTML=h;
  document.getElementById('const-sl').addEventListener('input',function(e){idx=parseInt(e.target.value);render();});
}
init();
})();
</script>
