<h2 id="knot-title" style="margin-top:0;color:var(--accent);">⛵ Knots ⇄ mph ⇄ km/h</h2>

<form aria-describedby="knot-desc" onsubmit="event.preventDefault();">
  <p id="knot-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    One knot is one nautical mile per hour. A nautical mile is exactly 1,852 m, so 1 kn = 1.852 km/h ≈ 1.15078 mph. Used by ships, aircraft and marine forecasts.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="knot-kn" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Knots</label>
      <input id="knot-kn" type="number" min="0" step="any" value="20" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="knot-mph" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">mph</label>
      <input id="knot-mph" type="number" min="0" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="knot-kph" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">km/h</label>
      <input id="knot-kph" type="number" min="0" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="knot-ms" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">m/s</label>
      <input id="knot-ms" type="number" min="0" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="knot-out" style="margin-top:14px;font-size:.82rem;color:var(--text-secondary);"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var KPH_PER_KN = 1.852, MPH_PER_KN = 1.852 / 1.609344;
  var lock = false;
  function apply(kn) {
    if (!(kn >= 0) || lock) return;
    var kph = kn * KPH_PER_KN, mph = kn * MPH_PER_KN, ms = kph / 3.6;
    lock = true;
    $('knot-kn').value = String(Number(kn.toFixed(3)));
    $('knot-kph').value = String(Number(kph.toFixed(3)));
    $('knot-mph').value = String(Number(mph.toFixed(3)));
    $('knot-ms').value = String(Number(ms.toFixed(3)));
    lock = false;
    $('knot-out').textContent = kn.toFixed(1) + ' kn  ·  ' + (kn * 1.852).toFixed(2) + ' km in one hour  ·  Beaufort is a force scale, not a unit here.';
  }
  $('knot-kn').addEventListener('input', function () { apply(Number($('knot-kn').value)); });
  $('knot-kph').addEventListener('input', function () { apply(Number($('knot-kph').value) / KPH_PER_KN); });
  $('knot-mph').addEventListener('input', function () { apply(Number($('knot-mph').value) / MPH_PER_KN); });
  $('knot-ms').addEventListener('input', function () { apply(Number($('knot-ms').value) * 3.6 / KPH_PER_KN); });
  apply(20);
})();
</script>
