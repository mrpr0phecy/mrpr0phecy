<!-- cards/mrprophecy-beat-memory.html -->
<h2 id="mpbm-title" style="margin-top:0;color:var(--accent);">🧠 MrProphecy: Beat Memory</h2>

<p id="mpbm-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
  Simon-style pad memory that grows by one step each round, scored over real MrProphecy tracks. Audio starts with the game.
</p>

<div id="mpbm-stage" style="background:linear-gradient(160deg,#0b0f1a,#121b2b);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:18px;">
  <div id="mpbm-idle">
    <div style="font-weight:900;color:var(--accent);margin-bottom:6px;">BEAT MEMORY</div>
    <p class="small" style="color:var(--text-secondary);margin-bottom:12px;">Watch the pad sequence, then repeat it. One extra step each round.</p>
    <button type="button" id="mpbm-start" style="background:var(--accent);color:#04141c;border:0;padding:11px 26px;border-radius:100px;font-weight:800;cursor:pointer;">&#9654; Start</button>
  </div>
  <div id="mpbm-play" style="display:none;">
    <div style="display:flex;justify-content:space-between;font-size:0.78rem;color:var(--text-secondary);margin-bottom:12px;">
      <span>Round <b id="mpbm-r" style="color:var(--text);">1</b></span>
      <span id="mpbm-msg" style="color:var(--accent);font-weight:700;">Watch</span>
      <span>Best <b id="mpbm-b" style="color:var(--premium);">0</b></span>
    </div>
    <div id="mpbm-pads" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:340px;margin:0 auto;"></div>
  </div>
</div>

  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);">
    <button type="button" id="mpbm-mute" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);padding:6px 12px;border-radius:100px;font-size:0.75rem;font-weight:700;cursor:pointer;">&#128266; Music on</button>
    <button type="button" id="mpbm-skip" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);padding:6px 12px;border-radius:100px;font-size:0.75rem;font-weight:700;cursor:pointer;">&#9197; Next track</button>
    <span id="mpbm-track" class="small" style="color:var(--text-secondary);font-size:0.75rem;"></span>
    <a href="https://www.youtube.com/@MrProphecy?sub_confirmation=1" target="_blank" rel="noopener noreferrer" style="margin-left:auto;font-size:0.72rem;color:var(--accent);text-decoration:none;font-weight:700;">Music by MrProphecy &#8599;</a>
  </div>

<script>
(function () {
  'use strict';

  /* ---- MrProphecy audio bed -------------------------------------------
     A hidden YouTube IFrame player. The API script is not even injected
     until the player first starts, so the card costs nothing until played
     and no third-party request is made on page load.                   */
  var mpbmTRACKS = [{"id": "IiHLS25VjgM", "n": "Innersoul"}, {"id": "4dcMWZsGICY", "n": "Inhabited"}, {"id": "D2O-ZVD5Ctg", "n": "Indigo"}, {"id": "d1NI6lX6tnk", "n": "Internal"}];
  var mpbmyt = null, mpbmytReady = false, mpbmpending = false, mpbmti = 0, mpbmmuted = false;

  function mpbmbootAudio() {
    if (mpbmyt || document.getElementById('mpbm-ytwrap')) return;
    var w = document.createElement('div');
    w.id = 'mpbm-ytwrap';
    w.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;overflow:hidden;';
    var d = document.createElement('div'); d.id = 'mpbm-ythost';
    w.appendChild(d); document.body.appendChild(w);

    function make() {
      mpbmyt = new YT.Player('mpbm-ythost', {
        host: 'https://www.youtube-nocookie.com',
        width: 1, height: 1,
        videoId: mpbmTRACKS[mpbmti].id,
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, playsinline: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: function (e) {
            mpbmytReady = true;
            e.target.setVolume(38);
            if (mpbmpending) { mpbmpending = false; e.target.playVideo(); }
            mpbmlabel();
          },
          onStateChange: function (e) { if (e.data === YT.PlayerState.ENDED) mpbmnextTrack(); },
          onError: function () { mpbmnextTrack(); }
        }
      });
    }
    if (window.YT && window.YT.Player) { make(); return; }
    var prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function () { if (typeof prev === 'function') prev(); make(); };
    if (!document.querySelector('script[src*="youtube.com/iframe_api"]')) {
      var sc = document.createElement('script');
      sc.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(sc);
    }
  }
  function mpbmlabel() {
    var el = document.getElementById('mpbm-track');
    if (el) el.textContent = mpbmmuted ? 'muted' : ('\u266a ' + mpbmTRACKS[mpbmti].n);
  }
  function mpbmmusicOn() {
    if (mpbmmuted) return;
    mpbmbootAudio();
    if (mpbmytReady && mpbmyt) mpbmyt.playVideo(); else mpbmpending = true;
  }
  function mpbmmusicOff() {
    mpbmpending = false;
    if (mpbmytReady && mpbmyt) try { mpbmyt.pauseVideo(); } catch (e) {}
  }
  function mpbmnextTrack() {
    mpbmti = (mpbmti + 1) % mpbmTRACKS.length;
    if (mpbmytReady && mpbmyt) { mpbmyt.loadVideoById(mpbmTRACKS[mpbmti].id); }
    mpbmlabel();
  }
  function mpbmtoggleMute() {
    mpbmmuted = !mpbmmuted;
    var b = document.getElementById('mpbm-mute');
    if (b) b.textContent = mpbmmuted ? '\ud83d\udd07 Music off' : '\ud83d\udd0a Music on';
    if (mpbmmuted) mpbmmusicOff(); else if (mpbmrunning) mpbmmusicOn();
    mpbmlabel();
  }


  var COLS = ['#2dd4ff','#ffc93c','#ff2e63','#39ff14'];
  var mpbmrunning=false, seq=[], step=0, round=0, best=0, showing=false;
  var idle=document.getElementById('mpbm-idle'), play=document.getElementById('mpbm-play');

  function buildPads() {
    var box = document.getElementById('mpbm-pads'); box.innerHTML='';
    for (var i=0;i<4;i++) (function(i){
      var b=document.createElement('button');
      b.type='button'; b.dataset.i=i;
      b.style.cssText='aspect-ratio:1;border-radius:14px;border:2px solid '+COLS[i]+';background:'+COLS[i]+'22;cursor:pointer;transition:background .12s,transform .08s;';
      b.addEventListener('click',function(){ tap(i); });
      box.appendChild(b);
    })(i);
  }
  function flash(i, ms) {
    var b = document.querySelector('#mpbm-pads button[data-i="'+i+'"]');
    if (!b) return;
    b.style.background = COLS[i]; b.style.transform = 'scale(.95)';
    setTimeout(function(){ b.style.background = COLS[i]+'22'; b.style.transform='scale(1)'; }, ms || 260);
  }
  function showSeq() {
    showing = true;
    document.getElementById('mpbm-msg').textContent = 'Watch';
    var i = 0;
    var iv = setInterval(function(){
      if (i >= seq.length) {
        clearInterval(iv); showing = false; step = 0;
        document.getElementById('mpbm-msg').textContent = 'Your turn';
        return;
      }
      flash(seq[i]); i++;
    }, 520);
  }
  function nextRound() {
    round++; document.getElementById('mpbm-r').textContent = round;
    seq.push(Math.floor(Math.random()*4));
    setTimeout(showSeq, 550);
  }
  function tap(i) {
    if (!mpbmrunning || showing) return;
    flash(i, 160);
    if (seq[step] === i) {
      step++;
      if (step >= seq.length) {
        best = Math.max(best, round);
        document.getElementById('mpbm-b').textContent = best;
        document.getElementById('mpbm-msg').textContent = 'Correct';
        setTimeout(nextRound, 700);
      }
    } else fail();
  }
  function fail() {
    mpbmrunning=false; mpbmmusicOff();
    play.style.display='none'; idle.style.display='';
    idle.innerHTML = '<div style="font-weight:900;color:var(--error);margin-bottom:6px;">MISSED THE BEAT</div>' +
      '<p class="small" style="color:var(--text-secondary);margin-bottom:12px;">Reached round ' + round + ' &middot; best ' + best + '</p>' +
      '<button type="button" id="mpbm-start" style="background:var(--accent);color:#04141c;border:0;padding:11px 26px;border-radius:100px;font-weight:800;cursor:pointer;">&#8635; Again</button>';
    idle.querySelector('#mpbm-start').addEventListener('click', start);
  }
  function start() {
    idle.style.display='none'; play.style.display='';
    mpbmrunning=true; seq=[]; step=0; round=0;
    buildPads(); mpbmmusicOn(); nextRound();
  }
  document.getElementById('mpbm-start').addEventListener('click', start);


  document.getElementById('mpbm-mute').addEventListener('click', mpbmtoggleMute);
  document.getElementById('mpbm-skip').addEventListener('click', function () {
    mpbmnextTrack();
    if (mpbmrunning && !mpbmmuted) mpbmmusicOn();
  });
  mpbmlabel();

})();
</script>
