<h2 id="schg-title" style="margin-top:0;color:var(--accent);">🇪🇺 Schengen 90/180 Calculator</h2>

<form aria-describedby="schg-desc" onsubmit="event.preventDefault();">
  <p id="schg-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Short-stay visitors can spend 90 days in any rolling 180-day window in the Schengen area (unless a visa or residence permit says otherwise). Add trips; days of entry and exit both count. Not immigration advice.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="schg-in" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Entry</label>
      <input id="schg-in" type="date" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="schg-out" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Exit</label>
      <input id="schg-out" type="date" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <button type="button" id="schg-add" style="padding:10px 14px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-weight:800;font-size:.84rem;">Add trip</button>
  </div>
</form>
<div id="schg-list" style="margin-top:12px;"></div>
<div id="schg-result" style="margin-top:10px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var trips = [];
  function parse(s) { return s ? new Date(s + 'T00:00:00') : null; }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000) + 1; }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function usedOn(anchor) {
    var windowStart = new Date(anchor); windowStart.setDate(windowStart.getDate() - 179);
    var n = 0;
    trips.forEach(function (t) {
      var a = t.in < windowStart ? windowStart : t.in;
      var b = t.out > anchor ? anchor : t.out;
      if (b >= a) n += daysBetween(a, b);
    });
    return n;
  }
  function paint() {
    $('schg-list').innerHTML = trips.length ? trips.map(function (t, i) {
      return '<div style="display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.04);margin-bottom:6px;font-size:.82rem;"><span>' + iso(t.in) + ' → ' + iso(t.out) + ' · ' + daysBetween(t.in, t.out) + ' days</span><button type="button" data-i="' + i + '" style="background:transparent;border:0;color:#ffb8b8;cursor:pointer;">remove</button></div>';
    }).join('') : '<p style="font-size:.8rem;color:var(--text-secondary);">No trips yet.</p>';
    host.querySelectorAll('[data-i]').forEach(function (btn) {
      btn.addEventListener('click', function () { trips.splice(Number(btn.getAttribute('data-i')), 1); paint(); });
    });
    if (!trips.length) { $('schg-result').innerHTML = ''; return; }
    var last = trips.reduce(function (m, t) { return t.out > m ? t.out : m; }, trips[0].out);
    var used = usedOn(last);
    var remain = Math.max(0, 90 - used);
    var over = used > 90;
    $('schg-result').innerHTML = '<div style="padding:12px;border-radius:10px;background:' + (over ? 'rgba(255,77,77,.1)' : 'rgba(45,212,255,.07)') + ';border:1px solid ' + (over ? 'rgba(255,77,77,.4)' : 'rgba(45,212,255,.25)') + ';"><div style="font-weight:800;color:' + (over ? '#ffb8b8' : 'var(--accent)') + ';font-size:1.05rem;">' + used + ' / 90 days used in the 180 days to ' + iso(last) + '</div><div style="font-size:.8rem;color:var(--text-secondary);margin-top:4px;">' + (over ? 'Over the short-stay cap on this model — get advice before you travel.' : remain + ' day' + (remain === 1 ? '' : 's') + ' remaining on this snapshot.') + '</div></div><p style="margin:8px 0 0;font-size:.75rem;color:var(--text-secondary);">Ireland is not Schengen. Bulgaria, Romania and Cyprus have joined or are joining — check the current EU list. The official calculator is on the EU Commission site if you need a second opinion.</p>';
  }
  $('schg-add').addEventListener('click', function () {
    var a = parse($('schg-in').value), b = parse($('schg-out').value);
    if (!a || !b || b < a) return;
    trips.push({ in: a, out: b });
    paint();
  });
  var t = new Date();
  $('schg-in').value = iso(t);
  var t2 = new Date(); t2.setDate(t2.getDate() + 6);
  $('schg-out').value = iso(t2);
  paint();
})();
</script>
