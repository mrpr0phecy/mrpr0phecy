<h2 id="vocab-title" style="margin-top:0;color:var(--accent);">📝 Word List Flashcards</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Build vocabulary with spaced repetition flashcards. Add words, quiz yourself, and track mastery.</p>

<div id="vf-app" style="max-width:600px;margin:0 auto;">
  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <input id="vf-word" type="text" placeholder="Word" style="flex:1;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    <input id="vf-def" type="text" placeholder="Definition" style="flex:2;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    <button onclick="window._vfAdd()" style="padding:10px 16px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:600;">Add</button>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
    <button onclick="window._vfQuiz()" style="padding:8px 14px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.3);border-radius:6px;color:#39ff14;cursor:pointer;font-size:13px;">🧠 Quiz Me</button>
    <button onclick="window._vfShuffle()" style="padding:8px 14px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.3);border-radius:6px;color:#ffa500;cursor:pointer;font-size:13px;">🔀 Shuffle</button>
    <button onclick="window._vfClear()" style="padding:8px 14px;background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.3);border-radius:6px;color:#ff4d4d;cursor:pointer;font-size:13px;">🗑 Clear All</button>
    <span id="vf-count" style="padding:8px;font-size:13px;color:rgba(230,250,255,0.5);">0 words</span>
  </div>

  <div id="vf-quiz" style="display:none;margin-bottom:16px;"></div>
  <div id="vf-list"></div>
</div>

<script>
(function(){
  var words=[];
  try{words=JSON.parse(localStorage.getItem('vf-words')||'[]');}catch(e){}
  var quizIdx=-1,showingAnswer=false;

  function save(){localStorage.setItem('vf-words',JSON.stringify(words));}
  function render(){
    var listEl=document.getElementById('vf-list');
    document.getElementById('vf-count').textContent=words.length+' word'+(words.length!==1?'s':'');
    if(!words.length){listEl.innerHTML='<div style="text-align:center;padding:40px;color:rgba(230,250,255,0.3);">Add words above to start building your vocabulary</div>';return;}
    var h='';
    words.forEach(function(w,i){
      var stars='';for(var s=0;s<w.level;s++)stars+='⭐';
      h+='<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.05);border-radius:8px;margin-bottom:6px;">'+
        '<div style="flex:1;"><strong style="color:var(--accent);">'+w.word+'</strong> <span style="color:rgba(230,250,255,0.6);font-size:13px;">— '+w.def+'</span></div>'+
        '<span style="font-size:11px;">'+stars+'</span>'+
        '<button onclick="window._vfRemove('+i+')" style="background:none;border:none;color:rgba(255,77,77,0.5);cursor:pointer;font-size:14px;">✕</button>'+
      '</div>';
    });
    listEl.innerHTML=h;
  }

  window._vfAdd=function(){
    var wEl=document.getElementById('vf-word'),dEl=document.getElementById('vf-def');
    var w=wEl.value.trim(),d=dEl.value.trim();
    if(!w||!d)return;
    words.push({word:w,def:d,level:0,next:Date.now()});
    save();render();wEl.value='';dEl.value='';wEl.focus();
  };
  window._vfRemove=function(i){words.splice(i,1);save();render();};
  window._vfClear=function(){if(confirm('Clear all words?')){words=[];save();render();document.getElementById('vf-quiz').style.display='none';}};
  window._vfShuffle=function(){for(var i=words.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=words[i];words[i]=words[j];words[j]=t;}render();};
  window._vfQuiz=function(){
    if(!words.length){alert('Add some words first!');return;}
    var quizEl=document.getElementById('vf-quiz');
    quizEl.style.display='block';
    quizIdx=Math.floor(Math.random()*words.length);
    showingAnswer=false;
    quizEl.innerHTML='<div style="background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);border-radius:10px;padding:20px;text-align:center;">'+
      '<div style="font-size:0.8em;color:rgba(230,250,255,0.5);margin-bottom:8px;">What does this word mean?</div>'+
      '<div style="font-size:1.8em;font-weight:700;color:var(--accent);margin-bottom:16px;">'+words[quizIdx].word+'</div>'+
      '<button onclick="window._vfShow()" style="padding:10px 24px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:600;">Show Answer</button>'+
    '</div>';
  };
  window._vfShow=function(){
    if(showingAnswer)return;showingAnswer=true;
    var quizEl=document.getElementById('vf-quiz');
    quizEl.innerHTML='<div style="background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);border-radius:10px;padding:20px;text-align:center;">'+
      '<div style="font-size:1.4em;font-weight:700;color:var(--accent);margin-bottom:4px;">'+words[quizIdx].word+'</div>'+
      '<div style="font-size:1.1em;color:var(--text);margin-bottom:16px;">'+words[quizIdx].def+'</div>'+
      '<div style="display:flex;gap:8px;justify-content:center;">'+
        '<button onclick="window._vfRate(0)" style="padding:8px 16px;background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.3);border-radius:6px;color:#ff4d4d;cursor:pointer;">😕 Again</button>'+
        '<button onclick="window._vfRate(1)" style="padding:8px 16px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.3);border-radius:6px;color:#ffa500;cursor:pointer;">🤔 Hard</button>'+
        '<button onclick="window._vfRate(2)" style="padding:8px 16px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.3);border-radius:6px;color:#39ff14;cursor:pointer;">😊 Easy</button>'+
      '</div>'+
    '</div>';
  };
  window._vfRate=function(r){
    if(r>=2)words[quizIdx].level=Math.min(5,words[quizIdx].level+1);
    else if(r===0)words[quizIdx].level=0;
    save();window._vfQuiz();
  };

  document.getElementById('vf-word').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('vf-def').focus();});
  document.getElementById('vf-def').addEventListener('keydown',function(e){if(e.key==='Enter')window._vfAdd();});
  render();
})();
</script>
