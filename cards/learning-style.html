<h2 id="learning-style-title" style="margin-top:0;color:var(--accent);">🧭 Learning Style Self-Assessment</h2>

<div class="ls-container" style="font-family:inherit;color:var(--text);">
  <p class="small" style="color:rgba(230,250,255,0.7);margin-bottom:16px;">
    Answer 8 quick questions to discover your preferred learning style: Visual, Auditory, Reading/Writing, or Kinaesthetic.
  </p>

  <div id="ls-questions" style="margin-bottom:16px;"></div>

  <button type="button" onclick="(function(b){var c=b.closest('.ls-container');var questions=[{q:'When learning something new, I prefer to:',o:['See diagrams, charts, or demonstrations','Listen to someone explain it','Read about it in a textbook or article','Try it hands-on right away']},{q:'When I need to remember directions, I:',o:['Visualise the route on a map','Repeat them aloud to myself','Write them down step by step','Walk through them in my mind physically']},{q:'In a lecture or meeting, I:',o:['Take notes with diagrams and arrows','Listen carefully and discuss afterwards','Write detailed written notes','Feel restless and want to get up and do it']},{q:'When studying for an exam, I:',o:['Create mind maps and visual summaries','Record notes and listen back','Rewrite notes and read textbooks','Use flashcards and move while reciting']},{q:'I learn best when the teacher:',o:['Uses slides, videos, and visual aids','Explains things verbally and discusses','Provides handouts and reading material','Sets up activities and experiments']},{q:'When solving a problem, I:',o:['Draw it out or sketch the solution','Talk through it with someone','Write down the steps logically','Use physical objects to model it']},{q:'My ideal study environment is:',o:['Bright, clean, visually organised','Quiet or with background discussion','Library with books and notes','Somewhere I can move around']},{q:'When I cannot figure something out, I:',o:['Look for a video or infographic','Ask someone to explain it','Search for a written guide','Try different approaches manually']}];var styles=['Visual','Auditory','Reading/Writing','Kinaesthetic'];var colors=['#2dd4ff','#39ff14','#ffa500','#ff4081'];var scores=[0,0,0,0];var div=c.querySelector('#ls-questions');div.innerHTML='';questions.forEach(function(q,qi){var block=document.createElement('div');block.style.cssText='margin-bottom:16px;padding:14px;background:rgba(0,0,0,0.2);border-radius:8px;border:1px solid rgba(255,255,255,0.05);';var title=document.createElement('div');title.textContent=(qi+1)+'. '+q.q;title.style.cssText='font-weight:600;margin-bottom:10px;font-size:14px;';block.appendChild(title);q.o.forEach(function(opt,oi){var label=document.createElement('label');label.style.cssText='display:block;padding:8px 12px;margin:4px 0;border-radius:6px;border:1px solid rgba(255,255,255,0.08);cursor:pointer;font-size:13px;transition:background 0.2s;';label.onclick=function(){var sib=block.querySelectorAll('label');for(var j=0;j<sib.length;j++)sib[j].style.background='rgba(255,255,255,0.03)';label.style.background='rgba(45,212,255,0.15)';block.dataset.answer=oi;};var radio=document.createElement('input');radio.type='radio';radio.name='ls_q'+qi;radio.style.marginRight='8px';label.appendChild(radio);label.appendChild(document.createTextNode(opt));block.appendChild(label);});div.appendChild(block);});var btn=document.createElement('button');btn.type='button';btn.textContent='See My Results';btn.style.cssText='padding:12px 24px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:600;font-size:14px;margin-top:8px;';btn.onclick=function(){var blocks=div.querySelectorAll('div[data-answer]');if(blocks.length<questions.length){var hint=c.querySelector('#ls-result');hint.innerHTML='<p style=color:#ff4d4d>Please answer all questions.</p>';return;}scores=[0,0,0,0];blocks.forEach(function(block){var ans=parseInt(block.dataset.answer);scores[ans]++;});var maxIdx=0;for(var i=1;i<4;i++){if(scores[i]>scores[maxIdx])maxIdx=i;}var result=c.querySelector('#ls-result');result.innerHTML='';var title=document.createElement('div');title.textContent='Your learning style: '+styles[maxIdx];title.style.cssText='font-size:1.6rem;font-weight:700;color:'+colors[maxIdx]+';margin-bottom:12px;';result.appendChild(title);scores.forEach(function(s,i){var row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:6px;';var label=document.createElement('span');label.textContent=styles[i];label.style.cssText='width:140px;font-size:13px;';var bar=document.createElement('div');bar.style.cssText='height:20px;border-radius:10px;background:'+colors[i]+';opacity:0.8;width:'+(s/questions.length*100)+'%;transition:width 0.5s;min-width:30px;';var count=document.createElement('span');count.textContent=s+'/'+questions.length;count.style.cssText='font-size:0.8rem;color:rgba(230,250,255,0.5);margin-left:8px;';row.appendChild(label);var track=document.createElement('div');track.style.cssText='flex:1;background:rgba(255,255,255,0.05);border-radius:10px;overflow:hidden;display:flex;align-items:center;';track.appendChild(bar);row.appendChild(track);row.appendChild(count);result.appendChild(row);});var tips={0:'Tip: Use colour-coded notes, diagrams, mind maps, and video tutorials.',1:'Tip: Record lectures, discuss topics aloud, use audio resources.',2:'Tip: Rewrite notes, read textbooks, use written summaries and lists.',3:'Tip: Use physical models, role-play, flashcards, and take movement breaks.'};var tip=document.createElement('p');tip.textContent=tips[maxIdx];tip.style.cssText='margin-top:12px;font-size:0.85rem;color:rgba(230,250,255,0.6);padding:10px;background:rgba(0,0,0,0.2);border-radius:8px;';result.appendChild(tip);};div.appendChild(btn);})(this)"
            style="padding:12px 24px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:600;font-size:14px;">📋 Start Assessment</button>

  <div id="ls-result" style="margin-top:16px;background:rgba(0,0,0,0.3);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,0.05);"></div>
</div>
