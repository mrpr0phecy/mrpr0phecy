<h2 id="ricw-title" style="margin-top:0;color:var(--accent);">🍚 Rice-to-Water Ratio Calculator</h2>

<form aria-describedby="ricw-desc" onsubmit="event.preventDefault();">
  <p id="ricw-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Absorption method volumes. Rinse until the water runs clearer; aged basmati wants a little more water; brown rice needs time, not only liquid. A rice cooker may want its own cup marks.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="ricw-type" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Rice</label>
      <select id="ricw-type" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="1.5">White long-grain 1 : 1.5</option>
        <option value="1.25">Jasmine 1 : 1.25</option>
        <option value="1.75" selected>Basmati 1 : 1.75</option>
        <option value="1.1">Sushi / short-grain 1 : 1.1</option>
        <option value="2.25">Brown 1 : 2.25</option>
        <option value="2.5">Wild blend 1 : 2.5</option>
      </select>
    </div>
    <div>
      <label for="ricw-cups" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Rice cups (US 240 ml)</label>
      <input id="ricw-cups" type="number" min="0.25" step="any" value="1.5" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ricw-people" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Or portions (75 g dry)</label>
      <input id="ricw-people" type="number" min="0" step="1" value="" placeholder="optional" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="ricw-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var ratio = Number($('ricw-type').value);
    var cups = Number($('ricw-cups').value);
    var people = $('ricw-people').value === '' ? null : Number($('ricw-people').value);
    if (people > 0) cups = (people * 75) / 185;
    if (!(cups > 0) || !(ratio > 0)) {
      $('ricw-out').textContent = 'Enter rice amount.';
      return;
    }
    var riceMl = cups * 240;
    var waterMl = riceMl * ratio;
    var riceG = cups * 185;
    $('ricw-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Dry rice', cups.toFixed(2) + ' cups / ' + Math.round(riceG) + ' g') +
      cell('Water', (waterMl / 240).toFixed(2) + ' cups / ' + Math.round(waterMl) + ' ml') +
      cell('Ratio', '1 : ' + ratio) +
      cell('Portions ~75 g', (riceG / 75).toFixed(1)) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Bring to a simmer, lid on, then rest 10 minutes off the heat. Brown rice often wants 35–45 minutes. Salt the water; oil is optional. Pilaf toasting in fat uses the same ratio after the toast.</p>';
  }
  ['ricw-type', 'ricw-cups', 'ricw-people'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
