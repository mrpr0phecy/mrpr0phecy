<h2 id="dvyi-title" style="margin-top:0;color:var(--accent);">📈 Dividend Yield Calculator</h2>

<form aria-describedby="dvyi-desc" onsubmit="event.preventDefault();">
  <p id="dvyi-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Trailing yield = annual dividends per share ÷ price. Forward yield uses the next expected year. Cover = EPS ÷ DPS. This is a ratio, not investment advice, and ignores tax wrappers.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="dvyi-price" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Share price</label>
      <input id="dvyi-price" type="number" min="0.01" step="any" value="4.85" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="dvyi-dps" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Annual DPS</label>
      <input id="dvyi-dps" type="number" min="0" step="any" value="0.22" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="dvyi-eps" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">EPS (optional)</label>
      <input id="dvyi-eps" type="number" step="any" value="0.40" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="dvyi-n" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Shares you hold</label>
      <input id="dvyi-n" type="number" min="0" step="any" value="1000" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="dvyi-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var price = Number($('dvyi-price').value), dps = Number($('dvyi-dps').value);
    var eps = Number($('dvyi-eps').value), n = Number($('dvyi-n').value);
    if (!(price > 0) || !(dps >= 0) || !(n >= 0)) {
      $('dvyi-out').textContent = 'Enter price, dividend and holding.';
      return;
    }
    var y = (dps / price) * 100;
    var income = dps * n;
    var cover = eps > 0 && dps > 0 ? (eps / dps) : null;
    var payout = eps > 0 ? (dps / eps) * 100 : null;
    $('dvyi-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Yield', y.toFixed(2) + '%') +
      cell('Gross income / year', income.toLocaleString('en-GB', { maximumFractionDigits: 2 })) +
      (cover != null ? cell('Dividend cover', cover.toFixed(2) + '×') : '') +
      (payout != null ? cell('Payout ratio', payout.toFixed(0) + '%') : '') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">A high yield can mean a falling price, not a generous board. Specials, scrip and withholding tax are not modelled. ISA/SIPP tax treatment is yours to check.</p>';
  }
  ['dvyi-price', 'dvyi-dps', 'dvyi-eps', 'dvyi-n'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
