<h2>📐 CSS Flexbox Playground</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Visual CSS Flexbox generator. Adjust properties with sliders and see the result live. Copy the generated CSS.</p>

<div id="fp-app" style="max-width:800px;margin:0 auto;">
  <div style="display:grid;grid-template-columns:250px 1fr;gap:16px;">
    <div style="padding:14px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.05);border-radius:8px;">
      <div style="font-size:13px;color:#2dd4ff;font-weight:600;margin-bottom:12px;">Container Properties</div>
      <div style="margin-bottom:10px;">
        <label style="display:block;font-size:11px;color:rgba(230,250,255,0.5);margin-bottom:4px;">flex-direction</label>
        <select id="fp-dir" style="width:100%;padding:6px;border-radius:4px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:12px;">
          <option value="row">row</option><option value="row-reverse">row-reverse</option>
          <option value="column">column</option><option value="column-reverse">column-reverse</option>
        </select>
      </div>
      <div style="margin-bottom:10px;">
        <label style="display:block;font-size:11px;color:rgba(230,250,255,0.5);margin-bottom:4px;">justify-content</label>
        <select id="fp-justify" style="width:100%;padding:6px;border-radius:4px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:12px;">
          <option value="flex-start">flex-start</option><option value="flex-end">flex-end</option>
          <option value="center" selected>center</option><option value="space-between">space-between</option>
          <option value="space-around">space-around</option><option value="space-evenly">space-evenly</option>
        </select>
      </div>
      <div style="margin-bottom:10px;">
        <label style="display:block;font-size:11px;color:rgba(230,250,255,0.5);margin-bottom:4px;">align-items</label>
        <select id="fp-align" style="width:100%;padding:6px;border-radius:4px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:12px;">
          <option value="stretch">stretch</option><option value="flex-start">flex-start</option>
          <option value="flex-end">flex-end</option><option value="center" selected>center</option>
          <option value="baseline">baseline</option>
        </select>
      </div>
      <div style="margin-bottom:10px;">
        <label style="display:block;font-size:11px;color:rgba(230,250,255,0.5);margin-bottom:4px;">flex-wrap</label>
        <select id="fp-wrap" style="width:100%;padding:6px;border-radius:4px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:12px;">
          <option value="nowrap">nowrap</option><option value="wrap">wrap</option>
          <option value="wrap-reverse">wrap-reverse</option>
        </select>
      </div>
      <div style="margin-bottom:10px;">
        <label style="display:block;font-size:11px;color:rgba(230,250,255,0.5);margin-bottom:4px;">gap: <span id="fp-gap-val">10</span>px</label>
        <input id="fp-gap" type="range" min="0" max="40" value="10" style="width:100%;accent-color:#2dd4ff;" />
      </div>
      <div style="font-size:13px;color:#39ff14;font-weight:600;margin:12px 0 8px;">Items</div>
      <div style="display:flex;gap:6px;margin-bottom:10px;">
        <button onclick="window._fpAddItem()" style="flex:1;padding:6px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.3);border-radius:4px;color:#39ff14;cursor:pointer;font-size:12px;">+ Add</button>
        <button onclick="window._fpRemoveItem()" style="flex:1;padding:6px;background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.3);border-radius:4px;color:#ff4d4d;cursor:pointer;font-size:12px;">- Remove</button>
      </div>
      <div id="fp-item-controls" style="font-size:11px;color:rgba(230,250,255,0.4);">
        <div>Click an item to select it</div>
      </div>
    </div>

    <div>
      <div id="fp-preview" style="height:300px;background:rgba(0,0,0,0.3);border:2px solid rgba(45,212,255,0.2);border-radius:10px;padding:12px;display:flex;transition:all 0.2s;"></div>
      <div style="margin-top:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <label style="color:#2dd4ff;font-size:12px;">Generated CSS</label>
          <button onclick="window._fpCopy()" style="padding:4px 10px;background:rgba(45,212,255,0.1);border:1px solid rgba(45,212,255,0.2);border-radius:4px;color:#2dd4ff;cursor:pointer;font-size:11px;">📋 Copy</button>
        </div>
        <pre id="fp-css" style="padding:12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.05);border-radius:6px;font-size:12px;color:#39ff14;font-family:monospace;overflow-x:auto;margin:0;"></pre>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var itemCount=4,selectedItem=-1;
  var colors=['#ff4444','#44ff44','#4444ff','#ffff44','#ff44ff','#44ffff','#ff8844','#88ff44'];
  function update(){
    var dir=document.getElementById('fp-dir').value;
    var justify=document.getElementById('fp-justify').value;
    var align=document.getElementById('fp-align').value;
    var wrap=document.getElementById('fp-wrap').value;
    var gap=document.getElementById('fp-gap').value;
    document.getElementById('fp-gap-val').textContent=gap;
    var preview=document.getElementById('fp-preview');
    preview.style.flexDirection=dir;
    preview.style.justifyContent=justify;
    preview.style.alignItems=align;
    preview.style.flexWrap=wrap;
    preview.style.gap=gap+'px';
    var items='';
    for(var i=0;i<itemCount;i++){
      var w=60+Math.floor(Math.random()*40);
      var h=40+Math.floor(Math.random()*60);
      var sel=i===selectedItem;
      items+='<div onclick="window._fpSelect('+i+')" style="min-width:'+w+'px;min-height:'+h+'px;background:'+colors[i%colors.length]+';border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;color:rgba(0,0,0,0.7);cursor:pointer;border:'+(sel?'3px solid #fff':'2px solid transparent')+';font-size:14px;">'+(i+1)+'</div>';
    }
    preview.innerHTML=items;
    // CSS output
    var css='.container {\n  display: flex;\n  flex-direction: '+dir+';\n  justify-content: '+justify+';\n  align-items: '+align+';\n  flex-wrap: '+wrap+';\n  gap: '+gap+'px;\n}';
    document.getElementById('fp-css').textContent=css;
  }
  function addItem(){itemCount=Math.min(12,itemCount+1);update();}
  function removeItem(){itemCount=Math.max(1,itemCount-1);if(selectedItem>=itemCount)selectedItem=-1;update();}
  function select(i){selectedItem=selectedItem===i?-1:i;update();}
  function copy(){if(navigator.clipboard)navigator.clipboard.writeText(document.getElementById('fp-css').textContent);}
  window._fpAddItem=addItem;window._fpRemoveItem=removeItem;window._fpSelect=select;window._fpCopy=copy;
  ['fp-dir','fp-justify','fp-align','fp-wrap'].forEach(function(id){document.getElementById(id).addEventListener('change',update);});
  document.getElementById('fp-gap').addEventListener('input',update);
  update();
})();
</script>
