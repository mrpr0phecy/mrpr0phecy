<!-- cards/boxing-punch-stat-tracker.html -->
<h2 id="bpst-title" style="margin-top:0;color:var(--accent);">👊 Boxing Punch Stat Tracker</h2>

<form aria-describedby="bpst-desc" onsubmit="event.preventDefault();">
  <p id="bpst-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Live compubox-style punch counter. Tap as you watch to log jabs and power shots landed or thrown, and get instant connect percentages plus a work-rate comparison.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
    <input type="text" id="bpst-a" value="Boxer A" style="width:100%;padding:8px;background:#070f18;border:1px solid rgba(255,80,80,0.45);color:#e2e8f0;border-radius:6px;font-size:0.8rem;">
    <input type="text" id="bpst-b" value="Boxer B" style="width:100%;padding:8px;background:#070f18;border:1px solid rgba(80,140,255,0.45);color:#e2e8f0;border-radius:6px;font-size:0.8rem;">
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
    <div id="bpst-panel-A"></div>
    <div id="bpst-panel-B"></div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <button type="button" id="bpst-undo" style="flex:1;padding:9px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);color:var(--text);border-radius:6px;font-weight:600;font-size:0.78rem;cursor:pointer;">↩ Undo</button>
    <button type="button" id="bpst-reset" style="flex:1;padding:9px;background:rgba(255,80,80,0.15);border:1px solid rgba(255,80,80,0.4);color:#ff9b9b;border-radius:6px;font-weight:600;font-size:0.78rem;cursor:pointer;">Reset</button>
  </div>

  <div id="bpst-analysis" style="background:#070f1a;border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:10px;font-size:0.76rem;color:var(--text-secondary);line-height:1.6;"></div>
</form>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const S={A:{jl:0,jt:0,pl:0,pt:0},B:{jl:0,jt:0,pl:0,pt:0}};
  const hist=[];
  const COL={A:'#ff6b6b',B:'#6b9dff'};

  function panel(side){
    const c=COL[side];
    return `
    <div style="background:#09121d;border:1px solid ${c}55;border-radius:6px;padding:9px;">
      <div id="bpst-name-${side}" style="font-size:0.72rem;font-weight:700;color:${c};text-transform:uppercase;margin-bottom:6px;text-align:center;">Boxer ${side}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px;">
        <button type="button" data-s="${side}" data-k="jl" style="padding:8px 4px;background:${c}22;border:1px solid ${c}66;color:${c};border-radius:5px;font-size:0.7rem;font-weight:700;cursor:pointer;">Jab Land</button>
        <button type="button" data-s="${side}" data-k="jt" style="padding:8px 4px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.18);color:var(--text-secondary);border-radius:5px;font-size:0.7rem;font-weight:600;cursor:pointer;">Jab Miss</button>
        <button type="button" data-s="${side}" data-k="pl" style="padding:8px 4px;background:${c}22;border:1px solid ${c}66;color:${c};border-radius:5px;font-size:0.7rem;font-weight:700;cursor:pointer;">Power Land</button>
        <button type="button" data-s="${side}" data-k="pt" style="padding:8px 4px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.18);color:var(--text-secondary);border-radius:5px;font-size:0.7rem;font-weight:600;cursor:pointer;">Power Miss</button>
      </div>
      <table style="width:100%;font-size:0.68rem;border-collapse:collapse;">
        <tr><td style="color:var(--text-secondary);padding:1px 0;">Jabs</td><td id="bpst-${side}-j" style="text-align:right;font-family:monospace;color:var(--text);">0/0 (0%)</td></tr>
        <tr><td style="color:var(--text-secondary);padding:1px 0;">Power</td><td id="bpst-${side}-p" style="text-align:right;font-family:monospace;color:var(--text);">0/0 (0%)</td></tr>
        <tr style="border-top:1px solid rgba(255,255,255,0.1);"><td style="color:${c};font-weight:700;padding:2px 0;">Total</td><td id="bpst-${side}-t" style="text-align:right;font-family:monospace;color:${c};font-weight:700;">0/0 (0%)</td></tr>
      </table>
    </div>`;
  }
  $('bpst-panel-A').innerHTML=panel('A');
  $('bpst-panel-B').innerHTML=panel('B');

  function pct(l,t){ return t>0?Math.round(l/t*100):0; }

  function render(){
    ['A','B'].forEach(s=>{
      const d=S[s];
      const jt=d.jl+d.jt, pt=d.pl+d.pt;
      const tl=d.jl+d.pl, tt=jt+pt;
      $('bpst-'+s+'-j').textContent=`${d.jl}/${jt} (${pct(d.jl,jt)}%)`;
      $('bpst-'+s+'-p').textContent=`${d.pl}/${pt} (${pct(d.pl,pt)}%)`;
      $('bpst-'+s+'-t').textContent=`${tl}/${tt} (${pct(tl,tt)}%)`;
    });
    const an=$('bpst-a').value||'Boxer A', bn=$('bpst-b').value||'Boxer B';
    $('bpst-name-A').textContent=an; $('bpst-name-B').textContent=bn;

    const A=S.A,B=S.B;
    const aL=A.jl+A.pl, bL=B.jl+B.pl;
    const aT=A.jl+A.jt+A.pl+A.pt, bT=B.jl+B.jt+B.pl+B.pt;
    let msg;
    if(aT+bT===0){
      msg='Tap the buttons as punches happen. "Land" counts a connect, "Miss" counts a thrown punch that did not land — both add to the total thrown.';
    } else {
      const lead=aL>bL?an:bL>aL?bn:null;
      msg=`<strong>${an} ${aL} landed of ${aT} thrown (${pct(aL,aT)}%)</strong> · <strong>${bn} ${bL} of ${bT} (${pct(bL,bT)}%)</strong>. `;
      if(lead) msg+=`${lead} leads by ${Math.abs(aL-bL)} connects. `;
      else msg+='Connects are level. ';
      const aPow=aL?Math.round(A.pl/aL*100):0, bPow=bL?Math.round(B.pl/bL*100):0;
      msg+=`Power shots make up ${aPow}% of ${an}'s landed work and ${bPow}% of ${bn}'s. `;
      if(pct(aL,aT)>pct(bL,bT)+12) msg+=`<span style="color:#00ffcc;">${an} is markedly more accurate.</span>`;
      else if(pct(bL,bT)>pct(aL,aT)+12) msg+=`<span style="color:#00ffcc;">${bn} is markedly more accurate.</span>`;
      msg+='<div style="margin-top:6px;font-size:0.7rem;opacity:0.75;">Remember: punch counts inform a card but do not decide it. Clean, effective landing outweighs raw volume.</div>';
    }
    $('bpst-analysis').innerHTML=msg;
  }

  document.querySelectorAll('#bpst-panel-A button, #bpst-panel-B button').forEach(b=>{
    b.addEventListener('click',()=>{
      S[b.dataset.s][b.dataset.k]++;
      hist.push([b.dataset.s,b.dataset.k]);
      render();
    });
  });
  $('bpst-undo').addEventListener('click',()=>{
    const l=hist.pop(); if(l){ S[l[0]][l[1]]=Math.max(0,S[l[0]][l[1]]-1); render(); }
  });
  $('bpst-reset').addEventListener('click',()=>{
    ['A','B'].forEach(s=>Object.keys(S[s]).forEach(k=>S[s][k]=0));
    hist.length=0; render();
  });
  $('bpst-a').addEventListener('input',render); $('bpst-b').addEventListener('input',render);
  render();
})();
</script>
