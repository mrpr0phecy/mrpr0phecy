<h2 id="bpsi-title" style="margin-top:0;color:var(--accent);">⏲️ Bar ⇄ PSI ⇄ kPa</h2>

<form aria-describedby="bpsi-desc" onsubmit="event.preventDefault();">
  <p id="bpsi-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Tyre, compressor and scuba pressures. 1 bar = 100 kPa = 14.5038 psi. Standard atmosphere is 101.325 kPa (14.696 psi). Gauge vs absolute is your problem — this is a unit convert only.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="bpsi-bar" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Bar</label>
      <input id="bpsi-bar" type="number" min="0" step="any" value="2.3" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="bpsi-psi" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">PSI</label>
      <input id="bpsi-psi" type="number" min="0" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="bpsi-kpa" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">kPa</label>
      <input id="bpsi-kpa" type="number" min="0" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="bpsi-atm" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">atm</label>
      <input id="bpsi-atm" type="number" min="0" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="bpsi-out" style="margin-top:14px;font-size:.82rem;color:var(--text-secondary);"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var BAR_KPA = 100, PSI_KPA = 6.894757293, ATM_KPA = 101.325;
  var lock = false;
  function apply(kpa) {
    if (!(kpa >= 0) || lock) return;
    lock = true;
    $('bpsi-kpa').value = String(Number(kpa.toFixed(3)));
    $('bpsi-bar').value = String(Number((kpa / BAR_KPA).toFixed(4)));
    $('bpsi-psi').value = String(Number((kpa / PSI_KPA).toFixed(3)));
    $('bpsi-atm').value = String(Number((kpa / ATM_KPA).toFixed(4)));
    lock = false;
    $('bpsi-out').textContent = (kpa / BAR_KPA).toFixed(2) + ' bar  =  ' + (kpa / PSI_KPA).toFixed(1) + ' psi  =  ' + kpa.toFixed(0) + ' kPa';
  }
  $('bpsi-bar').addEventListener('input', function () { apply(Number($('bpsi-bar').value) * BAR_KPA); });
  $('bpsi-psi').addEventListener('input', function () { apply(Number($('bpsi-psi').value) * PSI_KPA); });
  $('bpsi-kpa').addEventListener('input', function () { apply(Number($('bpsi-kpa').value)); });
  $('bpsi-atm').addEventListener('input', function () { apply(Number($('bpsi-atm').value) * ATM_KPA); });
  apply(2.3 * 100);
})();
</script>
