<h2 id="vcrd-title" style="margin-top:0;color:var(--accent);">🪪 vCard Generator</h2>

<form aria-describedby="vcrd-desc" onsubmit="event.preventDefault();">
  <p id="vcrd-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Build a vCard 3.0 you can save as <code>.vcf</code> and open on a phone. Stays in the browser — no address book is uploaded.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;">
    <div>
      <label for="vcrd-fn" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Full name</label>
      <input id="vcrd-fn" type="text" value="Ada Lovelace" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="vcrd-org" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Organisation</label>
      <input id="vcrd-org" type="text" value="Analytical Engines" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="vcrd-tel" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Phone</label>
      <input id="vcrd-tel" type="tel" value="+44 20 7946 0958" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="vcrd-em" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Email</label>
      <input id="vcrd-em" type="email" value="ada@example.com" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div style="grid-column:1/-1;">
      <label for="vcrd-url" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">URL</label>
      <input id="vcrd-url" type="url" value="https://example.com" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<pre id="vcrd-out" style="margin-top:12px;padding:12px;border-radius:10px;background:#071019;border:1px solid rgba(45,212,255,.28);color:#91f7ff;font-size:.78rem;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;"></pre>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">
  <button type="button" id="vcrd-copy" style="padding:8px 12px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:700;">Copy</button>
  <button type="button" id="vcrd-dl" style="padding:8px 12px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:800;">Download .vcf</button>
</div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function esc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }
  function build() {
    var fn = $('vcrd-fn').value.trim();
    var parts = fn.split(/\s+/);
    var last = parts.length > 1 ? parts.pop() : '';
    var first = parts.join(' ');
    var lines = ['BEGIN:VCARD', 'VERSION:3.0', 'FN:' + esc(fn), 'N:' + esc(last) + ';' + esc(first) + ';;;'];
    if ($('vcrd-org').value.trim()) lines.push('ORG:' + esc($('vcrd-org').value.trim()));
    if ($('vcrd-tel').value.trim()) lines.push('TEL;TYPE=CELL:' + esc($('vcrd-tel').value.trim()));
    if ($('vcrd-em').value.trim()) lines.push('EMAIL:' + esc($('vcrd-em').value.trim()));
    if ($('vcrd-url').value.trim()) lines.push('URL:' + esc($('vcrd-url').value.trim()));
    lines.push('END:VCARD');
    return lines.join('\r\n');
  }
  function run() { $('vcrd-out').textContent = build(); }
  ['vcrd-fn', 'vcrd-org', 'vcrd-tel', 'vcrd-em', 'vcrd-url'].forEach(function (id) { $(id).addEventListener('input', run); });
  $('vcrd-copy').addEventListener('click', function () {
    var btn = this, t = build();
    function done() { btn.textContent = '✓ Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done); else done();
  });
  $('vcrd-dl').addEventListener('click', function () {
    var blob = new Blob([build()], { type: 'text/vcard' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'contact.vcf';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 800);
  });
  run();
})();
</script>
