<h2 id="pdpi-title" style="margin-top:0;color:var(--accent);">🖨️ Print Size &amp; DPI Calculator</h2>

<form aria-describedby="pdpi-desc" onsubmit="event.preventDefault();">
  <p id="pdpi-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Convert pixel dimensions to print size at a chosen DPI, or the other way around. 300 DPI is typical photo-lab quality; 150 DPI is fine for posters viewed from a few feet.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;margin-bottom:12px;">
    <div>
      <label for="pdpi-w" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Width (px)</label>
      <input id="pdpi-w" type="number" min="1" value="6000" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="pdpi-h" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Height (px)</label>
      <input id="pdpi-h" type="number" min="1" value="4000" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="pdpi-dpi" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">DPI / PPI</label>
      <input id="pdpi-dpi" type="number" min="1" value="300" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;" id="pdpi-presets"></div>
</form>
<div id="pdpi-out"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var PRESETS = [
    ['6×4"', 6, 4], ['7×5"', 7, 5], ['A4', 8.27, 11.69], ['A3', 11.69, 16.54],
    ['8×10"', 8, 10], ['11×14"', 11, 14], ['12×18"', 12, 18], ['Poster 24×36"', 24, 36]
  ];

  function run() {
    var w = Number($('pdpi-w').value), h = Number($('pdpi-h').value), dpi = Number($('pdpi-dpi').value);
    if (!(w > 0 && h > 0 && dpi > 0)) { $('pdpi-out').innerHTML = ''; return; }
    var win = w / dpi, hin = h / dpi;
    var megapix = (w * h) / 1e6;
    var rows = [72, 150, 200, 300, 600].map(function (d) {
      return '<tr><td style="padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.07);">' + d + ' DPI</td>' +
        '<td style="padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.07);">' + (w / d).toFixed(2) + ' × ' + (h / d).toFixed(2) + ' in</td>' +
        '<td style="padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.07);">' + ((w / d) * 2.54).toFixed(1) + ' × ' + ((h / d) * 2.54).toFixed(1) + ' cm</td></tr>';
    }).join('');
    var fit = PRESETS.map(function (p) {
      var needW = p[1] * dpi, needH = p[2] * dpi;
      var ok = w >= needW && h >= needH || w >= needH && h >= needW;
      return '<span style="display:inline-block;margin:0 6px 6px 0;padding:4px 8px;border-radius:999px;font-size:.75rem;border:1px solid ' + (ok ? 'rgba(57,255,20,.4)' : 'rgba(255,77,77,.35)') + ';color:' + (ok ? '#b8ffb0' : '#ffb8b8') + ';">' + p[0] + (ok ? ' ✓' : ' short') + '</span>';
    }).join('');
    $('pdpi-out').innerHTML =
      '<div style="padding:12px;border-radius:10px;background:rgba(45,212,255,.08);border:1px solid rgba(45,212,255,.28);margin-bottom:12px;font-weight:800;color:var(--text);">' +
      win.toFixed(2) + ' × ' + hin.toFixed(2) + ' in  ·  ' + (win * 2.54).toFixed(1) + ' × ' + (hin * 2.54).toFixed(1) + ' cm at ' + dpi + ' DPI  ·  ' + megapix.toFixed(1) + ' MP</div>' +
      '<div style="margin-bottom:10px;">' + fit + '</div>' +
      '<table style="width:100%;border-collapse:collapse;font-size:.8rem;color:var(--text);"><thead><tr>' +
      '<th style="text-align:left;padding:6px 8px;color:var(--text-secondary);">Target</th><th style="text-align:left;padding:6px 8px;color:var(--text-secondary);">Print size</th><th style="text-align:left;padding:6px 8px;color:var(--text-secondary);">Metric</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
  }
  $('pdpi-presets').innerHTML = [72, 150, 300, 600].map(function (d) {
    return '<button type="button" data-dpi="' + d + '" style="padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--text);cursor:pointer;font-size:.78rem;">' + d + ' DPI</button>';
  }).join('');
  $('pdpi-presets').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-dpi]');
    if (!b) return;
    $('pdpi-dpi').value = b.getAttribute('data-dpi');
    run();
  });
  ['pdpi-w', 'pdpi-h', 'pdpi-dpi'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
