<h2>🗣️ Talk to Your Body (It's Been Trying to Tell You Something)</h2>
<p class="description">Your body stores emotions your mind has suppressed. Tension, pain, fatigue — these aren't random. They're messages. This guided dialogue helps you listen to what your body has been holding.</p>
<div id="bd-app" style="max-width:540px;margin:0 auto;"></div>
<script>
(function(){
'use strict';
var step=0,area='',sensation='',emotion='',message='';
var areas=['Head / Jaw / Face','Neck / Shoulders','Chest / Heart area','Stomach / Gut','Lower back / Hips','Arms / Hands','Legs / Feet','All over / General tension'];
function init(){step=0;render();}
function render(){
  var h='';
  if(step===0){
    h+='<div style="text-align:center;margin-bottom:20px;">';
    h+='<div style="font-size:64px;margin-bottom:12px;">🫀</div>';
    h+='<h3 style="color:#00e5ff;margin:0 0 8px;">Your body keeps the score</h3>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);">Bessel van der Kolk\'s landmark research showed that trauma and unprocessed emotions don\'t just live in the mind — they embed in the body. Tight shoulders from carrying responsibility. A clenched jaw from words you didn\'t say. A knot in your stomach from anxiety you\'ve intellectualised away.</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-top:12px;">Most people treat physical tension as a mechanical problem. Stretch it, massage it, medicate it. But some tension <b>won\'t release until the emotion behind it is acknowledged</b>. This tool guides you through a body-emotion dialogue — a technique used in somatic therapy, Focusing, and trauma-informed yoga.</p>';
    h+='</div>';
    h+='<button onclick="window._bdNext()" style="display:block;margin:0 auto;padding:12px 32px;background:linear-gradient(135deg,#00e5ff,#0099cc);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px;">Begin</button>';
  }else if(step===1){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">🧘</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">Close your eyes. Scan your body from head to toe. Don\'t think about it — <i>feel</i> it. Where is there tension, pain, heaviness, or discomfort? Where does your body feel tight, blocked, or "not right"?</p>';
    h+='<p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">Pick the area that calls to you most strongly right now:</p>';
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">';
    areas.forEach(function(a){
      h+='<button onclick="window._bdArea(\''+a.replace(/'/g,"\\'")+'\')" style="padding:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(0,229,255,0.2);border-radius:8px;color:var(--text-secondary);cursor:pointer;font-size:13px;text-align:left;transition:all 0.2s;">'+a+'</button>';
    });
    h+='</div>';
  }else if(step===2){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">📍</div><div style="font-size:16px;font-weight:700;color:#00e5ff;margin-top:8px;">'+area+'</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">Focus on that area. Really <i>be</i> there. What does the sensation feel like? Don\'t judge it — describe it. Is it tight, heavy, hot, cold, sharp, dull, buzzing, hollow, knotted?</p>';
    h+='<label style="display:block;font-size:13px;color:#00e5ff;margin-bottom:6px;font-weight:600;">What does it feel like physically?</label>';
    h+='<input type="text" id="bd-sense" placeholder="e.g. A tight knot, like a fist clenched..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(0,229,255,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;box-sizing:border-box;">';
    h+='<button onclick="window._bdNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#00e5ff,#0099cc);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Continue</button>';
  }else if(step===3){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">💬</div><div style="font-size:14px;color:#00e5ff;margin-top:8px;">'+area+' — "'+sensation+'"</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">Now the key step. If this tension could speak, what would it say? What emotion is it carrying? This is the question most people never ask. They treat the symptom without hearing the message.</p>';
    h+='<p style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:12px;">Common answers: grief, anger I swallowed, fear of failing, exhaustion from pretending, loneliness, guilt, a need for rest I keep denying</p>';
    h+='<label style="display:block;font-size:13px;color:#00e5ff;margin-bottom:6px;font-weight:600;">If this tension could speak, what would it say?</label>';
    h+='<textarea id="bd-emo" rows="3" placeholder="e.g. I\'m tired of holding everything together. I\'m angry but I\'m not allowed to show it..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(0,229,255,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>';
    h+='<button onclick="window._bdNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#00e5ff,#0099cc);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Continue</button>';
  }else if(step===4){
    h+='<div style="text-align:center;margin-bottom:20px;"><div style="font-size:64px;">🕊️</div></div>';
    h+='<div style="background:rgba(0,229,255,0.08);border:1px solid rgba(0,229,255,0.2);border-radius:10px;padding:20px;margin-bottom:16px;">';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0 0 12px;">Your <b>'+area+'</b> has been holding: <span style="color:#00e5ff;">"'+sensation+'"</span></p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0 0 16px;">The message behind it: <span style="color:#00e5ff;font-style:italic;">"'+emotion+'"</span></p>';
    h+='<p style="font-size:14px;line-height:1.8;color:#e6faff;margin:0;">You\'ve just done something most people never do: you\'ve listened to your body instead of overriding it. In somatic therapy, this is called <b>Focusing</b> — a technique developed by Eugene Gendlin at the University of Chicago. His research found that clients who could sense into their body\'s "felt sense" had dramatically better therapy outcomes.</p>';
    h+='<br><p style="font-size:14px;line-height:1.8;color:#e6faff;margin:0;">You don\'t need to fix anything right now. The act of <b>listening</b> is itself the release. Place your hand on '+area.toLowerCase()+'. Breathe into it. Say (silently): <i>"I hear you. I\'m listening."</i></p>';
    h+='</div>';
    h+='<p style="font-size:13px;color:var(--text-secondary);line-height:1.7;">If this resonated, consider exploring somatic experiencing, Focusing, or trauma-informed yoga. These aren\'t alternative medicine — they\'re evidence-based approaches used by NHS and private therapists worldwide for chronic tension, anxiety, and trauma recovery.</p>';
    h+='<button onclick="window._bdReset()" style="display:block;margin:20px auto 0;padding:10px 24px;background:rgba(0,229,255,0.15);color:#00e5ff;border:1px solid rgba(0,229,255,0.3);border-radius:8px;cursor:pointer;font-weight:600;">Start Over</button>';
  }
  document.getElementById('bd-app').innerHTML=h;
}
window._bdNext=function(){
  if(step===2){var s=document.getElementById('bd-sense');if(s){sensation=s.value.trim()||'tension';}}
  if(step===3){var e=document.getElementById('bd-emo');if(e){emotion=e.value.trim()||'something unspoken';}}
  step++;render();
};
window._bdArea=function(a){area=a;step=2;render();};
window._bdReset=function(){init();};
init();
})();
</script>
