<!-- cards/uuid-ulid-generator.html -->
<h2 id="uuidgen-title" style="margin-top:0;color:var(--accent);">🆔 UUID &amp; ULID Generator</h2>

<div class="uuidgen-container" style="font-family:inherit;color:var(--text);">
  <p id="uuidgen-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Generate cryptographically random UUID v4s, time-ordered UUID v7s, ULIDs, short IDs and NanoIDs. Everything is produced in your browser with the Web Crypto API — nothing is sent anywhere.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="uuidgen-kind" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">ID Format</label>
      <select id="uuidgen-kind" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="v4" selected>UUID v4 — random (RFC 9562)</option>
        <option value="v7">UUID v7 — time-ordered, DB friendly</option>
        <option value="ulid">ULID — sortable, Crockford base32</option>
        <option value="nano">NanoID — 21 chars, URL safe</option>
        <option value="short">Short ID — 8 chars, human readable</option>
        <option value="hex">Hex token — 32 chars</option>
      </select>
    </div>
    <div>
      <label for="uuidgen-count" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">How many (1–500)</label>
      <input id="uuidgen-count" type="number" min="1" max="500" value="5" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
  </div>

  <div style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;">
    <label style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.85rem;cursor:pointer;">
      <input type="checkbox" id="uuidgen-upper" style="accent-color:var(--accent);"> Uppercase
    </label>
    <label style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.85rem;cursor:pointer;">
      <input type="checkbox" id="uuidgen-braces" style="accent-color:var(--accent);"> Wrap in braces
    </label>
    <label style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.85rem;cursor:pointer;">
      <input type="checkbox" id="uuidgen-quotes" style="accent-color:var(--accent);"> Quote &amp; comma (list form)
    </label>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
    <button type="button" id="uuidgen-go" style="padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;">🆔 Generate</button>
    <button type="button" id="uuidgen-copy" style="padding:12px;border-radius:8px;border:1px solid rgba(45,212,255,0.4);background:transparent;color:var(--accent);font-weight:700;font-size:1rem;cursor:pointer;">📋 Copy all</button>
  </div>

  <textarea id="uuidgen-out" rows="9" readonly aria-label="Generated identifiers" style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.35);color:var(--text);font-size:0.9rem;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.7;resize:vertical;box-sizing:border-box;"></textarea>

  <div id="uuidgen-note" style="margin-top:12px;font-size:0.8rem;color:var(--text-secondary);line-height:1.6;"></div>
</div>

<script>
(function(){
  var root = document.currentScript && document.currentScript.previousElementSibling
    ? document.currentScript.parentNode.querySelector('.uuidgen-container')
    : document.querySelector('.uuidgen-container');
  if(!root) return;
  var $ = function(id){ return root.querySelector('#'+id); };

  var CROCKFORD = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  var NANO = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-';
  var SHORT = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';

  function bytes(n){
    var b = new Uint8Array(n);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(b);
    else for (var i=0;i<n;i++) b[i] = Math.floor(Math.random()*256);
    return b;
  }
  function hex(b){
    var s = '';
    for (var i=0;i<b.length;i++) s += b[i].toString(16).padStart(2,'0');
    return s;
  }
  function fromAlphabet(len, alphabet){
    var b = bytes(len), s = '';
    for (var i=0;i<len;i++) s += alphabet[b[i] % alphabet.length];
    return s;
  }
  function dash(h){
    return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20,32);
  }
  function uuidV4(){
    var b = bytes(16);
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    return dash(hex(b));
  }
  function uuidV7(){
    var b = bytes(16);
    var ms = Date.now();
    for (var i=5;i>=0;i--){ b[i] = ms % 256; ms = Math.floor(ms/256); }
    b[6] = (b[6] & 0x0f) | 0x70;
    b[8] = (b[8] & 0x3f) | 0x80;
    return dash(hex(b));
  }
  function ulid(){
    var ms = Date.now(), time = '';
    for (var i=0;i<10;i++){ time = CROCKFORD[ms % 32] + time; ms = Math.floor(ms/32); }
    return time + fromAlphabet(16, CROCKFORD);
  }

  var NOTES = {
    v4: 'UUID v4 is 122 bits of randomness — collisions are effectively impossible, but values are unordered, so they fragment database indexes.',
    v7: 'UUID v7 puts a millisecond timestamp in the first 48 bits, so IDs sort chronologically and index far better as a primary key than v4.',
    ulid: 'ULIDs are 26 characters, lexicographically sortable, case-insensitive and avoid look-alike letters (I, L, O, U).',
    nano: 'NanoID is 21 URL-safe characters — comparable collision resistance to UUID v4 but shorter in links.',
    short: 'Short IDs use an unambiguous 32-character alphabet. Good for coupon or reference codes, not for security.',
    hex: 'A 32-character hex token is 128 random bits — suitable for session identifiers and one-time links.'
  };

  function make(kind){
    if (kind === 'v4') return uuidV4();
    if (kind === 'v7') return uuidV7();
    if (kind === 'ulid') return ulid();
    if (kind === 'nano') return fromAlphabet(21, NANO);
    if (kind === 'short') return fromAlphabet(8, SHORT);
    return hex(bytes(16));
  }

  function generate(){
    var kind = $('uuidgen-kind').value;
    var n = parseInt($('uuidgen-count').value, 10);
    if (!isFinite(n) || n < 1) n = 1;
    if (n > 500) n = 500;
    $('uuidgen-count').value = n;
    var upper = $('uuidgen-upper').checked;
    var braces = $('uuidgen-braces').checked;
    var quotes = $('uuidgen-quotes').checked;
    var out = [];
    for (var i=0;i<n;i++){
      var v = make(kind);
      if (upper) v = v.toUpperCase(); else if (kind === 'ulid' || kind === 'short') v = v; else v = v.toLowerCase();
      if (braces) v = '{' + v + '}';
      if (quotes) v = '"' + v + '"' + (i < n-1 ? ',' : '');
      out.push(v);
    }
    $('uuidgen-out').value = out.join('\n');
    $('uuidgen-note').innerHTML = '💡 ' + NOTES[kind] + '<br>🔒 Generated locally with <strong>crypto.getRandomValues()</strong> — no network request is made.';
  }

  function copyAll(){
    var ta = $('uuidgen-out');
    if (!ta.value) return;
    var btn = $('uuidgen-copy'), original = btn.textContent;
    var done = function(){ btn.textContent = '✅ Copied'; setTimeout(function(){ btn.textContent = original; }, 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(done, function(){ ta.select(); done(); });
    } else { ta.select(); try { document.execCommand('copy'); } catch(e){} done(); }
  }

  $('uuidgen-go').addEventListener('click', generate);
  $('uuidgen-copy').addEventListener('click', copyAll);
  $('uuidgen-kind').addEventListener('change', generate);
  generate();
})();
</script>
