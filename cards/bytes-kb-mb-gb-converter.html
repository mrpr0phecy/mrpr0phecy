<h2 id="byte-title" style="margin-top:0;color:var(--accent);">💾 Bytes ⇄ KB ⇄ MB ⇄ GB</h2>

<form aria-describedby="byte-desc" onsubmit="event.preventDefault();">
  <p id="byte-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Convert file sizes with SI (1000) or binary IEC (1024) prefixes. Hard-drive boxes use decimal GB; Windows historically used 1024 and still called them GB. Edit any field.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="byte-base" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Base</label>
      <select id="byte-base" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="1000">SI — 1000 (disk labels)</option>
        <option value="1024" selected>IEC — 1024 (RAM, many OS)</option>
      </select>
    </div>
    <div>
      <label for="byte-b" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Bytes</label>
      <input id="byte-b" type="number" min="0" step="any" value="1073741824" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="byte-kb" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">KB / KiB</label>
      <input id="byte-kb" type="number" min="0" step="any" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="byte-mb" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">MB / MiB</label>
      <input id="byte-mb" type="number" min="0" step="any" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="byte-gb" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">GB / GiB</label>
      <input id="byte-gb" type="number" min="0" step="any" value="1" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="byte-tb" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">TB / TiB</label>
      <input id="byte-tb" type="number" min="0" step="any" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="byte-out" style="margin-top:14px;font-size:.82rem;color:var(--text-secondary);"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var lock = false;
  function base() { return Number($('byte-base').value); }
  function apply(bytes) {
    if (!(bytes >= 0) || lock) return;
    var k = base();
    lock = true;
    $('byte-b').value = String(Math.round(bytes));
    $('byte-kb').value = String(Number((bytes / k).toFixed(6)));
    $('byte-mb').value = String(Number((bytes / k / k).toFixed(6)));
    $('byte-gb').value = String(Number((bytes / k / k / k).toFixed(6)));
    $('byte-tb').value = String(Number((bytes / k / k / k / k).toFixed(6)));
    lock = false;
    var other = k === 1024 ? 1000 : 1024;
    $('byte-out').textContent = Math.round(bytes).toLocaleString() + ' bytes. In the other base that is ' +
      (bytes / other / other / other).toFixed(3) + (other === 1000 ? ' decimal GB.' : ' GiB.');
  }
  $('byte-b').addEventListener('input', function () { apply(Number($('byte-b').value)); });
  $('byte-kb').addEventListener('input', function () { apply(Number($('byte-kb').value) * base()); });
  $('byte-mb').addEventListener('input', function () { apply(Number($('byte-mb').value) * base() * base()); });
  $('byte-gb').addEventListener('input', function () { apply(Number($('byte-gb').value) * Math.pow(base(), 3)); });
  $('byte-tb').addEventListener('input', function () { apply(Number($('byte-tb').value) * Math.pow(base(), 4)); });
  $('byte-base').addEventListener('change', function () { apply(Number($('byte-b').value)); });
  apply(1073741824);
})();
</script>
