<h2 id="jlag-title" style="margin-top:0;color:var(--accent);">✈️ Jet Lag Sleep Shift Planner</h2>

<form aria-describedby="jlag-desc" onsubmit="event.preventDefault();">
  <p id="jlag-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Plan a sleep shift for a timezone jump. Eastbound is harder (phase advance ~1 h/day); westbound is easier (~1.5 h/day). Times are a circadian rule of thumb, not a flight-medicine consult.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="jlag-home" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Home UTC offset</label>
      <input id="jlag-home" type="number" step="0.5" value="0" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="jlag-dest" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Destination UTC offset</label>
      <input id="jlag-dest" type="number" step="0.5" value="9" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="jlag-sleep" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Usual bedtime (home)</label>
      <input id="jlag-sleep" type="time" value="23:00" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="jlag-wake" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Usual wake (home)</label>
      <input id="jlag-wake" type="time" value="07:00" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="jlag-days" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Days until departure</label>
      <input id="jlag-days" type="number" min="0" max="14" value="4" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="jlag-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };

  function hm(str) {
    var p = str.split(':');
    return Number(p[0]) * 60 + Number(p[1]);
  }
  function fmt(min) {
    min = ((Math.round(min) % 1440) + 1440) % 1440;
    return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0');
  }
  function wrapDelta(h) {
    while (h > 12) h -= 24;
    while (h < -12) h += 24;
    return h;
  }
  function run() {
    var home = Number($('jlag-home').value), dest = Number($('jlag-dest').value);
    if (!isFinite(home) || !isFinite(dest)) return;
    var delta = wrapDelta(dest - home);
    var east = delta > 0;
    var mag = Math.abs(delta);
    var rate = east ? 1 : 1.5;
    var daysNeed = mag / rate;
    var pre = Number($('jlag-days').value) || 0;
    var shiftPerDay = mag === 0 ? 0 : (east ? -60 : 60) * Math.min(rate, mag / Math.max(1, pre));
    if (pre === 0) shiftPerDay = 0;
    var sleep0 = hm($('jlag-sleep').value), wake0 = hm($('jlag-wake').value);
    var rows = '';
    for (var d = 0; d <= pre; d++) {
      var shift = east ? -60 * Math.min(rate * d, mag) : 60 * Math.min(rate * d, mag);
      var label = d === 0 ? 'Today (home)' : (d === pre ? 'Departure day' : 'Day −' + (pre - d));
      rows += '<tr><td style="padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.07);">' + label + '</td>' +
        '<td style="padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.07);font-weight:700;color:#91f7ff;">' + fmt(sleep0 + shift) + '</td>' +
        '<td style="padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.07);">' + fmt(wake0 + shift) + '</td></tr>';
    }
    var dir = mag === 0 ? 'No timezone change.' : (east ? 'Eastbound +' + mag + ' h (harder, body clock must advance).' : 'Westbound ' + mag + ' h (easier, body clock delays).');
    $('jlag-out').innerHTML =
      '<div style="padding:12px;border-radius:10px;background:rgba(45,212,255,.08);border:1px solid rgba(45,212,255,.28);margin-bottom:10px;font-weight:700;color:var(--text);">' + dir + ' Rough recovery ' + daysNeed.toFixed(1) + ' days if you start shifting on arrival.</div>' +
      '<table style="width:100%;border-collapse:collapse;font-size:.82rem;color:var(--text);"><thead><tr>' +
      '<th style="text-align:left;padding:6px 8px;color:var(--text-secondary);">Pre-trip (home clock)</th><th style="text-align:left;padding:6px 8px;color:var(--text-secondary);">Bed</th><th style="text-align:left;padding:6px 8px;color:var(--text-secondary);">Wake</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>' +
      '<p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Morning light helps eastbound shifts; evening light helps westbound. Melatonin is a drug — this tool does not dose it.</p>';
  }
  ['jlag-home', 'jlag-dest', 'jlag-sleep', 'jlag-wake', 'jlag-days'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
