<h2 id="utm-title" style="margin-top:0;color:var(--accent);">🖼️ Thumbnail Preview Tool</h2>

<div class="utm-container" style="font-family:inherit;color:var(--text);">
  <p class="small" style="color:rgba(230,250,255,0.7);margin-bottom:16px;">
    Upload an image and preview it as a 16:9 thumbnail. Adjust brightness, contrast, and add overlay text.
  </p>

  <div style="text-align:center;margin-bottom:16px;">
    <input type="file" id="utm-upload" accept="image/*" style="display:none;">
    <button type="button" onclick="(function(b){b.closest('.utm-container').querySelector('#utm-upload').click();})(this)"
            style="padding:14px 28px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:600;font-size:14px;">📁 Upload Image</button>
  </div>

  <div id="utm-preview" style="aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;position:relative;display:none;box-shadow:0 8px 30px rgba(0,0,0,0.6);">
    <img id="utm-img" style="width:100%;height:100%;object-fit:cover;" alt="Thumbnail preview">
    <div id="utm-overlay" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
      <div id="utm-text" style="font-size:2rem;font-weight:bold;color:#fff;text-shadow:2px 2px 8px rgba(0,0,0,0.8);text-align:center;padding:20px;"></div>
    </div>
  </div>

  <div id="utm-controls" style="display:none;margin-top:16px;">
    <div style="margin-bottom:12px;">
      <label for="utm-text-input" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">✏️ Overlay Text</label>
      <input id="utm-text-input" type="text" placeholder="Enter overlay text..." value=""
             oninput="(function(el){el.closest('.utm-container').querySelector('#utm-text').textContent=el.value;})(this)"
             style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
      <div>
        <label for="utm-brightness" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">☀️ Brightness</label>
        <input id="utm-brightness" type="range" min="0" max="200" value="100"
               oninput="(function(el){el.closest('.utm-container').querySelector('#utm-img').style.filter='brightness('+el.value+'%) contrast('+el.closest('.utm-container').querySelector('#utm-contrast').value+'%)';})(this)"
               style="width:100%;accent-color:var(--accent);" />
      </div>
      <div>
        <label for="utm-contrast" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">🎨 Contrast</label>
        <input id="utm-contrast" type="range" min="0" max="200" value="100"
               oninput="(function(el){el.closest('.utm-container').querySelector('#utm-img').style.filter='brightness('+el.closest('.utm-container').querySelector('#utm-brightness').value+'%) contrast('+el.value+'%)';})(this)"
               style="width:100%;accent-color:var(--accent);" />
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;">
      <button type="button" onclick="(function(b){var c=b.closest('.utm-container');c.querySelector('#utm-text').style.color='#fff';c.querySelector('#utm-text').style.textShadow='2px 2px 8px #000,0 0 20px #ff00ff';c.querySelector('#utm-text-input').dispatchEvent(new Event('input'));})(this)"
              style="padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,0,255,0.1);color:var(--text);cursor:pointer;font-size:13px;">Neon Glow</button>
      <button type="button" onclick="(function(b){var c=b.closest('.utm-container');c.querySelector('#utm-text').style.color='#2dd4ff';c.querySelector('#utm-text').style.textShadow='2px 2px 4px #000';c.querySelector('#utm-text-input').dispatchEvent(new Event('input'));})(this)"
              style="padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(45,212,255,0.1);color:var(--text);cursor:pointer;font-size:13px;">Clean Cyan</button>
      <button type="button" onclick="(function(b){var c=b.closest('.utm-container');c.querySelector('#utm-text').style.color='#fff';c.querySelector('#utm-text').style.textShadow='4px 4px 0 #000';c.querySelector('#utm-text-input').dispatchEvent(new Event('input'));})(this)"
              style="padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.08);color:var(--text);cursor:pointer;font-size:13px;">Bold Shadow</button>
      <button type="button" onclick="(function(b){var c=b.closest('.utm-container');c.querySelector('#utm-text').style.color='#ffcc00';c.querySelector('#utm-text').style.textShadow='2px 2px 4px #000';c.querySelector('#utm-text-input').dispatchEvent(new Event('input'));})(this)"
              style="padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,204,0,0.1);color:var(--text);cursor:pointer;font-size:13px;">Gold Pop</button>
    </div>
  </div>
</div>

<script>
(function(){
  var upload=document.getElementById('utm-upload');
  var img=document.getElementById('utm-img');
  var preview=document.getElementById('utm-preview');
  var controls=document.getElementById('utm-controls');
  if(!upload)return;
  upload.addEventListener('change',function(e){
    var file=e.target.files[0];
    if(file&&file.type.startsWith('image/')){
      var reader=new FileReader();
      reader.onload=function(ev){
        img.src=ev.target.result;
        preview.style.display='block';
        controls.style.display='block';
      };
      reader.readAsDataURL(file);
    }
  });
})();
</script>
