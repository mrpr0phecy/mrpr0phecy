<h2 id="dewp-title" style="margin-top:0;color:var(--accent);">💧 Dew Point Calculator</h2>

<form aria-describedby="dewp-desc" onsubmit="event.preventDefault();">
  <p id="dewp-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Magnus formula dew point from air temperature and relative humidity. Condensation risk on a surface is when the surface is at or below this dew point. Not a weather forecast.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="dewp-t" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Air temperature °C</label>
      <input id="dewp-t" type="number" step="any" value="18" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="dewp-rh" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Relative humidity %</label>
      <input id="dewp-rh" type="number" min="1" max="100" step="any" value="70" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="dewp-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function dewPoint(t, rh) {
    var a = 17.625, b = 243.04;
    var g = Math.log(rh / 100) + (a * t) / (b + t);
    return (b * g) / (a - g);
  }
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var t = Number($('dewp-t').value), rh = Number($('dewp-rh').value);
    if (!isFinite(t) || !(rh > 0) || rh > 100) {
      $('dewp-out').textContent = 'Enter temperature and humidity 1–100%.';
      return;
    }
    var dp = dewPoint(t, rh);
    var spread = t - dp;
    var feel = dp < 10 ? 'dry' : dp < 16 ? 'comfortable' : dp < 21 ? 'sticky' : 'oppressive';
    $('dewp-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Dew point', dp.toFixed(1) + ' °C') +
      cell('Fahrenheit', (dp * 9 / 5 + 32).toFixed(1) + ' °F') +
      cell('Spread T − Td', spread.toFixed(1) + ' °C') +
      cell('Comfort band', feel) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Magnus coefficients a = 17.625, b = 243.04 °C (Alduchov &amp; Eskridge). Windows mist when glass ≤ dew point. A small spread means fog is more likely.</p>';
  }
  $('dewp-t').addEventListener('input', run);
  $('dewp-rh').addEventListener('input', run);
  run();
})();
</script>
