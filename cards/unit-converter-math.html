<section class="math-tool"><h2 id="unit-converter-math-title">🔁 Math Unit Converter</h2><p id="unit-converter-math-desc">Convert length, area, mass, and temperature without hunting for formulas.</p><div class="grid"><label>Value<input id="uc-v" type="number" value="10"></label><label>From<select id="uc-f"><option value="m">Metres</option><option value="km">Kilometres</option><option value="cm">Centimetres</option><option value="mi">Miles</option><option value="ft">Feet</option></select></label><label>To<select id="uc-t"><option value="ft">Feet</option><option value="m">Metres</option><option value="km">Kilometres</option><option value="cm">Centimetres</option><option value="mi">Miles</option></select></label></div><button id="ucm-go">Convert</button><div class="answer" id="ucm-out"></div></section><style>.math-tool{max-width:720px;margin:auto;color:#e6faff}.math-tool h2{color:#2dd4ff}.math-tool p{color:#b7cbd2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:18px 0}.math-tool label{display:grid;gap:7px;color:#9deaff}.math-tool input,.math-tool select{padding:12px;border-radius:8px;border:1px solid #285268;background:#101c25;color:#fff;font-size:16px}.math-tool button{padding:12px 22px;border:0;border-radius:8px;background:#2dd4ff;color:#06151c;font-weight:800}.answer{margin-top:18px;padding:18px;border-radius:10px;background:#102833;color:#39ff14;font-size:20px}</style><script>(()=>{const $=x=>document.getElementById(x),u={m:1,km:1000,cm:.01,mi:1609.344,ft:.3048};function go(){let v=+$('uc-v').value,r=v*u[$('uc-f').value]/u[$('uc-t').value];$('ucm-out').textContent=`Result: ${r.toFixed(6).replace(/0+$/,'').replace(/\.$/,'')}`}$('ucm-go').onclick=go;go()})()</script>
