<h2 id="htsc-title" style="margin-top:0;color:var(--accent);">📡 HTTP Status Code Encyclopedia</h2>

<form aria-describedby="htsc-desc" onsubmit="event.preventDefault();">
  <p id="htsc-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Look up any HTTP status code, filter by class, and copy a one-line explanation. Covers the registered 1xx–5xx codes developers hit in the wild. Entirely offline.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end;margin-bottom:12px;">
    <div>
      <label for="htsc-q" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Search code or phrase</label>
      <input id="htsc-q" type="search" placeholder="404, teapot, unauthorized…" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="htsc-class" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Class</label>
      <select id="htsc-class" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="all">All classes</option>
        <option value="1">1xx Informational</option>
        <option value="2">2xx Success</option>
        <option value="3">3xx Redirection</option>
        <option value="4">4xx Client error</option>
        <option value="5">5xx Server error</option>
      </select>
    </div>
  </div>
</form>
<div id="htsc-count" style="font-size:.78rem;color:var(--text-secondary);margin-bottom:8px;"></div>
<div id="htsc-list" style="max-height:420px;overflow:auto;border:1px solid rgba(255,255,255,.1);border-radius:10px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var CODES = [
    [100, 'Continue', 'Client should continue sending the request body.'],
    [101, 'Switching Protocols', 'Server is switching protocols as requested (Upgrade).'],
    [102, 'Processing', 'WebDAV: request received, no response yet.'],
    [103, 'Early Hints', 'Preload hints sent before the final response.'],
    [200, 'OK', 'Request succeeded. The standard success code.'],
    [201, 'Created', 'A new resource was created (typical for POST).'],
    [202, 'Accepted', 'Request accepted for later processing.'],
    [203, 'Non-Authoritative Information', 'Payload modified by a transforming proxy.'],
    [204, 'No Content', 'Success, but nothing to return. Used after DELETE.'],
    [205, 'Reset Content', 'Success; client should reset the document view.'],
    [206, 'Partial Content', 'Range request succeeded. Used by video/resume downloads.'],
    [207, 'Multi-Status', 'WebDAV: multiple status codes for a batch.'],
    [208, 'Already Reported', 'WebDAV: members already listed in a previous response.'],
    [226, 'IM Used', 'Delta encoding: instance-manipulation applied.'],
    [300, 'Multiple Choices', 'Several representations; client should pick one.'],
    [301, 'Moved Permanently', 'Resource has a new permanent URI. Cacheable.'],
    [302, 'Found', 'Temporarily at another URI. Historically misused for POST→GET.'],
    [303, 'See Other', 'GET the resource at another URI (PRG pattern).'],
    [304, 'Not Modified', 'Cached copy is still valid. No body.'],
    [307, 'Temporary Redirect', 'Repeat the request at another URI, same method.'],
    [308, 'Permanent Redirect', 'Permanent, method and body must not change.'],
    [400, 'Bad Request', 'Malformed syntax or invalid request message.'],
    [401, 'Unauthorized', 'Authentication required or failed. Send WWW-Authenticate.'],
    [402, 'Payment Required', 'Reserved. Rarely used for paywalls.'],
    [403, 'Forbidden', 'Authenticated but not allowed. Do not retry as the same user.'],
    [404, 'Not Found', 'No resource at this URI. Safe to cache for missing pages.'],
    [405, 'Method Not Allowed', 'HTTP method is not supported. Look at Allow.'],
    [406, 'Not Acceptable', 'No representation matches Accept headers.'],
    [407, 'Proxy Authentication Required', 'Authenticate with the proxy first.'],
    [408, 'Request Timeout', 'Server waited too long for the request.'],
    [409, 'Conflict', 'State conflict (edit collision, duplicate).'],
    [410, 'Gone', 'Resource existed, now permanently gone. Stronger than 404.'],
    [411, 'Length Required', 'Content-Length header is required.'],
    [412, 'Precondition Failed', 'If-Match / If-Unmodified-Since failed.'],
    [413, 'Content Too Large', 'Request body exceeds server limits.'],
    [414, 'URI Too Long', 'Request URI is longer than the server will parse.'],
    [415, 'Unsupported Media Type', 'Content-Type is not accepted.'],
    [416, 'Range Not Satisfiable', 'Requested Range is outside the resource.'],
    [417, 'Expectation Failed', 'Expect header could not be met.'],
    [418, "I'm a teapot", 'RFC 2324 April Fools. Not a real refusal.'],
    [421, 'Misdirected Request', 'Request was sent to a server that cannot produce a response.'],
    [422, 'Unprocessable Content', 'Well-formed but semantically invalid (often JSON APIs).'],
    [423, 'Locked', 'WebDAV: resource is locked.'],
    [424, 'Failed Dependency', 'WebDAV: depended-on request failed.'],
    [425, 'Too Early', 'Risk of replay. Do not process yet.'],
    [426, 'Upgrade Required', 'Client must switch protocols (e.g. to TLS).'],
    [428, 'Precondition Required', 'Require If-Match to avoid lost updates.'],
    [429, 'Too Many Requests', 'Rate limited. Honour Retry-After.'],
    [431, 'Request Header Fields Too Large', 'Headers as a whole, or one header, too big.'],
    [451, 'Unavailable For Legal Reasons', 'Blocked by law (censorship, DMCA).'],
    [500, 'Internal Server Error', 'Generic server failure. The catch-all 5xx.'],
    [501, 'Not Implemented', 'Method or feature is not supported.'],
    [502, 'Bad Gateway', 'Upstream proxy got an invalid response.'],
    [503, 'Service Unavailable', 'Overloaded or down for maintenance. Retry-After.'],
    [504, 'Gateway Timeout', 'Upstream proxy timed out.'],
    [505, 'HTTP Version Not Supported', 'Server refuses this HTTP version.'],
    [506, 'Variant Also Negotiates', 'Transparent content negotiation loop.'],
    [507, 'Insufficient Storage', 'WebDAV: server cannot store the representation.'],
    [508, 'Loop Detected', 'WebDAV: infinite loop while processing.'],
    [510, 'Not Extended', 'Further extensions to the request are required.'],
    [511, 'Network Authentication Required', 'Captive portal. Client must authenticate to the network.']
  ];
  var COLORS = { 1: '#91f7ff', 2: '#39ff14', 3: '#ffd700', 4: '#ffb347', 5: '#ff4d4d' };

  function render() {
    var q = $('htsc-q').value.trim().toLowerCase();
    var cls = $('htsc-class').value;
    var html = '';
    var n = 0;
    for (var i = 0; i < CODES.length; i++) {
      var c = CODES[i];
      var klass = String(c[0])[0];
      if (cls !== 'all' && klass !== cls) continue;
      var blob = (c[0] + ' ' + c[1] + ' ' + c[2]).toLowerCase();
      if (q && blob.indexOf(q) === -1) continue;
      n++;
      html += '<button type="button" data-copy="' + c[0] + ' ' + c[1] + '" style="display:block;width:100%;text-align:left;padding:10px 12px;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer;color:inherit;">' +
        '<span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;color:' + (COLORS[klass] || 'var(--accent)') + ';">' + c[0] + '</span> ' +
        '<strong style="color:var(--text);">' + c[1] + '</strong>' +
        '<div style="font-size:.78rem;color:var(--text-secondary);margin-top:3px;">' + c[2] + '</div></button>';
    }
    $('htsc-count').textContent = n + ' code' + (n === 1 ? '' : 's') + ' · click a row to copy “code phrase”';
    $('htsc-list').innerHTML = html || '<div style="padding:16px;color:var(--text-secondary);font-size:.82rem;">No matching status codes.</div>';
  }
  $('htsc-list').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-copy]');
    if (!btn) return;
    var text = btn.getAttribute('data-copy');
    function done() { $('htsc-count').textContent = 'Copied “' + text + '”'; }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done);
    else done();
  });
  $('htsc-q').addEventListener('input', render);
  $('htsc-class').addEventListener('change', render);
  render();
})();
</script>
