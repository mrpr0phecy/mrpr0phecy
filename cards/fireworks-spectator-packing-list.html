<h2 id="fwsp-title" style="margin-top:0;color:var(--accent);">🧣 Fireworks Display Packing List</h2>
<div id="fwsp-root">
  <p id="fwsp-desc" class="small">Pack for a comfortable outdoor display and a smoother trip home.</p>
  <p class="fwsp-note">Adjust the list for your group, the weather and the venue.</p><div class="fwsp-panel"><label class="fwsp-item"><input type="checkbox"> <span>Check tickets, opening time and the venue’s bag and food rules.</span></label>
<label class="fwsp-item"><input type="checkbox"> <span>Wear warm layers and a waterproof coat; choose sturdy shoes for muddy ground.</span></label>
<label class="fwsp-item"><input type="checkbox"> <span>Bring a charged phone, tickets and any travel passes.</span></label>
<label class="fwsp-item"><input type="checkbox"> <span>Pack ear defenders for children or anyone sensitive to loud noise.</span></label>
<label class="fwsp-item"><input type="checkbox"> <span>Bring water, any essential medication and accessible supplies you need.</span></label>
<label class="fwsp-item"><input type="checkbox"> <span>Agree a meeting point and a plan if someone becomes separated.</span></label>
<label class="fwsp-item"><input type="checkbox"> <span>Check accessible routes, viewing areas, toilets and transport before leaving.</span></label>
<label class="fwsp-item"><input type="checkbox"> <span>Use a torch or reflective item for the journey; keep walkways clear.</span></label></div>
    <p id="fwsp-progress" class="fwsp-result" aria-live="polite"></p><button type="button" id="fwsp-reset">Clear ticks</button>

  <p class="fwsp-note">More for the night: <a href="/tool/fireworks-night-checklist.html">event checklist</a> · <a href="/tool/fireworks-pet-preparation.html">pets</a> · <a href="/tool/fireworks-burn-first-aid.html">burn first aid</a> · <a href="/tool/fireworks-night-budget.html">budget</a></p>
  <style>
#fwsp-root {color:var(--text);}
#fwsp-root .fwsp-panel {background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:16px;margin:14px 0;}
#fwsp-root .fwsp-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;}
#fwsp-root label {display:block;line-height:1.45;}
#fwsp-root input:not([type=checkbox]), #fwsp-root select {box-sizing:border-box;width:100%;margin-top:5px;padding:10px;border-radius:8px;border:1px solid #64748b;background:#101a28;color:#fff;font:inherit;}
#fwsp-root input[type=checkbox] {width:18px;height:18px;flex:none;accent-color:#f59e0b;}
#fwsp-root .fwsp-item {display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.1);}
#fwsp-root button {background:#fbbf24;color:#111827;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;margin:8px 8px 0 0;}
#fwsp-root button:focus-visible, #fwsp-root input:focus-visible, #fwsp-root select:focus-visible {outline:3px solid #fbbf24;outline-offset:2px;}
#fwsp-root .fwsp-result {white-space:pre-line;line-height:1.6;}
#fwsp-root .fwsp-note {font-size:.88rem;color:var(--text-secondary);line-height:1.5;}
#fwsp-root a {color:var(--accent);}
</style>
</div>
<script>
(function() {
  'use strict';
  function init() {
    const root = document.getElementById('fwsp-root');
    if (!root || root.dataset.ready) return;
    root.dataset.ready = 'true';
    const boxes = Array.from(root.querySelectorAll('input[type="checkbox"]'));
    const progress = root.querySelector('#fwsp-progress');
    function update() { progress.textContent = boxes.filter(b => b.checked).length + ' of ' + boxes.length + ' checked'; }
    boxes.forEach(b => b.addEventListener('change', update));
    root.querySelector('#fwsp-reset').addEventListener('click', () => { boxes.forEach(b => b.checked = false); update(); });
    update();
  }
  init();
})();
</script>
