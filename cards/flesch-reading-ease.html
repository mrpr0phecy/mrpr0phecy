<h2 id="flsh-title" style="margin-top:0;color:var(--accent);">📖 Flesch Reading Ease</h2>

<form aria-describedby="flsh-desc" onsubmit="event.preventDefault();">
  <p id="flsh-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Score = 206.835 − 1.015×(words/sentences) − 84.6×(syllables/words). 60–70 is plain English; under 30 is academic. Syllables are guessed from vowel groups — close, not a linguist.
  </p>
  <label for="flsh-in" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Paste text</label>
  <textarea id="flsh-in" rows="6" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-size:.85rem;">The rain in Spain stays mainly in the plain. Short sentences help most readers.</textarea>
</form>
<div id="flsh-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function syllables(word) {
    word = word.toLowerCase().replace(/[^a-z]/g, '');
    if (!word) return 0;
    var m = word.replace(/e$/, '').match(/[aeiouy]+/g);
    return Math.max(1, m ? m.length : 1);
  }
  function run() {
    var t = $('flsh-in').value.trim();
    var sentences = t.split(/[.!?]+/).filter(function (s) { return s.trim(); }).length || 1;
    var words = t.split(/\s+/).filter(Boolean);
    var wc = words.length || 1;
    var syl = 0;
    words.forEach(function (w) { syl += syllables(w); });
    var score = 206.835 - 1.015 * (wc / sentences) - 84.6 * (syl / wc);
    var fk = 0.39 * (wc / sentences) + 11.8 * (syl / wc) - 15.59;
    var band = score >= 90 ? 'very easy' : score >= 70 ? 'easy' : score >= 60 ? 'plain English' : score >= 50 ? 'fairly difficult' : score >= 30 ? 'difficult' : 'very difficult';
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('flsh-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Reading ease', score.toFixed(0) + '  (' + band + ')') +
      cell('Grade level (FK)', Math.max(0, fk).toFixed(1)) +
      cell('Words / sentences', wc + ' / ' + sentences) +
      cell('Syllables', syl) +
      '</div>';
  }
  $('flsh-in').addEventListener('input', run);
  run();
})();
</script>
