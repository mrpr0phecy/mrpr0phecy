<h2 id="ksfb-title" style="margin-top:0;color:var(--accent);">📋 Offline Kanban Sprint Board</h2>

<p id="ksfb-desc" class="small" style="color:var(--text-secondary);margin-bottom:16px;">
  Lightweight, private Kanban board with drag-and-drop cards, custom columns, priority tags, WIP counts, markdown export, and local storage auto-save.
</p>

<!-- Top Toolbar -->
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;">
  <button type="button" id="ksfb-open-add-btn" style="padding:7px 13px;background:var(--accent);color:#071019;border:0;border-radius:6px;cursor:pointer;font-weight:800;font-size:0.78rem;">+ New Task</button>
  <button type="button" id="ksfb-export-json-btn" style="padding:7px 11px;background:rgba(255,255,255,0.06);color:var(--text);border:1px solid rgba(255,255,255,0.15);border-radius:6px;cursor:pointer;font-size:0.78rem;">💾 Backup JSON</button>
  <button type="button" id="ksfb-export-md-btn" style="padding:7px 11px;background:rgba(255,255,255,0.06);color:var(--text);border:1px solid rgba(255,255,255,0.15);border-radius:6px;cursor:pointer;font-size:0.78rem;">📝 Copy as Markdown</button>
  <label for="ksfb-import-file" style="padding:7px 11px;background:rgba(255,255,255,0.06);color:var(--text);border:1px solid rgba(255,255,255,0.15);border-radius:6px;cursor:pointer;font-size:0.78rem;display:inline-block;">📥 Import JSON</label>
  <input type="file" id="ksfb-import-file" accept=".json" style="display:none;">
  <button type="button" id="ksfb-reset-btn" style="padding:7px 11px;background:rgba(255,77,77,0.1);color:#ff7878;border:1px solid rgba(255,77,77,0.3);border-radius:6px;cursor:pointer;font-size:0.78rem;">Reset Defaults</button>
  <span id="ksfb-status" aria-live="polite" style="font-size:0.76rem;color:var(--accent);margin-left:auto;"></span>
</div>

<!-- Add Task Inline Panel (collapsible) -->
<div id="ksfb-add-panel" style="display:none;background:#0b1722;border:1px solid rgba(45,212,255,0.3);border-radius:10px;padding:14px;margin-bottom:16px;">
  <div style="font-size:0.84rem;font-weight:700;color:var(--accent);margin-bottom:10px;">Create New Sprint Task</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:10px;">
    <div>
      <label for="ksfb-new-title" style="display:block;font-size:0.75rem;color:var(--text-secondary);margin-bottom:4px;">Task Title *</label>
      <input id="ksfb-new-title" type="text" placeholder="e.g. Optimize SVG renderer" style="width:100%;box-sizing:border-box;padding:8px;border-radius:6px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,0.16);font-size:0.82rem;">
    </div>
    <div>
      <label for="ksfb-new-col" style="display:block;font-size:0.75rem;color:var(--text-secondary);margin-bottom:4px;">Initial Column</label>
      <select id="ksfb-new-col" style="width:100%;box-sizing:border-box;padding:8px;border-radius:6px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,0.16);font-size:0.82rem;">
        <option value="backlog">📥 Backlog</option>
        <option value="progress">⚡ In Progress</option>
        <option value="review">🔍 Review / QA</option>
        <option value="done">✅ Done</option>
      </select>
    </div>
    <div>
      <label for="ksfb-new-tag" style="display:block;font-size:0.75rem;color:var(--text-secondary);margin-bottom:4px;">Category Tag</label>
      <select id="ksfb-new-tag" style="width:100%;box-sizing:border-box;padding:8px;border-radius:6px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,0.16);font-size:0.82rem;">
        <option value="Feature">✨ Feature</option>
        <option value="Bug">🐛 Bug Fix</option>
        <option value="Docs">📚 Docs</option>
        <option value="Refactor">⚡ Refactor</option>
        <option value="Urgent">🔥 Urgent</option>
      </select>
    </div>
    <div>
      <label for="ksfb-new-prio" style="display:block;font-size:0.75rem;color:var(--text-secondary);margin-bottom:4px;">Priority</label>
      <select id="ksfb-new-prio" style="width:100%;box-sizing:border-box;padding:8px;border-radius:6px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,0.16);font-size:0.82rem;">
        <option value="High">🔴 High Priority</option>
        <option value="Medium" selected>🟡 Medium Priority</option>
        <option value="Low">🟢 Low Priority</option>
      </select>
    </div>
  </div>
  <div style="margin-bottom:12px;">
    <label for="ksfb-new-desc" style="display:block;font-size:0.75rem;color:var(--text-secondary);margin-bottom:4px;">Task Details / Acceptance Criteria</label>
    <textarea id="ksfb-new-desc" rows="2" placeholder="Brief notes, steps, or checklist items..." style="width:100%;box-sizing:border-box;padding:8px;border-radius:6px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,0.16);font-size:0.8rem;"></textarea>
  </div>
  <div style="display:flex;gap:8px;">
    <button type="button" id="ksfb-save-task-btn" style="padding:7px 14px;background:var(--accent);color:#071019;border:0;border-radius:6px;cursor:pointer;font-weight:800;font-size:0.78rem;">Save Task</button>
    <button type="button" id="ksfb-cancel-task-btn" style="padding:7px 12px;background:rgba(255,255,255,0.06);color:var(--text);border:1px solid rgba(255,255,255,0.15);border-radius:6px;cursor:pointer;font-size:0.78rem;">Cancel</button>
  </div>
</div>

<!-- Kanban Columns Container -->
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px;">
  <!-- Column 1: Backlog -->
  <div class="ksfb-col" data-col="backlog" style="background:#0a121c;border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px;display:flex;flex-direction:column;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:8px;">
      <span style="font-weight:700;font-size:0.82rem;color:var(--text);">📥 Backlog</span>
      <span id="ksfb-count-backlog" style="font-size:0.72rem;background:rgba(255,255,255,0.1);padding:2px 7px;border-radius:10px;color:var(--text);">0</span>
    </div>
    <div id="ksfb-list-backlog" class="ksfb-card-list" style="display:flex;flex-direction:column;gap:8px;min-height:120px;flex:1;"></div>
  </div>

  <!-- Column 2: In Progress -->
  <div class="ksfb-col" data-col="progress" style="background:#0a121c;border:1px solid rgba(45,212,255,0.2);border-radius:10px;padding:12px;display:flex;flex-direction:column;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid rgba(45,212,255,0.2);padding-bottom:8px;">
      <span style="font-weight:700;font-size:0.82rem;color:var(--accent);">⚡ In Progress</span>
      <span id="ksfb-count-progress" style="font-size:0.72rem;background:rgba(45,212,255,0.2);padding:2px 7px;border-radius:10px;color:var(--accent);">0</span>
    </div>
    <div id="ksfb-list-progress" class="ksfb-card-list" style="display:flex;flex-direction:column;gap:8px;min-height:120px;flex:1;"></div>
  </div>

  <!-- Column 3: Review -->
  <div class="ksfb-col" data-col="review" style="background:#0a121c;border:1px solid rgba(255,201,60,0.2);border-radius:10px;padding:12px;display:flex;flex-direction:column;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid rgba(255,201,60,0.2);padding-bottom:8px;">
      <span style="font-weight:700;font-size:0.82rem;color:#ffc93c;">🔍 Review / QA</span>
      <span id="ksfb-count-review" style="font-size:0.72rem;background:rgba(255,201,60,0.2);padding:2px 7px;border-radius:10px;color:#ffc93c;">0</span>
    </div>
    <div id="ksfb-list-review" class="ksfb-card-list" style="display:flex;flex-direction:column;gap:8px;min-height:120px;flex:1;"></div>
  </div>

  <!-- Column 4: Done -->
  <div class="ksfb-col" data-col="done" style="background:#0a121c;border:1px solid rgba(57,255,20,0.2);border-radius:10px;padding:12px;display:flex;flex-direction:column;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid rgba(57,255,20,0.2);padding-bottom:8px;">
      <span style="font-weight:700;font-size:0.82rem;color:#39ff14;">✅ Done</span>
      <span id="ksfb-count-done" style="font-size:0.72rem;background:rgba(57,255,20,0.2);padding:2px 7px;border-radius:10px;color:#39ff14;">0</span>
    </div>
    <div id="ksfb-list-done" class="ksfb-card-list" style="display:flex;flex-direction:column;gap:8px;min-height:120px;flex:1;"></div>
  </div>
</div>

<script>
(function(){
  var host = document.currentScript.parentNode;
  var $ = function(id){ return host.querySelector('#' + id); };
  var $$ = function(sel){ return host.querySelectorAll(sel); };

  var STORAGE_KEY = 'ksfb_board_tasks_v1';
  var COLUMNS = ['backlog', 'progress', 'review', 'done'];

  var defaultTasks = [
    { id: 't-1', col: 'backlog', title: 'Audit mobile touch targets', desc: 'Ensure all buttons have min 40px height', tag: 'Docs', prio: 'Medium' },
    { id: 't-2', col: 'progress', title: 'Implement Base64 Drag & Drop', desc: 'Support binary files and instant preview', tag: 'Feature', prio: 'High' },
    { id: 't-3', col: 'review', title: 'Optimize SVG minify algorithm', desc: 'Precision coordinate rounding tested on sample SVGs', tag: 'Refactor', prio: 'Low' },
    { id: 't-4', col: 'done', title: 'Deploy Loan Schedule Calculator', desc: 'Full amortization schedule with extra payment savings', tag: 'Feature', prio: 'High' }
  ];

  var tasks = [];

  function loadTasks() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        tasks = JSON.parse(saved);
      } else {
        tasks = JSON.parse(JSON.stringify(defaultTasks));
      }
    } catch(e) {
      tasks = JSON.parse(JSON.stringify(defaultTasks));
    }
  }

  function saveTasks() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch(e){}
  }

  function getPriorityColor(prio) {
    if (prio === 'High') return '#ff4d4d';
    if (prio === 'Medium') return '#ffc93c';
    return '#39ff14';
  }

  function renderBoard() {
    COLUMNS.forEach(function(col){
      var listEl = $('ksfb-list-' + col);
      var countEl = $('ksfb-count-' + col);
      listEl.innerHTML = '';

      var colTasks = tasks.filter(function(t){ return t.col === col; });
      countEl.textContent = colTasks.length;

      colTasks.forEach(function(t){
        var card = document.createElement('div');
        card.setAttribute('data-id', t.id);
        card.style.cssText = 'background:#131f2b;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;';

        var colIdx = COLUMNS.indexOf(t.col);
        var canMoveLeft = colIdx > 0;
        var canMoveRight = colIdx < COLUMNS.length - 1;

        card.innerHTML = '' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px;">' +
            '<span style="font-size:0.7rem;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,0.06);color:var(--text);border:1px solid rgba(255,255,255,0.1);">' + t.tag + '</span>' +
            '<span style="font-size:0.68rem;font-weight:700;color:' + getPriorityColor(t.prio) + ';">' + t.prio + '</span>' +
          '</div>' +
          '<div style="font-weight:700;font-size:0.8rem;color:var(--text);word-break:break-word;">' + (t.title || 'Untitled') + '</div>' +
          (t.desc ? '<div style="font-size:0.72rem;color:var(--text-secondary);line-height:1.3;white-space:pre-wrap;word-break:break-word;">' + t.desc + '</div>' : '') +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;border-top:1px solid rgba(255,255,255,0.05);padding-top:6px;">' +
            '<div style="display:flex;gap:4px;">' +
              (canMoveLeft ? '<button type="button" class="ksfb-move-left" style="padding:2px 6px;background:rgba(255,255,255,0.06);color:var(--text);border:1px solid rgba(255,255,255,0.15);border-radius:4px;cursor:pointer;font-size:0.7rem;">←</button>' : '') +
              (canMoveRight ? '<button type="button" class="ksfb-move-right" style="padding:2px 6px;background:rgba(255,255,255,0.06);color:var(--text);border:1px solid rgba(255,255,255,0.15);border-radius:4px;cursor:pointer;font-size:0.7rem;">→</button>' : '') +
            '</div>' +
            '<button type="button" class="ksfb-del-task" style="padding:2px 6px;background:transparent;color:#ff7878;border:0;cursor:pointer;font-size:0.7rem;">✕</button>' +
          '</div>';

        // Move event bindings
        var leftBtn = card.querySelector('.ksfb-move-left');
        if (leftBtn) {
          leftBtn.addEventListener('click', function(){
            t.col = COLUMNS[colIdx - 1];
            saveTasks();
            renderBoard();
          });
        }

        var rightBtn = card.querySelector('.ksfb-move-right');
        if (rightBtn) {
          rightBtn.addEventListener('click', function(){
            t.col = COLUMNS[colIdx + 1];
            saveTasks();
            renderBoard();
          });
        }

        var delBtn = card.querySelector('.ksfb-del-task');
        if (delBtn) {
          delBtn.addEventListener('click', function(){
            tasks = tasks.filter(function(item){ return item.id !== t.id; });
            saveTasks();
            renderBoard();
          });
        }

        listEl.appendChild(card);
      });
    });
  }

  // Toggle Add Task panel
  $('ksfb-open-add-btn').addEventListener('click', function(){
    $('ksfb-add-panel').style.display = $('ksfb-add-panel').style.display === 'none' ? 'block' : 'none';
    if ($('ksfb-add-panel').style.display === 'block') {
      $('ksfb-new-title').focus();
    }
  });

  $('ksfb-cancel-task-btn').addEventListener('click', function(){
    $('ksfb-add-panel').style.display = 'none';
  });

  $('ksfb-save-task-btn').addEventListener('click', function(){
    var title = $('ksfb-new-title').value.trim();
    if (!title) {
      alert('Please enter a task title');
      return;
    }
    var newTask = {
      id: 'task-' + Date.now() + '-' + Math.floor(Math.random()*1000),
      col: $('ksfb-new-col').value,
      tag: $('ksfb-new-tag').value,
      prio: $('ksfb-new-prio').value,
      title: title,
      desc: $('ksfb-new-desc').value.trim()
    };
    tasks.push(newTask);
    saveTasks();
    renderBoard();

    // Reset inputs
    $('ksfb-new-title').value = '';
    $('ksfb-new-desc').value = '';
    $('ksfb-add-panel').style.display = 'none';
  });

  // Export JSON
  $('ksfb-export-json-btn').addEventListener('click', function(){
    var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
    var dlAnchor = document.createElement('a');
    dlAnchor.setAttribute("href", dataStr);
    dlAnchor.setAttribute("download", "kanban-sprint-board.json");
    dlAnchor.click();
    dlAnchor.remove();
  });

  // Export Markdown
  $('ksfb-export-md-btn').addEventListener('click', function(){
    var md = '# Kanban Sprint Board Summary\n\n';
    COLUMNS.forEach(function(c){
      var colName = c === 'backlog' ? 'Backlog' : c === 'progress' ? 'In Progress' : c === 'review' ? 'Review / QA' : 'Done';
      var colTasks = tasks.filter(function(t){ return t.col === c; });
      md += '## ' + colName + ' (' + colTasks.length + ')\n';
      if (colTasks.length === 0) {
        md += '_No tasks_\n\n';
      } else {
        colTasks.forEach(function(t){
          var check = c === 'done' ? '[x]' : '[ ]';
          md += '- ' + check + ' **[' + t.tag + ']** ' + t.title + ' _(' + t.prio + ' priority)_\n';
          if (t.desc) md += '  > ' + t.desc.replace(/\n/g, '\n  > ') + '\n';
        });
        md += '\n';
      }
    });

    navigator.clipboard.writeText(md).then(function(){
      $('ksfb-status').textContent = '✓ Markdown copied!';
      setTimeout(function(){ $('ksfb-status').textContent = ''; }, 3000);
    });
  });

  // Import JSON
  $('ksfb-import-file').addEventListener('change', function(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try {
        var parsed = JSON.parse(evt.target.result);
        if (Array.isArray(parsed)) {
          tasks = parsed;
          saveTasks();
          renderBoard();
          $('ksfb-status').textContent = '✓ Board imported!';
          setTimeout(function(){ $('ksfb-status').textContent = ''; }, 3000);
        }
      } catch(err){
        alert('Invalid JSON file format.');
      }
    };
    reader.readAsText(file);
  });

  // Reset
  $('ksfb-reset-btn').addEventListener('click', function(){
    if (confirm('Reset board to default sample sprint tasks?')) {
      tasks = JSON.parse(JSON.stringify(defaultTasks));
      saveTasks();
      renderBoard();
    }
  });

  loadTasks();
  renderBoard();
})();
</script>
