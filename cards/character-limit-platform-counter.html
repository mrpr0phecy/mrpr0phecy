<h2 id="chlt-title" style="margin-top:0;color:var(--accent);">🔤 Platform Character Counter</h2>

<form aria-describedby="chlt-desc" onsubmit="event.preventDefault();">
  <p id="chlt-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Count characters against the live limits for X/Twitter, SMS, Google titles, Instagram, LinkedIn and more. Everything stays in this box — no draft is uploaded.
  </p>
  <label for="chlt-text" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Your text</label>
  <textarea id="chlt-text" rows="6" placeholder="Paste a caption, SMS or title…" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-size:.9rem;line-height:1.45;resize:vertical;"></textarea>
</form>
<div id="chlt-meta" style="margin:8px 0 12px;font-size:.8rem;color:var(--text-secondary);"></div>
<div id="chlt-list"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var LIMITS = [
    ['X / Twitter post', 280],
    ['SMS (GSM 7-bit)', 160],
    ['SMS (Unicode)', 70],
    ['Google title tag', 60],
    ['Google meta description', 160],
    ['Instagram caption', 2200],
    ['Instagram bio', 150],
    ['TikTok caption', 2200],
    ['LinkedIn post', 3000],
    ['LinkedIn headline', 220],
    ['YouTube title', 100],
    ['YouTube description', 5000],
    ['Reddit title', 300],
    ['Email subject', 60]
  ];

  function gsmLen(s) {
    var extra = 0;
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c === 10 || c === 12 || c === 13 || c === 91 || c === 92 || c === 93 || c === 94 || c === 123 || c === 124 || c === 125 || c === 126) extra++;
    }
    return s.length + extra;
  }
  function run() {
    var t = $('chlt-text').value;
    var chars = t.length, words = t.trim() ? t.trim().split(/\s+/).length : 0;
    var gsm = gsmLen(t);
    $('chlt-meta').textContent = chars.toLocaleString() + ' characters · ' + words.toLocaleString() + ' words · GSM septets ' + gsm;
    $('chlt-list').innerHTML = LIMITS.map(function (row) {
      var used = row[0].indexOf('GSM 7-bit') !== -1 ? gsm : chars;
      var pct = Math.min(100, (used / row[1]) * 100);
      var over = used > row[1];
      var left = row[1] - used;
      return '<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;gap:8px;font-size:.78rem;"><span style="color:var(--text);">' + row[0] + '</span><span style="color:' + (over ? '#ff8a8a' : 'var(--text-secondary)') + ';">' + used + ' / ' + row[1] + (over ? '  (' + Math.abs(left) + ' over)' : '  (' + left + ' left)') + '</span></div>' +
        '<div style="height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px;"><div style="height:100%;width:' + pct + '%;background:' + (over ? '#ff4d4d' : 'var(--accent)') + ';"></div></div></div>';
    }).join('');
  }
  $('chlt-text').addEventListener('input', run);
  run();
})();
</script>
