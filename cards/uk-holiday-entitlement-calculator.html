<h2 id="ukhe-title" style="margin-top:0;color:var(--accent);">🏖️ UK Holiday Entitlement</h2>

<form aria-describedby="ukhe-desc" onsubmit="event.preventDefault();">
  <p id="ukhe-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Statutory paid holiday in Great Britain is 5.6 weeks a year (28 days for a 5-day week), which may include bank holidays if your contract says so. Pro-rata for part-time and joiners. Not legal advice — your contract can be more generous, not less.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="ukhe-days" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Days worked / week</label>
      <input id="ukhe-days" type="number" min="1" max="7" step="any" value="5" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ukhe-hours" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Hours / week</label>
      <input id="ukhe-hours" type="number" min="1" max="80" step="any" value="37.5" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ukhe-start" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Started this leave year</label>
      <input id="ukhe-start" type="date" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ukhe-year" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Leave year starts</label>
      <select id="ukhe-year" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="0">1 January</option>
        <option value="3">1 April</option>
        <option value="8">1 September</option>
      </select>
    </div>
  </div>
</form>
<div id="ukhe-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var days = Number($('ukhe-days').value), hours = Number($('ukhe-hours').value);
    if (!(days > 0 && hours > 0)) return;
    var fullDays = 5.6 * days;
    var fullHours = 5.6 * hours;
    var start = $('ukhe-start').value;
    var month = Number($('ukhe-year').value);
    var now = new Date();
    var y = now.getFullYear();
    var yearStart = new Date(y, month, 1);
    if (now < yearStart) yearStart = new Date(y - 1, month, 1);
    var yearEnd = new Date(yearStart); yearEnd.setFullYear(yearEnd.getFullYear() + 1);
    var frac = 1;
    if (start) {
      var joined = new Date(start + 'T00:00:00');
      if (joined > yearStart) {
        var total = yearEnd - yearStart;
        var left = yearEnd - joined;
        frac = Math.max(0, Math.min(1, left / total));
      }
    }
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('ukhe-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Full-year days', fullDays.toFixed(1) + ' days') +
      cell('Full-year hours', fullHours.toFixed(1) + ' h') +
      cell('This year (pro-rata)', (fullDays * frac).toFixed(1) + ' days · ' + (fullHours * frac).toFixed(1) + ' h') +
      cell('Weeks', (5.6 * frac).toFixed(2)) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">gov.uk: 5.6 weeks statutory. Irregular-hours and part-year rules changed in 2024 — check the current GOV.UK page if that is you. Bank holidays are not extra unless the contract says so.</p>';
  }
  ['ukhe-days', 'ukhe-hours', 'ukhe-start', 'ukhe-year'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
