<h2 id="pomodoro-flow-title" style="margin-top:0;color:var(--accent);">⏱️ Pomodoro Flow: Gamified Deep Focus Studio</h2>

<form aria-describedby="pomodoro-flow-desc" onsubmit="event.preventDefault();">
  <p id="pomodoro-flow-desc" class="small" style="color:var(--muted);margin-bottom:16px;">
    Level up your daily productivity with science-backed 25-minute focus intervals, audio finish chimes, streak tracking, and gamified XP rewards for completed sprints.
  </p>

  <!-- Cycle Modes -->
  <div style="display:flex;gap:8px;justify-content:center;margin-bottom:20px;">
    <button type="button" class="pomo-mode-btn active" data-mins="25" style="padding:8px 18px;border-radius:20px;background:rgba(0,255,204,0.15);border:1px solid #00ffcc;color:#e6faff;font-weight:700;font-size:0.85rem;cursor:pointer;">
      🎯 Deep Focus (25m)
    </button>
    <button type="button" class="pomo-mode-btn" data-mins="5" style="padding:8px 18px;border-radius:20px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#e6faff;font-size:0.85rem;cursor:pointer;">
      ☕ Short Break (5m)
    </button>
    <button type="button" class="pomo-mode-btn" data-mins="15" style="padding:8px 18px;border-radius:20px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#e6faff;font-size:0.85rem;cursor:pointer;">
      🌴 Long Break (15m)
    </button>
  </div>

  <!-- Circular SVG Progress Display -->
  <div style="position:relative;width:200px;height:200px;margin:0 auto 20px;">
    <svg width="200" height="200" viewBox="0 0 200 200" style="transform:rotate(-90deg);">
      <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12" />
      <circle id="pomo-progress-circle" cx="100" cy="100" r="85" fill="none" stroke="#00ffcc" stroke-width="12" stroke-dasharray="534" stroke-dashoffset="0" stroke-linecap="round" style="transition:stroke-dashoffset 0.5s ease;" />
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <div id="pomo-timer-text" style="font-family:'Exo 2',sans-serif;font-size:2.6rem;font-weight:900;color:#fff;">25:00</div>
      <div id="pomo-status-label" style="font-size:0.75rem;color:var(--accent);text-transform:uppercase;letter-spacing:1px;">Focus Sprint</div>
    </div>
  </div>

  <!-- Action Controls -->
  <div style="display:flex;gap:10px;max-width:320px;margin:0 auto 20px;">
    <button type="button" id="pomo-start-btn" style="flex:1;padding:12px;border-radius:10px;background:linear-gradient(135deg, #00ffcc, #00bbff);border:none;color:#050811;font-weight:800;font-size:1rem;cursor:pointer;">
      ▶ Start Sprint
    </button>
    <button type="button" id="pomo-reset-btn" style="padding:12px 18px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.9rem;cursor:pointer;">
      ↺ Reset
    </button>
  </div>

  <!-- Gamified Stats & Tasks -->
  <div style="background:rgba(14,21,37,0.7);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:0.85rem;">
      <span>🏆 Sprints Completed: <strong id="pomo-streak-count" style="color:#ffd700;">0</strong></span>
      <span>⚡ XP Earned: <strong id="pomo-xp-count" style="color:#00ffcc;">0 XP</strong></span>
    </div>

    <div style="display:flex;gap:8px;">
      <input type="text" id="pomo-task-input" placeholder="Add sprint task (e.g., Code API endpoint or finish song hook)..." style="flex:1;padding:8px 12px;border-radius:6px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);color:inherit;font-size:0.85rem;">
      <button type="button" id="pomo-add-task-btn" style="padding:8px 14px;border-radius:6px;background:rgba(0,255,204,0.15);border:1px solid #00ffcc;color:#00ffcc;font-weight:700;cursor:pointer;">
        + Add
      </button>
    </div>
    <ul id="pomo-task-list" style="list-style:none;margin-top:10px;font-size:0.82rem;"></ul>
  </div>
</form>

<script>
(function() {
  let totalSeconds = 25 * 60;
  let remainingSeconds = totalSeconds;
  let timerId = null;
  let isRunning = false;
  let streak = 0;
  let xp = 0;

  const timerText = document.getElementById('pomo-timer-text');
  const statusLabel = document.getElementById('pomo-status-label');
  const startBtn = document.getElementById('pomo-start-btn');
  const resetBtn = document.getElementById('pomo-reset-btn');
  const progressCircle = document.getElementById('pomo-progress-circle');
  const modeBtns = document.querySelectorAll('.pomo-mode-btn');
  const streakDisplay = document.getElementById('pomo-streak-count');
  const xpDisplay = document.getElementById('pomo-xp-count');
  const taskInput = document.getElementById('pomo-task-input');
  const addTaskBtn = document.getElementById('pomo-add-task-btn');
  const taskList = document.getElementById('pomo-task-list');

  const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * 85; // ~534

  function playChime() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3); // A5
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.8);
    } catch(e) {}
  }

  function updateDisplay() {
    const mins = Math.floor(remainingSeconds / 60);
    const secs = remainingSeconds % 60;
    timerText.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

    const fraction = remainingSeconds / totalSeconds;
    const offset = CIRCLE_CIRCUMFERENCE * (1 - fraction);
    progressCircle.style.strokeDashoffset = offset;
  }

  function startTimer() {
    if (isRunning) {
      clearInterval(timerId);
      isRunning = false;
      startBtn.textContent = '▶ Resume Sprint';
      startBtn.style.background = 'linear-gradient(135deg, #00ffcc, #00bbff)';
      return;
    }

    isRunning = true;
    startBtn.textContent = '⏸ Pause';
    startBtn.style.background = 'linear-gradient(135deg, #ff4757, #ff6b81)';

    timerId = setInterval(() => {
      remainingSeconds--;
      updateDisplay();

      if (remainingSeconds <= 0) {
        clearInterval(timerId);
        isRunning = false;
        playChime();
        startBtn.textContent = '▶ Start Sprint';
        startBtn.style.background = 'linear-gradient(135deg, #00ffcc, #00bbff)';

        streak++;
        xp += 50;
        streakDisplay.textContent = streak;
        xpDisplay.textContent = `${xp} XP`;

        alert('🎯 Ding! Sprint interval complete. Take a well-deserved breather!');
        remainingSeconds = totalSeconds;
        updateDisplay();
      }
    }, 1000);
  }

  function resetTimer() {
    clearInterval(timerId);
    isRunning = false;
    remainingSeconds = totalSeconds;
    startBtn.textContent = '▶ Start Sprint';
    startBtn.style.background = 'linear-gradient(135deg, #00ffcc, #00bbff)';
    updateDisplay();
  }

  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      modeBtns.forEach(b => {
        b.style.background = 'rgba(255,255,255,0.05)';
        b.style.borderColor = 'rgba(255,255,255,0.1)';
      });
      btn.style.background = 'rgba(0,255,204,0.15)';
      btn.style.borderColor = '#00ffcc';

      const mins = parseInt(btn.dataset.mins, 10);
      totalSeconds = mins * 60;
      statusLabel.textContent = mins === 25 ? 'Focus Sprint' : (mins === 5 ? 'Short Break' : 'Long Break');
      resetTimer();
    });
  });

  startBtn.addEventListener('click', startTimer);
  resetBtn.addEventListener('click', resetTimer);

  addTaskBtn.addEventListener('click', () => {
    const txt = taskInput.value.trim();
    if (!txt) return;
    const li = document.createElement('li');
    li.style.cssText = 'padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;gap:8px;';
    li.innerHTML = `<input type="checkbox" style="cursor:pointer;"> <span>${txt}</span>`;
    li.querySelector('input').addEventListener('change', function() {
      if (this.checked) {
        li.querySelector('span').style.textDecoration = 'line-through';
        li.querySelector('span').style.opacity = '0.5';
        xp += 25;
        xpDisplay.textContent = `${xp} XP`;
      } else {
        li.querySelector('span').style.textDecoration = 'none';
        li.querySelector('span').style.opacity = '1';
      }
    });
    taskList.appendChild(li);
    taskInput.value = '';
  });

  updateDisplay();
})();
</script>
