<h2 id="lams-title" style="margin-top:0;color:var(--accent);">📅 Loan Amortization Schedule</h2>

<form aria-describedby="lams-desc" onsubmit="event.preventDefault();">
  <p id="lams-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Fixed-rate repayment loan. Payment = P × r(1+r)^n / ((1+r)^n − 1) with r = APR/12. First 24 months shown; totals cover the whole term. Not a credit decision.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="lams-p" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Principal £</label>
      <input id="lams-p" type="number" min="1" step="any" value="12000" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="lams-r" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">APR %</label>
      <input id="lams-r" type="number" min="0" step="any" value="7.9" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="lams-y" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Years</label>
      <input id="lams-y" type="number" min="1" step="1" value="5" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="lams-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function gbp(n) {
    return '£' + n.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var P = Number($('lams-p').value), apr = Number($('lams-r').value), years = Number($('lams-y').value);
    if (!(P > 0) || !(apr >= 0) || !(years > 0)) {
      $('lams-out').textContent = 'Enter principal, APR and years.';
      return;
    }
    var n = Math.round(years * 12), r = apr / 100 / 12;
    var pay = r === 0 ? P / n : P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
    var bal = P, interestTot = 0, rows = '', show = Math.min(24, n);
    for (var i = 1; i <= n; i++) {
      var interest = bal * r;
      var prin = pay - interest;
      if (prin > bal) prin = bal;
      bal -= prin;
      interestTot += interest;
      if (i <= show) {
        rows += '<tr><td style="padding:3px 8px;">' + i + '</td><td style="padding:3px 8px;">' + gbp(pay) + '</td><td style="padding:3px 8px;">' + gbp(prin) + '</td><td style="padding:3px 8px;">' + gbp(interest) + '</td><td style="padding:3px 8px;">' + gbp(Math.max(0, bal)) + '</td></tr>';
      }
    }
    $('lams-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Monthly payment', gbp(pay)) +
      cell('Total paid', gbp(pay * n)) +
      cell('Total interest', gbp(interestTot)) +
      '</div><p style="margin:10px 0 4px;font-size:.75rem;color:var(--text-secondary);">First ' + show + ' of ' + n + ' months</p>' +
      '<div style="overflow:auto;"><table style="width:100%;border-collapse:collapse;font-size:.78rem;"><thead><tr><th style="text-align:left;padding:3px 8px;">#</th><th style="text-align:left;padding:3px 8px;">Payment</th><th style="text-align:left;padding:3px 8px;">Principal</th><th style="text-align:left;padding:3px 8px;">Interest</th><th style="text-align:left;padding:3px 8px;">Balance</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  ['lams-p', 'lams-r', 'lams-y'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
