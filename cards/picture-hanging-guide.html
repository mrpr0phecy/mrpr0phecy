<!-- cards/picture-hanging-guide.html -->
<h2 id="pichang-title" style="margin-top:0;color:var(--accent);">🖼️ Picture Hanging Calculator</h2>

<form aria-describedby="pichang-desc" onsubmit="event.preventDefault();">
  <p id="pichang-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Calculate the perfect height and hook position so your pictures hang straight and look professional.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="pichang-frame-h" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Frame Height (cm)</label>
      <input id="pichang-frame-h" type="number" min="10" value="40" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="pichang-wire-sag" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Wire Sag (cm)</label>
      <input id="pichang-wire-sag" type="number" min="0" value="8" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
      <div style="font-size:0.7rem;color:var(--text-secondary);margin-top:2px;">How far the wire pulls up from the frame back</div>
    </div>
  </div>

  <div style="margin-bottom:14px;">
    <label for="pichang-eye" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Average Eye Height</label>
    <select id="pichang-eye" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="145">Standard (145 cm / 5'7")</option>
      <option value="137">Lower (137 cm / 4'6" — gallery standard)</option>
      <option value="155">Higher (155 cm / 5'1")</option>
      <option value="160">Tall (160 cm / 5'3")</option>
    </select>
  </div>

  <button type="button" onclick="pichangCalc()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🖼️ Calculate Hook Position
  </button>

  <div id="pichang-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);">
    <div style="text-align:center;margin-bottom:12px;">
      <div style="font-size:0.8rem;color:var(--text-secondary);">Hook position from floor</div>
      <div id="pichang-hook" style="font-size:2rem;color:var(--accent);font-weight:700;"></div>
    </div>
    <div id="pichang-visual" style="margin-bottom:12px;"></div>
    <div id="pichang-tips" style="font-size:0.8rem;color:var(--text-secondary);line-height:1.6;"></div>
  </div>
</form>

<script>
(function(){
  window.pichangCalc=function(){
    var frameH=parseFloat(document.getElementById('pichang-frame-h').value);
    var sag=parseFloat(document.getElementById('pichang-wire-sag').value);
    var eyeH=parseFloat(document.getElementById('pichang-eye').value);
    var centreOfPicture=eyeH;
    var topOfFrame=centreOfPicture+(frameH/2);
    var hookFromFloor=topOfFrame-sag;
    document.getElementById('pichang-hook').textContent=hookFromFloor.toFixed(1)+' cm';
    var wallH=240;
    var scale=200/wallH;
    var hookPx=hookFromFloor*scale;
    var framePx=frameH*scale;
    var html='<div style="position:relative;height:200px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.1);border-radius:8px;overflow:hidden;">';
    html+='<div style="position:absolute;bottom:0;left:0;right:0;height:1px;background:rgba(255,255,255,0.3);"></div>';
    html+='<div style="position:absolute;bottom:'+hookPx+'px;left:50%;transform:translateX(-50%);width:8px;height:8px;background:var(--accent);border-radius:50%;"></div>';
    html+='<div style="position:absolute;bottom:'+(hookPx-4)+'px;left:50%;transform:translateX(-50%);font-size:0.6rem;color:var(--accent);white-space:nowrap;">🪝 '+hookFromFloor.toFixed(0)+'cm</div>';
    var frameBottom=hookPx-sag*scale;
    html+='<div style="position:absolute;bottom:'+frameBottom+'px;left:50%;transform:translateX(-50%);width:80px;height:'+framePx+'px;border:2px solid var(--accent);border-radius:4px;"></div>';
    var eyePx=eyeH*scale;
    html+='<div style="position:absolute;bottom:'+eyePx+'px;right:8px;font-size:0.6rem;color:var(--text-secondary);">👁️ Eye level '+eyeH+'cm</div>';
    html+='<div style="position:absolute;bottom:'+eyePx+'px;left:0;right:0;height:1px;background:rgba(255,255,255,0.08);"></div>';
    html+='</div>';
    document.getElementById('pichang-visual').innerHTML=html;
    document.getElementById('pichang-tips').innerHTML='💡 <strong>Gallery standard:</strong> Centre of artwork at 145cm (57 inches) from floor.<br>💡 <strong>Multiple frames:</strong> Treat a group as one large piece — centre the group at eye level.<br>💡 <strong>Above furniture:</strong> Leave 15–20cm between the top of the furniture and the bottom of the frame.<br>💡 <strong>Use a spirit level</strong> — eyeballing it always looks crooked in photos.';
    document.getElementById('pichang-result').style.display='block';
  };
})();
</script>
