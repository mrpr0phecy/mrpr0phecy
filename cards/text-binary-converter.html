<h2>🔢 Text ↔ Binary Converter</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Convert text to binary and back. Supports ASCII, UTF-8, and custom bit lengths. Perfect for learning computer science.</p>

<div id="tb-app" style="max-width:600px;margin:0 auto;">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label style="display:block;margin-bottom:4px;color:#2dd4ff;font-size:12px;">Text</label>
      <textarea id="tb-text" style="width:100%;height:100px;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-family:monospace;font-size:14px;resize:vertical;box-sizing:border-box;" placeholder="Enter text...">Hello</textarea>
    </div>
    <div>
      <label style="display:block;margin-bottom:4px;color:#39ff14;font-size:12px;">Binary</label>
      <textarea id="tb-binary" style="width:100%;height:100px;padding:10px;border-radius:8px;border:1px solid rgba(57,255,20,0.2);background:rgba(0,0,0,0.3);color:#39ff14;font-family:monospace;font-size:14px;resize:vertical;box-sizing:border-box;" placeholder="Enter binary..."></textarea>
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <button onclick="window._tbToBinary()" style="flex:1;padding:10px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:#2dd4ff;cursor:pointer;font-weight:600;">Text → Binary</button>
    <button onclick="window._tbToText()" style="flex:1;padding:10px;background:rgba(57,255,20,0.15);border:1px solid rgba(57,255,20,0.4);border-radius:8px;color:#39ff14;cursor:pointer;font-weight:600;">Binary → Text</button>
    <button onclick="window._tbSwap()" style="padding:10px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.3);border-radius:8px;color:#ffa500;cursor:pointer;">⇄</button>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
    <label style="font-size:12px;color:rgba(230,250,255,0.5);display:flex;align-items:center;gap:4px;">
      <input id="tb-spaces" type="checkbox" checked style="accent-color:#2dd4ff;"> Space-separated
    </label>
    <label style="font-size:12px;color:rgba(230,250,255,0.5);display:flex;align-items:center;gap:4px;">
      Bits: <select id="tb-bits" style="padding:4px;border-radius:4px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:12px;">
        <option value="8" selected>8-bit</option><option value="7">7-bit</option><option value="16">16-bit</option>
      </select>
    </label>
  </div>

  <div id="tb-info" style="padding:10px;background:rgba(0,0,0,0.2);border-radius:6px;font-size:12px;color:rgba(230,250,255,0.4);"></div>
</div>

<script>
(function(){
  function toBinary(){
    var text=document.getElementById('tb-text').value;
    var bits=parseInt(document.getElementById('tb-bits').value);
    var spaces=document.getElementById('tb-spaces').checked;
    var binary='';
    for(var i=0;i<text.length;i++){
      var code=text.charCodeAt(i);
      var bin=code.toString(2).padStart(bits,'0');
      if(i>0&&spaces)binary+=' ';
      binary+=bin;
    }
    document.getElementById('tb-binary').value=binary;
    document.getElementById('tb-info').innerHTML='Characters: <b>'+text.length+'</b> · Bits per char: <b>'+bits+'</b> · Total bits: <b>'+(text.length*bits)+'</b>';
  }
  function toText(){
    var binary=document.getElementById('tb-binary').value.replace(/[^01]/g,'');
    var bits=parseInt(document.getElementById('tb-bits').value);
    var text='';
    for(var i=0;i<binary.length;i+=bits){
      var chunk=binary.slice(i,i+bits);
      if(chunk.length===bits){
        var code=parseInt(chunk,2);
        if(code>=32&&code<=126)text+=String.fromCharCode(code);
        else text+='?';
      }
    }
    document.getElementById('tb-text').value=text;
    document.getElementById('tb-info').innerHTML='Binary chunks: <b>'+Math.floor(binary.length/bits)+'</b> · Characters decoded: <b>'+text.length+'</b>';
  }
  function swap(){
    var t=document.getElementById('tb-text').value;
    var b=document.getElementById('tb-binary').value;
    document.getElementById('tb-text').value=b;
    document.getElementById('tb-binary').value=t;
  }
  window._tbToBinary=toBinary;window._tbToText=toText;window._tbSwap=swap;
  document.getElementById('tb-text').addEventListener('input',toBinary);
  toBinary();
})();
</script>
