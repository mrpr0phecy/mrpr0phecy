<h2>📐 CSS Grid Playground</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Visual CSS Grid generator. Define columns, rows, and gaps with sliders. See the result live and copy the CSS.</p>

<div id="gp-app" style="max-width:800px;margin:0 auto;">
  <div style="display:grid;grid-template-columns:250px 1fr;gap:16px;">
    <div style="padding:14px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.05);border-radius:8px;">
      <div style="font-size:13px;color:#2dd4ff;font-weight:600;margin-bottom:12px;">Grid Properties</div>
      <div style="margin-bottom:10px;">
        <label style="display:block;font-size:11px;color:rgba(230,250,255,0.5);margin-bottom:4px;">Columns: <span id="gp-cols-val">3</span></label>
        <input id="gp-cols" type="range" min="1" max="6" value="3" style="width:100%;accent-color:#2dd4ff;" />
      </div>
      <div style="margin-bottom:10px;">
        <label style="display:block;font-size:11px;color:rgba(230,250,255,0.5);margin-bottom:4px;">Rows: <span id="gp-rows-val">2</span></label>
        <input id="gp-rows" type="range" min="1" max="6" value="2" style="width:100%;accent-color:#39ff14;" />
      </div>
      <div style="margin-bottom:10px;">
        <label style="display:block;font-size:11px;color:rgba(230,250,255,0.5);margin-bottom:4px;">Column Size</label>
        <select id="gp-col-size" style="width:100%;padding:6px;border-radius:4px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:12px;">
          <option value="1fr">1fr (equal)</option><option value="auto">auto</option>
          <option value="minmax(100px,1fr)">minmax(100px,1fr)</option><option value="200px">200px fixed</option>
        </select>
      </div>
      <div style="margin-bottom:10px;">
        <label style="display:block;font-size:11px;color:rgba(230,250,255,0.5);margin-bottom:4px;">Row Size</label>
        <select id="gp-row-size" style="width:100%;padding:6px;border-radius:4px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:12px;">
          <option value="auto">auto</option><option value="1fr">1fr (equal)</option>
          <option value="minmax(80px,auto)">minmax(80px,auto)</option><option value="100px">100px fixed</option>
        </select>
      </div>
      <div style="margin-bottom:10px;">
        <label style="display:block;font-size:11px;color:rgba(230,250,255,0.5);margin-bottom:4px;">Gap: <span id="gp-gap-val">10</span>px</label>
        <input id="gp-gap" type="range" min="0" max="30" value="10" style="width:100%;accent-color:#ffa500;" />
      </div>
      <div style="margin-bottom:10px;">
        <label style="display:block;font-size:11px;color:rgba(230,250,255,0.5);margin-bottom:4px;">justify-items</label>
        <select id="gp-ji" style="width:100%;padding:6px;border-radius:4px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:12px;">
          <option value="stretch">stretch</option><option value="start">start</option>
          <option value="end">end</option><option value="center">center</option>
        </select>
      </div>
      <div style="margin-bottom:10px;">
        <label style="display:block;font-size:11px;color:rgba(230,250,255,0.5);margin-bottom:4px;">align-items</label>
        <select id="gp-ai" style="width:100%;padding:6px;border-radius:4px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:12px;">
          <option value="stretch">stretch</option><option value="start">start</option>
          <option value="end">end</option><option value="center">center</option>
        </select>
      </div>
    </div>

    <div>
      <div id="gp-preview" style="min-height:300px;background:rgba(0,0,0,0.3);border:2px solid rgba(45,212,255,0.2);border-radius:10px;padding:12px;display:grid;transition:all 0.2s;"></div>
      <div style="margin-top:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <label style="color:#2dd4ff;font-size:12px;">Generated CSS</label>
          <button onclick="window._gpCopy()" style="padding:4px 10px;background:rgba(45,212,255,0.1);border:1px solid rgba(45,212,255,0.2);border-radius:4px;color:#2dd4ff;cursor:pointer;font-size:11px;">📋 Copy</button>
        </div>
        <pre id="gp-css" style="padding:12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.05);border-radius:6px;font-size:12px;color:#39ff14;font-family:monospace;overflow-x:auto;margin:0;"></pre>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var colors=['#ff4444','#44ff44','#4444ff','#ffff44','#ff44ff','#44ffff','#ff8844','#88ff44','#ff4488','#4488ff','#88ff88','#ff88ff','#88ffff','#ffff88','#ff4400','#44ff00','#0044ff','#ff0044'];
  function update(){
    var cols=parseInt(document.getElementById('gp-cols').value);
    var rows=parseInt(document.getElementById('gp-rows').value);
    var colSize=document.getElementById('gp-col-size').value;
    var rowSize=document.getElementById('gp-row-size').value;
    var gap=document.getElementById('gp-gap').value;
    var ji=document.getElementById('gp-ji').value;
    var ai=document.getElementById('gp-ai').value;
    document.getElementById('gp-cols-val').textContent=cols;
    document.getElementById('gp-rows-val').textContent=rows;
    document.getElementById('gp-gap-val').textContent=gap;
    var preview=document.getElementById('gp-preview');
    var colStr='';for(var i=0;i<cols;i++)colStr+=(i?' ':'')+colSize;
    var rowStr='';for(var i=0;i<rows;i++)rowStr+=(i?' ':'')+rowSize;
    preview.style.gridTemplateColumns=colStr;
    preview.style.gridTemplateRows=rowStr;
    preview.style.gap=gap+'px';
    preview.style.justifyItems=ji;
    preview.style.alignItems=ai;
    var total=cols*rows;
    var items='';
    for(var i=0;i<total;i++){
      items+='<div style="background:'+colors[i%colors.length]+';border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;color:rgba(0,0,0,0.7);min-height:50px;font-size:14px;">'+(i+1)+'</div>';
    }
    preview.innerHTML=items;
    var css='.container {\n  display: grid;\n  grid-template-columns: '+colStr+';\n  grid-template-rows: '+rowStr+';\n  gap: '+gap+'px;\n  justify-items: '+ji+';\n  align-items: '+ai+';\n}';
    document.getElementById('gp-css').textContent=css;
  }
  function copy(){if(navigator.clipboard)navigator.clipboard.writeText(document.getElementById('gp-css').textContent);}
  window._gpCopy=copy;
  ['gp-cols','gp-rows','gp-gap'].forEach(function(id){document.getElementById(id).addEventListener('input',update);});
  ['gp-col-size','gp-row-size','gp-ji','gp-ai'].forEach(function(id){document.getElementById(id).addEventListener('change',update);});
  update();
})();
</script>
