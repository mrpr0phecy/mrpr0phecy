<h2 id="abvd-title" style="margin-top:0;color:var(--accent);">🥃 ABV, Proof &amp; Dilution</h2>

<form aria-describedby="abvd-desc" onsubmit="event.preventDefault();">
  <p id="abvd-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    US proof is 2 × ABV%. UK/EU labels use ABV%. Dilute with C₁V₁ = C₂V₂ (alcohol volume conserved). Mixing two bottles uses a weighted average. Not a drink-driving tool.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="abvd-abv" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">ABV %</label>
      <input id="abvd-abv" type="number" min="0" max="100" step="any" value="40" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="abvd-proof" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">US proof</label>
      <input id="abvd-proof" type="number" min="0" step="any" value="80" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="abvd-vol" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Spirit volume (ml)</label>
      <input id="abvd-vol" type="number" min="0" step="any" value="700" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="abvd-target" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Target ABV %</label>
      <input id="abvd-target" type="number" min="0" max="100" step="any" value="20" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="abvd-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var lock = false;
  function runFromAbv() {
    if (lock) return;
    var abv = Number($('abvd-abv').value);
    if (!(abv >= 0)) return;
    lock = true; $('abvd-proof').value = String(Number((abv * 2).toFixed(2))); lock = false;
    paint(abv);
  }
  function runFromProof() {
    if (lock) return;
    var p = Number($('abvd-proof').value);
    if (!(p >= 0)) return;
    lock = true; $('abvd-abv').value = String(Number((p / 2).toFixed(2))); lock = false;
    paint(p / 2);
  }
  function paint(abv) {
    var vol = Number($('abvd-vol').value), target = Number($('abvd-target').value);
    var pure = vol * abv / 100;
    var water = 0, finalVol = vol;
    if (target > 0 && target < abv) {
      finalVol = pure / (target / 100);
      water = finalVol - vol;
    }
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    var msg = target >= abv && target > 0 ? '<p style="color:#ffb8b8;font-size:.8rem;margin-top:8px;">Target must be below starting ABV to dilute with water. Distillation is not this formula.</p>' : '';
    $('abvd-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('US proof', (abv * 2).toFixed(1)) +
      cell('Pure alcohol', pure.toFixed(0) + ' ml') +
      cell('Water to add', water > 0 ? water.toFixed(0) + ' ml' : '—') +
      cell('Final volume', water > 0 ? finalVol.toFixed(0) + ' ml at ' + target + '%' : vol + ' ml') +
      '</div>' + msg +
      '<p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Old UK proof is 4/7 of ABV (100° proof ≈ 57.15% ABV) and is no longer used on labels.</p>';
  }
  $('abvd-abv').addEventListener('input', runFromAbv);
  $('abvd-proof').addEventListener('input', runFromProof);
  $('abvd-vol').addEventListener('input', runFromAbv);
  $('abvd-target').addEventListener('input', runFromAbv);
  runFromAbv();
})();
</script>
