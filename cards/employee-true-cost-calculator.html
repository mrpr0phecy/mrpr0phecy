<h2 id="employee-true-cost-calculator-title" style="margin-top:0;color:var(--accent)">👥 Employee True Cost Calculator</h2>
<form id="employee-true-cost-calculator-form" aria-describedby="employee-true-cost-calculator-desc" onsubmit="event.preventDefault();">
<p id="employee-true-cost-calculator-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:.9rem">Estimate the fully loaded annual and monthly cost of hiring beyond the headline salary. All calculations stay in your browser.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px"><div><label for="employee-true-cost-calculator-salary" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Annual salary (£)</label><input id="employee-true-cost-calculator-salary" data-key="salary" type="number" step="any" value="35000" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="employee-true-cost-calculator-tax" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Employer taxes/pension (%)</label><input id="employee-true-cost-calculator-tax" data-key="tax" type="number" step="any" value="16" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="employee-true-cost-calculator-benefits" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Annual benefits (£)</label><input id="employee-true-cost-calculator-benefits" data-key="benefits" type="number" step="any" value="2500" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="employee-true-cost-calculator-overhead" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Equipment/overhead (£)</label><input id="employee-true-cost-calculator-overhead" data-key="overhead" type="number" step="any" value="4000" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div></div>
<button type="submit" style="margin-top:16px;padding:11px 18px;border:0;border-radius:8px;background:var(--accent);color:#001018;font-weight:700;cursor:pointer">Calculate</button>
<div id="employee-true-cost-calculator-out" aria-live="polite" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:16px"></div>
<p style="color:var(--text-secondary);font-size:.78rem;margin-top:12px">Planning estimate only. Check tax, legal and contractual assumptions for your situation.</p>
</form>
<script>
(function(){
 const form=document.getElementById('employee-true-cost-calculator-form'),out=document.getElementById('employee-true-cost-calculator-out');
 const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:2}).format(Number.isFinite(n)?n:0);
 const num=(n,d=0)=>Number.isFinite(n)?n.toLocaleString('en-GB',{maximumFractionDigits:d}):'—'; const pct=n=>num(n,1)+'%';
 const dateMonths=n=>{const d=new Date();d.setDate(d.getDate()+Math.max(0,n)*30.44);return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'})};
 function calculate(){const v={};form.querySelectorAll('[data-key]').forEach(x=>v[x.dataset.key]=Number(x.value)); if(Object.values(v).some(x=>!Number.isFinite(x))){out.textContent='Enter valid numbers in every field.';return} const rows=(()=>{const extras=v.salary*v.tax/100+v.benefits+v.overhead,total=v.salary+extras; return [['Fully loaded annual cost',money(total)],['Monthly cost',money(total/12)],['Cost above salary',money(extras)],['Overhead uplift',pct(extras/v.salary*100)]];})();out.innerHTML='';rows.forEach(r=>{const box=document.createElement('div');box.style.cssText='padding:14px;border:1px solid var(--border-light);border-radius:9px;background:rgba(45,212,255,.06)';const a=document.createElement('div'),b=document.createElement('strong');a.style.cssText='color:var(--text-secondary);font-size:.8rem';b.style.cssText='display:block;color:var(--accent);font-size:1.15rem;margin-top:5px';a.textContent=r[0];b.textContent=r[1];box.append(a,b);out.append(box)})}
 form.addEventListener('submit',calculate);form.addEventListener('input',calculate);calculate();
})();
</script>
