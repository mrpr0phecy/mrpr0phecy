<h2 id="pwgt-title" style="margin-top:0;color:var(--accent);">🤰 Pregnancy Weight Gain Guide</h2>

<form aria-describedby="pwgt-desc" onsubmit="event.preventDefault();">
  <p id="pwgt-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    IOM/NAM ranges by pre-pregnancy BMI for a singleton: underweight 12.5–18 kg, healthy 11.5–16 kg, overweight 7–11.5 kg, obese 5–9 kg. A sketch for conversations with a midwife — not a target you must hit.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="pwgt-h" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Height (cm)</label>
      <input id="pwgt-h" type="number" min="120" max="220" value="165" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="pwgt-w" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Pre-pregnancy weight (kg)</label>
      <input id="pwgt-w" type="number" min="35" max="250" value="62" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="pwgt-twins" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Pregnancy</label>
      <select id="pwgt-twins" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="one">Singleton</option>
        <option value="two">Twins</option>
      </select>
    </div>
  </div>
</form>
<div id="pwgt-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var h = Number($('pwgt-h').value) / 100, w = Number($('pwgt-w').value);
    if (!(h > 0 && w > 0)) return;
    var bmi = w / (h * h);
    var band, range, twins = $('pwgt-twins').value === 'two';
    if (bmi < 18.5) { band = 'underweight'; range = twins ? [17, 25] : [12.5, 18]; }
    else if (bmi < 25) { band = 'healthy BMI'; range = twins ? [17, 25] : [11.5, 16]; }
    else if (bmi < 30) { band = 'overweight'; range = twins ? [14, 23] : [7, 11.5]; }
    else { band = 'obese BMI'; range = twins ? [11, 19] : [5, 9]; }
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('pwgt-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Pre-pregnancy BMI', bmi.toFixed(1) + ' (' + band + ')') +
      cell('Suggested gain', range[0] + '–' + range[1] + ' kg') +
      cell('In pounds', (range[0] * 2.20462).toFixed(0) + '–' + (range[1] * 2.20462).toFixed(0) + ' lb') +
      cell('End weight band', (w + range[0]).toFixed(1) + '–' + (w + range[1]).toFixed(1) + ' kg') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">First trimester is often 0.5–2 kg; most gain is later. Eating disorders, multiples and high BMI need individual advice. NICE and your maternity team override a webpage.</p>';
  }
  ['pwgt-h', 'pwgt-w', 'pwgt-twins'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
