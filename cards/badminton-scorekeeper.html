<h2 id="bdm-title" style="margin-top:0;color:var(--accent);">🏸 Badminton Match Scorer</h2>

<form aria-describedby="bdm-desc" onsubmit="event.preventDefault();" style="margin-bottom:16px;">
  <p id="bdm-desc" class="small" style="color:rgba(230,250,255,0.7);margin-bottom:16px;">
    Rally scoring to 21, win by two &mdash; but a game can only go to 30. Tap a side to add their point and this handles
    the deuce, the game win, and the best-of-three match for you.
  </p>

  <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;">
    <button type="button" id="bdm-new" style="padding:10px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.14);border-radius:8px;color:var(--text);cursor:pointer;font-weight:600;">New match</button>
    <button type="button" id="bdm-undo" style="padding:10px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.14);border-radius:8px;color:var(--text);cursor:pointer;font-weight:600;">&#8617; Undo</button>
  </div>
</form>

<div id="bdm-board" aria-live="polite" style="background:rgba(0,0,0,0.3);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,0.05);margin-bottom:12px;">
  <div id="bdm-score" style="font-size:2rem;font-weight:800;color:var(--text);text-align:center;margin-bottom:4px;">0&ndash;0</div>
  <div id="bdm-detail" style="text-align:center;font-size:0.85rem;color:rgba(230,250,255,0.6);">Game 1 &middot; first to 21, win by 2</div>
  <div id="bdm-sets" style="display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap;"></div>
</div>

<div style="display:flex;gap:10px;">
  <button type="button" id="bdm-apt" style="flex:1;padding:16px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:700;font-size:1rem;">Player A +1</button>
  <button type="button" id="bdm-bpt" style="flex:1;padding:16px;background:rgba(157,78,221,0.15);border:1px solid rgba(157,78,221,0.4);border-radius:8px;color:#c58ef0;cursor:pointer;font-weight:700;font-size:1rem;">Player B +1</button>
</div>

<div id="bdm-notice" style="margin-top:12px;font-size:0.8rem;color:var(--accent);min-height:1.2em;text-align:center;"></div>

<script>
(function () {
  var card = document.currentScript.parentNode;
  var $ = function (id) { return card.querySelector('#' + id); };

  function fresh() {
    return { a: 0, b: 0, ga: 0, gb: 0, done: false, winner: null, history: [] };
  }
  var S = fresh();

  function clone(s) { return { a: s.a, b: s.b, ga: s.ga, gb: s.gb, done: s.done, winner: s.winner, history: s.history.slice() }; }

  function gameOver() {
    if (S.a >= 30 || S.b >= 30) return true;
    return (S.a >= 21 || S.b >= 21) && Math.abs(S.a - S.b) >= 2;
  }

  function add(who) {
    if (S.done) return;
    S.history.push(clone(S));
    if (who === 'A') S.a++; else S.b++;
    if (gameOver()) {
      if (S.a > S.b) S.ga++; else S.gb++;
      if (S.ga === 2 || S.gb === 2) { S.done = true; S.winner = S.ga > S.gb ? 'A' : 'B'; }
      else { S.a = 0; S.b = 0; }
    }
    render();
  }

  function render() {
    var score = $('bdm-score'), detail = $('bdm-detail'), sets = $('bdm-sets'), notice = $('bdm-notice');
    if (S.done) {
      score.innerHTML = 'Player ' + S.winner + ' wins ' + S.ga + '&ndash;' + S.gb;
      detail.textContent = 'Match complete &mdash; best of three games.';
      sets.innerHTML = '';
      notice.textContent = '';
      return;
    }
    score.innerHTML = S.a + '&ndash;' + S.b;
    detail.textContent = 'Game ' + (S.ga + S.gb + 1) + ' &middot; sets ' + S.ga + '&ndash;' + S.gb + ' &middot; first to 21, win by 2';
    // set chips
    var chips = '';
    for (var i = 0; i < S.ga + S.gb; i++) chips += '<span style="padding:3px 9px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:5px;font-size:0.8rem;">game ' + (i + 1) + '</span>';
    sets.innerHTML = chips || '<span style="font-size:0.8rem;color:rgba(230,250,255,0.4);">no games completed yet</span>';
    // notices
    if (S.a === 20 && S.b === 20) notice.textContent = 'Deuce &mdash; win by two, up to 30.';
    else if ((S.a === 20 && S.a > S.b) || (S.b === 20 && S.b > S.a)) notice.textContent = 'Game point &mdash; one more (with a two-point lead).';
    else if (S.a >= 29 || S.b >= 29) notice.textContent = 'Next point decides the game at 30.';
    else if (S.ga === 1 || S.gb === 1) notice.textContent = 'Deciding game.';
    else notice.textContent = '';
  }

  $('bdm-apt').addEventListener('click', function () { add('A'); });
  $('bdm-bpt').addEventListener('click', function () { add('B'); });
  $('bdm-undo').addEventListener('click', function () { if (S.history.length) { S = S.history.pop(); render(); } });
  $('bdm-new').addEventListener('click', function () { S = fresh(); render(); });

  render();
})();
</script>
