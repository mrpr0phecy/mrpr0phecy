<h2 id="mdtg-title" style="margin-top:0;color:var(--accent);">▦ Markdown Table Generator</h2>

<form aria-describedby="mdtg-desc" onsubmit="event.preventDefault();">
  <p id="mdtg-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Paste CSV or TSV (header in row 1). Pipes in cells are escaped. Alignment is applied to every column. Copy into GitHub, Reddit or a README.
  </p>
  <label for="mdtg-in" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">CSV / TSV</label>
  <textarea id="mdtg-in" rows="7" spellcheck="false" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;">Name,Score,City
Ada,98,London
Grace,91,New York</textarea>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px;align-items:end;">
    <div>
      <label for="mdtg-al" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Align</label>
      <select id="mdtg-al" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="l">Left</option>
        <option value="c">Centre</option>
        <option value="r">Right</option>
      </select>
    </div>
    <button type="button" id="mdtg-copy" style="padding:10px 14px;border-radius:8px;border:1px solid rgba(45,212,255,.4);background:rgba(45,212,255,.12);color:var(--accent);font-weight:700;cursor:pointer;min-height:40px;">Copy markdown</button>
  </div>
</form>
<pre id="mdtg-out" style="margin-top:14px;padding:12px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);overflow:auto;font-size:.8rem;white-space:pre-wrap;"></pre>
<p id="mdtg-msg" style="margin:8px 0 0;font-size:.75rem;color:var(--text-secondary);"></p>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function parse(text) {
    var lines = text.replace(/\r/g, '').split('\n').filter(function (l) { return l.trim(); });
    if (!lines.length) return [];
    var delim = lines[0].indexOf('\t') !== -1 ? '\t' : ',';
    return lines.map(function (line) {
      if (delim === '\t') return line.split('\t');
      var cells = [], cur = '', q = false;
      for (var i = 0; i < line.length; i++) {
        var c = line.charAt(i);
        if (c === '"') { q = !q; continue; }
        if (c === ',' && !q) { cells.push(cur); cur = ''; }
        else cur += c;
      }
      cells.push(cur);
      return cells;
    });
  }
  function esc(s) { return String(s).replace(/\|/g, '\\|').trim(); }
  function run() {
    var rows = parse($('mdtg-in').value);
    if (!rows.length) { $('mdtg-out').textContent = ''; return; }
    var cols = rows.reduce(function (m, r) { return Math.max(m, r.length); }, 0);
    rows = rows.map(function (r) {
      while (r.length < cols) r.push('');
      return r.map(esc);
    });
    var al = $('mdtg-al').value;
    var bar = al === 'c' ? ':---:' : al === 'r' ? '---:' : '---';
    var sep = [];
    for (var i = 0; i < cols; i++) sep.push(bar);
    var md = '| ' + rows[0].join(' | ') + ' |\n| ' + sep.join(' | ') + ' |\n';
    for (var r = 1; r < rows.length; r++) md += '| ' + rows[r].join(' | ') + ' |\n';
    $('mdtg-out').textContent = md.trim();
  }
  $('mdtg-in').addEventListener('input', run);
  $('mdtg-al').addEventListener('change', run);
  $('mdtg-copy').addEventListener('click', function () {
    var t = $('mdtg-out').textContent;
    if (navigator.clipboard && t) navigator.clipboard.writeText(t).then(function () { $('mdtg-msg').textContent = 'Copied.'; });
  });
  run();
})();
</script>
