<!-- cards/mrprophecy-rhythm-tap.html -->
<h2 id="mprt-title" style="margin-top:0;color:var(--accent);">🥁 MrProphecy: Rhythm Tap</h2>

<p id="mprt-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
  Four-lane rhythm game scored on timing and combo, running over real MrProphecy tracks. Nothing plays until you start.
</p>

<div style="position:relative;">
  <canvas id="mprt-cv" width="600" height="300" style="width:100%;height:auto;display:block;background:#080d16;border:1px solid rgba(255,255,255,0.12);border-radius:10px;touch-action:none;"></canvas>
  <div id="mprt-ov" style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,8,14,.8);border-radius:10px;text-align:center;padding:16px;">
    <div>
      <div style="font-size:1.1rem;font-weight:900;color:var(--accent);margin-bottom:6px;">RHYTHM TAP</div>
      <div class="small" style="color:var(--text-secondary);margin-bottom:12px;">Hit the notes on the line. Keys D F J K, or tap the lanes.</div>
      <button type="button" id="mprt-start" style="background:var(--accent);color:#04141c;border:0;padding:11px 26px;border-radius:100px;font-weight:800;cursor:pointer;">&#9654; Start</button>
    </div>
  </div>
</div>
<div style="display:flex;gap:16px;margin-top:8px;font-size:0.8rem;color:var(--text-secondary);flex-wrap:wrap;">
  <span>Score <b id="mprt-score" style="color:var(--text);">0</b></span>
  <span>Combo <b id="mprt-combo" style="color:var(--success);">0</b></span>
  <span>Best combo <b id="mprt-bc" style="color:var(--premium);">0</b></span>
  <span>Accuracy <b id="mprt-acc" style="color:var(--text);">100%</b></span>
</div>

  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);">
    <button type="button" id="mprt-mute" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);padding:6px 12px;border-radius:100px;font-size:0.75rem;font-weight:700;cursor:pointer;">&#128266; Music on</button>
    <button type="button" id="mprt-skip" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);padding:6px 12px;border-radius:100px;font-size:0.75rem;font-weight:700;cursor:pointer;">&#9197; Next track</button>
    <span id="mprt-track" class="small" style="color:var(--text-secondary);font-size:0.75rem;"></span>
    <a href="https://www.youtube.com/@MrProphecy?sub_confirmation=1" target="_blank" rel="noopener noreferrer" style="margin-left:auto;font-size:0.72rem;color:var(--accent);text-decoration:none;font-weight:700;">Music by MrProphecy &#8599;</a>
  </div>

<script>
(function () {
  'use strict';

  /* ---- MrProphecy audio bed -------------------------------------------
     A hidden YouTube IFrame player. The API script is not even injected
     until the player first starts, so the card costs nothing until played
     and no third-party request is made on page load.                   */
  var mprtTRACKS = [{"id": "XHK3oUuT4eQ", "n": "Infighting"}, {"id": "U7OknSZ6iGE", "n": "Invasion"}, {"id": "U1NjAln59-g", "n": "Inferno"}, {"id": "MUAgPsbgMpQ", "n": "Init"}, {"id": "SX_CbWF2rp4", "n": "Integrate"}];
  var mprtyt = null, mprtytReady = false, mprtpending = false, mprtti = 0, mprtmuted = false;

  function mprtbootAudio() {
    if (mprtyt || document.getElementById('mprt-ytwrap')) return;
    var w = document.createElement('div');
    w.id = 'mprt-ytwrap';
    w.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;overflow:hidden;';
    var d = document.createElement('div'); d.id = 'mprt-ythost';
    w.appendChild(d); document.body.appendChild(w);

    function make() {
      mprtyt = new YT.Player('mprt-ythost', {
        host: 'https://www.youtube-nocookie.com',
        width: 1, height: 1,
        videoId: mprtTRACKS[mprtti].id,
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, playsinline: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: function (e) {
            mprtytReady = true;
            e.target.setVolume(38);
            if (mprtpending) { mprtpending = false; e.target.playVideo(); }
            mprtlabel();
          },
          onStateChange: function (e) { if (e.data === YT.PlayerState.ENDED) mprtnextTrack(); },
          onError: function () { mprtnextTrack(); }
        }
      });
    }
    if (window.YT && window.YT.Player) { make(); return; }
    var prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function () { if (typeof prev === 'function') prev(); make(); };
    if (!document.querySelector('script[src*="youtube.com/iframe_api"]')) {
      var sc = document.createElement('script');
      sc.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(sc);
    }
  }
  function mprtlabel() {
    var el = document.getElementById('mprt-track');
    if (el) el.textContent = mprtmuted ? 'muted' : ('\u266a ' + mprtTRACKS[mprtti].n);
  }
  function mprtmusicOn() {
    if (mprtmuted) return;
    mprtbootAudio();
    if (mprtytReady && mprtyt) mprtyt.playVideo(); else mprtpending = true;
  }
  function mprtmusicOff() {
    mprtpending = false;
    if (mprtytReady && mprtyt) try { mprtyt.pauseVideo(); } catch (e) {}
  }
  function mprtnextTrack() {
    mprtti = (mprtti + 1) % mprtTRACKS.length;
    if (mprtytReady && mprtyt) { mprtyt.loadVideoById(mprtTRACKS[mprtti].id); }
    mprtlabel();
  }
  function mprttoggleMute() {
    mprtmuted = !mprtmuted;
    var b = document.getElementById('mprt-mute');
    if (b) b.textContent = mprtmuted ? '\ud83d\udd07 Music off' : '\ud83d\udd0a Music on';
    if (mprtmuted) mprtmusicOff(); else if (mprtrunning) mprtmusicOn();
    mprtlabel();
  }


  var cv = document.getElementById('mprt-cv'), cx = cv.getContext('2d');
  var W = 600, H = 300, LANES = 4, LW = W / LANES, HIT = 250;
  var mprtrunning = false, raf = null, notes = [], t0 = 0, spawn = 0;
  var mprtscore = 0, combo = 0, bestc = 0, hits = 0, total = 0, flash = [0,0,0,0];
  var COL = ['#2dd4ff', '#ffc93c', '#ff2e63', '#39ff14'];

  function reset() { notes = []; mprtscore = 0; combo = 0; hits = 0; total = 0; spawn = 0; }

  function hitLane(l) {
    if (!mprtrunning) return;
    flash[l] = 8;
    var bi = -1, bd = 1e9;
    for (var i = 0; i < notes.length; i++) {
      if (notes[i].l !== l || notes[i].dead) continue;
      var d = Math.abs(notes[i].y - HIT);
      if (d < bd) { bd = d; bi = i; }
    }
    if (bi >= 0 && bd < 42) {
      notes[bi].dead = true; hits++; total++; combo++;
      bestc = Math.max(bestc, combo);
      mprtscore += (bd < 16 ? 100 : bd < 28 ? 60 : 30) + combo * 2;
    } else { combo = 0; total++; }
    sync();
  }
  function sync() {
    document.getElementById('mprt-score').textContent = mprtscore;
    document.getElementById('mprt-combo').textContent = combo;
    document.getElementById('mprt-bc').textContent = bestc;
    document.getElementById('mprt-acc').textContent = total ? Math.round(hits / total * 100) + '%' : '100%';
  }
  function loop(ts) {
    if (!mprtrunning) return;
    if (!t0) t0 = ts;
    var dt = Math.min(2.5, (ts - t0) / 16.7); t0 = ts;
    spawn -= dt;
    if (spawn <= 0) { notes.push({ l: Math.floor(Math.random() * LANES), y: -20, dead: false }); spawn = 22 + Math.random() * 26; }

    cx.clearRect(0, 0, W, H);
    cx.fillStyle = '#080d16'; cx.fillRect(0, 0, W, H);
    for (var l = 0; l < LANES; l++) {
      cx.globalAlpha = flash[l] > 0 ? .28 : .07; cx.fillStyle = COL[l];
      cx.fillRect(l * LW, 0, LW - 2, H); cx.globalAlpha = 1;
      if (flash[l] > 0) flash[l] -= dt;
    }
    cx.strokeStyle = 'rgba(255,255,255,.5)'; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(0, HIT); cx.lineTo(W, HIT); cx.stroke();

    for (var i = notes.length - 1; i >= 0; i--) {
      var n = notes[i]; n.y += 3.4 * dt;
      if (n.dead) { notes.splice(i, 1); continue; }
      if (n.y > H + 20) { notes.splice(i, 1); combo = 0; total++; sync(); continue; }
      cx.fillStyle = COL[n.l];
      cx.fillRect(n.l * LW + 8, n.y - 9, LW - 18, 18);
    }
    cx.fillStyle = 'rgba(255,255,255,.55)'; cx.font = 'bold 13px system-ui'; cx.textAlign = 'center';
    ['D','F','J','K'].forEach(function (k, i) { cx.fillText(k, i * LW + LW / 2, HIT + 30); });
    raf = requestAnimationFrame(loop);
  }
  function start() {
    document.getElementById('mprt-ov').style.display = 'none';
    reset(); mprtrunning = true; t0 = 0; sync(); mprtmusicOn();
    raf = requestAnimationFrame(loop);
    clearTimeout(window.mprtend);
    window.mprtend = setTimeout(stop, 75000);
  }
  function stop() {
    mprtrunning = false; if (raf) cancelAnimationFrame(raf); mprtmusicOff();
    var ov = document.getElementById('mprt-ov'); ov.style.display = 'grid';
    ov.querySelector('div').innerHTML =
      '<div style="font-size:1.1rem;font-weight:900;color:var(--premium);margin-bottom:6px;">SET COMPLETE</div>' +
      '<div class="small" style="color:var(--text-secondary);margin-bottom:12px;">Score ' + mprtscore + ' &middot; Best combo ' + bestc + ' &middot; ' + (total ? Math.round(hits/total*100) : 100) + '% accuracy</div>' +
      '<button type="button" id="mprt-start" style="background:var(--accent);color:#04141c;border:0;padding:11px 26px;border-radius:100px;font-weight:800;cursor:pointer;">&#8635; Again</button>';
    ov.querySelector('#mprt-start').addEventListener('click', start);
  }
  document.getElementById('mprt-start').addEventListener('click', start);
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var r = cv.getBoundingClientRect();
    hitLane(Math.max(0, Math.min(3, Math.floor((e.clientX - r.left) / (r.width / 4)))));
  });
  document.addEventListener('keydown', function (e) {
    if (!mprtrunning) return;
    var m = { d: 0, f: 1, j: 2, k: 3 }[e.key.toLowerCase()];
    if (m !== undefined) { e.preventDefault(); hitLane(m); }
  });


  document.getElementById('mprt-mute').addEventListener('click', mprttoggleMute);
  document.getElementById('mprt-skip').addEventListener('click', function () {
    mprtnextTrack();
    if (mprtrunning && !mprtmuted) mprtmusicOn();
  });
  mprtlabel();

})();
</script>
