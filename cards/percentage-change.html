<h2 id="percentage-change-title" style="margin-top:0;color:var(--accent);">📈 Percentage Change Calculator</h2>

<form style="margin-bottom:16px;">
  <p class="small" style="color:rgba(230,250,255,0.7);margin-bottom:16px;">
    Calculate percentage increase or decrease between two values.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
    <div>
      <label for="pc-old" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">📋 Original Value</label>
      <input id="pc-old" type="number" step="any" value="100"
             style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    </div>
    <div>
      <label for="pc-new" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">📦 New Value</label>
      <input id="pc-new" type="number" step="any" value="125"
             style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(57,255,20,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    </div>
  </div>

  <div style="display:flex;gap:8px;">
    <button type="button" onclick="(function(b){var f=b.closest('form');var old=parseFloat(f.querySelector('#pc-old').value);var neu=parseFloat(f.querySelector('#pc-new').value);if(isNaN(old)||isNaN(neu)){f.parentElement.querySelector('#percenpc-res').textContent='⚠ Enter both values';f.parentElement.querySelector('#percenpc-detail').textContent='';return;}if(old===0){f.parentElement.querySelector('#percenpc-res').textContent='⚠ Cannot calculate';f.parentElement.querySelector('#percenpc-detail').textContent='Original value cannot be zero.';return;}var diff=neu-old;var pct=(diff/old)*100;var res=f.parentElement.querySelector('#percenpc-res');var det=f.parentElement.querySelector('#percenpc-detail');res.textContent=(pct>=0?'+':'')+pct.toFixed(2)+'%';res.style.color=pct>0?'#39ff14':pct<0?'#ff4d4d':'var(--accent)';det.textContent=old+' → '+neu+' = '+(diff>=0?'+':'')+diff.toFixed(2)+' change ('+(pct>=0?'increase':'decrease')+')';})(this)"
            style="padding:12px 24px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:600;">Calculate</button>
    <button type="button" onclick="(function(b){var f=b.closest('form');f.reset();f.parentElement.querySelector('#percenpc-res').textContent='–';f.parentElement.querySelector('#percenpc-res').style.color='var(--accent)';f.parentElement.querySelector('#percenpc-detail').textContent='';})(this)"
            style="padding:12px 24px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(230,250,255,0.7);cursor:pointer;">Reset</button>
  </div>
</form>

<div class="results" aria-live="polite" style="background:rgba(0,0,0,0.3);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,0.05);">
  <div style="text-align:center;">
    <div style="font-size:0.8rem;color:rgba(230,250,255,0.5);margin-bottom:4px;">Percentage Change</div>
    <div id="percenpc-res" style="font-size:2rem;font-weight:700;color:var(--accent);">–</div>
    <div id="percenpc-detail" style="font-size:0.85rem;color:rgba(230,250,255,0.4);margin-top:4px;"></div>
  </div>
</div>

<details style="margin-top:12px;color:rgba(230,250,255,0.5);">
  <summary style="cursor:pointer;font-size:0.85rem;">📐 Formula</summary>
  <p style="margin-top:8px;">
    % Change = ((New - Original) / Original) × 100<br>
    Positive result = increase, negative = decrease.
  </p>
</details>
