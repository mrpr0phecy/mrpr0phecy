<h2 id="btrh-title" style="margin-top:0;color:var(--accent);">🔋 Battery Runtime (mAh)</h2>

<form aria-describedby="btrh-desc" onsubmit="event.preventDefault();">
  <p id="btrh-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Hours ≈ (capacity mAh × (voltage / load voltage) × efficiency) / load mA. A 2000 mAh cell at 100 mA is about 20 hours at 100% — real packs are less because of cut-off voltage and converter loss.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="btrh-mah" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Capacity (mAh)</label>
      <input id="btrh-mah" type="number" min="1" step="any" value="2000" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="btrh-load" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Load (mA)</label>
      <input id="btrh-load" type="number" min="0.01" step="any" value="150" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="btrh-vbat" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Cell voltage</label>
      <input id="btrh-vbat" type="number" min="0.1" step="any" value="3.7" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="btrh-vout" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Load voltage</label>
      <input id="btrh-vout" type="number" min="0.1" step="any" value="5" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="btrh-eff" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Converter efficiency %</label>
      <input id="btrh-eff" type="number" min="1" max="100" value="85" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="btrh-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function fmt(h) {
    if (h < 1) return Math.round(h * 60) + ' min';
    var hr = Math.floor(h), m = Math.round((h - hr) * 60);
    return hr + ' h ' + m + ' min';
  }
  function run() {
    var mah = Number($('btrh-mah').value), load = Number($('btrh-load').value);
    var vbat = Number($('btrh-vbat').value), vout = Number($('btrh-vout').value), eff = Number($('btrh-eff').value) / 100;
    if (!(mah > 0 && load > 0 && vbat > 0 && vout > 0 && eff > 0)) return;
    var wattH = (mah / 1000) * vbat;
    var loadW = (load / 1000) * vout;
    var hours = (wattH * eff) / loadW;
    var naive = mah / load;
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('btrh-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Estimated runtime', fmt(hours)) +
      cell('If same voltage (naive)', fmt(naive)) +
      cell('Pack energy', wattH.toFixed(2) + ' Wh') +
      cell('Load', loadW.toFixed(2) + ' W') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Set load voltage = cell voltage and 100% efficiency for a direct mAh ÷ mA estimate (coin cells, LEDs on the same rail). Boosting 3.7 V to 5 V USB costs energy.</p>';
  }
  ['btrh-mah', 'btrh-load', 'btrh-vbat', 'btrh-vout', 'btrh-eff'].forEach(function (id) {
    $(id).addEventListener('input', run);
  });
  run();
})();
</script>
