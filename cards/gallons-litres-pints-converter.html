<h2 id="glpt-title" style="margin-top:0;color:var(--accent);">🍺 Gallons, Litres &amp; Pints</h2>

<form aria-describedby="glpt-desc" onsubmit="event.preventDefault();">
  <p id="glpt-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    UK pint is 568 ml; US pint is 473 ml. UK gallon is 4.54609 L; US gallon is 3.78541 L. Edit any box — the others follow using the same liquid volume. Cooking cups are a different mess.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="glpt-l" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Litres</label>
      <input id="glpt-l" type="number" min="0" step="any" value="1" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="glpt-ukpt" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">UK pints</label>
      <input id="glpt-ukpt" type="number" min="0" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="glpt-uspt" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">US pints</label>
      <input id="glpt-uspt" type="number" min="0" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="glpt-ukgal" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">UK gallons</label>
      <input id="glpt-ukgal" type="number" min="0" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="glpt-usgal" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">US gallons</label>
      <input id="glpt-usgal" type="number" min="0" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="glpt-ml" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Millilitres</label>
      <input id="glpt-ml" type="number" min="0" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="glpt-out" style="margin-top:14px;font-size:.82rem;color:var(--text-secondary);"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var UK_PT = 0.56826125, US_PT = 0.473176473, UK_GAL = 4.54609, US_GAL = 3.785411784;
  var lock = false;
  function apply(L) {
    if (!(L >= 0) || lock) return;
    lock = true;
    $('glpt-l').value = String(Number(L.toFixed(4)));
    $('glpt-ml').value = String(Number((L * 1000).toFixed(1)));
    $('glpt-ukpt').value = String(Number((L / UK_PT).toFixed(4)));
    $('glpt-uspt').value = String(Number((L / US_PT).toFixed(4)));
    $('glpt-ukgal').value = String(Number((L / UK_GAL).toFixed(4)));
    $('glpt-usgal').value = String(Number((L / US_GAL).toFixed(4)));
    lock = false;
    $('glpt-out').textContent = Number((L * 1000).toFixed(0)) + ' ml  ·  ' + (L / UK_PT).toFixed(2) + ' UK pints  ·  ' + (L / US_GAL).toFixed(2) + ' US gal';
  }
  $('glpt-l').addEventListener('input', function () { apply(Number($('glpt-l').value)); });
  $('glpt-ml').addEventListener('input', function () { apply(Number($('glpt-ml').value) / 1000); });
  $('glpt-ukpt').addEventListener('input', function () { apply(Number($('glpt-ukpt').value) * UK_PT); });
  $('glpt-uspt').addEventListener('input', function () { apply(Number($('glpt-uspt').value) * US_PT); });
  $('glpt-ukgal').addEventListener('input', function () { apply(Number($('glpt-ukgal').value) * UK_GAL); });
  $('glpt-usgal').addEventListener('input', function () { apply(Number($('glpt-usgal').value) * US_GAL); });
  apply(1);
})();
</script>
