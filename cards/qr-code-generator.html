<h2>📱 QR Code Generator</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Generate QR codes instantly — all processing happens in your browser. No data leaves your device. Supports URLs, text, WiFi, email, and more.</p>

<div style="display:flex;gap:16px;flex-wrap:wrap;">
  <!-- Input Panel -->
  <div style="flex:1;min-width:280px;">
    <div style="margin-bottom:12px;">
      <div style="color:var(--accent);font-weight:600;margin-bottom:6px;font-size:13px;">Content Type</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="qrType active" data-type="url" style="padding:6px 12px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);color:var(--accent);border-radius:6px;cursor:pointer;font-size:12px;">URL</button>
        <button class="qrType" data-type="text" style="padding:6px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;">Text</button>
        <button class="qrType" data-type="wifi" style="padding:6px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;">WiFi</button>
        <button class="qrType" data-type="email" style="padding:6px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;">Email</button>
        <button class="qrType" data-type="phone" style="padding:6px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;">Phone</button>
      </div>
    </div>
    
    <div id="qrInputs">
      <div id="qrInputUrl" style="margin-bottom:10px;">
        <input id="qrUrl" type="url" placeholder="https://example.com" style="width:100%;padding:10px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:var(--text);font-size:14px;outline:none;">
      </div>
      <div id="qrInputText" style="display:none;margin-bottom:10px;">
        <textarea id="qrText" placeholder="Enter any text..." style="width:100%;height:80px;padding:10px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:var(--text);font-size:14px;resize:vertical;outline:none;"></textarea>
      </div>
      <div id="qrInputWifi" style="display:none;margin-bottom:10px;">
        <input id="qrWifiSsid" placeholder="Network Name (SSID)" style="width:100%;padding:8px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:var(--text);font-size:13px;outline:none;margin-bottom:6px;">
        <input id="qrWifiPass" type="password" placeholder="Password" style="width:100%;padding:8px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:var(--text);font-size:13px;outline:none;margin-bottom:6px;">
        <select id="qrWifiEnc" style="width:100%;padding:8px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:var(--text);font-size:13px;outline:none;">
          <option value="WPA">WPA/WPA2</option>
          <option value="WEP">WEP</option>
          <option value="">None (Open)</option>
        </select>
      </div>
      <div id="qrInputEmail" style="display:none;margin-bottom:10px;">
        <input id="qrEmailTo" type="email" placeholder="recipient@example.com" style="width:100%;padding:8px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:var(--text);font-size:13px;outline:none;margin-bottom:6px;">
        <input id="qrEmailSubject" placeholder="Subject" style="width:100%;padding:8px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:var(--text);font-size:13px;outline:none;margin-bottom:6px;">
        <textarea id="qrEmailBody" placeholder="Message body" style="width:100%;height:50px;padding:8px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:var(--text);font-size:13px;resize:vertical;outline:none;"></textarea>
      </div>
      <div id="qrInputPhone" style="display:none;margin-bottom:10px;">
        <input id="qrPhone" type="tel" placeholder="+1234567890" style="width:100%;padding:10px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:var(--text);font-size:14px;outline:none;">
      </div>
    </div>
    
    <!-- Options -->
    <div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
      <div>
        <div style="color:rgba(230,250,255,0.5);font-size:11px;margin-bottom:4px;">Size</div>
        <select id="qrSize" style="padding:6px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:var(--text);font-size:12px;">
          <option value="200">200px</option>
          <option value="300" selected>300px</option>
          <option value="400">400px</option>
          <option value="500">500px</option>
        </select>
      </div>
      <div>
        <div style="color:rgba(230,250,255,0.5);font-size:11px;margin-bottom:4px;">Foreground</div>
        <input id="qrFg" type="color" value="#000000" style="width:40px;height:30px;border:none;background:none;cursor:pointer;">
      </div>
      <div>
        <div style="color:rgba(230,250,255,0.5);font-size:11px;margin-bottom:4px;">Background</div>
        <input id="qrBg" type="color" value="#ffffff" style="width:40px;height:30px;border:none;background:none;cursor:pointer;">
      </div>
    </div>
    
    <button id="qrGenerate" style="width:100%;padding:12px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);color:var(--accent);border-radius:8px;cursor:pointer;font-weight:700;font-size:16px;">Generate QR Code</button>
  </div>
  
  <!-- Output Panel -->
  <div style="flex:1;min-width:280px;display:flex;flex-direction:column;align-items:center;">
    <div id="qrCanvasWrap" style="background:#fff;border-radius:12px;padding:20px;margin-bottom:12px;display:none;">
      <canvas id="qrCanvas"></canvas>
    </div>
    <div id="qrPlaceholder" style="width:300px;height:300px;border:2px dashed rgba(255,255,255,0.1);border-radius:12px;display:flex;align-items:center;justify-content:center;color:rgba(230,250,255,0.3);font-size:14px;">QR code appears here</div>
    <div id="qrActions" style="display:none;gap:8px;margin-top:8px;">
      <button id="qrDownload" style="padding:8px 16px;background:rgba(57,255,20,0.15);border:1px solid rgba(57,255,20,0.4);color:#39ff14;border-radius:6px;cursor:pointer;font-weight:600;">Download PNG</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var currentType='url';

// Type switching
document.querySelectorAll('.qrType').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.qrType').forEach(function(b){b.style.background='rgba(255,255,255,0.05)';b.style.borderColor='rgba(255,255,255,0.1)';b.style.color='var(--text)';b.classList.remove('active');});
    this.style.background='rgba(45,212,255,0.15)';this.style.borderColor='rgba(45,212,255,0.4)';this.style.color='var(--accent)';this.classList.add('active');
    currentType=this.dataset.type;
    ['qrInputUrl','qrInputText','qrInputWifi','qrInputEmail','qrInputPhone'].forEach(function(id){document.getElementById(id).style.display='none';});
    document.getElementById('qrInput'+currentType.charAt(0).toUpperCase()+currentType.slice(1)).style.display='block';
  });
});

function getContent(){
  switch(currentType){
    case 'url':return document.getElementById('qrUrl').value||'https://example.com';
    case 'text':return document.getElementById('qrText').value||'Hello World';
    case 'wifi':var s=document.getElementById('qrWifiSsid').value,p=document.getElementById('qrWifiPass').value,e=document.getElementById('qrWifiEnc').value;return 'WIFI:T:'+e+';S:'+s+';P:'+p+';;';
    case 'email':var to=document.getElementById('qrEmailTo').value,subj=document.getElementById('qrEmailSubject').value,body=document.getElementById('qrEmailBody').value;return 'mailto:'+to+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
    case 'phone':return 'tel:'+document.getElementById('qrPhone').value;
    default:return '';
  }
}

// QR Code generator (zero-dependency, using Reed-Solomon)
// Simplified but functional QR encoder
function generateQR(text,size,fg,bg){
  var canvas=document.getElementById('qrCanvas');
  canvas.width=size;canvas.height=size;
  var ctx=canvas.getContext('2d');
  
  // Use a simple encoding approach
  // For production, use a proper QR library, but this works for most content
  var modules=encodeQR(text);
  var moduleCount=modules.length;
  var cellSize=size/moduleCount;
  
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,size,size);
  ctx.fillStyle=fg;
  
  for(var r=0;r<moduleCount;r++){
    for(var c=0;c<moduleCount;c++){
      if(modules[r][c]){
        ctx.fillRect(c*cellSize,r*cellSize,cellSize+0.5,cellSize+0.5);
      }
    }
  }
}

// Minimal QR encoder (Version 1-4, Byte mode, L error correction)
function encodeQR(text){
  var data=new TextEncoder().encode(text);
  var version=1;
  var capacity=17; // V1-L: 17 bytes
  if(data.length>17){version=2;capacity=32;}
  if(data.length>32){version=3;capacity=53;}
  if(data.length>53){version=4;capacity=78;}
  if(data.length>78){version=5;capacity=106;}
  if(data.length>106){version=6;capacity=134;}
  if(data.length>134){version=7;capacity=154;}
  if(data.length>154){version=8;capacity=192;}
  if(data.length>192){version=9;capacity=230;}
  if(data.length>230){version=10;capacity=271;}
  if(data.length>271){version=10;data=data.slice(0,271);} // Truncate if too long
  
  var size=17+version*4;
  var matrix=[];
  var reserved=[];
  for(var i=0;i<size;i++){matrix[i]=[];reserved[i]=[];for(var j=0;j<size;j++){matrix[i][j]=false;reserved[i][j]=false;}}
  
  // Place finder patterns
  placeFinder(matrix,reserved,0,0);
  placeFinder(matrix,reserved,size-7,0);
  placeFinder(matrix,reserved,0,size-7);
  
  // Place alignment patterns (V2+)
  if(version>=2){
    var alignPos=getAlignmentPositions(version);
    for(var i=0;i<alignPos.length;i++){
      for(var j=0;j<alignPos.length;j++){
        var ar=alignPos[i],ac=alignPos[j];
        if(reserved[ar][ac])continue;
        placeAlignment(matrix,reserved,ar,ac);
      }
    }
  }
  
  // Place timing patterns
  for(var i=8;i<size-8;i++){
    if(!reserved[6][i]){matrix[6][i]=i%2===0;reserved[6][i]=true;}
    if(!reserved[i][6]){matrix[i][6]=i%2===0;reserved[i][6]=true;}
  }
  
  // Reserve format info
  for(var i=0;i<8;i++){
    reserved[8][i]=true;reserved[i][8]=true;
    reserved[8][size-1-i]=true;reserved[size-1-i][8]=true;
  }
  reserved[8][8]=true;
  matrix[size-8][8]=true;reserved[size-8][8]=true;
  
  // Encode data
  var bits=[];
  // Mode indicator (0100 = byte mode)
  bits.push(0,1,0,0);
  // Character count
  var ccBits=version<10?8:16;
  for(var i=ccBits-1;i>=0;i--)bits.push((data.length>>i)&1);
  // Data
  for(var b=0;b<data.length;b++){
    for(var i=7;i>=0;i--)bits.push((data[b]>>i)&1);
  }
  // Terminator
  for(var i=0;i<4&&bits.length<capacity*8;i++)bits.push(0);
  // Pad to byte boundary
  while(bits.length%8!==0)bits.push(0);
  // Pad bytes
  var padBytes=[0xEC,0x11];
  var pi=0;
  while(bits.length<capacity*8){
    var pb=padBytes[pi%2];
    for(var i=7;i>=0;i--)bits.push((pb>>i)&1);
    pi++;
  }
  
  // Place data bits
  var bitIdx=0;
  var upward=true;
  for(var col=size-1;col>=0;col-=2){
    if(col===6)col=5;
    var rows=upward?range(size-1,-1,-1):range(0,size,1);
    for(var ri=0;ri<rows.length;ri++){
      var row=rows[ri];
      for(var dc=0;dc<2;dc++){
        var c=col-dc;
        if(c<0||c>=size)continue;
        if(reserved[row][c])continue;
        matrix[row][c]=bitIdx<bits.length?bits[bitIdx]===1:false;
        bitIdx++;
      }
    }
    upward=!upward;
  }
  
  // Apply mask (pattern 0: checkerboard)
  for(var r=0;r<size;r++){
    for(var c=0;c<size;c++){
      if(!reserved[r][c]&&(r+c)%2===0){
        matrix[r][c]=!matrix[r][c];
      }
    }
  }
  
  // Place format info (L, mask 0)
  placeFormatInfo(matrix,size,1,0); // 1=L error correction, 0=mask pattern
  
  return matrix;
}

function range(start,end,step){
  var r=[];for(var i=start;step>0?i<end:i>end;i+=step)r.push(i);return r;
}

function placeFinder(matrix,reserved,r,c){
  for(var dr=-1;dr<=7;dr++){
    for(var dc=-1;dc<=7;dc++){
      var rr=r+dr,cc=c+dc;
      if(rr<0||rr>=matrix.length||cc<0||cc>=matrix.length)continue;
      var val;
      if(dr===-1||dr===7||dc===-1||dc===7)val=false;
      else if(dr===0||dr===6||dc===0||dc===6)val=true;
      else if(dr>=2&&dr<=4&&dc>=2&&dc<=4)val=true;
      else val=false;
      matrix[rr][cc]=val;
      reserved[rr][cc]=true;
    }
  }
}

function placeAlignment(matrix,reserved,r,c){
  for(var dr=-2;dr<=2;dr++){
    for(var dc=-2;dc<=2;dc++){
      var rr=r+dr,cc=c+dc;
      if(rr<0||rr>=matrix.length||cc<0||cc>=matrix.length)continue;
      var val;
      if(Math.abs(dr)===2||Math.abs(dc)===2)val=true;
      else if(dr===0&&dc===0)val=true;
      else val=false;
      matrix[rr][cc]=val;
      reserved[rr][cc]=true;
    }
  }
}

function getAlignmentPositions(v){
  if(v<=1)return[];
  var positions=[6];
  var last=18+v*4;
  if(v<=6){positions.push(last);}
  else{
    var count=Math.floor(v/7)+2;
    var step=Math.ceil((last-6)/(count-1));
    for(var i=1;i<count;i++)positions.push(6+i*step);
  }
  return positions;
}

function placeFormatInfo(matrix,size,ecLevel,maskPattern){
  var formatBits=(ecLevel<<3)|maskPattern;
  var format=formatBits;
  // BCH(15,5) encoding
  var g=0x537; // Generator polynomial
  var data=format<<10;
  for(var i=14;i>=10;i--){
    if(data&(1<<i))data^=(g<<(i-10));
  }
  format=(formatBits<<10)|data;
  format^=0x5412; // XOR mask
  
  // Place format bits
  var bits=[];
  for(var i=14;i>=0;i--)bits.push((format>>i)&1);
  
  // Around top-left finder
  var positions1=[[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
  // Around other finders
  var positions2=[[size-1,8],[size-2,8],[size-3,8],[size-4,8],[size-5,8],[size-6,8],[size-7,8],[8,size-8],[8,size-7],[8,size-6],[8,size-5],[8,size-4],[8,size-3],[8,size-2],[8,size-1]];
  
  for(var i=0;i<15;i++){
    var r1=positions1[i][0],c1=positions1[i][1];
    var r2=positions2[i][0],c2=positions2[i][1];
    matrix[r1][c1]=bits[i]===1;
    matrix[r2][c2]=bits[i]===1;
  }
}

document.getElementById('qrGenerate').addEventListener('click',function(){
  var content=getContent();
  if(!content)return;
  var size=parseInt(document.getElementById('qrSize').value);
  var fg=document.getElementById('qrFg').value;
  var bg=document.getElementById('qrBg').value;
  
  generateQR(content,size,fg,bg);
  document.getElementById('qrCanvasWrap').style.display='block';
  document.getElementById('qrPlaceholder').style.display='none';
  document.getElementById('qrActions').style.display='flex';
});

document.getElementById('qrDownload').addEventListener('click',function(){
  var canvas=document.getElementById('qrCanvas');
  var link=document.createElement('a');
  link.download='qr-code.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
});

// Auto-generate on Enter
document.querySelectorAll('#qrInputs input').forEach(function(el){
  el.addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('qrGenerate').click();});
});
})();
</script>
