<h2 id="rental-yield-deal-analyser-title" style="margin-top:0;color:var(--accent)">🏠 Rental Yield Deal Analyser</h2>
<form id="rental-yield-deal-analyser-form" aria-describedby="rental-yield-deal-analyser-desc" onsubmit="event.preventDefault();">
<p id="rental-yield-deal-analyser-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:.9rem">Compare gross yield, net yield and monthly cash flow for a prospective rental property. All calculations stay in your browser.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px"><div><label for="rental-yield-deal-analyser-price" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Purchase price (£)</label><input id="rental-yield-deal-analyser-price" data-key="price" type="number" step="any" value="220000" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="rental-yield-deal-analyser-rent" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Monthly rent (£)</label><input id="rental-yield-deal-analyser-rent" data-key="rent" type="number" step="any" value="1250" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="rental-yield-deal-analyser-annual" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Annual running costs (£)</label><input id="rental-yield-deal-analyser-annual" data-key="annual" type="number" step="any" value="2600" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="rental-yield-deal-analyser-mortgage" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Monthly mortgage cost (£)</label><input id="rental-yield-deal-analyser-mortgage" data-key="mortgage" type="number" step="any" value="650" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div></div>
<button type="submit" style="margin-top:16px;padding:11px 18px;border:0;border-radius:8px;background:var(--accent);color:#001018;font-weight:700;cursor:pointer">Calculate</button>
<div id="rental-yield-deal-analyser-out" aria-live="polite" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:16px"></div>
<p style="color:var(--text-secondary);font-size:.78rem;margin-top:12px">Planning estimate only. Check tax, legal and contractual assumptions for your situation.</p>
</form>
<script>
(function(){
 const form=document.getElementById('rental-yield-deal-analyser-form'),out=document.getElementById('rental-yield-deal-analyser-out');
 const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:2}).format(Number.isFinite(n)?n:0);
 const num=(n,d=0)=>Number.isFinite(n)?n.toLocaleString('en-GB',{maximumFractionDigits:d}):'—'; const pct=n=>num(n,1)+'%';
 const dateMonths=n=>{const d=new Date();d.setDate(d.getDate()+Math.max(0,n)*30.44);return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'})};
 function calculate(){const v={};form.querySelectorAll('[data-key]').forEach(x=>v[x.dataset.key]=Number(x.value)); if(Object.values(v).some(x=>!Number.isFinite(x))){out.textContent='Enter valid numbers in every field.';return} const rows=(()=>{const annualRent=v.rent*12, cash=annualRent-v.annual-v.mortgage*12; return [['Gross yield',pct(annualRent/v.price*100)],['Net yield',pct((annualRent-v.annual)/v.price*100)],['Monthly cash flow',money(cash/12)],['Annual cash flow',money(cash)]];})();out.innerHTML='';rows.forEach(r=>{const box=document.createElement('div');box.style.cssText='padding:14px;border:1px solid var(--border-light);border-radius:9px;background:rgba(45,212,255,.06)';const a=document.createElement('div'),b=document.createElement('strong');a.style.cssText='color:var(--text-secondary);font-size:.8rem';b.style.cssText='display:block;color:var(--accent);font-size:1.15rem;margin-top:5px';a.textContent=r[0];b.textContent=r[1];box.append(a,b);out.append(box)})}
 form.addEventListener('submit',calculate);form.addEventListener('input',calculate);calculate();
})();
</script>
