<h2 id="rnyd-title" style="margin-top:0;color:var(--accent);">🔑 Rental Yield Calculator</h2>

<form aria-describedby="rnyd-desc" onsubmit="event.preventDefault();">
  <p id="rnyd-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Gross yield is annual rent ÷ purchase price. Net yield subtracts the yearly costs you type. A listing’s “yield” is often gross. This is a ratio, not investment advice.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="rnyd-price" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Purchase price £</label>
      <input id="rnyd-price" type="number" min="1" step="any" value="220000" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="rnyd-rent" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Monthly rent £</label>
      <input id="rnyd-rent" type="number" min="0" step="any" value="1100" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="rnyd-vac" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Void weeks / year</label>
      <input id="rnyd-vac" type="number" min="0" max="52" step="any" value="2" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="rnyd-cost" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Annual costs £</label>
      <input id="rnyd-cost" type="number" min="0" step="any" value="2800" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
  <p style="margin:8px 0 0;font-size:.72rem;color:var(--text-secondary);">Costs: insurance, letting fees, maintenance, ground rent, service charge. Not tax.</p>
</form>
<div id="rnyd-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function gbp(n) { return '£' + n.toLocaleString('en-GB', { maximumFractionDigits: 0 }); }
  function pct(n) { return n.toFixed(2) + '%'; }
  function run() {
    var price = Number($('rnyd-price').value), rent = Number($('rnyd-rent').value);
    var vac = Number($('rnyd-vac').value), cost = Number($('rnyd-cost').value);
    if (!(price > 0) || !(rent >= 0) || !(vac >= 0) || !(cost >= 0)) {
      $('rnyd-out').textContent = 'Enter price, rent, voids and costs.';
      return;
    }
    var grossAnn = rent * 12;
    var occupied = Math.max(0, 1 - vac / 52);
    var collected = grossAnn * occupied;
    var net = collected - cost;
    var grossY = (grossAnn / price) * 100;
    var netY = (net / price) * 100;
    $('rnyd-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Gross annual rent', gbp(grossAnn)) +
      cell('After voids', gbp(collected)) +
      cell('Gross yield', pct(grossY)) +
      cell('Net yield', pct(netY)) +
      cell('Net cash (pre-tax)', gbp(net)) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Gross yield ignores empty weeks and costs. Net yield here is still before income tax, mortgage interest and capital growth.</p>';
  }
  ['rnyd-price', 'rnyd-rent', 'rnyd-vac', 'rnyd-cost'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
