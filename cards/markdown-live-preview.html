<h2>📝 Markdown Live Preview</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Write Markdown on the left, see the rendered preview on the right. Supports headings, lists, code, links, images, and tables.</p>

<div id="mp-app" style="max-width:900px;margin:0 auto;">
  <div style="display:flex;gap:8px;margin-bottom:8px;">
    <button onclick="window._mpInsert('**','**')" style="padding:6px 10px;background:rgba(45,212,255,0.1);border:1px solid rgba(45,212,255,0.2);border-radius:4px;color:#2dd4ff;cursor:pointer;font-size:12px;font-weight:700;">B</button>
    <button onclick="window._mpInsert('*','*')" style="padding:6px 10px;background:rgba(45,212,255,0.1);border:1px solid rgba(45,212,255,0.2);border-radius:4px;color:#2dd4ff;cursor:pointer;font-size:12px;font-style:italic;">I</button>
    <button onclick="window._mpInsert('# ','')" style="padding:6px 10px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.2);border-radius:4px;color:#39ff14;cursor:pointer;font-size:12px;">H1</button>
    <button onclick="window._mpInsert('## ','')" style="padding:6px 10px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.2);border-radius:4px;color:#39ff14;cursor:pointer;font-size:12px;">H2</button>
    <button onclick="window._mpInsert('### ','')" style="padding:6px 10px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.2);border-radius:4px;color:#39ff14;cursor:pointer;font-size:12px;">H3</button>
    <button onclick="window._mpInsert('- ','')" style="padding:6px 10px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.2);border-radius:4px;color:#ffa500;cursor:pointer;font-size:12px;">List</button>
    <button onclick="window._mpInsert('[','](url)')" style="padding:6px 10px;background:rgba(192,96,240,0.1);border:1px solid rgba(192,96,240,0.2);border-radius:4px;color:#c060f0;cursor:pointer;font-size:12px;">Link</button>
    <button onclick="window._mpInsert('`','`')" style="padding:6px 10px;background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.2);border-radius:4px;color:#ff4d4d;cursor:pointer;font-size:12px;">Code</button>
    <button onclick="window._mpInsert('> ','')" style="padding:6px 10px;background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.2);border-radius:4px;color:#ffd700;cursor:pointer;font-size:12px;">Quote</button>
    <button onclick="window._mpInsert('---\n','')" style="padding:6px 10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:rgba(230,250,255,0.6);cursor:pointer;font-size:12px;">HR</button>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <label style="color:#2dd4ff;font-size:12px;">Markdown</label>
        <button onclick="window._mpCopyMd()" style="padding:3px 8px;background:rgba(45,212,255,0.1);border:1px solid rgba(45,212,255,0.2);border-radius:3px;color:#2dd4ff;cursor:pointer;font-size:11px;">📋 Copy</button>
      </div>
      <textarea id="mp-input" style="width:100%;height:400px;padding:12px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-family:monospace;font-size:13px;resize:vertical;box-sizing:border-box;line-height:1.6;"># Hello World

This is a **live preview** of your *Markdown*.

## Features
- **Bold** and *italic* text
- [Links](https://example.com)
- `inline code` and code blocks
- Lists and blockquotes

> This is a blockquote

### Code Block
```javascript
function hello() {
  console.log("Hello, World!");
}
```

### Table
| Name | Age | City |
|------|-----|------|
| Alice | 30 | London |
| Bob | 25 | Paris |

---

Made with ❤️ and Markdown</textarea>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <label style="color:#39ff14;font-size:12px;">Preview</label>
        <button onclick="window._mpCopyHtml()" style="padding:3px 8px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.2);border-radius:3px;color:#39ff14;cursor:pointer;font-size:11px;">📋 HTML</button>
      </div>
      <div id="mp-preview" style="height:400px;padding:12px;border-radius:8px;border:1px solid rgba(57,255,20,0.15);background:rgba(0,0,0,0.2);overflow-y:auto;font-size:14px;line-height:1.7;color:var(--text);"></div>
    </div>
  </div>

  <div id="mp-stats" style="margin-top:8px;font-size:12px;color:rgba(230,250,255,0.4);text-align:center;"></div>
</div>

<script>
(function(){
  function render(md){
    var html=md;
    // Code blocks
    html=html.replace(/```(\w*)\n([\s\S]*?)```/g,function(m,lang,code){return '<pre style="background:rgba(0,0,0,0.4);padding:12px;border-radius:6px;overflow-x:auto;border:1px solid rgba(255,255,255,0.05);"><code>'+code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</code></pre>';});
    // Inline code
    html=html.replace(/`([^`]+)`/g,'<code style="background:rgba(45,212,255,0.1);padding:2px 6px;border-radius:3px;font-size:0.9em;">$1</code>');
    // Headers
    html=html.replace(/^### (.+)$/gm,'<h3 style="color:#2dd4ff;margin:16px 0 8px;font-size:1.1em;">$1</h3>');
    html=html.replace(/^## (.+)$/gm,'<h2 style="color:#2dd4ff;margin:20px 0 10px;font-size:1.3em;">$1</h2>');
    html=html.replace(/^# (.+)$/gm,'<h1 style="color:#2dd4ff;margin:24px 0 12px;font-size:1.6em;">$1</h1>');
    // Bold/Italic
    html=html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    html=html.replace(/\*(.+?)\*/g,'<em>$1</em>');
    // Links
    html=html.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" style="color:#2dd4ff;">$1</a>');
    // Images
    html=html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1" style="max-width:100%;border-radius:6px;">');
    // Blockquotes
    html=html.replace(/^> (.+)$/gm,'<blockquote style="border-left:3px solid #2dd4ff;padding-left:12px;color:rgba(230,250,255,0.7);margin:8px 0;">$1</blockquote>');
    // Horizontal rule
    html=html.replace(/^---$/gm,'<hr style="border:none;border-top:1px solid rgba(255,255,255,0.1);margin:16px 0;">');
    // Unordered lists
    html=html.replace(/^- (.+)$/gm,'<li style="margin-left:20px;">$1</li>');
    // Tables
    html=html.replace(/\|(.+)\|\n\|[-| ]+\|\n((?:\|.+\|\n?)+)/g,function(m,header,body){
      var h='<table style="width:100%;border-collapse:collapse;margin:8px 0;"><thead><tr>';
      header.split('|').filter(function(c){return c.trim();}).forEach(function(c){h+='<th style="padding:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(45,212,255,0.05);text-align:left;">'+c.trim()+'</th>';});
      h+='</tr></thead><tbody>';
      body.trim().split('\n').forEach(function(row){
        h+='<tr>';
        row.split('|').filter(function(c){return c.trim();}).forEach(function(c){h+='<td style="padding:8px;border:1px solid rgba(255,255,255,0.05);">'+c.trim()+'</td>';});
        h+='</tr>';
      });
      h+='</tbody></table>';
      return h;
    });
    // Paragraphs
    html=html.replace(/\n\n/g,'</p><p style="margin:8px 0;">');
    html='<p style="margin:8px 0;">'+html+'</p>';
    return html;
  }
  function update(){
    var md=document.getElementById('mp-input').value;
    document.getElementById('mp-preview').innerHTML=render(md);
    var words=md.split(/\s+/).filter(function(w){return w;}).length;
    var chars=md.length;
    document.getElementById('mp-stats').textContent=words+' words · '+chars+' characters';
  }
  function insert(before,after){
    var el=document.getElementById('mp-input');
    var start=el.selectionStart,end=el.selectionEnd;
    var sel=el.value.substring(start,end);
    el.value=el.value.substring(0,start)+before+sel+after+el.value.substring(end);
    el.focus();el.selectionStart=start+before.length;el.selectionEnd=start+before.length+sel.length;
    update();
  }
  function copyMd(){if(navigator.clipboard)navigator.clipboard.writeText(document.getElementById('mp-input').value);}
  function copyHtml(){if(navigator.clipboard)navigator.clipboard.writeText(document.getElementById('mp-preview').innerHTML);}
  window._mpInsert=insert;window._mpCopyMd=copyMd;window._mpCopyHtml=copyHtml;
  document.getElementById('mp-input').addEventListener('input',update);
  update();
})();
</script>
