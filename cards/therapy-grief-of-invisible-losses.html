<h2>🕯️ The Grief No One Validates</h2>
<p class="description">You've been carrying losses that don't have funerals — the friendship that faded, the version of yourself you thought you'd be, the childhood you deserved but didn't get. This tool validates the grief you've been told doesn't count.</p>
<div id="gl-app" style="max-width:540px;margin:0 auto;"></div>
<script>
(function(){
'use strict';
var step=0,loss='',feeling='';
var losses=['A friendship that slowly died','The person I thought I\'d become by now','A relationship that ended without closure','The childhood I deserved but didn\'t have','A version of my family that was never possible','My health before illness/injury','A dream I had to let go of','The time I lost to depression/anxiety','A place I can never return to','The parent I needed but didn\'t get','My confidence before something broke it','A talent I didn\'t develop','The years I spent being someone I wasn\'t'];
function init(){step=0;render();}
function render(){
  var h='';
  if(step===0){
    h+='<div style="text-align:center;margin-bottom:20px;">';
    h+='<div style="font-size:64px;margin-bottom:12px;">🕯️</div>';
    h+='<h3 style="color:#9d4edd;margin:0 0 8px;">Not all losses have funerals</h3>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);">Society gives you permission to grieve death. It gives you almost no permission to grieve the other losses — the ones that don\'t have a date, a ceremony, or a name. The friendship that didn\'t end in a fight but in silence. The dream you didn\'t fail at — you just quietly stopped. The version of yourself you were supposed to become.</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-top:12px;">Psychologists call these <b>disenfranchised losses</b> — grief that society doesn\'t recognise, validate, or make space for. Because there\'s no "event," you\'re expected to just get over it. But unprocessed grief doesn\'t disappear. It goes underground and shows up as numbness, restlessness, depression, or a persistent feeling that something is wrong that you can\'t name.</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-top:12px;">This tool creates space for the grief you\'ve been carrying alone.</p>';
    h+='</div>';
    h+='<button onclick="window._glNext()" style="display:block;margin:0 auto;padding:12px 32px;background:linear-gradient(135deg,#9d4edd,#7b2cbf);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px;">Begin</button>';
  }else if(step===1){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">🕯️</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">Which of these resonates? Not which one you <i>think</i> you should grieve — which one makes your chest tighten when you read it?</p>';
    losses.forEach(function(l){
      h+='<button onclick="window._glLoss(\''+l.replace(/'/g,"\\'")+'\')" style="display:block;width:100%;text-align:left;padding:12px;margin-bottom:6px;background:rgba(255,255,255,0.03);border:1px solid rgba(157,78,221,0.2);border-radius:8px;color:var(--text-secondary);cursor:pointer;font-size:13px;transition:all 0.2s;">'+l+'</button>';
    });
    h+='<p style="font-size:12px;color:rgba(255,255,255,0.4);margin-top:8px;text-align:center;">Or write your own below:</p>';
    h+='<input type="text" id="gl-custom" placeholder="Something else..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(157,78,221,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;box-sizing:border-box;margin-bottom:8px;">';
    h+='<button onclick="window._glCustom()" style="display:block;margin:0 auto;padding:10px 24px;background:rgba(157,78,221,0.15);color:#9d4edd;border:1px solid rgba(157,78,221,0.3);border-radius:8px;cursor:pointer;font-weight:600;">Use Custom</button>';
  }else if(step===2){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">💜</div><div style="font-size:14px;color:#9d4edd;margin-top:8px;font-style:italic;">"'+loss+'"</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">What does this loss feel like when you let yourself feel it? Not what you think about it — what does it feel like in your body, right now?</p>';
    h+='<textarea id="gl-feel" rows="4" placeholder="e.g. Heavy. Like something is missing that I can\'t name. A dull ache. Emptiness. Relief and sadness at the same time..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(157,78,221,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>';
    h+='<button onclick="window._glNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#9d4edd,#7b2cbf);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Continue</button>';
  }else if(step===3){
    h+='<div style="text-align:center;margin-bottom:20px;"><div style="font-size:64px;">🕯️</div></div>';
    h+='<div style="background:rgba(157,78,221,0.08);border:1px solid rgba(157,78,221,0.2);border-radius:10px;padding:20px;margin-bottom:16px;">';
    h+='<p style="font-size:15px;line-height:1.8;color:#e6faff;margin:0;text-align:center;font-style:italic;">"'+loss+'"</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:12px 0 0;text-align:center;">'+feeling+'</p>';
    h+='<div style="text-align:center;margin:20px 0;font-size:24px;">• • •</div>';
    h+='<p style="font-size:14px;line-height:1.8;color:#e6faff;margin:0;">This is real grief. It counts. It doesn\'t need anyone else\'s permission to exist.</p><br>';
    h+='<p style="font-size:14px;line-height:1.8;color:#e6faff;margin:0;">You\'ve probably been told — by others or by yourself — to "move on," "look on the bright side," or "at least it wasn\'t worse." But grief isn\'t a competition. And the losses that don\'t have funerals are often the ones that shape you most, precisely because they were never processed.</p><br>';
    h+='<p style="font-size:14px;line-height:1.8;color:#e6faff;margin:0;">You don\'t need to "get over it." You need to <b>let it be real</b>. Name it. Feel it. Honour it. The grief doesn\'t need to be resolved — it needs to be witnessed. By you.</p>';
    h+='</div>';
    h+='<p style="font-size:13px;color:var(--text-secondary);line-height:1.7;">Kenneth Doka\'s research on disenfranchised grief shows that when people finally name and validate their invisible losses, the emotional weight decreases significantly — not because the loss goes away, but because the <b>isolation</b> of carrying it alone does. You just did that.</p>';
    h+='<button onclick="window._glReset()" style="display:block;margin:20px auto 0;padding:10px 24px;background:rgba(157,78,221,0.15);color:#9d4edd;border:1px solid rgba(157,78,221,0.3);border-radius:8px;cursor:pointer;font-weight:600;">Start Over</button>';
  }
  document.getElementById('gl-app').innerHTML=h;
}
window._glNext=function(){
  if(step===2){var f=document.getElementById('gl-feel');if(f){feeling=f.value.trim()||'heavy';}}
  step++;render();
};
window._glLoss=function(l){loss=l;step=2;render();};
window._glCustom=function(){var c=document.getElementById('gl-custom');loss=c&&c.value.trim()?c.value.trim():'Something I haven\'t named yet';step=2;render();};
window._glReset=function(){init();};
init();
})();
</script>
