<h2 id="uum-title" style="margin-top:0;color:var(--accent);">🔄 Universal Unit Matrix</h2>

<form aria-describedby="uum-desc" onsubmit="event.preventDefault();">
  <p id="uum-desc" class="small" style="color:var(--muted);margin-bottom:14px;">
    High-precision bidirectional converter across engineering, data storage, scientific physics, and everyday measurements.
  </p>

  <!-- Category Dimension Tabs -->
  <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;">
    <button type="button" class="uum-cat-btn active" data-cat="length" style="padding:5px 10px;border-radius:4px;background:rgba(45,212,255,0.2);border:1px solid #2dd4ff;color:#2dd4ff;font-size:0.75rem;font-weight:bold;cursor:pointer;white-space:nowrap;">📏 Length</button>
    <button type="button" class="uum-cat-btn" data-cat="mass" style="padding:5px 10px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.75rem;cursor:pointer;white-space:nowrap;">⚖️ Mass</button>
    <button type="button" class="uum-cat-btn" data-cat="data" style="padding:5px 10px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.75rem;cursor:pointer;white-space:nowrap;">💾 Digital Data</button>
    <button type="button" class="uum-cat-btn" data-cat="pressure" style="padding:5px 10px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.75rem;cursor:pointer;white-space:nowrap;">🗜️ Pressure</button>
    <button type="button" class="uum-cat-btn" data-cat="energy" style="padding:5px 10px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.75rem;cursor:pointer;white-space:nowrap;">⚡ Energy</button>
    <button type="button" class="uum-cat-btn" data-cat="temp" style="padding:5px 10px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.75rem;cursor:pointer;white-space:nowrap;">🌡️ Temp</button>
  </div>

  <!-- Dual Interactive Input Grid -->
  <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:14px;">
    <!-- Side A -->
    <div style="background:rgba(0,0,0,0.3);border:1px solid rgba(45,212,255,0.3);padding:10px;border-radius:8px;">
      <label for="uum-val-a" style="display:block;font-size:0.7rem;color:var(--muted);margin-bottom:4px;">From</label>
      <input type="number" id="uum-val-a" value="1" step="any" style="width:100%;padding:6px 10px;border-radius:4px;background:#090d14;border:1px solid rgba(255,255,255,0.15);color:#00ffcc;font-family:monospace;font-size:1.1rem;font-weight:bold;box-sizing:border-box;margin-bottom:6px;">
      <select id="uum-unit-a" style="width:100%;padding:5px;border-radius:4px;background:#090d14;border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.8rem;">
        <!-- Dynamic options -->
      </select>
    </div>

    <!-- Equals / Swap Icon -->
    <div style="text-align:center;">
      <button type="button" id="uum-btn-swap" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--accent);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:0.85rem;" title="Swap Direction">⇄</button>
    </div>

    <!-- Side B -->
    <div style="background:rgba(0,0,0,0.3);border:1px solid rgba(255,215,0,0.3);padding:10px;border-radius:8px;">
      <label for="uum-val-b" style="display:block;font-size:0.7rem;color:var(--muted);margin-bottom:4px;">To</label>
      <input type="number" id="uum-val-b" value="" step="any" style="width:100%;padding:6px 10px;border-radius:4px;background:#090d14;border:1px solid rgba(255,255,255,0.15);color:#ffd700;font-family:monospace;font-size:1.1rem;font-weight:bold;box-sizing:border-box;margin-bottom:6px;">
      <select id="uum-unit-b" style="width:100%;padding:5px;border-radius:4px;background:#090d14;border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.8rem;">
        <!-- Dynamic options -->
      </select>
    </div>
  </div>

  <!-- Formula & Conversion Factor Box -->
  <div style="background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:10px 12px;margin-bottom:12px;">
    <div style="font-size:0.7rem;color:var(--muted);margin-bottom:2px;">EXACT CONVERSION FORMULA</div>
    <div id="uum-formula-display" style="font-family:monospace;font-size:0.85rem;color:#e6faff;font-weight:600;">1 km = 0.621371 miles</div>
  </div>

  <!-- Quick Common Target Multipliers -->
  <div id="uum-quick-multipliers" style="display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:6px;font-size:0.75rem;">
    <!-- Populated via JS -->
  </div>
</form>

<script>
(function() {
  const catBtns = document.querySelectorAll('.uum-cat-btn');
  const valA = document.getElementById('uum-val-a');
  const valB = document.getElementById('uum-val-b');
  const unitA = document.getElementById('uum-unit-a');
  const unitB = document.getElementById('uum-unit-b');
  const formulaDisplay = document.getElementById('uum-formula-display');
  const multiContainer = document.getElementById('uum-quick-multipliers');
  const btnSwap = document.getElementById('uum-btn-swap');

  let currentCategory = 'length';

  // Units dictionary relative to standard SI base unit
  const UNITS = {
    length: {
      base: 'Meters',
      items: {
        'm': { name: 'Meters (m)', factor: 1 },
        'km': { name: 'Kilometers (km)', factor: 1000 },
        'cm': { name: 'Centimeters (cm)', factor: 0.01 },
        'mm': { name: 'Millimeters (mm)', factor: 0.001 },
        'mi': { name: 'Miles (mi)', factor: 1609.344 },
        'yd': { name: 'Yards (yd)', factor: 0.9144 },
        'ft': { name: 'Feet (ft)', factor: 0.3048 },
        'in': { name: 'Inches (in)', factor: 0.0254 },
        'nmi': { name: 'Nautical Miles', factor: 1852 }
      },
      defaultA: 'km',
      defaultB: 'mi'
    },
    mass: {
      base: 'Kilograms',
      items: {
        'kg': { name: 'Kilograms (kg)', factor: 1 },
        'g': { name: 'Grams (g)', factor: 0.001 },
        'mg': { name: 'Milligrams (mg)', factor: 0.000001 },
        't': { name: 'Metric Tonnes', factor: 1000 },
        'lb': { name: 'Pounds (lbs)', factor: 0.45359237 },
        'oz': { name: 'Ounces (oz)', factor: 0.028349523125 },
        'st': { name: 'Stones (st)', factor: 6.35029318 }
      },
      defaultA: 'kg',
      defaultB: 'lb'
    },
    data: {
      base: 'Bytes',
      items: {
        'B': { name: 'Bytes (B)', factor: 1 },
        'KB': { name: 'Kilobytes (KB, 10³)', factor: 1000 },
        'KiB': { name: 'Kibibytes (KiB, 2¹⁰)', factor: 1024 },
        'MB': { name: 'Megabytes (MB, 10⁶)', factor: 1000000 },
        'MiB': { name: 'Mebibytes (MiB, 2²⁰)', factor: 1048576 },
        'GB': { name: 'Gigabytes (GB, 10⁹)', factor: 1000000000 },
        'GiB': { name: 'Gibibytes (GiB, 2³⁰)', factor: 1073741824 },
        'TB': { name: 'Terabytes (TB, 10¹²)', factor: 1000000000000 }
      },
      defaultA: 'GB',
      defaultB: 'GiB'
    },
    pressure: {
      base: 'Pascals',
      items: {
        'Pa': { name: 'Pascals (Pa)', factor: 1 },
        'kPa': { name: 'Kilopascals (kPa)', factor: 1000 },
        'bar': { name: 'Bar', factor: 100000 },
        'psi': { name: 'PSI (lbs/sq in)', factor: 6894.757293 },
        'atm': { name: 'Standard Atmospheres', factor: 101325 },
        'mmHg': { name: 'mmHg (Torr)', factor: 133.322 }
      },
      defaultA: 'bar',
      defaultB: 'psi'
    },
    energy: {
      base: 'Joules',
      items: {
        'J': { name: 'Joules (J)', factor: 1 },
        'kJ': { name: 'Kilojoules (kJ)', factor: 1000 },
        'Wh': { name: 'Watt-hours (Wh)', factor: 3600 },
        'kWh': { name: 'Kilowatt-hours (kWh)', factor: 3600000 },
        'cal': { name: 'Calories (cal)', factor: 4.184 },
        'kcal': { name: 'Kilocalories (kcal)', factor: 4184 },
        'BTU': { name: 'BTU', factor: 1055.06 }
      },
      defaultA: 'kWh',
      defaultB: 'kcal'
    },
    temp: {
      isTemp: true,
      items: {
        'C': 'Celsius (°C)',
        'F': 'Fahrenheit (°F)',
        'K': 'Kelvin (K)'
      },
      defaultA: 'C',
      defaultB: 'F'
    }
  };

  function populateSelectors() {
    const cat = UNITS[currentCategory];
    unitA.innerHTML = '';
    unitB.innerHTML = '';

    const keys = Object.keys(cat.items);
    keys.forEach(k => {
      const name = cat.isTemp ? cat.items[k] : cat.items[k].name;
      const optA = new Option(name, k);
      const optB = new Option(name, k);
      if (k === cat.defaultA) optA.selected = true;
      if (k === cat.defaultB) optB.selected = true;
      unitA.add(optA);
      unitB.add(optB);
    });
  }

  function convertTemp(val, from, to) {
    if (from === to) return val;
    // to Celsius
    let c = val;
    if (from === 'F') c = (val - 32) * (5 / 9);
    if (from === 'K') c = val - 273.15;

    // from Celsius
    if (to === 'C') return c;
    if (to === 'F') return (c * 9 / 5) + 32;
    if (to === 'K') return c + 273.15;
    return val;
  }

  function calculateFromA() {
    const a = parseFloat(valA.value);
    if (isNaN(a)) { valB.value = ''; formulaDisplay.textContent = '–'; return; }

    const uA = unitA.value;
    const uB = unitB.value;
    const cat = UNITS[currentCategory];

    let b = 0;
    if (cat.isTemp) {
      b = convertTemp(a, uA, uB);
      formulaDisplay.textContent = `${a} °${uA} = ${b.toFixed(2)} °${uB}`;
    } else {
      const baseVal = a * cat.items[uA].factor;
      b = baseVal / cat.items[uB].factor;
      const ratio = cat.items[uA].factor / cat.items[uB].factor;
      formulaDisplay.textContent = `1 ${uA} = ${ratio.toLocaleString(undefined, { maximumSignificantDigits: 6 })} ${uB}`;
    }

    valB.value = parseFloat(b.toPrecision(7));
    renderQuickMultipliers(cat.isTemp ? b : (a * (cat.items[uA]?.factor || 1)));
  }

  function calculateFromB() {
    const b = parseFloat(valB.value);
    if (isNaN(b)) { valA.value = ''; return; }

    const uA = unitA.value;
    const uB = unitB.value;
    const cat = UNITS[currentCategory];

    let a = 0;
    if (cat.isTemp) {
      a = convertTemp(b, uB, uA);
    } else {
      const baseVal = b * cat.items[uB].factor;
      a = baseVal / cat.items[uA].factor;
    }
    valA.value = parseFloat(a.toPrecision(7));
  }

  function renderQuickMultipliers(baseVal) {
    const cat = UNITS[currentCategory];
    if (cat.isTemp) { multiContainer.innerHTML = ''; return; }

    multiContainer.innerHTML = '';
    const keys = Object.keys(cat.items);
    keys.forEach(k => {
      if (k !== unitA.value) {
        const itemVal = baseVal / cat.items[k].factor;
        const box = document.createElement('div');
        box.style.background = 'rgba(255,255,255,0.03)';
        box.style.padding = '4px 8px';
        box.style.borderRadius = '4px';
        box.style.border = '1px solid rgba(255,255,255,0.06)';
        box.innerHTML = `<span style="color:var(--muted);font-size:0.68rem;">${k}:</span> <strong style="color:#e6faff;">${parseFloat(itemVal.toPrecision(5))}</strong>`;
        multiContainer.appendChild(box);
      }
    });
  }

  catBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      catBtns.forEach(b => {
        b.classList.remove('active');
        b.style.background = 'rgba(255,255,255,0.06)';
        b.style.borderColor = 'rgba(255,255,255,0.15)';
        b.style.color = '#fff';
      });
      btn.classList.add('active');
      btn.style.background = 'rgba(45,212,255,0.2)';
      btn.style.borderColor = '#2dd4ff';
      btn.style.color = '#2dd4ff';

      currentCategory = btn.dataset.cat;
      populateSelectors();
      calculateFromA();
    });
  });

  valA.addEventListener('input', calculateFromA);
  unitA.addEventListener('change', calculateFromA);
  valB.addEventListener('input', calculateFromB);
  unitB.addEventListener('change', calculateFromA);

  btnSwap.addEventListener('click', () => {
    const tempUnit = unitA.value;
    unitA.value = unitB.value;
    unitB.value = tempUnit;
    calculateFromA();
  });

  populateSelectors();
  calculateFromA();
})();
</script>
