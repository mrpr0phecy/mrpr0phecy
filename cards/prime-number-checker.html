<h2 id="prme-title" style="margin-top:0;color:var(--accent);">🔢 Prime Number Checker</h2>

<form aria-describedby="prme-desc" onsubmit="event.preventDefault();">
  <p id="prme-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Test whether n is prime, list its prime factors, and jump to the next prime. Trial division up to √n — fine for integers up to about 10¹² in this browser. 1 is not prime.
  </p>
  <div>
    <label for="prme-n" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Integer</label>
    <input id="prme-n" type="number" min="1" step="1" value="97" inputmode="numeric" style="width:100%;max-width:240px;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
  </div>
</form>
<div id="prme-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function factors(n) {
    var f = [], x = n;
    while (x % 2 === 0) { f.push(2); x /= 2; }
    for (var p = 3; p * p <= x; p += 2) {
      while (x % p === 0) { f.push(p); x /= p; }
    }
    if (x > 1) f.push(x);
    return f;
  }
  function isPrime(n) {
    if (n < 2) return false;
    if (n % 2 === 0) return n === 2;
    for (var p = 3; p * p <= n; p += 2) if (n % p === 0) return false;
    return true;
  }
  function nextPrime(n) {
    var x = Math.floor(n) + 1;
    if (x < 2) x = 2;
    while (!isPrime(x)) x++;
    return x;
  }
  function run() {
    var n = Math.floor(Number($('prme-n').value));
    if (!(n >= 1) || n > 1e12) {
      $('prme-out').innerHTML = '<p style="color:#ffb8b8;font-size:.84rem;">Enter an integer from 1 to 1,000,000,000,000.</p>';
      return;
    }
    var prime = isPrime(n);
    var f = n >= 2 ? factors(n) : [];
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('prme-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell(String(n), prime ? 'prime' : (n === 1 ? 'neither prime nor composite' : 'composite')) +
      cell('Prime factors', f.length ? f.join(' × ') : '—') +
      cell('Next prime', String(nextPrime(n))) +
      cell('Previous', n <= 2 ? '—' : String((function () { var x = n - 1; while (x > 1 && !isPrime(x)) x--; return x; })())) +
      '</div>';
  }
  $('prme-n').addEventListener('input', run);
  run();
})();
</script>
