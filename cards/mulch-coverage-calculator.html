<h2 id="mlch-title" style="margin-top:0;color:var(--accent);">🍂 Mulch Coverage Calculator</h2>

<form aria-describedby="mlch-desc" onsubmit="event.preventDefault();">
  <p id="mlch-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Volume = area × depth. A 50 litre bag is 0.05 m³. Bark mulch is usually 5–8 cm; paths can be 10 cm. Order a little extra for settling — bags are sold by loose volume.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="mlch-l" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Length (m)</label>
      <input id="mlch-l" type="number" min="0" step="any" value="8" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="mlch-w" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Width (m)</label>
      <input id="mlch-w" type="number" min="0" step="any" value="3" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="mlch-d" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Depth (cm)</label>
      <input id="mlch-d" type="number" min="1" step="any" value="7" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="mlch-bag" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Bag size (litres)</label>
      <input id="mlch-bag" type="number" min="1" value="50" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="mlch-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var L = Number($('mlch-l').value), W = Number($('mlch-w').value), d = Number($('mlch-d').value), bag = Number($('mlch-bag').value);
    if (!(L > 0 && W > 0 && d > 0 && bag > 0)) return;
    var m3 = L * W * (d / 100);
    var litres = m3 * 1000;
    var bags = Math.ceil(litres / bag);
    var extra = Math.ceil(bags * 1.1);
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('mlch-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Area', (L * W).toFixed(1) + ' m²') +
      cell('Volume', m3.toFixed(3) + ' m³  (' + Math.round(litres) + ' L)') +
      cell('Bags', bags + ' × ' + bag + ' L') +
      cell('With 10% extra', extra + ' bags') +
      '</div>';
  }
  ['mlch-l', 'mlch-w', 'mlch-d', 'mlch-bag'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
