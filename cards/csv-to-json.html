<h2>📊 CSV ↔ JSON Converter</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Convert CSV data to JSON and back. Supports custom delimiters, headers, and nested objects.</p>

<div id="cj-app" style="max-width:700px;margin:0 auto;">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label style="display:block;margin-bottom:4px;color:#2dd4ff;font-size:12px;">CSV Input</label>
      <textarea id="cj-csv" style="width:100%;height:150px;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-family:monospace;font-size:13px;resize:vertical;box-sizing:border-box;" placeholder="name,age,city
Alice,30,London
Bob,25,Paris
Charlie,35,Tokyo">name,age,city
Alice,30,London
Bob,25,Paris
Charlie,35,Tokyo</textarea>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <label style="color:#39ff14;font-size:12px;">JSON Output</label>
        <button onclick="window._cjCopyJson()" style="padding:3px 8px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.2);border-radius:3px;color:#39ff14;cursor:pointer;font-size:11px;">📋</button>
      </div>
      <textarea id="cj-json" readonly style="width:100%;height:150px;padding:10px;border-radius:8px;border:1px solid rgba(57,255,20,0.15);background:rgba(0,0,0,0.2);color:#39ff14;font-family:monospace;font-size:13px;resize:vertical;box-sizing:border-box;"></textarea>
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <button onclick="window._cjToJson()" style="flex:1;padding:10px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:#2dd4ff;cursor:pointer;font-weight:600;">CSV → JSON</button>
    <button onclick="window._cjToCsv()" style="flex:1;padding:10px;background:rgba(57,255,20,0.15);border:1px solid rgba(57,255,20,0.4);border-radius:8px;color:#39ff14;cursor:pointer;font-weight:600;">JSON → CSV</button>
    <button onclick="window._cjSwap()" style="padding:10px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.3);border-radius:8px;color:#ffa500;cursor:pointer;">⇄</button>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <label style="font-size:12px;color:rgba(230,250,255,0.5);display:flex;align-items:center;gap:4px;">
      Delimiter: <select id="cj-delim" style="padding:4px;border-radius:4px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:12px;">
        <option value=",">Comma (,)</option><option value=";">Semicolon (;)</option>
        <option value="&#9;">Tab</option><option value="|">Pipe (|)</option>
      </select>
    </label>
    <label style="font-size:12px;color:rgba(230,250,255,0.5);display:flex;align-items:center;gap:4px;">
      <input id="cj-headers" type="checkbox" checked style="accent-color:#2dd4ff;"> First row is headers
    </label>
  </div>

  <div id="cj-info" style="font-size:12px;color:rgba(230,250,255,0.4);padding:8px;background:rgba(0,0,0,0.2);border-radius:6px;"></div>
</div>

<script>
(function(){
  function toJson(){
    var csv=document.getElementById('cj-csv').value;
    var delim=document.getElementById('cj-delim').value==='\t'?'\t':document.getElementById('cj-delim').value;
    var hasHeaders=document.getElementById('cj-headers').checked;
    var lines=csv.split('\n').filter(function(l){return l.trim();});
    if(!lines.length){document.getElementById('cj-json').value='[]';return;}
    var rows=lines.map(function(line){
      var result=[];var current='';var inQuotes=false;
      for(var i=0;i<line.length;i++){
        if(line[i]==='"'){inQuotes=!inQuotes;}
        else if(line[i]===delim&&!inQuotes){result.push(current.trim());current='';}
        else{current+=line[i];}
      }
      result.push(current.trim());
      return result;
    });
    var json;
    if(hasHeaders&&rows.length>1){
      var headers=rows[0];
      json=rows.slice(1).map(function(row){
        var obj={};
        headers.forEach(function(h,i){obj[h]=row[i]||'';});
        return obj;
      });
    }else{
      json=rows;
    }
    document.getElementById('cj-json').value=JSON.stringify(json,null,2);
    document.getElementById('cj-info').innerHTML='Rows: <b>'+(rows.length-(hasHeaders?1:0))+'</b> · Columns: <b>'+(rows[0]?rows[0].length:0)+'</b>';
  }
  function toCsv(){
    var json=document.getElementById('cj-json').value;
    var delim=document.getElementById('cj-delim').value==='\t'?'\t':document.getElementById('cj-delim').value;
    try{
      var data=JSON.parse(json);
      if(!Array.isArray(data))data=[data];
      if(!data.length){document.getElementById('cj-csv').value='';return;}
      var headers=Object.keys(data[0]);
      var csv=headers.join(delim)+'\n';
      data.forEach(function(row){
        csv+=headers.map(function(h){
          var val=String(row[h]||'');
          if(val.indexOf(delim)>=0||val.indexOf('"')>=0)val='"'+val.replace(/"/g,'""')+'"';
          return val;
        }).join(delim)+'\n';
      });
      document.getElementById('cj-csv').value=csv.trim();
      document.getElementById('cj-info').innerHTML='Rows: <b>'+data.length+'</b> · Columns: <b>'+headers.length+'</b>';
    }catch(e){
      document.getElementById('cj-info').innerHTML='<span style="color:#ff4d4d;">Invalid JSON: '+e.message+'</span>';
    }
  }
  function swap(){
    var c=document.getElementById('cj-csv').value;
    var j=document.getElementById('cj-json').value;
    document.getElementById('cj-csv').value=j;
    document.getElementById('cj-json').value=c;
  }
  function copyJson(){
    var el=document.getElementById('cj-json');
    if(navigator.clipboard)navigator.clipboard.writeText(el.value);
  }
  window._cjToJson=toJson;window._cjToCsv=toCsv;window._cjSwap=swap;window._cjCopyJson=copyJson;
  document.getElementById('cj-csv').addEventListener('input',toJson);
  toJson();
})();
</script>
