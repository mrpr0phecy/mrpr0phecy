<h2>🕳️ Why Is There Something Rather Than Nothing?</h2>
<p class="description">The deepest question philosophy has ever asked. Explore the mystery of existence itself — why does anything exist at all?</p>
<div id="why-app" style="max-width:560px;margin:0 auto;"></div>
<script>
(function(){
'use strict';
var perspectives=[
  {name:'The Question Itself',icon:'❓',color:'#ff4444',
   text:'Leibniz asked in 1714: "Why is there something rather than nothing?" This is not a scientific question — it is a question about why science is possible at all. Every scientific explanation assumes something already exists. But why does anything exist in the first place?'},
  {name:'Nothing Is Unstable',icon:'💥',color:'#ff8800',
   text:'Lawrence Krauss argues that "nothing" is inherently unstable. Quantum mechanics shows that empty space seethes with virtual particles popping in and out of existence. The total energy of the universe may be exactly zero — positive energy (matter) balanced by negative energy (gravity). The universe may be the ultimate free lunch: everything from nothing, because nothing is unstable.'},
  {name:'The Universe Needs No Cause',icon:'♾️',color:'#ffcc00',
   text:'David Hume and Bertrand Russell argued that only things *within* the universe need causes. The universe as a whole might be a "brute fact" — it simply exists, without reason or cause. Asking "why" may be a category error, like asking "what is north of the North Pole?" The universe is not the kind of thing that needs a reason.'},
  {name:'The Mathematical Universe',icon:'🔢',color:'#39ff14',
   text:'Max Tegmark proposes that all mathematical structures exist — not just describe — reality. Our universe is one mathematical structure among infinitely many. Mathematics doesn\'t describe the universe; the universe *is* mathematics. If true, the question "why something?" dissolves: all possible structures exist necessarily, and we find ourselves in one that permits observers.'},
  {name:'The Simulation Hypothesis',icon:'💻',color:'#2dd4ff',
   text:'If advanced civilizations can simulate universes, there are far more simulated realities than base realities. Statistically, we are almost certainly in a simulation. But this just pushes the question back: why does the simulating universe exist? Turtles all the way down — until you hit something that exists necessarily.'},
  {name:'Necessary Existence',icon:'🔺',color:'#8844ff',
   text:'Some philosophers argue that there must be something that exists *necessarily* — something that could not have failed to exist. If such a thing exists, then "nothing" was never an option. The question becomes: what is the necessary foundation of reality? God? Mathematics? The laws of physics? Something we haven\'t conceived?'},
  {name:'We Cannot Know',icon:'🌌',color:'#ff44ff',
   text:'Perhaps this question is beyond human comprehension. We are evolved primates on a small planet, using brains adapted for finding food and avoiding predators. The question "why is there something?" may require a form of understanding that our neural architecture cannot support — like asking a fish to understand fire. The mystery may be permanent. And that is okay. The universe owes us no explanation. The fact that we can ask the question at all is the real miracle.'}
];
var idx=0;
function init(){idx=0;render();}
function render(){
  var p=perspectives[idx];
  var h='<div style="text-align:center;margin-bottom:12px;">';
  h+='<div style="font-size:48px;margin-bottom:8px;">'+p.icon+'</div>';
  h+='<div style="font-size:18px;font-weight:700;color:'+p.color+';">'+p.name+'</div>';
  h+='</div>';
  h+='<div style="background:rgba(255,255,255,0.05);border-radius:8px;padding:16px;border:1px solid '+p.color+'40;margin-bottom:16px;font-size:14px;line-height:1.8;color:#e6faff;">'+p.text+'</div>';
  h+='<input type="range" min="0" max="'+(perspectives.length-1)+'" value="'+idx+'" id="why-sl" style="width:100%;accent-color:'+p.color+';">';
  h+='<div style="display:flex;justify-content:space-between;font-size:10px;color:#666;margin-top:4px;">';
  for(var i=0;i<perspectives.length;i++)h+='<span style="color:'+(i===idx?perspectives[i].color:'#444')+';">'+(i+1)+'</span>';
  h+='</div>';
  h+='<div style="margin-top:16px;font-size:13px;line-height:1.8;color:#e6faff;background:rgba(255,255,255,0.05);border-radius:8px;padding:14px;border:1px solid rgba(45,212,255,0.2);">';
  h+='<b>A thought to carry with you:</b><br><br>';
  h+='You are matter that became alive. Alive matter that became aware. Aware matter that began to wonder why it exists. The atoms in your body were forged in dying stars billions of years ago. They spent eons as rock, ocean, and air before organizing into a being that could ask "why?"';
  h+='<br><br>The universe spent 13.8 billion years becoming you — so that you could look back at it and wonder. Whatever the answer to "why is there something?" — <i>you</i> are part of that something. And that is extraordinary.';
  h+='</div>';
  document.getElementById('why-app').innerHTML=h;
  document.getElementById('why-sl').addEventListener('input',function(e){idx=parseInt(e.target.value);render();});
}
init();
})();
</script>
