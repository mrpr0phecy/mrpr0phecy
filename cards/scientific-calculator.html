<h2>🧮 Scientific Calculator</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Full-featured scientific calculator with trigonometry, logarithms, powers, and memory functions. Works offline.</p>

<div id="sc-app" style="max-width:400px;margin:0 auto;">
  <div id="sc-display" style="background:rgba(0,0,0,0.4);border:1px solid rgba(45,212,255,0.2);border-radius:10px;padding:16px;margin-bottom:12px;text-align:right;">
    <div id="sc-expr" style="font-size:13px;color:rgba(230,250,255,0.5);min-height:18px;word-break:break-all;"></div>
    <div id="sc-result" style="font-size:2em;font-weight:700;color:#2dd4ff;font-family:monospace;">0</div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px;">
    <button onclick="window._scFunc('sin')" style="padding:10px;background:rgba(192,96,240,0.1);border:1px solid rgba(192,96,240,0.2);border-radius:6px;color:#c060f0;cursor:pointer;font-size:12px;">sin</button>
    <button onclick="window._scFunc('cos')" style="padding:10px;background:rgba(192,96,240,0.1);border:1px solid rgba(192,96,240,0.2);border-radius:6px;color:#c060f0;cursor:pointer;font-size:12px;">cos</button>
    <button onclick="window._scFunc('tan')" style="padding:10px;background:rgba(192,96,240,0.1);border:1px solid rgba(192,96,240,0.2);border-radius:6px;color:#c060f0;cursor:pointer;font-size:12px;">tan</button>
    <button onclick="window._scFunc('log')" style="padding:10px;background:rgba(192,96,240,0.1);border:1px solid rgba(192,96,240,0.2);border-radius:6px;color:#c060f0;cursor:pointer;font-size:12px;">log</button>
    <button onclick="window._scFunc('ln')" style="padding:10px;background:rgba(192,96,240,0.1);border:1px solid rgba(192,96,240,0.2);border-radius:6px;color:#c060f0;cursor:pointer;font-size:12px;">ln</button>
    <button onclick="window._scFunc('asin')" style="padding:10px;background:rgba(192,96,240,0.05);border:1px solid rgba(192,96,240,0.1);border-radius:6px;color:rgba(192,96,240,0.7);cursor:pointer;font-size:11px;">sin⁻¹</button>
    <button onclick="window._scFunc('acos')" style="padding:10px;background:rgba(192,96,240,0.05);border:1px solid rgba(192,96,240,0.1);border-radius:6px;color:rgba(192,96,240,0.7);cursor:pointer;font-size:11px;">cos⁻¹</button>
    <button onclick="window._scFunc('atan')" style="padding:10px;background:rgba(192,96,240,0.05);border:1px solid rgba(192,96,240,0.1);border-radius:6px;color:rgba(192,96,240,0.7);cursor:pointer;font-size:11px;">tan⁻¹</button>
    <button onclick="window._scFunc('sqrt')" style="padding:10px;background:rgba(192,96,240,0.1);border:1px solid rgba(192,96,240,0.2);border-radius:6px;color:#c060f0;cursor:pointer;font-size:12px;">√</button>
    <button onclick="window._scFunc('cbrt')" style="padding:10px;background:rgba(192,96,240,0.1);border:1px solid rgba(192,96,240,0.2);border-radius:6px;color:#c060f0;cursor:pointer;font-size:12px;">∛</button>
  </div>

  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px;">
    <button onclick="window._scConst('pi')" style="padding:10px;background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.2);border-radius:6px;color:#ffd700;cursor:pointer;font-size:12px;">π</button>
    <button onclick="window._scConst('e')" style="padding:10px;background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.2);border-radius:6px;color:#ffd700;cursor:pointer;font-size:12px;">e</button>
    <button onclick="window._scOp('^')" style="padding:10px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.2);border-radius:6px;color:#ffa500;cursor:pointer;font-size:12px;">x^y</button>
    <button onclick="window._scOp('%')" style="padding:10px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.2);border-radius:6px;color:#ffa500;cursor:pointer;font-size:12px;">%</button>
    <button onclick="window._scFunc('fact')" style="padding:10px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.2);border-radius:6px;color:#ffa500;cursor:pointer;font-size:12px;">n!</button>
    <button onclick="window._scMem('MC')" style="padding:10px;background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.2);border-radius:6px;color:#ff4d4d;cursor:pointer;font-size:11px;">MC</button>
    <button onclick="window._scMem('MR')" style="padding:10px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.2);border-radius:6px;color:#39ff14;cursor:pointer;font-size:11px;">MR</button>
    <button onclick="window._scMem('M+')" style="padding:10px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.2);border-radius:6px;color:#39ff14;cursor:pointer;font-size:11px;">M+</button>
    <button onclick="window._scMem('M-')" style="padding:10px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.2);border-radius:6px;color:#39ff14;cursor:pointer;font-size:11px;">M-</button>
    <button onclick="window._scToggleDeg()" id="sc-deg-btn" style="padding:10px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.3);border-radius:6px;color:#2dd4ff;cursor:pointer;font-size:11px;">DEG</button>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;">
    <button onclick="window._scClear()" style="padding:14px;background:rgba(255,77,77,0.15);border:1px solid rgba(255,77,77,0.3);border-radius:8px;color:#ff4d4d;cursor:pointer;font-weight:700;font-size:16px;">C</button>
    <button onclick="window._scBackspace()" style="padding:14px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.3);border-radius:8px;color:#ffa500;cursor:pointer;font-weight:700;font-size:16px;">⌫</button>
    <button onclick="window._scOp('(')" style="padding:14px;background:rgba(230,250,255,0.05);border:1px solid rgba(230,250,255,0.1);border-radius:8px;color:rgba(230,250,255,0.6);cursor:pointer;font-size:16px;">(</button>
    <button onclick="window._scOp(')')" style="padding:14px;background:rgba(230,250,255,0.05);border:1px solid rgba(230,250,255,0.1);border-radius:8px;color:rgba(230,250,255,0.6);cursor:pointer;font-size:16px;">)</button>
    <button onclick="window._scDigit('7')" style="padding:14px;background:rgba(45,212,255,0.08);border:1px solid rgba(45,212,255,0.15);border-radius:8px;color:var(--text);cursor:pointer;font-weight:600;font-size:18px;">7</button>
    <button onclick="window._scDigit('8')" style="padding:14px;background:rgba(45,212,255,0.08);border:1px solid rgba(45,212,255,0.15);border-radius:8px;color:var(--text);cursor:pointer;font-weight:600;font-size:18px;">8</button>
    <button onclick="window._scDigit('9')" style="padding:14px;background:rgba(45,212,255,0.08);border:1px solid rgba(45,212,255,0.15);border-radius:8px;color:var(--text);cursor:pointer;font-weight:600;font-size:18px;">9</button>
    <button onclick="window._scOp('/')" style="padding:14px;background:rgba(255,165,0,0.15);border:1px solid rgba(255,165,0,0.3);border-radius:8px;color:#ffa500;cursor:pointer;font-weight:700;font-size:18px;">÷</button>
    <button onclick="window._scDigit('4')" style="padding:14px;background:rgba(45,212,255,0.08);border:1px solid rgba(45,212,255,0.15);border-radius:8px;color:var(--text);cursor:pointer;font-weight:600;font-size:18px;">4</button>
    <button onclick="window._scDigit('5')" style="padding:14px;background:rgba(45,212,255,0.08);border:1px solid rgba(45,212,255,0.15);border-radius:8px;color:var(--text);cursor:pointer;font-weight:600;font-size:18px;">5</button>
    <button onclick="window._scDigit('6')" style="padding:14px;background:rgba(45,212,255,0.08);border:1px solid rgba(45,212,255,0.15);border-radius:8px;color:var(--text);cursor:pointer;font-weight:600;font-size:18px;">6</button>
    <button onclick="window._scOp('*')" style="padding:14px;background:rgba(255,165,0,0.15);border:1px solid rgba(255,165,0,0.3);border-radius:8px;color:#ffa500;cursor:pointer;font-weight:700;font-size:18px;">×</button>
    <button onclick="window._scDigit('1')" style="padding:14px;background:rgba(45,212,255,0.08);border:1px solid rgba(45,212,255,0.15);border-radius:8px;color:var(--text);cursor:pointer;font-weight:600;font-size:18px;">1</button>
    <button onclick="window._scDigit('2')" style="padding:14px;background:rgba(45,212,255,0.08);border:1px solid rgba(45,212,255,0.15);border-radius:8px;color:var(--text);cursor:pointer;font-weight:600;font-size:18px;">2</button>
    <button onclick="window._scDigit('3')" style="padding:14px;background:rgba(45,212,255,0.08);border:1px solid rgba(45,212,255,0.15);border-radius:8px;color:var(--text);cursor:pointer;font-weight:600;font-size:18px;">3</button>
    <button onclick="window._scOp('-')" style="padding:14px;background:rgba(255,165,0,0.15);border:1px solid rgba(255,165,0,0.3);border-radius:8px;color:#ffa500;cursor:pointer;font-weight:700;font-size:18px;">−</button>
    <button onclick="window._scDigit('0')" style="padding:14px;background:rgba(45,212,255,0.08);border:1px solid rgba(45,212,255,0.15);border-radius:8px;color:var(--text);cursor:pointer;font-weight:600;font-size:18px;">0</button>
    <button onclick="window._scDigit('.')" style="padding:14px;background:rgba(45,212,255,0.08);border:1px solid rgba(45,212,255,0.15);border-radius:8px;color:var(--text);cursor:pointer;font-weight:600;font-size:18px;">.</button>
    <button onclick="window._scEval()" style="padding:14px;background:rgba(57,255,20,0.2);border:1px solid rgba(57,255,20,0.4);border-radius:8px;color:#39ff14;cursor:pointer;font-weight:700;font-size:18px;">=</button>
    <button onclick="window._scOp('+')" style="padding:14px;background:rgba(255,165,0,0.15);border:1px solid rgba(255,165,0,0.3);border-radius:8px;color:#ffa500;cursor:pointer;font-weight:700;font-size:18px;">+</button>
  </div>
</div>

<script>
(function(){
  var expr='',display='0',memory=0,useDeg=true,lastResult=null;
  function update(){
    document.getElementById('sc-expr').textContent=expr;
    document.getElementById('sc-result').textContent=display;
  }
  function digit(d){
    if(display==='0'&&d!=='.')display=d;
    else display+=d;
    expr+=d;update();
  }
  function op(o){
    if(lastResult!==null){expr=lastResult.toString();lastResult=null;}
    if(o==='^'){expr+='**';display+='^';}
    else{expr+=o;display+=o;}
    update();
  }
  function func(f){
    var val=parseFloat(display)||0;
    var result;
    var toRad=useDeg?Math.PI/180:1;
    var toDeg=useDeg?180/Math.PI:1;
    switch(f){
      case 'sin':result=Math.sin(val*toRad);break;
      case 'cos':result=Math.cos(val*toRad);break;
      case 'tan':result=Math.tan(val*toRad);break;
      case 'asin':result=Math.asin(val)*toDeg;break;
      case 'acos':result=Math.acos(val)*toDeg;break;
      case 'atan':result=Math.atan(val)*toDeg;break;
      case 'log':result=Math.log10(val);break;
      case 'ln':result=Math.log(val);break;
      case 'sqrt':result=Math.sqrt(val);break;
      case 'cbrt':result=Math.cbrt(val);break;
      case 'fact':result=1;for(var i=2;i<=val;i++)result*=i;break;
      default:result=val;
    }
    expr=f+'('+val+')';
    display=Number.isInteger(result)?result.toString():result.toPrecision(10).replace(/\.?0+$/,'');
    lastResult=result;update();
  }
  function constant(c){
    var val=c==='pi'?Math.PI:Math.E;
    display=val.toString();expr+=val.toString();update();
  }
  function evaluate(){
    try{
      var result=Function('"use strict";return('+expr+')')();
      display=Number.isFinite(result)?(Number.isInteger(result)?result.toString():result.toPrecision(10).replace(/\.?0+$/,'')):'Error';
      lastResult=result;expr=display;update();
    }catch(e){display='Error';update();}
  }
  function clear(){expr='';display='0';lastResult=null;update();}
  function backspace(){
    display=display.slice(0,-1)||'0';
    expr=expr.slice(0,-1);update();
  }
  function mem(action){
    var val=parseFloat(display)||0;
    switch(action){
      case 'MC':memory=0;break;
      case 'MR':display=memory.toString();expr+=memory.toString();break;
      case 'M+':memory+=val;break;
      case 'M-':memory-=val;break;
    }
    update();
  }
  function toggleDeg(){
    useDeg=!useDeg;
    document.getElementById('sc-deg-btn').textContent=useDeg?'DEG':'RAD';
  }
  window._scDigit=digit;window._scOp=op;window._scFunc=func;window._scConst=constant;
  window._scEval=evaluate;window._scClear=clear;window._scBackspace=backspace;
  window._scMem=mem;window._scToggleDeg=toggleDeg;
  // Keyboard support
  document.addEventListener('keydown',function(e){
    if(e.key>='0'&&e.key<='9')digit(e.key);
    else if(e.key==='.')digit('.');
    else if(e.key==='+')op('+');
    else if(e.key==='-')op('-');
    else if(e.key==='*')op('*');
    else if(e.key==='/')op('/');
    else if(e.key==='^')op('^');
    else if(e.key==='(')op('(');
    else if(e.key===')')op(')');
    else if(e.key==='Enter'||e.key==='=')evaluate();
    else if(e.key==='Escape')clear();
    else if(e.key==='Backspace')backspace();
  });
  update();
})();
</script>
