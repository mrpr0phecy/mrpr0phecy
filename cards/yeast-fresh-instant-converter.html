<h2 id="ystc-title" style="margin-top:0;color:var(--accent);">🍞 Yeast Converter</h2>

<form aria-describedby="ystc-desc" onsubmit="event.preventDefault();">
  <p id="ystc-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Swap fresh cake yeast, active dry and instant/fast-action using the baker’s 1 : 1.25 : 3 rule (instant : active dry : fresh by weight). Teaspoons assume 3.1 g instant per level tsp.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="ystc-kind" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">I have</label>
      <select id="ystc-kind" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="instant">Instant / fast-action</option>
        <option value="active">Active dry</option>
        <option value="fresh">Fresh / cake</option>
      </select>
    </div>
    <div>
      <label for="ystc-amt" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Amount</label>
      <input id="ystc-amt" type="number" min="0" step="any" value="7" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ystc-unit" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Unit</label>
      <select id="ystc-unit" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="g">grams</option>
        <option value="tsp">teaspoons</option>
        <option value="tbsp">tablespoons</option>
      </select>
    </div>
  </div>
</form>
<div id="ystc-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var G_PER_TSP = { instant: 3.1, active: 2.8, fresh: 4.8 };
  function toInstantG(kind, amt, unit) {
    var g = amt;
    if (unit === 'tsp') g = amt * G_PER_TSP[kind];
    if (unit === 'tbsp') g = amt * G_PER_TSP[kind] * 3;
    if (kind === 'instant') return g;
    if (kind === 'active') return g / 1.25;
    return g / 3;
  }
  function run() {
    var kind = $('ystc-kind').value, amt = Number($('ystc-amt').value), unit = $('ystc-unit').value;
    if (!(amt >= 0)) return;
    var inst = toInstantG(kind, amt, unit);
    var active = inst * 1.25;
    var fresh = inst * 3;
    function cell(name, g, tspW) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.72rem;color:var(--accent);font-weight:800;">' + name + '</div><div style="font-weight:800;color:var(--text);margin:4px 0;">' + g.toFixed(1) + ' g</div><div style="font-size:.74rem;color:var(--text-secondary);">' + (g / tspW).toFixed(2) + ' tsp · ' + (g / tspW / 3).toFixed(2) + ' tbsp</div></div>';
    }
    $('ystc-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Instant / fast-action', inst, 3.1) +
      cell('Active dry', active, 2.8) +
      cell('Fresh cake yeast', fresh, 4.8) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Fresh yeast is perishable and is creamed with liquid; instant can be mixed through flour. A 7 g sachet is one typical UK instant pack.</p>';
  }
  ['ystc-kind', 'ystc-amt', 'ystc-unit'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
