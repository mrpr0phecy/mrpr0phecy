<h2 id="cbez-title" style="margin-top:0;color:var(--accent);">〰️ Cubic Bézier Easing</h2>

<form aria-describedby="cbez-desc" onsubmit="event.preventDefault();">
  <p id="cbez-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    CSS <code>transition-timing-function: cubic-bezier(x1, y1, x2, y2)</code>. x is time (0–1), y is progress (can overshoot). Copy the declaration after you like the motion. Respects reduced-motion.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="cbez-x1" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">x1</label>
      <input id="cbez-x1" type="number" min="0" max="1" step="0.01" value="0.25" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="cbez-y1" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">y1</label>
      <input id="cbez-y1" type="number" step="0.01" value="0.1" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="cbez-x2" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">x2</label>
      <input id="cbez-x2" type="number" min="0" max="1" step="0.01" value="0.25" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="cbez-y2" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">y2</label>
      <input id="cbez-y2" type="number" step="0.01" value="1" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="cbez-preset" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Preset</label>
      <select id="cbez-preset" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="0.25,0.1,0.25,1">ease</option>
        <option value="0.42,0,1,1">ease-in</option>
        <option value="0,0,0.58,1">ease-out</option>
        <option value="0.42,0,0.58,1">ease-in-out</option>
        <option value="0.33,1,0.68,1">ease-out-back</option>
        <option value="0.16,1,0.3,1">springy</option>
      </select>
    </div>
  </div>
</form>
<div style="margin-top:14px;height:36px;border-radius:8px;background:#071019;border:1px solid rgba(45,212,255,.25);position:relative;overflow:hidden;">
  <div id="cbez-dot" style="position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;background:var(--accent);"></div>
</div>
<pre id="cbez-css" style="margin-top:10px;padding:10px;border-radius:8px;background:#071019;border:1px solid rgba(45,212,255,.28);color:#91f7ff;font-size:.8rem;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;"></pre>
<button type="button" id="cbez-copy" style="margin-top:8px;padding:8px 12px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:700;">Copy CSS</button>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var css = '';
  function clamp01(n) { return Math.max(0, Math.min(1, n)); }
  function run() {
    var x1 = clamp01(Number($('cbez-x1').value)), y1 = Number($('cbez-y1').value);
    var x2 = clamp01(Number($('cbez-x2').value)), y2 = Number($('cbez-y2').value);
    var bez = 'cubic-bezier(' + x1 + ', ' + y1 + ', ' + x2 + ', ' + y2 + ')';
    css = 'transition-timing-function: ' + bez + ';';
    $('cbez-css').textContent = css + '\n/* ' + bez + ' */';
    var dot = $('cbez-dot');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    dot.style.transition = 'none';
    dot.style.left = '6px';
    if (reduce) return;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        dot.style.transition = 'left 1.1s ' + bez;
        dot.style.left = 'calc(100% - 30px)';
      });
    });
  }
  ['cbez-x1', 'cbez-y1', 'cbez-x2', 'cbez-y2'].forEach(function (id) { $(id).addEventListener('input', run); });
  $('cbez-preset').addEventListener('change', function () {
    var p = $('cbez-preset').value.split(',');
    $('cbez-x1').value = p[0]; $('cbez-y1').value = p[1]; $('cbez-x2').value = p[2]; $('cbez-y2').value = p[3];
    run();
  });
  $('cbez-copy').addEventListener('click', function () {
    var btn = this;
    function done() { btn.textContent = '✓ Copied'; setTimeout(function () { btn.textContent = 'Copy CSS'; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(css).then(done); else done();
  });
  run();
})();
</script>
