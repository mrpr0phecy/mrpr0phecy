<h2 id="rtpr-title" style="margin-top:0;color:var(--accent);">➗ Ratio &amp; Proportion</h2>

<form aria-describedby="rtpr-desc" onsubmit="event.preventDefault();">
  <p id="rtpr-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Solve a/b = c/d for the blank, simplify a ratio, and scale a recipe-style mix. Leave exactly one of A, B, C, D empty. Cross-multiply: A × D = B × C.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="rtpr-a" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">A</label>
      <input id="rtpr-a" type="number" step="any" value="2" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="rtpr-b" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">B</label>
      <input id="rtpr-b" type="number" step="any" value="3" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="rtpr-c" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">C</label>
      <input id="rtpr-c" type="number" step="any" value="8" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="rtpr-d" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">D (blank to solve)</label>
      <input id="rtpr-d" type="number" step="any" placeholder="?" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="rtpr-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function gcd(a, b) {
    a = Math.abs(Math.round(a)); b = Math.abs(Math.round(b));
    while (b) { var t = b; b = a % b; a = t; }
    return a || 1;
  }
  function run() {
    var raw = ['rtpr-a', 'rtpr-b', 'rtpr-c', 'rtpr-d'].map(function (id) { return $(id).value.trim(); });
    var nums = raw.map(function (v) { return v === '' ? null : Number(v); });
    var blanks = nums.filter(function (v) { return v === null; }).length;
    var html = '';
    if (blanks === 1) {
      var A = nums[0], B = nums[1], C = nums[2], D = nums[3], miss = 'D', val;
      if (A === null) { val = B * C / D; miss = 'A'; }
      else if (B === null) { val = A * D / C; miss = 'B'; }
      else if (C === null) { val = A * D / B; miss = 'C'; }
      else { val = B * C / A; miss = 'D'; }
      html += '<div style="padding:12px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);font-size:1.05rem;font-weight:800;color:var(--accent);">' + miss + ' = ' + Number(val.toFixed(6)) + '</div>';
    } else {
      html += '<p style="font-size:.8rem;color:var(--text-secondary);">Leave exactly one box empty to solve the proportion A/B = C/D.</p>';
    }
    var a = Number($('rtpr-a').value), b = Number($('rtpr-b').value);
    if (a && b) {
      var g = gcd(a, b);
      html += '<p style="margin:10px 0 0;font-size:.84rem;color:var(--text);">A:B simplified = <strong style="color:var(--accent);">' + (a / g) + ':' + (b / g) + '</strong>  (' + (a / b).toFixed(4) + ' as a decimal, ' + ((a / (a + b)) * 100).toFixed(1) + '% / ' + ((b / (a + b)) * 100).toFixed(1) + '%)</p>';
    }
    $('rtpr-out').innerHTML = html;
  }
  ['rtpr-a', 'rtpr-b', 'rtpr-c', 'rtpr-d'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
