<h2 id="lipg-title" style="margin-top:0;color:var(--accent);">📄 Lorem Ipsum & Placeholder Text Generator</h2>

<form aria-describedby="lipg-desc" onsubmit="event.preventDefault();">
  <p id="lipg-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Generate placeholder text for mockups and layouts: classic Lorem Ipsum, plain English filler, tech buzzword soup, or Luton-flavoured hip hop bars. Choose paragraphs, sentences or words, and copy as plain text or HTML.
  </p>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px;">
    <div>
      <label for="lipg-flavour" style="display:block;font-size:0.72rem;color:var(--text-secondary);text-transform:uppercase;margin-bottom:4px;">Flavour</label>
      <select id="lipg-flavour" style="width:100%;padding:8px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:0.85rem;">
        <option value="lorem">Classic Lorem Ipsum</option>
        <option value="english">Plain English</option>
        <option value="tech">Tech buzzwords</option>
        <option value="hiphop">UK hip hop bars</option>
        <option value="pirate">Pirate</option>
      </select>
    </div>
    <div>
      <label for="lipg-unit" style="display:block;font-size:0.72rem;color:var(--text-secondary);text-transform:uppercase;margin-bottom:4px;">Unit</label>
      <select id="lipg-unit" style="width:100%;padding:8px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:0.85rem;">
        <option value="p">Paragraphs</option>
        <option value="s">Sentences</option>
        <option value="w">Words</option>
      </select>
    </div>
    <div>
      <label for="lipg-count" style="display:block;font-size:0.72rem;color:var(--text-secondary);text-transform:uppercase;margin-bottom:4px;">How many</label>
      <input id="lipg-count" type="number" min="1" max="200" value="3" style="width:100%;padding:8px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:0.85rem;">
    </div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;">
    <label style="font-size:0.8rem;color:var(--text);display:flex;align-items:center;gap:6px;"><input type="checkbox" id="lipg-start" checked> Start with "Lorem ipsum dolor sit amet"</label>
    <label style="font-size:0.8rem;color:var(--text);display:flex;align-items:center;gap:6px;"><input type="checkbox" id="lipg-html"> Wrap in &lt;p&gt; tags</label>
    <button type="button" id="lipg-gen" style="padding:8px 14px;border-radius:8px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);color:var(--accent);font-size:0.8rem;cursor:pointer;">↻ Regenerate</button>
    <button type="button" id="lipg-copy" style="padding:8px 14px;border-radius:8px;background:rgba(57,255,20,0.12);border:1px solid rgba(57,255,20,0.35);color:#39ff14;font-size:0.8rem;cursor:pointer;">Copy</button>
  </div>
  <textarea id="lipg-out" rows="12" readonly aria-live="polite" style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(45,212,255,0.15);background:rgba(0,0,0,0.35);color:var(--text);font-size:14px;resize:vertical;line-height:1.6;font-family:inherit;"></textarea>
  <div id="lipg-stats" style="font-size:0.72rem;color:var(--text-secondary);margin-top:6px;"></div>
</form>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var banks={
    lorem:'lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum curabitur pretium tincidunt lacus vestibulum ante primis faucibus orci luctus ultrices posuere cubilia curae mauris vitae nibh pellentesque habitant morbi tristique senectus netus malesuada fames turpis egestas'.split(' '),
    english:'the quick brown fox jumps over the lazy dog while morning light spreads across quiet rooftops and a kettle hums in the kitchen people gather notes ideas and small plans for the day ahead a bicycle leans against the wall waiting for someone to notice it the river moves slowly past old bridges carrying leaves and reflections somewhere a radio plays a familiar song nobody can quite name we measure time in cups of tea and unanswered messages the garden needs weeding but the book is more interesting clouds drift east and the forecast changes its mind again'.split(' '),
    tech:'synergy leverage scalable cloud-native blockchain paradigm disruptive agile pivot bandwidth ecosystem holistic actionable deliverables ideate onboarding frictionless robust seamless best-in-class stakeholder alignment north-star roadmap velocity microservices serverless data-driven machine-learning end-to-end vertical growth-hacking low-hanging-fruit circle-back deep-dive move-the-needle omnichannel next-gen thought-leadership hyperscale zero-trust edge-computing observability quantum-ready'.split(' '),
    hiphop:'luton bars flow on the beat late night studio lights low headphones on the mic is hot verses stacked on the hook we keep it real from the block to the booth rhythm in the concrete stories in the rain bass in the chest cadence in the step every line a memory every bar a map from the hat to the trainers from the bus stop to the stage vinyl spinning slow the crowd sways and the chorus lands the sample loops the snare cracks and the town wakes up'.split(' '),
    pirate:'arr matey avast ye scurvy landlubber hoist the mainsail shiver me timbers doubloons and pieces of eight the black flag flies high on the horizon a bottle of rum and a treasure map marked with an x the captain barks orders across the salty deck cannons roar seagulls cry and the kraken stirs below batten down the hatches me hearties plunder awaits beyond the reef dead men tell no tales walk the plank ye bilge rat yo ho ho'.split(' ')
  };
  var rnd=function(n){return Math.floor(Math.random()*n);};
  function sentence(bank){
    var len=6+rnd(12), w=[];
    for(var i=0;i<len;i++){ w.push(bank[rnd(bank.length)]); }
    if(len>9 && Math.random()<0.5){ w[3+rnd(len-6)]+=','; }
    var s=w.join(' ');
    return s.charAt(0).toUpperCase()+s.slice(1)+(Math.random()<0.08?'!':'.');
  }
  function paragraph(bank){ var n=3+rnd(5), s=[]; for(var i=0;i<n;i++) s.push(sentence(bank)); return s.join(' '); }
  function gen(){
    var f=$('lipg-flavour').value, unit=$('lipg-unit').value, n=Math.max(1,Math.min(200,parseInt($('lipg-count').value,10)||1));
    var bank=banks[f], parts=[], text;
    if(unit==='w'){ for(var i=0;i<n;i++) parts.push(bank[rnd(bank.length)]); text=parts.join(' '); text=text.charAt(0).toUpperCase()+text.slice(1)+'.'; }
    else if(unit==='s'){ for(var i=0;i<n;i++) parts.push(sentence(bank)); text=parts.join(' '); }
    else { for(var i=0;i<n;i++) parts.push(paragraph(bank)); }
    if(f==='lorem' && $('lipg-start').checked){
      var lead='Lorem ipsum dolor sit amet, consectetur adipiscing elit';
      if(unit==='p'){ parts[0]=lead+', '+parts[0].charAt(0).toLowerCase()+parts[0].slice(1); }
      else if(unit==='s'){ parts[0]=lead+'.'; text=parts.join(' '); }
      else { text=lead+' '+text.charAt(0).toLowerCase()+text.slice(1); }
    }
    var html=$('lipg-html').checked;
    if(unit==='p'){ text= html ? parts.map(function(p){return '<p>'+p+'</p>';}).join('\n') : parts.join('\n\n'); }
    else if(html){ text='<p>'+text+'</p>'; }
    $('lipg-out').value=text;
    var wc=text.replace(/<[^>]+>/g,'').trim().split(/\s+/).length;
    $('lipg-stats').textContent=wc+' words · '+text.length+' characters';
  }
  ['lipg-flavour','lipg-unit','lipg-count','lipg-start','lipg-html'].forEach(function(id){ $(id).addEventListener('change',gen); });
  $('lipg-count').addEventListener('input',gen);
  $('lipg-gen').addEventListener('click',gen);
  $('lipg-copy').addEventListener('click',function(){
    var btn=this,o=$('lipg-out'); function done(){ btn.textContent='Copied ✓'; setTimeout(function(){btn.textContent='Copy';},1200); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(o.value).then(done,function(){}); }
    else { o.select(); try{document.execCommand('copy');}catch(e){} done(); }
  });
  gen();
})();
</script>
