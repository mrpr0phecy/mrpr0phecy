<h2 id="gradeweight-title" style="margin-top:0;color:var(--accent);">📊 Weighted Grade Calculator</h2>

<div class="gw-container" style="font-family:inherit;color:var(--text);">
  <p class="small" style="color:rgba(230,250,255,0.7);margin-bottom:16px;">
    Enter your assignments with weights and scores to calculate your final grade.
  </p>

  <div id="gw-items" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;"></div>

  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
    <button type="button" onclick="(function(b){var c=b.closest('.gw-container');var list=c.querySelector('#gw-items');var div=document.createElement('div');div.style.cssText='display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:center;';var name=document.createElement('input');name.type='text';name.placeholder='Assignment name';name.style.cssText='padding:8px;border-radius:6px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:13px;';var score=document.createElement('input');score.type='number';score.min='0';score.max='100';score.placeholder='Score %';score.style.cssText='padding:8px;border-radius:6px;border:1px solid rgba(57,255,20,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:13px;';var weight=document.createElement('input');weight.type='number';weight.min='0';weight.max='100';weight.placeholder='Weight %';weight.style.cssText='padding:8px;border-radius:6px;border:1px solid rgba(255,165,0,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:13px;';var del=document.createElement('button');del.type='button';del.textContent='✕';del.style.cssText='padding:8px 12px;border-radius:6px;border:1px solid rgba(255,77,77,0.3);background:rgba(255,77,77,0.1);color:#ff4d4d;cursor:pointer;font-size:13px;';del.onclick=function(){div.remove();};div.appendChild(name);div.appendChild(score);div.appendChild(weight);div.appendChild(del);list.appendChild(div);})(this)"
            style="padding:10px 20px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:600;font-size:14px;">+ Add Assignment</button>
    <button type="button" onclick="(function(b){var c=b.closest('.gw-container');var items=c.querySelectorAll('#gw-items > div');var totalWeight=0;var weightedSum=0;var count=0;items.forEach(function(item){var inputs=item.querySelectorAll('input');var score=parseFloat(inputs[1].value);var weight=parseFloat(inputs[2].value);if(!isNaN(score)&&!isNaN(weight)&&weight>0){weightedSum+=(score*weight);totalWeight+=weight;count++;}});var res=c.querySelector('#gw-result');var det=c.querySelector('#gw-detail');if(count===0){res.textContent='–';det.textContent='Add at least one assignment with score and weight.';return;}var grade=totalWeight>0?weightedSum/totalWeight:0;var letter='';var color='';if(grade>=90){letter='A';color='#39ff14';}else if(grade>=80){letter='B';color='#8bc34a';}else if(grade>=70){letter='C';color='#ffa500';}else if(grade>=60){letter='D';color='#ff8c42';}else{letter='F';color='#ff4d4d';}res.textContent=grade.toFixed(1)+'% ('+letter+')';res.style.color=color;det.textContent=count+' assignment(s), total weight: '+totalWeight.toFixed(0)+'%'+(totalWeight!==100?' (weights should sum to 100%)':'');})(this)"
            style="padding:10px 20px;background:rgba(57,255,20,0.15);border:1px solid rgba(57,255,20,0.4);border-radius:8px;color:#39ff14;cursor:pointer;font-weight:600;font-size:14px;">Calculate</button>
    <button type="button" onclick="(function(b){var c=b.closest('.gw-container');c.querySelector('#gw-items').innerHTML='';c.querySelector('#gw-result').textContent='–';c.querySelector('#gw-result').style.color='var(--accent)';c.querySelector('#gw-detail').textContent='';})(this)"
            style="padding:10px 20px;background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.2);border-radius:8px;color:#ff4d4d;cursor:pointer;font-size:14px;">Clear All</button>
  </div>

  <div style="background:rgba(0,0,0,0.3);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,0.05);">
    <div style="text-align:center;">
      <div style="font-size:0.8rem;color:rgba(230,250,255,0.5);margin-bottom:4px;">Final Grade</div>
      <div id="gw-result" style="font-size:2rem;font-weight:700;color:var(--accent);">–</div>
      <div id="gw-detail" style="font-size:0.85rem;color:rgba(230,250,255,0.4);margin-top:4px;"></div>
    </div>
  </div>
</div>
