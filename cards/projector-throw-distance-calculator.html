<h2 id="proj-title" style="margin-top:0;color:var(--accent);">📽️ Projector Throw Distance</h2>

<form aria-describedby="proj-desc" onsubmit="event.preventDefault();">
  <p id="proj-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Throw ratio = distance to screen ÷ image width. A 1.5:1 lens 3 m from the wall makes a 2 m wide picture. 16:9 assumed unless you change it. Check the projector’s own min/max zoom range.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="proj-ratio" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Throw ratio</label>
      <input id="proj-ratio" type="number" min="0.1" step="any" value="1.5" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="proj-dist" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Distance (m)</label>
      <input id="proj-dist" type="number" min="0.1" step="any" value="3" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="proj-diag" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Screen diagonal (in)</label>
      <input id="proj-diag" type="number" min="10" step="any" value="100" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="proj-ar" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Aspect</label>
      <select id="proj-ar" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="1.7778">16:9</option>
        <option value="2.37">2.37:1 cinema</option>
        <option value="1.3333">4:3</option>
        <option value="1.6">16:10</option>
      </select>
    </div>
  </div>
</form>
<div id="proj-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var lock = false;
  function sizeFromDiag(diagIn, ar) {
    var diagM = diagIn * 0.0254;
    var w = diagM / Math.sqrt(1 + 1 / (ar * ar));
    var h = w / ar;
    return { w: w, h: h };
  }
  function runFromDist() {
    if (lock) return;
    var ratio = Number($('proj-ratio').value), dist = Number($('proj-dist').value), ar = Number($('proj-ar').value);
    if (!(ratio > 0 && dist > 0 && ar > 0)) return;
    var width = dist / ratio;
    var height = width / ar;
    var diagIn = Math.sqrt(width * width + height * height) / 0.0254;
    lock = true; $('proj-diag').value = String(Number(diagIn.toFixed(1))); lock = false;
    paint(width, height, dist, diagIn);
  }
  function runFromDiag() {
    if (lock) return;
    var ratio = Number($('proj-ratio').value), diag = Number($('proj-diag').value), ar = Number($('proj-ar').value);
    if (!(ratio > 0 && diag > 0 && ar > 0)) return;
    var s = sizeFromDiag(diag, ar);
    var dist = s.w * ratio;
    lock = true; $('proj-dist').value = String(Number(dist.toFixed(2))); lock = false;
    paint(s.w, s.h, dist, diag);
  }
  function paint(w, h, dist, diag) {
    $('proj-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      [['Image', (w * 100).toFixed(0) + ' × ' + (h * 100).toFixed(0) + ' cm'], ['Diagonal', diag.toFixed(0) + ' in / ' + (diag * 2.54).toFixed(0) + ' cm'], ['Throw distance', dist.toFixed(2) + ' m  (' + (dist * 3.28084).toFixed(1) + ' ft)'], ['Throw ratio', (dist / w).toFixed(2) + ':1']].map(function (row) {
        return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + row[0] + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + row[1] + '</div></div>';
      }).join('') + '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Ultra-short-throw is often 0.2–0.4:1. Sitting distance for 16:9 is commonly ~1.5–2.5× the picture width.</p>';
  }
  $('proj-ratio').addEventListener('input', runFromDist);
  $('proj-dist').addEventListener('input', runFromDist);
  $('proj-diag').addEventListener('input', runFromDiag);
  $('proj-ar').addEventListener('change', runFromDist);
  runFromDist();
})();
</script>
