<h2>📐 Dimensions of Reality</h2>
<p class="description">We live in 3 spatial dimensions — but why 3? Explore what life would be like in 1D, 2D, 4D, and beyond. Each dimension changes the laws of physics.</p>
<div id="dim-app" style="max-width:520px;margin:0 auto;"></div>
<script>
(function(){
'use strict';
var dims=[
  {n:1,name:'One Dimension',desc:'A line. You can only move forward and backward. No turning, no circles, no wrapping around things. Every creature is a segment. Every encounter is a collision. There is no "around" — only "through". Physics: gravity falls off as 1/r⁰ (constant). No stable orbits exist. No planets, no atoms as we know them.',icon:'—',color:'#ff4400'},
  {n:2,name:'Two Dimensions',desc:'A flatland. You can move forward/back and left/right, but never up/down. Creatures are flat shapes. You see others as line segments. A digestive tube would split you in half — so 2D creatures must eat and excrete through the same opening. Physics: gravity falls off as 1/r. Orbits are unstable — planets spiral into stars or fly away.',icon:'▢',color:'#ff8800'},
  {n:3,name:'Three Dimensions (You Are Here)',desc:'The Goldilocks dimension. Gravity falls off as 1/r² — stable orbits exist. Atoms have complex electron shells — chemistry is possible. Nerves can cross without blocking each other. A digestive tube doesn\'t split you. Light focuses through lenses. This is the only dimension where complexity and life as we know it can exist.',icon:'⬡',color:'#39ff14'},
  {n:4,name:'Four Dimensions',desc:'A direction perpendicular to all three you know. You cannot visualize it — your brain evolved in 3D. But mathematically it works. Physics: gravity falls off as 1/r³. No stable orbits. Atoms are unstable — electrons spiral into nuclei or fly away. No chemistry, no life. The universe would be sterile.',icon:'◈',color:'#2dd4ff'},
  {n:5,name:'Five+ Dimensions',desc:'Each additional dimension makes physics worse. Gravity gets stronger at short distances (1/r^(n-1)). Atoms are even more unstable. But string theory requires 10 or 11 dimensions — the extra ones are curled up so small we cannot see them. Reality may have more dimensions than we can ever directly experience.',icon:'✦',color:'#8844ff'},
  {n:10,name:'String Theory (10-11D)',desc:'The leading candidate for a "theory of everything" requires 10 dimensions (11 in M-theory). The extra 7 dimensions are compactified — curled into shapes called Calabi-Yau manifolds at the Planck scale. The shape of these hidden dimensions determines the constants of physics. Different shapes = different universes.',icon:'🔮',color:'#ff44ff'}
];
var idx=2;
function init(){idx=2;render();}
function render(){
  var d=dims[idx];
  var h='<div style="text-align:center;margin-bottom:12px;">';
  h+='<div style="font-size:48px;margin-bottom:8px;">'+d.icon+'</div>';
  h+='<div style="font-size:18px;font-weight:700;color:'+d.color+';">'+d.name+'</div>';
  h+='<div style="font-size:12px;color:#9ccbe0;">'+d.n+' spatial dimension'+(d.n>1?'s':'')+'</div>';
  h+='</div>';
  h+='<div style="background:rgba(255,255,255,0.05);border-radius:8px;padding:16px;border:1px solid '+d.color+'40;margin-bottom:16px;font-size:14px;line-height:1.7;color:#e6faff;">'+d.desc+'</div>';
  // gravity visualization
  h+='<div style="background:rgba(0,0,0,0.3);border-radius:8px;padding:12px;margin-bottom:16px;">';
  h+='<div style="font-size:12px;color:#9ccbe0;margin-bottom:8px;">Gravity strength vs distance in '+d.n+'D:</div>';
  h+='<canvas id="dim-cv" width="460" height="80" style="display:block;width:100%;"></canvas>';
  h+='</div>';
  h+='<input type="range" min="0" max="'+(dims.length-1)+'" value="'+idx+'" id="dim-sl" style="width:100%;accent-color:'+d.color+';">';
  h+='<div style="text-align:center;margin-top:12px;">';
  h+='<button onclick="window._dimPrev()" style="padding:6px 16px;background:rgba(45,212,255,0.15);color:#2dd4ff;border:1px solid rgba(45,212,255,0.3);border-radius:6px;cursor:pointer;font-weight:600;margin-right:8px;">← Fewer</button>';
  h+='<button onclick="window._dimNext()" style="padding:6px 16px;background:rgba(45,212,255,0.15);color:#2dd4ff;border:1px solid rgba(45,212,255,0.3);border-radius:6px;cursor:pointer;font-weight:600;">More →</button>';
  h+='</div>';
  h+='<div style="margin-top:14px;font-size:13px;line-height:1.7;color:#e6faff;background:rgba(255,255,255,0.05);border-radius:8px;padding:12px;border:1px solid rgba(45,212,255,0.2);">';
  h+='<b>Why 3 dimensions?</b> It may not be a coincidence. In fewer dimensions, complexity cannot arise. In more, atoms and orbits are unstable. Three is the only number that permits stars, chemistry, and life. Either the universe was designed for us, or we could only exist in a universe with exactly this number.';
  h+='</div>';
  document.getElementById('dim-app').innerHTML=h;
  // draw gravity curve
  var cv=document.getElementById('dim-cv'),cx=cv.getContext('2d');
  var w=cv.width,h2=cv.height;
  cx.fillStyle='#0a0a1a';cx.fillRect(0,0,w,h2);
  cx.strokeStyle=d.color;cx.lineWidth=2;cx.beginPath();
  var power=d.n-1;if(power<0)power=0;
  for(var x=10;x<w-10;x++){
    var r=(x-10)/(w-20)*5+0.1;
    var g=1/Math.pow(r,power);
    var y=h2-10-Math.min(g*(h2-20),h2-20);
    x===10?cx.moveTo(x,y):cx.lineTo(x,y);
  }
  cx.stroke();
  cx.fillStyle='#666';cx.font='10px monospace';
  cx.fillText('Strong',12,15);cx.fillText('Weak',w-40,15);
  cx.fillText('Near',12,h2-2);cx.fillText('Far',w-30,h2-2);
  document.getElementById('dim-sl').addEventListener('input',function(e){idx=parseInt(e.target.value);render();});
}
window._dimPrev=function(){if(idx>0){idx--;render();}};
window._dimNext=function(){if(idx<dims.length-1){idx++;render();}};
init();
})();
</script>
