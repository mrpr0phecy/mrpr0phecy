<h2 id="nfrq-title" style="margin-top:0;color:var(--accent);">🎹 Note Frequency Calculator</h2>

<form aria-describedby="nfrq-desc" onsubmit="event.preventDefault();">
  <p id="nfrq-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    12-tone equal temperament: f = f₀ × 2^(n/12). Default A4 = 440 Hz. MIDI note 69 is A4. Period = 1/f.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="nfrq-note" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Note</label>
      <select id="nfrq-note" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);"></select>
    </div>
    <div>
      <label for="nfrq-oct" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Octave</label>
      <input id="nfrq-oct" type="number" min="0" max="8" step="1" value="4" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="nfrq-a" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">A4 Hz</label>
      <input id="nfrq-a" type="number" min="400" max="480" step="any" value="440" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="nfrq-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  names.forEach(function (n, i) {
    var o = document.createElement('option');
    o.value = String(i); o.textContent = n;
    if (n === 'A') o.selected = true;
    $('nfrq-note').appendChild(o);
  });
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var pc = Number($('nfrq-note').value), oct = Number($('nfrq-oct').value), a4 = Number($('nfrq-a').value);
    if (!isFinite(pc) || !isFinite(oct) || !(a4 > 0)) {
      $('nfrq-out').textContent = 'Pick a note, octave and A4.';
      return;
    }
    var midi = (oct + 1) * 12 + pc;
    var n = midi - 69;
    var f = a4 * Math.pow(2, n / 12);
    var wave = 1 / f;
    $('nfrq-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Note', names[pc] + oct) +
      cell('Frequency', f.toFixed(2) + ' Hz') +
      cell('MIDI', String(midi)) +
      cell('Period', (wave * 1000).toFixed(3) + ' ms') +
      cell('Wavelength in air ~343 m/s', (343 / f).toFixed(2) + ' m') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Baroque ensembles often use A4 = 415 Hz; some orchestras sit near 442. This page is equal temperament only — just intonation differs.</p>';
  }
  ['nfrq-note', 'nfrq-oct', 'nfrq-a'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
