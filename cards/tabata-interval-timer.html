<h2 id="tbat-title" style="margin-top:0;color:var(--accent);">🔥 Tabata Timer</h2>

<form aria-describedby="tbat-desc" onsubmit="event.preventDefault();">
  <p id="tbat-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Classic Tabata is 8 rounds of 20 s work / 10 s rest (4 minutes). Phone speakers optional. If you prefer reduced motion, the digits still count without the pulse.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="tbat-work" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Work (s)</label>
      <input id="tbat-work" type="number" min="5" max="120" value="20" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="tbat-rest" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Rest (s)</label>
      <input id="tbat-rest" type="number" min="5" max="60" value="10" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="tbat-rounds" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Rounds</label>
      <input id="tbat-rounds" type="number" min="1" max="20" value="8" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;">
    <button type="button" id="tbat-go" style="padding:9px 14px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-weight:800;font-size:.84rem;">Start</button>
    <button type="button" id="tbat-stop" style="padding:9px 14px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-weight:700;font-size:.84rem;">Stop</button>
  </div>
</form>
<div id="tbat-face" style="margin-top:16px;padding:20px;border-radius:14px;background:#071019;border:1px solid rgba(45,212,255,.3);text-align:center;">
  <div id="tbat-phase" style="font-size:.8rem;color:var(--text-secondary);letter-spacing:.08em;text-transform:uppercase;">Ready</div>
  <div id="tbat-sec" style="font-size:3rem;font-weight:800;color:var(--accent);line-height:1.1;margin:6px 0;">20</div>
  <div id="tbat-meta" style="font-size:.8rem;color:var(--text-secondary);">Round 0 / 8</div>
</div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var t = null, left = 0, round = 0, work = true, total = 8;
  function paint() {
    $('tbat-phase').textContent = t ? (work ? 'Work' : 'Rest') : 'Ready';
    $('tbat-sec').textContent = String(left);
    $('tbat-meta').textContent = 'Round ' + round + ' / ' + total;
    $('tbat-face').style.borderColor = work && t ? 'rgba(255,90,90,.55)' : 'rgba(45,212,255,.3)';
  }
  function beep() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = work ? 880 : 440;
      g.gain.value = 0.04;
      o.connect(g); g.connect(ctx.destination);
      o.start();
      setTimeout(function () { o.stop(); ctx.close(); }, 120);
    } catch (e) {}
  }
  function tick() {
    left -= 1;
    if (left <= 0) {
      if (work) {
        work = false;
        left = Number($('tbat-rest').value) || 10;
        beep();
      } else {
        round += 1;
        if (round > total) { stop(); $('tbat-phase').textContent = 'Done'; return; }
        work = true;
        left = Number($('tbat-work').value) || 20;
        beep();
      }
    }
    paint();
  }
  function stop() {
    if (t) { clearInterval(t); t = null; }
    paint();
  }
  $('tbat-go').addEventListener('click', function () {
    stop();
    total = Math.max(1, Number($('tbat-rounds').value) || 8);
    round = 1;
    work = true;
    left = Number($('tbat-work').value) || 20;
    paint();
    beep();
    t = setInterval(tick, 1000);
  });
  $('tbat-stop').addEventListener('click', stop);
  paint();
})();
</script>
