<h2 id="vbl-title" style="margin-top:0;color:var(--accent);">🏐 Volleyball Score Sheet &amp; Rotation</h2>

<form aria-describedby="vbl-desc" onsubmit="event.preventDefault();" style="margin-bottom:16px;">
  <p id="vbl-desc" class="small" style="color:rgba(230,250,255,0.7);margin-bottom:16px;">
    Rally scoring to 25 (win by two, up to 30), with the fifth set to 15 &mdash; plus a rotation tracker: list your six
    players in serving order and they rotate every time the side that wins the rally was receiving.
  </p>

  <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;">
    <button type="button" id="vbl-new" style="padding:10px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.14);border-radius:8px;color:var(--text);cursor:pointer;font-weight:600;">New match</button>
    <button type="button" id="vbl-undo" style="padding:10px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.14);border-radius:8px;color:var(--text);cursor:pointer;font-weight:600;">&#8617; Undo</button>
  </div>

  <div style="margin-bottom:12px;">
    <label for="vbl-names" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">Players in serving order (optional, one per line &mdash; 6 total)</label>
    <textarea id="vbl-names" rows="2" placeholder="Maya&#10;Oscar&#10;Priya&#10;Leo&#10;Aisha&#10;Noah" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;resize:vertical;"></textarea>
  </div>
</form>

<div id="vbl-board" aria-live="polite" style="background:rgba(0,0,0,0.3);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,0.05);margin-bottom:12px;">
  <div id="vbl-score" style="font-size:2rem;font-weight:800;color:var(--text);text-align:center;margin-bottom:4px;">0&ndash;0</div>
  <div id="vbl-detail" style="text-align:center;font-size:0.85rem;color:rgba(230,250,255,0.6);">Set 1 &middot; sets 0&ndash;0 &middot; first to 25, win by 2</div>
  <div id="vbl-sets" style="display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap;"></div>
  <div id="vbl-rotation" style="margin-top:12px;"></div>
</div>

<div style="display:flex;gap:10px;">
  <button type="button" id="vbl-apt" style="flex:1;padding:16px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:700;font-size:1rem;">Team A scores</button>
  <button type="button" id="vbl-bpt" style="flex:1;padding:16px;background:rgba(157,78,221,0.15);border:1px solid rgba(157,78,221,0.4);border-radius:8px;color:#c58ef0;cursor:pointer;font-weight:700;font-size:1rem;">Team B scores</button>
</div>

<div id="vbl-notice" style="margin-top:12px;font-size:0.8rem;color:var(--accent);min-height:1.2em;text-align:center;"></div>

<script>
(function () {
  var card = document.currentScript.parentNode;
  var $ = function (id) { return card.querySelector('#' + id); };

  function fresh() {
    return {
      a: 0, b: 0, sa: 0, sb: 0, serving: 'A', done: false, winner: null,
      rotA: ['P1','P2','P3','P4','P5','P6'], rotB: ['P1','P2','P3','P4','P5','P6'],
      history: []
    };
  }
  var S = fresh();

  function clone(s) {
    return {
      a: s.a, b: s.b, sa: s.sa, sb: s.sb, serving: s.serving, done: s.done, winner: s.winner,
      rotA: s.rotA.slice(), rotB: s.rotB.slice(), history: s.history.slice()
    };
  }

  function setTarget() {
    var played = S.sa + S.sb;
    return played === 4 ? 15 : 25;
  }

  function setOver() {
    var t = setTarget();
    if (S.a >= 30 || S.b >= 30) return true;
    return (S.a >= t || S.b >= t) && Math.abs(S.a - S.b) >= 2;
  }

  function rotate(team) {
    // each player moves up one position; new server = old position 2
    var arr = team === 'A' ? S.rotA : S.rotB;
    var first = arr.shift();
    arr.push(first);
  }

  function applyNames() {
    var names = ($('vbl-names').value || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    if (names.length) {
      var arr = ['P1','P2','P3','P4','P5','P6'];
      for (var i = 0; i < 6; i++) if (names[i]) arr[i] = names[i];
      S.rotA = arr.slice(); S.rotB = arr.slice();
    }
  }

  function add(who) {
    if (S.done) return;
    S.history.push(clone(S));
    if (who !== S.serving) rotate(who); // side-out: scoring team rotates
    S.serving = who;
    if (who === 'A') S.a++; else S.b++;
    if (setOver()) {
      if (S.a > S.b) S.sa++; else S.sb++;
      if (S.sa === 3 || S.sb === 3) { S.done = true; S.winner = S.sa > S.sb ? 'A' : 'B'; }
      else { S.a = 0; S.b = 0; }
    }
    render();
  }

  function rotationHTML(team) {
    var arr = team === 'A' ? S.rotA : S.rotB;
    var isServing = S.serving === team;
    var chips = '';
    for (var i = 0; i < 6; i++) {
      var server = isServing && i === 0;
      chips += '<div style="padding:6px 8px;border-radius:6px;font-size:0.78rem;text-align:center;' +
        (server ? 'background:rgba(57,255,20,0.16);border:1px solid rgba(57,255,20,0.4);color:#39ff14;font-weight:700;' : 'background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:rgba(230,250,255,0.7);') + '">' +
        (server ? '🎾 ' : '') + arr[i] + '</div>';
    }
    return chips;
  }

  function render() {
    var score = $('vbl-score'), detail = $('vbl-detail'), sets = $('vbl-sets'), notice = $('vbl-notice'), rot = $('vbl-rotation');
    if (S.done) {
      score.innerHTML = 'Team ' + S.winner + ' wins ' + S.sa + '&ndash;' + S.sb;
      detail.textContent = 'Match complete &mdash; first to three sets.';
      sets.innerHTML = ''; rot.innerHTML = ''; notice.textContent = '';
      return;
    }
    score.innerHTML = S.a + '&ndash;' + S.b;
    var played = S.sa + S.sb;
    detail.textContent = 'Set ' + (played + 1) + ' &middot; sets ' + S.sa + '&ndash;' + S.sb + ' &middot; first to ' + setTarget() + ', win by 2';
    var chips = '';
    for (var i = 0; i < played; i++) chips += '<span style="padding:3px 9px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:5px;font-size:0.8rem;">set ' + (i + 1) + '</span>';
    sets.innerHTML = chips || '<span style="font-size:0.8rem;color:rgba(230,250,255,0.4);">no sets completed yet</span>';
    rot.innerHTML = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">' +
      '<div><div style="font-size:0.7rem;color:rgba(230,250,255,0.5);text-transform:uppercase;margin-bottom:4px;">Team A ' + (S.serving === 'A' ? '(serving)' : '') + '</div><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px;">' + rotationHTML('A') + '</div></div>' +
      '<div><div style="font-size:0.7rem;color:rgba(230,250,255,0.5);text-transform:uppercase;margin-bottom:4px;">Team B ' + (S.serving === 'B' ? '(serving)' : '') + '</div><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px;">' + rotationHTML('B') + '</div></div>' +
      '</div>';
    var t = setTarget();
    if (S.a >= t - 1 && S.b >= t - 1 && Math.abs(S.a - S.b) <= 1) notice.textContent = 'Set point &mdash; win by two.';
    else if (played === 4) notice.textContent = 'Deciding set &mdash; first to 15.';
    else notice.textContent = 'Team ' + S.serving + ' serving.';
  }

  $('vbl-apt').addEventListener('click', function () { add('A'); });
  $('vbl-bpt').addEventListener('click', function () { add('B'); });
  $('vbl-undo').addEventListener('click', function () { if (S.history.length) { S = S.history.pop(); render(); } });
  $('vbl-new').addEventListener('click', function () { S = fresh(); applyNames(); render(); });
  $('vbl-names').addEventListener('input', applyNames);

  render();
})();
</script>
