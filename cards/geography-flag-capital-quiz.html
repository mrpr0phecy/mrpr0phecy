<h2 id="gfc-title" style="margin-top:0;color:var(--accent);">🌍 Flag &amp; Capital Quiz</h2>
<p id="gfc-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;">Learn 40 countries with flip flashcards, then test yourself on capitals and flags. Streaks, scoring and fun facts make world geography stick.</p>

<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
  <button type="button" id="gfc-m-learn" style="padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:800;border:1px solid rgba(45,212,255,.4);background:rgba(45,212,255,.12);color:var(--accent);">📖 Learn</button>
  <button type="button" id="gfc-m-cap" style="padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--text);">🏛️ Capital quiz</button>
  <button type="button" id="gfc-m-flag" style="padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--text);">🚩 Flag quiz</button>
</div>

<div id="gfc-learn" style="background:#071019;border:1px solid rgba(45,212,255,.25);border-radius:12px;padding:20px;text-align:center;">
  <div id="gfc-card" style="cursor:pointer;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;" role="button" tabindex="0" aria-label="Flashcard. Activate to flip.">
    <div id="gfc-flag" style="font-size:3.2rem;line-height:1;">🇫🇷</div>
    <div id="gfc-front" style="font-size:1.25rem;font-weight:800;">France</div>
    <div id="gfc-back" style="display:none;font-size:.95rem;color:var(--text-secondary);max-width:420px;"></div>
    <div style="font-size:.72rem;color:var(--text-secondary);margin-top:6px;">tap card to flip</div>
  </div>
  <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap;">
    <button type="button" id="gfc-prev" style="padding:8px 16px;background:rgba(255,255,255,.07);color:var(--text);border:1px solid rgba(255,255,255,.18);border-radius:8px;cursor:pointer;font-weight:700;">← Prev</button>
    <span id="gfc-pos" style="align-self:center;font-size:.82rem;color:var(--text-secondary);min-width:70px;">1 / 40</span>
    <button type="button" id="gfc-next" style="padding:8px 16px;background:rgba(255,255,255,.07);color:var(--text);border:1px solid rgba(255,255,255,.18);border-radius:8px;cursor:pointer;font-weight:700;">Next →</button>
    <button type="button" id="gfc-shuffle" style="padding:8px 16px;background:rgba(255,255,255,.07);color:var(--text);border:1px solid rgba(255,255,255,.18);border-radius:8px;cursor:pointer;font-weight:700;">🔀 Shuffle</button>
  </div>
</div>

<div id="gfc-quiz" style="display:none;background:#071019;border:1px solid rgba(45,212,255,.25);border-radius:12px;padding:20px;text-align:center;">
  <div style="display:flex;justify-content:space-between;font-size:.8rem;color:var(--text-secondary);margin-bottom:10px;flex-wrap:wrap;gap:6px;">
    <span>Question <b id="gfc-qn" style="color:var(--text);">1</b>/10</span>
    <span>Score <b id="gfc-score" style="color:var(--accent);">0</b></span>
    <span>🔥 Streak <b id="gfc-streak" style="color:#ffb347;">0</b> (best <span id="gfc-best">0</span>)</span>
  </div>
  <div id="gfc-qflag" style="font-size:3rem;line-height:1.2;">🇫🇷</div>
  <div id="gfc-qtext" style="font-size:1.05rem;font-weight:700;margin:8px 0 12px;">What is the capital of France?</div>
  <div id="gfc-opts" style="display:grid;gap:8px;max-width:440px;margin:0 auto;"></div>
  <div id="gfc-fact" style="font-size:.82rem;color:var(--text-secondary);margin-top:12px;min-height:1.4em;"></div>
  <button type="button" id="gfc-again" style="display:none;margin-top:10px;padding:9px 20px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-weight:800;">↻ New round</button>
</div>

<script>
(function(){
  var C = [
    ["France","Paris","🇫🇷","Europe","France is the most visited country on Earth — around 90 million visitors a year."],
    ["Japan","Tokyo","🇯🇵","Asia","Tokyo is the largest metro area in the world, home to about 37 million people."],
    ["Brazil","Brasília","🇧🇷","Americas","Brasília was built from scratch in just 41 months and opened as capital in 1960."],
    ["Egypt","Cairo","🇪🇬","Africa","Cairo is the largest city in Africa and the Arab world."],
    ["Australia","Canberra","🇦🇺","Oceania","The capital is Canberra — not Sydney! It was purpose-built as a compromise city."],
    ["Canada","Ottawa","🇨🇦","Americas","Canada has two official languages: English and French."],
    ["India","New Delhi","🇮🇳","Asia","India is the world's most populous country, with over 1.4 billion people."],
    ["Kenya","Nairobi","🇰🇪","Africa","Nairobi is the only capital city with a national park on its edge — lions included."],
    ["Italy","Rome","🇮🇹","Europe","Rome was founded, by legend, in 753 BC — over 2,770 years ago."],
    ["Mexico","Mexico City","🇲🇽","Americas","Mexico City is built on a drained lake bed and sinks a little every year."],
    ["China","Beijing","🇨🇳","Asia","Beijing's Forbidden City has 980 buildings and was home to 24 emperors."],
    ["Nigeria","Abuja","🇳🇬","Africa","Nigeria is Africa's most populous nation — over 220 million people."],
    ["Spain","Madrid","🇪🇸","Europe","Madrid is Europe's highest capital city, about 650 metres above sea level."],
    ["Argentina","Buenos Aires","🇦🇷","Americas","Argentina's Aconcagua is the highest mountain outside Asia."],
    ["South Korea","Seoul","🇰🇷","Asia","South Korea has among the world's fastest average internet speeds."],
    ["Morocco","Rabat","🇲🇦","Africa","Morocco's University of al-Qarawiyyin, founded 859 AD, is the world's oldest university."],
    ["Germany","Berlin","🇩🇪","Europe","Berlin has more bridges than Venice — around 1,700 of them."],
    ["Peru","Lima","🇵🇪","Americas","Peru grows over 4,000 varieties of potato — the potato's homeland."],
    ["Thailand","Bangkok","🇹🇭","Asia","Bangkok's full ceremonial name has 168 letters — the longest place name in the world."],
    ["Ethiopia","Addis Ababa","🇪🇹","Africa","Ethiopia uses its own calendar with 13 months — it is roughly 7 years behind."],
    ["Norway","Oslo","🇳🇴","Europe","Norway's sun doesn't set for 76 summer days above the Arctic Circle."],
    ["Chile","Santiago","🇨🇱","Americas","Chile is over 4,200 km long but averages only 177 km wide."],
    ["Vietnam","Hanoi","🇻🇳","Asia","Vietnam is the world's largest exporter of cashew nuts and black pepper."],
    ["Ghana","Accra","🇬🇭","Africa","Ghana was the first sub-Saharan African country to gain independence, in 1957."],
    ["Greece","Athens","🇬🇷","Europe","Athens hosted the first modern Olympic Games in 1896."],
    ["Colombia","Bogotá","🇨🇴","Americas","Bogotá sits 2,640 m high — one of the world's highest capitals."],
    ["Indonesia","Jakarta","🇮🇩","Asia","Indonesia is the world's largest island nation — over 17,000 islands."],
    ["South Africa","Pretoria","🇿🇦","Africa","South Africa has three capitals: Pretoria, Cape Town and Bloemfontein."],
    ["Portugal","Lisbon","🇵🇹","Europe","Lisbon is older than Rome — settled around 1200 BC."],
    ["Cuba","Havana","🇨🇺","Americas","Cuba's Old Havana is a UNESCO World Heritage site of 500-year-old streets."],
    ["Turkey","Ankara","🇹🇷","Europe / Asia","Istanbul straddles two continents — but the capital is Ankara."],
    ["New Zealand","Wellington","🇳🇿","Oceania","Wellington is the world's southernmost capital city."],
    ["Sweden","Stockholm","🇸🇪","Europe","Sweden's Nobel Prizes have been awarded since 1901."],
    ["Ecuador","Quito","🇪🇨","Americas","Quito is the closest capital to the Equator — just 25 km south of it."],
    ["Malaysia","Kuala Lumpur","🇲🇾","Asia","Malaysia's Petronas Towers were the world's tallest buildings from 1998 to 2004."],
    ["Iceland","Reykjavik","🇮🇸","Europe","Iceland has no mosquitoes — the climate stops them breeding."],
    ["Philippines","Manila","🇵🇭","Asia","The Philippines is an archipelago of about 7,641 islands."],
    ["Madagascar","Antananarivo","🇲🇬","Africa","About 90% of Madagascar's wildlife exists nowhere else on Earth."],
    ["Netherlands","Amsterdam","🇳🇱","Europe","Amsterdam's canals stretch over 100 km — the Dutch parliament sits in The Hague."],
    ["United States","Washington, D.C.","🇺🇸","Americas","Washington, D.C. is a federal district — not part of any state."]
  ];
  function $(id){ return document.getElementById(id); }
  var order = C.map(function(_, i){ return i; }), pos = 0, flipped = false;
  var mode = "learn", round = [], qn = 0, score = 0, streak = 0;
  var best = 0;
  try { best = parseInt(localStorage.getItem("gfc-best") || "0", 10) || 0; } catch (e) {}
  $("gfc-best").textContent = best;
  function shuffle(a){ for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function showCard(){
    var c = C[order[pos]];
    flipped = false;
    $("gfc-flag").textContent = c[2];
    $("gfc-front").textContent = c[0];
    $("gfc-back").style.display = "none";
    $("gfc-back").innerHTML = "<b style='color:var(--accent);font-size:1.1rem;'>" + c[1] + "</b><br>" + c[3] + "<br><br>💡 " + c[4];
    $("gfc-pos").textContent = (pos + 1) + " / " + C.length;
  }
  function flip(){
    flipped = !flipped;
    $("gfc-back").style.display = flipped ? "block" : "none";
    $("gfc-front").style.display = flipped ? "none" : "block";
  }
  $("gfc-card").addEventListener("click", flip);
  $("gfc-card").addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
  $("gfc-prev").addEventListener("click", function(){ pos = (pos - 1 + C.length) % C.length; showCard(); });
  $("gfc-next").addEventListener("click", function(){ pos = (pos + 1) % C.length; showCard(); });
  $("gfc-shuffle").addEventListener("click", function(){ shuffle(order); pos = 0; showCard(); });
  function setMode(m){
    mode = m;
    var styles = { on: "padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:800;border:1px solid rgba(45,212,255,.4);background:rgba(45,212,255,.12);color:var(--accent);",
      off: "padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--text);" };
    $("gfc-m-learn").style.cssText = m === "learn" ? styles.on : styles.off;
    $("gfc-m-cap").style.cssText = m === "cap" ? styles.on : styles.off;
    $("gfc-m-flag").style.cssText = m === "flag" ? styles.on : styles.off;
    $("gfc-learn").style.display = m === "learn" ? "block" : "none";
    $("gfc-quiz").style.display = m === "learn" ? "none" : "block";
    if (m !== "learn") newRound();
  }
  $("gfc-m-learn").addEventListener("click", function(){ setMode("learn"); });
  $("gfc-m-cap").addEventListener("click", function(){ setMode("cap"); });
  $("gfc-m-flag").addEventListener("click", function(){ setMode("flag"); });
  function newRound(){
    round = shuffle(C.map(function(_, i){ return i; })).slice(0, 10);
    qn = 0; score = 0; streak = 0;
    $("gfc-again").style.display = "none";
    ask();
  }
  function ask(){
    var c = C[round[qn]];
    $("gfc-qn").textContent = qn + 1;
    $("gfc-score").textContent = score;
    $("gfc-streak").textContent = streak;
    $("gfc-fact").textContent = "";
    var opts = $("gfc-opts"); opts.innerHTML = "";
    if (mode === "cap") {
      $("gfc-qflag").textContent = c[2];
      $("gfc-qtext").textContent = "What is the capital of " + c[0] + "?";
      var pool = shuffle(C.filter(function(x){ return x[1] !== c[1]; })).slice(0, 3).map(function(x){ return x[1]; });
      pool.push(c[1]); buildOpts(opts, shuffle(pool), c[1], c);
    } else {
      $("gfc-qflag").textContent = "🏳️";
      $("gfc-qtext").textContent = "Which flag belongs to " + c[0] + "?";
      var pool2 = shuffle(C.filter(function(x){ return x[2] !== c[2]; })).slice(0, 3).map(function(x){ return x[2]; });
      pool2.push(c[2]); buildOpts(opts, shuffle(pool2), c[2], c);
    }
  }
  function buildOpts(box, options, correct, c){
    options.forEach(function(opt){
      var b = document.createElement("button");
      b.type = "button"; b.textContent = opt;
      b.style.cssText = "padding:11px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.18);border-radius:8px;cursor:pointer;font-weight:700;font-size:" + (mode === "flag" ? "1.8rem" : ".95rem") + ";";
      b.addEventListener("click", function(){
        if (box.dataset.done) return; box.dataset.done = "1";
        var btns = box.querySelectorAll("button");
        for (var i = 0; i < btns.length; i++) {
          if (btns[i].textContent === correct) btns[i].style.cssText += "background:rgba(57,255,20,.15);border-color:#39ff14;color:#7dff6a;";
          btns[i].style.cursor = "default";
        }
        if (opt === correct) { score++; streak++; if (streak > best) { best = streak; try { localStorage.setItem("gfc-best", String(best)); } catch (e) {} $("gfc-best").textContent = best; } }
        else { streak = 0; b.style.cssText += "background:rgba(255,77,77,.15);border-color:#ff4d4d;color:#ff8080;"; }
        $("gfc-score").textContent = score; $("gfc-streak").textContent = streak;
        $("gfc-fact").innerHTML = "💡 " + c[4];
        setTimeout(function(){
          box.dataset.done = ""; qn++;
          if (qn < 10) ask();
          else {
            $("gfc-qtext").textContent = "Round over! You scored " + score + "/10 " + (score === 10 ? "🌟 Perfect explorer!" : score >= 7 ? "🎉 Great geography brain!" : score >= 4 ? "👍 Keep practising!" : "📖 Try Learn mode first!");
            $("gfc-qflag").textContent = score >= 7 ? "🏆" : "🗺️";
            box.innerHTML = ""; $("gfc-again").style.display = "inline-block";
          }
        }, 1400);
      });
      box.appendChild(b);
    });
  }
  $("gfc-again").addEventListener("click", newRound);
  showCard();
})();
</script>
