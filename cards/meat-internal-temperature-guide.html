<h2 id="mitg-title" style="margin-top:0;color:var(--accent);">🌡️ Meat Internal Temperature Guide</h2>

<form aria-describedby="mitg-desc" onsubmit="event.preventDefault();">
  <p id="mitg-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Probe the thickest part, away from bone. UK FSA safe-cook figures are listed beside common chef doneness for beef/lamb. Poultry and mince should hit the safe column. Carry-over cooking after rest can add 2–5 °C.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="mitg-meat" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Cut</label>
      <select id="mitg-meat" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);"></select>
    </div>
    <div>
      <label for="mitg-probe" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Your probe °C (optional)</label>
      <input id="mitg-probe" type="number" step="any" value="" placeholder="—" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="mitg-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var cuts = [
    { id: 'beef', name: 'Beef / lamb steak or roast (whole muscle)', safe: 63, note: 'FSA: 63 °C if you prefer a hot pink centre; many UK kitchens still target 70 °C / 2 min. Rare ~52, medium-rare 55, medium 60, well 71.' },
    { id: 'mince', name: 'Beef / lamb mince, burger, sausage', safe: 75, note: 'Mince must be cooked through. FSA 70 °C for 2 minutes or 75 °C instantaneous is the usual home target.' },
    { id: 'pork', name: 'Pork (whole muscle)', safe: 71, note: 'FSA 70 °C / 2 min or 75 °C. US 145 °F (63 °C) + rest is a chef figure for whole cuts, not mince.' },
    { id: 'poultry', name: 'Chicken / turkey (whole or pieces)', safe: 75, note: 'Thickest breast and thigh. Juices should run clear. Never serve poultry pink.' },
    { id: 'stuffing', name: 'Stuffed bird / stuffing', safe: 75, note: 'Probe the stuffing in the cavity as well as the meat.' },
    { id: 'fish', name: 'Fish fillet', safe: 63, note: 'Flesh should flake. Tuna/salmon may be served rarer at your own risk — this is not sushi advice.' },
    { id: 'leftover', name: 'Reheated leftovers', safe: 75, note: 'Steaming hot all the way through. Only reheat once.' }
  ];
  var sel = $('mitg-meat');
  cuts.forEach(function (c) {
    var o = document.createElement('option');
    o.value = c.id; o.textContent = c.name; sel.appendChild(o);
  });
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var id = sel.value;
    var cut = cuts.filter(function (c) { return c.id === id; })[0];
    var probe = $('mitg-probe').value === '' ? null : Number($('mitg-probe').value);
    var extra = '';
    if (probe != null && isFinite(probe)) {
      extra = cell('Your probe', probe.toFixed(1) + ' °C / ' + (probe * 9 / 5 + 32).toFixed(0) + ' °F') +
        cell('Vs safe column', probe + 0.05 >= cut.safe ? 'at or above listed safe temp' : (cut.safe - probe).toFixed(1) + ' °C below listed safe temp');
    }
    $('mitg-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Safe-cook target', cut.safe + ' °C') +
      cell('Fahrenheit', Math.round(cut.safe * 9 / 5 + 32) + ' °F') +
      extra +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">' + cut.note + ' Rest steaks 5–10 minutes. This is a kitchen aid, not a lab test.</p>';
  }
  sel.addEventListener('change', run);
  $('mitg-probe').addEventListener('input', run);
  run();
})();
</script>
