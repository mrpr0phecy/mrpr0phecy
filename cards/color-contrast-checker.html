<h2>🎨 Color Contrast Checker</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Check color contrast ratios for WCAG accessibility compliance. Test foreground and background colors for text readability.</p>

<div id="cc-app" style="max-width:600px;margin:0 auto;">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
    <div>
      <label style="display:block;margin-bottom:4px;color:#2dd4ff;font-size:12px;">Foreground (Text)</label>
      <div style="display:flex;gap:8px;">
        <input id="cc-fg" type="color" value="#ffffff" style="width:40px;height:40px;border:none;border-radius:6px;cursor:pointer;" />
        <input id="cc-fg-hex" type="text" value="#ffffff" style="flex:1;padding:8px;border-radius:6px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-family:monospace;font-size:14px;" />
      </div>
    </div>
    <div>
      <label style="display:block;margin-bottom:4px;color:#39ff14;font-size:12px;">Background</label>
      <div style="display:flex;gap:8px;">
        <input id="cc-bg" type="color" value="#0a0f14" style="width:40px;height:40px;border:none;border-radius:6px;cursor:pointer;" />
        <input id="cc-bg-hex" type="text" value="#0a0f14" style="flex:1;padding:8px;border-radius:6px;border:1px solid rgba(57,255,20,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-family:monospace;font-size:14px;" />
      </div>
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <button onclick="window._ccSwap()" style="padding:8px 16px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.3);border-radius:6px;color:#ffa500;cursor:pointer;">⇄ Swap</button>
    <button onclick="window._ccRandom()" style="padding:8px 16px;background:rgba(192,96,240,0.1);border:1px solid rgba(192,96,240,0.3);border-radius:6px;color:#c060f0;cursor:pointer;">🎲 Random</button>
  </div>

  <div id="cc-preview" style="padding:24px;border-radius:10px;margin-bottom:16px;text-align:center;">
    <div style="font-size:24px;font-weight:700;margin-bottom:8px;">The quick brown fox</div>
    <div style="font-size:16px;">jumps over the lazy dog. 0123456789</div>
    <div style="font-size:12px;margin-top:8px;">Small text sample for accessibility testing</div>
  </div>

  <div id="cc-ratio" style="text-align:center;padding:16px;background:rgba(0,0,0,0.2);border-radius:10px;margin-bottom:12px;"></div>

  <div id="cc-results" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"></div>
</div>

<script>
(function(){
  function hexToRgb(hex){
    hex=hex.replace('#','');
    if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    return{r:parseInt(hex.substr(0,2),16),g:parseInt(hex.substr(2,2),16),b:parseInt(hex.substr(4,2),16)};
  }
  function luminance(r,g,b){
    var a=[r,g,b].map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
    return a[0]*0.2126+a[1]*0.7152+a[2]*0.0722;
  }
  function contrastRatio(l1,l2){
    var lighter=Math.max(l1,l2),darker=Math.min(l1,l2);
    return(lighter+0.05)/(darker+0.05);
  }
  function check(){
    var fg=document.getElementById('cc-fg').value;
    var bg=document.getElementById('cc-bg').value;
    document.getElementById('cc-fg-hex').value=fg;
    document.getElementById('cc-bg-hex').value=bg;
    var fgRgb=hexToRgb(fg),bgRgb=hexToRgb(bg);
    var fgL=luminance(fgRgb.r,fgRgb.g,fgRgb.b);
    var bgL=luminance(bgRgb.r,bgRgb.g,bgRgb.b);
    var ratio=contrastRatio(fgL,bgL);
    // Preview
    document.getElementById('cc-preview').style.background=bg;
    document.getElementById('cc-preview').style.color=fg;
    // Ratio
    var ratioStr=ratio.toFixed(2);
    var ratioColor=ratio>=7?'#39ff14':ratio>=4.5?'#ffa500':ratio>=3?'#ff8c42':'#ff4d4d';
    document.getElementById('cc-ratio').innerHTML='<div style="font-size:2.5em;font-weight:700;color:'+ratioColor+';">'+ratioStr+':1</div><div style="font-size:13px;color:rgba(230,250,255,0.5);">Contrast Ratio</div>';
    // WCAG results
    var aaLarge=ratio>=3,aaNormal=ratio>=4.5,aaaLarge=ratio>=4.5,aaaNormal=ratio>=7;
    function badge(ok,label){return '<div style="padding:10px;background:rgba('+(ok?'57,255,20':'255,77,77')+',0.05);border:1px solid rgba('+(ok?'57,255,20':'255,77,77')+',0.2);border-radius:6px;text-align:center;">'+
      '<div style="font-size:18px;margin-bottom:4px;">'+(ok?'✓':'✗')+'</div>'+
      '<div style="font-size:12px;font-weight:600;color:'+(ok?'#39ff14':'#ff4d4d')+';">'+label+'</div></div>';}
    document.getElementById('cc-results').innerHTML=
      badge(aaNormal,'AA Normal Text')+
      badge(aaLarge,'AA Large Text')+
      badge(aaaNormal,'AAA Normal Text')+
      badge(aaaLarge,'AAA Large Text');
  }
  function swap(){
    var fg=document.getElementById('cc-fg').value;
    var bg=document.getElementById('cc-bg').value;
    document.getElementById('cc-fg').value=bg;
    document.getElementById('cc-bg').value=fg;
    check();
  }
  function random(){
    function rc(){return '#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');}
    document.getElementById('cc-fg').value=rc();
    document.getElementById('cc-bg').value=rc();
    check();
  }
  window._ccSwap=swap;window._ccRandom=random;
  ['cc-fg','cc-bg'].forEach(function(id){
    document.getElementById(id).addEventListener('input',check);
  });
  ['cc-fg-hex','cc-bg-hex'].forEach(function(id){
    document.getElementById(id).addEventListener('change',function(){
      var v=document.getElementById(id).value.trim();
      if(v.charAt(0)!=='#')v='#'+v;
      if(/^#[0-9a-fA-F]{6}$/.test(v)){
        document.getElementById(id.replace('-hex','')).value=v;
        check();
      }
    });
  });
  check();
})();
</script>
