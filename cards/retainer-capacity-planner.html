<h2 id="retainer-capacity-planner-title" style="margin-top:0;color:var(--accent)">⏱️ Retainer Capacity Planner</h2>
<form id="retainer-capacity-planner-form" aria-describedby="retainer-capacity-planner-desc" onsubmit="event.preventDefault();">
<p id="retainer-capacity-planner-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:.9rem">Check whether monthly client retainers fit your available hours and reveal effective revenue per hour. All calculations stay in your browser.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px"><div><label for="retainer-capacity-planner-clients" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Retainer clients</label><input id="retainer-capacity-planner-clients" data-key="clients" type="number" step="any" value="8" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="retainer-capacity-planner-hours" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Hours per client</label><input id="retainer-capacity-planner-hours" data-key="hours" type="number" step="any" value="12" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="retainer-capacity-planner-fee" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Monthly fee per client (£)</label><input id="retainer-capacity-planner-fee" data-key="fee" type="number" step="any" value="900" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="retainer-capacity-planner-capacity" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Available delivery hours</label><input id="retainer-capacity-planner-capacity" data-key="capacity" type="number" step="any" value="120" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div></div>
<button type="submit" style="margin-top:16px;padding:11px 18px;border:0;border-radius:8px;background:var(--accent);color:#001018;font-weight:700;cursor:pointer">Calculate</button>
<div id="retainer-capacity-planner-out" aria-live="polite" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:16px"></div>
<p style="color:var(--text-secondary);font-size:.78rem;margin-top:12px">Planning estimate only. Check tax, legal and contractual assumptions for your situation.</p>
</form>
<script>
(function(){
 const form=document.getElementById('retainer-capacity-planner-form'),out=document.getElementById('retainer-capacity-planner-out');
 const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:2}).format(Number.isFinite(n)?n:0);
 const num=(n,d=0)=>Number.isFinite(n)?n.toLocaleString('en-GB',{maximumFractionDigits:d}):'—'; const pct=n=>num(n,1)+'%';
 const dateMonths=n=>{const d=new Date();d.setDate(d.getDate()+Math.max(0,n)*30.44);return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'})};
 function calculate(){const v={};form.querySelectorAll('[data-key]').forEach(x=>v[x.dataset.key]=Number(x.value)); if(Object.values(v).some(x=>!Number.isFinite(x))){out.textContent='Enter valid numbers in every field.';return} const rows=(()=>{const used=v.clients*v.hours,rev=v.clients*v.fee; return [['Hours committed',num(used,1)],['Capacity remaining',num(v.capacity-used,1)+' hours'],['Monthly retainer revenue',money(rev)],['Effective revenue/hour',money(rev/used)]];})();out.innerHTML='';rows.forEach(r=>{const box=document.createElement('div');box.style.cssText='padding:14px;border:1px solid var(--border-light);border-radius:9px;background:rgba(45,212,255,.06)';const a=document.createElement('div'),b=document.createElement('strong');a.style.cssText='color:var(--text-secondary);font-size:.8rem';b.style.cssText='display:block;color:var(--accent);font-size:1.15rem;margin-top:5px';a.textContent=r[0];b.textContent=r[1];box.append(a,b);out.append(box)})}
 form.addEventListener('submit',calculate);form.addEventListener('input',calculate);calculate();
})();
</script>
