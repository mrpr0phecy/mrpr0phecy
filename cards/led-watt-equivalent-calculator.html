<h2 id="ledw-title" style="margin-top:0;color:var(--accent);">💡 LED Watt Equivalent Calculator</h2>

<form aria-describedby="ledw-desc" onsubmit="event.preventDefault();">
  <p id="ledw-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Rough incandescent, halogen and CFL wattage versus LED lumens. Packaging lumens win over “60 W equivalent” marketing. Efficacy defaults to typical household LEDs (~90 lm/W).
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="ledw-mode" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">I know</label>
      <select id="ledw-mode" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="inc">Old incandescent watts</option>
        <option value="lm">Lumens on the box</option>
        <option value="led">LED watts</option>
      </select>
    </div>
    <div>
      <label for="ledw-v" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Value</label>
      <input id="ledw-v" type="number" min="0" step="any" value="60" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ledw-eff" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">LED lm / W</label>
      <input id="ledw-eff" type="number" min="1" step="any" value="90" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="ledw-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var incToLm = { 15: 90, 25: 220, 40: 450, 60: 800, 75: 1100, 100: 1600, 150: 2600 };
  function incandescentLumens(w) {
    var keys = Object.keys(incToLm).map(Number).sort(function (a, b) { return a - b; });
    if (w <= keys[0]) return incToLm[keys[0]] * (w / keys[0]);
    for (var i = 1; i < keys.length; i++) {
      if (w <= keys[i]) {
        var a = keys[i - 1], b = keys[i];
        var t = (w - a) / (b - a);
        return incToLm[a] + t * (incToLm[b] - incToLm[a]);
      }
    }
    return incToLm[keys[keys.length - 1]] * (w / keys[keys.length - 1]);
  }
  function nearestInc(lm) {
    var best = 40, bestD = Infinity;
    Object.keys(incToLm).forEach(function (k) {
      var d = Math.abs(incToLm[k] - lm);
      if (d < bestD) { bestD = d; best = Number(k); }
    });
    return best;
  }
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var mode = $('ledw-mode').value, v = Number($('ledw-v').value), eff = Number($('ledw-eff').value);
    if (!(v > 0) || !(eff > 0)) {
      $('ledw-out').textContent = 'Enter a positive value and LED efficacy.';
      return;
    }
    var lm, ledW, incW;
    if (mode === 'inc') { incW = v; lm = incandescentLumens(v); ledW = lm / eff; }
    else if (mode === 'lm') { lm = v; ledW = lm / eff; incW = nearestInc(lm); }
    else { ledW = v; lm = v * eff; incW = nearestInc(lm); }
    var cfl = lm / 60;
    var halogen = lm / 16;
    $('ledw-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Lumens', Math.round(lm) + ' lm') +
      cell('LED watts', ledW.toFixed(1) + ' W') +
      cell('Incandescent-like', Math.round(incW) + ' W class') +
      cell('CFL-like (~60 lm/W)', cfl.toFixed(0) + ' W') +
      cell('Halogen-like (~16 lm/W)', halogen.toFixed(0) + ' W') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Typical mappings: 40 W ≈ 450 lm, 60 W ≈ 800 lm, 75 W ≈ 1,100 lm, 100 W ≈ 1,600 lm. Check the lumen figure on the LED pack, not only “equivalent watts”.</p>';
  }
  ['ledw-mode', 'ledw-v', 'ledw-eff'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
