<h2 id="cors-title" style="margin-top:0;color:var(--accent);">🌐 CORS Header Builder</h2>

<form aria-describedby="cors-desc" onsubmit="event.preventDefault();">
  <p id="cors-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Emit <code>Access-Control-*</code> headers for a simple or preflight response. <code>*</code> plus credentials is invalid. Prefer an explicit origin in production.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;">
    <div>
      <label for="cors-origin" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Allow-Origin</label>
      <input id="cors-origin" type="text" value="https://app.example.com" spellcheck="false" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">
    </div>
    <div>
      <label for="cors-methods" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Allow-Methods</label>
      <input id="cors-methods" type="text" value="GET, POST, PUT, DELETE, OPTIONS" spellcheck="false" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">
    </div>
    <div>
      <label for="cors-headers" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Allow-Headers</label>
      <input id="cors-headers" type="text" value="Content-Type, Authorization" spellcheck="false" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">
    </div>
    <div>
      <label for="cors-max" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Max-Age (s)</label>
      <input id="cors-max" type="number" min="0" value="86400" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
  <label style="display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--text-secondary);margin-top:10px;"><input id="cors-cred" type="checkbox" style="accent-color:var(--accent);"> Allow-Credentials: true</label>
</form>
<pre id="cors-out" style="margin-top:12px;padding:12px;border-radius:10px;background:#071019;border:1px solid rgba(45,212,255,.28);color:#91f7ff;font-size:.78rem;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;"></pre>
<button type="button" id="cors-copy" style="margin-top:8px;padding:8px 12px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:700;">Copy headers</button>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var origin = $('cors-origin').value.trim() || '*';
    var cred = $('cors-cred').checked;
    if (cred && origin === '*') origin = 'https://app.example.com';
    var lines = [
      'Access-Control-Allow-Origin: ' + origin,
      'Access-Control-Allow-Methods: ' + ($('cors-methods').value.trim() || 'GET, POST, OPTIONS'),
      'Access-Control-Allow-Headers: ' + ($('cors-headers').value.trim() || 'Content-Type'),
      'Access-Control-Max-Age: ' + (Number($('cors-max').value) || 0)
    ];
    if (cred) {
      lines.push('Access-Control-Allow-Credentials: true');
      lines.push('Vary: Origin');
    }
    if (cred && $('cors-origin').value.trim() === '*') {
      lines.unshift('# * + credentials is illegal; origin rewritten');
    }
    $('cors-out').textContent = lines.join('\n');
  }
  ['cors-origin', 'cors-methods', 'cors-headers', 'cors-max', 'cors-cred'].forEach(function (id) {
    $(id).addEventListener('input', run); $(id).addEventListener('change', run);
  });
  $('cors-copy').addEventListener('click', function () {
    var btn = this, t = $('cors-out').textContent;
    function done() { btn.textContent = '✓ Copied'; setTimeout(function () { btn.textContent = 'Copy headers'; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done); else done();
  });
  run();
})();
</script>
