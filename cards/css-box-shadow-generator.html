<h2 id="cbs-title" style="margin-top:0;color:var(--accent);">🌑 CSS Box Shadow Generator</h2>

<p id="cbs-desc" class="small" style="color:var(--text-secondary);margin-bottom:16px;">
  Tune a CSS <code>box-shadow</code> visually, choose a colour and opacity, test inset mode and copy production-ready
  CSS. The preview updates as you move the controls, so there is no design account or upload step.
</p>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;align-items:end;margin-bottom:11px;">
  <label for="cbs-x" style="font-size:.77rem;color:var(--text-secondary);">Horizontal <strong id="cbs-xv" style="color:var(--accent);float:right;">12px</strong><input id="cbs-x" type="range" min="-50" max="50" value="12" style="display:block;width:100%;accent-color:var(--accent);margin-top:5px;"></label>
  <label for="cbs-y" style="font-size:.77rem;color:var(--text-secondary);">Vertical <strong id="cbs-yv" style="color:var(--accent);float:right;">16px</strong><input id="cbs-y" type="range" min="-50" max="50" value="16" style="display:block;width:100%;accent-color:var(--accent);margin-top:5px;"></label>
  <label for="cbs-blur" style="font-size:.77rem;color:var(--text-secondary);">Blur <strong id="cbs-blurv" style="color:var(--accent);float:right;">32px</strong><input id="cbs-blur" type="range" min="0" max="100" value="32" style="display:block;width:100%;accent-color:var(--accent);margin-top:5px;"></label>
  <label for="cbs-spread" style="font-size:.77rem;color:var(--text-secondary);">Spread <strong id="cbs-spreadv" style="color:var(--accent);float:right;">-8px</strong><input id="cbs-spread" type="range" min="-50" max="50" value="-8" style="display:block;width:100%;accent-color:var(--accent);margin-top:5px;"></label>
  <label for="cbs-alpha" style="font-size:.77rem;color:var(--text-secondary);">Opacity <strong id="cbs-alphav" style="color:var(--accent);float:right;">28%</strong><input id="cbs-alpha" type="range" min="0" max="100" value="28" style="display:block;width:100%;accent-color:var(--accent);margin-top:5px;"></label>
  <div style="display:flex;align-items:center;gap:10px;padding:6px 0;">
    <label for="cbs-color" style="font-size:.77rem;color:var(--text-secondary);">Colour<br><input id="cbs-color" type="color" value="#000000" style="width:52px;height:32px;border:0;background:transparent;padding:0;margin-top:4px;cursor:pointer;"></label>
    <label for="cbs-inset" style="display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--text-secondary);margin-top:16px;"><input id="cbs-inset" type="checkbox" style="accent-color:var(--accent);"> Inset</label>
  </div>
</div>

<div style="display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 13px;">
  <span style="padding:6px 2px;font-size:.75rem;color:var(--text-secondary);">Presets:</span>
  <button type="button" class="cbs-preset" data-values="0,1,2,0,18,#000000,0" style="padding:6px 9px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.15);border-radius:7px;cursor:pointer;font-size:.75rem;">Hairline</button>
  <button type="button" class="cbs-preset" data-values="0,8,24,-6,24,#0b1a2a,0" style="padding:6px 9px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.15);border-radius:7px;cursor:pointer;font-size:.75rem;">Floating card</button>
  <button type="button" class="cbs-preset" data-values="0,20,45,-12,35,#000000,0" style="padding:6px 9px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.15);border-radius:7px;cursor:pointer;font-size:.75rem;">Deep lift</button>
  <button type="button" class="cbs-preset" data-values="0,2,12,0,32,#00d9ff,0" style="padding:6px 9px;background:rgba(45,212,255,.08);color:var(--accent);border:1px solid rgba(45,212,255,.3);border-radius:7px;cursor:pointer;font-size:.75rem;">Cyan glow</button>
  <button type="button" class="cbs-preset" data-values="0,2,8,0,35,#000000,1" style="padding:6px 9px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.15);border-radius:7px;cursor:pointer;font-size:.75rem;">Inset</button>
</div>

<div style="padding:28px 18px;border-radius:12px;background:linear-gradient(135deg,#203548,#0d1721);border:1px solid rgba(255,255,255,.11);overflow:hidden;">
  <div id="cbs-preview" style="display:flex;align-items:center;justify-content:center;min-height:145px;max-width:300px;margin:auto;border-radius:18px;background:#f8fbff;color:#17212b;font-weight:800;text-align:center;padding:22px;">Your shadow<br><span style="font-weight:500;font-size:.77rem;opacity:.68;">live CSS preview</span></div>
</div>

<label for="cbs-output" style="display:block;font-size:.78rem;color:var(--text-secondary);margin:13px 0 5px;">CSS declaration</label>
<textarea id="cbs-output" rows="3" readonly spellcheck="false" aria-label="Generated CSS box shadow" style="width:100%;box-sizing:border-box;padding:11px;border-radius:9px;background:rgba(0,0,0,.3);color:#91f7ff;border:1px solid rgba(45,212,255,.3);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;resize:vertical;"></textarea>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;"><button type="button" id="cbs-copy" style="padding:8px 13px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-weight:800;font-size:.81rem;">Copy CSS</button><button type="button" id="cbs-reset" style="padding:8px 12px;background:transparent;color:var(--text-secondary);border:1px solid rgba(255,255,255,.16);border-radius:8px;cursor:pointer;font-size:.8rem;">Reset</button><span id="cbs-status" aria-live="polite" style="font-size:.76rem;color:var(--text-secondary);"></span></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var controls = ['x', 'y', 'blur', 'spread', 'alpha'];
  var defaults = [12, 16, 32, -8, 28, '#000000', false];

  function rgb(hex) {
    var match = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return match ? [parseInt(match[1], 16), parseInt(match[2], 16), parseInt(match[3], 16)] : [0, 0, 0];
  }
  function outputValue() {
    var values = controls.map(function (name) { return Number($('cbs-' + name).value); });
    var color = rgb($('cbs-color').value);
    var alpha = (values[4] / 100).toFixed(2).replace(/0$/, '').replace(/\.$/, '');
    return 'box-shadow: ' + ($('cbs-inset').checked ? 'inset ' : '') + values[0] + 'px ' + values[1] + 'px ' + values[2] + 'px ' + values[3] + 'px rgba(' + color.join(', ') + ', ' + alpha + ');';
  }
  function update() {
    controls.forEach(function (name) { $('cbs-' + name + 'v').textContent = $('cbs-' + name).value + (name === 'alpha' ? '%' : 'px'); });
    var declaration = outputValue();
    $('cbs-output').value = declaration;
    $('cbs-preview').style.boxShadow = declaration.replace(/^box-shadow:\s*|;$/g, '');
    $('cbs-status').textContent = $('cbs-inset').checked ? 'Inset shadow' : 'Outer shadow';
  }
  function setValues(values) {
    ['x', 'y', 'blur', 'spread', 'alpha'].forEach(function (name, index) { $('cbs-' + name).value = values[index]; });
    $('cbs-color').value = values[5]; $('cbs-inset').checked = String(values[6]) === '1' || values[6] === true; update();
  }
  function copyText(text, done) { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { fallback(text, done); }); else fallback(text, done); }
  function fallback(text, done) { var helper = document.createElement('textarea'); helper.value = text; helper.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(helper); helper.select(); try { document.execCommand('copy'); } catch (e) {} helper.remove(); done(); }

  controls.forEach(function (name) { $('cbs-' + name).addEventListener('input', update); });
  $('cbs-color').addEventListener('input', update); $('cbs-inset').addEventListener('change', update);
  Array.prototype.forEach.call(host.querySelectorAll('.cbs-preset'), function (button) { button.addEventListener('click', function () { setValues(this.dataset.values.split(',')); }); });
  $('cbs-copy').addEventListener('click', function () { copyText($('cbs-output').value, function () { $('cbs-copy').textContent = '✓ Copied'; setTimeout(function () { $('cbs-copy').textContent = 'Copy CSS'; }, 1400); }); });
  $('cbs-reset').addEventListener('click', function () { setValues(defaults); });
  update();
})();
</script>
