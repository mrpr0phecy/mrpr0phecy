<!-- cards/wall-anchor-guide.html -->
<h2 id="wallanch-title" style="margin-top:0;color:var(--accent);">🔩 Wall Anchor Selector</h2>

<form aria-describedby="wallanch-desc" onsubmit="event.preventDefault();">
  <p id="wallanch-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Not sure what fixings to use? Tell us your wall type and what you're hanging — we'll tell you exactly what to buy.
  </p>

  <div style="margin-bottom:14px;">
    <label for="wallanch-wall" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Wall Type</label>
    <select id="wallanch-wall" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="plasterboard">Plasterboard / Drywall (hollow)</option>
      <option value="brick">Brick / Masonry (solid)</option>
      <option value="concrete">Concrete (solid)</option>
      <option value="wood">Wood / Timber stud</option>
      <option value="tile">Tiled wall (over plasterboard)</option>
    </select>
  </div>

  <div style="margin-bottom:14px;">
    <label for="wallanch-weight" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">What are you hanging?</label>
    <select id="wallanch-weight" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="light">Light — picture frame, small shelf (&lt;5 kg)</option>
      <option value="medium">Medium — mirror, coat rack, floating shelf (5–15 kg)</option>
      <option value="heavy">Heavy — TV mount, large shelf, cabinet (15–40 kg)</option>
      <option value="xheavy">Very heavy — wall bed, pull-up bar (40+ kg)</option>
    </select>
  </div>

  <button type="button" onclick="wallanchRecommend()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🔩 Get Recommendation
  </button>

  <div id="wallanch-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);">
    <div id="wallanch-fixing" style="font-size:1.1rem;color:var(--accent);font-weight:700;margin-bottom:8px;"></div>
    <div id="wallanch-desc2" style="font-size:0.9rem;color:var(--text);line-height:1.5;margin-bottom:10px;"></div>
    <div id="wallanch-how" style="font-size:0.85rem;color:var(--text-secondary);line-height:1.6;margin-bottom:10px;"></div>
    <div id="wallanch-warning" style="font-size:0.8rem;padding:8px 12px;border-radius:6px;background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.2);color:#ff4d4d;"></div>
  </div>
</form>

<script>
(function(){
  var wallanchDB={
    plasterboard:{
      light:{fix:'Plastic Wall Plug + Screw (6mm)',desc:'Standard plastic expansion plug for light items. Push into pre-drilled hole, then drive screw in.',how:'1. Drill 6mm hole\n2. Push plug flush with wall\n3. Drive screw into plug, leave 10mm protruding\n4. Hang item',warn:'⚠️ Do NOT use these for anything heavy — they pull straight out of plasterboard under load.'},
      medium:{fix:'🔧 Spring Toggle / Gravity Toggle Anchor',desc:'A toggle that opens behind the plasterboard, spreading the load across a wider area. Rated 10–25 kg each.',how:'1. Drill 10–13mm hole\n2. Fold toggle and push through\n3. Pull back until toggle opens behind board\n4. Tighten screw gently — do NOT overtighten',warn:'⚠️ Once the toggle is behind the wall, you cannot remove it without losing it. Measure twice, drill once.'},
      heavy:{fix:'🔧 Snap Toggle / Heavy-Duty Hollow Wall Anchor',desc:'Metal toggle bolt rated 25–50 kg per anchor. Uses a machine screw into a spring-loaded metal toggle behind the board.',how:'1. Drill 13mm hole\n2. Thread toggle onto bolt\n3. Push toggle through, pull back to lock\n4. Tighten firmly but don\'t crack the plasterboard',warn:'⚠️ For TVs and heavy shelves, try to hit a timber stud behind the plasterboard. Use a stud finder — toggles are plan B.'},
      xheavy:{fix:'🏗️ Find the Studs — or Use a French Cleat',desc:'At 40+ kg on plasterboard, no toggle is safe long-term. Locate timber studs with a stud finder and bolt directly into them. A French cleat distributes load across multiple studs.',how:'1. Use a stud finder to locate studs (typically 400mm or 600mm apart)\n2. Drill pilot hole into stud\n3. Use 75mm+ coach screws or heavy lag bolts\n4. For wide items, use a French cleat spanning 2+ studs',warn:'🚨 If you cannot find studs, do NOT hang 40+ kg on plasterboard. Consider floor-standing furniture instead.'}
    },
    brick:{
      light:{fix:'🔩 Wall Plug (Rawl Plug) + Screw (6mm)',desc:'The classic red or yellow wall plug. Drill into brick/mortar, insert plug, drive screw. Simple and reliable.',how:'1. Drill 6mm hole with masonry bit (hammer drill recommended)\n2. Blow out dust\n3. Push plug in flush\n4. Drive screw, leave 10mm protruding',warn:'💡 Drill into the brick itself, not the mortar — mortar crumbles over time.'},
      medium:{fix:'🔩 Wall Plug (7mm) + Screw or Coach Screw',desc:'Slightly larger plug for more grip. Yellow 7mm plugs in brick hold 15–20 kg each.',how:'1. Drill 7mm hole with masonry bit\n2. Clean out dust\n3. Insert plug\n4. Use a 4–5mm screw, leave 15mm protruding',warn:'💡 Use a hammer drill, not a regular drill — it needs the impact action to get through brick.'},
      heavy:{fix:'🔩 Sleeve Anchor / Throughbolt (M8–M10)',desc:'A metal sleeve that expands inside the drilled hole as you tighten the nut. Extremely strong — rated 50–100 kg+ in brick.',how:'1. Drill 8mm or 10mm hole to required depth\n2. Push anchor through item and into wall\n3. Tighten nut until snug — the sleeve expands and grips\n4. Do NOT overtighten',warn:'⚠️ Once installed, these are very difficult to remove. Position carefully.'},
      xheavy:{fix:'🔩 Resin Anchor / Chemical Anchor',desc:'Inject epoxy resin into the hole, then insert a threaded rod. The resin bonds to the entire depth of the hole. Used for structural loads.',how:'1. Drill hole to required depth, clean thoroughly\n2. Inject resin using applicator gun\n3. Insert threaded rod, rotate slightly to distribute resin\n4. Wait for cure time (typically 20–45 min)',warn:'⚠️ Chemical anchors are permanent. Follow manufacturer cure times exactly — loading too early = failure.'}
    },
    concrete:{
      light:{fix:'🔩 Nylon Wall Plug + Screw (6mm)',desc:'Same concept as brick. Drill with a masonry bit, insert plug, drive screw.',how:'1. Use hammer drill + masonry bit\n2. Drill 6mm hole\n3. Insert nylon plug\n4. Drive screw',warn:'💡 Concrete is harder than brick — use sharp masonry bits and let the drill do the work.'},
      medium:{fix:'🔩 Wall Plug (8mm) + Screw',desc:'Larger plug for better grip in concrete. Holds 15–25 kg each.',how:'1. Drill 8mm hole\n2. Clean dust with brush or blower\n3. Insert plug flush\n4. Use 5mm screw',warn:'💡 If the drill keeps stalling, you may have hit rebar. Move position slightly.'},
      heavy:{fix:'🔩 Wedge Anchor / Sleeve Anchor (M10)',desc:'Heavy-duty mechanical anchor. Rated 100+ kg in solid concrete.',how:'1. Drill 10mm hole to specified depth\n2. Insert anchor through fixture\n3. Tighten nut — wedge expands inside hole\n4. Torque to manufacturer spec',warn:'⚠️ These are extremely strong but permanent. Measure carefully.'},
      xheavy:{fix:'🏗️ Chemical Resin Anchor + Threaded Rod',desc:'For structural loads in concrete. Resin fills the hole and bonds the rod along its full length.',how:'1. Drill and clean hole thoroughly\n2. Fill hole 2/3 with resin\n3. Insert threaded rod with twisting motion\n4. Allow full cure before loading',warn:'🚨 For structural work, consult an engineer. This tool covers domestic hanging only.'}
    },
    wood:{
      light:{fix:'🪵 Wood Screw (directly)',desc:'No anchor needed! Drive a wood screw directly into timber. The wood threads grip naturally.',how:'1. Drill a pilot hole slightly smaller than the screw\n2. Drive screw directly into wood\n3. Leave 10–15mm protruding for hanging',warn:'💡 Always drill a pilot hole in hardwood — it prevents splitting.'},
      medium:{fix:'🪵 Wood Screw (thicker gauge) or Coach Bolt',desc:'Use a thicker screw (5–6mm) or a coach bolt for medium loads in timber.',how:'1. Drill pilot hole\n2. Drive 5–6mm wood screw\n3. For extra strength, use a coach bolt with washer and nut on the back',warn:'💡 If the timber is soft (pine), use longer screws to reach deeper into the grain.'},
      heavy:{fix:'🪵 Carriage Bolt / Through-Bolt with Backing Plate',desc:'Drill through the timber and use a bolt with a backing plate on the other side to distribute load.',how:'1. Drill through timber\n2. Insert bolt from front\n3. Add washer and nut on back\n4. Tighten firmly',warn:'💡 For hollow timber (like a hollow-core door), you need toggle bolts, not wood screws.'},
      xheavy:{fix:'🏗️ Through-Bolt + Steel Bracket',desc:'For very heavy loads on timber, use multiple through-bolts with a steel mounting bracket that spreads load across the grain.',how:'1. Use a steel L-bracket or French cleat\n2. Bolt through with at least 3 fixings\n3. Ensure bolts go into solid timber, not just facing',warn:'⚠️ Know your timber. Old joists can be brittle. Test with one fixing first.'}
    },
    tile:{
      light:{fix:'🔧 Diamond-tipped hole saw + Wall Plug',desc:'Drill through the tile first with a diamond bit (no hammer!), then use a standard wall plug in the substrate behind.',how:'1. Mark position, apply masking tape to prevent bit slipping\n2. Drill through tile with diamond bit on SLOW speed, no hammer\n3. Switch to masonry bit for the wall behind\n4. Insert plug and screw',warn:'🚨 NEVER use hammer action on tiles — they crack instantly. Hammer drill only after you\'re through the tile.'},
      medium:{fix:'🔧 Diamond bit + Heavy-duty wall plug',desc:'Same technique, but use a larger plug (7–8mm) in the wall behind the tile.',how:'1. Masking tape on tile\n2. Diamond bit through tile (slow, no hammer)\n3. Masonry bit into wall behind\n4. 7mm plug + 5mm screw',warn:'💡 Keep the diamond bit cool with a damp sponge — overheating kills the bit.'},
      heavy:{fix:'🔧 Diamond bit + Sleeve anchor in brick behind',desc:'For heavy loads on tiled walls, you need to reach into the solid wall behind. Use a sleeve anchor.',how:'1. Diamond bit through tile\n2. Masonry bit into brick/concrete behind\n3. Insert sleeve anchor\n4. Tighten to expand',warn:'⚠️ If the tile is on plasterboard (tap it — hollow sound = plasterboard), use plasterboard fixings instead.'},
      xheavy:{fix:'🏗️ Consider removing tiles in the fixing area',desc:'For very heavy loads, it may be better to remove a tile, fix directly to the wall, and re-tile around the bracket.',how:'1. Carefully remove tile with a grout saw and chisel\n2. Fix bracket directly to wall\n3. Tile around the bracket\n4. Use silicone to seal',warn:'🚨 If you\'re not confident with tile work, hire a professional. Cracked tiles are expensive to match.'}
    }
  };

  window.wallanchRecommend=function(){
    var wall=document.getElementById('wallanch-wall').value;
    var weight=document.getElementById('wallanch-weight').value;
    var r=wallanchDB[wall][weight];
    document.getElementById('wallanch-fixing').textContent='✅ '+r.fix;
    document.getElementById('wallanch-desc2').textContent=r.desc;
    document.getElementById('wallanch-how').innerHTML=r.how.replace(/\n/g,'<br>');
    document.getElementById('wallanch-warning').textContent=r.warn;
    document.getElementById('wallanch-result').style.display='block';
  };
})();
</script>
