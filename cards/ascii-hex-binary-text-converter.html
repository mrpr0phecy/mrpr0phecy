<h2 id="ahbt-title" style="margin-top:0;color:var(--accent);">🔤 Text ⇄ Hex ⇄ Binary</h2>

<form aria-describedby="ahbt-desc" onsubmit="event.preventDefault();">
  <p id="ahbt-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Encode UTF-8 text as hex or binary, or decode hex/binary back. Spaces in hex are ignored. Binary is 8-bit groups. Nothing is sent anywhere.
  </p>
  <label for="ahbt-text" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Text</label>
  <textarea id="ahbt-text" rows="3" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-size:.85rem;">Hello</textarea>
  <label for="ahbt-hex" style="display:block;font-size:.78rem;color:var(--text-secondary);margin:10px 0 5px;">Hex</label>
  <textarea id="ahbt-hex" rows="2" spellcheck="false" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;"></textarea>
  <label for="ahbt-bin" style="display:block;font-size:.78rem;color:var(--text-secondary);margin:10px 0 5px;">Binary</label>
  <textarea id="ahbt-bin" rows="2" spellcheck="false" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;"></textarea>
</form>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var lock = false;
  function bytesOf(str) {
    return new TextEncoder().encode(str);
  }
  function fromBytes(b) {
    var hex = [], bin = [];
    for (var i = 0; i < b.length; i++) {
      hex.push(b[i].toString(16).padStart(2, '0'));
      bin.push(b[i].toString(2).padStart(8, '0'));
    }
    return { hex: hex.join(' '), bin: bin.join(' ') };
  }
  function fromText() {
    if (lock) return;
    var enc = fromBytes(bytesOf($('ahbt-text').value));
    lock = true;
    $('ahbt-hex').value = enc.hex;
    $('ahbt-bin').value = enc.bin;
    lock = false;
  }
  function fromHex() {
    if (lock) return;
    var h = $('ahbt-hex').value.replace(/[^0-9a-fA-F]/g, '');
    if (h.length % 2) return;
    var arr = [];
    for (var i = 0; i < h.length; i += 2) arr.push(parseInt(h.slice(i, i + 2), 16));
    var u8 = new Uint8Array(arr);
    var text = new TextDecoder().decode(u8);
    var enc = fromBytes(u8);
    lock = true;
    $('ahbt-text').value = text;
    $('ahbt-bin').value = enc.bin;
    lock = false;
  }
  function fromBin() {
    if (lock) return;
    var bits = $('ahbt-bin').value.replace(/[^01]/g, '');
    if (bits.length % 8) return;
    var arr = [];
    for (var i = 0; i < bits.length; i += 8) arr.push(parseInt(bits.slice(i, i + 8), 2));
    var u8 = new Uint8Array(arr);
    var text = new TextDecoder().decode(u8);
    var enc = fromBytes(u8);
    lock = true;
    $('ahbt-text').value = text;
    $('ahbt-hex').value = enc.hex;
    lock = false;
  }
  $('ahbt-text').addEventListener('input', fromText);
  $('ahbt-hex').addEventListener('input', fromHex);
  $('ahbt-bin').addEventListener('input', fromBin);
  fromText();
})();
</script>
