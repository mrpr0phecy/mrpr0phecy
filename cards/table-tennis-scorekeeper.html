<h2 id="ttn-title" style="margin-top:0;color:var(--accent);">🏓 Table Tennis Scorer</h2>

<form aria-describedby="ttn-desc" onsubmit="event.preventDefault();" style="margin-bottom:16px;">
  <p id="ttn-desc" class="small" style="color:rgba(230,250,255,0.7);margin-bottom:16px;">
    Rally scoring to 11, win by two &mdash; no cap, so a deuce game can run long. Tap to score and it tracks games and the
    best-of-five (or seven) match for you.
  </p>

  <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;">
    <div>
      <label for="ttn-best" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:13px;">Match format</label>
      <select id="ttn-best" style="padding:9px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:13px;">
        <option value="5" selected>Best of 5</option>
        <option value="7">Best of 7</option>
      </select>
    </div>
    <button type="button" id="ttn-new" style="padding:9px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.14);border-radius:8px;color:var(--text);cursor:pointer;font-weight:600;">New match</button>
    <button type="button" id="ttn-undo" style="padding:9px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.14);border-radius:8px;color:var(--text);cursor:pointer;font-weight:600;">&#8617; Undo</button>
  </div>
</form>

<div id="ttn-board" aria-live="polite" style="background:rgba(0,0,0,0.3);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,0.05);margin-bottom:12px;">
  <div id="ttn-score" style="font-size:2rem;font-weight:800;color:var(--text);text-align:center;margin-bottom:4px;">0&ndash;0</div>
  <div id="ttn-detail" style="text-align:center;font-size:0.85rem;color:rgba(230,250,255,0.6);">Game 1 &middot; games 0&ndash;0 &middot; first to 11, win by 2</div>
  <div id="ttn-sets" style="display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap;"></div>
</div>

<div style="display:flex;gap:10px;">
  <button type="button" id="ttn-apt" style="flex:1;padding:16px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:700;font-size:1rem;">Player A +1</button>
  <button type="button" id="ttn-bpt" style="flex:1;padding:16px;background:rgba(157,78,221,0.15);border:1px solid rgba(157,78,221,0.4);border-radius:8px;color:#c58ef0;cursor:pointer;font-weight:700;font-size:1rem;">Player B +1</button>
</div>

<div id="ttn-notice" style="margin-top:12px;font-size:0.8rem;color:var(--accent);min-height:1.2em;text-align:center;"></div>

<script>
(function () {
  var card = document.currentScript.parentNode;
  var $ = function (id) { return card.querySelector('#' + id); };

  function fresh(best) { return { a: 0, b: 0, ga: 0, gb: 0, best: best, done: false, winner: null, history: [] }; }
  var S = fresh(5);

  function clone(s) { return { a: s.a, b: s.b, ga: s.ga, gb: s.gb, best: s.best, done: s.done, winner: s.winner, history: s.history.slice() }; }

  function gameOver() { return (S.a >= 11 || S.b >= 11) && Math.abs(S.a - S.b) >= 2; }

  function add(who) {
    if (S.done) return;
    S.history.push(clone(S));
    if (who === 'A') S.a++; else S.b++;
    if (gameOver()) {
      if (S.a > S.b) S.ga++; else S.gb++;
      var need = Math.ceil(S.best / 2);
      if (S.ga >= need || S.gb >= need) { S.done = true; S.winner = S.ga > S.gb ? 'A' : 'B'; }
      else { S.a = 0; S.b = 0; }
    }
    render();
  }

  function render() {
    var score = $('ttn-score'), detail = $('ttn-detail'), sets = $('ttn-sets'), notice = $('ttn-notice');
    if (S.done) {
      score.innerHTML = 'Player ' + S.winner + ' wins ' + S.ga + '&ndash;' + S.gb;
      detail.textContent = 'Match complete &mdash; best of ' + S.best + '.';
      sets.innerHTML = ''; notice.textContent = '';
      return;
    }
    score.innerHTML = S.a + '&ndash;' + S.b;
    detail.textContent = 'Game ' + (S.ga + S.gb + 1) + ' &middot; games ' + S.ga + '&ndash;' + S.gb + ' &middot; first to 11, win by 2';
    var chips = '';
    for (var i = 0; i < S.ga + S.gb; i++) chips += '<span style="padding:3px 9px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:5px;font-size:0.8rem;">game ' + (i + 1) + '</span>';
    sets.innerHTML = chips || '<span style="font-size:0.8rem;color:rgba(230,250,255,0.4);">no games completed yet</span>';
    if (S.a >= 10 && S.b >= 10 && S.a === S.b) notice.textContent = 'Deuce &mdash; win by two.';
    else if ((S.a === 10 && S.a > S.b) || (S.b === 10 && S.b > S.a)) notice.textContent = 'Game point &mdash; one more (with a two-point lead).';
    else if (S.ga + S.gb + 1 === S.best) notice.textContent = 'Deciding game.';
    else notice.textContent = '';
  }

  $('ttn-apt').addEventListener('click', function () { add('A'); });
  $('ttn-bpt').addEventListener('click', function () { add('B'); });
  $('ttn-undo').addEventListener('click', function () { if (S.history.length) { S = S.history.pop(); render(); } });
  $('ttn-new').addEventListener('click', function () { S = fresh(parseInt($('ttn-best').value, 10)); render(); });

  render();
})();
</script>
