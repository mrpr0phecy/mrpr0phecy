<h2>🐍 The Identities You're Dragging Behind You</h2>
<p class="description">You're carrying identities that expired years ago — "the shy one," "the responsible one," "the one who doesn't need help." They were useful once. Now they're cages. This tool helps you see which ones to shed.</p>
<div id="id-app" style="max-width:540px;margin:0 auto;"></div>
<script>
(function(){
'use strict';
var step=0,identity='',cost='',freedom='';
var identities=['The strong one (who never asks for help)','The peacemaker (who absorbs everyone\'s conflict)','The responsible one (who carries everything)','The funny one (who hides pain behind humour)','The smart one (who can\'t admit they don\'t know)','The nice one (who can\'t say no)','The independent one (who can\'t need anyone)','The achiever (who ties worth to productivity)','The caretaker (who puts everyone first)','The quiet one (who learned it\'s safer not to speak)','The rebel (who resists everything, even what\'s good)','The fixer (who solves everyone else\'s problems)'];
function init(){step=0;render();}
function render(){
  var h='';
  if(step===0){
    h+='<div style="text-align:center;margin-bottom:20px;">';
    h+='<div style="font-size:64px;margin-bottom:12px;">🐍</div>';
    h+='<h3 style="color:#39ff14;margin:0 0 8px;">Snakes shed their skin when they outgrow it. You should too.</h3>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);">Somewhere along the way, you picked up an identity. Maybe it was assigned to you by your family ("you\'re the responsible one"). Maybe you chose it to survive a difficult situation ("I\'ll be the strong one"). It fit. It worked. It protected you.</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-top:12px;">But here\'s the thing about identities: <b>they calcify</b>. What started as a survival strategy becomes a prison. You\'re still performing a role that the situation no longer requires. And the cost is enormous — because you can\'t grow into who you\'re becoming while you\'re still performing who you were.</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-top:12px;">This tool helps you see the identity you\'ve outgrown — and gives you permission to put it down.</p>';
    h+='</div>';
    h+='<button onclick="window._idNext()" style="display:block;margin:0 auto;padding:12px 32px;background:linear-gradient(135deg,#39ff14,#00cc00);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px;">Begin</button>';
  }else if(step===1){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">🎭</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">Which identity have you been wearing the longest? Not which one you <i>want</i> to be — which one you feel <b>trapped</b> in?</p>';
    identities.forEach(function(id){
      h+='<button onclick="window._idPick(\''+id.replace(/'/g,"\\'")+'\')" style="display:block;width:100%;text-align:left;padding:12px;margin-bottom:6px;background:rgba(255,255,255,0.03);border:1px solid rgba(57,255,20,0.2);border-radius:8px;color:var(--text-secondary);cursor:pointer;font-size:13px;transition:all 0.2s;">'+id+'</button>';
    });
  }else if(step===2){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">⛓️</div><div style="font-size:14px;color:#39ff14;margin-top:8px;font-style:italic;">"'+identity+'"</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">What is this identity <b>costing</b> you right now? What can\'t you do, feel, or be while you\'re wearing it?</p>';
    h+='<textarea id="id-cost" rows="3" placeholder="e.g. I can\'t ask for help without feeling weak. I can\'t rest without guilt. I can\'t be angry without feeling like I\'m breaking character..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(57,255,20,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>';
    h+='<button onclick="window._idNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#39ff14,#00cc00);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Continue</button>';
  }else if(step===3){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">🕊️</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">If you could put this identity down — even for a day — what would be possible? What would you do, say, or feel that you can\'t right now?</p>';
    h+='<textarea id="id-free" rows="3" placeholder="e.g. I\'d ask for help. I\'d say I\'m not okay. I\'d rest without earning it. I\'d let someone take care of me for once..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(57,255,20,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>';
    h+='<button onclick="window._idNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#39ff14,#00cc00);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;">See the Truth</button>';
  }else if(step===4){
    h+='<div style="text-align:center;margin-bottom:20px;"><div style="font-size:64px;">🐍✨</div></div>';
    h+='<div style="background:rgba(57,255,20,0.08);border:1px solid rgba(57,255,20,0.2);border-radius:10px;padding:20px;margin-bottom:16px;">';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0 0 12px;">The identity: <b style="color:#39ff14;">'+identity+'</b></p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0 0 12px;">What it\'s costing you: <span style="color:#ff6b81;">'+cost+'</span></p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0 0 16px;">What becomes possible without it: <span style="color:#39ff14;">'+freedom+'</span></p>';
    h+='<p style="font-size:14px;line-height:1.8;color:#e6faff;margin:0;">Here\'s the truth: <b>you are not your role.</b> The identity you\'ve been wearing was a costume you put on to survive. It served you. It protected you. And now it\'s too small for who you\'re becoming.</p><br>';
    h+='<p style="font-size:14px;line-height:1.8;color:#e6faff;margin:0;">You don\'t have to burn it. You don\'t have to reject it. You just have to <b>notice that you\'re wearing it</b> — and that you have the choice to take it off. Even for a moment. Even just to see what\'s underneath.</p><br>';
    h+='<p style="font-size:14px;line-height:1.8;color:#39ff14;margin:0;font-style:italic;">The scariest and most liberating sentence in the English language: "I don\'t have to be that person anymore."</p>';
    h+='</div>';
    h+='<p style="font-size:13px;color:var(--text-secondary);line-height:1.7;">This work draws on <b>narrative therapy</b> (Michael White & David Epston) and <b>identity theory</b> in psychology. Research shows that people who can "defuse" from rigid self-concepts — seeing them as roles they play rather than who they <i>are</i> — show significant improvements in flexibility, wellbeing, and life satisfaction.</p>';
    h+='<button onclick="window._idReset()" style="display:block;margin:20px auto 0;padding:10px 24px;background:rgba(57,255,20,0.15);color:#39ff14;border:1px solid rgba(57,255,20,0.3);border-radius:8px;cursor:pointer;font-weight:600;">Start Over</button>';
  }
  document.getElementById('id-app').innerHTML=h;
}
window._idNext=function(){
  if(step===2){var c=document.getElementById('id-cost');if(c){cost=c.value.trim()||'my freedom';}}
  if(step===3){var f=document.getElementById('id-free');if(f){freedom=f.value.trim()||'everything';}}
  step++;render();
};
window._idPick=function(id){identity=id;step=2;render();};
window._idReset=function(){init();};
init();
})();
</script>
