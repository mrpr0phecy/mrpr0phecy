<h2 id="scnt-title" style="margin-top:0;color:var(--accent);">🔬 Scientific Notation &amp; Sig Figs</h2>

<form aria-describedby="scnt-desc" onsubmit="event.preventDefault();">
  <p id="scnt-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Convert a number to scientific / engineering notation and round to significant figures. 1.23 × 10⁴ is 12300. Trailing zeros in 1000 are ambiguous — say how many sig figs you want.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="scnt-n" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Number</label>
      <input id="scnt-n" type="text" value="12300" spellcheck="false" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">
    </div>
    <div>
      <label for="scnt-sf" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Significant figures</label>
      <input id="scnt-sf" type="number" min="1" max="15" value="3" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="scnt-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var raw = $('scnt-n').value.trim().replace(/,/g, '');
    var n = Number(raw);
    var sf = Math.max(1, Math.min(15, Number($('scnt-sf').value) || 3));
    if (!isFinite(n)) {
      $('scnt-out').innerHTML = '<p style="color:#ffb8b8;font-size:.84rem;">Not a number.</p>';
      return;
    }
    if (n === 0) {
      $('scnt-out').innerHTML = '<p style="color:var(--text);">0 stays 0.</p>';
      return;
    }
    var exp = Math.floor(Math.log(Math.abs(n)) / Math.log(10));
    var mant = n / Math.pow(10, exp);
    var rounded = Number(n.toPrecision(sf));
    var engExp = Math.floor(exp / 3) * 3;
    var engMant = n / Math.pow(10, engExp);
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">' + v + '</div></div>';
    }
    $('scnt-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;">' +
      cell('Scientific', mant.toPrecision(sf) + ' × 10^' + exp) +
      cell('E notation', n.toExponential(sf - 1)) +
      cell('Engineering', engMant.toPrecision(sf) + ' × 10^' + engExp) +
      cell('Rounded (' + sf + ' sf)', String(rounded)) +
      '</div>';
  }
  $('scnt-n').addEventListener('input', run);
  $('scnt-sf').addEventListener('input', run);
  run();
})();
</script>
