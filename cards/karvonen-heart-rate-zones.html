<h2 id="karv-title" style="margin-top:0;color:var(--accent);">❤️ Karvonen Heart Rate Zones</h2>

<form aria-describedby="karv-desc" onsubmit="event.preventDefault();">
  <p id="karv-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Target HR = ((HRmax − HRrest) × intensity) + HRrest. HRmax default is 220 − age (a rough estimate). Zones are training labels, not medical advice. Stop if you feel unwell.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="karv-age" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Age</label>
      <input id="karv-age" type="number" min="10" max="90" step="1" value="35" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="karv-rest" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Resting HR bpm</label>
      <input id="karv-rest" type="number" min="30" max="120" step="1" value="60" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="karv-max" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Known HRmax (optional)</label>
      <input id="karv-max" type="number" min="100" max="220" step="1" value="" placeholder="220 − age" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="karv-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var zones = [
    ['Z1 recovery', 0.50, 0.60],
    ['Z2 aerobic', 0.60, 0.70],
    ['Z3 tempo', 0.70, 0.80],
    ['Z4 threshold', 0.80, 0.90],
    ['Z5 VO2', 0.90, 1.00]
  ];
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var age = Number($('karv-age').value), rest = Number($('karv-rest').value);
    var maxIn = $('karv-max').value;
    var hrmax = maxIn === '' ? 220 - age : Number(maxIn);
    if (!(age > 0) || !(rest > 0) || !(hrmax > rest)) {
      $('karv-out').textContent = 'Enter age, resting HR and a max above rest.';
      return;
    }
    var reserve = hrmax - rest;
    function bpm(p) { return Math.round(rest + reserve * p); }
    var rows = zones.map(function (z) {
      return '<tr><td style="padding:4px 8px;">' + z[0] + '</td><td style="padding:4px 8px;">' + Math.round(z[1] * 100) + '–' + Math.round(z[2] * 100) + '%</td><td style="padding:4px 8px;">' + bpm(z[1]) + '–' + bpm(z[2]) + ' bpm</td></tr>';
    }).join('');
    $('karv-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('HRmax used', hrmax + ' bpm') +
      cell('Heart-rate reserve', reserve + ' bpm') +
      '</div><table style="margin-top:12px;width:100%;border-collapse:collapse;font-size:.85rem;"><thead><tr><th style="text-align:left;padding:4px 8px;">Zone</th><th style="text-align:left;padding:4px 8px;">% HRR</th><th style="text-align:left;padding:4px 8px;">bpm</th></tr></thead><tbody>' + rows + '</tbody></table><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">220 − age overestimates max for many people. A lab test or a hard field test is better. Medication (especially beta blockers) changes the picture — ask a clinician.</p>';
  }
  ['karv-age', 'karv-rest', 'karv-max'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
