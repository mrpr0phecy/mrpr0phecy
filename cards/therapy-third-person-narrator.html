<h2>📖 See Your Life Through a Narrator's Eyes</h2>
<p class="description">When you're inside your own story, everything feels overwhelming. This tool reframes your situation as a chapter in a novel — creating the psychological distance that turns suffering into narrative, and narrative into meaning.</p>
<div id="np-app" style="max-width:540px;margin:0 auto;"></div>
<script>
(function(){
'use strict';
var step=0,situation='',strength='',next='';
function init(){step=0;render();}
function render(){
  var h='';
  if(step===0){
    h+='<div style="text-align:center;margin-bottom:20px;">';
    h+='<div style="font-size:64px;margin-bottom:12px;">📖</div>';
    h+='<h3 style="color:#c084fc;margin:0 0 8px;">You are too close to your own story</h3>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);">When you\'re inside a painful chapter, it feels like the whole book. You can\'t see the arc. You can\'t see that this is <i>one part</i> of a much larger story. Psychologists call this <b>narrative identity</b> — the story you tell about your life shapes how you experience it.</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-top:12px;">Research by Dan McAdams at Northwestern University shows that people who frame their struggles as "chapters" rather than "endings" have dramatically better mental health outcomes. This tool helps you step outside your story and see it the way a reader would — with compassion, context, and the knowledge that the chapter isn\'t over.</p>';
    h+='</div>';
    h+='<button onclick="window._npNext()" style="display:block;margin:0 auto;padding:12px 32px;background:linear-gradient(135deg,#c084fc,#9333ea);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px;">Begin</button>';
  }else if(step===1){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">✍️</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">What\'s the hardest thing in your life right now? Don\'t write it as a problem to solve — write it as a <i>scene</i>. Where are you? What\'s happening? What does it feel like from the inside?</p>';
    h+='<label style="display:block;font-size:13px;color:#c084fc;margin-bottom:6px;font-weight:600;">Describe your current chapter:</label>';
    h+='<textarea id="np-sit" rows="4" placeholder="e.g. I\'m 34 and I feel like everyone else figured it out except me. I left my job six months ago and I still don\'t know what\'s next. I pretend I\'m fine but I\'m scared..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(192,132,252,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>';
    h+='<button onclick="window._npNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#c084fc,#9333ea);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Continue</button>';
  }else if(step===2){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">💪</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">Now think about a character in a book or film who went through something similar. What did you admire about them? What strength did they show that they couldn\'t see in themselves? <b>You have that same quality.</b> You just can\'t see it because you\'re inside the story.</p>';
    h+='<label style="display:block;font-size:13px;color:#c084fc;margin-bottom:6px;font-weight:600;">What strength have you shown in this chapter that you\'re not giving yourself credit for?</label>';
    h+='<textarea id="np-str" rows="3" placeholder="e.g. I had the courage to leave. I\'m still showing up every day. I haven\'t given up even though I want to..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(192,132,252,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>';
    h+='<button onclick="window._npNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#c084fc,#9333ea);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Read Your Story</button>';
  }else if(step===3){
    h+='<div style="text-align:center;margin-bottom:20px;"><div style="font-size:64px;">📖✨</div></div>';
    h+='<div style="background:rgba(192,132,252,0.08);border:1px solid rgba(192,132,252,0.2);border-radius:10px;padding:20px;margin-bottom:16px;font-family:Georgia,serif;">';
    h+='<p style="font-size:15px;line-height:2;color:#e6faff;margin:0;font-style:italic;">';
    h+='There is a person who is '+situation.substring(0,200)+'.<br><br>';
    h+='From the inside, this feels like the whole story. But a reader would see what the character cannot: that <b>'+strength+'</b>.<br><br>';
    h+='This is not the ending. This is the chapter where everything felt impossible — and the character kept going anyway. In every great story, this is the part that comes before the transformation. The reader knows this. The character doesn\'t. Not yet.<br><br>';
    h+='But they will.';
    h+='</p>';
    h+='</div>';
    h+='<p style="font-size:13px;color:var(--text-secondary);line-height:1.7;">This technique is called <b>self-distancing</b> — writing about yourself in the third person. Research by Ethan Kross at the University of Michigan found that it reduces emotional reactivity, decreases anxiety, and improves problem-solving. When you narrate your life instead of just living it, you gain the perspective that suffering blocks.</p>';
    h+='<button onclick="window._npReset()" style="display:block;margin:20px auto 0;padding:10px 24px;background:rgba(192,132,252,0.15);color:#c084fc;border:1px solid rgba(192,132,252,0.3);border-radius:8px;cursor:pointer;font-weight:600;">Start Over</button>';
  }
  document.getElementById('np-app').innerHTML=h;
}
window._npNext=function(){
  if(step===1){var s=document.getElementById('np-sit');if(s){situation=s.value.trim()||'going through a hard time';}}
  if(step===2){var st=document.getElementById('np-str');if(st){strength=st.value.trim()||'they kept going';}}
  step++;render();
};
window._npReset=function(){init();};
init();
})();
</script>
