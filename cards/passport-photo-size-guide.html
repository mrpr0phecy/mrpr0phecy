<h2 id="ppht-title" style="margin-top:0;color:var(--accent);">🛂 Passport Photo Size Guide</h2>

<form aria-describedby="ppht-desc" onsubmit="event.preventDefault();">
  <p id="ppht-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Official print sizes and pixel dimensions for UK, US, Schengen, Canada, Australia, India and China visa photos. Face-height rules are listed — a home print can still be rejected if lighting or background fails.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="ppht-where" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Document</label>
      <select id="ppht-where" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);"></select>
    </div>
    <div>
      <label for="ppht-dpi" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Print DPI</label>
      <input id="ppht-dpi" type="number" min="200" max="600" value="300" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="ppht-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var SPECS = [
    { id: 'uk', name: 'UK passport / driving licence', w: 35, h: 45, face: '29–34 mm chin to crown', bg: 'cream or light grey, not white' },
    { id: 'eu', name: 'Schengen / EU passport', w: 35, h: 45, face: '32–36 mm chin to crown (ICAO)', bg: 'light, plain, no shadows' },
    { id: 'us', name: 'US passport / visa', w: 50.8, h: 50.8, face: '1–1⅜ in (25–35 mm) chin to crown', bg: 'plain white or off-white' },
    { id: 'ca', name: 'Canada passport', w: 50, h: 70, face: '31–36 mm chin to crown', bg: 'plain white' },
    { id: 'au', name: 'Australia passport', w: 35, h: 45, face: '32–36 mm chin to crown', bg: 'plain light grey or white' },
    { id: 'in', name: 'India passport', w: 51, h: 51, face: '70–80% of the photo', bg: 'plain white' },
    { id: 'cn', name: 'China visa', w: 33, h: 48, face: 'head ~28–33 mm', bg: 'plain white' }
  ];
  var sel = $('ppht-where');
  sel.innerHTML = SPECS.map(function (s, i) { return '<option value="' + i + '">' + s.name + '</option>'; }).join('');
  function run() {
    var s = SPECS[Number(sel.value)] || SPECS[0];
    var dpi = Number($('ppht-dpi').value) || 300;
    var pxw = Math.round(s.w / 25.4 * dpi), pxh = Math.round(s.h / 25.4 * dpi);
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;font-size:.9rem;">' + v + '</div></div>';
    }
    $('ppht-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Print size', s.w + ' × ' + s.h + ' mm') +
      cell('Inches', (s.w / 25.4).toFixed(2) + ' × ' + (s.h / 25.4).toFixed(2) + ' in') +
      cell('Pixels @ ' + dpi + ' DPI', pxw + ' × ' + pxh) +
      cell('Face height', s.face) +
      cell('Background', s.bg) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Rules change. Check the issuing authority before you print. UK photos taken in a booth that meets Home Office specs are the safest option.</p>';
  }
  sel.addEventListener('change', run);
  $('ppht-dpi').addEventListener('input', run);
  run();
})();
</script>
