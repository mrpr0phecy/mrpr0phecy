<!-- cards/blame-deflector.html -->
<h2 id="blamedef-title" style="margin-top:0;color:var(--accent);">💢 Blame Deflector 3000</h2>

<form aria-describedby="blamedef-desc" onsubmit="event.preventDefault();">
  <p id="blamedef-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Something went wrong? Don't worry — it's definitely not your fault. Let science* find someone else to blame.
    <span style="color:var(--accent);font-size:0.75rem;">*Not science.</span>
  </p>

  <div style="margin-bottom:16px;">
    <label for="blamedef-incident" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:600;">What went wrong?</label>
    <input id="blamedef-incident" type="text" placeholder="e.g., I broke the printer, I was late, I forgot..." style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
  </div>

  <div style="margin-bottom:16px;">
    <label style="display:block;margin-bottom:6px;color:var(--accent);font-weight:600;">Who's in the room?</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button type="button" onclick="blamedefSetContext('boss')" id="blamedef-ctx-boss" style="padding:8px 14px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:rgba(45,212,255,0.2);color:var(--accent);cursor:pointer;font-size:0.85rem;">👔 Boss</button>
      <button type="button" onclick="blamedefSetContext('friend')" id="blamedef-ctx-friend" style="padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:inherit;cursor:pointer;font-size:0.85rem;">👯 Friend</button>
      <button type="button" onclick="blamedefSetContext('partner')" id="blamedef-ctx-partner" style="padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:inherit;cursor:pointer;font-size:0.85rem;">💕 Partner</button>
      <button type="button" onclick="blamedefSetContext('stranger')" id="blamedef-ctx-stranger" style="padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:inherit;cursor:pointer;font-size:0.85rem;">🤷 Stranger</button>
    </div>
  </div>

  <button type="button" onclick="blamedefDeflect()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🛡️ Deflect Blame
  </button>

  <div id="blamedef-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);margin-bottom:12px;">
    <div id="blamedef-target" style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:6px;"></div>
    <div id="blamedef-excuse" style="font-size:1.05rem;color:var(--text);line-height:1.5;margin-bottom:10px;"></div>
    <div id="blamedef-confidence" style="font-size:0.85rem;color:var(--accent);font-weight:600;"></div>
  </div>
</form>

<script>
(function(){
  var blamedefContext = 'boss';

  window.blamedefSetContext = function(ctx) {
    blamedefContext = ctx;
    var btns = ['boss','friend','partner','stranger'];
    for (var i = 0; i < btns.length; i++) {
      var btn = document.getElementById('blamedef-ctx-' + btns[i]);
      if (btns[i] === ctx) {
        btn.style.background = 'rgba(45,212,255,0.2)';
        btn.style.borderColor = 'rgba(45,212,255,0.3)';
        btn.style.color = 'var(--accent)';
      } else {
        btn.style.background = 'rgba(255,255,255,0.03)';
        btn.style.borderColor = 'rgba(255,255,255,0.1)';
        btn.style.color = 'inherit';
      }
    }
  };

  var blamedefTargets = {
    boss: [
      { target: '🏢 The Office Printer', excuse: 'The printer has been acting suspiciously all week. I believe it provoked the incident. I\'m actually the victim here.', confidence: '72% confident this will work' },
      { target: '👻 Kevin From Accounting', excuse: 'Kevin was seen near the scene of the incident. Kevin has a history. Everyone knows Kevin can\'t be trusted.', confidence: '85% confident — everyone blames Kevin' },
      { target: '🌙 Mercury Retrograde', excuse: 'Mercury is in retrograde, which affects communication, technology, and apparently my ability to not mess things up. It\'s astrological. I don\'t make the rules.', confidence: '61% confident — bosses love astrology (they don\'t)' },
      { target: '💻 The Software Update', excuse: 'There was a Windows update at the exact moment of the incident. The timing is suspicious. Microsoft owes us all an explanation.', confidence: '94% confident — this has never not worked' },
      { target: '🏢 The Open-Plan Office', excuse: 'Studies show open-plan offices reduce productivity by 15%. This incident is a direct result of workplace design. I\'d like to propose remote work.', confidence: '68% confident — with a pivot to working from home' },
      { target: '⏰ Daylight Saving Time', excuse: 'My body clock hasn\'t adjusted. It\'s technically still an hour earlier in my mind, so from my perspective, this hasn\'t happened yet.', confidence: '43% confident — creative but legally dubious' }
    ],
    friend: [
      { target: '🐕 A Dog (Any Dog)', excuse: 'A dog ran past and distracted me. I don\'t know whose dog. It was brown. Or maybe grey. The point is: dog.', confidence: '89% confident — dogs are universally accepted as distractions' },
      { target: '📱 Your Phone Autocorrect', excuse: 'My phone autocorrected my actions. I meant to do the right thing but my phone had other plans. Apple owes you an apology.', confidence: '76% confident — relatable' },
      { target: '🎵 The Song That Was Playing', excuse: 'The song that was on made me do it. You can\'t hear a certain banger and NOT lose focus. It\'s Pavlovian.', confidence: '67% confident — depends on the song' },
      { target: '🍕 The Food Coma', excuse: 'I was in a food coma from lunch. My body was processing a burrito the size of my forearm. Higher brain functions were offline.', confidence: '82% confident — very relatable' },
      { target: '🌙 The Moon', excuse: 'The moon was in a weird position. I could feel it affecting my judgement. I\'m very sensitive to celestial bodies.', confidence: '34% confident — but they\'ll be too confused to argue' },
      { target: '📺 That Show We Watched', excuse: 'Ever since we watched that show, I\'ve been emotionally compromised. The finale broke something in me. This is a delayed reaction.', confidence: '71% confident — if they watched it too' }
    ],
    partner: [
      { target: '🛋️ The Sofa', excuse: 'The sofa was too comfortable. It literally would not let me get up. I was trapped by cushions. I fought valiantly.', confidence: '77% confident — they know the sofa\'s power' },
      { target: '🐱 The Cat', excuse: 'The cat was sitting on me. I couldn\'t move. Cat rules are absolute. You know this. The cat knows this.', confidence: '96% confident — cat paralysis is medically recognised (by cat owners)' },
      { target: '🧠 My ADHD (That I Just Made Up)', excuse: 'I think I have a very specific, task-related ADHD that only activates when I\'m supposed to do things I don\'t want to do. It\'s very niche.', confidence: '28% confident — risky but bold' },
      { target: '⏰ Time Itself', excuse: 'Time moved faster than expected. I blinked and suddenly it was too late. I believe Einstein would back me up on this.', confidence: '55% confident — relativity is technically on your side' },
      { target: '🛒 The Supermarket', excuse: 'I went to the shop for one thing and got lost in the aisles for 45 minutes. The supermarket is a labyrinth designed to trap people. I barely escaped.', confidence: '83% confident — this has genuinely happened to everyone' },
      { target: '🛏️ The Bed', excuse: 'The bed called to me. Not metaphorically — it actually whispered "come back." I\'m not strong enough to resist a talking bed.', confidence: '62% confident — the bed IS very persuasive' }
    ],
    stranger: [
      { target: '🌍 Climate Change', excuse: 'Climate change affected the conditions in which I was operating. The temperature was suboptimal. My performance was a direct consequence of global warming.', confidence: '41% confident — technically everything is climate change\'s fault' },
      { target: '🧲 Electromagnetic Interference', excuse: 'There was significant electromagnetic interference in the area. My judgement was clouded by 5G signals. Or maybe 4G. One of the Gs.', confidence: '33% confident — conspiracy-adjacent but hard to disprove' },
      { target: '🎲 Quantum Uncertainty', excuse: 'According to quantum mechanics, the outcome was probabilistic, not deterministic. In some universes, I did the right thing. You\'re just in the wrong universe.', confidence: '22% confident — but philosophically unassailable' },
      { target: '🌍 The Earth\'s Rotation', excuse: 'The Coriolis effect influenced my decision-making process. If I\'d been in the Southern Hemisphere, things would have gone differently.', confidence: '15% confident — impressively wrong' },
      { target: '🦋 A Butterfly (Chaos Theory)', excuse: 'A butterfly flapped its wings in Brazil, which caused a chain reaction that led directly to this incident. I\'m a victim of chaos theory.', confidence: '19% confident — statistically, a butterfly IS always involved' },
      { target: '🪐 Saturn\'s Alignment', excuse: 'Saturn is aligned with my birth chart in a way that makes me prone to exactly this type of error. I checked. It\'s in the stars.', confidence: '37% confident — nobody can disprove astrology in real time' }
    ]
  };

  window.blamedefDeflect = function() {
    var incident = document.getElementById('blamedef-incident').value.trim() || 'the incident';
    var pool = blamedefTargets[blamedefContext];
    var pick = pool[Math.floor(Math.random() * pool.length)];

    document.getElementById('blamedef-target').innerHTML = '🎯 <strong>Blame assigned to:</strong> ' + pick.target;
    document.getElementById('blamedef-excuse').innerHTML = '"' + pick.excuse.replace('the incident', incident) + '"';
    document.getElementById('blamedef-confidence').textContent = '📊 ' + pick.confidence;
    document.getElementById('blamedef-result').style.display = 'block';
  };
})();
</script>
