<h2 id="anime-recs-title" style="margin-top:0;color:var(--accent);">🔮 AniMatch: Anime Mood & Vibe Recommendation Engine</h2>

<form aria-describedby="anime-recs-desc" onsubmit="event.preventDefault();">
  <p id="anime-recs-desc" class="small" style="color:var(--muted);margin-bottom:14px;">
    Find the perfect anime tailored to your exact emotional state and available time. Filter by desired mood (cathartic tears, adrenaline hype, psychological mind-games, or cozy healing), episode length, and era.
  </p>

  <!-- Filter Controls Grid -->
  <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:10px;margin-bottom:12px;">
    <div>
      <label for="am-mood-select" style="display:block;font-size:0.75rem;color:var(--muted);margin-bottom:4px;">Desired Vibe / Mood</label>
      <select id="am-mood-select" style="width:100%;padding:6px;border-radius:6px;background:rgba(0,0,0,0.3);border:1px solid rgba(0,255,204,0.3);color:#fff;">
        <option value="cry" selected>😭 Need a Good Cry (Catharsis)</option>
        <option value="hype">⚡ Pure Adrenaline Hype & Sakuga</option>
        <option value="psychological">🧠 Mind-Bending Psychological Thriller</option>
        <option value="cozy">🍵 Iyashikei / Soul-Healing Cozy</option>
        <option value="worldbuilding">🌌 Deep Dark World-Building Fantasy</option>
        <option value="comedy">🤣 Unhinged Comedy & Chaos</option>
        <option value="romance">💘 Heart-Melting Romance</option>
      </select>
    </div>

    <div>
      <label for="am-length-filter" style="display:block;font-size:0.75rem;color:var(--muted);margin-bottom:4px;">Episode Commitment</label>
      <select id="am-length-filter" style="width:100%;padding:6px;border-radius:6px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);color:#fff;">
        <option value="all" selected>Any Length</option>
        <option value="short">Short & Sweet (≤ 13 eps / Movie)</option>
        <option value="medium">Standard Run (14 - 26 eps)</option>
        <option value="long">Epic Commitment (50+ eps)</option>
      </select>
    </div>

    <div>
      <label for="am-era-filter" style="display:block;font-size:0.75rem;color:var(--muted);margin-bottom:4px;">Anime Era</label>
      <select id="am-era-filter" style="width:100%;padding:6px;border-radius:6px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);color:#fff;">
        <option value="all" selected>All Eras</option>
        <option value="retro">Classic 90s & 2000s</option>
        <option value="modern">2010s to Present</option>
      </select>
    </div>
  </div>

  <!-- Recommendation Matches List -->
  <div id="am-results-list" style="display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;padding-right:4px;"></div>
</form>

<script>
(function() {
  const ANIME_LIST = [
    // CRY
    { title: 'Violet Evergarden', mood: 'cry', eps: 13, era: 'modern', score: '8.9', tags: 'Drama, Beautiful Animation, Emotional', why: 'A battle-hardened soldier learns the meaning of "I love you" as an Auto Memory Doll ghostwriter. Episode 10 will leave you sobbing.' },
    { title: 'Your Lie in April', mood: 'cry', eps: 22, era: 'modern', score: '8.7', tags: 'Music, Romance, Tragedy', why: 'A traumatized pianist meets an eccentric violinist who pulls him back to music. Heartbreakingly bittersweet.' },
    { title: 'Clannad: After Story', mood: 'cry', eps: 24, era: 'retro', score: '9.0', tags: 'Family, Life, Devastating Tearjerker', why: 'The undisputed king of anime tears. Follows adulthood, marriage, and parenthood with unmatched emotional gravity.' },
    { title: 'A Silent Voice (Koe no Katachi)', mood: 'cry', eps: 1, era: 'modern', score: '8.9', tags: 'Movie, Redemption, Bullying, Deaf', why: 'A former bully seeks redemption and forgiveness from the deaf girl he tormented in elementary school.' },

    // HYPE
    { title: 'Tengen Toppa Gurren Lagann', mood: 'hype', eps: 27, era: 'retro', score: '8.6', tags: 'Mecha, Galactic Hype, Peak Passion', why: '"Row row fight the power!" Escalates from living underground to throwing entire galaxies like shurikens.' },
    { title: 'Kill la Kill', mood: 'hype', eps: 24, era: 'modern', score: '8.3', tags: 'Studio Trigger, Over-the-top, Action', why: 'Pure adrenaline and bombastic animated spectacle with high-octane music by Hiroyuki Sawano.' },
    { title: 'Haikyuu!!', mood: 'hype', eps: 85, era: 'modern', score: '8.8', tags: 'Sports, Volleyball, Adrenaline', why: 'Every single spike and rally produces goosebumps and fist-pumping triumph.' },
    { title: 'Mob Psycho 100', mood: 'hype', eps: 37, era: 'modern', score: '8.9', tags: 'Supernatural, God-Tier Sakuga Animation', why: 'Bones studio flexing some of the greatest kinetic sakuga action animation ever rendered in human history.' },

    // PSYCHOLOGICAL
    { title: 'Steins;Gate', mood: 'psychological', eps: 24, era: 'modern', score: '9.1', tags: 'Time Travel, Conspiracy, Masterpiece', why: 'A microwave-based time travel experiment spirals into a terrifying battle against global dystopia.' },
    { title: 'Death Note', mood: 'psychological', eps: 37, era: 'retro', score: '8.6', tags: 'Cat-and-Mouse, Detective, Suspense', why: 'The legendary high-IQ mental chess match between Light Yagami and L.' },
    { title: 'Monster', mood: 'psychological', eps: 74, era: 'retro', score: '8.8', tags: 'Mystery, Noir, Naoki Urasawa, Johan Liebert', why: 'A brilliant brain surgeon saves a boy who grows up to be a charismatic psychopathic monster.' },
    { title: 'Erased (Boku dake ga Inai Machi)', mood: 'psychological', eps: 12, era: 'modern', score: '8.3', tags: 'Mystery, Time Slip, Child Murderer', why: 'A 29-year-old is sent back to his 10-year-old body to prevent the serial murder of his classmates.' },

    // COZY (IYASHIKEI)
    { title: 'Frieren: Beyond Journey\'s End', mood: 'cozy', eps: 28, era: 'modern', score: '9.3', tags: 'Fantasy, Time, Melancholic Healing', why: 'An immortal elf retraces her past heroic journey decades later, learning to cherish transient mortal moments.' },
    { title: 'Laid-Back Camp (Yuru Camp)', mood: 'cozy', eps: 12, era: 'modern', score: '8.2', tags: 'Camping, Hot Food, Maximum Comfy', why: 'The ultimate digital hot chocolate. Girls camping around Mt. Fuji with warm campfires and hearty stews.' },
    { title: 'Mushishi', mood: 'cozy', eps: 26, era: 'retro', score: '8.7', tags: 'Folklore, Spirits, Atmospheric Zen', why: 'Ginko wanders feudal Japan studying ethereal primitive lifeforms. Deeply peaceful and meditative.' },

    // WORLDBUILDING
    { title: 'Made in Abyss', mood: 'worldbuilding', eps: 13, era: 'modern', score: '8.7', tags: 'Dark Adventure, The Abyss, Curse', why: 'An abyss descending miles into the earth filled with ancient relics, alien ecology, and unspeakable eldritch horrors.' },
    { title: 'Fullmetal Alchemist: Brotherhood', mood: 'worldbuilding', eps: 64, era: 'retro', score: '9.1', tags: 'Alchemy, Military, Peak Shonen', why: 'Fawless world-building, political conspiracy, philosophical themes of equivalent exchange.' },
    { title: 'Shinsekai Yori (From the New World)', mood: 'worldbuilding', eps: 25, era: 'modern', score: '8.3', tags: 'Telekinesis, Dystopia, Civilization', why: '1000 years in the future, humans with telekinesis live in an agrarian paradise hiding a horrifying evolutionary secret.' },

    // COMEDY
    { title: 'KonoSuba: God\'s Blessing on This Wonderful World!', mood: 'comedy', eps: 20, era: 'modern', score: '8.2', tags: 'Isekai Parody, Hilarious Degenerates', why: 'Subverts all isekai tropes with a useless water goddess, a masochist crusader, and a chunibyo explosion mage.' },
    { title: 'The Disastrous Life of Saiki K.', mood: 'comedy', eps: 50, era: 'modern', score: '8.4', tags: 'Rapid-Fire Gag, Esper, Deadpan', why: 'An all-powerful psychic just wants to eat coffee jelly in peace while surrounded by lovable eccentrics.' },
    { title: 'Bocchi the Rock!', mood: 'comedy', eps: 12, era: 'modern', score: '8.8', tags: 'Social Anxiety, Indie Rock, Creative Animation', why: 'Painfully relatable depiction of severe social anxiety paired with wildly inventive visual comedy.' },

    // ROMANCE
    { title: 'Kaguya-sama: Love is War', mood: 'romance', eps: 37, era: 'modern', score: '8.9', tags: 'Rom-Com, Mind Games, Masterpiece', why: 'Two proud geniuses refuse to confess their love, treating romance like high-stakes psychological warfare.' },
    { title: 'The Dangers in My Heart', mood: 'romance', eps: 25, era: 'modern', score: '8.8', tags: 'Wholesome, Middle School, Growth', why: 'Starts with edgy chunibyo thoughts and evolves into one of the most tender, emotionally authentic romances in modern anime.' }
  ];

  const moodSel = document.getElementById('am-mood-select');
  const lenSel = document.getElementById('am-length-filter');
  const eraSel = document.getElementById('am-era-filter');
  const resultsContainer = document.getElementById('am-results-list');

  function renderRecommendations() {
    const mood = moodSel.value;
    const len = lenSel.value;
    const era = eraSel.value;

    resultsContainer.innerHTML = '';

    const matches = ANIME_LIST.filter(a => {
      if (a.mood !== mood) return false;
      if (len === 'short' && a.eps > 13) return false;
      if (len === 'medium' && (a.eps <= 13 || a.eps > 30)) return false;
      if (len === 'long' && a.eps <= 30) return false;
      if (era !== 'all' && a.era !== era) return false;
      return true;
    });

    if (matches.length === 0) {
      resultsContainer.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);">No titles matched your exact filter combination. Try selecting "Any Length" or "All Eras".</div>';
      return;
    }

    matches.forEach(item => {
      const card = document.createElement('div');
      card.style.cssText = 'background:rgba(14,21,37,0.8);border:1px solid rgba(0,255,204,0.25);border-radius:10px;padding:12px;transition:all 0.15s;';
      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">
          <strong style="color:#00ffcc;font-size:1.05rem;">${item.title}</strong>
          <span style="font-size:0.75rem;color:#ffd700;font-weight:bold;">★ ${item.score}</span>
        </div>
        <div style="font-size:0.72rem;color:#b026ff;margin-bottom:6px;">${item.tags} · <span style="color:#fff;">${item.eps === 1 ? 'Film' : item.eps + ' Episodes'}</span></div>
        <div style="font-size:0.8rem;color:#e6faff;line-height:1.4;">${item.why}</div>
      `;
      card.addEventListener('mouseenter', () => { card.style.borderColor = '#00ffcc'; card.style.background = 'rgba(14,21,37,1)'; });
      card.addEventListener('mouseleave', () => { card.style.borderColor = 'rgba(0,255,204,0.25)'; card.style.background = 'rgba(14,21,37,0.8)'; });
      resultsContainer.appendChild(card);
    });
  }

  [moodSel, lenSel, eraSel].forEach(elem => elem.addEventListener('change', renderRecommendations));

  renderRecommendations();
})();
</script>
