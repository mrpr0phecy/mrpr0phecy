<h2 id="turk-title" style="margin-top:0;color:var(--accent);">🦃 Turkey Thaw &amp; Cook Time</h2>

<form aria-describedby="turk-desc" onsubmit="event.preventDefault();">
  <p id="turk-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Fridge thaw ~24 h per 2–2.5 kg (FSA: 24 h per 2 kg is a safe extra). Oven times are a starting point — always probe 75 °C in the thickest thigh and stuffing. Not a substitute for the label on your bird.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="turk-kg" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Turkey kg</label>
      <input id="turk-kg" type="number" min="1" step="any" value="5.5" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="turk-stuff" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Stuffed?</label>
      <select id="turk-stuff" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="no">Unstuffed</option>
        <option value="yes">Stuffed</option>
      </select>
    </div>
  </div>
</form>
<div id="turk-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var kg = Number($('turk-kg').value);
    var stuffed = $('turk-stuff').value === 'yes';
    if (!(kg > 0)) {
      $('turk-out').textContent = 'Enter the bird weight.';
      return;
    }
    var fridgeH = (kg / 2) * 24;
    var coldWaterH = kg * 0.5;
    var minPerKg = stuffed ? 40 : 30;
    var cookMin = 20 * 60 / 60 + kg * minPerKg;
    var lb = kg * 2.20462;
    $('turk-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Weight', kg.toFixed(1) + ' kg / ' + lb.toFixed(1) + ' lb') +
      cell('Fridge thaw', Math.ceil(fridgeH / 24) + ' days (≈' + Math.round(fridgeH) + ' h)') +
      cell('Cold-water thaw (change water 30 min)', coldWaterH.toFixed(1) + ' h') +
      cell('Oven from chilled ~180 °C fan', Math.round(cookMin) + ' min') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Never thaw on the counter. Cook from frozen only if the pack says so (it takes longer). Rest 20–30 minutes. Stuffing and meat both need 75 °C. A pop-up timer is not a probe.</p>';
  }
  $('turk-kg').addEventListener('input', run);
  $('turk-stuff').addEventListener('change', run);
  run();
})();
</script>
