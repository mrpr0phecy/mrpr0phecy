<!-- cards/plumbing-pipe-sizing.html -->
<h2 id="plumbsize-title" style="margin-top:0;color:var(--accent);">🔧 Pipe Sizing Guide</h2>

<form aria-describedby="plumbsize-desc" onsubmit="event.preventDefault();">
  <p id="plumbsize-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Look up the right pipe diameter for any domestic plumbing job. Covers hot/cold water, central heating, and waste.
  </p>

  <div style="margin-bottom:12px;">
    <label for="plumbsize-system" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">System Type</label>
    <select id="plumbsize-system" onchange="plumbsizeUpdate()" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="hot-cold" selected>Hot & Cold Water Supply</option>
      <option value="central-heat">Central Heating</option>
      <option value="waste">Waste / Drainage</option>
    </select>
  </div>

  <div style="margin-bottom:14px;">
    <label for="plumbsize-run" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">What are you connecting?</label>
    <select id="plumbsize-run" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="mains-run">Main supply run (mains to house)</option>
      <option value="branch" selected>Branch to individual fixture</option>
      <option value="tap">Final connection to tap/valve</option>
    </select>
  </div>

  <button type="button" onclick="plumbsizeLookup()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🔧 Look Up Pipe Size
  </button>

  <div id="plumbsize-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);">
    <div id="plumbsize-size" style="font-size:1.2rem;color:var(--accent);font-weight:700;margin-bottom:10px;"></div>
    <div id="plumbsize-material" style="font-size:0.9rem;color:var(--text);margin-bottom:10px;"></div>
    <div id="plumbsize-table" style="margin-bottom:12px;"></div>
    <div id="plumbsize-tips" style="font-size:0.8rem;color:var(--text-secondary);line-height:1.6;"></div>
  </div>
</form>

<script>
(function(){
  var plumbsizeDB={
    'hot-cold':{
      'mains-run':{size:'22mm or 25mm',material:'Copper or MDPE (underground)',desc:'The main supply from the street is typically 25mm MDPE (blue for cold). Inside the house, reduce to 22mm copper for the main run.',table:[['Mains supply pipe','25mm MDPE (blue)'],['Internal main run','22mm copper or plastic'],['Hot water cylinder feed','22mm'],['Branch to bathroom','15mm or 22mm'],['Branch to kitchen','15mm'],['Tap connectors','15mm or 12mm flexi hose']]},
      'branch':{size:'15mm',material:'Copper, Speedfit plastic, or PEX',desc:'15mm is the standard branch size for domestic plumbing. Most taps, toilets, and appliances connect with 15mm.',table:[['Bathroom basin','15mm'],['Bath','22mm hot & cold (for flow rate)'],['Kitchen sink','15mm'],['Toilet cistern','15mm'],['Washing machine','15mm (with isolation valve)'],['Dishwasher','15mm (with isolation valve)'],['Shower','15mm (or 22mm for power shower)']]},
      'tap':{size:'15mm or 12mm flexi hose',material:'Braided stainless steel flexi hose',desc:'Most modern taps connect via 15mm compression fittings or flexible tap connectors. Always use isolation valves (service valves) on every connection.',table:[['Kitchen mixer tap','2 × 15mm flexi hoses'],['Basin mono mixer','2 × 15mm flexi hoses or 10mm'],['Bath mixer','2 × 22mm or 15mm'],['Outside tap','15mm with double-check valve']]}
    },
    'central-heat':{
      'mains-run':{size:'22mm',material:'Copper or plastic (Hep2O, Speedfit)',desc:'The main flow and return from the boiler should be 22mm. This reduces to 15mm at each radiator branch.',table:[['Boiler flow & return','22mm'],['Main distribution run','22mm'],['Radiator branch','15mm'],['Radiator valve connections','15mm'],['Thermostatic valve (TRV)','15mm'],['Microbore (some systems)','8mm or 10mm']]},
      'branch':{size:'15mm',material:'Copper or plastic',desc:'Each radiator branch from the 22mm main should be 15mm. Use a lockshield valve on one end and a TRV on the other.',table:[['Radiator supply','15mm'],['Radiator return','15mm'],['Towel rail','15mm'],['Underfloor heating manifold','22mm supply, 16mm per loop']]},
      'tap':{size:'15mm',material:'Copper with compression fittings',desc:'Radiator valve connections are 15mm compression. Most TRVs and lockshields are 15mm.',table:[['TRV (thermostatic)','15mm'],['Lockshield valve','15mm'],['Drain-off valve','15mm'],['Radiator bleed key','N/A — just a square key']]}
    },
    'waste':{
      'mains-run':{size:'110mm underground, 32–50mm above ground',material:'Soil pipe: PVCu (grey or black)',desc:'The main soil stack is 110mm. Branches from sinks, baths, and showers use smaller waste pipes.',table:[['Soil stack (toilet)','110mm'],['Kitchen sink waste','40mm'],['Bathroom basin waste','32mm'],['Bath waste','40mm'],['Shower waste','40mm (50mm for power shower)'],['Washing machine waste','40mm standpipe'],['Dishwasher waste','Into sink trap or 40mm branch']]},
      'branch':{size:'32mm or 40mm',material:'PVCu push-fit or solvent weld',desc:'32mm for basins, 40mm for sinks, baths, and showers. All waste pipes need a fall (slope) of at least 1:40 for 32mm and 1:60 for 40mm.',table:[['Basin waste','32mm'],['Sink waste','40mm'],['Bath waste','40mm'],['Shower waste','40mm'],['Washing machine','40mm standpipe (min 600mm high)'],['Dishwasher','Into trap or 40mm branch']]},
      'tap':{size:'32mm or 40mm with trap',material:'PVCu with bottle trap or P-trap',desc:'Every waste outlet needs a trap to prevent sewer gases entering the room. Bottle traps are neater for basins; P-traps are standard for baths and showers.',table:[['Basin bottle trap','32mm'],['Sink P-trap','40mm'],['Bath P-trap','40mm'],['Shower P-trap','40mm'],['Bath overflow','Built into bath waste fitting'],['External gully','110mm to soil stack']]}
    }
  };

  window.plumbsizeUpdate=function(){};

  window.plumbsizeLookup=function(){
    var sys=document.getElementById('plumbsize-system').value;
    var run=document.getElementById('plumbsize-run').value;
    var d=plumbsizeDB[sys][run];
    document.getElementById('plumbsize-size').textContent='✅ Recommended: '+d.size;
    document.getElementById('plumbsize-material').innerHTML='📦 Material: <strong>'+d.material+'</strong><br>'+d.desc;
    var html='<table style="width:100%;border-collapse:collapse;font-size:0.8rem;">';
    html+='<tr style="border-bottom:1px solid rgba(255,255,255,0.1);"><th style="text-align:left;padding:6px;color:var(--accent);">Connection</th><th style="text-align:left;padding:6px;color:var(--accent);">Size</th></tr>';
    for(var i=0;i<d.table.length;i++){
      html+='<tr><td style="padding:6px;border-bottom:1px solid rgba(255,255,255,0.05);">'+d.table[i][0]+'</td><td style="padding:6px;border-bottom:1px solid rgba(255,255,255,0.05);">'+d.table[i][1]+'</td></tr>';
    }
    html+='</table>';
    document.getElementById('plumbsize-table').innerHTML=html;
    document.getElementById('plumbsize-tips').innerHTML='💡 <strong>Always use isolation valves</strong> (service valves) so you can shut off individual fixtures without draining the whole system.<br>💡 <strong>Plastic vs copper:</strong> Speedfit push-fit plastic is easier for DIY. Copper is traditional and more durable but needs soldering or compression fittings.<br>💡 <strong>Building Regulations:</strong> In England & Wales, most plumbing work doesn\'t need notification, but new bathrooms in extensions may. Check Part H (drainage) and Part G (water supply).';
    document.getElementById('plumbsize-result').style.display='block';
  };
})();
</script>
