<h2 id="rctc-title" style="margin-top:0;color:var(--accent);">⏲️ RC Time Constant</h2>

<form aria-describedby="rctc-desc" onsubmit="event.preventDefault();">
  <p id="rctc-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    τ = R × C. A capacitor charges to ~63% in one τ and ~99% in 5τ. Cut-off of a first-order RC low-pass is f<sub>c</sub> = 1 / (2πRC). R in ohms, C in farads (enter µF).
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="rctc-r" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Resistance Ω</label>
      <input id="rctc-r" type="number" min="0" step="any" value="10000" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="rctc-c" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Capacitance µF</label>
      <input id="rctc-c" type="number" min="0" step="any" value="10" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="rctc-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function fmtT(s) {
    if (s < 0.001) return (s * 1e6).toFixed(1) + ' µs';
    if (s < 1) return (s * 1000).toFixed(2) + ' ms';
    return s.toFixed(3) + ' s';
  }
  function run() {
    var r = Number($('rctc-r').value), c = Number($('rctc-c').value) * 1e-6;
    if (!(r > 0 && c > 0)) return;
    var tau = r * c;
    var fc = 1 / (2 * Math.PI * tau);
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('rctc-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;">' +
      cell('τ = RC', fmtT(tau)) +
      cell('5τ (~full charge)', fmtT(5 * tau)) +
      cell('Low-pass f_c', fc >= 1000 ? (fc / 1000).toFixed(2) + ' kHz' : fc.toFixed(2) + ' Hz') +
      cell('High-pass f_c', fc >= 1000 ? (fc / 1000).toFixed(2) + ' kHz' : fc.toFixed(2) + ' Hz') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Same f_c for a first-order high-pass (R and C swapped in the schematic). Debounce RC on a button is often 10 kΩ + 100 nF (τ = 1 ms).</p>';
  }
  $('rctc-r').addEventListener('input', run);
  $('rctc-c').addEventListener('input', run);
  run();
})();
</script>
