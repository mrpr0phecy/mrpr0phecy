<h2 id="shoe-title" style="margin-top:0;color:var(--accent);">👟 Shoe Size Converter</h2>

<form aria-describedby="shoe-desc" onsubmit="event.preventDefault();">
  <p id="shoe-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Convert adult shoe sizes between US, UK, EU and Mondopoint (mm). Based on standard last-length charts — brands still vary by a half size, so treat this as a starting point, not a fitting.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="shoe-who" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Last</label>
      <select id="shoe-who" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="m">Men’s / unisex</option>
        <option value="w">Women’s</option>
      </select>
    </div>
    <div>
      <label for="shoe-sys" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">I know</label>
      <select id="shoe-sys" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="uk">UK</option>
        <option value="us">US</option>
        <option value="eu">EU</option>
        <option value="mm">Mondopoint mm</option>
      </select>
    </div>
    <div>
      <label for="shoe-val" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Size</label>
      <input id="shoe-val" type="number" step="0.5" value="8" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="shoe-out" style="margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;"></div>
<p id="shoe-note" style="margin:12px 0 0;font-size:.75rem;color:var(--text-secondary);"></p>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };

  function toMm(sys, val, who) {
    if (sys === 'mm') return val;
    if (sys === 'eu') return val * 6.67 - 2;
    if (sys === 'uk') return 221 + (val - 1) * 8.46;
    if (who === 'w') return 210 + (val - 4) * 8.46;
    return 220 + (val - 6) * 8.46;
  }
  function fromMm(mm, who) {
    var uk = 1 + (mm - 221) / 8.46;
    var us = who === 'w' ? 4 + (mm - 210) / 8.46 : 6 + (mm - 220) / 8.46;
    var eu = (mm + 2) / 6.67;
    return { uk: uk, us: us, eu: eu, mm: mm, cm: mm / 10, in: mm / 25.4 };
  }
  function nice(n, step) {
    return (Math.round(n / step) * step).toFixed(step < 1 ? 1 : 0);
  }
  function run() {
    var val = Number($('shoe-val').value);
    if (!isFinite(val) || val <= 0) { $('shoe-out').innerHTML = ''; return; }
    var mm = toMm($('shoe-sys').value, val, $('shoe-who').value);
    var s = fromMm(mm, $('shoe-who').value);
    var cards = [
      ['UK', nice(s.uk, 0.5)],
      ['US ' + ($('shoe-who').value === 'w' ? 'W' : 'M'), nice(s.us, 0.5)],
      ['EU', nice(s.eu, 0.5)],
      ['mm', Math.round(s.mm)],
      ['cm', s.cm.toFixed(1)],
      ['inches', s.in.toFixed(1)]
    ];
    $('shoe-out').innerHTML = cards.map(function (c) {
      return '<div style="padding:12px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);text-align:center;"><div style="font-size:.7rem;color:var(--text-secondary);">' + c[0] + '</div><div style="font-size:1.25rem;font-weight:800;color:var(--accent);margin-top:4px;">' + c[1] + '</div></div>';
    }).join('');
    $('shoe-note').textContent = 'Mondopoint is foot length in millimetres. Nike often runs small, New Balance true to size, many EU brands a half-size generous.';
  }
  ['shoe-who', 'shoe-sys', 'shoe-val'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
