<h2 id="plsp-title" style="margin-top:0;color:var(--accent);">🌱 Plant Spacing Calculator</h2>

<form aria-describedby="plsp-desc" onsubmit="event.preventDefault();">
  <p id="plsp-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    How many plants fit a bed at a given spacing. Square grid is simplest; triangular (hex) packing fits about 15% more. Leave paths out of the length and width.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="plsp-l" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Bed length (m)</label>
      <input id="plsp-l" type="number" min="0" step="any" value="4" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="plsp-w" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Bed width (m)</label>
      <input id="plsp-w" type="number" min="0" step="any" value="1.2" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="plsp-s" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Spacing (cm)</label>
      <input id="plsp-s" type="number" min="1" step="any" value="30" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="plsp-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var L = Number($('plsp-l').value), W = Number($('plsp-w').value), s = Number($('plsp-s').value) / 100;
    if (!(L > 0 && W > 0 && s > 0)) return;
    var cols = Math.floor(L / s) + 1;
    var rows = Math.floor(W / s) + 1;
    if ((cols - 1) * s > L) cols = Math.floor(L / s);
    if ((rows - 1) * s > W) rows = Math.floor(W / s);
    cols = Math.max(1, Math.floor(L / s + 0.0001));
    rows = Math.max(1, Math.floor(W / s + 0.0001));
    var square = cols * rows;
    var hex = Math.floor(square * 1.1547);
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('plsp-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Square grid', square + ' plants  (' + cols + ' × ' + rows + ')') +
      cell('Triangular pack (~)', hex + ' plants') +
      cell('Area each', (s * s).toFixed(2) + ' m²') +
      cell('Bed area', (L * W).toFixed(2) + ' m²') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Tomatoes often 45–60 cm, lettuce 20–25 cm, onions 10 cm. Thin seedlings — the calculator assumes finished spacing.</p>';
  }
  ['plsp-l', 'plsp-w', 'plsp-s'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
