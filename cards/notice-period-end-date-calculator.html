<h2 id="ntce-title" style="margin-top:0;color:var(--accent);">📅 Notice Period End Date</h2>

<form aria-describedby="ntce-desc" onsubmit="event.preventDefault();">
  <p id="ntce-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Add weeks or months to the day you hand in notice. UK statutory minimums are 1 week after a month’s service and 1 week per year after two years (capped at 12) — contracts are often longer. This is a calendar, not HR advice.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="ntce-given" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Notice given on</label>
      <input id="ntce-given" type="date" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ntce-n" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Length</label>
      <input id="ntce-n" type="number" min="1" max="52" value="4" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="ntce-u" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Unit</label>
      <select id="ntce-u" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="week">weeks</option>
        <option value="month">months</option>
        <option value="day">calendar days</option>
      </select>
    </div>
    <div>
      <label for="ntce-inc" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Counting</label>
      <select id="ntce-inc" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="after">starts the day after notice</option>
        <option value="same">includes the day of notice</option>
      </select>
    </div>
  </div>
</form>
<div id="ntce-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function iso(d) { return d.toISOString().slice(0, 10); }
  function pretty(d) { return d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
  (function init() {
    var t = new Date();
    $('ntce-given').value = iso(t);
  })();
  function run() {
    var given = $('ntce-given').value;
    var n = Number($('ntce-n').value);
    if (!given || !(n > 0)) return;
    var start = new Date(given + 'T00:00:00');
    if ($('ntce-inc').value === 'after') start.setDate(start.getDate() + 1);
    var end = new Date(start);
    var u = $('ntce-u').value;
    if (u === 'week') end.setDate(end.getDate() + n * 7 - 1);
    else if (u === 'day') end.setDate(end.getDate() + n - 1);
    else {
      end.setMonth(end.getMonth() + n);
      end.setDate(end.getDate() - 1);
    }
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;font-size:.9rem;">' + v + '</div></div>';
    }
    $('ntce-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;">' +
      cell('Notice starts', pretty(start)) +
      cell('Last day (inclusive)', pretty(end)) +
      cell('First day free', pretty(new Date(end.getTime() + 86400000))) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Garden leave, payment in lieu and “to the end of the month” clauses override this. Put the date in writing.</p>';
  }
  ['ntce-given', 'ntce-n', 'ntce-u', 'ntce-inc'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
