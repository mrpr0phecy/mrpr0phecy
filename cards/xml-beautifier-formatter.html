<h2 id="xmlf-title" style="margin-top:0;color:var(--accent);">🌳 XML Beautifier</h2>

<form aria-describedby="xmlf-desc" onsubmit="event.preventDefault();">
  <p id="xmlf-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Pretty-print or minify XML in the browser. No schema validation, no network. Attributes and comments are preserved as text — this is an indenter, not a full XML parser.
  </p>
  <label for="xmlf-in" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">XML</label>
  <textarea id="xmlf-in" rows="8" spellcheck="false" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;"><note><to>Ada</to><from>Alan</from><msg>Hello</msg></note></textarea>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">
    <button type="button" id="xmlf-pretty" style="padding:9px 14px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-weight:800;font-size:.84rem;">Beautify</button>
    <button type="button" id="xmlf-mini" style="padding:9px 14px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-weight:700;font-size:.84rem;">Minify</button>
    <button type="button" id="xmlf-copy" style="padding:9px 14px;background:rgba(255,255,255,.07);color:var(--text);border:1px solid rgba(255,255,255,.16);border-radius:8px;cursor:pointer;font-size:.84rem;">Copy</button>
  </div>
</form>
<pre id="xmlf-out" style="margin-top:12px;padding:12px;border-radius:10px;background:#071019;border:1px solid rgba(45,212,255,.28);color:#91f7ff;font-size:.78rem;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;"></pre>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function pretty(xml) {
    xml = xml.replace(/>\s*</g, '><').trim();
    var pad = 0, out = '';
    xml.split(/(<[^>]+>)/g).forEach(function (token) {
      if (!token) return;
      if (token.charAt(0) !== '<') { out += token; return; }
      if (/^<\//.test(token)) { pad = Math.max(pad - 1, 0); out += '\n' + '  '.repeat(pad) + token; }
      else if (/^<\?/.test(token) || /^<!/.test(token) || /\/>$/.test(token)) { out += '\n' + '  '.repeat(pad) + token; }
      else { out += '\n' + '  '.repeat(pad) + token; pad++; }
    });
    return out.replace(/^\n/, '');
  }
  function mini(xml) { return xml.replace(/>\s+</g, '><').trim(); }
  function run(mode) {
    var src = $('xmlf-in').value;
    $('xmlf-out').textContent = mode === 'mini' ? mini(src) : pretty(src);
  }
  $('xmlf-pretty').addEventListener('click', function () { run('pretty'); });
  $('xmlf-mini').addEventListener('click', function () { run('mini'); });
  $('xmlf-copy').addEventListener('click', function () {
    var t = $('xmlf-out').textContent, btn = this;
    function done() { btn.textContent = '✓ Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done); else done();
  });
  run('pretty');
})();
</script>
