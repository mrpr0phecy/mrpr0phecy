<!-- cards/procrastination-justifier.html -->
<h2 id="procjust-title" style="margin-top:0;color:var(--accent);">🕐 Procrastination Justifier</h2>

<form aria-describedby="procjust-desc" onsubmit="event.preventDefault();">
  <p id="procjust-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Scientifically* valid reasons why you should absolutely do that thing tomorrow instead.
    <span style="color:var(--accent);font-size:0.75rem;">*Not scientifically valid.</span>
  </p>

  <div style="margin-bottom:16px;">
    <label for="procjust-task" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:600;">What are you supposed to be doing?</label>
    <input id="procjust-task" type="text" placeholder="e.g., Cleaning the house, studying, exercise..." style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
  </div>

  <button type="button" onclick="procjustJustify()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🧠 Justify My Procrastination
  </button>

  <div id="procjust-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);margin-bottom:12px;">
    <div id="procjust-reason" style="font-size:1.05rem;color:var(--text);line-height:1.5;margin-bottom:12px;"></div>
    <div id="procjust-study" style="font-size:0.8rem;color:var(--text-secondary);font-style:italic;margin-bottom:8px;"></div>
    <div id="procjust-verdict" style="font-size:0.9rem;color:var(--accent);font-weight:600;"></div>
  </div>

  <div id="procjust-counter" style="text-align:center;font-size:0.8rem;color:var(--text-secondary);"></div>
</form>

<script>
(function(){
  var procjustCount = 0;

  var procjustReasons = [
    { reason: 'Studies show that decision fatigue reduces willpower by 40% by afternoon. You\'ve already made decisions today. You\'re basically depleted.', study: '— Based on a real study that I\'m interpreting very loosely', verdict: 'Verdict: Rest now. Attack tomorrow with full decision energy. 🧠' },
    { reason: 'Your brain consolidates memories during sleep. If you do it now, you won\'t remember doing it. Better to sleep first and do it with a fresh brain.', study: '— Sleep Science Quarterly (I may have paraphrased)', verdict: 'Verdict: A nap is literally an investment in productivity. 😴' },
    { reason: 'The Yerkes-Dodson Law states that performance increases with arousal only up to a point. You\'re too stressed right now. You need to calm down first.', study: '— Yerkes & Dodson, 1906 (they were studying mice, but close enough)', verdict: 'Verdict: Watch one episode. For science. 📺' },
    { reason: 'Creative incubation theory says your subconscious works on problems while you\'re doing other things. By NOT doing it, your brain IS doing it.', study: '— Wallas (1926), The Art of Thought', verdict: 'Verdict: You\'re working on it RIGHT NOW. Subconsciously. You\'re welcome. 🧘' },
    { reason: 'Parkinson\'s Law: work expands to fill the time available. If you give yourself less time, you\'ll be more efficient. Therefore, wait until the last minute.', study: '— C. Northcote Parkinson, 1955 (this one is actually real)', verdict: 'Verdict: Strategic delay = maximum efficiency. It\'s basically project management. 📊' },
    { reason: 'Multitasking reduces productivity by 40%. You\'re already doing something else (reading this). Adding another task would be counterproductive.', study: '— American Psychological Association (sort of)', verdict: 'Verdict: One thing at a time. You chose this thing. Good job. ✅' },
    { reason: 'The Zeigarnik Effect says incomplete tasks create mental tension. But that tension is what motivates you. If you finish it now, you lose your motivation source.', study: '— Bluma Zeigarnik, 1927 (genuine psychology, questionable application)', verdict: 'Verdict: Leave it incomplete. Stay motivated. It\'s psychology. 📐' },
    { reason: 'Your circadian rhythm has a natural dip right now. Peak performance windows are real, and this isn\'t one of them. Wait for your window.', study: '— Chronobiology International (probably)', verdict: 'Verdict: Check back in 3-6 hours. Your body knows best. ⏰' },
    { reason: 'The Pomodoro Technique requires breaks. You haven\'t done a Pomodoro yet, but you\'ve definitely earned the break part. Start with the break.', study: '— Francesco Cirillo (the tomato guy)', verdict: 'Verdict: Break first, work second. The tomato would want it this way. 🍅' },
    { reason: 'Entropy always increases. Your room will get messy again. Your homework will need doing again. Fighting entropy is futile. Embrace the chaos.', study: '— The Second Law of Thermodynamics (you can\'t argue with physics)', verdict: 'Verdict: The universe literally supports your decision. 🌌' },
    { reason: 'A Stanford study found that people who daydream score higher on creativity tests. You\'re not procrastinating — you\'re boosting your creative capacity.', study: '— Schooler et al. (real study, wild interpretation)', verdict: 'Verdict: Stare out the window. It\'s brain training. 🪟' },
    { reason: 'The Hawthorne Effect says people perform better when observed. Nobody\'s watching you right now. Statistically, this is your worst performance window.', study: '— Western Electric Hawthorne Works, 1924', verdict: 'Verdict: Wait until someone\'s watching. Then crush it. 👀' }
  ];

  window.procjustJustify = function() {
    var task = document.getElementById('procjust-task').value.trim() || 'that thing you\'re supposed to be doing';
    var pick = procjustReasons[Math.floor(Math.random() * procjustReasons.length)];

    var reason = pick.reason.replace(/that thing/gi, task);
    document.getElementById('procjust-reason').innerHTML = '📋 <strong>Regarding "' + task + '":</strong><br><br>' + reason;
    document.getElementById('procjust-study').textContent = pick.study;
    document.getElementById('procjust-verdict').textContent = pick.verdict;
    document.getElementById('procjust-result').style.display = 'block';

    procjustCount++;
    document.getElementById('procjust-counter').innerHTML = '🕐 You\'ve justified procrastinating <strong>' + procjustCount + '</strong> time' + (procjustCount > 1 ? 's' : '') + ' this session.<br>' + (procjustCount > 3 ? '<span style="color:#ff4d4d;">At this point you\'re procrastinating from procrastinating.</span>' : '<span style="color:var(--accent);">Those are rookie numbers.</span>');
  };
})();
</script>
