<!-- cards/plastering-calculator.html -->
<h2 id="plstrcalc-title" style="margin-top:0;color:var(--accent);">🪣 Plastering Calculator</h2>

<form aria-describedby="plstrcalc-desc" onsubmit="event.preventDefault();">
  <p id="plstrcalc-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Calculate how much plaster, render, or screed you need for walls, ceilings, or floors. Includes bags, coverage, and estimated cost.
  </p>

  <div style="margin-bottom:12px;">
    <label for="plstrcalc-type" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Plaster Type</label>
    <select id="plstrcalc-type" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="multi" selected>Multi-Finish (skim coat, 2–3mm)</option>
      <option value="board">Board Finish (on plasterboard, 2mm)</option>
      <option value="undercoat">Undercoat / Browning (6–8mm)</option>
      <option value="render">External Render (10–15mm)</option>
      <option value="screed">Floor Screed (50–75mm)</option>
      <option value="lime">Lime Plaster (10–15mm, old buildings)</option>
    </select>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="plstrcalc-w" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Total Width (m)</label>
      <input id="plstrcalc-w" type="number" step="0.1" min="0.5" value="12" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
      <div style="font-size:0.7rem;color:var(--text-secondary);margin-top:2px;">Sum of all wall widths being plastered</div>
    </div>
    <div>
      <label for="plstrcalc-h" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Height (m)</label>
      <input id="plstrcalc-h" type="number" step="0.1" min="0.5" value="2.4" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
    <div>
      <label for="plstrcalc-openings" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Openings (m²)</label>
      <input id="plstrcalc-openings" type="number" step="0.1" min="0" value="3" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
      <div style="font-size:0.7rem;color:var(--text-secondary);margin-top:2px;">Total area of doors + windows</div>
    </div>
    <div>
      <label for="plstrcalc-coats" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Number of Coats</label>
      <select id="plstrcalc-coats" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="1" selected>1 coat (skim / render)</option>
        <option value="2">2 coats (undercoat + skim)</option>
      </select>
    </div>
  </div>

  <button type="button" onclick="plstrcalcCalc()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🪣 Calculate Plaster Needed
  </button>

  <div id="plstrcalc-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;">
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(45,212,255,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">Net Area</div>
        <div id="plstrcalc-area" style="font-size:1.3rem;color:var(--accent);font-weight:700;"></div>
      </div>
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(57,255,20,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">Plaster Needed</div>
        <div id="plstrcalc-weight" style="font-size:1.3rem;color:#39ff14;font-weight:700;"></div>
      </div>
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(255,215,0,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">Bags</div>
        <div id="plstrcalc-bags" style="font-size:1.3rem;color:#ffd700;font-weight:700;"></div>
      </div>
    </div>
    <div id="plstrcalc-breakdown" style="font-size:0.85rem;color:var(--text);line-height:1.8;margin-bottom:10px;"></div>
    <div id="plstrcalc-cost" style="font-size:1rem;color:var(--accent);font-weight:700;text-align:center;margin-bottom:8px;"></div>
    <div id="plstrcalc-tips" style="font-size:0.8rem;color:var(--text-secondary);line-height:1.6;"></div>
  </div>
</form>

<script>
(function(){
  var plstrTypes={
    multi:{name:'Multi-Finish',thickness:0.003,coverage:10,bagSize:25,bagPrice:8,desc:'2–3mm skim coat on existing plaster or plasterboard.'},
    board:{name:'Board Finish',thickness:0.002,coverage:12,bagSize:25,bagPrice:8,desc:'2mm skim on new plasterboard. Use scrim tape on joints first.'},
    undercoat:{name:'Undercoat / Browning',thickness:0.008,coverage:3.5,bagSize:25,bagPrice:7,desc:'6–8mm base coat on blockwork or brick before skimming.'},
    render:{name:'External Render',thickness:0.012,coverage:2.5,bagSize:25,bagPrice:7,desc:'10–15mm sand & cement render. Apply in 2 coats: scratch + top.'},
    screed:{name:'Floor Screed',thickness:0.06,coverage:0.5,bagSize:25,bagPrice:6,desc:'50–75mm sand & cement screed. Use a straightedge to level.'},
    lime:{name:'Lime Plaster',thickness:0.012,coverage:2.5,bagSize:25,bagPrice:18,desc:'10–15mm traditional lime plaster. Breathable — essential for old buildings.'}
  };

  window.plstrcalcCalc=function(){
    var type=document.getElementById('plstrcalc-type').value;
    var w=parseFloat(document.getElementById('plstrcalc-w').value);
    var h=parseFloat(document.getElementById('plstrcalc-h').value);
    var openings=parseFloat(document.getElementById('plstrcalc-openings').value);
    var coats=parseInt(document.getElementById('plstrcalc-coats').value);
    var t=plstrTypes[type];
    var grossArea=w*h;
    var netArea=Math.max(grossArea-openings,0.5);
    var totalArea=netArea*coats;
    var kgNeeded=totalArea/t.coverage*t.bagSize;
    var bagsNeeded=Math.ceil(kgNeeded/t.bagSize);
    var waterLitres=Math.round(kgNeeded*0.4);
    document.getElementById('plstrcalc-area').textContent=netArea.toFixed(1)+' m²';
    document.getElementById('plstrcalc-weight').textContent=Math.round(kgNeeded)+' kg';
    document.getElementById('plstrcalc-bags').textContent=bagsNeeded+' bags';
    document.getElementById('plstrcalc-breakdown').innerHTML=
      '📐 Gross area: <strong>'+grossArea.toFixed(1)+' m²</strong> − '+openings+' m² openings = <strong>'+netArea.toFixed(1)+' m²</strong><br>'+
      '📏 Thickness: <strong>'+(t.thickness*1000).toFixed(0)+'mm</strong> per coat × '+coats+' coat'+(coats>1?'s':'')+'<br>'+
      '📦 Coverage: <strong>'+t.coverage+' m² per '+t.bagSize+'kg bag</strong><br>'+
      '💧 Mixing water: ~<strong>'+waterLitres+' litres</strong><br>'+
      '📋 '+t.desc;
    var totalCost=bagsNeeded*t.bagPrice;
    document.getElementById('plstrcalc-cost').innerHTML='💰 '+bagsNeeded+' bags at £'+t.bagPrice+' each: <strong>£'+totalCost+'</strong>';
    document.getElementById('plstrcalc-tips').innerHTML='💡 <strong>Mix to a smooth, creamy consistency</strong> — not too runny, not too stiff. It should hold on a trowel without sliding off.<br>💡 <strong>Work time:</strong> Multi-finish gives you ~90 minutes before it starts to set. Don\'t mix more than you can use.<br>💡 <strong>Dampen the wall</strong> before applying to existing masonry — dry walls suck moisture out of plaster too fast and cause cracking.<br>💡 <strong>Don\'t overwork it</strong> — once the plaster starts to go off, stop trowelling or you\'ll pull it off the wall.';
    document.getElementById('plstrcalc-result').style.display='block';
  };
})();
</script>
