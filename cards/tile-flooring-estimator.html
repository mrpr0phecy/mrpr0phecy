<!-- cards/tile-flooring-estimator.html -->
<h2 id="tileflr-title" style="margin-top:0;color:var(--accent);">🧱 Tile & Flooring Estimator</h2>

<form aria-describedby="tileflr-desc" onsubmit="event.preventDefault();">
  <p id="tileflr-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Calculate tiles, planks, or carpet needed for any room — including waste and cuts.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="tileflr-w" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Room Width (m)</label>
      <input id="tileflr-w" type="number" step="0.1" min="0.5" value="3" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="tileflr-l" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Room Length (m)</label>
      <input id="tileflr-l" type="number" step="0.1" min="0.5" value="4" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
  </div>

  <div style="margin-bottom:12px;">
    <label for="tileflr-type" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Flooring Type</label>
    <select id="tileflr-type" onchange="tileflrUpdateSizes()" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="tile-ceramic">Ceramic / Porcelain Tiles</option>
      <option value="tile-large">Large Format Tiles (60×60+)</option>
      <option value="vinyl">Vinyl Plank / LVT</option>
      <option value="laminate">Laminate Flooring</option>
      <option value="hardwood">Hardwood / Engineered Wood</option>
      <option value="carpet">Carpet</option>
    </select>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="tileflr-tile-w" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Tile/Plank Width (cm)</label>
      <input id="tileflr-tile-w" type="number" step="1" min="1" value="30" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="tileflr-tile-l" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Tile/Plank Length (cm)</label>
      <input id="tileflr-tile-l" type="number" step="1" min="1" value="30" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="tileflr-pack" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Coverage per Pack (m²)</label>
      <input id="tileflr-pack" type="number" step="0.1" min="0.1" value="1.44" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="tileflr-price" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Price per Pack (£)</label>
      <input id="tileflr-price" type="number" step="0.01" min="0" value="25" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
  </div>

  <div style="margin-bottom:14px;">
    <label for="tileflr-waste" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Waste Allowance</label>
    <select id="tileflr-waste" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="5">5% — Straight lay, simple room</option>
      <option value="10" selected>10% — Standard (recommended)</option>
      <option value="15">15% — Diagonal lay or complex room</option>
      <option value="20">20% — Herringbone / chevron pattern</option>
    </select>
  </div>

  <button type="button" onclick="tileflrCalc()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🧱 Calculate Materials
  </button>

  <div id="tileflr-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;">
      <div style="text-align:center;padding:10px;border-radius:8px;background:rgba(45,212,255,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">Floor Area</div>
        <div id="tileflr-area" style="font-size:1.1rem;color:var(--accent);font-weight:700;"></div>
      </div>
      <div style="text-align:center;padding:10px;border-radius:8px;background:rgba(57,255,20,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">With Waste</div>
        <div id="tileflr-total" style="font-size:1.1rem;color:#39ff14;font-weight:700;"></div>
      </div>
      <div style="text-align:center;padding:10px;border-radius:8px;background:rgba(255,215,0,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">Individual Pieces</div>
        <div id="tileflr-pieces" style="font-size:1.1rem;color:#ffd700;font-weight:700;"></div>
      </div>
    </div>
    <div id="tileflr-packs" style="text-align:center;font-size:1rem;color:var(--text);margin-bottom:8px;"></div>
    <div id="tileflr-cost" style="text-align:center;font-size:1.1rem;color:var(--accent);font-weight:700;margin-bottom:8px;"></div>
    <div id="tileflr-tip" style="font-size:0.8rem;color:var(--text-secondary);text-align:center;font-style:italic;"></div>
  </div>
</form>

<script>
(function(){
  var tileflrSizes={'tile-ceramic':[30,30,1.44],'tile-large':[60,60,1.44],'vinyl':[15,120,2.2],'laminate':[19,120,1.8],'hardwood':[15,120,1.5],'carpet':[400,50,5]};
  window.tileflrUpdateSizes=function(){
    var t=document.getElementById('tileflr-type').value;
    var s=tileflrSizes[t];
    document.getElementById('tileflr-tile-w').value=s[0];
    document.getElementById('tileflr-tile-l').value=s[1];
    document.getElementById('tileflr-pack').value=s[2];
  };
  window.tileflrCalc=function(){
    var rw=parseFloat(document.getElementById('tileflr-w').value);
    var rl=parseFloat(document.getElementById('tileflr-l').value);
    var tw=parseFloat(document.getElementById('tileflr-tile-w').value)/100;
    var tl=parseFloat(document.getElementById('tileflr-tile-l').value)/100;
    var packM2=parseFloat(document.getElementById('tileflr-pack').value);
    var pricePack=parseFloat(document.getElementById('tileflr-price').value);
    var waste=parseInt(document.getElementById('tileflr-waste').value)/100;
    var area=rw*rl;
    var totalArea=area*(1+waste);
    var pieces=Math.ceil(totalArea/(tw*tl));
    var packs=Math.ceil(totalArea/packM2);
    var cost=packs*pricePack;
    document.getElementById('tileflr-area').textContent=area.toFixed(1)+' m²';
    document.getElementById('tileflr-total').textContent=totalArea.toFixed(1)+' m²';
    document.getElementById('tileflr-pieces').textContent=pieces;
    document.getElementById('tileflr-packs').innerHTML='🛒 Buy <strong>'+packs+' packs</strong> ('+packM2+' m² each)';
    document.getElementById('tileflr-cost').innerHTML='💰 Estimated cost: <strong>£'+cost.toFixed(2)+'</strong>';
    document.getElementById('tileflr-tip').textContent='💡 Always buy an extra pack — batches vary in colour, and finding a matching batch later is nearly impossible.';
    document.getElementById('tileflr-result').style.display='block';
  };
})();
</script>
