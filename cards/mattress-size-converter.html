<h2 id="matz-title" style="margin-top:0;color:var(--accent);">🛏️ Mattress Size Converter</h2>

<form aria-describedby="matz-desc" onsubmit="event.preventDefault();">
  <p id="matz-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    UK, US and EU bed names are not the same size. A UK king is 150 × 200 cm; a US king is 193 × 203 cm. Fitted sheets do not stretch that gap. Depth (deep-fitted) is separate.
  </p>
  <div>
    <label for="matz-size" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Named size</label>
    <select id="matz-size" style="width:100%;max-width:420px;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);"></select>
  </div>
</form>
<div id="matz-out" style="margin-top:14px;"></div>
<p id="matz-note" style="margin-top:10px;font-size:.75rem;color:var(--text-secondary);"></p>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var SIZES = [
    ['UK small single', 75, 190], ['UK single', 90, 190], ['UK double', 135, 190],
    ['UK king', 150, 200], ['UK super king', 180, 200],
    ['EU 90×200', 90, 200], ['EU 140×200', 140, 200], ['EU 160×200', 160, 200], ['EU 180×200', 180, 200],
    ['US twin', 97, 191], ['US twin XL', 97, 203], ['US full / double', 137, 191],
    ['US queen', 152, 203], ['US king', 193, 203], ['US California king', 183, 213]
  ];
  var sel = $('matz-size');
  sel.innerHTML = SIZES.map(function (s, i) { return '<option value="' + i + '"' + (s[0] === 'UK king' ? ' selected' : '') + '>' + s[0] + '</option>'; }).join('');
  function run() {
    var s = SIZES[Number(sel.value)] || SIZES[3];
    var w = s[1], l = s[2];
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('matz-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Centimetres', w + ' × ' + l + ' cm') +
      cell('Inches', (w / 2.54).toFixed(1) + ' × ' + (l / 2.54).toFixed(1) + ' in') +
      cell('Feet', (w / 30.48).toFixed(2) + ' × ' + (l / 30.48).toFixed(2) + ' ft') +
      cell('Area', ((w * l) / 10000).toFixed(2) + ' m²') +
      '</div>';
    $('matz-note').textContent = 'Closest other names: ' + SIZES.filter(function (o, i) { return i !== Number(sel.value) && Math.abs(o[1] - w) <= 8 && Math.abs(o[2] - l) <= 15; }).map(function (o) { return o[0]; }).join(', ') || 'no close alias';
  }
  sel.addEventListener('change', run);
  run();
})();
</script>
