<h2>⏰ Your Life Is Telling a Different Story Than You Think</h2>
<p class="description">You say you value family, health, creativity. But where does your time actually go? This tool reveals the gap between your stated values and your lived values — the most honest mirror there is.</p>
<div id="vt-app" style="max-width:560px;margin:0 auto;"></div>
<script>
(function(){
'use strict';
var values=[],hours=[],step=0;
var options=['Family & Relationships','Health & Fitness','Career & Achievement','Creativity & Art','Learning & Growth','Rest & Recovery','Social Life & Community','Financial Security','Adventure & Fun','Spirituality & Inner Peace','Helping Others','Personal Space & Solitude'];
function init(){step=0;values=[];hours=[];render();}
function render(){
  var h='';
  if(step===0){
    h+='<div style="text-align:center;margin-bottom:20px;">';
    h+='<div style="font-size:64px;margin-bottom:12px;">🪞</div>';
    h+='<h3 style="color:#39ff14;margin:0 0 8px;">The most honest mirror</h3>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);">If someone watched how you spent your last two weeks — not what you said, but what you <i>actually did</i> — what would they conclude you value most? This isn\'t about guilt. It\'s about <b>alignment</b>. When your time matches your values, you feel whole. When it doesn\'t, you feel a low-grade wrongness you can\'t name.</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-top:12px;">Most people discover that their top stated value gets their <i>leftover</i> time, not their <i>best</i> time. That\'s the gap this tool reveals.</p>';
    h+='</div>';
    h+='<button onclick="window._vtNext()" style="display:block;margin:0 auto;padding:12px 32px;background:linear-gradient(135deg,#39ff14,#00cc00);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px;">Begin</button>';
  }else if(step===1){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">💭</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;"><b>Step 1: What do you SAY you value?</b><br>Pick the 4 areas that matter most to you. These are your stated values — what you\'d tell someone you care about.</p>';
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">';
    options.forEach(function(o,i){
      h+='<label style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-secondary);">';
      h+='<input type="checkbox" class="vt-val" value="'+o+'" style="accent-color:#39ff14;width:18px;height:18px;">'+o+'</label>';
    });
    h+='</div>';
    h+='<button onclick="window._vtNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#39ff14,#00cc00);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Continue</button>';
  }else if(step===2){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">📊</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;"><b>Step 2: Where does your time ACTUALLY go?</b><br>Estimate your average weekly hours for each of your chosen values. Be brutally honest — not where you wish your time went, but where it actually goes.</p>';
    h+='<p style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:12px;">You have roughly 112 waking hours per week (16h × 7 days).</p>';
    values.forEach(function(v){
      h+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">';
      h+='<span style="flex:1;font-size:13px;color:#e6faff;">'+v+'</span>';
      h+='<input type="number" class="vt-hrs" data-val="'+v+'" min="0" max="112" value="10" style="width:70px;padding:8px;border-radius:6px;border:1px solid rgba(57,255,20,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;text-align:center;">';
      h+='<span style="font-size:12px;color:var(--text-secondary);">hrs/wk</span>';
      h+='</div>';
    });
    h+='<button onclick="window._vtNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#39ff14,#00cc00);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Show Me the Truth</button>';
  }else if(step===3){
    var total=0;hours.forEach(function(x){total+=x;});
    var sorted=values.map(function(v,i){return{name:v,hours:hours[i]};}).sort(function(a,b){return b.hours-a.hours;});
    var topActual=sorted[0]?sorted[0].name:'unknown';
    var aligned=topActual===values[0];
    h+='<div style="text-align:center;margin-bottom:20px;"><div style="font-size:64px;">'+(aligned?'✅':'⚡')+'</div></div>';
    h+='<div style="background:rgba(57,255,20,0.08);border:1px solid rgba(57,255,20,0.2);border-radius:10px;padding:20px;margin-bottom:16px;">';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0 0 12px;"><b>Your stated #1 value:</b> <span style="color:#39ff14;">'+values[0]+'</span></p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0 0 16px;"><b>Where most time actually goes:</b> <span style="color:'+(aligned?'#39ff14':'#ff6b81')+';">'+topActual+'</span></p>';
    h+='<div style="margin-bottom:12px;">';
    sorted.forEach(function(s){
      var pct=total>0?Math.round(s.hours/total*100):0;
      h+='<div style="margin-bottom:6px;">';
      h+='<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px;"><span style="color:var(--text-secondary);">'+s.name+'</span><span style="color:#39ff14;">'+s.hours+'h ('+pct+'%)</span></div>';
      h+='<div style="height:8px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#39ff14,#00cc00);border-radius:4px;"></div></div>';
      h+='</div>';
    });
    h+='</div>';
    if(!aligned){
      h+='<p style="font-size:14px;line-height:1.8;color:#ff6b81;margin:0;"><b>The gap:</b> You say "'+values[0]+'" matters most, but your calendar says "'+topActual+'." This isn\'t a moral failing — it\'s a <b>systems problem</b>. Your environment, habits, and obligations are routing your time away from what matters. The fix isn\'t willpower. It\'s redesigning your defaults.</p>';
    }else{
      h+='<p style="font-size:14px;line-height:1.8;color:#39ff14;margin:0;"><b>You\'re aligned.</b> Your time is flowing toward what you say matters. This is rare. Protect it.</p>';
    }
    h+='</div>';
    h+='<p style="font-size:13px;color:var(--text-secondary);line-height:1.7;">Research by Laura Vanderkam shows that people who track their time discover 30-50 hours per week of "drift" — time that goes nowhere intentionally. You don\'t need more time. You need to <b>redirect the time you already have</b>.</p>';
    h+='<button onclick="window._vtReset()" style="display:block;margin:20px auto 0;padding:10px 24px;background:rgba(57,255,20,0.15);color:#39ff14;border:1px solid rgba(57,255,20,0.3);border-radius:8px;cursor:pointer;font-weight:600;">Start Over</button>';
  }
  document.getElementById('vt-app').innerHTML=h;
}
window._vtNext=function(){
  if(step===1){
    values=[];
    document.querySelectorAll('.vt-val:checked').forEach(function(cb){values.push(cb.value);});
    if(values.length<2){alert('Please select at least 2 values.');return;}
    if(values.length>4){alert('Please select at most 4 values.');return;}
  }
  if(step===2){
    hours=[];
    document.querySelectorAll('.vt-hrs').forEach(function(inp){hours.push(parseInt(inp.value)||0);});
  }
  step++;render();
};
window._vtReset=function(){init();};
init();
})();
</script>
