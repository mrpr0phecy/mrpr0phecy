<h2 id="isow-title" style="margin-top:0;color:var(--accent);">📆 ISO Week Number Finder</h2>

<form aria-describedby="isow-desc" onsubmit="event.preventDefault();">
  <p id="isow-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Convert a date to its ISO-8601 week (YYYY-Www-d) and the other way around. Weeks start on Monday; week 1 is the week with 4 January (the week containing the first Thursday).
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="isow-date" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Date</label>
      <input id="isow-date" type="date" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="isow-year" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">ISO year</label>
      <input id="isow-year" type="number" min="1970" max="2100" value="2026" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="isow-week" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Week 1–53</label>
      <input id="isow-week" type="number" min="1" max="53" value="1" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="isow-day" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Weekday</label>
      <select id="isow-day" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="1">Monday</option>
        <option value="2">Tuesday</option>
        <option value="3">Wednesday</option>
        <option value="4">Thursday</option>
        <option value="5">Friday</option>
        <option value="6">Saturday</option>
        <option value="7">Sunday</option>
      </select>
    </div>
  </div>
</form>
<div id="isow-out" style="margin-top:14px;padding:14px;border-radius:10px;background:rgba(45,212,255,.08);border:1px solid rgba(45,212,255,.28);"></div>
<button type="button" id="isow-copy" style="margin-top:10px;padding:8px 12px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:700;">Copy YYYY-Www-d</button>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  var lastIso = '';
  var lock = false;

  function pad(n) { return String(n).padStart(2, '0'); }
  function isoWeek(date) {
    var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    var day = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - day);
    var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    var week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return { year: d.getUTCFullYear(), week: week, day: day };
  }
  function dateFromIso(year, week, day) {
    var simple = new Date(Date.UTC(year, 0, 1 + (week - 1) * 7));
    var dow = simple.getUTCDay() || 7;
    var ISOweekStart = new Date(simple);
    if (dow <= 4) ISOweekStart.setUTCDate(simple.getUTCDate() - dow + 1);
    else ISOweekStart.setUTCDate(simple.getUTCDate() + 8 - dow);
    ISOweekStart.setUTCDate(ISOweekStart.getUTCDate() + (day - 1));
    return ISOweekStart;
  }
  function fmt(d) {
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }
  function fromDate() {
    if (lock) return;
    var str = $('isow-date').value;
    if (!str) return;
    var p = str.split('-');
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    var w = isoWeek(d);
    lock = true;
    $('isow-year').value = w.year;
    $('isow-week').value = w.week;
    $('isow-day').value = String(w.day);
    lock = false;
    lastIso = w.year + '-W' + pad(w.week) + '-' + w.day;
    var start = dateFromIso(w.year, w.week, 1);
    var end = dateFromIso(w.year, w.week, 7);
    $('isow-out').innerHTML = '<div style="font-size:1.3rem;font-weight:800;color:var(--accent);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">' + lastIso + '</div>' +
      '<div style="font-size:.84rem;color:var(--text);margin-top:6px;">' + DAYS[w.day - 1] + ' of week ' + w.week + ', ISO year ' + w.year + '</div>' +
      '<div style="font-size:.8rem;color:var(--text-secondary);margin-top:4px;">That week runs ' + fmt(start) + ' → ' + fmt(end) + ' (Mon–Sun).</div>';
  }
  function fromWeek() {
    if (lock) return;
    var y = Number($('isow-year').value), w = Number($('isow-week').value), d = Number($('isow-day').value);
    if (!(y && w && d)) return;
    var date = dateFromIso(y, w, d);
    lock = true;
    $('isow-date').value = fmt(date);
    lock = false;
    fromDate();
  }
  var n = new Date();
  $('isow-date').value = n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate());
  $('isow-date').addEventListener('change', fromDate);
  ['isow-year', 'isow-week', 'isow-day'].forEach(function (id) { $(id).addEventListener('change', fromWeek); });
  $('isow-copy').addEventListener('click', function () {
    if (!lastIso) return;
    var btn = this;
    function done() { btn.textContent = '✓ Copied'; setTimeout(function () { btn.textContent = 'Copy YYYY-Www-d'; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(lastIso).then(done);
    else done();
  });
  fromDate();
})();
</script>
