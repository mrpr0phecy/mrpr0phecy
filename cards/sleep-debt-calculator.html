<h2 id="sdeb-title" style="margin-top:0;color:var(--accent);">😴 Sleep Debt Calculator</h2>

<form aria-describedby="sdeb-desc" onsubmit="event.preventDefault();">
  <p id="sdeb-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Need minus hours actually slept, summed over the week. Most adults are in the 7–9 h band; you are not. This is arithmetic, not a sleep clinic. If you stop breathing at night, talk to a GP.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="sdeb-need" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Need h / night</label>
      <input id="sdeb-need" type="number" min="4" max="12" step="0.25" value="8" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
  <div id="sdeb-days" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:10px;"></div>
</form>
<div id="sdeb-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var defs = [6.5, 6.5, 7, 6, 6.5, 8.5, 9];
  var box = $('sdeb-days');
  days.forEach(function (d, i) {
    var wrap = document.createElement('div');
    var lab = document.createElement('label');
    lab.textContent = d;
    lab.setAttribute('for', 'sdeb-d' + i);
    lab.style.cssText = 'display:block;font-size:.72rem;color:var(--text-secondary);margin-bottom:4px;';
    var inp = document.createElement('input');
    inp.id = 'sdeb-d' + i;
    inp.type = 'number'; inp.min = '0'; inp.max = '14'; inp.step = 'any'; inp.value = String(defs[i]);
    inp.inputMode = 'decimal';
    inp.style.cssText = 'width:100%;padding:8px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);';
    wrap.appendChild(lab); wrap.appendChild(inp); box.appendChild(wrap);
  });
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var need = Number($('sdeb-need').value);
    var got = 0;
    for (var i = 0; i < 7; i++) got += Number(host.querySelector('#sdeb-d' + i).value) || 0;
    var want = need * 7;
    var debt = want - got;
    $('sdeb-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Slept this week', got.toFixed(1) + ' h') +
      cell('Target week', want.toFixed(1) + ' h') +
      cell(debt >= 0 ? 'Debt' : 'Surplus', Math.abs(debt).toFixed(1) + ' h') +
      cell('Nightly average', (got / 7).toFixed(2) + ' h') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">You cannot “bank” sleep perfectly with a weekend lie-in. Catch-up helps a bit; a regular bedtime helps more. Caffeine after mid-afternoon is a common leak.</p>';
  }
  $('sdeb-need').addEventListener('input', run);
  for (var i = 0; i < 7; i++) host.querySelector('#sdeb-d' + i).addEventListener('input', run);
  run();
})();
</script>
