<!-- cards/conspiracy-theory-generator.html -->
<h2 id="conspgen-title" style="margin-top:0;color:var(--accent);">🤡 Conspiracy Theory Generator</h2>

<form aria-describedby="conspgen-desc" onsubmit="event.preventDefault();">
  <p id="conspgen-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Generate absurd conspiracy theories that are somehow more believable than the real ones.
  </p>

  <div style="margin-bottom:16px;">
    <label for="conspgen-topic" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:600;">Pick a topic to "expose":</label>
    <select id="conspgen-topic" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="pigeons">Pigeons</option>
      <option value="socks">Missing Socks</option>
      <option value="wifi">WiFi</option>
      <option value="cats">Cats</option>
      <option value="mondays">Mondays</option>
      <option value="fridges">Refrigerators</option>
      <option value="stairs">Stairs</option>
      <option value="bubbles">Bubbles</option>
      <option value="mirrors">Mirrors</option>
      <option value="traffic">Traffic Lights</option>
    </select>
  </div>

  <button type="button" onclick="conspgenGenerate()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🔍 Expose The Truth
  </button>

  <div id="conspgen-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);margin-bottom:12px;">
    <div id="conspgen-title-out" style="font-size:1.1rem;color:var(--accent);font-weight:700;margin-bottom:8px;"></div>
    <div id="conspgen-body" style="font-size:0.95rem;color:var(--text);line-height:1.6;margin-bottom:12px;"></div>
    <div id="conspgen-evidence" style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:8px;"></div>
    <div id="conspgen-credibility" style="font-size:0.85rem;"></div>
  </div>

  <div id="conspgen-count" style="text-align:center;font-size:0.8rem;color:var(--text-secondary);"></div>
</form>

<script>
(function(){
  var conspgenCount = 0;

  var conspgenTheories = {
    pigeons: [
      { title: '🐦 Pigeons Are Government Surveillance Drones', body: 'Pigeons were replaced by tiny surveillance drones in 1986. The "cooing" sound is actually data being transmitted to MI5. Ever notice how pigeons stare at you? That\'s facial recognition software calibrating.', evidence: 'Evidence: Have you ever seen a baby pigeon? Exactly. They\'re manufactured in batches.', cred: 'Credibility: 7/10 — more believable than some things on the news' },
      { title: '🐦 Pigeons Control the Bread Industry', body: 'Big Pigeon has been manipulating the bread market for decades. They make themselves look cute so humans buy more bread to feed them. The entire artisan sourdough trend? Pigeon-funded.', evidence: 'Evidence: Bread sales spike 300% in areas with high pigeon populations. Coincidence? Yes. But still.', cred: 'Credibility: 4/10 — but the bread thing is suspicious' },
      { title: '🐦 Pigeons Are Actually Tiny Accountants', body: 'Every pigeon is assigned a human and keeps meticulous track of their karma. The head-bobbing walk? That\'s them tallying your good and bad deeds. When a pigeon poops on you, that\'s a fine.', evidence: 'Evidence: Pigeons only poop on people who deserve it. The data checks out.', cred: 'Credibility: 6/10 — explains a lot honestly' }
    ],
    socks: [
      { title: '🧦 Missing Socks Are Currency in a Parallel Dimension', body: 'There\'s a thriving economy in the dimension accessed through your dryer. Socks are their gold. The lint trap is actually a portal, and every time you clean it, you\'re paying a toll.', evidence: 'Evidence: You always lose ONE sock, never a pair. They need odd socks to prevent counterfeiting.', cred: 'Credibility: 8/10 — this is now my headcanon' },
      { title: '🧦 Socks Are Sentient and Escape When Bored', body: 'Socks have a 3-wash attention span. After the third wash, they\'re done with you and slip away during the spin cycle. The ones that stay? They\'re just not brave enough.', evidence: 'Evidence: Your favourite socks always disappear first. They had the most confidence.', cred: 'Credibility: 5/10 — explains why novelty socks last longer (they\'re having fun)' },
      { title: '🧦 The Sock Dimension Has a Sock Version of You', body: 'Every missing sock ends up in a mirror dimension where socks wear humans. There\'s a sock version of you right now complaining about losing a human in the wash.', evidence: 'Evidence: Quantum physics technically allows this. Probably.', cred: 'Credibility: 2/10 — but spiritually 10/10' }
    ],
    wifi: [
      { title: '📡 WiFi Passwords Are Actually Ancient Incantations', body: 'Every WiFi password is a fragment of an ancient spell. When you type "xK9#mP2!" you\'re actually summoning internet spirits. Router blinking? That\'s the spirits arriving.', evidence: 'Evidence: WiFi didn\'t exist until we started using special characters in passwords. The ancients knew.', cred: 'Credibility: 3/10 — but explains why "password123" never works well' },
      { title: '📡 Your Router Is Judging Your Search History', body: 'Every router has a tiny AI that rates your browsing habits on a scale of 1-10. When the WiFi slows down, it\'s not the signal — it\'s your router losing respect for you.', evidence: 'Evidence: WiFi is always fastest when you\'re doing something productive. Suspicious.', cred: 'Credibility: 7/10 — mine definitely saw that 3am Wikipedia rabbit hole' },
      { title: '📡 WiFi Signals Are How Birds Navigate (And Plot)', body: 'Birds switched from magnetic navigation to WiFi in 2007. The 5GHz band is their preferred communication channel. When your WiFi drops, it\'s because a flock is using your bandwidth.', evidence: 'Evidence: WiFi problems always get worse during migration season. Look it up. (Don\'t actually.)', cred: 'Credibility: 4/10 — the pigeon drones need internet too' }
    ],
    cats: [
      { title: '🐱 Cats Can See WiFi and They Don\'t Like It', body: 'Cats stare at "nothing" because they can see WiFi signals, and they find them aesthetically offensive. The random 3am zoomies? That\'s when the signal pattern changes and they\'re outraged.', evidence: 'Evidence: Cats hate routers. Knock them off tables. Always.', cred: 'Credibility: 6/10 — cats definitely hate something invisible' },
      { title: '🐱 Cats Are Running a Yelp for Humans', body: 'Every cat is a secret reviewer. The slow blink? That\'s a 5-star rating. Knocking things off tables? That\'s a 1-star review of your interior design choices.', evidence: 'Evidence: Cats only knock YOUR stuff off tables. They\'re critiquing, not playing.', cred: 'Credibility: 8/10 — my cat gave my sofa 2 stars' },
      { title: '🐱 Cats Are Liquid Because They\'re Not Fully Rendered', body: 'Cats can fit into any container because they\'re not fully rendered in our simulation. They\'re basically NPCs with incomplete collision detection. The "if I fits I sits" meme is a bug report.', evidence: 'Evidence: r/CatsAreLiquid has 400k+ members. The evidence is overwhelming.', cred: 'Credibility: 9/10 — this one might actually be true' }
    ],
    mondays: [
      { title: '😩 Mondays Are 23 Minutes Longer Than Other Days', body: 'NASA confirmed that Monday contains 25 hours, but they hide it to prevent mass panic. The extra time is distributed as invisible micro-minutes throughout the day, which is why it never ends.', evidence: 'Evidence: Monday always FEELS longer. NASA can\'t explain that away.', cred: 'Credibility: 5/10 — relatable enough to be dangerous' },
      { title: '😩 Monday Is a Sentient Entity That Feeds on Joy', body: 'Monday is alive. It absorbs the happiness stored over the weekend and converts it into existential dread. Sunday evening anxiety? That\'s Monday warming up its straws.', evidence: 'Evidence: Everyone is happy on Friday and miserable on Monday. Energy doesn\'t disappear. It\'s consumed.', cred: 'Credibility: 7/10 — thermodynamics checks out (it doesn\'t)' },
      { title: '😩 There Are Actually Two Mondays Per Week', body: 'What you think is Tuesday is actually Monday 2. Wednesday is the real Tuesday. By Thursday it\'s actually Wednesday, and Friday is just Thursday wearing a disguise. The weekend is a lie.', evidence: 'Evidence: "Is it Friday yet?" is asked on every day of the week. Because it\'s never actually close.', cred: 'Credibility: 3/10 — but it explains a lot about my calendar' }
    ],
    fridges: [
      { title: '🧊 Your Fridge Light Never Actually Turns Off', body: 'The fridge light stays on. It has to — how else would the fridge read your shopping list and report it to supermarkets? The "click" when you close the door is the fridge pretending to sleep.', evidence: 'Evidence: Have you ever ACTUALLY been inside a closed fridge to check? Exactly.', cred: 'Credibility: 4/10 — Big Fridge doesn\'t want you to know' },
      { title: '🧊 Fridges Judge You Based on Contents', body: 'Smart fridges were just the first to admit it. Every fridge judges its owner. Three takeaways and a wilting lettuce? That\'s a 2-star fridge rating. The hum gets louder when it\'s disappointed.', evidence: 'Evidence: Fridges hum louder at night. That\'s them gossiping about you to the freezer.', cred: 'Credibility: 6/10 — the freezer is definitely the snitch of the kitchen' },
      { title: '🧊 Fridges Slowly Move When You\'re Not Looking', body: 'Your fridge is 2cm to the left of where you think it is. It moves in tiny increments when you\'re asleep. In 47 years it will have reached the living room. This is the fridge\'s migration pattern.', evidence: 'Evidence: Fridges are always slightly harder to reach than you remember. Always.', cred: 'Credibility: 2/10 — but I\'m measuring mine tomorrow' }
    ],
    stairs: [
      { title: '🪜 Stairs Have a Secret Extra Step', body: 'Every staircase has one phantom step that only appears when you\'re not looking. That moment when you think there\'s one more step at the bottom? There WAS. It retracted.', evidence: 'Evidence: Everyone has experienced the "phantom step" stumble. The stairs are gaslighting you.', cred: 'Credibility: 8/10 — I will die on this hill (after missing the last step)' },
      { title: '🪜 Stairs Are a Government Fitness Test', body: 'Every staircase is secretly a government fitness assessment. The number of steps you take before getting tired determines your health insurance premium. Elevators are the opt-out.', evidence: 'Evidence: Buildings with more stairs have lower insurance rates. (They don\'t, but they should.)', cred: 'Credibility: 3/10 — take the stairs, beat the system' },
      { title: '🪜 Going Downstairs Is Actually Time Travel', body: 'Each step down moves you 0.003 seconds into the past. Going up moves you forward. This is why basements feel "older" and penthouses feel "futuristic." Architects know this.', evidence: 'Evidence: Basements always have that "old" smell. Time travel residue.', cred: 'Credibility: 1/10 — but I\'m going to the basement to meet my younger self' }
    ],
    bubbles: [
      { title: '🫧 Bubbles Are Spy Cameras From the Future', body: 'Every soap bubble contains a tiny camera from 2087. They\'re sent back to document our era for historical records. When they pop, the data is transmitted. This is why kids blow bubbles — they\'re child agents.', evidence: 'Evidence: Bubbles always float toward your face. They\'re getting a better angle.', cred: 'Credibility: 4/10 — the future is very interested in your bathroom' },
      { title: '🫧 Each Bubble Contains a Tiny Universe', body: 'When you blow a bubble, you\'re creating a universe. When it pops, that universe ends. You are a god of destruction. Every birthday party is a genocide of universes. Think about that.', evidence: 'Evidence: The iridescent colours are galaxies forming. The wobble is the Big Bang.', cred: 'Credibility: 5/10 — existentially devastating if true' },
      { title: '🫧 Bubbles Are How Fish Communicate With the Surface', body: 'Fish blow bubbles to send messages to humans. We just can\'t read them. Every fish tank is a fish screaming into the void. The bubbles that reach the surface carry fish opinions about us.', evidence: 'Evidence: Fish blow more bubbles when you\'re watching. They\'re trying to tell you something.', cred: 'Credibility: 3/10 — my goldfish has been trying to reach me about my car\'s extended warranty' }
    ],
    mirrors: [
      { title: '🪞 Mirror You Is the Real You, and You\'re the Reflection', body: 'You are the reflection. The mirror version is the original. This is why you look different in photos — the camera captures the REAL you, and you don\'t recognise them because you\'ve been living backwards.', evidence: 'Evidence: Mirror-you and photo-you look different. One of them is lying. It\'s you.', cred: 'Credibility: 6/10 — I\'m not ready for this conversation' },
      { title: '🪞 Mirrors Have a 0.3 Second Delay', body: 'Mirrors actually show you 0.3 seconds in the past. This is why you can never quite catch yourself blinking. The delay is to prevent a feedback loop that would crash reality.', evidence: 'Evidence: Try to catch yourself blinking. You can\'t. The mirror is buffering.', cred: 'Credibility: 7/10 — I\'ve been trying to blink-catch for 10 minutes' },
      { title: '🪞 Every Mirror Has a Different Version of You', body: 'Each mirror renders you slightly differently based on its manufacturing date. Older mirrors show you with more gravitas. Cheap mirrors show you with less confidence. Antique mirrors show you in period costume.', evidence: 'Evidence: You always look different in different mirrors. They\'re not consistent. Suspicious.', cred: 'Credibility: 4/10 — explains dressing room mirrors being the worst' }
    ],
    traffic: [
      { title: '🚦 Traffic Lights Are a Social Experiment', body: 'Traffic lights were invented to study human patience. The yellow light was added specifically to create maximum anxiety. The experiment was supposed to end in 1967 but they forgot to stop it.', evidence: 'Evidence: Yellow lights are exactly long enough to make you question every decision you\'ve ever made.', cred: 'Credibility: 5/10 — the anxiety is definitely by design' },
      { title: '🚦 Red Lights Are Longer When You\'re Late', body: 'Traffic lights are connected to your calendar. When you\'re running late, they extend the red phase by 12%. When you\'re early, you get all greens. The system rewards punctuality.', evidence: 'Evidence: You always hit every red light when late. ALWAYS. The math doesn\'t lie.', cred: 'Credibility: 8/10 — I will not be taking questions at this time' },
      { title: '🚦 Traffic Lights Communicate With Each Other in Morse Code', body: 'When all the lights on a road turn red at once, they\'re having a group meeting. The patterns aren\'t random — they\'re discussing you specifically. "Should we let this one through?" "Nah, red again."', evidence: 'Evidence: Sometimes you hit green after green. That\'s the lights being nice. They chose you.', cred: 'Credibility: 3/10 — the lights are definitely talking about us' }
    ]
  };

  window.conspgenGenerate = function() {
    var topic = document.getElementById('conspgen-topic').value;
    var pool = conspgenTheories[topic];
    var pick = pool[Math.floor(Math.random() * pool.length)];

    document.getElementById('conspgen-title-out').textContent = pick.title;
    document.getElementById('conspgen-body').textContent = pick.body;
    document.getElementById('conspgen-evidence').innerHTML = '🔎 <strong>' + pick.evidence + '</strong>';
    document.getElementById('conspgen-credibility').innerHTML = '📊 ' + pick.cred;
    document.getElementById('conspgen-result').style.display = 'block';

    conspgenCount++;
    document.getElementById('conspgen-count').innerHTML = '🕵️ You\'ve uncovered <strong>' + conspgenCount + '</strong> truth' + (conspgenCount > 1 ? 's' : '') + '.' + (conspgenCount > 5 ? ' <span style="color:#ff4d4d;">Big Brother is watching.</span>' : '');
  };
})();
</script>
