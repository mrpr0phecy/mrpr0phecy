<!-- cards/mrprophecy-studio-defender.html -->
<h2 id="mpsd-title" style="margin-top:0;color:var(--accent);">🛡️ MrProphecy: Studio Defender</h2>

<p id="mpsd-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
  Bad takes rain down on the studio &mdash; pop them before they land. Waves get faster. Real MrProphecy tracks play once you start.
</p>

<div style="position:relative;">
  <canvas id="mpsd-cv" width="600" height="330" style="width:100%;height:auto;display:block;background:#070c14;border:1px solid rgba(255,255,255,0.12);border-radius:10px;touch-action:none;cursor:crosshair;"></canvas>
  <div id="mpsd-ov" style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,8,14,.8);border-radius:10px;text-align:center;padding:16px;">
    <div>
      <div style="font-size:1.1rem;font-weight:900;color:var(--accent);margin-bottom:6px;">STUDIO DEFENDER</div>
      <div class="small" style="color:var(--text-secondary);margin-bottom:12px;">Bad takes are falling on the studio. Click or tap them before they land.</div>
      <button type="button" id="mpsd-start" style="background:var(--accent);color:#04141c;border:0;padding:11px 26px;border-radius:100px;font-weight:800;cursor:pointer;">&#9654; Defend</button>
    </div>
  </div>
</div>
<div style="display:flex;gap:16px;margin-top:8px;font-size:0.8rem;color:var(--text-secondary);flex-wrap:wrap;">
  <span>Score <b id="mpsd-score" style="color:var(--text);">0</b></span>
  <span>Wave <b id="mpsd-wave" style="color:var(--text);">1</b></span>
  <span>Studio <b id="mpsd-hp" style="color:var(--success);">100%</b></span>
</div>

  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);">
    <button type="button" id="mpsd-mute" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);padding:6px 12px;border-radius:100px;font-size:0.75rem;font-weight:700;cursor:pointer;">&#128266; Music on</button>
    <button type="button" id="mpsd-skip" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);padding:6px 12px;border-radius:100px;font-size:0.75rem;font-weight:700;cursor:pointer;">&#9197; Next track</button>
    <span id="mpsd-track" class="small" style="color:var(--text-secondary);font-size:0.75rem;"></span>
    <a href="https://www.youtube.com/@MrProphecy?sub_confirmation=1" target="_blank" rel="noopener noreferrer" style="margin-left:auto;font-size:0.72rem;color:var(--accent);text-decoration:none;font-weight:700;">Music by MrProphecy &#8599;</a>
  </div>

<script>
(function () {
  'use strict';

  /* ---- MrProphecy audio bed -------------------------------------------
     A hidden YouTube IFrame player. The API script is not even injected
     until the player first starts, so the card costs nothing until played
     and no third-party request is made on page load.                   */
  var mpsdTRACKS = [{"id": "U7OknSZ6iGE", "n": "Invasion"}, {"id": "U1NjAln59-g", "n": "Inferno"}, {"id": "9wzx-JG0WKk", "n": "Infiltrate"}, {"id": "_qJBx_J_FKE", "n": "Instinct"}];
  var mpsdyt = null, mpsdytReady = false, mpsdpending = false, mpsdti = 0, mpsdmuted = false;

  function mpsdbootAudio() {
    if (mpsdyt || document.getElementById('mpsd-ytwrap')) return;
    var w = document.createElement('div');
    w.id = 'mpsd-ytwrap';
    w.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;overflow:hidden;';
    var d = document.createElement('div'); d.id = 'mpsd-ythost';
    w.appendChild(d); document.body.appendChild(w);

    function make() {
      mpsdyt = new YT.Player('mpsd-ythost', {
        host: 'https://www.youtube-nocookie.com',
        width: 1, height: 1,
        videoId: mpsdTRACKS[mpsdti].id,
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, playsinline: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: function (e) {
            mpsdytReady = true;
            e.target.setVolume(38);
            if (mpsdpending) { mpsdpending = false; e.target.playVideo(); }
            mpsdlabel();
          },
          onStateChange: function (e) { if (e.data === YT.PlayerState.ENDED) mpsdnextTrack(); },
          onError: function () { mpsdnextTrack(); }
        }
      });
    }
    if (window.YT && window.YT.Player) { make(); return; }
    var prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function () { if (typeof prev === 'function') prev(); make(); };
    if (!document.querySelector('script[src*="youtube.com/iframe_api"]')) {
      var sc = document.createElement('script');
      sc.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(sc);
    }
  }
  function mpsdlabel() {
    var el = document.getElementById('mpsd-track');
    if (el) el.textContent = mpsdmuted ? 'muted' : ('\u266a ' + mpsdTRACKS[mpsdti].n);
  }
  function mpsdmusicOn() {
    if (mpsdmuted) return;
    mpsdbootAudio();
    if (mpsdytReady && mpsdyt) mpsdyt.playVideo(); else mpsdpending = true;
  }
  function mpsdmusicOff() {
    mpsdpending = false;
    if (mpsdytReady && mpsdyt) try { mpsdyt.pauseVideo(); } catch (e) {}
  }
  function mpsdnextTrack() {
    mpsdti = (mpsdti + 1) % mpsdTRACKS.length;
    if (mpsdytReady && mpsdyt) { mpsdyt.loadVideoById(mpsdTRACKS[mpsdti].id); }
    mpsdlabel();
  }
  function mpsdtoggleMute() {
    mpsdmuted = !mpsdmuted;
    var b = document.getElementById('mpsd-mute');
    if (b) b.textContent = mpsdmuted ? '\ud83d\udd07 Music off' : '\ud83d\udd0a Music on';
    if (mpsdmuted) mpsdmusicOff(); else if (mpsdrunning) mpsdmusicOn();
    mpsdlabel();
  }


  var cv = document.getElementById('mpsd-cv'), cx = cv.getContext('2d');
  var W = 600, H = 330, mpsdrunning = false, raf = null, t0 = 0;
  var drops = [], pops = [], mpsdscore = 0, hp = 100, wave = 1, spawn = 0, elapsed = 0;
  var WORDS = ['off-beat','flat','mistimed','clipping','bad mix','out of key','rushed','muddy'];

  function reset() { drops = []; pops = []; mpsdscore = 0; hp = 100; wave = 1; spawn = 0; elapsed = 0; }
  function sync() {
    document.getElementById('mpsd-score').textContent = mpsdscore;
    document.getElementById('mpsd-wave').textContent = wave;
    var e = document.getElementById('mpsd-hp');
    e.textContent = Math.max(0, Math.round(hp)) + '%';
    e.style.color = hp > 60 ? 'var(--success)' : hp > 30 ? 'var(--premium)' : 'var(--error)';
  }
  function hitAt(x, y) {
    if (!mpsdrunning) return;
    for (var i = drops.length - 1; i >= 0; i--) {
      var d = drops[i];
      if (Math.abs(d.x - x) < d.r + 12 && Math.abs(d.y - y) < d.r + 12) {
        drops.splice(i, 1); mpsdscore += 10 * wave;
        for (var k = 0; k < 10; k++) pops.push({ x: d.x, y: d.y, vx: (Math.random()-.5)*6, vy: (Math.random()-.5)*6, l: 20 });
        sync(); return;
      }
    }
  }
  function loop(ts) {
    if (!mpsdrunning) return;
    if (!t0) t0 = ts;
    var dt = Math.min(2.5, (ts - t0) / 16.7); t0 = ts;
    elapsed += dt; wave = 1 + Math.floor(elapsed / 380);
    spawn -= dt;
    if (spawn <= 0) {
      drops.push({ x: 34 + Math.random() * (W - 68), y: -20, r: 17 + Math.random() * 8,
                    v: .85 + Math.random() * .5 + wave * .17, w: WORDS[Math.floor(Math.random() * WORDS.length)] });
      spawn = Math.max(18, 52 - wave * 4);
    }
    cx.clearRect(0, 0, W, H);
    var g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#070c14'); g.addColorStop(1, '#101b2c');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);

    cx.fillStyle = '#16324a'; cx.fillRect(0, H - 34, W, 34);
    cx.fillStyle = '#2dd4ff'; cx.fillRect(0, H - 36, W * (Math.max(0, hp) / 100), 3);
    cx.fillStyle = '#ffc93c'; cx.beginPath(); cx.arc(W / 2, H - 34, 15, Math.PI, 0); cx.fill();
    cx.fillStyle = '#04141c'; cx.fillRect(W / 2 - 6, H - 42, 3, 3); cx.fillRect(W / 2 + 3, H - 42, 3, 3);

    for (var i = drops.length - 1; i >= 0; i--) {
      var d = drops[i]; d.y += d.v * dt;
      if (d.y > H - 42) { drops.splice(i, 1); hp -= 9; sync(); if (hp <= 0) return over(); continue; }
      cx.fillStyle = 'rgba(255,46,99,.9)'; cx.beginPath(); cx.arc(d.x, d.y, d.r, 0, 6.284); cx.fill();
      cx.fillStyle = '#fff'; cx.font = 'bold 9px system-ui'; cx.textAlign = 'center';
      cx.fillText(d.w, d.x, d.y + 3);
    }
    for (var p = pops.length - 1; p >= 0; p--) {
      var q = pops[p]; q.x += q.vx; q.y += q.vy; q.l--;
      if (q.l <= 0) { pops.splice(p, 1); continue; }
      cx.globalAlpha = q.l / 20; cx.fillStyle = '#ffc93c'; cx.fillRect(q.x, q.y, 3, 3); cx.globalAlpha = 1;
    }
    raf = requestAnimationFrame(loop);
  }
  function over() {
    mpsdrunning = false; if (raf) cancelAnimationFrame(raf); mpsdmusicOff();
    var ov = document.getElementById('mpsd-ov'); ov.style.display = 'grid';
    ov.querySelector('div').innerHTML =
      '<div style="font-size:1.1rem;font-weight:900;color:var(--error);margin-bottom:6px;">STUDIO OVERRUN</div>' +
      '<div class="small" style="color:var(--text-secondary);margin-bottom:12px;">Score ' + mpsdscore + ' &middot; reached wave ' + wave + '</div>' +
      '<button type="button" id="mpsd-start" style="background:var(--accent);color:#04141c;border:0;padding:11px 26px;border-radius:100px;font-weight:800;cursor:pointer;">&#8635; Again</button>';
    ov.querySelector('#mpsd-start').addEventListener('click', start);
  }
  function start() {
    document.getElementById('mpsd-ov').style.display = 'none';
    reset(); sync(); mpsdrunning = true; t0 = 0; mpsdmusicOn();
    raf = requestAnimationFrame(loop);
  }
  document.getElementById('mpsd-start').addEventListener('click', start);
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var r = cv.getBoundingClientRect();
    hitAt((e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height));
  });


  document.getElementById('mpsd-mute').addEventListener('click', mpsdtoggleMute);
  document.getElementById('mpsd-skip').addEventListener('click', function () {
    mpsdnextTrack();
    if (mpsdrunning && !mpsdmuted) mpsdmusicOn();
  });
  mpsdlabel();

})();
</script>
