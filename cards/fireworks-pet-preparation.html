<h2 id="fwpp-title" style="margin-top:0;color:var(--accent);">🐾 Fireworks Pet Preparation</h2>
<div id="fwpp-root">
  <p id="fwpp-desc" class="small">Make a calm, practical plan for pets before the bangs begin.</p>
  <p class="fwpp-note">Every animal is different; do not force a frightened pet out of its hiding place.</p><div class="fwpp-panel"><label class="fwpp-item"><input type="checkbox"> <span>Ask your vet early about a pet with severe noise anxiety; do not give unprescribed medication.</span></label>
<label class="fwpp-item"><input type="checkbox"> <span>Walk dogs and bring cats indoors before dark where possible.</span></label>
<label class="fwpp-item"><input type="checkbox"> <span>Check doors, windows and escape routes; make sure microchip contact details are current.</span></label>
<label class="fwpp-item"><input type="checkbox"> <span>Prepare a quiet familiar hiding place and let your pet choose whether to use it.</span></label>
<label class="fwpp-item"><input type="checkbox"> <span>Close curtains and windows; use familiar background sound if it helps.</span></label>
<label class="fwpp-item"><input type="checkbox"> <span>Provide water and familiar bedding; stay calm and allow your pet space.</span></label>
<label class="fwpp-item"><input type="checkbox"> <span>Consider outdoor animals and livestock; seek species-specific advice and warn neighbours.</span></label></div>
    <p id="fwpp-progress" class="fwpp-result" aria-live="polite"></p><button type="button" id="fwpp-reset">Clear ticks</button>
  <p class="fwpp-note">Reference: <a href="https://www.rspca.org.uk/local/oxfordshire-branch/latest/detail?newsTitle=pets-and-fireworks&amp;newsId=9593">RSPCA: pets and fireworks</a>.</p>
  <p class="fwpp-note">More for the night: <a href="/tool/fireworks-night-checklist.html">event checklist</a> · <a href="/tool/fireworks-pet-preparation.html">pets</a> · <a href="/tool/fireworks-burn-first-aid.html">burn first aid</a> · <a href="/tool/fireworks-night-budget.html">budget</a></p>
  <style>
#fwpp-root {color:var(--text);}
#fwpp-root .fwpp-panel {background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:16px;margin:14px 0;}
#fwpp-root .fwpp-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;}
#fwpp-root label {display:block;line-height:1.45;}
#fwpp-root input:not([type=checkbox]), #fwpp-root select {box-sizing:border-box;width:100%;margin-top:5px;padding:10px;border-radius:8px;border:1px solid #64748b;background:#101a28;color:#fff;font:inherit;}
#fwpp-root input[type=checkbox] {width:18px;height:18px;flex:none;accent-color:#f59e0b;}
#fwpp-root .fwpp-item {display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.1);}
#fwpp-root button {background:#fbbf24;color:#111827;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;margin:8px 8px 0 0;}
#fwpp-root button:focus-visible, #fwpp-root input:focus-visible, #fwpp-root select:focus-visible {outline:3px solid #fbbf24;outline-offset:2px;}
#fwpp-root .fwpp-result {white-space:pre-line;line-height:1.6;}
#fwpp-root .fwpp-note {font-size:.88rem;color:var(--text-secondary);line-height:1.5;}
#fwpp-root a {color:var(--accent);}
</style>
</div>
<script>
(function() {
  'use strict';
  function init() {
    const root = document.getElementById('fwpp-root');
    if (!root || root.dataset.ready) return;
    root.dataset.ready = 'true';
    const boxes = Array.from(root.querySelectorAll('input[type="checkbox"]'));
    const progress = root.querySelector('#fwpp-progress');
    function update() { progress.textContent = boxes.filter(b => b.checked).length + ' of ' + boxes.length + ' checked'; }
    boxes.forEach(b => b.addEventListener('change', update));
    root.querySelector('#fwpp-reset').addEventListener('click', () => { boxes.forEach(b => b.checked = false); update(); });
    update();
  }
  init();
})();
</script>
