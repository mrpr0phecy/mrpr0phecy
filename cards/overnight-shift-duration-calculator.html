<h2 id="osdc-title" style="margin-top:0;color:var(--accent);">🌙 Overnight Shift Duration</h2>

<form aria-describedby="osdc-desc" onsubmit="event.preventDefault();">
  <p id="osdc-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Work out how long a shift is when it crosses midnight, plus unpaid breaks and overtime after a threshold. Built for night staff, on-call rotas and timesheets — not a payroll system.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="osdc-start" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Start</label>
      <input id="osdc-start" type="time" value="21:30" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="osdc-end" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">End</label>
      <input id="osdc-end" type="time" value="07:00" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="osdc-break" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Unpaid break (min)</label>
      <input id="osdc-break" type="number" min="0" value="30" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="osdc-ot" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Overtime after (h)</label>
      <input id="osdc-ot" type="number" min="0" step="0.25" value="8" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="osdc-rate" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Hourly rate (optional)</label>
      <input id="osdc-rate" type="number" min="0" step="0.01" placeholder="e.g. 14.50" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="osdc-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };

  function minutes(str) {
    if (!str) return null;
    var p = str.split(':');
    return Number(p[0]) * 60 + Number(p[1]);
  }
  function fmt(min) {
    var sign = min < 0 ? '-' : '';
    min = Math.abs(Math.round(min));
    return sign + Math.floor(min / 60) + ' h ' + (min % 60) + ' min';
  }
  function run() {
    var a = minutes($('osdc-start').value), b = minutes($('osdc-end').value);
    if (a == null || b == null) return;
    var span = b - a;
    if (span <= 0) span += 24 * 60;
    var unpaid = Number($('osdc-break').value) || 0;
    var paid = Math.max(0, span - unpaid);
    var thresh = (Number($('osdc-ot').value) || 0) * 60;
    var ot = Math.max(0, paid - thresh);
    var straight = paid - ot;
    var rate = Number($('osdc-rate').value);
    var pay = isFinite(rate) && rate > 0 ? (straight / 60) * rate + (ot / 60) * rate * 1.5 : null;
    $('osdc-out').innerHTML =
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;">' +
      cell('Clocked', fmt(span), span >= 12 * 60) +
      cell('Paid', fmt(paid), false) +
      cell('Straight time', fmt(straight), false) +
      cell('Overtime', fmt(ot), ot > 0) +
      (pay != null ? cell('Pay @ 1.5× OT', pay.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }), false) : '') +
      '</div>' +
      '<p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">' +
      (span > 24 * 60 - 1 ? '' : (b <= a ? 'End is treated as the next calendar day. ' : '')) +
      'Overtime rate assumes time-and-a-half after the threshold; contracts differ.</p>';
  }
  function cell(k, v, warn) {
    return '<div style="padding:12px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid ' + (warn ? 'rgba(255,215,0,.45)' : 'rgba(45,212,255,.25)') + ';"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-size:1.1rem;font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  ['osdc-start', 'osdc-end', 'osdc-break', 'osdc-ot', 'osdc-rate'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
