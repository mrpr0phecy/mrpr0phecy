<h2 id="spfe-title" style="margin-top:0;color:var(--accent);">💳 Stripe &amp; PayPal Fee Calculator</h2>

<form aria-describedby="spfe-desc" onsubmit="event.preventDefault();">
  <p id="spfe-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Reverse a published percentage + pence fee so you know what you keep, or what to charge to net a target. Default rates are the common UK consumer-card / PayPal numbers — your contract may differ.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="spfe-mode" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">I want to</label>
      <select id="spfe-mode" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="keep">See what I keep from a charge</option>
        <option value="gross">Gross up so I keep a target</option>
      </select>
    </div>
    <div>
      <label for="spfe-amt" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Amount £</label>
      <input id="spfe-amt" type="number" min="0" step="any" value="50" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="spfe-pct" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Fee %</label>
      <input id="spfe-pct" type="number" min="0" step="any" value="1.5" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="spfe-fix" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Fixed fee pence</label>
      <input id="spfe-fix" type="number" min="0" step="any" value="20" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
  <div id="spfe-presets" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"></div>
</form>
<div id="spfe-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var presets = [
    ['Stripe UK 1.5% + 20p', 1.5, 20],
    ['Stripe EEA 2.5% + 20p', 2.5, 20],
    ['PayPal 2.9% + 30p', 2.9, 30],
    ['PayPal micropay 5% + 5p', 5, 5]
  ];
  presets.forEach(function (p) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = p[0];
    b.style.cssText = 'padding:7px 10px;border-radius:999px;border:1px solid rgba(45,212,255,.35);background:rgba(45,212,255,.08);color:var(--accent);font-size:.75rem;font-weight:700;cursor:pointer;min-height:36px;';
    b.addEventListener('click', function () {
      $('spfe-pct').value = p[1];
      $('spfe-fix').value = p[2];
      run();
    });
    $('spfe-presets').appendChild(b);
  });
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function gbp(n) {
    return '£' + n.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function run() {
    var amt = Number($('spfe-amt').value), pct = Number($('spfe-pct').value) / 100, fix = Number($('spfe-fix').value) / 100;
    var mode = $('spfe-mode').value;
    if (!(amt >= 0) || !(pct >= 0) || !(fix >= 0)) {
      $('spfe-out').textContent = 'Enter an amount and a fee.';
      return;
    }
    var charge, fee, keep;
    if (mode === 'keep') {
      charge = amt;
      fee = charge * pct + fix;
      keep = charge - fee;
    } else {
      if (pct >= 1) {
        $('spfe-out').textContent = 'Fee % must be under 100.';
        return;
      }
      keep = amt;
      charge = (keep + fix) / (1 - pct);
      fee = charge - keep;
    }
    $('spfe-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Customer pays', gbp(charge)) +
      cell('Processor fee', gbp(fee)) +
      cell('You keep', gbp(keep)) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Formula: fee = charge × % + fixed. To net K, charge = (K + fixed) ÷ (1 − %). FX, refunds and interchange-plus contracts are not modelled.</p>';
  }
  ['spfe-mode', 'spfe-amt', 'spfe-pct', 'spfe-fix'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
