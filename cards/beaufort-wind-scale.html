<h2 id="beau-title" style="margin-top:0;color:var(--accent);">🌬️ Beaufort Wind Scale</h2>

<form aria-describedby="beau-desc" onsubmit="event.preventDefault();">
  <p id="beau-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Convert wind speed to a Beaufort force (0–12) using the Met Office mean-speed bands. Force is a class, not a precision instrument. Gusts can sit a force higher than the mean.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="beau-unit" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">I have</label>
      <select id="beau-unit" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="mph">mph</option>
        <option value="kt">knots</option>
        <option value="ms">m/s</option>
        <option value="kmh">km/h</option>
        <option value="force">Beaufort force</option>
      </select>
    </div>
    <div>
      <label for="beau-v" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Value</label>
      <input id="beau-v" type="number" min="0" step="any" value="25" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="beau-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var table = [
    [0, 0, 1, 'Calm'],
    [1, 1, 3, 'Light air'],
    [2, 4, 7, 'Light breeze'],
    [3, 8, 12, 'Gentle breeze'],
    [4, 13, 18, 'Moderate breeze'],
    [5, 19, 24, 'Fresh breeze'],
    [6, 25, 31, 'Strong breeze'],
    [7, 32, 38, 'Near gale'],
    [8, 39, 46, 'Gale'],
    [9, 47, 54, 'Strong gale'],
    [10, 55, 63, 'Storm'],
    [11, 64, 72, 'Violent storm'],
    [12, 73, 999, 'Hurricane']
  ];
  function toMph(v, unit) {
    if (unit === 'mph') return v;
    if (unit === 'kt') return v * 1.15078;
    if (unit === 'ms') return v * 2.23694;
    if (unit === 'kmh') return v * 0.621371;
    return v;
  }
  function forceFromMph(mph) {
    for (var i = 0; i < table.length; i++) {
      if (mph <= table[i][2] || i === table.length - 1) return table[i];
    }
    return table[table.length - 1];
  }
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var unit = $('beau-unit').value, v = Number($('beau-v').value);
    if (!(v >= 0) || !isFinite(v)) {
      $('beau-out').textContent = 'Enter a wind speed or force.';
      return;
    }
    var row;
    var mph;
    if (unit === 'force') {
      var f = Math.round(v);
      if (f < 0) f = 0; if (f > 12) f = 12;
      row = table[f];
      mph = (row[1] + Math.min(row[2], 80)) / 2;
    } else {
      mph = toMph(v, unit);
      row = forceFromMph(mph);
    }
    $('beau-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Force', row[0] + ' — ' + row[3]) +
      cell('Band (mean mph)', row[1] + '–' + (row[2] === 999 ? '73+' : row[2]) + ' mph') +
      cell('Your speed', mph.toFixed(1) + ' mph / ' + (mph / 1.15078).toFixed(1) + ' kt / ' + (mph / 2.23694).toFixed(1) + ' m/s') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Met Office land descriptions: force 6 makes umbrellas awkward; 8 breaks twigs; 10 uproots trees. Marine forecasts still quote Beaufort. This is not a shipping forecast.</p>';
  }
  $('beau-unit').addEventListener('change', run);
  $('beau-v').addEventListener('input', run);
  run();
})();
</script>
