<h2 id="bfmx-title" style="margin-top:0;color:var(--accent);">🍼 Baby Formula Mixing</h2>

<form aria-describedby="bfmx-desc" onsubmit="event.preventDefault();">
  <p id="bfmx-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Most UK powders use 1 level scoop per 30 ml of water (check the tin). Water first, then powder. This is arithmetic — NHS mixing and sterilising steps still apply, and never microwave a bottle.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="bfmx-feed" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Feed size (ml)</label>
      <input id="bfmx-feed" type="number" min="30" step="30" value="150" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="bfmx-n" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Feeds per day</label>
      <input id="bfmx-n" type="number" min="1" max="12" value="6" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="bfmx-ratio" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">ml water per scoop</label>
      <input id="bfmx-ratio" type="number" min="20" max="60" value="30" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="bfmx-g" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Grams per scoop</label>
      <input id="bfmx-g" type="number" min="2" max="10" step="any" value="4.3" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="bfmx-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var feed = Number($('bfmx-feed').value), n = Number($('bfmx-n').value);
    var ratio = Number($('bfmx-ratio').value), g = Number($('bfmx-g').value);
    if (!(feed > 0 && n > 0 && ratio > 0 && g > 0)) return;
    var scoops = feed / ratio;
    var dayMl = feed * n;
    var dayScoops = scoops * n;
    var dayG = dayScoops * g;
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('bfmx-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('This bottle', Math.round(scoops) + ' scoops + ' + feed + ' ml water') +
      cell('Powder this bottle', (scoops * g).toFixed(1) + ' g') +
      cell('Per day', dayMl + ' ml · ' + dayScoops.toFixed(0) + ' scoops') +
      cell('Tin use / day', dayG.toFixed(0) + ' g  (~' + (800 / dayG).toFixed(1) + ' days from an 800 g tin)') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Level scoops, do not pack. Made-up formula is perishable. If the scoop-to-ml ratio on your tin is not 30, change the box — over-concentrating is dangerous.</p>';
  }
  ['bfmx-feed', 'bfmx-n', 'bfmx-ratio', 'bfmx-g'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
