<h2 id="ml3-title" style="margin-top:0;color:var(--accent);">⚛️ Molecule 3D Viewer</h2>
<p id="ml3-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;">Eleven molecules and crystals as true ball-and-stick 3D — from water to a salt lattice to a diamond unit cell. Bonds are detected automatically from atomic distances, double/triple bonds included. Drag to orbit, scroll to zoom.</p>

<div id="ml3-btns" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;"></div>

<canvas id="ml3-cv" width="600" height="330" style="width:100%;height:330px;background:#04070d;border:1px solid rgba(45,212,255,.3);border-radius:12px;display:block;touch-action:none;cursor:grab;" role="img" aria-label="Rotating 3D molecule"></canvas>

<div style="display:flex;flex-wrap:wrap;gap:14px;margin:10px 0;align-items:center;">
  <label style="font-size:.82rem;color:var(--text-secondary);cursor:pointer;"><input id="ml3-spin" type="checkbox" checked style="accent-color:var(--accent);"> spin</label>
  <label style="font-size:.82rem;color:var(--text-secondary);cursor:pointer;"><input id="ml3-labels" type="checkbox" checked style="accent-color:var(--accent);"> element labels</label>
  <div><label for="ml3-ball" style="font-size:.78rem;color:var(--text-secondary);">Ball size</label> <input id="ml3-ball" type="range" min="60" max="140" value="100" style="width:120px;accent-color:var(--accent);vertical-align:middle;"></div>
</div>

<div style="background:rgba(45,212,255,.05);border:1px solid rgba(45,212,255,.2);border-radius:10px;padding:12px 14px;font-size:.86rem;line-height:1.7;color:var(--text-secondary);">
  <b id="ml3-name" style="color:var(--text);font-size:1rem;"></b> <span id="ml3-formula" style="font-weight:800;color:var(--accent);"></span><br>
  <span id="ml3-meta"></span><br>
  <span id="ml3-fact"></span>
</div>

<script>
(function(){
  function $(id){ return document.getElementById(id); }
  var cv = $("ml3-cv"), ctx = cv.getContext("2d");
  var W = 600, H = 330, DPR = 1;
  function fit(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = Math.round(cv.clientWidth || 600); H = 330;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    render();
  }
  window.addEventListener("resize", fit);
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var spinning = !reduced;
  var EL = {
    H:  { c: "#e8eef5", r: 0.32, m: 1.008 },
    C:  { c: "#8a93a3", r: 0.76, m: 12.011 },
    N:  { c: "#4d7cff", r: 0.71, m: 14.007 },
    O:  { c: "#ff4d4d", r: 0.66, m: 15.999 },
    S:  { c: "#ffd700", r: 1.05, m: 32.06 },
    Na: { c: "#b366ff", r: 1.20, m: 22.99 },
    Cl: { c: "#39d353", r: 1.10, m: 35.45 }
  };
  function ring(el, n, rad, z, hRad){
    var a = [];
    for (var k = 0; k < n; k++) {
      var t = k / n * Math.PI * 2;
      a.push([el, Math.cos(t) * rad, Math.sin(t) * rad, z || 0]);
    }
    if (hRad) for (var j = 0; j < n; j++) {
      var t2 = j / n * Math.PI * 2;
      a.push(["H", Math.cos(t2) * hRad, Math.sin(t2) * hRad, z || 0]);
    }
    return a;
  }
  var T = 1.09 / Math.sqrt(3);
  var MOLS = [
    { id: "h2o", name: "💧 Water", f: "H₂O", fact: "The bent shape (104.5°) makes water polar — the reason it dissolves so much and ice floats.", atoms: [["O",0,0,0],["H",0.758,0.586,0],["H",-0.758,0.586,0]] },
    { id: "co2", name: "💨 Carbon dioxide", f: "CO₂", fact: "Perfectly linear and non-polar — you exhale about 1 kg of it per day.", atoms: [["C",0,0,0],["O",1.16,0,0],["O",-1.16,0,0]], bo: [[0,1,2],[0,2,2]] },
    { id: "o2", name: "🌬️ Oxygen", f: "O₂", fact: "A double bond with two unpaired electrons — liquid oxygen is pale blue and magnetic!", atoms: [["O",0.605,0,0],["O",-0.605,0,0]], bo: [[0,1,2]] },
    { id: "n2", name: "🎈 Nitrogen", f: "N₂", fact: "A triple bond — one of the strongest in chemistry. 78% of every breath you take.", atoms: [["N",0.55,0,0],["N",-0.55,0,0]], bo: [[0,1,3]] },
    { id: "ch4", name: "🔥 Methane", f: "CH₄", fact: "A perfect tetrahedron. Cows belch ~200 g of it daily — it's 80× more potent than CO₂ short-term.", atoms: [["C",0,0,0],["H",T,T,T],["H",T,-T,-T],["H",-T,T,-T],["H",-T,-T,T]] },
    { id: "nh3", name: "🧪 Ammonia", f: "NH₃", fact: "A pyramid that flips inside-out 24 billion times per second — the first maser ran on it.", atoms: [["N",0,0,0],["H",0.94,0,-0.36],["H",-0.47,0.814,-0.36],["H",-0.47,-0.814,-0.36]] },
    { id: "c6h6", name: "💍 Benzene", f: "C₆H₆", fact: "Kekulé dreamt of a snake biting its tail and discovered the ring. The electrons are smeared over all six bonds at once.", atoms: ring("C", 6, 1.39, 0, 2.47), bo: [[0,1,2],[2,3,2],[4,5,2]] },
    { id: "etoh", name: "🍷 Ethanol", f: "C₂H₅OH", fact: "The –OH group hydrogen-bonds with water, so spirits mix. That same group is why it burns at 78°C.", atoms: [["C",0,0,0],["C",1.54,0,0],["O",2.0,1.32,0],["H",2.28,2.22,0],["H",-0.5,0.95,0],["H",-0.5,-0.47,0.82],["H",-0.5,-0.47,-0.82],["H",2.0,-0.55,0.85],["H",2.0,-0.55,-0.85]] },
    { id: "s8", name: "👑 Sulfur crown", f: "S₈", fact: "Eight sulfurs in a puckered crown — this ring is why vulcanised rubber bounces instead of oozing.", atoms: (function(){ var a = []; for (var k = 0; k < 8; k++) { var t = k / 8 * Math.PI * 2; a.push(["S", Math.cos(t) * 2.46, Math.sin(t) * 2.46, (k % 2 ? 0.4 : -0.4)]); } return a; })() },
    { id: "nacl", name: "🧂 Salt crystal", f: "NaCl ×27", fact: "A 3×3×3 chunk of table-salt lattice. Real grains stack these cubes — that's why salt crystals are square.", atoms: (function(){ var a = []; for (var i = 0; i < 3; i++) for (var j = 0; j < 3; j++) for (var k = 0; k < 3; k++) a.push([(i+j+k)%2 ? "Na" : "Cl", (i-1)*2.82, (j-1)*2.82, (k-1)*2.82]); return a; })() },
    { id: "diamond", name: "💎 Diamond chunk", f: "C ×64", fact: "A 2×2×2 block of diamond cells. Every interior carbon grips four neighbours in a tetrahedral vice — the hardest natural atomic arrangement known.", atoms: (function(){ var a = [], f = [[0,0,0],[0,.5,.5],[.5,0,.5],[.5,.5,0]], s = 3.567; for (var cx = 0; cx < 2; cx++) for (var cy = 0; cy < 2; cy++) for (var cz = 0; cz < 2; cz++) for (var q = 0; q < 2; q++) for (var i = 0; i < 4; i++) a.push(["C", (f[i][0]+cx+(q?.25:0))*s, (f[i][1]+cy+(q?.25:0))*s, (f[i][2]+cz+(q?.25:0))*s]); return a; })() }
  ];
  var cur = 0, az = 0.6, el = 0.55, zoom = 1;
  var atoms = [], bonds = [], orderMap = {};
  function loadMol(idx){
    cur = idx;
    var m = MOLS[idx];
    // center
    var cx = 0, cy = 0, cz = 0;
    m.atoms.forEach(function(a){ cx += a[1]; cy += a[2]; cz += a[3]; });
    cx /= m.atoms.length; cy /= m.atoms.length; cz /= m.atoms.length;
    atoms = m.atoms.map(function(a){ return { el: a[0], x: a[1] - cx, y: a[2] - cy, z: a[3] - cz }; });
    // auto-bond by covalent radii
    bonds = [];
    for (var i = 0; i < atoms.length; i++) for (var j = i + 1; j < atoms.length; j++) {
      var d = Math.hypot(atoms[i].x - atoms[j].x, atoms[i].y - atoms[j].y, atoms[i].z - atoms[j].z);
      if (d < (EL[atoms[i].el].r + EL[atoms[j].el].r) * 1.3) bonds.push([i, j]);
    }
    orderMap = {};
    (m.bo || []).forEach(function(b){ orderMap[b[0] + "-" + b[1]] = b[2]; });
    // info
    $("ml3-name").textContent = m.name;
    $("ml3-formula").textContent = m.f;
    $("ml3-fact").textContent = m.fact;
    var counts = {}, mass = 0;
    atoms.forEach(function(a){ counts[a.el] = (counts[a.el] || 0) + 1; mass += EL[a.el].m; });
    var formula = Object.keys(counts).sort().map(function(e){ return e + (counts[e] > 1 ? counts[e] : ""); }).join(" · ");
    $("ml3-meta").innerHTML = "⚛️ " + atoms.length + " atoms (" + formula + ") &nbsp;·&nbsp; 🔗 " + bonds.length + " bonds &nbsp;·&nbsp; ⚖️ " + mass.toFixed(2) + " g/mol";
    var btns = document.querySelectorAll("[data-ml3-m]");
    for (var b = 0; b < btns.length; b++) {
      var on = +btns[b].getAttribute("data-ml3-m") === idx;
      btns[b].style.cssText = "padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:" + (on ? "800" : "600") + ";font-size:.8rem;border:1px solid " + (on ? "rgba(45,212,255,.4)" : "rgba(255,255,255,.16)") + ";background:" + (on ? "rgba(45,212,255,.12)" : "rgba(255,255,255,.05)") + ";color:" + (on ? "var(--accent)" : "var(--text)") + ";";
    }
    render();
  }
  function project(p, SC){
    var ca = Math.cos(az), sa = Math.sin(az);
    var x1 = p[0] * ca - p[2] * sa, z1 = p[0] * sa + p[2] * ca, y1 = p[1];
    var ce = Math.cos(el), se = Math.sin(el);
    var y2 = y1 * ce - z1 * se, z2 = y1 * se + z1 * ce;
    var q = 6 / (6 + z2);
    return [W / 2 + x1 * SC * q * zoom, H / 2 + y2 * SC * q * zoom, z2];
  }
  function shade(hex, f){
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return "rgb(" + Math.round(Math.min(255, r * f)) + "," + Math.round(Math.min(255, g * f)) + "," + Math.round(Math.min(255, b * f)) + ")";
  }
  function render(){
    ctx.fillStyle = "#04070d"; ctx.fillRect(0, 0, W, H);
    if (!atoms.length) return;
    var maxR = 0.001;
    atoms.forEach(function(a){ maxR = Math.max(maxR, Math.hypot(a.x, a.y, a.z) + EL[a.el].r); });
    var SC = Math.min(W, H) * 0.40 / maxR;
    var P = atoms.map(function(a){ return project([a.x, a.y, a.z], SC); });
    var ballK = +$("ml3-ball").value / 100;
    // bonds first (split-coloured half-bonds), then balls, depth ordered
    var items = [];
    bonds.forEach(function(bd){
      items.push({ z: (P[bd[0]][2] + P[bd[1]][2]) / 2, k: "bond", a: bd[0], b: bd[1] });
    });
    atoms.forEach(function(a, i){ items.push({ z: P[i][2], k: "atom", i: i }); });
    items.sort(function(x, y){ return x.z - y.z; });
    ctx.lineCap = "round";
    for (var q = items.length - 1; q >= 0; q--) {
      var it = items[q];
      if (it.k === "bond") {
        var A = P[it.a], B = P[it.b];
        var order = orderMap[it.a + "-" + it.b] || orderMap[it.b + "-" + it.a] || 1;
        var dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1;
        var nx = -dy / L, ny = dx / L;
        var wdt = Math.max(2, SC * 0.16 * ballK);
        for (var o = 0; o < order; o++) {
          var off = (o - (order - 1) / 2) * (wdt + 2.5);
          var ax = A[0] + nx * off, ay = A[1] + ny * off, bx = B[0] + nx * off, by = B[1] + ny * off;
          var mx = (ax + bx) / 2, my = (ay + by) / 2;
          ctx.lineWidth = wdt;
          ctx.strokeStyle = shade(EL[atoms[it.a].el].c, 0.75); ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(mx, my); ctx.stroke();
          ctx.strokeStyle = shade(EL[atoms[it.b].el].c, 0.75); ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(bx, by); ctx.stroke();
        }
      } else {
        var p = P[it.i], e = EL[atoms[it.i].el];
        var r = Math.max(3, SC * e.r * 0.55 * ballK);
        var fogF = Math.max(0.45, 1 - p[2] * 0.08);
        var g = ctx.createRadialGradient(p[0] - r * 0.35, p[1] - r * 0.35, r * 0.1, p[0], p[1], r);
        g.addColorStop(0, shade("#ffffff", 1));
        g.addColorStop(0.35, shade(e.c, Math.min(1.25, fogF + 0.25)));
        g.addColorStop(1, shade(e.c, fogF * 0.55));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, Math.PI * 2); ctx.fill();
        if ($("ml3-labels").checked && r > 8) {
          ctx.fillStyle = "rgba(4,7,13,.85)";
          ctx.font = "800 " + Math.round(r * 0.72) + "px system-ui,sans-serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(atoms[it.i].el, p[0], p[1] + 1);
        }
      }
    }
    ctx.lineCap = "butt";
  }
  $("ml3-btns").innerHTML = MOLS.map(function(m, i){
    return "<button type='button' data-ml3-m='" + i + "'>" + m.name + "</button>";
  }).join("");
  var mb = document.querySelectorAll("[data-ml3-m]");
  for (var mi = 0; mi < mb.length; mi++) (function(b){
    b.addEventListener("click", function(){ loadMol(+b.getAttribute("data-ml3-m")); });
  })(mb[mi]);
  $("ml3-spin").checked = spinning;
  $("ml3-spin").addEventListener("change", function(){ spinning = this.checked; if (spinning) requestAnimationFrame(frame); });
  $("ml3-labels").addEventListener("change", function(){ if (!spinning) render(); });
  $("ml3-ball").addEventListener("input", function(){ if (!spinning) render(); });
  var dragging = false, lx = 0, ly = 0;
  cv.addEventListener("pointerdown", function(e){ dragging = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", function(e){
    if (!dragging) return;
    az += (e.clientX - lx) * 0.009; el = Math.max(-1.4, Math.min(1.4, el + (e.clientY - ly) * 0.007));
    lx = e.clientX; ly = e.clientY;
    if (!spinning) render();
  });
  cv.addEventListener("pointerup", function(){ dragging = false; });
  cv.addEventListener("wheel", function(e){ e.preventDefault(); zoom = Math.max(0.4, Math.min(3, zoom * (e.deltaY > 0 ? 0.93 : 1.07))); if (!spinning) render(); }, { passive: false });
  var last = 0;
  function frame(ts){
    if (!spinning) return;
    var dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
    if (!dragging) az += dt * 0.45;
    render();
    requestAnimationFrame(frame);
  }
  loadMol(0); fit();
  if (spinning) requestAnimationFrame(frame);
})();
</script>
