<h2 id="rndp-title" style="margin-top:0;color:var(--accent);">🎲 Random Number, Dice & Name Picker</h2>

<form aria-describedby="rndp-desc" onsubmit="event.preventDefault();">
  <p id="rndp-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Cryptographically random numbers in any range (with or without repeats), dice rolls in D&amp;D notation like 3d6+2, coin flips, and a fair picker that draws a winner or shuffles a list of names. Nothing is sent anywhere.
  </p>

  <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;" id="rndp-tabs">
    <button type="button" data-rndp-tab="num" style="padding:7px 14px;border-radius:8px;background:rgba(45,212,255,0.2);border:1px solid rgba(45,212,255,0.5);color:var(--accent);font-size:0.8rem;cursor:pointer;">Numbers</button>
    <button type="button" data-rndp-tab="dice" style="padding:7px 14px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.8rem;cursor:pointer;">Dice & coins</button>
    <button type="button" data-rndp-tab="pick" style="padding:7px 14px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.8rem;cursor:pointer;">Name picker</button>
  </div>

  <div id="rndp-num">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px;">
      <div><label for="rndp-min" style="display:block;font-size:0.7rem;color:var(--text-secondary);text-transform:uppercase;">Min</label><input id="rndp-min" type="number" value="1" style="width:100%;padding:8px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);"></div>
      <div><label for="rndp-max" style="display:block;font-size:0.7rem;color:var(--text-secondary);text-transform:uppercase;">Max</label><input id="rndp-max" type="number" value="100" style="width:100%;padding:8px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);"></div>
      <div><label for="rndp-cnt" style="display:block;font-size:0.7rem;color:var(--text-secondary);text-transform:uppercase;">How many</label><input id="rndp-cnt" type="number" value="1" min="1" max="1000" style="width:100%;padding:8px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);"></div>
      <div style="display:flex;flex-direction:column;justify-content:flex-end;gap:4px;font-size:0.78rem;color:var(--text);"><label style="display:flex;gap:5px;align-items:center;"><input type="checkbox" id="rndp-uniq"> No repeats</label><label style="display:flex;gap:5px;align-items:center;"><input type="checkbox" id="rndp-sort"> Sort</label></div>
    </div>
    <button type="button" id="rndp-gen" style="width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,#2dd4ff,#39ff14);border:none;color:#050811;font-weight:800;font-size:1rem;cursor:pointer;margin-bottom:10px;">Generate</button>
    <div id="rndp-numout" aria-live="polite" style="background:rgba(0,0,0,0.35);border:1px solid rgba(45,212,255,0.2);border-radius:12px;padding:16px;text-align:center;font-size:2rem;font-weight:800;color:var(--accent);font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-word;line-height:1.3;min-height:70px;">—</div>
    <div id="rndp-numstat" style="font-size:0.75rem;color:var(--text-secondary);margin-top:6px;text-align:center;"></div>
  </div>

  <div id="rndp-dice" style="display:none;">
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input id="rndp-notation" type="text" value="2d6" placeholder="e.g. 3d6+2, d20, 4d8-1" style="flex:1;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:15px;font-family:ui-monospace,Menlo,Consolas,monospace;">
      <button type="button" id="rndp-roll" style="padding:10px 18px;border-radius:8px;background:rgba(45,212,255,0.2);border:1px solid rgba(45,212,255,0.5);color:var(--accent);font-weight:700;cursor:pointer;">Roll</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;">
      <button type="button" data-rndp-d="1d4" style="padding:5px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.75rem;cursor:pointer;">d4</button>
      <button type="button" data-rndp-d="1d6" style="padding:5px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.75rem;cursor:pointer;">d6</button>
      <button type="button" data-rndp-d="2d6" style="padding:5px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.75rem;cursor:pointer;">2d6</button>
      <button type="button" data-rndp-d="1d8" style="padding:5px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.75rem;cursor:pointer;">d8</button>
      <button type="button" data-rndp-d="1d10" style="padding:5px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.75rem;cursor:pointer;">d10</button>
      <button type="button" data-rndp-d="1d12" style="padding:5px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.75rem;cursor:pointer;">d12</button>
      <button type="button" data-rndp-d="1d20" style="padding:5px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.75rem;cursor:pointer;">d20</button>
      <button type="button" data-rndp-d="1d100" style="padding:5px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.75rem;cursor:pointer;">d100</button>
      <button type="button" data-rndp-d="4d6" style="padding:5px 10px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:0.75rem;cursor:pointer;">4d6 (stat)</button>
      <button type="button" id="rndp-coin" style="padding:5px 10px;border-radius:6px;background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.4);color:#ffd700;font-size:0.75rem;cursor:pointer;">🪙 Flip coin</button>
    </div>
    <div id="rndp-diceout" aria-live="polite" style="background:rgba(0,0,0,0.35);border:1px solid rgba(45,212,255,0.2);border-radius:12px;padding:16px;text-align:center;min-height:70px;">
      <div id="rndp-dicetotal" style="font-size:2.4rem;font-weight:800;color:var(--accent);">—</div>
      <div id="rndp-dicedetail" style="font-size:0.85rem;color:var(--text-secondary);"></div>
    </div>
    <div id="rndp-dicehist" style="font-size:0.75rem;color:var(--text-secondary);margin-top:6px;text-align:center;"></div>
  </div>

  <div id="rndp-pick" style="display:none;">
    <textarea id="rndp-names" rows="6" placeholder="One name per line (or comma-separated)&#10;Alice&#10;Bob&#10;Charlie" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;resize:vertical;margin-bottom:8px;"></textarea>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
      <button type="button" id="rndp-pick1" style="flex:1;padding:12px;border-radius:10px;background:linear-gradient(135deg,#2dd4ff,#9d4edd);border:none;color:#fff;font-weight:800;cursor:pointer;">🎯 Pick a winner</button>
      <button type="button" id="rndp-shuffle" style="padding:12px 16px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-weight:700;cursor:pointer;">🔀 Shuffle</button>
      <input id="rndp-teams" type="number" min="2" max="20" value="2" aria-label="Number of teams" style="width:60px;padding:8px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);">
      <button type="button" id="rndp-split" style="padding:12px 14px;border-radius:10px;background:rgba(57,255,20,0.12);border:1px solid rgba(57,255,20,0.35);color:#39ff14;font-weight:700;cursor:pointer;">Split teams</button>
    </div>
    <label style="font-size:0.78rem;color:var(--text);display:flex;gap:5px;align-items:center;margin-bottom:8px;"><input type="checkbox" id="rndp-remove"> Remove winner from list after picking</label>
    <div id="rndp-pickout" aria-live="polite" style="background:rgba(0,0,0,0.35);border:1px solid rgba(45,212,255,0.2);border-radius:12px;padding:16px;text-align:center;min-height:70px;font-size:1.4rem;font-weight:800;color:var(--accent);white-space:pre-wrap;line-height:1.5;">—</div>
  </div>
</form>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  function rnd(n){ // uniform int in [0,n)
    if(window.crypto&&crypto.getRandomValues&&n>0){ var lim=Math.floor(4294967296/n)*n, a=new Uint32Array(1); do{ crypto.getRandomValues(a); }while(a[0]>=lim); return a[0]%n; }
    return Math.floor(Math.random()*n);
  }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=rnd(i+1), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  // tabs
  $('rndp-tabs').addEventListener('click',function(e){ var b=e.target.closest('[data-rndp-tab]'); if(!b) return; var t=b.getAttribute('data-rndp-tab');
    ['num','dice','pick'].forEach(function(k){ $('rndp-'+k).style.display=k===t?'':'none'; });
    Array.prototype.forEach.call(this.querySelectorAll('button'),function(x){ var on=x===b; x.style.background=on?'rgba(45,212,255,0.2)':'rgba(255,255,255,0.06)'; x.style.borderColor=on?'rgba(45,212,255,0.5)':'rgba(255,255,255,0.15)'; x.style.color=on?'var(--accent)':'var(--text)'; }); });
  // numbers
  $('rndp-gen').addEventListener('click',function(){
    var mn=parseInt($('rndp-min').value,10), mx=parseInt($('rndp-max').value,10), c=Math.max(1,Math.min(1000,parseInt($('rndp-cnt').value,10)||1));
    if(isNaN(mn)||isNaN(mx)){ $('rndp-numout').textContent='Enter min and max'; return; }
    if(mn>mx){ var t=mn; mn=mx; mx=t; }
    var span=mx-mn+1, res=[];
    if($('rndp-uniq').checked){ if(c>span){ $('rndp-numout').style.fontSize='1rem'; $('rndp-numout').textContent='Only '+span+' unique values exist in that range.'; return; }
      if(span<=100000){ var pool=[]; for(var i=0;i<span;i++) pool.push(mn+i); shuffle(pool); res=pool.slice(0,c); } else { var seen={}; while(res.length<c){ var v=mn+rnd(span); if(!seen[v]){ seen[v]=1; res.push(v); } } } }
    else { for(var k=0;k<c;k++) res.push(mn+rnd(span)); }
    if($('rndp-sort').checked) res.sort(function(a,b){return a-b;});
    $('rndp-numout').style.fontSize= c===1?'2.6rem': c<=10?'1.6rem':'1rem';
    $('rndp-numout').textContent=res.join(c>20?', ':'  ');
    var sum=res.reduce(function(a,b){return a+b;},0);
    $('rndp-numstat').textContent= c>1 ? 'Sum '+sum+' · Mean '+(sum/c).toFixed(2)+' · Min '+Math.min.apply(null,res)+' · Max '+Math.max.apply(null,res) : 'Range '+mn+'–'+mx+' · 1 in '+span+' chance';
  });
  // dice
  var hist=[];
  function roll(){
    var s=$('rndp-notation').value.replace(/\s/g,'').toLowerCase(); var m=s.match(/^(\d*)d(\d+)([+-]\d+)?$/);
    if(!m){ $('rndp-dicetotal').textContent='?'; $('rndp-dicedetail').textContent='Use notation like 2d6, d20 or 3d8+2'; return; }
    var n=Math.min(100,parseInt(m[1]||'1',10)), sides=parseInt(m[2],10), mod=parseInt(m[3]||'0',10);
    if(n<1||sides<2){ $('rndp-dicedetail').textContent='Need at least 1 die with 2+ sides'; return; }
    var rolls=[]; for(var i=0;i<n;i++) rolls.push(1+rnd(sides));
    var total=rolls.reduce(function(a,b){return a+b;},0)+mod;
    $('rndp-dicetotal').textContent=total;
    var crit= n===1&&sides===20 ? (rolls[0]===20?' — NATURAL 20! 🎉':rolls[0]===1?' — natural 1 😬':'') : '';
    $('rndp-dicedetail').textContent='['+rolls.join(' + ')+']'+(mod?(mod>0?' + ':' − ')+Math.abs(mod):'')+crit+(n===4&&sides===6?' · drop lowest = '+(total-Math.min.apply(null,rolls)):'');
    hist.unshift(s+' → '+total); hist=hist.slice(0,8); $('rndp-dicehist').textContent='History: '+hist.join(' · ');
  }
  $('rndp-roll').addEventListener('click',roll);
  $('rndp-notation').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); roll(); } });
  Array.prototype.forEach.call(document.querySelectorAll('[data-rndp-d]'),function(b){ b.addEventListener('click',function(){ $('rndp-notation').value=b.getAttribute('data-rndp-d'); roll(); }); });
  $('rndp-coin').addEventListener('click',function(){ var h=rnd(2)===0; $('rndp-dicetotal').textContent=h?'HEADS':'TAILS'; $('rndp-dicedetail').textContent='🪙 fair coin'; hist.unshift('coin → '+(h?'H':'T')); hist=hist.slice(0,8); $('rndp-dicehist').textContent='History: '+hist.join(' · '); });
  // picker
  function names(){ var raw=$('rndp-names').value; var arr=(raw.indexOf('\n')>-1?raw.split(/\n/):raw.split(/,/)).map(function(x){return x.trim();}).filter(Boolean); return arr; }
  $('rndp-pick1').addEventListener('click',function(){
    var arr=names(); if(arr.length<1){ $('rndp-pickout').textContent='Add some names first'; return; }
    var out=$('rndp-pickout'), steps=0, iv=setInterval(function(){ out.textContent=arr[rnd(arr.length)]; if(++steps>14){ clearInterval(iv); var w=arr[rnd(arr.length)]; out.textContent='🏆 '+w; if($('rndp-remove').checked){ arr.splice(arr.indexOf(w),1); $('rndp-names').value=arr.join('\n'); } } },70);
  });
  $('rndp-shuffle').addEventListener('click',function(){ var arr=names(); if(!arr.length){ $('rndp-pickout').textContent='Add some names first'; return; } shuffle(arr); $('rndp-pickout').style.fontSize='1rem'; $('rndp-pickout').textContent=arr.map(function(n,i){return (i+1)+'. '+n;}).join('\n'); });
  $('rndp-split').addEventListener('click',function(){ var arr=names(), k=Math.max(2,Math.min(20,parseInt($('rndp-teams').value,10)||2)); if(arr.length<k){ $('rndp-pickout').textContent='Need at least '+k+' names'; return; } shuffle(arr); var teams=[]; for(var i=0;i<k;i++) teams.push([]); arr.forEach(function(n,i){ teams[i%k].push(n); }); $('rndp-pickout').style.fontSize='1rem'; $('rndp-pickout').textContent=teams.map(function(t,i){return 'Team '+(i+1)+': '+t.join(', ');}).join('\n'); });
})();
</script>
