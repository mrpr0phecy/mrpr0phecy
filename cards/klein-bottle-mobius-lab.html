<h2 id="kbm-title" style="margin-top:0;color:var(--accent);">🌀 Klein Bottle &amp; Möbius Lab</h2>
<p id="kbm-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;">Surfaces that shouldn't exist: a Möbius strip with adjustable twists, a Klein bottle (inside IS outside), and torus knots you design with p/q sliders. Points, wireframe or solid candy render.</p>

<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center;">
  <button type="button" data-kbm-s="mobius" style="padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:800;border:1px solid rgba(45,212,255,.4);background:rgba(45,212,255,.12);color:var(--accent);">♾️ Möbius</button>
  <button type="button" data-kbm-s="klein" style="padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--text);">🍾 Klein bottle</button>
  <button type="button" data-kbm-s="knot" style="padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--text);">🪢 Torus knot</button>
  <button type="button" data-kbm-s="torus" style="padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--text);">🍩 Torus</button>
</div>

<canvas id="kbm-cv" width="600" height="340" style="width:100%;height:340px;background:#04070d;border:1px solid rgba(45,212,255,.3);border-radius:12px;display:block;touch-action:none;cursor:grab;" role="img" aria-label="Rotating parametric surface"></canvas>

<div id="kbm-params" style="display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;align-items:end;"></div>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px;">
  <div><label for="kbm-dense" style="display:block;font-size:.78rem;color:var(--text-secondary);">Mesh density: <b id="kbm-densev" style="color:var(--accent);">med</b></label><input id="kbm-dense" type="range" min="0" max="2" value="1" style="width:100%;accent-color:var(--accent);"></div>
  <div><label for="kbm-hue" style="display:block;font-size:.78rem;color:var(--text-secondary);">Colour flow: <b id="kbm-huev" style="color:var(--accent);">190°</b></label><input id="kbm-hue" type="range" min="0" max="360" value="190" style="width:100%;accent-color:var(--accent);"></div>
  <div><label for="kbm-mode" style="display:block;font-size:.78rem;color:var(--text-secondary);">Render style</label><select id="kbm-mode" style="width:100%;padding:8px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);"><option value="solid">🍬 Solid candy</option><option value="wire">🕸 Wireframe</option><option value="dots">✨ Points</option></select></div>
  <div style="display:flex;align-items:end;padding-bottom:6px;"><label style="font-size:.82rem;color:var(--text-secondary);cursor:pointer;"><input id="kbm-spin" type="checkbox" checked style="accent-color:var(--accent);"> spin</label></div>
</div>

<div id="kbm-info" style="font-size:.86rem;color:var(--text-secondary);background:rgba(45,212,255,.05);border:1px solid rgba(45,212,255,.2);border-radius:10px;padding:12px 14px;line-height:1.65;"></div>

<script>
(function(){
  function $(id){ return document.getElementById(id); }
  var cv = $("kbm-cv"), ctx = cv.getContext("2d");
  var W = 600, H = 340, DPR = 1;
  function fit(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = Math.round(cv.clientWidth || 600); H = 340;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    render();
  }
  window.addEventListener("resize", fit);
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var surf = "mobius", spinning = !reduced, az = 0.6, el = 0.7, zoom = 1;
  var twists = 1, kp = 2, kq = 3;
  var INFO = {
    mobius: "<b style='color:var(--text);'>♾️ Möbius strip.</b> One surface, one edge — an ant can walk the whole thing without crossing an edge. Crank <b>twists</b> to 3 or 5 for weirder cousins. Cut a paper Möbius down the middle and you get ONE longer loop, not two. Try it with receipt paper.",
    klein: "<b style='color:var(--text);'>🍾 Klein bottle.</b> A bottle whose inside is its outside — with no edges at all. It can't truly exist in 3D (it needs 4D to avoid self-intersecting), so this render cheats where the neck passes through the wall. Topologists drink from these. Allegedly.",
    knot: "<b style='color:var(--text);'>🪢 Torus knot.</b> A knot drawn on a donut's surface: it loops <b>p</b> times one way and <b>q</b> times the other. (2,3) is the classic trefoil. If p and q share a divisor you get links instead of a knot — try (2,4) for two linked rings!",
    torus: "<b style='color:var(--text);'>🍩 Torus.</b> The humble donut — control sample of topology. Everything else here is what happens when mathematicians get bored of the donut. Genus 1, deliciousness 10."
  };
  function surfPt(s, u, v){
    if (s === "mobius") {
      var w = twists, r = 1.6 + (v - 0.5) * 1.1 * Math.cos(u * Math.PI * w);
      // u in [0,1] -> angle; v in [0,1] across strip
      var a = u * Math.PI * 2, half = a * w / 2;
      var rr = 1.7 + (v - 0.5) * 1.2 * Math.cos(half);
      return [rr * Math.cos(a), rr * Math.sin(a), (v - 0.5) * 1.2 * Math.sin(half)];
    }
    if (s === "klein") {
      var U = u * Math.PI * 2, V = v * Math.PI * 2;
      var x = (2 + Math.cos(U / 2) * Math.sin(V) - Math.sin(U / 2) * Math.sin(2 * V)) * Math.cos(U);
      var y = (2 + Math.cos(U / 2) * Math.sin(V) - Math.sin(U / 2) * Math.sin(2 * V)) * Math.sin(U);
      var z = Math.sin(U / 2) * Math.sin(V) + Math.cos(U / 2) * Math.sin(2 * V);
      return [x / 3.4, y / 3.4, z / 2.6];
    }
    if (s === "knot") {
      // tube around (p,q) torus knot via numeric frames
      var t = u * Math.PI * 2, R = 1.9, tr = 0.34;
      function C(tt){
        return [(R + Math.cos(kq * tt)) * Math.cos(kp * tt) / 2.6, (R + Math.cos(kq * tt)) * Math.sin(kp * tt) / 2.6, Math.sin(kq * tt) / 2.2];
      }
      var c0 = C(t), c1 = C(t + 0.01);
      var T = [c1[0] - c0[0], c1[1] - c0[1], c1[2] - c0[2]];
      var up = Math.abs(T[2]) > 0.9 ? [1, 0, 0] : [0, 0, 1];
      var N = [T[1] * up[2] - T[2] * up[1], T[2] * up[0] - T[0] * up[2], T[0] * up[1] - T[1] * up[0]];
      var nl = Math.hypot(N[0], N[1], N[2]) || 1; N = [N[0] / nl, N[1] / nl, N[2] / nl];
      var Bv = [T[1] * N[2] - T[2] * N[1], T[2] * N[0] - T[0] * N[2], T[0] * N[1] - T[1] * N[0]];
      var bl = Math.hypot(Bv[0], Bv[1], Bv[2]) || 1; Bv = [Bv[0] / bl, Bv[1] / bl, Bv[2] / bl];
      var ph = v * Math.PI * 2;
      return [c0[0] + (N[0] * Math.cos(ph) + Bv[0] * Math.sin(ph)) * tr, c0[1] + (N[1] * Math.cos(ph) + Bv[1] * Math.sin(ph)) * tr, c0[2] + (N[2] * Math.cos(ph) + Bv[2] * Math.sin(ph)) * tr];
    }
    // torus
    var U2 = u * Math.PI * 2, V2 = v * Math.PI * 2, R2 = 1.8, r2 = 0.72;
    return [(R2 + r2 * Math.cos(V2)) * Math.cos(U2) / 2.6, (R2 + r2 * Math.cos(V2)) * Math.sin(U2) / 2.6, r2 * Math.sin(V2) / 2.2];
  }
  var DENSE = [[36, 14], [64, 24], [100, 36]];
  function project(p){
    var ca = Math.cos(az), sa = Math.sin(az);
    var x1 = p[0] * ca - p[1] * sa, y1 = p[0] * sa + p[1] * ca, z1 = p[2];
    var ce = Math.cos(el), se = Math.sin(el);
    var y2 = y1 * ce - z1 * se, z2 = y1 * se + z1 * ce;
    var q = 4 / (4 + z2);
    var S = Math.min(W, H) * 0.42 * zoom;
    return [W / 2 + x1 * S * q, H / 2 + y2 * S * q, z2];
  }
  function render(){
    ctx.fillStyle = "#04070d"; ctx.fillRect(0, 0, W, H);
    var dn = DENSE[+$("kbm-dense").value], nu = dn[0], nv = dn[1];
    var mode = $("kbm-mode").value, hue0 = +$("kbm-hue").value;
    var P = [];
    for (var j = 0; j <= nv; j++) {
      P[j] = [];
      for (var i = 0; i <= nu; i++) P[j][i] = project(surfPt(surf, i / nu, j / nv));
    }
    function col(u, depth){
      var h = (hue0 + u * 120) % 360;
      var l = Math.max(18, Math.min(72, 52 - depth * 22));
      return "hsl(" + Math.round(h) + ",85%," + Math.round(l) + "%)";
    }
    if (mode === "dots") {
      for (var j2 = 0; j2 <= nv; j2 += 1) for (var i2 = 0; i2 <= nu; i2 += 1) {
        ctx.fillStyle = col(i2 / nu, P[j2][i2][2]);
        ctx.fillRect(P[j2][i2][0], P[j2][i2][1], 2.2, 2.2);
      }
    } else if (mode === "wire") {
      ctx.lineWidth = 0.8;
      for (var j3 = 0; j3 <= nv; j3 += 2) {
        ctx.strokeStyle = col(0.15 + 0.7 * j3 / nv, 0); ctx.globalAlpha = 0.8; ctx.beginPath();
        for (var i3 = 0; i3 <= nu; i3++) { if (i3) ctx.lineTo(P[j3][i3][0], P[j3][i3][1]); else ctx.moveTo(P[j3][i3][0], P[j3][i3][1]); }
        ctx.stroke();
      }
      for (var i4 = 0; i4 <= nu; i4 += 2) {
        ctx.strokeStyle = col(0.15 + 0.7 * i4 / nu, 0.5); ctx.beginPath();
        for (var j4 = 0; j4 <= nv; j4++) { if (j4) ctx.lineTo(P[j4][i4][0], P[j4][i4][1]); else ctx.moveTo(P[j4][i4][0], P[j4][i4][1]); }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else {
      // solid: backface-cull via screen-space winding, painter by depth
      var quads = [];
      for (var qj = 0; qj < nv; qj++) for (var qi = 0; qi < nu; qi++) {
        var a = P[qj][qi], b = P[qj][qi + 1], c = P[qj + 1][qi + 1], d = P[qj + 1][qi];
        var area = (b[0] - a[0]) * (b[1] + a[1]) + (c[0] - b[0]) * (c[1] + b[1]) + (d[0] - c[0]) * (d[1] + c[1]) + (a[0] - d[0]) * (a[1] + d[1]);
        if (area <= 0) continue; // backface
        quads.push([(a[2] + b[2] + c[2] + d[2]) / 4, a, b, c, d, (qi + 0.5) / nu]);
      }
      quads.sort(function(x, y){ return x[0] - y[0]; });
      for (var q = quads.length - 1; q >= 0; q--) {
        var Q = quads[q];
        ctx.beginPath();
        ctx.moveTo(Q[1][0], Q[1][1]); ctx.lineTo(Q[2][0], Q[2][1]); ctx.lineTo(Q[3][0], Q[3][1]); ctx.lineTo(Q[4][0], Q[4][1]);
        ctx.closePath();
        ctx.fillStyle = col(Q[5], Q[0]); ctx.fill();
      }
    }
  }
  function renderParams(){
    var box = $("kbm-params");
    if (surf === "mobius") {
      box.innerHTML = "<div><label for='kbm-tw' style='display:block;font-size:.78rem;color:var(--text-secondary);'>Half-twists: <b id='kbm-twv' style='color:var(--accent);'>" + twists + "</b></label><input id='kbm-tw' type='range' min='1' max='5' step='2' value='" + twists + "' style='width:150px;accent-color:var(--accent);'></div>";
      document.getElementById("kbm-tw").addEventListener("input", function(){ twists = +this.value; document.getElementById("kbm-twv").textContent = twists; if (!spinning) render(); });
    } else if (surf === "knot") {
      box.innerHTML = "<div><label for='kbm-p' style='display:block;font-size:.78rem;color:var(--text-secondary);'>p (around): <b id='kbm-pv' style='color:var(--accent);'>" + kp + "</b></label><input id='kbm-p' type='range' min='1' max='5' value='" + kp + "' style='width:130px;accent-color:#ff6b81;'></div>"
        + "<div><label for='kbm-q' style='display:block;font-size:.78rem;color:var(--text-secondary);'>q (through): <b id='kbm-qv' style='color:var(--accent);'>" + kq + "</b></label><input id='kbm-q' type='range' min='1' max='6' value='" + kq + "' style='width:130px;accent-color:#7dff6a;'></div>"
        + "<div id='kbm-knotname' style='font-size:.82rem;color:var(--text-secondary);padding-bottom:4px;'></div>";
      var names = { "2,3": "trefoil 🌟", "2,5": "cinquefoil", "3,4": "(3,4) knot", "2,4": "🔗 two linked rings!", "3,3": "🔗🔗 three linked rings!", "2,2": "🔗 Hopf link!" };
      function knotname(){ document.getElementById("kbm-knotname").innerHTML = "This is: <b style='color:var(--text);'>" + (names[kp + "," + kq] || "a (" + kp + "," + kq + ") " + (gcd(kp, kq) > 1 ? "link 🔗" : "knot")) + "</b>"; }
      function gcd(a, b){ return b ? gcd(b, a % b) : a; }
      document.getElementById("kbm-p").addEventListener("input", function(){ kp = +this.value; document.getElementById("kbm-pv").textContent = kp; knotname(); if (!spinning) render(); });
      document.getElementById("kbm-q").addEventListener("input", function(){ kq = +this.value; document.getElementById("kbm-qv").textContent = kq; knotname(); if (!spinning) render(); });
      knotname();
    } else box.innerHTML = "";
  }
  var sbtns = document.querySelectorAll("[data-kbm-s]");
  for (var si = 0; si < sbtns.length; si++) (function(b){
    b.addEventListener("click", function(){
      surf = b.getAttribute("data-kbm-s");
      for (var j = 0; j < sbtns.length; j++) {
        var on = sbtns[j] === b;
        sbtns[j].style.cssText = on
          ? "padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:800;border:1px solid rgba(45,212,255,.4);background:rgba(45,212,255,.12);color:var(--accent);"
          : "padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--text);";
      }
      $("kbm-info").innerHTML = INFO[surf];
      renderParams(); render();
    });
  })(sbtns[si]);
  $("kbm-dense").addEventListener("input", function(){ $("kbm-densev").textContent = ["low", "med", "high"][+this.value]; if (!spinning) render(); });
  $("kbm-hue").addEventListener("input", function(){ $("kbm-huev").textContent = this.value + "°"; if (!spinning) render(); });
  $("kbm-mode").addEventListener("change", function(){ if (!spinning) render(); });
  $("kbm-spin").checked = spinning;
  $("kbm-spin").addEventListener("change", function(){ spinning = this.checked; if (spinning) requestAnimationFrame(frame); });
  var dragging = false, lx = 0, ly = 0;
  cv.addEventListener("pointerdown", function(e){ dragging = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", function(e){
    if (!dragging) return;
    az += (e.clientX - lx) * 0.009; el = Math.max(-1.4, Math.min(1.4, el + (e.clientY - ly) * 0.007));
    lx = e.clientX; ly = e.clientY;
    if (!spinning) render();
  });
  cv.addEventListener("pointerup", function(){ dragging = false; });
  cv.addEventListener("wheel", function(e){ e.preventDefault(); zoom = Math.max(0.4, Math.min(2.5, zoom * (e.deltaY > 0 ? 0.93 : 1.07))); if (!spinning) render(); }, { passive: false });
  var last = 0;
  function frame(ts){
    if (!spinning) return;
    var dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
    if (!dragging) az += dt * 0.4;
    render();
    requestAnimationFrame(frame);
  }
  $("kbm-info").innerHTML = INFO.mobius;
  renderParams(); fit();
  if (spinning) requestAnimationFrame(frame);
})();
</script>
