<h2 id="project-profitability-estimator-title" style="margin-top:0;color:var(--accent)">📊 Project Profitability Estimator</h2>
<form id="project-profitability-estimator-form" aria-describedby="project-profitability-estimator-desc" onsubmit="event.preventDefault();">
<p id="project-profitability-estimator-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:.9rem">Quote client projects from real labour, expenses and contingency while protecting a target profit margin. All calculations stay in your browser.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px"><div><label for="project-profitability-estimator-hours" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Estimated hours</label><input id="project-profitability-estimator-hours" data-key="hours" type="number" step="any" value="80" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="project-profitability-estimator-rate" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Internal hourly cost (£)</label><input id="project-profitability-estimator-rate" data-key="rate" type="number" step="any" value="35" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="project-profitability-estimator-expenses" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Project expenses (£)</label><input id="project-profitability-estimator-expenses" data-key="expenses" type="number" step="any" value="600" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="project-profitability-estimator-quote" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Client quote (£)</label><input id="project-profitability-estimator-quote" data-key="quote" type="number" step="any" value="6000" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div></div>
<button type="submit" style="margin-top:16px;padding:11px 18px;border:0;border-radius:8px;background:var(--accent);color:#001018;font-weight:700;cursor:pointer">Calculate</button>
<div id="project-profitability-estimator-out" aria-live="polite" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:16px"></div>
<p style="color:var(--text-secondary);font-size:.78rem;margin-top:12px">Planning estimate only. Check tax, legal and contractual assumptions for your situation.</p>
</form>
<script>
(function(){
 const form=document.getElementById('project-profitability-estimator-form'),out=document.getElementById('project-profitability-estimator-out');
 const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:2}).format(Number.isFinite(n)?n:0);
 const num=(n,d=0)=>Number.isFinite(n)?n.toLocaleString('en-GB',{maximumFractionDigits:d}):'—'; const pct=n=>num(n,1)+'%';
 const dateMonths=n=>{const d=new Date();d.setDate(d.getDate()+Math.max(0,n)*30.44);return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'})};
 function calculate(){const v={};form.querySelectorAll('[data-key]').forEach(x=>v[x.dataset.key]=Number(x.value)); if(Object.values(v).some(x=>!Number.isFinite(x))){out.textContent='Enter valid numbers in every field.';return} const rows=(()=>{const cost=v.hours*v.rate+v.expenses,profit=v.quote-cost; return [['Delivery cost',money(cost)],['Gross profit',money(profit)],['Profit margin',pct(profit/v.quote*100)],['Effective billing rate',money(v.quote/v.hours)+'/hr']];})();out.innerHTML='';rows.forEach(r=>{const box=document.createElement('div');box.style.cssText='padding:14px;border:1px solid var(--border-light);border-radius:9px;background:rgba(45,212,255,.06)';const a=document.createElement('div'),b=document.createElement('strong');a.style.cssText='color:var(--text-secondary);font-size:.8rem';b.style.cssText='display:block;color:var(--accent);font-size:1.15rem;margin-top:5px';a.textContent=r[0];b.textContent=r[1];box.append(a,b);out.append(box)})}
 form.addEventListener('submit',calculate);form.addEventListener('input',calculate);calculate();
})();
</script>
