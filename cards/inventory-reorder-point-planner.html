<h2 id="inventory-reorder-point-planner-title" style="margin-top:0;color:var(--accent)">📦 Inventory Reorder Point Planner</h2>
<form id="inventory-reorder-point-planner-form" aria-describedby="inventory-reorder-point-planner-desc" onsubmit="event.preventDefault();">
<p id="inventory-reorder-point-planner-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:.9rem">Calculate when to reorder stock using sales velocity, supplier lead time and safety stock. All calculations stay in your browser.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px"><div><label for="inventory-reorder-point-planner-daily" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Average units sold per day</label><input id="inventory-reorder-point-planner-daily" data-key="daily" type="number" step="any" value="18" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="inventory-reorder-point-planner-lead" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Supplier lead time (days)</label><input id="inventory-reorder-point-planner-lead" data-key="lead" type="number" step="any" value="14" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="inventory-reorder-point-planner-safety" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Safety stock (days)</label><input id="inventory-reorder-point-planner-safety" data-key="safety" type="number" step="any" value="7" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div><div><label for="inventory-reorder-point-planner-stock" style="display:block;margin-bottom:6px;color:var(--text-secondary)">Current stock units</label><input id="inventory-reorder-point-planner-stock" data-key="stock" type="number" step="any" value="500" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-primary);color:var(--text);box-sizing:border-box"></div></div>
<button type="submit" style="margin-top:16px;padding:11px 18px;border:0;border-radius:8px;background:var(--accent);color:#001018;font-weight:700;cursor:pointer">Calculate</button>
<div id="inventory-reorder-point-planner-out" aria-live="polite" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:16px"></div>
<p style="color:var(--text-secondary);font-size:.78rem;margin-top:12px">Planning estimate only. Check tax, legal and contractual assumptions for your situation.</p>
</form>
<script>
(function(){
 const form=document.getElementById('inventory-reorder-point-planner-form'),out=document.getElementById('inventory-reorder-point-planner-out');
 const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:2}).format(Number.isFinite(n)?n:0);
 const num=(n,d=0)=>Number.isFinite(n)?n.toLocaleString('en-GB',{maximumFractionDigits:d}):'—'; const pct=n=>num(n,1)+'%';
 const dateMonths=n=>{const d=new Date();d.setDate(d.getDate()+Math.max(0,n)*30.44);return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'})};
 function calculate(){const v={};form.querySelectorAll('[data-key]').forEach(x=>v[x.dataset.key]=Number(x.value)); if(Object.values(v).some(x=>!Number.isFinite(x))){out.textContent='Enter valid numbers in every field.';return} const rows=(()=>{const point=v.daily*(v.lead+v.safety),days=v.stock/v.daily; return [['Reorder point',Math.ceil(point)+' units'],['Current cover',num(days,1)+' days'],['Order trigger in',num(Math.max(0,days-v.lead-v.safety),1)+' days'],['Lead-time demand',Math.ceil(v.daily*v.lead)+' units']];})();out.innerHTML='';rows.forEach(r=>{const box=document.createElement('div');box.style.cssText='padding:14px;border:1px solid var(--border-light);border-radius:9px;background:rgba(45,212,255,.06)';const a=document.createElement('div'),b=document.createElement('strong');a.style.cssText='color:var(--text-secondary);font-size:.8rem';b.style.cssText='display:block;color:var(--accent);font-size:1.15rem;margin-top:5px';a.textContent=r[0];b.textContent=r[1];box.append(a,b);out.append(box)})}
 form.addEventListener('submit',calculate);form.addEventListener('input',calculate);calculate();
})();
</script>
