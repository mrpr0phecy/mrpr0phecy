<h2>🧠 What Is Consciousness?</h2>
<p class="description">The hardest problem in science. Explore the mystery of subjective experience — how does matter become aware? Interactive exploration of the leading theories.</p>
<div id="consc-app" style="max-width:560px;margin:0 auto;"></div>
<script>
(function(){
'use strict';
var theories=[
  {name:'The Hard Problem',icon:'❓',color:'#ff4444',
   desc:'Why does subjective experience exist at all? A robot can process light at 650nm and say "red" — but does it <i>see</i> red? You experience the redness of red. This "what it is like" quality — called <b>qualia</b> — is the central mystery.',
   detail:'David Chalmers (1995) distinguished the "easy problems" (explaining behavior, information processing) from the "hard problem" (explaining why there is experience at all). We can explain every neuron, every synapse, every chemical reaction — and still not explain why it feels like something to be you.',
   question:'Can a complete physical description of your brain ever explain what it feels like to taste chocolate?'},
  {name:'Integrated Information Theory',icon:'🔺',color:'#ff8800',
   desc:'Consciousness = integrated information (Φ). Any system that integrates information in the right way has some degree of consciousness. A thermostat has a tiny bit. A brain has a lot. A digital computer — surprisingly — may have very little.',
   detail:'Giulio Tononi\'s IIT says consciousness is not about computation but about integration. A system is conscious to the degree that it is both highly differentiated (many possible states) and highly integrated (the parts cannot be separated without losing information). This predicts that the cerebellum (more neurons than cortex) is less conscious because its connections are modular, not integrated.',
   question:'If IIT is right, then a sufficiently integrated AI would be conscious. Would turning it off be murder?'},
  {name:'Global Workspace Theory',icon:'💡',color:'#ffcc00',
   desc:'Consciousness is a spotlight. Your brain processes millions of things unconsciously — but only a few "win" the competition and enter the global workspace: your conscious awareness. You are the news broadcast, not the entire city.',
   detail:'Bernard Baars\' GWT compares consciousness to a theater: unconscious processes compete backstage, and the "winner" is broadcast to a global workspace accessible to memory, language, and decision-making. This explains why you can only hold ~4 items in working memory, and why consciousness seems serial even though the brain is massively parallel.',
   question:'If consciousness is just information broadcast to a workspace, is a group chat conscious?'},
  {name:'Higher-Order Theory',icon:'🪞',color:'#39ff14',
   desc:'You are conscious of something when you have a thought <i>about</i> that thought. A dog sees a tree. You see a tree AND know that you are seeing a tree. Consciousness is self-representation — the mind modeling itself.',
   detail:'David Rosenthal\'s HOT says a mental state is conscious only when accompanied by a higher-order representation of that state. This explains blindsight: patients who can respond to visual stimuli without conscious experience — their first-order perception works, but the higher-order representation is damaged.',
   question:'If you had a perfect memory of every experience but no self-awareness, would you be conscious?'},
  {name:'Panpsychism',icon:'✨',color:'#2dd4ff',
   desc:'Consciousness is fundamental — like mass or charge. Every particle has some tiny spark of experience. Brains don\'t create consciousness; they amplify and organize what was already there. The universe is not dead matter — it is alive all the way down.',
   detail:'Philip Goff and others argue that if consciousness emerged from non-conscious matter, there would be a sharp boundary where experience suddenly appears — and that seems impossible. Instead, consciousness may be a fundamental feature of reality. An electron has a vanishingly small experience. A brain has a vast, complex one. This sounds mystical, but it is a serious position held by leading philosophers.',
   question:'If every particle has experience, does that mean the universe itself is conscious?'},
  {name:'The Mystery Remains',icon:'🌌',color:'#8844ff',
   desc:'We may be asking the wrong question — or a question our brains are not equipped to answer. A dog cannot understand calculus. A human may not be able to understand consciousness. The answer might require a revolution in thinking as profound as the discovery of quantum mechanics.',
   detail:'Thomas Nagel asked "What is it like to be a bat?" — and showed that even knowing everything about bat neuroscience tells us nothing about bat experience. Colin McGinn argues that consciousness is "cognitively closed" to us — we can understand that it exists but never how. The mystery may be permanent.',
   question:'Is the question "what is consciousness?" like asking "what is north of the North Pole?" — grammatically valid but fundamentally confused?'}
];
var idx=0;
function init(){idx=0;render();}
function render(){
  var t=theories[idx];
  var h='<div style="text-align:center;margin-bottom:12px;">';
  h+='<div style="font-size:48px;margin-bottom:8px;">'+t.icon+'</div>';
  h+='<div style="font-size:18px;font-weight:700;color:'+t.color+';">'+t.name+'</div>';
  h+='</div>';
  h+='<div style="background:rgba(255,255,255,0.05);border-radius:8px;padding:14px;border:1px solid '+t.color+'40;margin-bottom:10px;font-size:14px;line-height:1.7;color:#e6faff;">'+t.desc+'</div>';
  h+='<div style="background:rgba(255,255,255,0.03);border-radius:8px;padding:12px;border:1px solid rgba(255,255,255,0.08);margin-bottom:10px;font-size:12px;line-height:1.6;color:#9ccbe0;">'+t.detail+'</div>';
  h+='<div style="background:rgba(136,68,255,0.08);border-radius:8px;padding:10px;border:1px solid rgba(136,68,255,0.2);margin-bottom:14px;font-size:13px;color:#bb88ff;font-style:italic;">💭 '+t.question+'</div>';
  h+='<input type="range" min="0" max="'+(theories.length-1)+'" value="'+idx+'" id="consc-sl" style="width:100%;accent-color:'+t.color+';">';
  h+='<div style="display:flex;justify-content:space-between;font-size:10px;color:#666;margin-top:4px;">';
  for(var i=0;i<theories.length;i++)h+='<span style="color:'+(i===idx?theories[i].color:'#444')+';">'+(i+1)+'</span>';
  h+='</div>';
  h+='<div style="margin-top:14px;font-size:13px;line-height:1.7;color:#e6faff;background:rgba(255,255,255,0.05);border-radius:8px;padding:12px;border:1px solid rgba(45,212,255,0.2);">';
  h+='<b>The deepest mystery:</b> You are the only consciousness you can ever directly verify. You assume others are conscious because they behave like you — but you can never experience their experience. The universe contains at least one point of view: yours. Whether it contains billions or trillions is an open question.';
  h+='</div>';
  document.getElementById('consc-app').innerHTML=h;
  document.getElementById('consc-sl').addEventListener('input',function(e){idx=parseInt(e.target.value);render();});
}
init();
})();
</script>
