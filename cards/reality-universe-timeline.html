<h2>⏳ Timeline of Everything</h2>
<p class="description">From the Big Bang to the heat death of the universe. Slide through 13.8 billion years of cosmic history and see how reality unfolded.</p>
<div id="timeline-app" style="max-width:600px;margin:0 auto;"></div>
<script>
(function(){
'use strict';
var events=[
  {t:0,name:'The Big Bang',desc:'All matter, energy, space, and time emerge from a singularity. Temperature: 10³² K. In the first second, the universe expands faster than light. There is no "before" — time itself begins here.',icon:'💥',color:'#ff4400'},
  {t:0.00001,name:'Quark-Gluon Plasma',desc:'The universe is a soup of free quarks and gluons — too hot for atoms to exist. Matter is a roiling sea of pure energy beginning to crystallize into structure.',icon:'🌊',color:'#ff6600'},
  {t:3,name:'First Protons',desc:'Quarks bind into protons and neutrons. The strong nuclear force locks them together forever. Every proton in your body has existed since this moment — you are 13.8 billion years old.',icon:'⚛️',color:'#ff8800'},
  {t:180,name:'Nucleosynthesis',desc:'Protons fuse into helium nuclei. 75% hydrogen, 25% helium — the composition of the universe is set in 3 minutes. Everything heavier will be forged later inside stars.',icon:'🔥',color:'#ffaa00'},
  {t:380000,name:'Cosmic Microwave Background',desc:'The universe cools enough for electrons to bind to atoms. Light is freed. This afterglow still fills all of space — you can see it as static on old TV sets. The oldest light in existence.',icon:'📡',color:'#ffcc00'},
  {t:200000000,name:'First Stars Ignite',desc:'Hydrogen clouds collapse and ignite nuclear fusion. The first stars are massive, short-lived, and forge the first heavy elements: carbon, oxygen, iron. You are made of their ashes.',icon:'⭐',color:'#44ddff'},
  {t:9000000000,name:'Solar System Forms',desc:'A cloud of gas enriched by dead stars collapses. The Sun ignites. Earth forms from the debris. Within 500 million years, the first self-replicating molecules appear. Life begins.',icon:'🌍',color:'#39ff14'},
  {t:13800000000,name:'NOW',desc:'You exist. Matter has organized itself into a being that can contemplate its own origins. The universe has spent 13.8 billion years becoming aware of itself through you.',icon:'🧠',color:'#ff44ff'},
  {t:15000000000,name:'Andromeda Collision',desc:'The Milky Way and Andromeda galaxies merge into one. New stars form, but the night sky transforms completely. Earth is likely unharmed but the cosmos looks alien.',icon:'🌌',color:'#8844ff'},
  {t:100000000000,name:'Star Formation Ends',desc:'The last stars burn out. No new stars form. The universe goes dark. Only red dwarfs, white dwarfs, and neutron stars remain — slowly cooling embers of a once-brilliant cosmos.',icon:'🌑',color:'#444466'},
  {t:1000000000000000,name:'Black Hole Era',desc:'All stars have decayed. Only black holes remain, slowly evaporating via Hawking radiation. Each black hole takes longer than the current age of the universe to die.',icon:'🕳️',color:'#222244'},
  {t:100000000000000000000,name:'Heat Death',desc:'The last black hole evaporates. The universe reaches maximum entropy. No energy gradients exist to drive any process. Time loses meaning. Reality ends not with a bang, but with silence.',icon:'⚫',color:'#111122'}
];
var idx=7; // start at NOW
function init(){idx=7;render();}
function render(){
  var e=events[idx];
  var h='<div style="text-align:center;margin-bottom:12px;">';
  h+='<div style="font-size:48px;margin-bottom:8px;">'+e.icon+'</div>';
  h+='<div style="font-size:18px;font-weight:700;color:'+e.color+';margin-bottom:4px;">'+e.name+'</div>';
  h+='<div style="font-size:12px;color:#9ccbe0;">'+formatTime(e.t)+'</div>';
  h+='</div>';
  h+='<div style="background:rgba(255,255,255,0.05);border-radius:8px;padding:16px;border:1px solid '+e.color+'40;margin-bottom:16px;font-size:14px;line-height:1.7;color:#e6faff;">'+e.desc+'</div>';
  h+='<input type="range" min="0" max="'+(events.length-1)+'" value="'+idx+'" id="tl-slider" style="width:100%;accent-color:'+e.color+';">';
  h+='<div style="display:flex;justify-content:space-between;font-size:10px;color:#666;margin-top:4px;"><span>Big Bang</span><span>Stars</span><span>NOW</span><span>Heat Death</span></div>';
  h+='<div style="text-align:center;margin-top:12px;">';
  h+='<button onclick="window._tlPrev()" style="padding:6px 16px;background:rgba(45,212,255,0.15);color:#2dd4ff;border:1px solid rgba(45,212,255,0.3);border-radius:6px;cursor:pointer;font-weight:600;margin-right:8px;">← Earlier</button>';
  h+='<button onclick="window._tlNext()" style="padding:6px 16px;background:rgba(45,212,255,0.15);color:#2dd4ff;border:1px solid rgba(45,212,255,0.3);border-radius:6px;cursor:pointer;font-weight:600;">Later →</button>';
  h+='</div>';
  document.getElementById('timeline-app').innerHTML=h;
  document.getElementById('tl-slider').addEventListener('input',function(e){idx=parseInt(e.target.value);render();});
}
function formatTime(y){
  if(y===0)return 't = 0';
  if(y<1)return y*1000000+' microseconds';
  if(y<3600)return y+' seconds';
  if(y<86400*365)return Math.floor(y/86400/365)+' years';
  if(y<1e9)return (y/1e9).toFixed(1)+' billion years';
  if(y<1e12)return (y/1e9).toFixed(0)+' billion years';
  if(y<1e15)return (y/1e12).toFixed(0)+' trillion years';
  return '10^'+Math.round(Math.log10(y))+' years';
}
window._tlPrev=function(){if(idx>0){idx--;render();}};
window._tlNext=function(){if(idx<events.length-1){idx++;render();}};
init();
})();
</script>
