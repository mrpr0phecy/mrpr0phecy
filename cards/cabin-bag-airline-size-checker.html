<h2 id="cbag-title" style="margin-top:0;color:var(--accent);">🧳 Cabin Bag Size Checker</h2>

<form aria-describedby="cbag-desc" onsubmit="event.preventDefault();">
  <p id="cbag-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Type your suitcase in centimetres and see which common airlines it should fit, including wheels and handles as the airline measures them. Limits change — confirm on the carrier’s site before you fly.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="cbag-l" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Length cm</label>
      <input id="cbag-l" type="number" min="1" step="any" value="55" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="cbag-w" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Width cm</label>
      <input id="cbag-w" type="number" min="1" step="any" value="40" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="cbag-h" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Depth cm</label>
      <input id="cbag-h" type="number" min="1" step="any" value="20" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="cbag-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var AIR = [
    ['easyJet cabin', 56, 45, 25, '1 cabin bag on most fares'],
    ['Ryanair under-seat', 40, 20, 25, 'Free under-seat only'],
    ['Ryanair priority', 55, 40, 20, 'Plus the under-seat bag'],
    ['Wizz under-seat', 40, 30, 20, 'Free small bag'],
    ['Wizz priority cabin', 55, 40, 23, 'Wizz Priority'],
    ['British Airways', 56, 45, 25, 'Plus a small bag'],
    ['Lufthansa', 55, 40, 23, '8 kg on many fares'],
    ['Air France / KLM', 55, 35, 25, 'Plus a small item'],
    ['Jet2', 56, 45, 25, '10 kg typically'],
    ['TUI', 55, 40, 20, 'Check your holiday pack'],
    ['Emirates', 55, 38, 20, '7 kg economy'],
    ['Delta / United (in)', 55.9, 35.6, 22.9, '22 × 14 × 9 in']
  ];
  function fits(l, w, h, L, W, H) {
    var bag = [l, w, h].sort(function (a, b) { return b - a; });
    var lim = [L, W, H].sort(function (a, b) { return b - a; });
    return bag[0] <= lim[0] + 0.05 && bag[1] <= lim[1] + 0.05 && bag[2] <= lim[2] + 0.05;
  }
  function run() {
    var l = Number($('cbag-l').value), w = Number($('cbag-w').value), h = Number($('cbag-h').value);
    if (!(l > 0 && w > 0 && h > 0)) return;
    var html = AIR.map(function (a) {
      var ok = fits(l, w, h, a[1], a[2], a[3]);
      return '<div style="padding:10px;border-radius:10px;background:' + (ok ? 'rgba(57,255,20,.08)' : 'rgba(255,77,77,.08)') + ';border:1px solid ' + (ok ? 'rgba(57,255,20,.35)' : 'rgba(255,77,77,.3)') + ';"><div style="font-weight:800;color:' + (ok ? '#9dff9a' : '#ffb8b8') + ';">' + (ok ? '✓ ' : '✗ ') + a[0] + '</div><div style="font-size:.75rem;color:var(--text-secondary);margin-top:3px;">Limit ' + a[1] + '×' + a[2] + '×' + a[3] + ' cm · ' + a[4] + '</div></div>';
    }).join('');
    $('cbag-out').innerHTML = '<div style="font-size:.78rem;color:var(--text-secondary);margin-bottom:8px;">Your bag ' + l + '×' + w + '×' + h + ' cm (order of sides does not matter).</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;">' + html + '</div>';
  }
  ['cbag-l', 'cbag-w', 'cbag-h'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
