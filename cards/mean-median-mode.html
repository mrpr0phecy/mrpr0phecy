<section class="math-tool"><h2 id="mean-median-mode-title">📈 Mean, Median & Mode</h2><p id="mean-median-mode-desc">Paste a list of numbers separated by commas, spaces, or new lines.</p><textarea id="stats" rows="4">4, 7, 7, 9, 12, 15</textarea><button id="stats-go">Analyse data</button><div class="answer" id="stats-out"></div></section><style>.math-tool{max-width:720px;margin:auto;color:#e6faff}.math-tool h2{color:#2dd4ff}.math-tool p{color:#b7cbd2}.math-tool textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #285268;background:#101c25;color:#fff;font-size:16px;margin:14px 0}.math-tool button{padding:12px 22px;border:0;border-radius:8px;background:#2dd4ff;color:#06151c;font-weight:800;cursor:pointer}.answer{margin-top:18px;padding:18px;border-radius:10px;background:#102833;color:#39ff14;font-size:18px;line-height:1.7}</style><script>(()=>{const $=x=>document.getElementById(x);function go(){let a=$('stats').value.split(/[\s,]+/).map(Number).filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length){$('stats-out').textContent='Enter some numbers.';return}let mean=a.reduce((x,y)=>x+y,0)/a.length,mid=Math.floor(a.length/2),med=a.length%2?a[mid]:(a[mid-1]+a[mid])/2,c={};a.forEach(x=>c[x]=(c[x]||0)+1);let max=Math.max(...Object.values(c)),mode=max>1?Object.keys(c).filter(x=>c[x]===max).join(', '):'No mode';$('stats-out').innerHTML=`Count: <b>${a.length}</b><br>Mean: <b>${mean.toFixed(2)}</b><br>Median: <b>${med}</b><br>Mode: <b>${mode}</b>`}$('stats-go').onclick=go;go()})()</script>
