<h2 id="savings-title" style="margin-top:0;color:var(--accent);">💰 Savings Calculator</h2>

<form style="margin-bottom:16px;">
  <p class="small" style="color:rgba(230,250,255,0.7);margin-bottom:16px;">
    Calculate how much your savings will grow with regular deposits and compound interest.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="savings-principal" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">🏦 Starting Amount (£)</label>
      <input id="savings-principal" type="number" min="0" value="1000" step="50"
             style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    </div>
    <div>
      <label for="savings-monthly" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">📅 Monthly Deposit (£)</label>
      <input id="savings-monthly" type="number" min="0" value="200" step="10"
             style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(57,255,20,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    </div>
    <div>
      <label for="savings-rate" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">📈 Interest Rate (%)</label>
      <input id="savings-rate" type="number" min="0" max="30" step="0.1" value="5"
             style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,165,0,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    </div>
    <div>
      <label for="savings-years" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">⏳ Years</label>
      <input id="savings-years" type="number" min="1" max="50" value="10"
             style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,64,129,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    </div>
  </div>

  <div style="display:flex;gap:8px;">
    <button type="button" onclick="(function(b){var f=b.closest('form');var p=parseFloat(f.querySelector('#savings-principal').value)||0;var m=parseFloat(f.querySelector('#savings-monthly').value)||0;var r=parseFloat(f.querySelector('#savings-rate').value)||0;var y=parseFloat(f.querySelector('#savings-years').value)||0;var months=y*12;var mr=r/100/12;var bal=p;for(var i=0;i<months;i++){bal=bal*(1+mr)+m;}var contrib=p+m*months;var interest=bal-contrib;var fmt=function(n){return '£'+n.toLocaleString('en-GB',{maximumFractionDigits:2,minimumFractionDigits:2});};f.parentElement.querySelector('#savings-total').textContent=fmt(bal);f.parentElement.querySelector('#savings-contrib').textContent=fmt(contrib);f.parentElement.querySelector('#savings-interest').textContent=fmt(interest);f.parentElement.querySelector('#savings-total').style.color='#39ff14';f.parentElement.querySelector('#savings-interest').style.color='#ffa500';})(this)"
            style="padding:12px 24px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:600;">Calculate</button>
    <button type="button" onclick="(function(b){var f=b.closest('form');f.reset();f.parentElement.querySelector('#savings-total').textContent='–';f.parentElement.querySelector('#savings-contrib').textContent='–';f.parentElement.querySelector('#savings-interest').textContent='–';f.parentElement.querySelector('#savings-total').style.color='var(--accent)';f.parentElement.querySelector('#savings-interest').style.color='var(--accent)';})(this)"
            style="padding:12px 24px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(230,250,255,0.7);cursor:pointer;">Reset</button>
  </div>
</form>

<div class="results" style="background:rgba(0,0,0,0.3);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,0.05);">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">
    <div>
      <div style="font-size:0.75rem;color:rgba(230,250,255,0.5);margin-bottom:4px;">Final Balance</div>
      <div id="savings-total" style="font-size:1.3rem;font-weight:700;color:var(--accent);">–</div>
    </div>
    <div>
      <div style="font-size:0.75rem;color:rgba(230,250,255,0.5);margin-bottom:4px;">Contributions</div>
      <div id="savings-contrib" style="font-size:1.3rem;font-weight:600;color:rgba(230,250,255,0.7);">–</div>
    </div>
    <div>
      <div style="font-size:0.75rem;color:rgba(230,250,255,0.5);margin-bottom:4px;">Interest Earned</div>
      <div id="savings-interest" style="font-size:1.3rem;font-weight:600;color:var(--accent);">–</div>
    </div>
  </div>
</div>
