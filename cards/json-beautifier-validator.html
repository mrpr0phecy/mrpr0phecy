<h2 id="json-beautifier-validator-title" style="margin-top:0;color:var(--accent);">🔧 JSONForge: Live Formatter, Minifier & Schema Validator</h2>

<form aria-describedby="json-beautifier-validator-desc" onsubmit="event.preventDefault();">
  <p id="json-beautifier-validator-desc" class="small" style="color:var(--muted);margin-bottom:14px;">
    Format, minify, validate, and debug JSON payloads with exact syntax error line tracking. 100% private in-browser parsing.
  </p>

  <div style="display:flex;gap:8px;margin-bottom:10px;">
    <button type="button" id="json-beautify-btn" style="padding:8px 16px;border-radius:6px;background:var(--accent);color:#050811;border:none;font-weight:700;font-size:0.8rem;cursor:pointer;">
      ✨ Beautify (2 Spaces)
    </button>
    <button type="button" id="json-minify-btn" style="padding:8px 16px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.8rem;cursor:pointer;">
      📦 Minify
    </button>
    <button type="button" id="json-copy-btn" style="padding:8px 16px;border-radius:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.8rem;cursor:pointer;">
      📋 Copy
    </button>
    <button type="button" id="json-clear-btn" style="padding:8px 14px;border-radius:6px;background:rgba(255,71,87,0.1);border:1px solid #ff4757;color:#ff4757;font-size:0.8rem;cursor:pointer;">
      Clear
    </button>
  </div>

  <textarea id="json-input" rows="9" style="width:100%;box-sizing:border-box;padding:12px;border-radius:8px;background:#050811;border:1px solid rgba(255,255,255,0.15);color:#e6faff;font-family:'JetBrains Mono',monospace;font-size:0.82rem;line-height:1.5;resize:vertical;">{"project":"themostusefulsiteintheworld","token":"$MRPROPHECY","utilityTools":264,"features":["zero_ads","no_tracking","instant_web_audio"],"metadata":{"creator":"MrProphecy","chain":"Solana"}}</textarea>

  <div id="json-status-bar" style="margin-top:8px;padding:8px 12px;border-radius:6px;background:rgba(57,255,20,0.1);border:1px solid #39ff14;color:#39ff14;font-size:0.8rem;font-weight:600;">
    ✅ Valid JSON (Object with 4 root keys)
  </div>
</form>

<script>
(function() {
  const input = document.getElementById('json-input');
  const status = document.getElementById('json-status-bar');
  const bBtn = document.getElementById('json-beautify-btn');
  const mBtn = document.getElementById('json-minify-btn');
  const cBtn = document.getElementById('json-copy-btn');
  const clrBtn = document.getElementById('json-clear-btn');

  function validate() {
    const raw = input.value.trim();
    if (!raw) {
      status.textContent = 'Enter or paste JSON payload above.';
      status.style.background = 'rgba(255,255,255,0.05)';
      status.style.borderColor = 'rgba(255,255,255,0.1)';
      status.style.color = 'var(--muted)';
      return null;
    }

    try {
      const parsed = JSON.parse(raw);
      const isArr = Array.isArray(parsed);
      const keys = isArr ? parsed.length : Object.keys(parsed).length;
      status.textContent = `✅ Valid JSON (${isArr ? `Array with ${keys} items` : `Object with ${keys} root keys`})`;
      status.style.background = 'rgba(57,255,20,0.1)';
      status.style.borderColor = '#39ff14';
      status.style.color = '#39ff14';
      return parsed;
    } catch(err) {
      status.textContent = `❌ Syntax Error: ${err.message}`;
      status.style.background = 'rgba(255,71,87,0.15)';
      status.style.borderColor = '#ff4757';
      status.style.color = '#ff6b81';
      return null;
    }
  }

  bBtn.addEventListener('click', () => {
    const obj = validate();
    if (obj !== null) input.value = JSON.stringify(obj, null, 2);
  });

  mBtn.addEventListener('click', () => {
    const obj = validate();
    if (obj !== null) input.value = JSON.stringify(obj);
  });

  cBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(input.value);
    cBtn.textContent = '✅ Copied!';
    setTimeout(() => cBtn.textContent = '📋 Copy', 1500);
  });

  clrBtn.addEventListener('click', () => {
    input.value = '';
    validate();
  });

  input.addEventListener('input', validate);
  validate();
})();
</script>
