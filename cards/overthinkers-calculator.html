<!-- cards/overthinkers-calculator.html -->
<h2 id="overthink-title" style="margin-top:0;color:var(--accent);">🧮 The Overthinker's Calculator</h2>

<form aria-describedby="overthink-desc" onsubmit="event.preventDefault();">
  <p id="overthink-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Calculate exactly how many ways a situation can go wrong. Spoiler: it's more than you think.
  </p>

  <div style="margin-bottom:16px;">
    <label for="overthink-situation" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:600;">What are you overthinking about?</label>
    <select id="overthink-situation" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="text">Sending a text message</option>
      <option value="email">Writing an email</option>
      <option value="wave">Waving at someone</option>
      <option value="order">Ordering food at a restaurant</option>
      <option value="present">Giving a gift</option>
      <option value="joke">Telling a joke</option>
      <option value="opinion">Sharing an opinion online</option>
      <option value="outfit">Choosing an outfit</option>
    </select>
  </div>

  <div style="margin-bottom:16px;">
    <label for="overthink-anxiety" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:600;">Current Anxiety Level</label>
    <input id="overthink-anxiety" type="range" min="1" max="10" value="7" style="width:100%;accent-color:var(--accent);" oninput="document.getElementById('overthink-anxiety-val').textContent=['😌 Zen','🙂 Mild','😐 Moderate','😬 Concerned','😰 Nervous','😨 Anxious','😱 Panicking','🤯 Spiralling','💀 Existential','🌪️ Full Meltdown'][this.value-1]">
    <div id="overthink-anxiety-val" style="text-align:center;color:var(--text-secondary);font-size:0.85rem;margin-top:4px;">😱 Panicking</div>
  </div>

  <button type="button" onclick="overthinkCalculate()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🧠 Calculate Worst-Case Scenarios
  </button>

  <div id="overthink-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);margin-bottom:12px;">
    <div id="overthink-total" style="font-size:1.3rem;color:var(--accent);font-weight:700;text-align:center;margin-bottom:12px;"></div>
    <div id="overthink-breakdown" style="font-size:0.85rem;color:var(--text);line-height:1.8;margin-bottom:12px;"></div>
    <div id="overthink-advice" style="font-size:0.9rem;color:var(--text-secondary);text-align:center;font-style:italic;padding:10px;border-radius:8px;background:rgba(255,255,255,0.03);"></div>
  </div>
</form>

<script>
(function(){
  var overthinkScenarios = {
    text: {
      base: 47,
      scenarios: [
        'They read it but don\'t reply for 3 hours (interpretation: they hate you)',
        'You use the wrong emoji and it seems passive-aggressive',
        'Autocorrect changes "sounds good" to "sounds god" and now you seem arrogant',
        'You send it to the wrong person with the same first name',
        'They reply with just "ok" and you spend 2 hours decoding it',
        'You triple-text by accident and look desperate',
        'The message delivers but they never open it (are they alive??)',
        'You use a period at the end and it seems aggressive',
        'They screenshot it (WHY??)',
        'You forget a word and the sentence makes no sense'
      ],
      advice: 'Send the text. The real worst case is you never send it and they think YOU hate THEM.'
    },
    email: {
      base: 63,
      scenarios: [
        'You forget the attachment (CLASSIC)',
        'You hit Reply All and everyone sees your private comment',
        'You accidentally CC the person you\'re complaining about',
        'Your sign-off is too formal ("Regards" vs "Kind regards" — the stakes are REAL)',
        'You use the wrong "their/there/they\'re" and a colleague notices',
        'The email goes to spam and they think you ghosted them',
        'You write "per my last email" and it sounds passive-aggressive even though it isn\'t',
        'You forget to change the subject line from "Re: Re: Re: Re: Fwd:"',
        'Your email signature has a typo you\'ve had for 3 years',
        'You accidentally attach your shopping list instead of the report'
      ],
      advice: 'Read it once. Send it. Do not read it again. Reading it again is how you find problems that don\'t exist.'
    },
    wave: {
      base: 31,
      scenarios: [
        'They weren\'t waving at you (the classic)',
        'You wave too late and they\'ve already looked away',
        'Your wave is too enthusiastic and now you look like a golden retriever',
        'They wave back out of pity',
        'You do the awkward half-wave-finger-point hybrid',
        'You wave at someone wearing sunglasses and can\'t tell if they saw you',
        'They think you\'re waving at someone behind them',
        'You commit to the wave too early and they\'re still 50 metres away',
        'You both do the "are they waving at me?" dance for 10 seconds',
        'You wave at someone who turns out to be a stranger'
      ],
      advice: 'Just nod. Nods are safe. Nods are universal. Nods cannot embarrass you.'
    },
    order: {
      base: 38,
      scenarios: [
        'You mispronounce the dish and the waiter corrects you',
        'You order something you can\'t pronounce and have to point at the menu',
        'Everyone else orders first and gets something cool, you panic-order a salad',
        'You ask for modifications and the chef secretly hates you',
        'Your order takes longer than everyone else\'s and you feel judged',
        'You order the same thing as someone else (copycat!)',
        'The waiter says "excellent choice" and you wonder if they say that to everyone',
        'You can\'t decide and say "you choose" and they pick the most expensive thing',
        'You order something adventurous and hate it but have to pretend you love it',
        'You say "that\'s all" and then immediately want to add something'
      ],
      advice: 'Order what you actually want. The waiter has seen 400 orders today and will forget yours in 6 minutes.'
    },
    present: {
      base: 52,
      scenarios: [
        'They already have it',
        'They hate it but pretend to love it (you\'ll never know)',
        'It\'s the wrong size and now there\'s an awkward exchange situation',
        'You spent too much and now they feel guilty',
        'You spent too little and now you look cheap',
        'The gift implies a level of relationship commitment you didn\'t intend',
        'They get you something way better and now you\'re the bad guy',
        'You accidentally regift something they gave you last year',
        'The gift requires assembly and you\'ve given them homework',
        'They open it in front of other people and their reaction is... ambiguous'
      ],
      advice: 'Gift cards exist for a reason. That reason is overthinking. Embrace the gift card.'
    },
    joke: {
      base: 44,
      scenarios: [
        'Nobody laughs (the silence is DEAFENING)',
        'Someone already heard it and tells you mid-joke',
        'You forget the punchline halfway through',
        'The joke is accidentally offensive and you don\'t realise until the silence',
        'You laugh at your own joke before the punchline',
        'Someone explains why the joke doesn\'t logically work',
        'The joke lands but someone takes it seriously and gets upset',
        'You tell it wrong and it makes no sense',
        'Someone one-ups you with a better joke immediately after',
        'The timing is off and the moment passes while you\'re still setting up'
      ],
      advice: 'If you have to think about whether it\'s funny, it\'s not. Save it for the group chat where timing doesn\'t matter.'
    },
    opinion: {
      base: 71,
      scenarios: [
        'Someone disagrees and writes a 500-word reply',
        'You get ratio\'d into oblivion',
        'Someone screenshots it and posts it somewhere else to mock you',
        'A stranger goes through your entire post history to find contradictions',
        'You accidentally start a political argument',
        'Someone you respect likes the opposing take',
        'Your phone buzzes for 3 hours straight with notifications',
        'Someone says "this ain\'t it chief" and gets more likes than you',
        'You realise you\'re wrong 20 minutes later but it already has 200 likes',
        'Your mum sees it and asks about it at Sunday dinner'
      ],
      advice: 'Type it. Read it. Delete it. Journal it. The internet doesn\'t need your opinion. (Neither does your journal, but it won\'t ratio you.)'
    },
    outfit: {
      base: 35,
      scenarios: [
        'You\'re overdressed and everyone stares',
        'You\'re underdressed and everyone stares',
        'Someone is wearing the same thing (TWINNING)',
        'Your outfit looks great in the mirror but terrible in photos',
        'You spill something on yourself within the first 10 minutes',
        'The weather changes and your outfit no longer makes sense',
        'Someone asks "are you wearing that?" with a specific tone',
        'You change 7 times and end up wearing the first thing you tried',
        'Your shoes are uncomfortable but they complete the look',
        'You see someone wearing a much cooler version of your outfit'
      ],
      advice: 'Wear the thing. Nobody is analysing your outfit as much as you are. They\'re too busy overthinking their own.'
    }
  };

  window.overthinkCalculate = function() {
    var sit = document.getElementById('overthink-situation').value;
    var anxiety = parseInt(document.getElementById('overthink-anxiety').value);
    var data = overthinkScenarios[sit];

    var total = Math.round(data.base * (1 + (anxiety - 1) * 0.3));
    var picked = data.scenarios.slice(0, Math.min(anxiety + 2, data.scenarios.length));

    var breakdown = '';
    for (var i = 0; i < picked.length; i++) {
      breakdown += '<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);">⚠️ ' + picked[i] + '</div>';
    }
    breakdown += '<div style="padding:8px 0;color:var(--text-secondary);font-size:0.8rem;">...and ' + (total - picked.length) + ' more scenarios your brain will discover at 3am</div>';

    document.getElementById('overthink-total').textContent = '🔢 ' + total + ' ways this can go wrong';
    document.getElementById('overthink-breakdown').innerHTML = breakdown;
    document.getElementById('overthink-advice').textContent = '💡 ' + data.advice;
    document.getElementById('overthink-result').style.display = 'block';
  };
})();
</script>
