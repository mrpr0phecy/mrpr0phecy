<h2 id="spoh-title" style="margin-top:0;color:var(--accent);">🔊 Speaker Ohm Wiring</h2>

<form aria-describedby="spoh-desc" onsubmit="event.preventDefault();">
  <p id="spoh-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Series adds ohms; parallel is the reciprocal sum. Never present an amp with a lower load than it is rated for — that is how output stages die. Passive crossovers are not modelled.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="spoh-n" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">How many speakers</label>
      <input id="spoh-n" type="number" min="1" max="8" value="2" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="spoh-each" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Each (Ω)</label>
      <select id="spoh-each" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="4">4 Ω</option>
        <option value="8" selected>8 Ω</option>
        <option value="16">16 Ω</option>
      </select>
    </div>
    <div>
      <label for="spoh-amp" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Amp minimum Ω</label>
      <input id="spoh-amp" type="number" min="1" step="any" value="4" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="spoh-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var n = Math.max(1, Math.floor(Number($('spoh-n').value) || 1));
    var each = Number($('spoh-each').value), amin = Number($('spoh-amp').value);
    var series = each * n;
    var parallel = each / n;
    function verdict(load) {
      if (!(amin > 0)) return '';
      if (load + 0.05 < amin) return ' <span style="color:#ffb8b8;">too low for this amp</span>';
      return ' <span style="color:#9dff9a;">OK vs ' + amin + ' Ω min</span>';
    }
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('spoh-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;">' +
      cell('All in series', series.toFixed(1) + ' Ω' + verdict(series)) +
      cell('All in parallel', parallel.toFixed(2) + ' Ω' + verdict(parallel)) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Two 8 Ω in parallel = 4 Ω; two 8 Ω in series = 16 Ω. Mixing 4 Ω and 8 Ω in parallel is 2.67 Ω — check the amp.</p>';
  }
  ['spoh-n', 'spoh-each', 'spoh-amp'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
