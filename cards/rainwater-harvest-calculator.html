<h2 id="rwhv-title" style="margin-top:0;color:var(--accent);">🌧️ Rainwater Harvest</h2>

<form aria-describedby="rwhv-desc" onsubmit="event.preventDefault();">
  <p id="rwhv-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    1 mm of rain on 1 m² is 1 litre. Multiply by a runoff coefficient (tiles ~0.85, felt ~0.8). UK roofs often yield more than a water-butt can hold — size the tank, not just the dream.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="rwhv-a" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Roof plan area (m²)</label>
      <input id="rwhv-a" type="number" min="0" step="any" value="80" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="rwhv-mm" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Rainfall (mm)</label>
      <input id="rwhv-mm" type="number" min="0" step="any" value="650" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="rwhv-c" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Runoff coefficient</label>
      <input id="rwhv-c" type="number" min="0" max="1" step="0.05" value="0.85" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="rwhv-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var a = Number($('rwhv-a').value), mm = Number($('rwhv-mm').value), c = Number($('rwhv-c').value);
    if (!(a > 0 && mm >= 0 && c >= 0)) return;
    var L = a * mm * c;
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('rwhv-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Yield', Math.round(L).toLocaleString() + ' L') +
      cell('Cubic metres', (L / 1000).toFixed(2) + ' m³') +
      cell('200 L butts', Math.ceil(L / 200) + '  (if you stored it all)') +
      cell('10 mm storm', Math.round(a * 10 * c) + ' L in one dump') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">England averages ~600–800 mm/year depending on the county. First-flush diverters keep the tank cleaner. Not drinking water unless treated.</p>';
  }
  ['rwhv-a', 'rwhv-mm', 'rwhv-c'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
