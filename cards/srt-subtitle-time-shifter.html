<h2 id="srts-title" style="margin-top:0;color:var(--accent);">🎬 SRT Subtitle Time Shifter</h2>

<form aria-describedby="srts-desc" onsubmit="event.preventDefault();">
  <p id="srts-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Shift every <code style="color:var(--accent);">HH:MM:SS,mmm</code> timestamp in an .srt by milliseconds (negative to go earlier). Runs in this page — files stay on your device.
  </p>
  <label for="srts-in" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Paste SRT</label>
  <textarea id="srts-in" rows="10" spellcheck="false" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem;">1
00:00:01,000 --&gt; 00:00:04,200
Hello from the subtitle file.

2
00:00:05,000 --&gt; 00:00:07,500
Shift me later.</textarea>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin-top:10px;">
    <div>
      <label for="srts-ms" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Shift milliseconds</label>
      <input id="srts-ms" type="number" step="1" value="1500" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <button type="button" id="srts-go" style="padding:10px 14px;border-radius:8px;border:1px solid rgba(45,212,255,.4);background:rgba(45,212,255,.12);color:var(--accent);font-weight:700;cursor:pointer;min-height:40px;width:100%;">Shift</button>
    </div>
  </div>
</form>
<pre id="srts-out" style="margin-top:14px;padding:12px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);overflow:auto;font-size:.78rem;white-space:pre-wrap;word-break:break-word;"></pre>
<p id="srts-msg" style="margin:8px 0 0;font-size:.75rem;color:var(--text-secondary);"></p>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function parseTs(h, m, s, ms) {
    return ((Number(h) * 60 + Number(m)) * 60 + Number(s)) * 1000 + Number(ms);
  }
  function fmt(t) {
    if (t < 0) t = 0;
    var ms = t % 1000;
    t = Math.floor(t / 1000);
    var s = t % 60; t = Math.floor(t / 60);
    var m = t % 60; var h = Math.floor(t / 60);
    function z(n, w) { n = String(n); return n.length >= w ? n : new Array(w - n.length + 1).join('0') + n; }
    return z(h, 2) + ':' + z(m, 2) + ':' + z(s, 2) + ',' + z(ms, 3);
  }
  function run() {
    var delta = Number($('srts-ms').value);
    if (!isFinite(delta)) {
      $('srts-msg').textContent = 'Enter a millisecond shift.';
      return;
    }
    var re = /(\d{2}):(\d{2}):(\d{2})[,.](\d{3})/g;
    var n = 0;
    var out = $('srts-in').value.replace(re, function (_, h, m, s, ms) {
      n++;
      return fmt(parseTs(h, m, s, ms) + delta);
    });
    $('srts-out').textContent = out;
    $('srts-msg').textContent = n + ' timestamps shifted by ' + delta + ' ms. Copy the box below back into an .srt file.';
  }
  $('srts-go').addEventListener('click', run);
  $('srts-ms').addEventListener('change', run);
  run();
})();
</script>
