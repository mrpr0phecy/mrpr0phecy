<h2 id="jday-title" style="margin-top:0;color:var(--accent);">🌌 Julian Day Converter</h2>

<form aria-describedby="jday-desc" onsubmit="event.preventDefault();">
  <p id="jday-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Convert a calendar date to Julian Day Number (JDN) and Modified Julian Date (MJD = JD − 2,400,000.5). Astronomers count days from noon UTC on 1 January 4713 BCE. Gregorian calendar after 15 Oct 1582.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="jday-date" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Date (UTC)</label>
      <input id="jday-date" type="date" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="jday-time" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Time UTC</label>
      <input id="jday-time" type="time" value="12:00" step="1" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="jday-jd" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Julian Day</label>
      <input id="jday-jd" type="number" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="jday-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var lock = false;
  function toJD(y, m, d, hour) {
    if (m <= 2) { y -= 1; m += 12; }
    var A = Math.floor(y / 100);
    var B = 2 - A + Math.floor(A / 4);
    var jd0 = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
    return jd0 + hour / 24;
  }
  function fromJD(jd) {
    var z = Math.floor(jd + 0.5);
    var f = jd + 0.5 - z;
    var A = z;
    if (z >= 2299161) {
      var alpha = Math.floor((z - 1867216.25) / 36524.25);
      A = z + 1 + alpha - Math.floor(alpha / 4);
    }
    var B = A + 1524;
    var C = Math.floor((B - 122.1) / 365.25);
    var D = Math.floor(365.25 * C);
    var E = Math.floor((B - D) / 30.6001);
    var day = B - D - Math.floor(30.6001 * E) + f;
    var month = E < 14 ? E - 1 : E - 13;
    var year = month > 2 ? C - 4716 : C - 4715;
    var dayInt = Math.floor(day);
    var frac = day - dayInt;
    var secs = Math.round(frac * 86400);
    var h = Math.floor(secs / 3600), mi = Math.floor((secs % 3600) / 60);
    return { y: year, m: month, d: dayInt, h: h, mi: mi };
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  (function init() {
    var t = new Date();
    $('jday-date').value = t.toISOString().slice(0, 10);
    $('jday-time').value = '12:00';
  })();
  function fromDate() {
    if (lock) return;
    var ds = $('jday-date').value, ts = $('jday-time').value || '12:00';
    if (!ds) return;
    var p = ds.split('-'), q = ts.split(':');
    var jd = toJD(Number(p[0]), Number(p[1]), Number(p[2]), Number(q[0]) + Number(q[1] || 0) / 60);
    lock = true; $('jday-jd').value = String(Number(jd.toFixed(5))); lock = false;
    paint(jd);
  }
  function fromJdField() {
    if (lock) return;
    var jd = Number($('jday-jd').value);
    if (!isFinite(jd)) return;
    var g = fromJD(jd);
    lock = true;
    $('jday-date').value = g.y + '-' + pad(g.m) + '-' + pad(g.d);
    $('jday-time').value = pad(g.h) + ':' + pad(g.mi);
    lock = false;
    paint(jd);
  }
  function paint(jd) {
    var mjd = jd - 2400000.5;
    $('jday-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      [['Julian Day', jd.toFixed(5)], ['MJD', mjd.toFixed(5)], ['JDN (noon-based int)', String(Math.floor(jd + 0.5))]].map(function (row) {
        return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + row[0] + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + row[1] + '</div></div>';
      }).join('') + '</div>';
  }
  $('jday-date').addEventListener('input', fromDate);
  $('jday-time').addEventListener('input', fromDate);
  $('jday-jd').addEventListener('input', fromJdField);
  fromDate();
})();
</script>
