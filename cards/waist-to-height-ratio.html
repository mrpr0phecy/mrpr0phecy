<h2 id="wthr-title" style="margin-top:0;color:var(--accent);">📏 Waist-to-Height Ratio</h2>

<form aria-describedby="wthr-desc" onsubmit="event.preventDefault();">
  <p id="wthr-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    NICE NG246 uses waist ÷ height as a central-adiposity screen for adults with BMI under 35. Measure the waist at the midpoint between the last rib and the hip bone. Not a diagnosis.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="wthr-unit" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Units</label>
      <select id="wthr-unit" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="cm">cm</option>
        <option value="in">inches</option>
      </select>
    </div>
    <div>
      <label for="wthr-w" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Waist</label>
      <input id="wthr-w" type="number" min="1" step="any" value="86" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="wthr-h" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Height</label>
      <input id="wthr-h" type="number" min="1" step="any" value="175" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="wthr-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var w = Number($('wthr-w').value), h = Number($('wthr-h').value);
    if (!(w > 0) || !(h > 0)) {
      $('wthr-out').textContent = 'Enter waist and height in the same units.';
      return;
    }
    var r = w / h;
    var band = r < 0.4 ? 'below the usual healthy band (unusually slim — context matters)' :
      r < 0.5 ? 'healthy central adiposity (NICE: below 0.5)' :
      r < 0.6 ? 'increased (NICE: 0.5 to 0.59)' : 'high (NICE: 0.6 and above)';
    var keepUnder = 0.5 * h;
    var unit = $('wthr-unit').value;
    $('wthr-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Waist ÷ height', r.toFixed(3)) +
      cell('NICE-style band', band) +
      cell('Keep waist under 0.5 × height', keepUnder.toFixed(1) + ' ' + unit) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">NICE: a ratio of 0.5 or more means increased health risk for adults with BMI &lt; 35 kg/m². Pregnancy, some ethnic groups and children use different methods. Speak to a clinician about your own numbers.</p>';
  }
  ['wthr-unit', 'wthr-w', 'wthr-h'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
