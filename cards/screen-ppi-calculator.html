<h2 id="sppi-title" style="margin-top:0;color:var(--accent);">🖥️ Screen PPI Calculator</h2>

<form aria-describedby="sppi-desc" onsubmit="event.preventDefault();">
  <p id="sppi-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Pixels per inch from diagonal size and resolution. Also shows pixel pitch, aspect ratio and whether the display is “Retina” at a typical viewing distance (1 arc-minute).
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="sppi-diag" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Diagonal (inches)</label>
      <input id="sppi-diag" type="number" min="1" step="any" value="27" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="sppi-res" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Resolution</label>
      <select id="sppi-res" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="1920x1080">1920×1080 (FHD)</option>
        <option value="2560x1440" selected>2560×1440 (QHD)</option>
        <option value="3840x2160">3840×2160 (4K)</option>
        <option value="2560x1080">2560×1080 (UW FHD)</option>
        <option value="3440x1440">3440×1440 (UW QHD)</option>
        <option value="1280x800">1280×800</option>
        <option value="custom">Custom…</option>
      </select>
    </div>
    <div id="sppi-custom" style="display:none;grid-column:1/-1;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div>
          <label for="sppi-w" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Width px</label>
          <input id="sppi-w" type="number" min="1" value="2560" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        </div>
        <div>
          <label for="sppi-h" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Height px</label>
          <input id="sppi-h" type="number" min="1" value="1440" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        </div>
      </div>
    </div>
  </div>
</form>
<div id="sppi-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };

  function gcd(a, b) { return b ? gcd(b, a % b) : a; }
  function run() {
    var diag = Number($('sppi-diag').value);
    var res = $('sppi-res').value;
    $('sppi-custom').style.display = res === 'custom' ? 'block' : 'none';
    var w, h;
    if (res === 'custom') { w = Number($('sppi-w').value); h = Number($('sppi-h').value); }
    else { var p = res.split('x'); w = Number(p[0]); h = Number(p[1]); }
    if (!(diag > 0 && w > 0 && h > 0)) return;
    var ppi = Math.sqrt(w * w + h * h) / diag;
    var pitch = 25.4 / ppi;
    var g = gcd(w, h);
    var widthIn = diag * w / Math.sqrt(w * w + h * h);
    var heightIn = diag * h / Math.sqrt(w * w + h * h);
    var retinaAt = (h / (Math.tan((1 / 60) * Math.PI / 180))) / 2;
    retinaAt = (heightIn / 2) / Math.tan((1 / 60) * Math.PI / 180) / h * h;
    var viewIn = (heightIn) / (2 * Math.tan(((1 / 60) * h) * Math.PI / 180 / 2));
    $('sppi-out').innerHTML =
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;">' +
      cell('PPI', ppi.toFixed(1)) +
      cell('Pixel pitch', pitch.toFixed(3) + ' mm') +
      cell('Aspect', (w / g) + ':' + (h / g)) +
      cell('Active area', widthIn.toFixed(2) + ' × ' + heightIn.toFixed(2) + ' in') +
      '</div>' +
      '<p style="margin:12px 0 0;font-size:.8rem;color:var(--text-secondary);">At this resolution a “Retina” seat (1 arc-minute per pixel) is about <strong style="color:var(--text);">' + viewIn.toFixed(0) + ' in / ' + (viewIn * 2.54).toFixed(0) + ' cm</strong> from the screen. Closer than that and you can start to resolve pixels.</p>';
  }
  function cell(k, v) {
    return '<div style="padding:12px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-size:1.1rem;font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  ['sppi-diag', 'sppi-res', 'sppi-w', 'sppi-h'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
