<h2 id="afrk-title" style="margin-top:0;color:var(--accent);">🌬️ Air Fryer ⇄ Oven Converter</h2>

<form aria-describedby="afrk-desc" onsubmit="event.preventDefault();">
  <p id="afrk-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Turn a conventional-oven recipe into an air-fryer starting point: typically 20°C cooler and about 20% less time. Always check food, especially poultry, with a thermometer — baskets cook faster at the edges.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="afrk-dir" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Convert</label>
      <select id="afrk-dir" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="oven2air">Oven recipe → air fryer</option>
        <option value="air2oven">Air fryer → oven</option>
      </select>
    </div>
    <div>
      <label for="afrk-c" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Temperature °C</label>
      <input id="afrk-c" type="number" min="80" max="250" value="200" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="afrk-min" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Time (minutes)</label>
      <input id="afrk-min" type="number" min="1" max="240" value="25" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="afrk-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var c = Number($('afrk-c').value), m = Number($('afrk-min').value), dir = $('afrk-dir').value;
    if (!(c > 0 && m > 0)) return;
    var outC, outM, from, to;
    if (dir === 'oven2air') {
      outC = c - 20; outM = m * 0.8; from = 'Oven'; to = 'Air fryer';
    } else {
      outC = c + 20; outM = m / 0.8; from = 'Air fryer'; to = 'Oven';
    }
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('afrk-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell(from, Math.round(c) + '°C · ' + m + ' min (' + Math.round(c * 9 / 5 + 32) + '°F)') +
      cell(to + ' start at', Math.round(outC) + '°C · ' + Math.round(outM) + ' min (' + Math.round(outC * 9 / 5 + 32) + '°F)') +
      cell('Check from', Math.max(1, Math.round(outM * 0.7)) + ' min') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Do not crowd the basket. Frozen foods often need the full oven time even in an air fryer. Internal 75°C for poultry.</p>';
  }
  ['afrk-dir', 'afrk-c', 'afrk-min'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
