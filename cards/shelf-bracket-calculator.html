<!-- cards/shelf-bracket-calculator.html -->
<h2 id="shelfbrk-title" style="margin-top:0;color:var(--accent);">📏 Shelf Bracket Calculator</h2>

<form aria-describedby="shelfbrk-desc" onsubmit="event.preventDefault();">
  <p id="shelfbrk-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Calculate the right bracket size, spacing, and load capacity for your shelf project.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="shelfbrk-len" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Shelf Length (cm)</label>
      <input id="shelfbrk-len" type="number" min="20" value="80" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="shelfbrk-depth" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Shelf Depth (cm)</label>
      <input id="shelfbrk-depth" type="number" min="10" value="25" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
  </div>

  <div style="margin-bottom:12px;">
    <label for="shelfbrk-load" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Expected Load</label>
    <select id="shelfbrk-load" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="light">Light — picture frames, ornaments (up to 10 kg)</option>
      <option value="medium" selected>Medium — books, kitchen items (10–25 kg)</option>
      <option value="heavy">Heavy — full bookshelf load (25–50 kg)</option>
    </select>
  </div>

  <div style="margin-bottom:14px;">
    <label for="shelfbrk-material" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Shelf Material</label>
    <select id="shelfbrk-material" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="mdf">MDF / Chipboard</option>
      <option value="pine" selected>Pine / Softwood</option>
      <option value="hardwood">Hardwood (oak, walnut)</option>
      <option value="plywood">Plywood (18mm+)</option>
    </select>
  </div>

  <button type="button" onclick="shelfbrkCalc()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    📏 Calculate Brackets
  </button>

  <div id="shelfbrk-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);">
    <div id="shelfbrk-brackets" style="font-size:1.1rem;color:var(--accent);font-weight:700;margin-bottom:8px;"></div>
    <div id="shelfbrk-size" style="font-size:0.95rem;color:var(--text);margin-bottom:8px;"></div>
    <div id="shelfbrk-spacing" style="font-size:0.95rem;color:var(--text);margin-bottom:8px;"></div>
    <div id="shelfbrk-visual" style="margin-bottom:12px;"></div>
    <div id="shelfbrk-tips" style="font-size:0.8rem;color:var(--text-secondary);line-height:1.6;"></div>
  </div>
</form>

<script>
(function(){
  window.shelfbrkCalc=function(){
    var len=parseFloat(document.getElementById('shelfbrk-len').value);
    var depth=parseFloat(document.getElementById('shelfbrk-depth').value);
    var load=document.getElementById('shelfbrk-load').value;
    var mat=document.getElementById('shelfbrk-material').value;
    var numBrackets;
    if(len<=60) numBrackets=2;
    else if(len<=120) numBrackets=2;
    else if(len<=180) numBrackets=3;
    else if(len<=240) numBrackets=4;
    else numBrackets=Math.ceil(len/60);
    if(load==='heavy'&&len>80) numBrackets=Math.max(numBrackets,3);
    var bracketDepth=Math.ceil(depth*0.75);
    var bracketSizes=[15,20,25,30,35,40];
    var bestSize=bracketSizes[0];
    for(var i=0;i<bracketSizes.length;i++){if(bracketSizes[i]>=bracketDepth)bestSize=bracketSizes[i];}
    var spacing=len/(numBrackets-1);
    var endMargin=spacing/2;
    document.getElementById('shelfbrk-brackets').textContent='🔩 Use '+numBrackets+' brackets';
    document.getElementById('shelfbrk-size').innerHTML='📐 Bracket depth: <strong>'+bestSize+' cm</strong> (shelf depth is '+depth+'cm — bracket should be at least 75% of shelf depth)';
    document.getElementById('shelfbrk-spacing').innerHTML='📏 Space brackets <strong>'+spacing.toFixed(0)+' cm</strong> apart, with <strong>'+endMargin.toFixed(0)+' cm</strong> from each end';
    var scale=Math.min(300/len,1);
    var html='<div style="position:relative;height:60px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.1);border-radius:8px;margin:8px 0;">';
    html+='<div style="position:absolute;top:10px;left:'+(10)+'px;width:'+(len*scale)+'px;height:8px;background:var(--accent);border-radius:4px;"></div>';
    for(var b=0;b<numBrackets;b++){
      var xPos=10+(b*spacing*scale);
      html+='<div style="position:absolute;top:18px;left:'+xPos+'px;width:4px;height:30px;background:#39ff14;border-radius:2px;transform:translateX(-50%);"></div>';
      html+='<div style="position:absolute;top:50px;left:'+xPos+'px;font-size:0.55rem;color:var(--text-secondary);transform:translateX(-50%);white-space:nowrap;">🪝</div>';
    }
    html+='</div>';
    document.getElementById('shelfbrk-visual').innerHTML=html;
    var matTips={mdf:'⚠️ MDF sags under load over long spans. For spans over 60cm, add a centre bracket or use thicker material.',pine:'💡 Pine is strong for its weight. Pre-drill screw holes to prevent splitting.',hardwood:'💡 Hardwood is heavy — make sure your wall fixings can hold the shelf\'s own weight PLUS the contents.',plywood:'💡 Plywood is dimensionally stable (won\'t warp). Edge-band for a finished look.'};
    document.getElementById('shelfbrk-tips').innerHTML='💡 <strong>Rule of thumb:</strong> bracket spacing should not exceed 80cm for medium loads.<br>'+matTips[mat]+'<br>💡 Always fix brackets into wall plugs or studs — not just plasterboard.';
    document.getElementById('shelfbrk-result').style.display='block';
  };
})();
</script>
