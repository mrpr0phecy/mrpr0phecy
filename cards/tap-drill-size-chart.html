<h2 id="tapd-title" style="margin-top:0;color:var(--accent);">🔩 Tap Drill Size</h2>

<form aria-describedby="tapd-desc" onsubmit="event.preventDefault();">
  <p id="tapd-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Close-enough tap drill ≈ major diameter − pitch (75% thread). Metric coarse plus a few UNC sizes. For production work use the machinist’s table for your material.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="tapd-size" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Thread</label>
      <select id="tapd-size" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);"></select>
    </div>
  </div>
</form>
<div id="tapd-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var sizes = [
    { n: 'M3 × 0.5', d: 3, p: 0.5 },
    { n: 'M4 × 0.7', d: 4, p: 0.7 },
    { n: 'M5 × 0.8', d: 5, p: 0.8 },
    { n: 'M6 × 1.0', d: 6, p: 1 },
    { n: 'M8 × 1.25', d: 8, p: 1.25 },
    { n: 'M10 × 1.5', d: 10, p: 1.5 },
    { n: 'M12 × 1.75', d: 12, p: 1.75 },
    { n: 'M16 × 2.0', d: 16, p: 2 },
    { n: '¼-20 UNC', d: 6.35, p: 1.27 },
    { n: '⁵⁄₁₆-18 UNC', d: 7.938, p: 1.411 },
    { n: '⅜-16 UNC', d: 9.525, p: 1.588 }
  ];
  var sel = $('tapd-size');
  sizes.forEach(function (s, i) {
    var o = document.createElement('option');
    o.value = String(i); o.textContent = s.n;
    if (s.n.indexOf('M6') === 0) o.selected = true;
    sel.appendChild(o);
  });
  function run() {
    var s = sizes[Number(sel.value)];
    var drill = s.d - s.p;
    var inch = drill / 25.4;
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('tapd-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Tap drill (75%)', drill.toFixed(2) + ' mm') +
      cell('Inches', inch.toFixed(3) + '"') +
      cell('Nearest letter/number', nearest(drill)) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Peck-drill, use cutting fluid, start the tap square. Stainless wants a slightly larger drill (shallower thread) to save taps.</p>';
  }
  function nearest(mm) {
    var letters = { A: 5.944, B: 6.045, C: 6.147, D: 6.248, E: 6.35, F: 6.528, G: 6.629, H: 6.747, I: 6.909, J: 7.036, K: 7.137, L: 7.366, M: 7.493, N: 7.671 };
    var best = '', diff = 99;
    Object.keys(letters).forEach(function (k) {
      var d = Math.abs(letters[k] - mm);
      if (d < diff) { diff = d; best = k + ' (' + letters[k] + ' mm)'; }
    });
    return best;
  }
  sel.addEventListener('change', run);
  run();
})();
</script>
