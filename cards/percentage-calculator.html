<section class="math-tool">
<h2>📊 Percentage Calculator</h2><p>Work out percentages, increases, decreases, and discounts in seconds.</p>
<div class="grid"><label>Mode<select id="pct-mode"><option value="what">What is X% of Y?</option><option value="part">X is what % of Y?</option><option value="change">Percentage change</option><option value="discount">Discount price</option></select></label><label id="pct-a-label">X<input id="pct-a" type="number" value="15"></label><label id="pct-b-label">Y<input id="pct-b" type="number" value="240"></label></div><button id="pct-go">Calculate</button><div class="answer" id="pct-out" aria-live="polite"></div></section>
<style>.math-tool{max-width:720px;margin:auto;color:#e6faff}.math-tool h2{color:#2dd4ff}.math-tool p{color:#b7cbd2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:20px 0}.math-tool label{display:grid;gap:7px;color:#9deaff}.math-tool input,.math-tool select{padding:12px;border-radius:8px;border:1px solid #285268;background:#101c25;color:#fff;font-size:16px}.math-tool button{padding:12px 22px;border:0;border-radius:8px;background:#2dd4ff;color:#06151c;font-weight:800;cursor:pointer}.answer{margin-top:18px;padding:18px;border-radius:10px;background:#102833;color:#39ff14;font-size:20px;min-height:26px}</style>
<script>(()=>{const $=id=>document.getElementById(id);function calc(){let a=+$('pct-a').value,b=+$('pct-b').value,m=$('pct-mode').value,r;if(!Number.isFinite(a)||!Number.isFinite(b)){r='Enter two numbers.'}else if(m==='what')r=`${a}% of ${b} = ${b*a/100}`;else if(m==='part')r=`${a} is ${(a/b*100).toFixed(2)}% of ${b}`;else if(m==='change')r=`Change: ${(a/b*100-100).toFixed(2)}%`;else r=`After ${a}% discount: ${(b*(1-a/100)).toFixed(2)}`;$('pct-out').textContent=r} $('pct-go').onclick=calc;calc()})()</script>
