<h2>🛡️ Your Inner Critic Is Trying to Save You</h2>
<p class="description">Your inner critic isn't your enemy — it's a terrified protector stuck in the past. Meet it, understand what it's protecting you from, and gently update its threat model.</p>
<div id="ic-app" style="max-width:540px;margin:0 auto;"></div>
<script>
(function(){
'use strict';
var step=0,criticName='',fear='',protection='',age='';
function init(){step=0;render();}
function render(){
  var h='';
  if(step===0){
    h+='<div style="text-align:center;margin-bottom:20px;">';
    h+='<div style="font-size:64px;margin-bottom:12px;">🛡️</div>';
    h+='<h3 style="color:#ff6b81;margin:0 0 8px;">The voice that says you\'re not enough</h3>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);">Everyone has an inner critic — the voice that says "you\'ll fail," "they\'ll reject you," "who do you think you are?" Most people try to fight it, silence it, or ignore it. But here\'s what therapy reveals: <b>your critic is not attacking you. It\'s protecting you.</b> It learned, usually in childhood, that a certain kind of pain was dangerous. It\'s been running the same defence programme ever since — even though you\'ve outgrown the threat.</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-top:12px;">This tool helps you meet your critic as what it actually is: a frightened guard still watching for a threat that may no longer exist.</p>';
    h+='</div>';
    h+='<button onclick="window._icNext()" style="display:block;margin:0 auto;padding:12px 32px;background:linear-gradient(135deg,#ff6b81,#ff4757);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px;">Meet Your Critic</button>';
  }else if(step===1){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">🛡️</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">Your inner critic has been with you for years. It probably doesn\'t have a name — it just <i>is</i> the voice. But giving it a name creates <b>psychological distance</b>. It\'s no longer "I am worthless" — it\'s "the critic is saying I\'m worthless." That distance is where healing begins.</p>';
    h+='<label style="display:block;font-size:13px;color:#ff6b81;margin-bottom:6px;font-weight:600;">Give your critic a name (anything — a person, a creature, a colour):</label>';
    h+='<input type="text" id="ic-name" placeholder="e.g. The Sergeant, Grey Fog, Mum\'s Voice..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,107,129,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:15px;box-sizing:border-box;">';
    h+='<button onclick="window._icNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#ff6b81,#ff4757);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Continue</button>';
  }else if(step===2){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">🛡️</div><div style="font-size:18px;font-weight:700;color:#ff6b81;margin-top:8px;">'+criticName+'</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">Think about the last time '+criticName+' was loud. What was the situation? What did it say? Now — underneath that criticism — what was it trying to protect you from?</p>';
    h+='<p style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:12px;">Common fears: rejection, humiliation, abandonment, being seen as incompetent, losing control, being vulnerable</p>';
    h+='<label style="display:block;font-size:13px;color:#ff6b81;margin-bottom:6px;font-weight:600;">What is '+criticName+' afraid will happen to you?</label>';
    h+='<textarea id="ic-fear" rows="3" placeholder="e.g. If I try and fail, people will see I\'m a fraud and leave..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,107,129,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>';
    h+='<button onclick="window._icNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#ff6b81,#ff4757);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Continue</button>';
  }else if(step===3){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">🛡️</div><div style="font-size:18px;font-weight:700;color:#ff6b81;margin-top:8px;">'+criticName+'</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">Now the key question: <b>how old were you when you first learned this fear?</b> Your critic\'s threat model was usually written in childhood. The protection strategy made sense <i>then</i>. But you\'re not that age anymore.</p>';
    h+='<label style="display:block;font-size:13px;color:#ff6b81;margin-bottom:6px;font-weight:600;">Roughly how old were you when this fear first took root?</label>';
    h+='<input type="text" id="ic-age" placeholder="e.g. 8, 12, 15..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,107,129,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:15px;box-sizing:border-box;">';
    h+='<button onclick="window._icNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#ff6b81,#ff4757);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Continue</button>';
  }else if(step===4){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">🛡️➡️🕊️</div></div>';
    h+='<div style="background:rgba(255,107,129,0.08);border:1px solid rgba(255,107,129,0.2);border-radius:10px;padding:20px;margin-bottom:16px;">';
    h+='<p style="font-size:15px;line-height:1.8;color:#e6faff;margin:0;">Here\'s what\'s actually happening:</p><br>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0;"><b>'+criticName+'</b> was created when you were roughly <b>'+age+'</b> years old. It learned that <b>'+fear+'</b> was a real and present danger. So it built a wall of criticism to keep you safe — to stop you from ever being in that position again.</p><br>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0;">But here\'s what '+criticName+' doesn\'t know: <b>you\'re not '+age+' anymore.</b> You have resources, experience, and resilience that a'+(parseInt(age)<8?' child':' young person')+' didn\'t have. The threat model is outdated.</p><br>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0;">You don\'t need to destroy '+criticName+'. It\'s been trying to help. But you can <b>update its threat model</b>. You can say:</p>';
    h+='<div style="background:rgba(255,107,129,0.15);border-radius:8px;padding:16px;margin-top:12px;font-size:15px;line-height:1.8;color:#ff6b81;font-style:italic;">"Thank you for trying to protect me. I know you\'re scared of '+fear+'. But I\'m not '+age+' anymore. I can handle this now. You can rest."</div>';
    h+='</div>';
    h+='<p style="font-size:13px;color:var(--text-secondary);line-height:1.7;">This is not positive thinking. This is <b>cognitive defusion</b> — a core technique in ACT (Acceptance and Commitment Therapy), used by clinical psychologists worldwide. The goal isn\'t to silence the critic. It\'s to hear it, thank it, and <i>choose your response</i> rather than being controlled by it.</p>';
    h+='<button onclick="window._icReset()" style="display:block;margin:20px auto 0;padding:10px 24px;background:rgba(255,107,129,0.15);color:#ff6b81;border:1px solid rgba(255,107,129,0.3);border-radius:8px;cursor:pointer;font-weight:600;">Start Over</button>';
  }
  document.getElementById('ic-app').innerHTML=h;
}
window._icNext=function(){
  if(step===1){var n=document.getElementById('ic-name');if(n){criticName=n.value.trim()||'The Critic';}}
  if(step===2){var f=document.getElementById('ic-fear');if(f){fear=f.value.trim()||'being hurt';}}
  if(step===3){var a=document.getElementById('ic-age');if(a){age=a.value.trim()||'10';}}
  step++;render();
};
window._icReset=function(){init();};
init();
})();
</script>
