<h2 id="poul-title" style="margin-top:0;color:var(--accent);">🩹 Herbal Poultice &amp; Compress</h2>

<form aria-describedby="poul-desc" onsubmit="event.preventDefault();">
  <p id="poul-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Topical acute botanical applications (fomentations &amp; cataplasms). Formulates venom drawing pastes, bone-healing comfrey packs, and castor oil compresses.
  </p>

  <!-- Ailment / Remedy Selector -->
  <div style="margin-bottom:12px;">
    <label for="poul-select" style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:4px;color:var(--text);">Select Acute Physical Ailment:</label>
    <select id="poul-select" style="width:100%;padding:8px;background:rgba(20,30,40,0.8);border:1px solid rgba(45,212,255,0.3);color:var(--text);border-radius:6px;font-size:0.85rem;">
      <option value="plantain" selected>🐝 Bee Stings / Bug Bites / Venom (Plantain Cataplasm)</option>
      <option value="comfrey">🦴 Sprains / Ligament Tears / Bone Bruise (Comfrey Knitbone)</option>
      <option value="charcoal">🎯 Deep Splinters / Boils / Poison Ivy (Charcoal-Clay Draw)</option>
      <option value="castor">🩸 Pelvic Cramps / Lymphatic Stagnation (Warm Castor Oil Pack)</option>
      <option value="cabbage">❄️ Joint Swelling / Breast Engorgement (Chilled Cabbage Compress)</option>
    </select>
  </div>

  <!-- Specifications Badges -->
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;text-align:center;">
    <div style="background:rgba(0,243,255,0.08);border:1px solid rgba(0,243,255,0.3);border-radius:6px;padding:8px 4px;">
      <div style="font-size:0.65rem;color:var(--accent);font-weight:700;">TYPE</div>
      <div id="poul-type" style="font-size:0.82rem;font-weight:800;color:#fff;">Direct Poultice</div>
    </div>
    <div style="background:rgba(180,75,255,0.08);border:1px solid rgba(180,75,255,0.3);border-radius:6px;padding:8px 4px;">
      <div style="font-size:0.65rem;color:#d896ff;font-weight:700;">TEMPERATURE</div>
      <div id="poul-temp" style="font-size:0.82rem;font-weight:800;color:#d896ff;">Cool / Fresh</div>
    </div>
    <div style="background:rgba(57,255,20,0.08);border:1px solid rgba(57,255,20,0.3);border-radius:6px;padding:8px 4px;">
      <div style="font-size:0.65rem;color:#39ff14;font-weight:700;">DURATION</div>
      <div id="poul-duration" style="font-size:0.82rem;font-weight:800;color:#39ff14;">30–45 Mins</div>
    </div>
  </div>

  <!-- Preparation Guide & Active Constituents -->
  <div style="background:#091018;border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:12px;margin-bottom:12px;">
    <div style="font-size:0.75rem;font-weight:700;color:var(--accent);margin-bottom:6px;text-transform:uppercase;">
      🥣 Preparation &amp; Application Protocol:
    </div>
    <div id="poul-protocol" style="font-size:0.78rem;color:var(--text-secondary);line-height:1.45;">
      <!-- Injected dynamically -->
    </div>
  </div>

  <!-- Clinical Warning / Safety Note -->
  <div id="poul-warning-box" style="background:rgba(255,51,102,0.08);border-left:3px solid #ff3366;border-radius:0 6px 6px 0;padding:8px 12px;font-size:0.73rem;color:var(--text-secondary);line-height:1.4;">
    <!-- Injected dynamically -->
  </div>
</form>

<script>
(function initPoulticeLab() {
  const selectEl = document.getElementById('poul-select');
  const typeEl = document.getElementById('poul-type');
  const tempEl = document.getElementById('poul-temp');
  const durationEl = document.getElementById('poul-duration');
  const protocolEl = document.getElementById('poul-protocol');
  const warningBox = document.getElementById('poul-warning-box');

  if (!selectEl || !protocolEl) return;

  const data = {
    'plantain': {
      type: 'Direct Cataplasm',
      temp: 'Fresh / Ambient',
      duration: '30–45 Mins',
      protocol: 'Macerate fresh Broadleaf or Ribwort Plantain (<em>Plantago major/lanceolata</em>) by bruising or finely chopping with a pestle. Apply the green juicy pulp directly over the sting site. Secure loosely with clean gauze or breathable bandage. Re-apply fresh paste when dry.',
      warning: '<strong style="color:#ff85a2;">Active Phytochemistry:</strong> Aucubin (anti-inflammatory iridoid glycoside) neutralizes polypeptide insect venoms, while allantoin speeds tissue regeneration. Seek immediate emergency care for systemic anaphylaxis.'
    },
    'comfrey': {
      type: 'Warm Compress / Pack',
      temp: 'Warm (40°C)',
      duration: '45–60 Mins',
      protocol: 'Mix powdered dried Comfrey root or leaf (<em>Symphytum officinale</em>) with just enough hot water to form a spreadable paste. Stir in 1 tbsp ground flaxseed as a gelatinous binder. Spread between two layers of organic cotton flannel and apply over closed sprained ankle or wrist.',
      warning: '<strong style="color:#ff85a2;">CRITICAL SAFETY WARNING:</strong> Never apply comfrey to deep puncture wounds or open skin! Allantoin stimulates mitotic cell division so rapidly that external skin can heal shut over an unsterilized internal infection, trapping an abscess.'
    },
    'charcoal': {
      type: 'Drawing Poultice',
      temp: 'Warm / Room Temp',
      duration: '1–2 Hours',
      protocol: 'Combine equal parts USP Activated Charcoal powder and Bentonite Clay (1 tbsp each). Add warm water and 1 tsp ground flaxseed meal until a thick black mud forms. Apply 1/4-inch thick over the splinter, boil, or venomous bite. Cover with plastic wrap and gauze to prevent drying.',
      warning: '<strong style="color:#ffd700;">Adsorption Mechanism:</strong> Activated charcoal possesses an immense internal surface area (~1000 m²/g) that electrostatically adsorbs micro-toxins and foreign debris via van der Waals forces.'
    },
    'castor': {
      type: 'Fomentation Compress',
      temp: 'Heated with Pack',
      duration: '45–60 Mins',
      protocol: 'Fold unbleached wool flannel into 3–4 layers. Saturate thoroughly with organic cold-pressed, hexane-free Castor Oil (<em>Ricinus communis</em>) until damp but not dripping. Place over lower abdomen or liver. Cover with parchment paper, apply a warm water bottle or heating pad on medium.',
      warning: '<strong style="color:#ffd700;">Safety Rule:</strong> Do not use castor oil packs during active menstruation, internal bleeding, or pregnancy. Ricinoleic acid penetrates transdermally to stimulate local lymphatic and smooth muscle contractility.'
    },
    'cabbage': {
      type: 'Chilled Compress',
      temp: 'Chilled (Refrigerator)',
      duration: '20–30 Mins',
      protocol: 'Take large green Savoy or green cabbage leaves. Slice off thick central rib. Crush leaves firmly with a rolling pin until leaf cells break and release juice. Mold leaves directly around the swollen knee joint or breast. Wrap with an elastic bandage to hold in place.',
      warning: '<strong style="color:#00ffcc;">Anti-Inflammatory Action:</strong> Cold cabbage leaves deliver sinigrin, rapine, and mustard oil glycosides alongside local cryotherapy to relieve vascular engorgement.'
    }
  };

  function update() {
    const cur = data[selectEl.value] || data['plantain'];
    typeEl.textContent = cur.type;
    tempEl.textContent = cur.temp;
    durationEl.textContent = cur.duration;
    protocolEl.innerHTML = cur.protocol;
    warningBox.innerHTML = cur.warning;
  }

  selectEl.addEventListener('change', update);
  update();
})();
</script>
