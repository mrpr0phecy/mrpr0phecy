<h2 id="stkg-title" style="margin-top:0;color:var(--accent);">⚖️ Stone, Pounds ⇄ kg</h2>

<form aria-describedby="stkg-desc" onsubmit="event.preventDefault();">
  <p id="stkg-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Convert body weight between stone &amp; pounds, pounds, kilograms and grams. One stone is 14 lb; one avoirdupois pound is exactly 0.45359237 kg.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="stkg-st" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Stone</label>
      <input id="stkg-st" type="number" min="0" step="1" value="12" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="stkg-lb" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Pounds (extra)</label>
      <input id="stkg-lb" type="number" min="0" max="42" step="any" value="8" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="stkg-totlb" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Total pounds</label>
      <input id="stkg-totlb" type="number" min="0" step="any" value="176" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="stkg-kg" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Kilograms</label>
      <input id="stkg-kg" type="number" min="0" step="any" value="79.83" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="stkg-g" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Grams</label>
      <input id="stkg-g" type="number" min="0" step="any" value="79832" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="stkg-out" style="margin-top:14px;font-size:.84rem;color:var(--text);"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var LB = 0.45359237;
  var lock = false;
  function round(v, d) { return Number(v.toFixed(d)); }
  function applyKg(kg) {
    if (!(kg >= 0) || lock) return;
    var totalLb = kg / LB;
    var st = Math.floor(totalLb / 14);
    var lb = totalLb - st * 14;
    lock = true;
    $('stkg-kg').value = round(kg, 2);
    $('stkg-g').value = round(kg * 1000, 0);
    $('stkg-totlb').value = round(totalLb, 2);
    $('stkg-st').value = st;
    $('stkg-lb').value = round(lb, 2);
    lock = false;
    $('stkg-out').textContent = st + ' st ' + round(lb, 1) + ' lb  =  ' + round(kg, 2) + ' kg  =  ' + round(totalLb, 1) + ' lb';
  }
  $('stkg-st').addEventListener('input', function () { applyKg((Number($('stkg-st').value) * 14 + Number($('stkg-lb').value)) * LB); });
  $('stkg-lb').addEventListener('input', function () { applyKg((Number($('stkg-st').value) * 14 + Number($('stkg-lb').value)) * LB); });
  $('stkg-totlb').addEventListener('input', function () { applyKg(Number($('stkg-totlb').value) * LB); });
  $('stkg-kg').addEventListener('input', function () { applyKg(Number($('stkg-kg').value)); });
  $('stkg-g').addEventListener('input', function () { applyKg(Number($('stkg-g').value) / 1000); });
  applyKg(12 * 14 * LB + 8 * LB);
})();
</script>
