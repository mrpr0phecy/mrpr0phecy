<h2 id="aspect-ratio-resizer-title" style="margin-top:0;color:var(--accent);">📐 AspectScale: Video & Image Dimension Calculator</h2>

<form aria-describedby="aspect-ratio-resizer-desc" onsubmit="event.preventDefault();">
  <p id="aspect-ratio-resizer-desc" class="small" style="color:var(--muted);margin-bottom:16px;">
    Calculate pixel dimensions while locking exact aspect ratios (16:9 widescreen, 9:16 vertical TikTok/Shorts, 4:3 classic, 1:1 square, 21:9 cinema). Generates modern CSS `aspect-ratio` code snippets.
  </p>

  <!-- Ratio Preset Buttons -->
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
    <button type="button" class="ar-preset-btn active" data-w="16" data-h="9" style="padding:6px 14px;border-radius:6px;background:rgba(0,255,204,0.15);border:1px solid #00ffcc;color:#e6faff;font-size:0.8rem;font-weight:700;cursor:pointer;">
      16:9 (YouTube / HD)
    </button>
    <button type="button" class="ar-preset-btn" data-w="9" data-h="16" style="padding:6px 14px;border-radius:6px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#e6faff;font-size:0.8rem;cursor:pointer;">
      9:16 (TikTok / Reels)
    </button>
    <button type="button" class="ar-preset-btn" data-w="1" data-h="1" style="padding:6px 14px;border-radius:6px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#e6faff;font-size:0.8rem;cursor:pointer;">
      1:1 (Instagram / Square)
    </button>
    <button type="button" class="ar-preset-btn" data-w="4" data-h="3" style="padding:6px 14px;border-radius:6px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#e6faff;font-size:0.8rem;cursor:pointer;">
      4:3 (Classic TV)
    </button>
    <button type="button" class="ar-preset-btn" data-w="21" data-h="9" style="padding:6px 14px;border-radius:6px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#e6faff;font-size:0.8rem;cursor:pointer;">
      21:9 (Cinematic Ultrawide)
    </button>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;">
    <div>
      <label for="ar-width-input" style="display:block;font-size:0.8rem;font-weight:600;color:var(--text);margin-bottom:4px;">
        Width (Pixels):
      </label>
      <input type="number" id="ar-width-input" value="1920" step="2" style="width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);color:inherit;font-family:monospace;font-size:1rem;">
    </div>

    <div>
      <label for="ar-height-input" style="display:block;font-size:0.8rem;font-weight:600;color:var(--text);margin-bottom:4px;">
        Height (Pixels):
      </label>
      <input type="number" id="ar-height-input" value="1080" step="2" style="width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);color:inherit;font-family:monospace;font-size:1rem;">
    </div>
  </div>

  <!-- Visual Preview Box -->
  <div style="background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:20px;display:flex;align-items:center;justify-content:center;min-height:160px;margin-bottom:16px;">
    <div id="ar-preview-box" style="width:200px;height:112.5px;background:linear-gradient(135deg,rgba(0,255,204,0.2),rgba(176,38,255,0.2));border:2px dashed #00ffcc;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;color:#e6faff;transition:all 0.2s;">
      1920 × 1080 (16:9)
    </div>
  </div>

  <!-- CSS Code Snippet -->
  <div style="background:rgba(14,21,37,0.85);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:12px;display:flex;justify-content:space-between;align-items:center;">
    <code id="ar-css-snippet" style="font-family:'JetBrains Mono',monospace;font-size:0.8rem;color:#ffd700;">aspect-ratio: 16 / 9;</code>
    <button type="button" id="copy-ar-css" style="padding:4px 10px;border-radius:4px;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:0.75rem;cursor:pointer;">Copy CSS</button>
  </div>
</form>

<script>
(function() {
  let ratioW = 16;
  let ratioH = 9;

  const wInput = document.getElementById('ar-width-input');
  const hInput = document.getElementById('ar-height-input');
  const previewBox = document.getElementById('ar-preview-box');
  const cssSnippet = document.getElementById('ar-css-snippet');
  const copyBtn = document.getElementById('copy-ar-css');

  function updateFromWidth() {
    const w = parseFloat(wInput.value) || 1;
    const h = Math.round((w * ratioH) / ratioW);
    hInput.value = h;
    render();
  }

  function updateFromHeight() {
    const h = parseFloat(hInput.value) || 1;
    const w = Math.round((h * ratioW) / ratioH);
    wInput.value = w;
    render();
  }

  function render() {
    const w = parseInt(wInput.value, 10);
    const h = parseInt(hInput.value, 10);
    previewBox.textContent = `${w} × ${h} (${ratioW}:${ratioH})`;

    // Scale visual preview inside max 220x130 box
    const maxBoxW = 200;
    const maxBoxH = 130;
    const aspect = ratioW / ratioH;
    let dispW = maxBoxW;
    let dispH = dispW / aspect;
    if (dispH > maxBoxH) {
      dispH = maxBoxH;
      dispW = dispH * aspect;
    }
    previewBox.style.width = `${dispW}px`;
    previewBox.style.height = `${dispH}px`;

    cssSnippet.textContent = `aspect-ratio: ${ratioW} / ${ratioH};`;
  }

  wInput.addEventListener('input', updateFromWidth);
  hInput.addEventListener('input', updateFromHeight);

  document.querySelectorAll('.ar-preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.ar-preset-btn').forEach(b => {
        b.style.background = 'rgba(255,255,255,0.05)';
        b.style.borderColor = 'rgba(255,255,255,0.1)';
      });
      btn.style.background = 'rgba(0,255,204,0.15)';
      btn.style.borderColor = '#00ffcc';

      ratioW = parseFloat(btn.dataset.w);
      ratioH = parseFloat(btn.dataset.h);
      updateFromWidth();
    });
  });

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(cssSnippet.textContent);
    copyBtn.textContent = 'Copied!';
    setTimeout(() => copyBtn.textContent = 'Copy CSS', 1500);
  });

  render();
})();
</script>
