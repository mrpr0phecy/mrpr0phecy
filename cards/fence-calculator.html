<!-- cards/fence-calculator.html -->
<h2 id="fnccalc-title" style="margin-top:0;color:var(--accent);">🏗️ Fence Calculator</h2>

<form aria-describedby="fnccalc-desc" onsubmit="event.preventDefault();">
  <p id="fnccalc-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Calculate posts, panels, gravel boards, concrete, and total cost for a garden fence. Works for panel fencing, closeboard, and picket styles.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="fnccalc-len" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Fence Length (m)</label>
      <input id="fnccalc-len" type="number" step="0.1" min="1" value="12" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;box-sizing:border-box;">
    </div>
    <div>
      <label for="fnccalc-height" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Fence Height</label>
      <select id="fnccalc-height" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="0.9">0.9m (3ft) — low boundary</option>
        <option value="1.2">1.2m (4ft) — front garden</option>
        <option value="1.5" selected>1.5m (5ft) — standard rear garden</option>
        <option value="1.8">1.8m (6ft) — maximum without permission</option>
        <option value="2.0">2.0m (6.5ft) — needs planning permission</option>
      </select>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
    <div>
      <label for="fnccalc-type" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Fence Type</label>
      <select id="fnccalc-type" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="panel" selected>Panel Fence (featheredge or lap)</option>
        <option value="closeboard">Closeboard (built on site)</option>
        <option value="picket">Picket / Palisade</option>
        <option value="hit-miss">Hit & Miss (modern)</option>
      </select>
    </div>
    <div>
      <label for="fnccalc-post" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Post Size</label>
      <select id="fnccalc-post" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="75">75×75 mm (light fencing)</option>
        <option value="100" selected>100×100 mm (standard)</option>
        <option value="125">125×125 mm (heavy / tall fencing)</option>
      </select>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
    <div>
      <label for="fnccalc-panel" style="display:block;margin-bottom:4px;color:var(--accent);font-size:0.85rem;font-weight:600;">Panel Width</label>
      <select id="fnccalc-panel" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
        <option value="1.83" selected>1.83m (6ft) — standard</option>
        <option value="1.8">1.8m (metric)</option>
      </select>
    </div>
    <div>
      <label style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.85rem;cursor:pointer;margin-top:22px;">
        <input type="checkbox" id="fnccalc-gravel" checked style="accent-color:var(--accent);"> Include gravel boards
      </label>
    </div>
  </div>

  <button type="button" onclick="fnccalcCalc()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🏗️ Calculate Fence Materials
  </button>

  <div id="fnccalc-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;">
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(45,212,255,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">Posts</div>
        <div id="fnccalc-posts" style="font-size:1.3rem;color:var(--accent);font-weight:700;"></div>
      </div>
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(57,255,20,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">Panels / Bays</div>
        <div id="fnccalc-panels" style="font-size:1.3rem;color:#39ff14;font-weight:700;"></div>
      </div>
      <div style="text-align:center;padding:12px;border-radius:8px;background:rgba(255,215,0,0.1);">
        <div style="font-size:0.7rem;color:var(--text-secondary);">Concrete</div>
        <div id="fnccalc-concrete" style="font-size:1.3rem;color:#ffd700;font-weight:700;"></div>
      </div>
    </div>
    <div id="fnccalc-breakdown" style="font-size:0.85rem;color:var(--text);line-height:1.8;margin-bottom:10px;"></div>
    <div id="fnccalc-cost" style="font-size:1rem;color:var(--accent);font-weight:700;text-align:center;margin-bottom:8px;"></div>
    <div id="fnccalc-tips" style="font-size:0.8rem;color:var(--text-secondary);line-height:1.6;"></div>
  </div>
</form>

<script>
(function(){
  window.fnccalcCalc=function(){
    var len=parseFloat(document.getElementById('fnccalc-len').value);
    var height=parseFloat(document.getElementById('fnccalc-height').value);
    var type=document.getElementById('fnccalc-type').value;
    var postSize=parseInt(document.getElementById('fnccalc-post').value);
    var panelW=parseFloat(document.getElementById('fnccalc-panel').value);
    var gravel=document.getElementById('fnccalc-gravel').checked;
    var numPanels=Math.ceil(len/panelW);
    var numPosts=numPanels+1;
    var postLen=height+0.6;
    var postVol=Math.pow(postSize/1000,2)*0.6;
    var concretePerPost=postVol*1.5;
    var totalConcrete=concretePerPost*numPosts;
    var concreteBags=Math.ceil(totalConcrete/0.018);
    var gravelBoards=gravel?numPanels:0;
    var postCost=numPosts*(postSize===75?8:postSize===100?12:18);
    var panelCost=numPanels*(type==='panel'?35:type==='closeboard'?30:type==='picket'?25:40);
    var concreteCost=concreteBags*4.5;
    var gravelCost=gravelBoards*8;
    var fixingsCost=Math.ceil(numPanels*3);
    var totalCost=postCost+panelCost+concreteCost+gravelCost+fixingsCost;
    document.getElementById('fnccalc-posts').textContent=numPosts+' posts';
    document.getElementById('fnccalc-panels').textContent=numPanels+' panels';
    document.getElementById('fnccalc-concrete').textContent=concreteBags+' bags';
    document.getElementById('fnccalc-breakdown').innerHTML=
      '📏 Fence length: <strong>'+len+'m</strong> → '+numPanels+' bays × '+panelW+'m<br>'+
      '🪵 Posts: <strong>'+numPosts+' × '+postLen.toFixed(1)+'m</strong> ('+postSize+'×'+postSize+'mm, UC4 treated)<br>'+
      '🏗️ Panels: <strong>'+numPanels+' × '+height+'m</strong> '+type+' panels<br>'+
      '🧱 Concrete: <strong>'+concreteBags+' × 20kg post mix</strong> (600mm deep × 300mm dia hole)<br>'+
      (gravel?'📐 Gravel boards: <strong>'+gravelBoards+' × '+panelW+'m</strong> (150mm high, keeps panel off ground)<br>':'')+
      '🔩 Fixings: <strong>'+numPanels*3+' screws/bolts</strong>';
    document.getElementById('fnccalc-cost').innerHTML='💰 Estimated total: <strong>£'+totalCost+'</strong> (posts £'+postCost+' + panels £'+panelCost+' + concrete £'+concreteCost+(gravel?' + gravel boards £'+gravelCost:'')+' + fixings £'+fixingsCost+')';
    document.getElementById('fnccalc-tips').innerHTML='💡 <strong>Post depth rule:</strong> 1/3 of the post should be in the ground. For a 1.8m fence, use 2.4m posts (0.6m in ground).<br>💡 <strong>Check your boundary:</strong> The "good side" (flat side) should face your neighbour. Check your deeds for responsibility.<br>💡 <strong>Planning permission:</strong> In England, fences up to 2m in rear gardens and 1m adjacent to highways don\'t need permission.<br>💡 <strong>Treat cut ends:</strong> Any cut in pressure-treated timber must be re-sealed with end-grain preservative or it will rot.';
    document.getElementById('fnccalc-result').style.display='block';
  };
})();
</script>
