<!-- cards/excuse-generator.html -->
<h2 id="excgen-title" style="margin-top:0;color:var(--accent);">🙃 Professional Excuse Generator</h2>

<form aria-describedby="excgen-desc" onsubmit="event.preventDefault();">
  <p id="excgen-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Generate increasingly absurd excuses for any situation. From "plausible" to "they'll never believe you."
  </p>

  <div style="margin-bottom:16px;">
    <label for="excgen-situation" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:600;">What do you need an excuse for?</label>
    <select id="excgen-situation" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.3);background:#070f18;color:inherit;font-size:0.95rem;">
      <option value="late">Being late to work</option>
      <option value="deadline">Missing a deadline</option>
      <option value="reply">Not replying to a message</option>
      <option value="plans">Cancelling plans</option>
      <option value="homework">Not doing homework</option>
      <option value="meeting">Skipping a meeting</option>
      <option value="gym">Skipping the gym</option>
      <option value="cooking">Ordering takeaway again</option>
    </select>
  </div>

  <div style="margin-bottom:16px;">
    <label for="excgen-level" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:600;">Absurdity Level</label>
    <input id="excgen-level" type="range" min="1" max="5" value="3" style="width:100%;accent-color:var(--accent);" oninput="excgenUpdateLabel()">
    <div id="excgen-level-label" style="text-align:center;color:var(--text-secondary);font-size:0.85rem;margin-top:4px;">🤥 Barely Believable</div>
  </div>

  <button type="button" onclick="excgenGenerate()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:16px;">
    🎲 Generate Excuse
  </button>

  <div id="excgen-result" style="display:none;padding:16px;border-radius:10px;background:rgba(45,212,255,0.05);border:1px solid rgba(45,212,255,0.2);margin-bottom:12px;">
    <div id="excgen-excuse" style="font-size:1.1rem;color:var(--text);line-height:1.5;margin-bottom:8px;"></div>
    <div id="excgen-believability" style="font-size:0.8rem;color:var(--text-secondary);"></div>
  </div>

  <div id="excgen-history" style="font-size:0.8rem;color:var(--text-secondary);"></div>
</form>

<script>
(function(){
  var excgenLevels = ['🤥 Plausible','😬 Stretching It','🤪 Barely Believable','👽 Area 51 Energy','💀 They Know You\'re Lying'];
  var excgenBeliev = ['92% believable','67% believable','34% believable','8% believable','-47% believable (they\'re already screenshotting this)'];
  var excgenHistory = [];

  var excgenExcuses = {
    late: [
      ['My alarm didn\'t go off.','My neighbour\'s cat got into my house and turned off every clock.','A time traveller arrived and needed directions — I couldn\'t just say no.','I was abducted by aliens but negotiated an early release.','I got stuck in a parallel dimension where I\'m actually on time, but the portal back was delayed.'],
      ['Traffic was bad.','A flock of geese formed a picket line outside my house.','I was saving a family of ducks from a roundabout and the mother duck was VERY ungrateful.','A man was juggling flaming swords on the high street and I had to watch for safety reasons.','I entered a wormhole in the Tesco car park and emerged 40 minutes later in a different postcode.'],
      ['The bus was late.','My Uber driver turned out to be a philosophy student who wouldn\'t let me leave until we resolved the trolley problem.','I got into a taxi and the driver only spoke in riddles. I still don\'t know where I am.','I was on the Tube when a street performer started a one-man show IN the carriage and the doors wouldn\'t open until he finished his encore.','A seagull stole my Oyster card and I had to negotiate its return with breadcrumbs.']
    ],
    deadline: [
      ['I had a family emergency.','My laptop developed sentience and refused to work on anything it deemed "beneath it."','My hard drive was struck by a tiny lightning bolt — statistically improbable but emotionally devastating.','The cloud ate my file. Not a metaphor. An actual cloud flew into my window.','My project file became self-aware and deleted itself out of embarrassment.'],
      ['The scope changed midway.','I accidentally wrote the entire project in Latin and only noticed when spell-check had a breakdown.','My keyboard only types in Wingdings now. I\'ve been communicating exclusively in symbols.','I finished it but my printer printed it all in invisible ink. I\'m as shocked as you are.','My cat walked across my keyboard and somehow submitted a resignation letter to my boss instead.'],
      ['Technical difficulties.','My computer asked me an existential question and I\'ve been thinking about it ever since.','I was 99% done when a moth flew into my router and the resulting chaos corrupted everything.','My code compiled into a recipe for banana bread. I don\'t even like bananas.','The file saved itself as a .pdf of a screenshot of a photo of the screen. I can\'t open it either.']
    ],
    reply: [
      ['Sorry, just saw this!','My phone fell into a parallel dimension where messages arrive 3 days late.','I replied in my head and was genuinely shocked to learn that doesn\'t count.','I saw it, formed a perfect reply, then got distracted by a bird outside my window. That was Tuesday.','My phone\'s autocorrect changed my reply to "I DECLARE BANKRUPTCY" so I had to start over.'],
      ['My phone died.','My phone only works if I hold it at a 37-degree angle and I was busy.','I typed a reply but my thumb was too powerful and I accidentally deleted the entire conversation.','My notification sound changed to silence and I\'ve been living in blissful ignorance.','I was composing a reply when my phone updated and restarted. It\'s been "updating" for 4 days.'],
      ['I was in a meeting.','I was trapped under my weighted blanket and couldn\'t reach my phone.','My phone autocorrected "sorry" to "sourdough" and I panicked.','I read your message, nodded thoughtfully, then immediately forgot I exist.','I was in a staring contest with my cat. I lost. I\'m still processing it.']
    ],
    plans: [
      ['Something came up!','My houseplant looked sad and I can\'t leave it in this state.','I just remembered I promised my neighbour I\'d water their... thing. Their... plant. Definitely a plant.','My horoscope said "avoid social interaction" and I\'m not about to argue with the cosmos.','I accidentally put my trousers on backwards and I can\'t face the world like this.'],
      ['I\'m not feeling well.','I\'ve come down with a sudden case of "my sofa is too comfortable."','My body has decided today is a horizontal-only day. Doctor\'s orders. (I am the doctor.)','I\'m allergic to leaving the house on days that end in Y.','I\'m experiencing a rare condition where I can only communicate through memes. It wouldn\'t be fair to you.'],
      ['Family stuff.','My mum called and her tone suggested this is NOT optional.','A family of foxes moved into my garden and I need to supervise the move-in.','My nan needs help with her iPad again. She\'s trying to FaceTime the Queen.','My brother locked himself out and I\'m the only one with a spare key. He\'s 34.']
    ],
    homework: [
      ['My dog ate it.','My printer printed it in Comic Sans and I have standards.','I did it but my USB drive got magnetised by my fridge. Is that a thing? It is now.','My study playlist accidentally included a hypnosis track and I forgot everything I learned.','I completed it but my little sibling used it as a canvas for their "abstract period."'],
      ['I forgot about it.','I was abducted by a study group that turned out to be a cult. I just escaped.','My textbook spontaneously combusted. Page 47 was always suspicious.','I did the wrong homework. All 47 pages of it. For a class I\'m not even in.','My WiFi went down and I had to do it "offline" which, honestly, felt barbaric.'],
      ['I didn\'t understand it.','I asked ChatGPT and it started crying.','The textbook is written in a language that appears to be English but follows no known grammar rules.','I spent 6 hours on question 1 and it turns out I was reading the answer key.','My brain filed the information under "things we\'ll never need" and I can\'t find the folder.']
    ],
    meeting: [
      ['I have a conflict.','My calendar app scheduled two meetings at once and I chose the one with better snacks.','I\'m stuck in another meeting that was supposed to end 20 minutes ago but someone asked "one more question."','I double-booked with my "staring at the wall" time and honestly that\'s winning.','My Outlook crashed and I\'ve been living appointment-free ever since. It\'s liberating.'],
      ['Technical issues.','My camera only works if I sit in a specific chair at a specific angle and today that chair is occupied by my cat.','Zoom updated and now I look like a potato. I\'m not ready for that kind of exposure.','My microphone only picks up the sound of me breathing, which is apparently "unsettling."','I joined the meeting but was on mute for 45 minutes. By the time I realised, it felt too late.'],
      ['I forgot.','I was in the zone and my brain decided "the zone" doesn\'t include calendar notifications.','I saw the meeting invite, thought "I\'ll remember that," and my brain immediately deleted the file.','My phone reminded me 15 minutes before and I thought "plenty of time" and then 45 minutes vanished.','I was preparing for the meeting so hard I missed the meeting.']
    ],
    gym: [
      ['I\'m resting today.','My fitness tracker judged me so hard I had to take it off. We\'re not speaking.','I read that rest days are important and I\'m on day 847 of my rest cycle.','My gym clothes are in the wash. All 12 outfits. Simultaneously.','I pulled a muscle reaching for the remote and I need to let it heal.'],
      ['I\'m injured.','I sneezed and something went "pop." I\'m not a doctor but that sounded expensive.','I slept funny and now my neck only turns left. The gym is to the right.','I have a paper cut on my index finger and I can\'t grip anything. It\'s basically a disability.','My fitness watch said my stress level was "concerning" so I\'m honouring its medical advice.'],
      ['No time today.','I would go but then I\'d have to shower twice and that\'s bad for the environment.','I\'m doing mental gymnastics — does that count? I\'m exhausted.','My gym buddy cancelled and going alone is basically a solo mission. I\'m not trained for that.','I burned 3 calories opening the fridge 47 times today. I think I\'m good.']
    ],
    cooking: [
      ['I\'ll cook tomorrow.','The oven and I had a disagreement and we need space.','I was going to cook but then I remembered I\'m terrible at it and saved us all.','My kitchen is currently a crime scene from last night\'s "experiment." Nobody should go in there.','I read the recipe and step 1 was "season to taste." I don\'t know my taste. I need time to reflect.'],
      ['It\'s healthier this way.','This takeaway has vegetables in it. The sauce is basically a salad.','I\'m supporting local businesses. I\'m basically a philanthropist.','I\'m doing a cultural immersion study through cuisine. It\'s educational.','The delivery driver is my friend now. If I cook, he loses his job. I won\'t do that to Marcus.'],
      ['The kitchen is broken.','My fridge is making a sound like a dying whale and I don\'t want to provoke it.','I turned on the cooker and all the lights in the house flickered. I\'m not an electrician.','A spider the size of a small dog has claimed the kitchen. It\'s his now.','My smoke alarm went off when I boiled water. Even the house knows I shouldn\'t cook.']
    ]
  };

  window.excgenUpdateLabel = function() {
    var v = parseInt(document.getElementById('excgen-level').value) - 1;
    document.getElementById('excgen-level-label').textContent = excgenLevels[v];
  };

  window.excgenGenerate = function() {
    var sit = document.getElementById('excgen-situation').value;
    var lvl = parseInt(document.getElementById('excgen-level').value) - 1;
    var pool = excgenExcuses[sit];
    var excuse = pool[Math.floor(Math.random() * pool.length)][lvl];

    document.getElementById('excgen-excuse').textContent = '"' + excuse + '"';
    document.getElementById('excgen-believability').textContent = '📊 Believability: ' + excgenBeliev[lvl];
    document.getElementById('excgen-result').style.display = 'block';

    excgenHistory.unshift(excuse);
    if (excgenHistory.length > 5) excgenHistory.pop();
    var histHtml = '<strong style="color:var(--accent);">Recent Excuses:</strong><br>';
    for (var i = 0; i < excgenHistory.length; i++) {
      histHtml += (i+1) + '. ' + excgenHistory[i] + '<br>';
    }
    document.getElementById('excgen-history').innerHTML = histHtml;
  };
})();
</script>
