<h2 id="prem-title" style="margin-top:0;color:var(--accent);">↔️ px ⇄ rem ⇄ em Converter</h2>

<form aria-describedby="prem-desc" onsubmit="event.preventDefault();">
  <p id="prem-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Convert CSS lengths between pixels, rem and em for a chosen root and parent font size. Defaults to the browser 16 px root. Copy-ready declarations, no build step.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="prem-px" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Pixels</label>
      <input id="prem-px" type="number" min="0" step="any" value="16" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="prem-rem" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">rem</label>
      <input id="prem-rem" type="number" min="0" step="any" value="1" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="prem-em" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">em</label>
      <input id="prem-em" type="number" min="0" step="any" value="1" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="prem-root" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Root font-size (px)</label>
      <input id="prem-root" type="number" min="1" step="any" value="16" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="prem-parent" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Parent font-size (px)</label>
      <input id="prem-parent" type="number" min="1" step="any" value="16" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="prem-css" style="margin-top:14px;padding:12px;border-radius:10px;background:#071019;border:1px solid rgba(45,212,255,.28);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.82rem;color:#91f7ff;overflow-wrap:anywhere;"></div>
<button type="button" id="prem-copy" style="margin-top:10px;padding:8px 12px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:700;">Copy CSS</button>
<div id="prem-scale" style="margin-top:12px;font-size:.8rem;color:var(--text-secondary);"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var lock = false;
  var lastCss = '';

  function trim(n) { return String(Number(n.toFixed(4))); }
  function fromPx() {
    if (lock) return;
    var px = Number($('prem-px').value), root = Number($('prem-root').value), parent = Number($('prem-parent').value);
    if (!(px >= 0 && root > 0 && parent > 0)) return;
    lock = true;
    $('prem-rem').value = trim(px / root);
    $('prem-em').value = trim(px / parent);
    lock = false;
    paint(px, root, parent);
  }
  function fromRem() {
    if (lock) return;
    var rem = Number($('prem-rem').value), root = Number($('prem-root').value), parent = Number($('prem-parent').value);
    if (!(rem >= 0 && root > 0 && parent > 0)) return;
    var px = rem * root;
    lock = true;
    $('prem-px').value = trim(px);
    $('prem-em').value = trim(px / parent);
    lock = false;
    paint(px, root, parent);
  }
  function fromEm() {
    if (lock) return;
    var em = Number($('prem-em').value), root = Number($('prem-root').value), parent = Number($('prem-parent').value);
    if (!(em >= 0 && root > 0 && parent > 0)) return;
    var px = em * parent;
    lock = true;
    $('prem-px').value = trim(px);
    $('prem-rem').value = trim(px / root);
    lock = false;
    paint(px, root, parent);
  }
  function paint(px, root, parent) {
    lastCss = 'font-size: ' + trim(px / root) + 'rem; /* ' + trim(px) + 'px at ' + trim(root) + 'px root, ' + trim(px / parent) + 'em of ' + trim(parent) + 'px parent */';
    $('prem-css').textContent = lastCss;
    var steps = [10, 12, 14, 16, 18, 20, 24, 32, 48];
    $('prem-scale').innerHTML = 'Common sizes at this root: ' + steps.map(function (s) {
      return s + 'px = ' + trim(s / root) + 'rem';
    }).join(' · ');
  }
  $('prem-px').addEventListener('input', fromPx);
  $('prem-rem').addEventListener('input', fromRem);
  $('prem-em').addEventListener('input', fromEm);
  $('prem-root').addEventListener('input', fromPx);
  $('prem-parent').addEventListener('input', fromPx);
  $('prem-copy').addEventListener('click', function () {
    var btn = this;
    function done() { btn.textContent = '✓ Copied'; setTimeout(function () { btn.textContent = 'Copy CSS'; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(lastCss).then(done);
    else done();
  });
  fromPx();
})();
</script>
