<h2 id="pool-title" style="margin-top:0;color:var(--accent);">🏊 Pool &amp; Spa Volume</h2>

<form aria-describedby="pool-desc" onsubmit="event.preventDefault();">
  <p id="pool-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Litres and gallons from length, width and average depth. Rectangular, circular and oval. Chemical dosing is per 1,000 litres — this is volume only, not a treatment plan.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="pool-shape" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Shape</label>
      <select id="pool-shape" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="rect">Rectangle</option>
        <option value="circle">Circle</option>
        <option value="oval">Oval</option>
      </select>
    </div>
    <div>
      <label for="pool-u" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Units</label>
      <select id="pool-u" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="m">metres</option>
        <option value="ft">feet</option>
      </select>
    </div>
    <div>
      <label for="pool-l" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Length / diameter</label>
      <input id="pool-l" type="number" min="0" step="any" value="10" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="pool-w" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Width (rect/oval)</label>
      <input id="pool-w" type="number" min="0" step="any" value="5" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="pool-d" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Average depth</label>
      <input id="pool-d" type="number" min="0" step="any" value="1.5" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="pool-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var L = Number($('pool-l').value), W = Number($('pool-w').value), D = Number($('pool-d').value);
    if (!(L > 0 && D > 0)) return;
    if ($('pool-u').value === 'ft') { L *= 0.3048; W *= 0.3048; D *= 0.3048; }
    var shape = $('pool-shape').value;
    var m3;
    if (shape === 'circle') m3 = Math.PI * Math.pow(L / 2, 2) * D;
    else if (shape === 'oval') m3 = Math.PI * (L / 2) * (W / 2) * D;
    else m3 = L * W * D;
    var litres = m3 * 1000;
    var ukGal = litres / 4.54609;
    var usGal = litres / 3.785411784;
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('pool-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Volume', m3.toFixed(2) + ' m³') +
      cell('Litres', Math.round(litres).toLocaleString() + ' L') +
      cell('UK gallons', Math.round(ukGal).toLocaleString()) +
      cell('US gallons', Math.round(usGal).toLocaleString()) +
      cell('Per 10 cm fill', Math.round(litres / D * 0.1).toLocaleString() + ' L') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Average depth = (shallow + deep) ÷ 2 for a sloping floor. Freeboard and Roman ends are ignored.</p>';
  }
  ['pool-shape', 'pool-u', 'pool-l', 'pool-w', 'pool-d'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
