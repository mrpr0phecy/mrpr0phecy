<h2 id="dltm-title" style="margin-top:0;color:var(--accent);">⬇️ Download Time Calculator</h2>

<form aria-describedby="dltm-desc" onsubmit="event.preventDefault();">
  <p id="dltm-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Time = file size × 8 / bitrate. ISPs advertise megabits (Mb/s), files are megabytes (MB). Real transfers are slower than the headline speed because of protocol overhead and Wi-Fi.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="dltm-size" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">File size</label>
      <input id="dltm-size" type="number" min="0" step="any" value="4.7" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="dltm-su" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Size unit</label>
      <select id="dltm-su" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="1e6">MB</option>
        <option value="1e9" selected>GB</option>
        <option value="1e12">TB</option>
        <option value="1">bytes</option>
      </select>
    </div>
    <div>
      <label for="dltm-spd" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Link speed</label>
      <input id="dltm-spd" type="number" min="0" step="any" value="50" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="dltm-spu" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Speed unit</label>
      <select id="dltm-spu" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="1e6" selected>Mbps (megabits)</option>
        <option value="1e9">Gbps</option>
        <option value="8e6">MB/s (megabytes)</option>
        <option value="1e3">kbps</option>
      </select>
    </div>
  </div>
</form>
<div id="dltm-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function fmt(sec) {
    if (!(sec >= 0) || !isFinite(sec)) return '—';
    if (sec < 1) return (sec * 1000).toFixed(0) + ' ms';
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.round(sec % 60);
    if (h) return h + ' h ' + m + ' min';
    if (m) return m + ' min ' + s + ' s';
    return s + ' s';
  }
  function run() {
    var size = Number($('dltm-size').value) * Number($('dltm-su').value);
    var bitsPerSec = Number($('dltm-spd').value) * Number($('dltm-spu').value);
    if (!(size >= 0 && bitsPerSec > 0)) return;
    var bits = size * 8;
    var t = bits / bitsPerSec;
    var t90 = bits / (bitsPerSec * 0.9);
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('dltm-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Ideal time', fmt(t)) +
      cell('At 90% of headline', fmt(t90)) +
      cell('At 50% (Wi-Fi-ish)', fmt(bits / (bitsPerSec * 0.5))) +
      cell('File', (size / 1e6).toFixed(1) + ' MB  (' + (size * 8 / 1e6).toFixed(0) + ' Mbit)') +
      '</div>';
  }
  ['dltm-size', 'dltm-su', 'dltm-spd', 'dltm-spu'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
