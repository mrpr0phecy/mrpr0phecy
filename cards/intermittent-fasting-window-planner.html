<h2 id="ifst-title" style="margin-top:0;color:var(--accent);">⏳ Intermittent Fasting Window</h2>

<form aria-describedby="ifst-desc" onsubmit="event.preventDefault();">
  <p id="ifst-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Pick a 16:8, 18:6, 20:4 or custom fast and see today’s eat-from / eat-until times. Educational scheduling only — not medical advice, and not for anyone who is pregnant, under 18, or has an eating-disorder history without a clinician.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="ifst-pat" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Pattern</label>
      <select id="ifst-pat" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="16">16:8 — 16 h fast, 8 h eat</option>
        <option value="18">18:6</option>
        <option value="20">20:4</option>
        <option value="23">OMAD 23:1</option>
        <option value="14">14:10 (gentler)</option>
      </select>
    </div>
    <div>
      <label for="ifst-start" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">First bite today</label>
      <input id="ifst-start" type="time" value="12:00" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="ifst-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function pad(n) { return String(n).padStart(2, '0'); }
  function addMin(hhmm, min) {
    var p = hhmm.split(':');
    var t = Number(p[0]) * 60 + Number(p[1]) + min;
    t = ((t % 1440) + 1440) % 1440;
    return pad(Math.floor(t / 60)) + ':' + pad(t % 60);
  }
  function run() {
    var fast = Number($('ifst-pat').value);
    var eatH = 24 - fast;
    var start = $('ifst-start').value || '12:00';
    var stop = addMin(start, eatH * 60);
    var next = addMin(stop, fast * 60);
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('ifst-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Eating window', eatH + ' hours') +
      cell('Eat from', start) +
      cell('Kitchen closes', stop) +
      cell('Next first bite', next) +
      cell('Fast length', fast + ' hours') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Black coffee, tea and water are usually allowed in the fast; anything with calories starts the clock. If you feel faint, eat.</p>';
  }
  $('ifst-pat').addEventListener('change', run);
  $('ifst-start').addEventListener('input', run);
  run();
})();
</script>
