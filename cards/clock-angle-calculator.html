<h2 id="clkang-title" style="margin-top:0;color:var(--accent);">🕐 Clock Angle Calculator</h2>

<form aria-describedby="clkang-desc" onsubmit="event.preventDefault();">
  <p id="clkang-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Angle between hour and minute hands. Minute hand = 6° × minutes. Hour hand = 0.5° × (60×hours + minutes). The smaller angle is min(θ, 360 − θ).
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="clkang-h" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Hour</label>
      <input id="clkang-h" type="number" min="0" max="23" step="1" value="3" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="clkang-m" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Minute</label>
      <input id="clkang-m" type="number" min="0" max="59" step="1" value="15" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="clkang-s" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Second</label>
      <input id="clkang-s" type="number" min="0" max="59" step="1" value="0" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="clkang-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var h = Number($('clkang-h').value) % 12;
    var m = Number($('clkang-m').value), s = Number($('clkang-s').value);
    if (!isFinite(h) || !isFinite(m) || !isFinite(s)) {
      $('clkang-out').textContent = 'Enter a time.';
      return;
    }
    var min = m + s / 60;
    var hourAng = 0.5 * (60 * h + min);
    var minAng = 6 * min;
    var secAng = 6 * s;
    var hm = Math.abs(hourAng - minAng);
    hm = Math.min(hm, 360 - hm);
    var hs = Math.abs(hourAng - secAng);
    hs = Math.min(hs, 360 - hs);
    var ms = Math.abs(minAng - secAng);
    ms = Math.min(ms, 360 - ms);
    $('clkang-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Hour–minute', hm.toFixed(2) + '°') +
      cell('The reflex', (360 - hm).toFixed(2) + '°') +
      cell('Hour–second', hs.toFixed(2) + '°') +
      cell('Minute–second', ms.toFixed(2) + '°') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Hands overlap around 1:05, 2:10, 3:16… and sit at right angles 22 times in 12 hours. Formula assumes a continuous analogue sweep.</p>';
  }
  ['clkang-h', 'clkang-m', 'clkang-s'].forEach(function (id) { $(id).addEventListener('input', run); });
  run();
})();
</script>
