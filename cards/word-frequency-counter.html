<h2 id="kwds-title" style="margin-top:0;color:var(--accent);">📊 Keyword Density &amp; Word Frequency</h2>

<form aria-describedby="kwds-desc" onsubmit="event.preventDefault();">
  <p id="kwds-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Paste copy and see word count, the densest terms, and an optional target keyword’s density. Counts are local and crude (no stemming). Density is a diagnostic, not a Google ranking lever — stuffing still reads badly.
  </p>
  <label for="kwds-text" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Text</label>
  <textarea id="kwds-text" rows="7" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-size:.85rem;">The quick brown fox jumps over the lazy dog. The fox is quick and the dog is lazy.</textarea>
  <div style="margin-top:10px;">
    <label for="kwds-key" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Target keyword (optional)</label>
    <input id="kwds-key" type="text" placeholder="fox" style="width:100%;max-width:280px;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
  </div>
</form>
<div id="kwds-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var STOP = { the:1, a:1, an:1, and:1, or:1, of:1, to:1, in:1, on:1, for:1, is:1, it:1, that:1, this:1, with:1, as:1, at:1, by:1, from:1, be:1, are:1, was:1, were:1 };
  function run() {
    var text = $('kwds-text').value || '';
    var words = text.toLowerCase().match(/[a-z0-9']+/g) || [];
    var chars = text.replace(/\s/g, '').length;
    var freq = {};
    words.forEach(function (w) { freq[w] = (freq[w] || 0) + 1; });
    var ranked = Object.keys(freq).filter(function (w) { return !STOP[w] && w.length > 1; }).sort(function (a, b) { return freq[b] - freq[a]; }).slice(0, 8);
    var key = ($('kwds-key').value || '').toLowerCase().trim();
    var keyCount = 0;
    if (key) {
      var re = new RegExp('\\b' + key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi');
      keyCount = (text.match(re) || []).length;
    }
    var rows = ranked.map(function (w) {
      var d = words.length ? (freq[w] / words.length * 100) : 0;
      return '<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.82rem;"><span>' + w + '</span><span style="color:var(--accent);">' + freq[w] + ' · ' + d.toFixed(1) + '%</span></div>';
    }).join('');
    $('kwds-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px;">' +
      [['Words', words.length], ['Characters', chars], ['Unique', Object.keys(freq).length], ['Keyword hits', key ? keyCount + (words.length ? ' · ' + (keyCount / words.length * 100).toFixed(1) + '%' : '') : '—']].map(function (row) {
        return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + row[0] + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + row[1] + '</div></div>';
      }).join('') + '</div>' + (rows || '<p style="font-size:.8rem;color:var(--text-secondary);">No words yet.</p>');
  }
  $('kwds-text').addEventListener('input', run);
  $('kwds-key').addEventListener('input', run);
  run();
})();
</script>
