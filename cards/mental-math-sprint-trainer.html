<h2 id="mms-title" style="margin-top:0;color:var(--accent);">🧮 Mental-Math Sprint</h2>
<p id="mms-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;">A 60-second arithmetic workout with three difficulty levels, streak bonuses and a review of every question you missed. Sharpens everyday number sense — tips, change, discounts.</p>

<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:12px;">
  <div><label for="mms-level" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:4px;">Level</label>
    <select id="mms-level" style="padding:9px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
      <option value="0">🟢 Easy: + and −</option>
      <option value="1">🟡 Medium: × and ÷</option>
      <option value="2">🔴 Hard: squares &amp; %</option>
    </select></div>
  <button type="button" id="mms-go" style="padding:10px 22px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-weight:800;">▶ Start 60s sprint</button>
  <span style="font-size:.8rem;color:var(--text-secondary);">Best: 🟢<b id="mms-b0" style="color:var(--text);">0</b> 🟡<b id="mms-b1" style="color:var(--text);">0</b> 🔴<b id="mms-b2" style="color:var(--text);">0</b></span>
</div>

<div style="background:#071019;border:1px solid rgba(45,212,255,.3);border-radius:12px;padding:18px;text-align:center;">
  <div style="display:flex;justify-content:space-between;font-size:.85rem;color:var(--text-secondary);margin-bottom:8px;flex-wrap:wrap;gap:6px;">
    <span>⏱ <b id="mms-time" style="color:var(--text);font-size:1.05rem;">60</b>s</span>
    <span>Score <b id="mms-score" style="color:var(--accent);font-size:1.05rem;">0</b></span>
    <span>🔥 Streak <b id="mms-streak" style="color:#ffb347;">0</b></span>
  </div>
  <div style="height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-bottom:14px;"><div id="mms-bar" style="height:100%;width:100%;background:var(--accent);border-radius:99px;transition:width 1s linear;"></div></div>
  <div id="mms-q" style="font-size:2.1rem;font-weight:800;margin-bottom:12px;">Press start!</div>
  <form id="mms-form" onsubmit="event.preventDefault();" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
    <input id="mms-ans" type="text" inputmode="numeric" autocomplete="off" placeholder="Your answer" aria-label="Your answer" style="width:180px;padding:11px;border-radius:8px;background:#0b1722;color:var(--text);border:1px solid rgba(255,255,255,.2);font-size:1.1rem;text-align:center;font-weight:700;" disabled>
    <button type="submit" id="mms-ok" style="padding:11px 20px;background:var(--accent);color:#071019;border:0;border-radius:8px;cursor:pointer;font-weight:800;" disabled>✓</button>
  </form>
  <div id="mms-fb" style="min-height:1.6em;margin-top:8px;font-weight:700;font-size:.9rem;" aria-live="polite"></div>
</div>

<div id="mms-end" style="display:none;margin-top:12px;background:rgba(57,255,20,.06);border:1px solid rgba(57,255,20,.3);border-radius:10px;padding:14px;"></div>
<div id="mms-missed" style="display:none;margin-top:10px;background:rgba(255,77,77,.05);border:1px solid rgba(255,77,77,.25);border-radius:10px;padding:14px;"></div>

<script>
(function(){
  function $(id){ return document.getElementById(id); }
  function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
  function gen(level){
    var a, b, q, ans;
    if (level === 0) {
      a = rnd(4, 49); b = rnd(4, 49);
      if (Math.random() < 0.5) { q = a + " + " + b; ans = a + b; }
      else { if (b > a) { var t = a; a = b; b = t; } q = a + " − " + b; ans = a - b; }
    } else if (level === 1) {
      var r = Math.random();
      if (r < 0.4) { a = rnd(3, 12); b = rnd(3, 12); q = a + " × " + b; ans = a * b; }
      else if (r < 0.7) { b = rnd(3, 12); ans = rnd(3, 12); a = b * ans; q = a + " ÷ " + b; }
      else { a = rnd(25, 199); b = rnd(25, 199); if (Math.random() < 0.5) { q = a + " + " + b; ans = a + b; } else { if (b > a) { var t2 = a; a = b; b = t2; } q = a + " − " + b; ans = a - b; } }
    } else {
      var r2 = Math.random();
      if (r2 < 0.3) { a = rnd(11, 20); q = a + "²"; ans = a * a; }
      else if (r2 < 0.55) { var p = pick([5, 10, 15, 20, 25, 50]); b = rnd(2, 40) * 10; q = p + "% of " + b; ans = Math.round(p / 100 * b); }
      else if (r2 < 0.8) { a = rnd(12, 99); b = rnd(3, 9); q = a + " × " + b; ans = a * b; }
      else { a = rnd(101, 499); b = rnd(101, 499); if (Math.random() < 0.5) { q = a + " + " + b; ans = a + b; } else { if (b > a) { var t3 = a; a = b; b = t3; } q = a + " − " + b; ans = a - b; } }
    }
    return { q: q, ans: ans };
  }
  var best = [0, 0, 0];
  try { var sb = JSON.parse(localStorage.getItem("mms-best") || "[0,0,0]"); if (Array.isArray(sb) && sb.length === 3) best = sb.map(Number); } catch (e) {}
  function paintBest(){ $("mms-b0").textContent = best[0]; $("mms-b1").textContent = best[1]; $("mms-b2").textContent = best[2]; }
  paintBest();
  var time = 60, timer = null, score = 0, streak = 0, asked = 0, right = 0, cur = null, missed = [], level = 0;
  function setRunning(on){
    $("mms-ans").disabled = !on; $("mms-ok").disabled = !on;
    $("mms-go").textContent = on ? "⏹ Give up" : "▶ Start 60s sprint";
    if (on) { $("mms-end").style.display = "none"; $("mms-missed").style.display = "none"; $("mms-ans").focus(); }
  }
  function next(){
    cur = gen(level); asked++;
    $("mms-q").textContent = cur.q + " = ?";
    $("mms-ans").value = ""; $("mms-ans").focus();
  }
  function finish(){
    clearInterval(timer); timer = null; setRunning(false);
    var acc = asked ? Math.round(right / asked * 100) : 0;
    var isBest = score > best[level];
    if (isBest) { best[level] = score; try { localStorage.setItem("mms-best", JSON.stringify(best)); } catch (e) {} paintBest(); }
    var verdict = acc >= 90 && asked >= 10 ? "🌟 Lightning brain!" : acc >= 70 ? "🎉 Strong sprint!" : acc >= 40 ? "💪 Good workout — keep going!" : "📖 Slow down and build accuracy first.";
    $("mms-end").style.display = "block";
    $("mms-end").innerHTML = "<b style='font-size:1.05rem;'>Time! " + verdict + "</b><br>Score <b style='color:var(--accent);'>" + score + "</b>" + (isBest ? " 🏆 <b>new best!</b>" : "") + " · " + right + "/" + asked + " correct · " + acc + "% accuracy";
    if (missed.length) {
      $("mms-missed").style.display = "block";
      $("mms-missed").innerHTML = "<b>📝 Review your misses (" + missed.length + "):</b><br>" + missed.map(function(m){ return "<span style='display:inline-block;margin:4px 8px 0 0;padding:4px 10px;background:rgba(0,0,0,.3);border-radius:6px;'>" + m.q + " = <b style='color:#7dff6a;'>" + m.ans + "</b> <span style='color:var(--text-secondary);'>(you: " + m.got + ")</span></span>"; }).join("");
    }
    $("mms-q").textContent = "Score: " + score;
  }
  $("mms-go").addEventListener("click", function(){
    if (timer) { finish(); return; }
    level = +$("mms-level").value;
    time = 60; score = 0; streak = 0; asked = 0; right = 0; missed = [];
    $("mms-score").textContent = "0"; $("mms-streak").textContent = "0"; $("mms-time").textContent = "60";
    $("mms-bar").style.width = "100%"; $("mms-fb").textContent = "";
    setRunning(true); next();
    timer = setInterval(function(){
      time--;
      $("mms-time").textContent = time;
      $("mms-bar").style.width = (time / 60 * 100) + "%";
      if (time <= 10) $("mms-bar").style.background = "#ff5d5d"; else $("mms-bar").style.background = "var(--accent)";
      if (time <= 0) finish();
    }, 1000);
  });
  $("mms-form").addEventListener("submit", function(){
    if (!timer || !cur) return;
    var raw = $("mms-ans").value.trim();
    if (raw === "") return;
    var got = Number(raw);
    if (got === cur.ans) {
      right++; streak++;
      var pts = 10 + Math.min(20, Math.floor(streak / 3) * 5);
      score += pts;
      $("mms-fb").innerHTML = "<span style='color:#7dff6a;'>✓ +" + pts + (streak >= 3 ? " · 🔥 streak ×" + streak : "") + "</span>";
    } else {
      streak = 0;
      missed.push({ q: cur.q, ans: cur.ans, got: raw });
      $("mms-fb").innerHTML = "<span style='color:#ff8080;'>✗ " + cur.q + " = " + cur.ans + "</span>";
    }
    $("mms-score").textContent = score; $("mms-streak").textContent = streak;
    next();
  });
})();
</script>
