<h2 id="papz-title" style="margin-top:0;color:var(--accent);">📄 Paper Size Converter</h2>

<form aria-describedby="papz-desc" onsubmit="event.preventDefault();">
  <p id="papz-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    ISO A/B/C series, US Letter/Legal/Tabloid and pixels at print DPI. A4 is 210 × 297 mm; Letter is 8.5 × 11 in. Sizes are the ISO 216 trimmed sheet, not the printable area.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="papz-size" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Sheet</label>
      <select id="papz-size" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);"></select>
    </div>
    <div>
      <label for="papz-dpi" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Pixels at DPI</label>
      <input id="papz-dpi" type="number" min="72" max="1200" value="300" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="papz-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var SIZES = [
    ['A0', 841, 1189], ['A1', 594, 841], ['A2', 420, 594], ['A3', 297, 420],
    ['A4', 210, 297], ['A5', 148, 210], ['A6', 105, 148], ['A7', 74, 105],
    ['B4', 250, 353], ['B5', 176, 250], ['B6', 125, 176],
    ['C4 envelope', 229, 324], ['C5 envelope', 162, 229], ['C6 envelope', 114, 162], ['DL envelope', 110, 220],
    ['US Letter', 215.9, 279.4], ['US Legal', 215.9, 355.6], ['US Tabloid', 279.4, 431.8],
    ['Photo 6×4 in', 101.6, 152.4], ['Photo 7×5 in', 127, 177.8], ['Photo 10×8 in', 203.2, 254]
  ];
  var sel = $('papz-size');
  sel.innerHTML = SIZES.map(function (s, i) {
    return '<option value="' + i + '"' + (s[0] === 'A4' ? ' selected' : '') + '>' + s[0] + '</option>';
  }).join('');
  function run() {
    var s = SIZES[Number(sel.value)] || SIZES[4];
    var dpi = Number($('papz-dpi').value) || 300;
    var w = s[1], h = s[2];
    var win = w / 25.4, hin = h / 25.4;
    var pxw = Math.round(win * dpi), pxh = Math.round(hin * dpi);
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('papz-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Millimetres', w + ' × ' + h + ' mm') +
      cell('Inches', win.toFixed(2) + ' × ' + hin.toFixed(2) + ' in') +
      cell('Pixels @ ' + dpi + ' DPI', pxw + ' × ' + pxh + ' px') +
      cell('Aspect', (h / w).toFixed(4) + '  (ISO A is √2 ≈ 1.414)') +
      '</div>';
  }
  sel.addEventListener('change', run);
  $('papz-dpi').addEventListener('input', run);
  run();
})();
</script>
