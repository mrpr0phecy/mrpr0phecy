<h2 id="afsz-title" style="margin-top:0;color:var(--accent);">🎧 Audio File Size</h2>

<form aria-describedby="afsz-desc" onsubmit="event.preventDefault();">
  <p id="afsz-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Uncompressed WAV/AIFF size = sample rate × channels × (bit depth ÷ 8) × seconds. MP3/AAC size ≈ bitrate × seconds ÷ 8. Headers are a few kilobytes — ignored here.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="afsz-min" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Duration (minutes)</label>
      <input id="afsz-min" type="number" min="0" step="any" value="3.5" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="afsz-sr" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Sample rate</label>
      <select id="afsz-sr" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="44100" selected>44.1 kHz (CD)</option>
        <option value="48000">48 kHz (video)</option>
        <option value="96000">96 kHz</option>
        <option value="192000">192 kHz</option>
      </select>
    </div>
    <div>
      <label for="afsz-bit" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Bit depth</label>
      <select id="afsz-bit" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="16" selected>16-bit</option>
        <option value="24">24-bit</option>
        <option value="32">32-bit float</option>
      </select>
    </div>
    <div>
      <label for="afsz-ch" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Channels</label>
      <select id="afsz-ch" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="1">Mono</option>
        <option value="2" selected>Stereo</option>
      </select>
    </div>
    <div>
      <label for="afsz-br" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Compressed kbps</label>
      <input id="afsz-br" type="number" min="32" max="320" value="320" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="afsz-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function mb(bytes) { return (bytes / 1048576).toFixed(2) + ' MB'; }
  function run() {
    var sec = Number($('afsz-min').value) * 60;
    var sr = Number($('afsz-sr').value), bit = Number($('afsz-bit').value), ch = Number($('afsz-ch').value);
    var br = Number($('afsz-br').value);
    if (!(sec >= 0 && sr > 0 && bit > 0 && ch > 0 && br > 0)) return;
    var wav = sr * ch * (bit / 8) * sec;
    var mp3 = br * 1000 / 8 * sec;
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('afsz-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Uncompressed WAV', mb(wav)) +
      cell('MP3/AAC @ ' + br + ' kbps', mb(mp3)) +
      cell('Bytes / second (WAV)', Math.round(sr * ch * bit / 8).toLocaleString()) +
      cell('Hour of WAV', mb(wav / Math.max(sec, 0.001) * 3600)) +
      '</div>';
  }
  ['afsz-min', 'afsz-sr', 'afsz-bit', 'afsz-ch', 'afsz-br'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
