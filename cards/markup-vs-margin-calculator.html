<h2 id="mkmg-title" style="margin-top:0;color:var(--accent);">💹 Markup vs Margin Calculator</h2>

<form aria-describedby="mkmg-desc" onsubmit="event.preventDefault();">
  <p id="mkmg-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Convert cost, selling price, markup and profit margin. Markup is profit ÷ cost; margin is profit ÷ selling price. Mix them up and you under-price. Nothing is stored.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="mkmg-cost" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Cost</label>
      <input id="mkmg-cost" type="number" min="0" step="any" value="80" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="mkmg-sell" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Selling price</label>
      <input id="mkmg-sell" type="number" min="0" step="any" value="100" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="mkmg-markup" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Markup %</label>
      <input id="mkmg-markup" type="number" step="any" value="25" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="mkmg-margin" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Margin %</label>
      <input id="mkmg-margin" type="number" step="any" value="20" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
  <p style="margin:8px 0 0;font-size:.72rem;color:var(--text-secondary);">Edit any field — the others follow. Cost and selling price stay in the same currency.</p>
</form>
<div id="mkmg-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var lock = false;

  function n(id) { return Number($(id).value); }
  function set(id, v) { $(id).value = isFinite(v) ? String(Number(v.toFixed(4))) : ''; }
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function paint(cost, sell) {
    var profit = sell - cost;
    var markup = cost > 0 ? profit / cost * 100 : NaN;
    var margin = sell > 0 ? profit / sell * 100 : NaN;
    var warn = margin >= 100 ? '<p style="color:#ffb8b8;font-size:.8rem;">Margin cannot be 100% or more — that would mean a zero cost.</p>' : '';
    $('mkmg-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;">' +
      cell('Profit', isFinite(profit) ? profit.toFixed(2) : '—') +
      cell('Markup', isFinite(markup) ? markup.toFixed(2) + '%' : '—') +
      cell('Margin', isFinite(margin) ? margin.toFixed(2) + '%' : '—') +
      cell('Multiplier', cost > 0 ? (sell / cost).toFixed(3) + '×' : '—') +
      '</div>' + warn +
      '<p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">25% markup on £80 is £100 (20% margin). A 25% margin on £80 is £106.67 — not the same number.</p>';
  }
  function fromCostSell() {
    if (lock) return;
    var cost = n('mkmg-cost'), sell = n('mkmg-sell');
    if (!(cost >= 0 && sell >= 0)) return;
    lock = true;
    set('mkmg-markup', cost > 0 ? (sell - cost) / cost * 100 : 0);
    set('mkmg-margin', sell > 0 ? (sell - cost) / sell * 100 : 0);
    lock = false;
    paint(cost, sell);
  }
  function fromMarkup() {
    if (lock) return;
    var cost = n('mkmg-cost'), m = n('mkmg-markup');
    if (!(cost >= 0 && isFinite(m))) return;
    var sell = cost * (1 + m / 100);
    lock = true;
    set('mkmg-sell', sell);
    set('mkmg-margin', sell > 0 ? (sell - cost) / sell * 100 : 0);
    lock = false;
    paint(cost, sell);
  }
  function fromMargin() {
    if (lock) return;
    var cost = n('mkmg-cost'), m = n('mkmg-margin');
    if (!(cost >= 0 && isFinite(m) && m < 100)) {
      if (m >= 100) $('mkmg-out').innerHTML = '<p style="color:#ffb8b8;font-size:.84rem;">Margin must be under 100%.</p>';
      return;
    }
    var sell = cost / (1 - m / 100);
    lock = true;
    set('mkmg-sell', sell);
    set('mkmg-markup', cost > 0 ? (sell - cost) / cost * 100 : 0);
    lock = false;
    paint(cost, sell);
  }
  $('mkmg-cost').addEventListener('input', fromCostSell);
  $('mkmg-sell').addEventListener('input', fromCostSell);
  $('mkmg-markup').addEventListener('input', fromMarkup);
  $('mkmg-margin').addEventListener('input', fromMargin);
  fromCostSell();
})();
</script>
