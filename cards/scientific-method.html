<h2 id="scientific-method-title" style="margin-top:0;color:var(--accent);">🔬 Scientific Method Helper</h2>

<div class="sm-container" style="font-family:inherit;color:var(--text);">
  <p class="small" style="color:rgba(230,250,255,0.7);margin-bottom:16px;">
    Work through the scientific method. Enter your experiment idea and generate a structured outline.
  </p>

  <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px;">
    <div>
      <label for="sm-question" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">❓ Research Question</label>
      <input id="sm-question" type="text" placeholder="e.g. Does light affect plant growth?" value=""
             style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    </div>
    <div>
      <label for="sm-hypothesis" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">💡 Hypothesis</label>
      <input id="sm-hypothesis" type="text" placeholder="e.g. Plants grow faster in light." value=""
             style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(57,255,20,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    </div>
    <div>
      <label for="sm-method" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">📝 Method</label>
      <textarea id="sm-method" rows="3" placeholder="e.g. Place seeds in light vs. dark conditions..." value=""
                style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,165,0,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;resize:vertical;"></textarea>
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
    <button type="button" onclick="(function(b){var c=b.closest('.sm-container');var q=c.querySelector('#sm-question').value.trim();var h=c.querySelector('#sm-hypothesis').value.trim();var m=c.querySelector('#sm-method').value.trim();if(!q||!h||!m){c.querySelector('#sm-hint').textContent='Please enter question, hypothesis, and method.';return;}var out='SCIENTIFIC METHOD OUTLINE\\n\\n1. Question:\\n   '+q+'\\n\\n2. Hypothesis:\\n   '+h+'\\n\\n3. Method:\\n   '+m+'\\n\\n4. Variables:\\n   Independent: What you change\\n   Dependent: What you measure\\n   Control: What you keep the same\\n\\n5. Analysis:\\n   Collect data, create graphs, compare results.\\n\\n6. Conclusion:\\n   Does the evidence support the hypothesis?';c.querySelector('#sm-output').value=out;c.querySelector('#sm-hint').textContent='Outline generated.';})(this)"
            style="padding:10px 20px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:600;font-size:14px;">Generate Outline</button>
    <button type="button" onclick="(function(b){var c=b.closest('.sm-container');var out=c.querySelector('#sm-output').value;if(!out.trim())return;navigator.clipboard&&navigator.clipboard.writeText(out).then(function(){c.querySelector('#sm-hint').textContent='Copied.';setTimeout(function(){c.querySelector('#sm-hint').textContent='';},1600);});})(this)"
            style="padding:10px 20px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(230,250,255,0.7);cursor:pointer;font-size:14px;">📋 Copy</button>
    <button type="button" onclick="(function(b){var c=b.closest('.sm-container');c.querySelector('#sm-question').value='';c.querySelector('#sm-hypothesis').value='';c.querySelector('#sm-method').value='';c.querySelector('#sm-output').value='';c.querySelector('#sm-hint').textContent='';})(this)"
            style="padding:10px 20px;background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.2);border-radius:8px;color:#ff4d4d;cursor:pointer;font-size:14px;">Reset</button>
  </div>

  <div style="background:rgba(0,0,0,0.3);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,0.05);">
    <textarea id="sm-output" rows="10" readonly style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.15);background:transparent;color:var(--text);font-size:13px;resize:vertical;line-height:1.5;" placeholder="Your scientific method outline will appear here..."></textarea>
    <div id="sm-hint" style="font-size:0.8rem;color:rgba(230,250,255,0.4);margin-top:8px;"></div>
  </div>
</div>
