<h2 id="engd-title" style="margin-top:0;color:var(--accent);">🛠️ Engine Displacement</h2>

<form aria-describedby="engd-desc" onsubmit="event.preventDefault();">
  <p id="engd-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Convert litres, cubic centimetres and cubic inches (CID). 1 L = 1,000 cc; 1 in³ = 16.387064 cm³. A “5.0” V8 is 5,000 cc ≈ 305 CID. Bore × stroke × cylinders is the geometric displacement, not power.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="engd-l" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Litres</label>
      <input id="engd-l" type="number" min="0" step="any" value="2.0" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="engd-cc" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">cc / cm³</label>
      <input id="engd-cc" type="number" min="0" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="engd-cid" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Cubic inches</label>
      <input id="engd-cid" type="number" min="0" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="engd-bore" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Bore (mm)</label>
      <input id="engd-bore" type="number" min="0" step="any" placeholder="optional" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="engd-stroke" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Stroke (mm)</label>
      <input id="engd-stroke" type="number" min="0" step="any" placeholder="optional" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="engd-cyl" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Cylinders</label>
      <input id="engd-cyl" type="number" min="1" max="16" step="1" value="4" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="engd-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var CC_IN3 = 16.387064;
  var lock = false;
  function applyCc(cc) {
    if (!(cc >= 0) || lock) return;
    lock = true;
    $('engd-cc').value = String(Number(cc.toFixed(1)));
    $('engd-l').value = String(Number((cc / 1000).toFixed(3)));
    $('engd-cid').value = String(Number((cc / CC_IN3).toFixed(1)));
    lock = false;
    $('engd-out').innerHTML = '<p style="margin:0;font-size:.84rem;color:var(--text);"><strong style="color:var(--accent);">' + (cc / 1000).toFixed(2) + ' L</strong>  ·  ' + Math.round(cc) + ' cc  ·  ' + (cc / CC_IN3).toFixed(0) + ' CID</p>';
  }
  function fromBore() {
    var bore = Number($('engd-bore').value), stroke = Number($('engd-stroke').value), cyl = Number($('engd-cyl').value);
    if (!(bore > 0 && stroke > 0 && cyl > 0)) return;
    var cc = Math.PI * Math.pow(bore / 2, 2) * stroke * cyl / 1000;
    applyCc(cc);
  }
  $('engd-l').addEventListener('input', function () { applyCc(Number($('engd-l').value) * 1000); });
  $('engd-cc').addEventListener('input', function () { applyCc(Number($('engd-cc').value)); });
  $('engd-cid').addEventListener('input', function () { applyCc(Number($('engd-cid').value) * CC_IN3); });
  ['engd-bore', 'engd-stroke', 'engd-cyl'].forEach(function (id) { $(id).addEventListener('input', fromBore); });
  applyCc(2000);
})();
</script>
