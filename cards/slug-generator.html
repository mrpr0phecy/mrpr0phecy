<h2>🔗 Slug Generator</h2>
<p style="color:rgba(230,250,255,0.7);margin-bottom:16px;">Convert any text into URL-friendly slugs. Perfect for blog posts, filenames, and SEO-friendly URLs.</p>

<div id="sg-app" style="max-width:600px;margin:0 auto;">
  <div style="margin-bottom:12px;">
    <label style="display:block;margin-bottom:6px;color:#2dd4ff;font-size:13px;">Input Text</label>
    <textarea id="sg-input" style="width:100%;height:80px;padding:12px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;resize:vertical;box-sizing:border-box;" placeholder="Enter your title or text...">How to Build a REST API with Node.js & Express!</textarea>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
    <label style="font-size:12px;color:rgba(230,250,255,0.5);display:flex;align-items:center;gap:4px;">
      <input id="sg-lower" type="checkbox" checked style="accent-color:#2dd4ff;"> Lowercase
    </label>
    <label style="font-size:12px;color:rgba(230,250,255,0.5);display:flex;align-items:center;gap:4px;">
      <input id="sg-numbers" type="checkbox" checked style="accent-color:#2dd4ff;"> Keep numbers
    </label>
    <label style="font-size:12px;color:rgba(230,250,255,0.5);display:flex;align-items:center;gap:4px;">
      Separator: 
      <select id="sg-sep" style="padding:4px;border-radius:4px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:12px;">
        <option value="-">Hyphen (-)</option>
        <option value="_">Underscore (_)</option>
        <option value=".">Dot (.)</option>
      </select>
    </label>
    <label style="font-size:12px;color:rgba(230,250,255,0.5);display:flex;align-items:center;gap:4px;">
      Max length: <input id="sg-max" type="number" min="10" max="200" value="80" style="width:50px;padding:4px;border-radius:4px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:12px;" />
    </label>
  </div>

  <div style="margin-bottom:12px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <label style="color:#39ff14;font-size:13px;">Generated Slug</label>
      <button onclick="window._sgCopy()" style="padding:4px 10px;background:rgba(57,255,20,0.1);border:1px solid rgba(57,255,20,0.2);border-radius:4px;color:#39ff14;cursor:pointer;font-size:12px;">📋 Copy</button>
    </div>
    <div id="sg-output" style="padding:12px;background:rgba(0,0,0,0.3);border:1px solid rgba(57,255,20,0.15);border-radius:8px;font-family:monospace;font-size:15px;color:#39ff14;word-break:break-all;min-height:40px;"></div>
  </div>

  <div style="margin-bottom:12px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <label style="color:#ffa500;font-size:13px;">Full URL Preview</label>
      <button onclick="window._sgCopyUrl()" style="padding:4px 10px;background:rgba(255,165,0,0.1);border:1px solid rgba(255,165,0,0.2);border-radius:4px;color:#ffa500;cursor:pointer;font-size:12px;">📋 Copy</button>
    </div>
    <div id="sg-url" style="padding:12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,165,0,0.15);border-radius:8px;font-family:monospace;font-size:13px;color:#ffa500;word-break:break-all;"></div>
  </div>

  <div id="sg-stats" style="font-size:12px;color:rgba(230,250,255,0.4);text-align:center;"></div>
</div>

<script>
(function(){
  function generate(){
    var text=document.getElementById('sg-input').value;
    var lower=document.getElementById('sg-lower').checked;
    var numbers=document.getElementById('sg-numbers').checked;
    var sep=document.getElementById('sg-sep').value;
    var maxLen=parseInt(document.getElementById('sg-max').value)||80;
    var slug=text;
    if(lower)slug=slug.toLowerCase();
    // Remove accents
    slug=slug.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    // Replace special chars
    slug=slug.replace(/&/g,' and ').replace(/@/g,' at ').replace(/#/g,'');
    // Remove non-alphanumeric (keep separator)
    var re=new RegExp('[^a-z0-9'+sep+'\\s]','gi');
    slug=slug.replace(re,'');
    // Replace whitespace with separator
    slug=slug.replace(/[\s_]+/g,sep);
    // Remove duplicate separators
    var dupRe=new RegExp(sep+'+','g');
    slug=slug.replace(dupRe,sep);
    // Trim separators
    slug=slug.replace(new RegExp('^'+sep+'|'+sep+'$','g'),'');
    // Truncate
    if(slug.length>maxLen)slug=slug.substring(0,maxLen).replace(new RegExp(sep+'$'),'');
    document.getElementById('sg-output').textContent=slug;
    document.getElementById('sg-url').textContent='https://example.com/'+slug;
    document.getElementById('sg-stats').textContent=slug.length+' characters · '+slug.split(sep).length+' words';
  }
  function copy(){var t=document.getElementById('sg-output').textContent;if(navigator.clipboard)navigator.clipboard.writeText(t);}
  function copyUrl(){var t=document.getElementById('sg-url').textContent;if(navigator.clipboard)navigator.clipboard.writeText(t);}
  window._sgCopy=copy;window._sgCopyUrl=copyUrl;
  ['sg-input','sg-lower','sg-numbers','sg-sep','sg-max'].forEach(function(id){
    var el=document.getElementById(id);
    el.addEventListener(el.type==='checkbox'?'change':'input',generate);
  });
  generate();
})();
</script>
