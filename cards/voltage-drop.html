<h2 id="voltage-drop-title" style="margin-top:0;color:var(--accent);">⚡ Voltage Drop Calculator</h2>

<div class="vd-container" style="font-family:inherit;color:var(--text);">
  <p class="small" style="color:rgba(230,250,255,0.7);margin-bottom:16px;">
    Estimate voltage drop across a conductor run. Educational only — always verify with a qualified electrician and local standards.
  </p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
    <div>
      <label for="vd-current" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">🔌 Current (A)</label>
      <input id="vd-current" type="number" placeholder="e.g. 20" value="20"
             style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    </div>
    <div>
      <label for="vd-length" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">📏 Length (m, one-way)</label>
      <input id="vd-length" type="number" placeholder="e.g. 30" value="30"
             style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(57,255,20,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    </div>
    <div>
      <label for="vd-size" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">📐 Conductor Area (mm²)</label>
      <input id="vd-size" type="number" placeholder="e.g. 2.5" value="2.5" step="0.1"
             style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,165,0,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    </div>
    <div>
      <label for="vd-voltage" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">🔋 System Voltage (V)</label>
      <input id="vd-voltage" type="number" placeholder="e.g. 230" value="230"
             style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,64,129,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;" />
    </div>
    <div>
      <label for="vd-material" style="display:block;margin-bottom:6px;color:var(--accent);font-weight:500;font-size:14px;">🪙 Conductor Material</label>
      <select id="vd-material" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(157,78,221,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;">
        <option value="copper" selected>Copper (0.017 Ω·mm²/m)</option>
        <option value="aluminum">Aluminum (0.028 Ω·mm²/m)</option>
      </select>
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
    <button type="button" onclick="(function(b){var c=b.closest('.vd-container');var I=parseFloat(c.querySelector('#vd-current').value)||0;var L=parseFloat(c.querySelector('#vd-length').value)||0;var A=parseFloat(c.querySelector('#vd-size').value)||0;var V=parseFloat(c.querySelector('#vd-voltage').value)||0;var mat=c.querySelector('#vd-material').value;if(I<=0||L<=0||A<=0||V<=0){c.querySelector('#vd-output').value='Please enter valid current, length, conductor size, and voltage.';return;}var rho=mat==='copper'?0.017:0.028;var drop=(2*L*I*rho)/A;var pct=(drop/V*100);var status=pct<3?'✓ Within acceptable range (<3%)':pct<5?'⚠ Borderline (3-5%)':'⚠ Exceeds recommended limit (>5%)';var color=pct<3?'#39ff14':pct<5?'#ffa500':'#ff4d4d';var out='VOLTAGE DROP RESULTS\\n\\nVoltage Drop: '+drop.toFixed(2)+' V\\nPercentage: '+pct.toFixed(2)+'%\\nStatus: '+status+'\\n\\nFormula: V_drop = (2 × L × I × ρ) / A\\nValues used:\\n  Length: '+L+'m (×2 for return path)\\n  Current: '+I+'A\\n  Area: '+A+'mm²\\n  Resistivity: '+rho+' Ω·mm²/m\\n  System voltage: '+V+'V\\n\\n⚠ Always verify with a licensed electrician and local code.';c.querySelector('#vd-output').value=out;c.querySelector('#vd-status').textContent=status;c.querySelector('#vd-status').style.color=color;})(this)"
            style="padding:10px 20px;background:rgba(45,212,255,0.15);border:1px solid rgba(45,212,255,0.4);border-radius:8px;color:var(--accent);cursor:pointer;font-weight:600;font-size:14px;">⚡ Calculate</button>
    <button type="button" onclick="(function(b){var c=b.closest('.vd-container');var out=c.querySelector('#vd-output').value;if(!out.trim())return;navigator.clipboard&&navigator.clipboard.writeText(out).then(function(){c.querySelector('#vd-hint').textContent='Copied.';setTimeout(function(){c.querySelector('#vd-hint').textContent='';},1600);});})(this)"
            style="padding:10px 20px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(230,250,255,0.7);cursor:pointer;font-size:14px;">📋 Copy</button>
    <button type="button" onclick="(function(b){var c=b.closest('.vd-container');c.querySelector('#vd-current').value='20';c.querySelector('#vd-length').value='30';c.querySelector('#vd-size').value='2.5';c.querySelector('#vd-voltage').value='230';c.querySelector('#vd-material').value='copper';c.querySelector('#vd-output').value='';c.querySelector('#vd-status').textContent='';c.querySelector('#vd-hint').textContent='';})(this)"
            style="padding:10px 20px;background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.2);border-radius:8px;color:#ff4d4d;cursor:pointer;font-size:14px;">Reset</button>
  </div>

  <div style="background:rgba(0,0,0,0.3);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,0.05);">
    <div id="vd-status" style="text-align:center;font-size:1rem;font-weight:600;margin-bottom:12px;"></div>
    <textarea id="vd-output" rows="10" readonly style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(45,212,255,0.15);background:transparent;color:var(--text);font-size:13px;resize:vertical;line-height:1.5;" placeholder="Results will appear here..."></textarea>
    <div id="vd-hint" style="font-size:0.8rem;color:rgba(230,250,255,0.4);margin-top:8px;"></div>
  </div>
</div>
