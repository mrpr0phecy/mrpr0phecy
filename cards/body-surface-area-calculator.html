<h2 id="bsax-title" style="margin-top:0;color:var(--accent);">🧍 Body Surface Area Calculator</h2>

<form aria-describedby="bsax-desc" onsubmit="event.preventDefault();">
  <p id="bsax-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Estimate body surface area with Mosteller, Du Bois and Haycock formulae from height and weight. Used for some drug doses and cardiac index. Educational only — never override a prescribed dose.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="bsax-h" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Height</label>
      <input id="bsax-h" type="number" min="40" max="250" value="170" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="bsax-hu" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Height unit</label>
      <select id="bsax-hu" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="cm">cm</option>
        <option value="in">inches</option>
      </select>
    </div>
    <div>
      <label for="bsax-w" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Weight</label>
      <input id="bsax-w" type="number" min="2" max="400" value="70" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="bsax-wu" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Weight unit</label>
      <select id="bsax-wu" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="kg">kg</option>
        <option value="lb">lb</option>
      </select>
    </div>
  </div>
</form>
<div id="bsax-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };

  function run() {
    var h = Number($('bsax-h').value), w = Number($('bsax-w').value);
    if (!(h > 0 && w > 0)) return;
    if ($('bsax-hu').value === 'in') h *= 2.54;
    if ($('bsax-wu').value === 'lb') w *= 0.45359237;
    var mosteller = Math.sqrt((h * w) / 3600);
    var dubois = 0.007184 * Math.pow(w, 0.425) * Math.pow(h, 0.725);
    var haycock = 0.024265 * Math.pow(w, 0.5378) * Math.pow(h, 0.3964);
    function cell(name, v, note) {
      return '<div style="padding:12px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.72rem;color:var(--accent);font-weight:800;">' + name + '</div><div style="font-size:1.25rem;font-weight:800;color:var(--text);margin:4px 0;">' + v.toFixed(3) + ' m²</div><div style="font-size:.74rem;color:var(--text-secondary);">' + note + '</div></div>';
    }
    $('bsax-out').innerHTML =
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;">' +
      cell('Mosteller', mosteller, '√(cm × kg / 3600) — common in the UK') +
      cell('Du Bois', dubois, '0.007184 × kg^0.425 × cm^0.725') +
      cell('Haycock', haycock, 'Often preferred in paediatrics') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Adult mean BSA is about 1.7 m². Chemotherapy and other BSA-dosed medicines must be confirmed by the prescriber.</p>';
  }
  ['bsax-h', 'bsax-hu', 'bsax-w', 'bsax-wu'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
