<h2 id="ukpc-title" style="margin-top:0;color:var(--accent);">📮 UK Postcode Formatter</h2>

<form aria-describedby="ukpc-desc" onsubmit="event.preventDefault();">
  <p id="ukpc-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Uppercase, insert the inward-code space, and check the Royal Mail pattern (e.g. LU1 2AB, EC1A 1BB, W1A 0AX). This is a format check only — it does not look up addresses.
  </p>
  <label for="ukpc-in" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Postcode</label>
  <input id="ukpc-in" type="text" value="lu12ab" autocomplete="postal-code" spellcheck="false" style="width:100%;max-width:280px;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-size:1.05rem;letter-spacing:.04em;">
</form>
<div id="ukpc-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var RE = /^([A-Z]{1,2}\d[A-Z\d]?)\s*(\d[A-Z]{2})$/;
  function run() {
    var raw = $('ukpc-in').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    var pretty = raw.length > 3 ? raw.slice(0, raw.length - 3) + ' ' + raw.slice(-3) : raw;
    var ok = RE.test(pretty);
    var parts = pretty.match(RE);
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('ukpc-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Formatted', pretty || '—') +
      cell('Looks valid', ok ? 'yes' : 'not a complete UK pattern yet') +
      cell('Outward', parts ? parts[1] : '—') +
      cell('Inward', parts ? parts[2] : '—') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Girobank’s GIR 0AA is a special case this pattern does not accept. Special postcodes (BFPO, SANTA) are also out of scope.</p>';
  }
  $('ukpc-in').addEventListener('input', run);
  run();
})();
</script>
