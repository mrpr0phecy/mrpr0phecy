<h2>✊ Tiny Revolts Against Your Own Prison</h2>
<p class="description">You don't need a life overhaul. You need a micro-act of defiance against the rules you've been following that were never yours. One small, deliberate act of "I'm allowed" can crack open years of self-imposed confinement.</p>
<div id="ma-app" style="max-width:540px;margin:0 auto;"></div>
<script>
(function(){
'use strict';
var step=0,rule='',act='';
var rules=['I must always be productive','I can\'t rest until everything is done','I have to say yes to be liked','I can\'t spend money on myself','I must never show weakness','I have to have it all figured out','I can\'t take up space','I must put others first','I can\'t change my mind','I have to justify every choice','I can\'t enjoy things until I\'ve earned them','I must never be a burden'];
function init(){step=0;render();}
function render(){
  var h='';
  if(step===0){
    h+='<div style="text-align:center;margin-bottom:20px;">';
    h+='<div style="font-size:64px;margin-bottom:12px;">✊</div>';
    h+='<h3 style="color:#ff44ff;margin:0 0 8px;">The revolution starts with one small "no"</h3>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);">You live inside a set of rules you never consciously agreed to. "I must be productive." "I can\'t rest." "I have to say yes." These rules feel like laws of physics — unbreakable, absolute. But they\'re not. They\'re habits. And habits can be broken with a single, deliberate act of defiance.</p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-top:12px;">This isn\'t about rebellion for its own sake. It\'s about <b>proving to your nervous system</b> that the rule isn\'t real. That the ceiling you\'ve been living under is made of paper, not concrete. One micro-act — small enough to be safe, bold enough to be felt — can crack open years of self-imposed confinement.</p>';
    h+='</div>';
    h+='<button onclick="window._maNext()" style="display:block;margin:0 auto;padding:12px 32px;background:linear-gradient(135deg,#ff44ff,#cc00cc);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px;">Begin</button>';
  }else if(step===1){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">📜</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">Which invisible rule runs your life the most? Which one makes you feel trapped, resentful, or exhausted?</p>';
    rules.forEach(function(r){
      h+='<button onclick="window._maRule(\''+r.replace(/'/g,"\\'")+'\')" style="display:block;width:100%;text-align:left;padding:12px;margin-bottom:6px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,68,255,0.2);border-radius:8px;color:var(--text-secondary);cursor:pointer;font-size:13px;transition:all 0.2s;">"'+r+'"</button>';
    });
    h+='<p style="font-size:12px;color:rgba(255,255,255,0.4);margin-top:8px;text-align:center;">Or write your own:</p>';
    h+='<input type="text" id="ma-custom" placeholder="My own invisible rule..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,68,255,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;box-sizing:border-box;margin-bottom:8px;">';
    h+='<button onclick="window._maCustom()" style="display:block;margin:0 auto;padding:10px 24px;background:rgba(255,68,255,0.15);color:#ff44ff;border:1px solid rgba(255,68,255,0.3);border-radius:8px;cursor:pointer;font-weight:600;">Use Custom</button>';
  }else if(step===2){
    h+='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:48px;">✊</div><div style="font-size:14px;color:#ff44ff;margin-top:8px;font-style:italic;">"'+rule+'"</div></div>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">Now design your micro-act of defiance. It should be:</p>';
    h+='<ul style="font-size:13px;color:var(--text-secondary);line-height:1.8;margin-bottom:16px;padding-left:20px;">';
    h+='<li><b>Small enough</b> to do today (not a life overhaul)</li>';
    h+='<li><b>Bold enough</b> to feel the rule resisting</li>';
    h+='<li><b>Safe enough</b> that nothing truly bad will happen</li>';
    h+='</ul>';
    h+='<p style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:12px;">Examples: Leave a task undone and rest. Say "no" without explaining. Buy something just because you want it. Ask for help. Admit you don\'t know. Take up space. Be "selfish" for one hour.</p>';
    h+='<label style="display:block;font-size:13px;color:#ff44ff;margin-bottom:6px;font-weight:600;">What is your micro-act of defiance?</label>';
    h+='<textarea id="ma-act" rows="3" placeholder="e.g. I\'m going to sit on the sofa for 30 minutes without doing anything productive and not feel guilty about it..." style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,68,255,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>';
    h+='<button onclick="window._maNext()" style="display:block;margin:16px auto 0;padding:12px 32px;background:linear-gradient(135deg,#ff44ff,#cc00cc);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Commit</button>';
  }else if(step===3){
    h+='<div style="text-align:center;margin-bottom:20px;"><div style="font-size:64px;">✊🔥</div></div>';
    h+='<div style="background:rgba(255,68,255,0.08);border:1px solid rgba(255,68,255,0.2);border-radius:10px;padding:20px;margin-bottom:16px;">';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0 0 12px;">The rule you\'re breaking: <b style="color:#ff44ff;">"'+rule+'"</b></p>';
    h+='<p style="font-size:14px;line-height:1.8;color:var(--text-secondary);margin:0 0 16px;">Your act of defiance: <b style="color:#ff44ff;">"'+act+'"</b></p>';
    h+='<p style="font-size:15px;line-height:1.8;color:#e6faff;margin:0;text-align:center;"><b>Do it today.</b></p><br>';
    h+='<p style="font-size:14px;line-height:1.8;color:#e6faff;margin:0;">Here\'s what will happen: you\'ll feel resistance. The rule will push back. You\'ll feel guilty, anxious, or "wrong." <b>That feeling is the rule defending itself.</b> It\'s not evidence that you\'re doing something bad — it\'s evidence that you\'re doing something <i>different</i>.</p><br>';
    h+='<p style="font-size:14px;line-height:1.8;color:#e6faff;margin:0;">And then — after the discomfort passes — you\'ll feel something else. A tiny crack of freedom. A breath of air you didn\'t know you were holding. That\'s what it feels like when a cage you didn\'t know you were in starts to open.</p><br>';
    h+='<p style="font-size:14px;line-height:1.8;color:#ff44ff;margin:0;font-style:italic;">One micro-act won\'t change your life. But it will prove the rule isn\'t real. And once you know that, you can break it again. And again. Until the cage is gone.</p>';
    h+='</div>';
    h+='<p style="font-size:13px;color:var(--text-secondary);line-height:1.7;">This approach draws on <b>behavioural activation</b> (used in CBT for depression) and <b>exposure therapy</b> (used for anxiety). The principle: you don\'t wait for the feeling to change before you act. You act first, and the feeling follows. Small acts of defiance rewire the brain\'s threat model faster than any amount of thinking.</p>';
    h+='<button onclick="window._maReset()" style="display:block;margin:20px auto 0;padding:10px 24px;background:rgba(255,68,255,0.15);color:#ff44ff;border:1px solid rgba(255,68,255,0.3);border-radius:8px;cursor:pointer;font-weight:600;">Start Over</button>';
  }
  document.getElementById('ma-app').innerHTML=h;
}
window._maNext=function(){
  if(step===2){var a=document.getElementById('ma-act');if(a){act=a.value.trim()||'something small and brave';}}
  step++;render();
};
window._maRule=function(r){rule=r;step=2;render();};
window._maCustom=function(){var c=document.getElementById('ma-custom');rule=c&&c.value.trim()?c.value.trim():'a rule I never chose';step=2;render();};
window._maReset=function(){init();};
init();
})();
</script>
