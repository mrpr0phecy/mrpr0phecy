<h2 id="bpcg-title" style="margin-top:0;color:var(--accent);">🩺 Blood Pressure Category Guide</h2>

<form aria-describedby="bpcg-desc" onsubmit="event.preventDefault();">
  <p id="bpcg-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Home-monitor numbers compared with NHS adult clinic bands (and a note on AHA). One reading is not a diagnosis. Seek urgent help for chest pain, one-sided weakness, or a sudden severe headache. This is not medical advice.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="bpcg-sys" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Systolic (upper) mmHg</label>
      <input id="bpcg-sys" type="number" min="60" max="260" step="1" value="128" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="bpcg-dia" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Diastolic (lower) mmHg</label>
      <input id="bpcg-dia" type="number" min="40" max="160" step="1" value="82" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="bpcg-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function nhs(s, d) {
    if (s >= 180 || d >= 120) return 'possible hypertensive crisis band — repeat, rest, and seek urgent clinical advice if it stays this high or you feel unwell';
    if (s >= 140 || d >= 90) return 'high (clinic hypertension band: 140/90 or more)';
    if (s >= 120 || d >= 80) return 'pre-high / elevated (NHS: 120–139 / 80–89)';
    if (s < 90 || d < 60) return 'low-ish versus usual adult charts — context (symptoms, meds) matters';
    return 'ideal-ish NHS adult band (under 120/80)';
  }
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var s = Number($('bpcg-sys').value), d = Number($('bpcg-dia').value);
    if (!(s > 0) || !(d > 0) || s <= d) {
      $('bpcg-out').textContent = 'Systolic should be higher than diastolic.';
      return;
    }
    var pulse = s - d;
    var map = d + pulse / 3;
    $('bpcg-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Reading', s + ' / ' + d + ' mmHg') +
      cell('Pulse pressure', pulse + ' mmHg') +
      cell('Mean arterial (approx)', map.toFixed(0) + ' mmHg') +
      cell('NHS-style band', nhs(s, d)) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">NHS clinic hypertension is usually 140/90 or more; home monitors often use 135/85. AHA “elevated” starts at 120 systolic. Sit quietly 5 minutes, cuff on a bare upper arm, feet on the floor. Talk to a GP or pharmacist about a pattern of readings, not one number.</p>';
  }
  $('bpcg-sys').addEventListener('input', run);
  $('bpcg-dia').addEventListener('input', run);
  run();
})();
</script>
