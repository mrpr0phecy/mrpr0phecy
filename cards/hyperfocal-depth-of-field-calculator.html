<h2 id="hfcl-title" style="margin-top:0;color:var(--accent);">📷 Hyperfocal &amp; Depth of Field</h2>

<form aria-describedby="hfcl-desc" onsubmit="event.preventDefault();">
  <p id="hfcl-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Hyperfocal distance H = f² / (N × c) + f. Focus there and everything from H/2 to infinity is acceptably sharp. Circle of confusion defaults: full frame 0.030 mm, APS-C 0.019 mm, Micro Four Thirds 0.015 mm.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="hfcl-f" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Focal length (mm)</label>
      <input id="hfcl-f" type="number" min="1" max="2000" value="35" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="hfcl-n" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Aperture (f-number)</label>
      <input id="hfcl-n" type="number" min="0.7" max="64" step="any" value="8" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="hfcl-sensor" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Sensor / CoC</label>
      <select id="hfcl-sensor" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
        <option value="0.030">Full frame 0.030 mm</option>
        <option value="0.019">APS-C 0.019 mm</option>
        <option value="0.015">Micro 4/3 0.015 mm</option>
        <option value="0.011">1-inch 0.011 mm</option>
      </select>
    </div>
    <div>
      <label for="hfcl-d" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Focus distance (m)</label>
      <input id="hfcl-d" type="number" min="0.1" step="any" value="5" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="hfcl-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function run() {
    var f = Number($('hfcl-f').value), N = Number($('hfcl-n').value), c = Number($('hfcl-sensor').value), D = Number($('hfcl-d').value);
    if (!(f > 0 && N > 0 && c > 0 && D > 0)) return;
    var Hmm = (f * f) / (N * c) + f;
    var H = Hmm / 1000;
    var Dm = D;
    var near = (H * Dm) / (H + Dm);
    var far = H > Dm ? (H * Dm) / (H - Dm) : Infinity;
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('hfcl-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Hyperfocal H', H.toFixed(2) + ' m') +
      cell('Sharp from (at H)', (H / 2).toFixed(2) + ' m → ∞') +
      cell('DoF near @ ' + D + ' m', near.toFixed(2) + ' m') +
      cell('DoF far @ ' + D + ' m', isFinite(far) ? far.toFixed(2) + ' m' : 'infinity') +
      cell('Total DoF', isFinite(far) ? (far - near).toFixed(2) + ' m' : 'to infinity') +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">CoC is a convention, not physics. Pixel-peeping on high-megapixel sensors wants a smaller CoC.</p>';
  }
  ['hfcl-f', 'hfcl-n', 'hfcl-sensor', 'hfcl-d'].forEach(function (id) {
    $(id).addEventListener('input', run);
    $(id).addEventListener('change', run);
  });
  run();
})();
</script>
