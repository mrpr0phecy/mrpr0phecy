<h2 id="bcrd-title" style="margin-top:0;color:var(--accent);">💳 Business Card Size Guide</h2>

<form aria-describedby="bcrd-desc" onsubmit="event.preventDefault();">
  <p id="bcrd-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Print sizes and pixels for UK/EU (85 × 55 mm), US (3.5 × 2 in), Japanese and Chinese cards. Add 3 mm bleed if a printer asks for it. Not a design studio — just the millimetres they keep getting wrong.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="bcrd-where" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Standard</label>
      <select id="bcrd-where" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);"></select>
    </div>
    <div>
      <label for="bcrd-dpi" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Print DPI</label>
      <input id="bcrd-dpi" type="number" min="72" max="600" value="300" inputmode="numeric" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="bcrd-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var SIZES = [
    ['UK / EU ISO 7810 ID-1', 85, 55],
    ['US / Canada', 88.9, 50.8],
    ['Japan', 91, 55],
    ['China', 90, 54],
    ['Mini / skinny', 70, 25],
    ['Square', 55, 55]
  ];
  var sel = $('bcrd-where');
  sel.innerHTML = SIZES.map(function (s, i) { return '<option value="' + i + '">' + s[0] + '</option>'; }).join('');
  function run() {
    var s = SIZES[Number(sel.value)] || SIZES[0];
    var dpi = Number($('bcrd-dpi').value) || 300;
    var bleed = 3;
    var pxw = Math.round(s[1] / 25.4 * dpi), pxh = Math.round(s[2] / 25.4 * dpi);
    function cell(k, v) {
      return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
    }
    $('bcrd-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">' +
      cell('Trim size', s[1] + ' × ' + s[2] + ' mm') +
      cell('Inches', (s[1] / 25.4).toFixed(2) + ' × ' + (s[2] / 25.4).toFixed(2) + ' in') +
      cell('Pixels @ ' + dpi + ' DPI', pxw + ' × ' + pxh) +
      cell('With 3 mm bleed', (s[1] + bleed * 2) + ' × ' + (s[2] + bleed * 2) + ' mm') +
      cell('Safe type margin', 'keep text ≥ 3 mm from trim') +
      '</div>';
  }
  sel.addEventListener('change', run);
  $('bcrd-dpi').addEventListener('input', run);
  run();
})();
</script>
