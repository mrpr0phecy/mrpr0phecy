<h2 id="word-counter-title" style="margin-top:0;color:var(--accent);">📝 Word Counter & Analyser</h2>

<div class="wc-container" style="font-family:inherit;color:var(--text);">
  <p class="small" style="color:rgba(230,250,255,0.7);margin-bottom:16px;">
    Count words, characters, sentences, and estimate reading time. Useful for essays and assignments.
  </p>

  <div style="margin-bottom:16px;">
    <textarea id="wc-input" rows="8" placeholder="Paste or type your text here..."
              oninput="(function(el){var c=el.closest('.wc-container');var text=el.value;var words=text.trim()?text.trim().split(/\s+/).length:0;var chars=text.length;var charsNoSpace=text.replace(/\s/g,'').length;var sentences=text.trim()?(text.match(/[.!?]+/g)||[]).length:0;var paragraphs=text.trim()?(text.split(/\n\s*\n/).filter(function(p){return p.trim();})).length:0;var readMin=Math.max(1,Math.ceil(words/200));var speakMin=Math.max(1,Math.ceil(words/130));c.querySelector('#wc-words').textContent=words.toLocaleString('en-GB');c.querySelector('#wc-chars').textContent=chars.toLocaleString('en-GB');c.querySelector('#wc-charsns').textContent=charsNoSpace.toLocaleString('en-GB');c.querySelector('#wc-sentences').textContent=sentences.toLocaleString('en-GB');c.querySelector('#wc-paragraphs').textContent=paragraphs.toLocaleString('en-GB');c.querySelector('#wc-read').textContent=readMin+' min';c.querySelector('#wc-speak').textContent=speakMin+' min';})(this)"
              style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(45,212,255,0.2);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;resize:vertical;line-height:1.6;font-family:inherit;"></textarea>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;">
    <div style="background:rgba(0,0,0,0.3);border-radius:10px;padding:14px;border:1px solid rgba(45,212,255,0.1);text-align:center;">
      <div style="font-size:0.75rem;color:rgba(230,250,255,0.5);margin-bottom:4px;">Words</div>
      <div id="wc-words" style="font-size:1.5rem;font-weight:700;color:var(--accent);">0</div>
    </div>
    <div style="background:rgba(0,0,0,0.3);border-radius:10px;padding:14px;border:1px solid rgba(57,255,20,0.1);text-align:center;">
      <div style="font-size:0.75rem;color:rgba(230,250,255,0.5);margin-bottom:4px;">Characters</div>
      <div id="wc-chars" style="font-size:1.5rem;font-weight:700;color:#39ff14;">0</div>
    </div>
    <div style="background:rgba(0,0,0,0.3);border-radius:10px;padding:14px;border:1px solid rgba(255,165,0,0.1);text-align:center;">
      <div style="font-size:0.75rem;color:rgba(230,250,255,0.5);margin-bottom:4px;">No Spaces</div>
      <div id="wc-charsns" style="font-size:1.5rem;font-weight:700;color:#ffa500;">0</div>
    </div>
    <div style="background:rgba(0,0,0,0.3);border-radius:10px;padding:14px;border:1px solid rgba(255,64,129,0.1);text-align:center;">
      <div style="font-size:0.75rem;color:rgba(230,250,255,0.5);margin-bottom:4px;">Sentences</div>
      <div id="wc-sentences" style="font-size:1.5rem;font-weight:700;color:#ff4081;">0</div>
    </div>
    <div style="background:rgba(0,0,0,0.3);border-radius:10px;padding:14px;border:1px solid rgba(157,78,221,0.1);text-align:center;">
      <div style="font-size:0.75rem;color:rgba(230,250,255,0.5);margin-bottom:4px;">Paragraphs</div>
      <div id="wc-paragraphs" style="font-size:1.5rem;font-weight:700;color:#9d4edd;">0</div>
    </div>
    <div style="background:rgba(0,0,0,0.3);border-radius:10px;padding:14px;border:1px solid rgba(45,212,255,0.1);text-align:center;">
      <div style="font-size:0.75rem;color:rgba(230,250,255,0.5);margin-bottom:4px;">Read Time</div>
      <div id="wc-read" style="font-size:1.5rem;font-weight:700;color:var(--accent);">1 min</div>
    </div>
    <div style="background:rgba(0,0,0,0.3);border-radius:10px;padding:14px;border:1px solid rgba(57,255,20,0.1);text-align:center;">
      <div style="font-size:0.75rem;color:rgba(230,250,255,0.5);margin-bottom:4px;">Speak Time</div>
      <div id="wc-speak" style="font-size:1.5rem;font-weight:700;color:#39ff14;">1 min</div>
    </div>
  </div>
</div>
