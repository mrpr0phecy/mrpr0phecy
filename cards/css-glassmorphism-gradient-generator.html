<h2 id="cgg-title" style="margin-top:0;color:var(--accent);">🎨 CSS Glass &amp; Gradients</h2>

<form aria-describedby="cgg-desc" onsubmit="event.preventDefault();">
  <p id="cgg-desc" class="small" style="color:var(--muted);margin-bottom:14px;">
    Design modern frosted glass (glassmorphism) components and mesh gradients. Real-time visual canvas with 1-click cross-browser CSS.
  </p>

  <!-- Presets -->
  <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;">
    <button type="button" class="cgg-preset" data-blur="16" data-bg="rgba(13, 21, 32, 0.45)" data-border="rgba(45, 212, 255, 0.3)" data-radius="16" data-shadow="0 8px 32px 0 rgba(0, 0, 0, 0.37)" style="padding:4px 8px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.7rem;cursor:pointer;white-space:nowrap;">Cyber Glass</button>
    <button type="button" class="cgg-preset" data-blur="20" data-bg="rgba(255, 255, 255, 0.12)" data-border="rgba(255, 255, 255, 0.25)" data-radius="20" data-shadow="0 8px 32px 0 rgba(31, 38, 135, 0.37)" style="padding:4px 8px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.7rem;cursor:pointer;white-space:nowrap;">Frosted Crystal</button>
    <button type="button" class="cgg-preset" data-blur="12" data-bg="rgba(255, 107, 157, 0.18)" data-border="rgba(255, 107, 157, 0.4)" data-radius="14" data-shadow="0 10px 30px rgba(255, 107, 157, 0.25)" style="padding:4px 8px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.7rem;cursor:pointer;white-space:nowrap;">Neon Sunset</button>
    <button type="button" class="cgg-preset" data-blur="24" data-bg="rgba(0, 0, 0, 0.65)" data-border="rgba(255, 215, 0, 0.3)" data-radius="12" data-shadow="0 12px 40px rgba(0, 0, 0, 0.6)" style="padding:4px 8px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.7rem;cursor:pointer;white-space:nowrap;">Deep Obsidian</button>
  </div>

  <!-- Interactive Live Preview Canvas -->
  <div id="cgg-preview-container" style="position:relative;height:180px;border-radius:12px;overflow:hidden;margin-bottom:14px;background:linear-gradient(135deg, #1f1c2c, #928dab);display:flex;align-items:center;justify-content:center;padding:20px;box-shadow:inset 0 0 20px rgba(0,0,0,0.5);">
    <!-- Floating background decorative shapes to demonstrate blur -->
    <div style="position:absolute;width:90px;height:90px;border-radius:50%;background:linear-gradient(45deg, #ff007f, #7928ca);top:15px;left:30px;filter:blur(2px);"></div>
    <div style="position:absolute;width:110px;height:110px;border-radius:50%;background:linear-gradient(45deg, #00dfd8, #007cf0);bottom:10px;right:40px;filter:blur(3px);"></div>
    <div style="position:absolute;width:60px;height:60px;border-radius:12px;background:linear-gradient(45deg, #ffd700, #ff6b6b);top:40px;right:90px;transform:rotate(25deg);"></div>

    <!-- The Live Glass Component -->
    <div id="cgg-glass-card" style="position:relative;z-index:2;width:80%;max-width:280px;padding:16px;border-radius:16px;background:rgba(13, 21, 32, 0.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(45, 212, 255, 0.3);box-shadow:0 8px 32px 0 rgba(0, 0, 0, 0.37);text-align:center;">
      <div style="font-size:1.1rem;font-weight:bold;color:#e6faff;margin-bottom:4px;">Frosted Glass</div>
      <div style="font-size:0.75rem;color:rgba(230,250,255,0.8);">Next-Gen CSS Glassmorphism</div>
    </div>
  </div>

  <!-- Parameter Sliders -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
    <!-- Blur Radius -->
    <div>
      <div style="display:flex;justify-content:space-between;font-size:0.72rem;color:var(--muted);margin-bottom:2px;">
        <span>Blur Radius</span>
        <span id="cgg-val-blur">16px</span>
      </div>
      <input type="range" id="cgg-slider-blur" min="0" max="40" value="16" style="width:100%;">
    </div>

    <!-- Opacity -->
    <div>
      <div style="display:flex;justify-content:space-between;font-size:0.72rem;color:var(--muted);margin-bottom:2px;">
        <span>Glass Opacity</span>
        <span id="cgg-val-opacity">45%</span>
      </div>
      <input type="range" id="cgg-slider-opacity" min="0" max="100" value="45" style="width:100%;">
    </div>

    <!-- Border Opacity -->
    <div>
      <div style="display:flex;justify-content:space-between;font-size:0.72rem;color:var(--muted);margin-bottom:2px;">
        <span>Border Highlight</span>
        <span id="cgg-val-border">30%</span>
      </div>
      <input type="range" id="cgg-slider-border" min="0" max="100" value="30" style="width:100%;">
    </div>

    <!-- Corner Radius -->
    <div>
      <div style="display:flex;justify-content:space-between;font-size:0.72rem;color:var(--muted);margin-bottom:2px;">
        <span>Corner Radius</span>
        <span id="cgg-val-radius">16px</span>
      </div>
      <input type="range" id="cgg-slider-radius" min="0" max="40" value="16" style="width:100%;">
    </div>
  </div>

  <!-- Color Dials -->
  <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px;background:rgba(0,0,0,0.2);padding:8px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);">
    <div style="display:flex;align-items:center;gap:6px;">
      <label for="cgg-tint-color" style="font-size:0.72rem;color:var(--muted);">Tint Color:</label>
      <input type="color" id="cgg-tint-color" value="#0d1520" style="width:28px;height:24px;border:none;border-radius:4px;cursor:pointer;background:none;">
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <label for="cgg-border-color" style="font-size:0.72rem;color:var(--muted);">Border Tint:</label>
      <input type="color" id="cgg-border-color" value="#2dd4ff" style="width:28px;height:24px;border:none;border-radius:4px;cursor:pointer;background:none;">
    </div>
    <div style="flex:1;text-align:right;">
      <button type="button" id="cgg-bg-toggle" style="padding:4px 8px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:0.7rem;cursor:pointer;">Change Background</button>
    </div>
  </div>

  <!-- Generated CSS Output -->
  <div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <span style="font-size:0.72rem;font-weight:bold;color:var(--accent);">GENERATED CSS CODE</span>
      <button type="button" id="cgg-btn-copy" style="padding:4px 10px;border-radius:4px;background:rgba(45,212,255,0.2);border:1px solid #2dd4ff;color:#2dd4ff;font-size:0.72rem;font-weight:bold;cursor:pointer;">Copy CSS</button>
    </div>
    <textarea id="cgg-css-output" readonly rows="7" style="width:100%;font-family:monospace;font-size:0.75rem;padding:8px 10px;border-radius:6px;background:#090d14;border:1px solid rgba(255,255,255,0.15);color:#00ffcc;box-sizing:border-box;resize:none;"></textarea>
  </div>
</form>

<script>
(function() {
  const card = document.getElementById('cgg-glass-card');
  const previewBox = document.getElementById('cgg-preview-container');
  const cssOut = document.getElementById('cgg-css-output');

  const sBlur = document.getElementById('cgg-slider-blur');
  const sOpacity = document.getElementById('cgg-slider-opacity');
  const sBorder = document.getElementById('cgg-slider-border');
  const sRadius = document.getElementById('cgg-slider-radius');

  const vBlur = document.getElementById('cgg-val-blur');
  const vOpacity = document.getElementById('cgg-val-opacity');
  const vBorder = document.getElementById('cgg-val-border');
  const vRadius = document.getElementById('cgg-val-radius');

  const cTint = document.getElementById('cgg-tint-color');
  const cBorder = document.getElementById('cgg-border-color');

  const backgrounds = [
    'linear-gradient(135deg, #1f1c2c, #928dab)',
    'linear-gradient(135deg, #0f2027, #203a43, #2c5364)',
    'linear-gradient(135deg, #8a2387, #e94057, #f27121)',
    'radial-gradient(circle at top left, #1a2a6c, #b21f1f, #fdbb2d)',
    'linear-gradient(135deg, #000428, #004e92)'
  ];
  let bgIdx = 0;

  function hexToRgba(hex, alpha) {
    hex = hex.replace('#', '');
    const r = parseInt(hex.substring(0, 2), 16) || 0;
    const g = parseInt(hex.substring(2, 4), 16) || 0;
    const b = parseInt(hex.substring(4, 6), 16) || 0;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function update() {
    const blur = sBlur.value;
    const opacity = (sOpacity.value / 100).toFixed(2);
    const borderOp = (sBorder.value / 100).toFixed(2);
    const radius = sRadius.value;

    vBlur.textContent = blur + 'px';
    vOpacity.textContent = sOpacity.value + '%';
    vBorder.textContent = sBorder.value + '%';
    vRadius.textContent = radius + 'px';

    const bgRgba = hexToRgba(cTint.value, opacity);
    const borderRgba = hexToRgba(cBorder.value, borderOp);
    const shadow = `0 8px 32px 0 rgba(0, 0, 0, 0.37)`;

    card.style.background = bgRgba;
    card.style.backdropFilter = `blur(${blur}px)`;
    card.style.webkitBackdropFilter = `blur(${blur}px)`;
    card.style.border = `1px solid ${borderRgba}`;
    card.style.borderRadius = `${radius}px`;
    card.style.boxShadow = shadow;

    const css = `.glass-card {
  background: ${bgRgba};
  backdrop-filter: blur(${blur}px);
  -webkit-backdrop-filter: blur(${blur}px);
  border-radius: ${radius}px;
  border: 1px solid ${borderRgba};
  box-shadow: ${shadow};
}`;
    cssOut.value = css;
  }

  [sBlur, sOpacity, sBorder, sRadius, cTint, cBorder].forEach(el => {
    el.addEventListener('input', update);
  });

  document.getElementById('cgg-bg-toggle').addEventListener('click', () => {
    bgIdx = (bgIdx + 1) % backgrounds.length;
    previewBox.style.background = backgrounds[bgIdx];
  });

  document.querySelectorAll('.cgg-preset').forEach(btn => {
    btn.addEventListener('click', () => {
      sBlur.value = btn.dataset.blur;
      sRadius.value = btn.dataset.radius;
      sOpacity.value = 45;
      sBorder.value = 30;
      update();
    });
  });

  document.getElementById('cgg-btn-copy').addEventListener('click', () => {
    navigator.clipboard.writeText(cssOut.value);
    const b = document.getElementById('cgg-btn-copy');
    b.textContent = '✓ Copied';
    setTimeout(() => b.textContent = 'Copy CSS', 1500);
  });

  update();
})();
</script>
