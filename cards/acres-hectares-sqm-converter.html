<h2 id="acre-title" style="margin-top:0;color:var(--accent);">🌾 Acres ⇄ Hectares ⇄ m²</h2>

<form aria-describedby="acre-desc" onsubmit="event.preventDefault();">
  <p id="acre-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    International acre is exactly 4,046.8564224 m²; a hectare is 10,000 m² (a 100 m square). UK land ads mix acres and hectares. Edit any field.
  </p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;">
    <div>
      <label for="acre-a" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Acres</label>
      <input id="acre-a" type="number" min="0" step="any" value="1" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="acre-ha" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Hectares</label>
      <input id="acre-ha" type="number" min="0" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="acre-m" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Square metres</label>
      <input id="acre-m" type="number" min="0" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
    <div>
      <label for="acre-ft" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Square feet</label>
      <input id="acre-ft" type="number" min="0" step="any" inputmode="decimal" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);">
    </div>
  </div>
</form>
<div id="acre-out" style="margin-top:14px;font-size:.84rem;color:var(--text);"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var ACRE = 4046.8564224, SQFT = 0.09290304;
  var lock = false;
  function apply(m2) {
    if (!(m2 >= 0) || lock) return;
    lock = true;
    $('acre-m').value = String(Number(m2.toFixed(2)));
    $('acre-a').value = String(Number((m2 / ACRE).toFixed(6)));
    $('acre-ha').value = String(Number((m2 / 10000).toFixed(6)));
    $('acre-ft').value = String(Number((m2 / SQFT).toFixed(2)));
    lock = false;
    var side = Math.sqrt(m2);
    $('acre-out').textContent = 'A square of that area is ' + side.toFixed(1) + ' m on a side (' + (side * 3.28084).toFixed(1) + ' ft).';
  }
  $('acre-a').addEventListener('input', function () { apply(Number($('acre-a').value) * ACRE); });
  $('acre-ha').addEventListener('input', function () { apply(Number($('acre-ha').value) * 10000); });
  $('acre-m').addEventListener('input', function () { apply(Number($('acre-m').value)); });
  $('acre-ft').addEventListener('input', function () { apply(Number($('acre-ft').value) * SQFT); });
  apply(ACRE);
})();
</script>
