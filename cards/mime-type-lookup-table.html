<h2 id="mtlk-title" style="margin-top:0;color:var(--accent);">📎 MIME Type Lookup</h2>

<form aria-describedby="mtlk-desc" onsubmit="event.preventDefault();">
  <p id="mtlk-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Convert a file extension to a MIME type, or a MIME type back to common extensions. Handy when writing Content-Type headers, nginx maps or &lt;input accept&gt; lists. Lookup is local.
  </p>
  <div>
    <label for="mtlk-q" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Extension or MIME type</label>
    <input id="mtlk-q" type="search" placeholder=".png  or  application/json" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">
  </div>
</form>
<div id="mtlk-hit" style="margin:12px 0;padding:12px;border-radius:10px;background:rgba(45,212,255,.08);border:1px solid rgba(45,212,255,.28);display:none;">
  <div id="mtlk-main" style="font-weight:800;color:var(--text);"></div>
  <div id="mtlk-sub" style="font-size:.8rem;color:var(--text-secondary);margin-top:4px;"></div>
  <button type="button" id="mtlk-copy" style="margin-top:8px;padding:7px 11px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-size:.78rem;font-weight:700;">Copy MIME</button>
</div>
<div id="mtlk-list" style="max-height:320px;overflow:auto;font-size:.8rem;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var MAP = [
    ['html', 'text/html', 'HTML document'],
    ['htm', 'text/html', 'HTML document'],
    ['css', 'text/css', 'Stylesheet'],
    ['js', 'text/javascript', 'JavaScript'],
    ['mjs', 'text/javascript', 'JavaScript module'],
    ['json', 'application/json', 'JSON data'],
    ['jsonld', 'application/ld+json', 'JSON-LD'],
    ['xml', 'application/xml', 'XML'],
    ['txt', 'text/plain', 'Plain text'],
    ['csv', 'text/csv', 'Comma-separated values'],
    ['tsv', 'text/tab-separated-values', 'Tab-separated values'],
    ['md', 'text/markdown', 'Markdown'],
    ['pdf', 'application/pdf', 'PDF document'],
    ['zip', 'application/zip', 'ZIP archive'],
    ['gz', 'application/gzip', 'Gzip archive'],
    ['tar', 'application/x-tar', 'Tape archive'],
    ['7z', 'application/x-7z-compressed', '7-Zip archive'],
    ['rar', 'application/vnd.rar', 'RAR archive'],
    ['png', 'image/png', 'PNG image'],
    ['jpg', 'image/jpeg', 'JPEG image'],
    ['jpeg', 'image/jpeg', 'JPEG image'],
    ['gif', 'image/gif', 'GIF image'],
    ['webp', 'image/webp', 'WebP image'],
    ['svg', 'image/svg+xml', 'SVG vector'],
    ['ico', 'image/x-icon', 'Icon'],
    ['avif', 'image/avif', 'AVIF image'],
    ['bmp', 'image/bmp', 'Bitmap'],
    ['tif', 'image/tiff', 'TIFF image'],
    ['tiff', 'image/tiff', 'TIFF image'],
    ['mp3', 'audio/mpeg', 'MP3 audio'],
    ['wav', 'audio/wav', 'WAV audio'],
    ['ogg', 'audio/ogg', 'Ogg audio'],
    ['oga', 'audio/ogg', 'Ogg audio'],
    ['m4a', 'audio/mp4', 'AAC / M4A audio'],
    ['flac', 'audio/flac', 'FLAC audio'],
    ['aac', 'audio/aac', 'AAC audio'],
    ['mid', 'audio/midi', 'MIDI'],
    ['mp4', 'video/mp4', 'MP4 video'],
    ['webm', 'video/webm', 'WebM video'],
    ['ogv', 'video/ogg', 'Ogg video'],
    ['mov', 'video/quicktime', 'QuickTime'],
    ['avi', 'video/x-msvideo', 'AVI video'],
    ['mkv', 'video/x-matroska', 'Matroska video'],
    ['woff', 'font/woff', 'WOFF font'],
    ['woff2', 'font/woff2', 'WOFF2 font'],
    ['ttf', 'font/ttf', 'TrueType font'],
    ['otf', 'font/otf', 'OpenType font'],
    ['eot', 'application/vnd.ms-fontobject', 'Embedded OpenType'],
    ['wasm', 'application/wasm', 'WebAssembly'],
    ['bin', 'application/octet-stream', 'Generic binary'],
    ['exe', 'application/vnd.microsoft.portable-executable', 'Windows executable'],
    ['apk', 'application/vnd.android.package-archive', 'Android package'],
    ['ics', 'text/calendar', 'iCalendar'],
    ['vcf', 'text/vcard', 'vCard'],
    ['rtf', 'application/rtf', 'Rich Text Format'],
    ['doc', 'application/msword', 'Word 97–2003'],
    ['docx', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'Word document'],
    ['xls', 'application/vnd.ms-excel', 'Excel 97–2003'],
    ['xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', 'Excel workbook'],
    ['ppt', 'application/vnd.ms-powerpoint', 'PowerPoint 97–2003'],
    ['pptx', 'application/vnd.openxmlformats-officedocument.presentationml.presentation', 'PowerPoint'],
    ['odt', 'application/vnd.oasis.opendocument.text', 'OpenDocument text'],
    ['ods', 'application/vnd.oasis.opendocument.spreadsheet', 'OpenDocument sheet'],
    ['epub', 'application/epub+zip', 'EPUB book'],
    ['rss', 'application/rss+xml', 'RSS feed'],
    ['atom', 'application/atom+xml', 'Atom feed'],
    ['yaml', 'application/yaml', 'YAML'],
    ['yml', 'application/yaml', 'YAML'],
    ['toml', 'application/toml', 'TOML'],
    ['sql', 'application/sql', 'SQL'],
    ['sh', 'application/x-sh', 'Shell script'],
    ['py', 'text/x-python', 'Python'],
    ['c', 'text/x-c', 'C source'],
    ['h', 'text/x-c', 'C header'],
    ['java', 'text/x-java-source', 'Java source'],
    ['php', 'application/x-httpd-php', 'PHP'],
    ['webp', 'image/webp', 'WebP image'],
    ['map', 'application/json', 'Source map'],
    ['webmanifest', 'application/manifest+json', 'Web app manifest'],
    ['opus', 'audio/opus', 'Opus audio'],
    ['srt', 'application/x-subrip', 'SubRip subtitles'],
    ['vtt', 'text/vtt', 'WebVTT subtitles']
  ];
  var lastMime = '';

  function render() {
    var q = $('mtlk-q').value.trim().toLowerCase().replace(/^\./, '');
    var exact = null;
    var rows = '';
    var shown = 0;
    for (var i = 0; i < MAP.length; i++) {
      var ext = MAP[i][0], mime = MAP[i][1], label = MAP[i][2];
      var match = !q || ext === q || mime === q || mime.indexOf(q) !== -1 || ext.indexOf(q) !== -1 || label.toLowerCase().indexOf(q) !== -1;
      if (!match) continue;
      shown++;
      if (!exact && (ext === q || mime === q)) exact = MAP[i];
      rows += '<div style="display:grid;grid-template-columns:72px 1fr;gap:8px;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.06);"><span style="color:var(--accent);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">.' + ext + '</span><span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text);">' + mime + '</span><br><span style="color:var(--text-secondary);font-size:.75rem;">' + label + '</span></span></div>';
      if (shown >= 40) break;
    }
    $('mtlk-list').innerHTML = rows || '<div style="padding:10px;color:var(--text-secondary);">No matches in this table.</div>';
    if (exact) {
      lastMime = exact[1];
      $('mtlk-hit').style.display = 'block';
      $('mtlk-main').textContent = '.' + exact[0] + '  →  ' + exact[1];
      $('mtlk-sub').textContent = exact[2];
    } else if (q && shown === 1) {
      var only = null;
      for (var j = 0; j < MAP.length; j++) {
        var e = MAP[j][0], m = MAP[j][1], l = MAP[j][2];
        if (e.indexOf(q) !== -1 || m.indexOf(q) !== -1 || l.toLowerCase().indexOf(q) !== -1) { only = MAP[j]; break; }
      }
      if (only) {
        lastMime = only[1];
        $('mtlk-hit').style.display = 'block';
        $('mtlk-main').textContent = '.' + only[0] + '  →  ' + only[1];
        $('mtlk-sub').textContent = only[2];
      } else $('mtlk-hit').style.display = 'none';
    } else {
      $('mtlk-hit').style.display = q ? 'none' : 'none';
    }
  }
  $('mtlk-copy').addEventListener('click', function () {
    if (!lastMime) return;
    var btn = this;
    function done() { btn.textContent = '✓ Copied'; setTimeout(function () { btn.textContent = 'Copy MIME'; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(lastMime).then(done);
    else done();
  });
  $('mtlk-q').addEventListener('input', render);
  render();
})();
</script>
