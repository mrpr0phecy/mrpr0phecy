<h2 id="cssp-title" style="margin-top:0;color:var(--accent);">🎯 CSS Specificity Calculator</h2>

<form aria-describedby="cssp-desc" onsubmit="event.preventDefault();">
  <p id="cssp-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Paste a selector. Counts IDs, classes/attributes/pseudo-classes, and types/pseudo-elements as (A, B, C). <code style="color:var(--accent);">:not()</code> is ignored as a class; its argument is counted. <code style="color:var(--accent);">:is()</code> / <code style="color:var(--accent);">:where()</code> / <code style="color:var(--accent);">:has()</code> take the most specific argument. Inline style and <code style="color:var(--accent);">!important</code> are not a selector.
  </p>
  <label for="cssp-in" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Selector</label>
  <input id="cssp-in" type="text" value="nav.site ul li.active > a:hover" autocomplete="off" spellcheck="false" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85rem;">
</form>
<div id="cssp-out" style="margin-top:14px;"></div>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  function maxTriple(a, b) {
    if (a[0] !== b[0]) return a[0] > b[0] ? a : b;
    if (a[1] !== b[1]) return a[1] > b[1] ? a : b;
    return a[2] >= b[2] ? a : b;
  }
  function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
  function splitArgs(inner) {
    var parts = [], cur = '', depth = 0;
    for (var i = 0; i < inner.length; i++) {
      var c = inner.charAt(i);
      if (c === '(') depth++;
      if (c === ')') depth--;
      if (c === ',' && depth === 0) { parts.push(cur); cur = ''; }
      else cur += c;
    }
    if (cur) parts.push(cur);
    return parts;
  }
  function spec(sel) {
    sel = String(sel || '').trim();
    if (!sel) return [0, 0, 0];
    var a = 0, b = 0, c = 0;
    function eatFn(re, handler) {
      sel = sel.replace(re, function (m, name, inner) {
        handler(name.toLowerCase(), inner);
        return ' ';
      });
    }
    eatFn(/:(where|is|has|not)\(([^()]*|\([^)]*\))*\)/gi, function (name, inner) {
      var args = splitArgs(inner);
      var best = [0, 0, 0];
      args.forEach(function (arg) {
        var t = spec(arg);
        best = maxTriple(best, t);
      });
      if (name !== 'where') { a += best[0]; b += best[1]; c += best[2]; }
    });
    sel = sel.replace(/::[a-z0-9-]+/gi, function () { c++; return ' '; });
    sel = sel.replace(/:[a-z0-9-]+/gi, function () { b++; return ' '; });
    sel = sel.replace(/\[[^\]]+\]/g, function () { b++; return ' '; });
    sel = sel.replace(/\.[a-z0-9_-]+/gi, function () { b++; return ' '; });
    sel = sel.replace(/#[a-z0-9_-]+/gi, function () { a++; return ' '; });
    sel = sel.replace(/[a-z][a-z0-9_-]*/gi, function (m) {
      var k = m.toLowerCase();
      if (k === 'not' || k === 'is' || k === 'where' || k === 'has') return ' ';
      c++;
      return ' ';
    });
    return [a, b, c];
  }
  function cell(k, v) {
    return '<div style="padding:10px;border-radius:10px;background:rgba(45,212,255,.07);border:1px solid rgba(45,212,255,.25);"><div style="font-size:.7rem;color:var(--text-secondary);">' + k + '</div><div style="font-weight:800;color:var(--accent);margin-top:4px;">' + v + '</div></div>';
  }
  function run() {
    var s = $('cssp-in').value;
    var t = spec(s);
    var num = t[0] * 100 + t[1] * 10 + t[2];
    $('cssp-out').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;">' +
      cell('IDs (A)', String(t[0])) +
      cell('Classes / attrs / :pseudos (B)', String(t[1])) +
      cell('Types / ::elements (C)', String(t[2])) +
      cell('Tuple', '(' + t.join(', ') + ')') +
      cell('Sort key', String(num)) +
      '</div><p style="margin:10px 0 0;font-size:.75rem;color:var(--text-secondary);">Universal <code style="color:var(--accent);">*</code>, combinators and <code style="color:var(--accent);">:where()</code> add nothing. Compare two selectors by A, then B, then C — not by the concatenated number, which is only a mnemonic.</p>';
  }
  $('cssp-in').addEventListener('input', run);
  run();
})();
</script>
