<h2 id="nps-title" style="margin-top:0;color:var(--accent);">📡 NATO Phonetic Speller</h2>

<form aria-describedby="nps-desc" onsubmit="event.preventDefault();">
  <p id="nps-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Spell a name, postcode or booking reference the way air-traffic and support desks do. ICAO/NATO alphabet (Alfa, Bravo…). Digits stay as words.
  </p>
  <label for="nato-in" style="display:block;font-size:.78rem;color:var(--text-secondary);margin-bottom:5px;">Text</label>
  <input id="nato-in" type="text" value="LU1 2AB" spellcheck="false" style="width:100%;padding:10px;border-radius:8px;background:#071019;color:var(--text);border:1px solid rgba(255,255,255,.16);font-size:1.05rem;">
</form>
<pre id="nato-out" style="margin-top:12px;padding:12px;border-radius:10px;background:#071019;border:1px solid rgba(45,212,255,.28);color:#91f7ff;font-size:.9rem;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;"></pre>
<button type="button" id="nato-copy" style="margin-top:8px;padding:8px 12px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:700;">Copy</button>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var A = { A: 'Alfa', B: 'Bravo', C: 'Charlie', D: 'Delta', E: 'Echo', F: 'Foxtrot', G: 'Golf', H: 'Hotel', I: 'India', J: 'Juliett', K: 'Kilo', L: 'Lima', M: 'Mike', N: 'November', O: 'Oscar', P: 'Papa', Q: 'Quebec', R: 'Romeo', S: 'Sierra', T: 'Tango', U: 'Uniform', V: 'Victor', W: 'Whiskey', X: 'X-ray', Y: 'Yankee', Z: 'Zulu', '0': 'Zero', '1': 'One', '2': 'Two', '3': 'Three', '4': 'Four', '5': 'Five', '6': 'Six', '7': 'Seven', '8': 'Eight', '9': 'Niner' };
  function run() {
    var s = $('nato-in').value.toUpperCase(), out = [];
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i);
      if (ch === ' ') { out.push('/'); continue; }
      out.push(A[ch] || ch);
    }
    $('nato-out').textContent = out.join('  ');
  }
  $('nato-in').addEventListener('input', run);
  $('nato-copy').addEventListener('click', function () {
    var btn = this, t = $('nato-out').textContent;
    function done() { btn.textContent = '✓ Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done); else done();
  });
  run();
})();
</script>
