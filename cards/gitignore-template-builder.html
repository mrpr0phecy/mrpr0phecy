<h2 id="gign-title" style="margin-top:0;color:var(--accent);">🙈 .gitignore Builder</h2>

<form aria-describedby="gign-desc" onsubmit="event.preventDefault();">
  <p id="gign-desc" class="small" style="color:var(--text-secondary);margin-bottom:14px;font-size:0.85rem;">
    Tick the stacks you use. Output is a combined <code>.gitignore</code> — copy into the repo root. Git still tracks files you already committed; <code>git rm --cached</code> those separately.
  </p>
  <div id="gign-opts" style="display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem;color:var(--text-secondary);"></div>
</form>
<pre id="gign-out" style="margin-top:12px;padding:12px;border-radius:10px;background:#071019;border:1px solid rgba(45,212,255,.28);color:#91f7ff;font-size:.78rem;white-space:pre-wrap;max-height:280px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;"></pre>
<button type="button" id="gign-copy" style="margin-top:8px;padding:8px 12px;background:rgba(45,212,255,.14);color:var(--accent);border:1px solid rgba(45,212,255,.4);border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:700;">Copy .gitignore</button>

<script>
(function () {
  var host = document.currentScript.parentNode;
  var $ = function (id) { return host.querySelector('#' + id); };
  var T = {
    Node: '# Node\nnode_modules/\nnpm-debug.log*\nyarn-error.log\n.pnpm-store/\ndist/\n.build/\ncoverage/\n.env\n.env.local\n',
    Python: '# Python\n__pycache__/\n*.py[cod]\n.venv/\nvenv/\n.env\n.mypy_cache/\n.pytest_cache/\n.ruff_cache/\ndist/\n*.egg-info/\n',
    macOS: '# macOS\n.DS_Store\n.AppleDouble\n.LSOverride\n',
    Windows: '# Windows\nThumbs.db\ndesktop.ini\n$RECYCLE.BIN/\n',
    JetBrains: '# JetBrains\n.idea/\n*.iml\n',
    VSCode: '# VS Code (optional)\n.vscode/*\n!.vscode/extensions.json\n',
    Terraform: '# Terraform\n.terraform/\n*.tfstate\n*.tfstate.*\ncrash.log\noverride.tf\n',
    Docker: '# Docker\n*.log\ndocker-compose.override.yml\n'
  };
  var box = $('gign-opts');
  Object.keys(T).forEach(function (k, i) {
    var id = 'gign-' + k.toLowerCase();
    var lab = document.createElement('label');
    lab.style.display = 'flex'; lab.style.alignItems = 'center'; lab.style.gap = '6px';
    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.id = id; cb.dataset.k = k; cb.style.accentColor = 'var(--accent)';
    if (i < 3) cb.checked = true;
    lab.appendChild(cb); lab.appendChild(document.createTextNode(k));
    box.appendChild(lab);
    cb.addEventListener('change', run);
  });
  function run() {
    var parts = [];
    box.querySelectorAll('input:checked').forEach(function (cb) { parts.push(T[cb.dataset.k]); });
    $('gign-out').textContent = parts.join('\n') || '# tick a stack';
  }
  $('gign-copy').addEventListener('click', function () {
    var btn = this, t = $('gign-out').textContent;
    function done() { btn.textContent = '✓ Copied'; setTimeout(function () { btn.textContent = 'Copy .gitignore'; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done); else done();
  });
  run();
})();
</script>
