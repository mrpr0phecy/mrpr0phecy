<script>
(function(){
'use strict';

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 1200, H = 800;
canvas.width = W; canvas.height = H;

// Offscreen buffer for dynamic lighting
const lightCanvas = document.createElement('canvas');
lightCanvas.width = W; lightCanvas.height = H;
const lightCtx = lightCanvas.getContext('2d');

function resizeCanvas(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ----------------------------------------------------------------------------
// Audio Synthesizer
// ----------------------------------------------------------------------------
class WebAudioSynth {
  constructor(){ this.ctx = null; this.muted = false; }
  init(){
    if(!this.ctx){
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(AudioCtx) this.ctx = new AudioCtx();
    }
    if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  playTone(freq, type='sine', duration=0.15, vol=0.2, slideTo=null){
    if(this.muted || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, this.ctx.currentTime + duration);
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(); osc.stop(this.ctx.currentTime + duration);
    } catch(e){}
  }
  playNoise(duration=0.2, vol=0.25, lowpass=1000){
    if(this.muted || !this.ctx) return;
    try {
      const bufferSize = this.ctx.sampleRate * duration;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = lowpass;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
      noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
      noise.start();
    } catch(e){}
  }
  jump(){ this.playTone(280, 'sine', 0.14, 0.2, 580); }
  dash(){ this.playTone(600, 'triangle', 0.12, 0.25, 200); this.playNoise(0.12, 0.15, 800); }
  melee(){ this.playTone(360, 'sawtooth', 0.12, 0.3, 120); }
  castFire(){ this.playTone(450, 'sawtooth', 0.12, 0.18, 150); }
  castLightning(){ this.playTone(900, 'square', 0.1, 0.2, 300); this.playNoise(0.08, 0.2, 2500); }
  castIce(){ this.playTone(1200, 'sine', 0.18, 0.2, 1600); }
  castMeteor(){ this.playTone(180, 'sawtooth', 0.35, 0.3, 60); this.playNoise(0.35, 0.3, 400); }
  castVortex(){ this.playTone(220, 'sine', 0.3, 0.25, 660); }
  castLaser(){ this.playTone(880, 'square', 0.1, 0.2, 440); }
  slam(){ this.playTone(150, 'sawtooth', 0.35, 0.45, 40); this.playNoise(0.4, 0.45, 300); }
  hit(){ this.playTone(140, 'triangle', 0.1, 0.2, 70); }
  splat(){ this.playTone(220, 'sine', 0.15, 0.25, 80); this.playNoise(0.15, 0.25, 600); }
  pickup(){ this.playTone(523.25, 'sine', 0.08, 0.2, 1046.5); }
  powerup(){ this.playTone(440, 'triangle', 0.3, 0.3, 880); }
  hurt(){ this.playTone(180, 'square', 0.2, 0.3, 60); }
  bossRoar(){ this.playTone(90, 'sawtooth', 0.6, 0.5, 40); this.playNoise(0.6, 0.4, 250); }
  achievement(){ this.playTone(587.33, 'triangle', 0.4, 0.3, 880); }
}

const audio = new WebAudioSynth();
document.getElementById('audioToggle').addEventListener('click', ()=>{
  audio.init(); audio.muted = !audio.muted;
  document.getElementById('audioToggle').textContent = audio.muted ? '🔇 Muted' : '🔊 Audio';
});

// ----------------------------------------------------------------------------
// Biomes & Ultra HD Parallax
// ----------------------------------------------------------------------------
const BIOMES = [
  {name:'Haunted Graveyard', skyTop:[10,8,25], skyBot:[32,28,60], grass:[35,140,65], dirt:[65,42,28], weather:'fog', accent:[120,255,160], moonCol:'#e8f4f8', darkLevel:0.22},
  {name:'Toxic Mire & Ruins', skyTop:[8,22,15], skyBot:[22,58,40], grass:[65,220,55], dirt:[28,55,32], weather:'spores', accent:[160,255,50], moonCol:'#c8f0a0', darkLevel:0.25},
  {name:'Crimson Blood Citadel', skyTop:[35,6,15], skyBot:[85,22,35], grass:[190,40,50], dirt:[80,18,22], weather:'embers', accent:[255,80,80], moonCol:'#ff8888', darkLevel:0.20},
  {name:'Arcane Cosmic Sanctum', skyTop:[18,6,40], skyBot:[65,28,100], grass:[150,65,230], dirt:[50,22,75], weather:'stars', accent:[220,130,255], moonCol:'#e0b0ff', darkLevel:0.18},
  {name:'Frozen Necropolis', skyTop:[8,18,40], skyBot:[35,65,100], grass:[160,230,255], dirt:[40,60,90], weather:'snow', accent:[130,230,255], moonCol:'#d0f0ff', darkLevel:0.22},
  {name:'Infernal Nether Abyss', skyTop:[45,12,6], skyBot:[120,45,12], grass:[250,125,25], dirt:[105,40,12], weather:'embers', accent:[255,185,35], moonCol:'#ffd080', darkLevel:0.20}
];

// Stars & Constellations
const STARS = [];
for(let i=0; i<160; i++){
  STARS.push({x:Math.random()*W, y:Math.random()*H*0.75, s:0.8+Math.random()*2.2, t:Math.random()*100, spd:0.02+Math.random()*0.04});
}

class WeatherSystem {
  constructor(){
    this.particles = [];
    for(let i=0; i<110; i++){
      this.particles.push({
        x: Math.random() * W, y: Math.random() * H,
        spd: 1 + Math.random() * 2.5, size: 1.5 + Math.random() * 3.0,
        timer: Math.random() * 10, drift: (Math.random() - 0.5) * 0.8
      });
    }
  }
  update(type){
    for(const p of this.particles){
      p.timer += 0.05;
      if(type === 'snow'){ p.y += p.spd * 0.9; p.x += Math.sin(p.timer) * 1.2; }
      else if(type === 'embers'){ p.y -= p.spd * 1.1; p.x += Math.cos(p.timer) * 1.4; }
      else if(type === 'spores'){ p.y += Math.sin(p.timer) * 0.7; p.x += Math.cos(p.timer) * 0.7; }
      else { p.x += p.drift; p.y += Math.sin(p.timer * 0.5) * 0.3; }

      if(p.y > H) p.y = 0; if(p.y < 0) p.y = H;
      if(p.x > W) p.x = 0; if(p.x < 0) p.x = W;
    }
  }
  draw(biome){
    const col = biome.accent;
    for(const p of this.particles){
      const a = 0.3 + 0.45 * Math.sin(p.timer);
      ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ----------------------------------------------------------------------------
// Particle & Visual VFX
// ----------------------------------------------------------------------------
class Particle {
  constructor(x, y, color, size=4, speed=4, life=25, grav=0.15, glow=false){
    this.x = x; this.y = y;
    const ang = Math.random() * Math.PI * 2;
    const spd = (0.4 + Math.random() * 1.2) * speed;
    this.vx = Math.cos(ang) * spd; this.vy = Math.sin(ang) * spd;
    this.color = color; this.size = size; this.life = this.maxLife = life;
    this.grav = grav; this.glow = glow;
  }
  update(){
    this.x += this.vx; this.y += this.vy; this.vy += this.grav;
    this.life--; return this.life > 0;
  }
  draw(){
    const p = Math.max(0, this.life / this.maxLife);
    const sz = Math.max(0.5, this.size * p);
    ctx.fillStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},${p})`;
    ctx.beginPath(); ctx.arc(this.x, this.y, sz, 0, Math.PI * 2); ctx.fill();
    if(this.glow && sz > 2){
      ctx.fillStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},${p * 0.4})`;
      ctx.beginPath(); ctx.arc(this.x, this.y, sz * 2.2, 0, Math.PI * 2); ctx.fill();
    }
  }
}

class ShockwaveRing {
  constructor(x, y, color=[255,215,0], maxRadius=90, duration=24){
    this.x = x; this.y = y; this.color = color; this.maxRadius = maxRadius;
    this.duration = this.maxDuration = duration;
  }
  update(){ this.duration--; return this.duration > 0; }
  draw(){
    const p = 1.0 - (this.duration / this.maxDuration);
    const rad = this.maxRadius * p;
    const alpha = (1.0 - p) * 0.7;
    ctx.strokeStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},${alpha})`;
    ctx.lineWidth = Math.max(1, (1.0 - p) * 6);
    ctx.beginPath(); ctx.arc(this.x, this.y, rad, 0, Math.PI * 2); ctx.stroke();
  }
}

class BoneDebris {
  constructor(x, y){
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 8; this.vy = -Math.random() * 5 - 2;
    this.angle = Math.random() * 360; this.rotSpeed = (Math.random() - 0.5) * 20;
    this.life = 70; this.maxLife = 70; this.size = 5;
  }
  update(platforms){
    this.x += this.vx; this.y += this.vy; this.vy += 0.35;
    this.angle += this.rotSpeed; this.life--;
    for(const p of platforms){
      if(!p.isBroken && this.x > p.left && this.x < p.right && this.y + this.size >= p.top && this.y < p.bottom){
        this.y = p.top - this.size; this.vy = -this.vy * 0.4; this.vx *= 0.6; break;
      }
    }
    return this.life > 0;
  }
  draw(){
    const a = Math.min(1, this.life / 30);
    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle * Math.PI / 180);
    ctx.fillStyle = `rgba(235,235,225,${a})`;
    ctx.fillRect(-this.size/2, -this.size, this.size, this.size*2);
    ctx.restore();
  }
}

class FloatingText {
  constructor(text, x, y, color='#ffd700', size=26, duration=50){
    this.text = text; this.x = x; this.y = y; this.color = color;
    this.size = size; this.duration = this.maxDuration = duration;
    this.vy = -1.5;
  }
  update(){ this.y += this.vy; this.vy *= 0.96; this.duration--; return this.duration > 0; }
  draw(){
    const a = Math.min(1, this.duration / (this.maxDuration * 0.3));
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = `900 ${this.size}px 'Segoe UI',sans-serif`; ctx.textAlign = 'center';
    ctx.fillStyle = '#000'; ctx.fillText(this.text, this.x + 2, this.y + 2);
    ctx.fillStyle = this.color; ctx.fillText(this.text, this.x, this.y);
    ctx.restore();
  }
}

class AchievementBanner {
  constructor(title, desc){ this.title = title; this.desc = desc; this.timer = 180; this.y = -80; }
  update(){
    this.timer--;
    if(this.timer > 140) this.y += (30 - this.y) * 0.2;
    else if(this.timer < 30) this.y += (-90 - this.y) * 0.2;
    return this.timer > 0;
  }
  draw(){
    const w = 390, h = 70, x = W/2 - w/2;
    const grad = ctx.createLinearGradient(x, this.y, x + w, this.y + h);
    grad.addColorStop(0, 'rgba(20,20,45,0.95)'); grad.addColorStop(1, 'rgba(40,25,60,0.95)');
    ctx.fillStyle = grad; ctx.fillRect(x, this.y, w, h);
    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2; ctx.strokeRect(x, this.y, w, h);
    ctx.fillStyle = '#ffd700'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`🏆 ACHIEVEMENT UNLOCKED!`, x + 18, this.y + 24);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif';
    ctx.fillText(this.title + ' — ' + this.desc, x + 18, this.y + 48);
  }
}

// ----------------------------------------------------------------------------
// Platforms with Torch Braziers & Masonry
// ----------------------------------------------------------------------------
class Platform {
  constructor(x, y, w, h=24, type='solid'){
    this.x = x; this.y = y; this.w = w; this.h = h; this.type = type;
    this.moveTimer = Math.random() * 100;
    this.crumbleTimer = 0; this.isBroken = false; this.respawnTimer = 0;
    this.hasTorch = (w > 200 && Math.random() > 0.4);
    this.torchX = x + (Math.random() > 0.5 ? 25 : w - 25);
  }
  get left(){ return this.x; } get right(){ return this.x + this.w; }
  get top(){ return this.y; } get bottom(){ return this.y + this.h; }
  update(){
    if(this.type === 'moving'){
      this.moveTimer += 0.03; this.x += Math.sin(this.moveTimer) * 1.8;
    } else if(this.type === 'crumble'){
      if(this.crumbleTimer > 0){
        this.crumbleTimer--;
        if(this.crumbleTimer <= 0){ this.isBroken = true; this.respawnTimer = 180; }
      } else if(this.isBroken){
        this.respawnTimer--; if(this.respawnTimer <= 0) this.isBroken = false;
      }
    }
  }
  draw(theme, frameCount){
    if(this.isBroken) return;
    const shake = this.crumbleTimer > 0 ? (Math.random() - 0.5) * 4 : 0;
    ctx.save(); ctx.translate(shake, 0);

    // Stone Bevel
    const dirtGrad = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.h);
    dirtGrad.addColorStop(0, `rgb(${theme.dirt[0]+20},${theme.dirt[1]+20},${theme.dirt[2]+20})`);
    dirtGrad.addColorStop(1, `rgb(${theme.dirt[0]},${theme.dirt[1]},${theme.dirt[2]})`);
    ctx.fillStyle = dirtGrad;
    ctx.fillRect(this.x, this.y, this.w, this.h);

    // Brick / Cobblestone joints
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
    for(let bx = this.x + 30; bx < this.x + this.w - 10; bx += 40){
      ctx.strokeRect(bx, this.y + 6, 38, this.h - 8);
    }

    if(this.type === 'bouncy'){
      // Spring Mushroom Cap with Gradient
      const mg = ctx.createLinearGradient(this.x, this.y, this.x, this.y + 8);
      mg.addColorStop(0, '#ff40a0'); mg.addColorStop(1, '#c01060');
      ctx.fillStyle = mg; ctx.fillRect(this.x, this.y, this.w, 8);
      ctx.fillStyle = '#fffa65';
      for(let i = this.x + 10; i < this.x + this.w - 10; i += 18){
        ctx.beginPath(); ctx.arc(i, this.y + 4, 2.5, 0, Math.PI * 2); ctx.fill();
      }
    } else if(this.type === 'crumble'){
      ctx.fillStyle = '#8a796a'; ctx.fillRect(this.x, this.y, this.w, 7);
      ctx.fillStyle = '#111';
      for(let i = this.x + 12; i < this.x + this.w - 12; i += 22){
        ctx.fillRect(i, this.y, 2, 7);
      }
    } else {
      // Lush Arcane Surface
      const gg = ctx.createLinearGradient(this.x, this.y, this.x, this.y + 7);
      gg.addColorStop(0, `rgb(${theme.grass[0]+30},${theme.grass[1]+30},${theme.grass[2]+30})`);
      gg.addColorStop(1, `rgb(${theme.grass[0]},${theme.grass[1]},${theme.grass[2]})`);
      ctx.fillStyle = gg; ctx.fillRect(this.x, this.y, this.w, 7);
      for(let i = this.x + 6; i < this.x + this.w - 6; i += 10){
        ctx.fillStyle = `rgb(${theme.grass[0]+40},${theme.grass[1]+40},${theme.grass[2]+40})`;
        ctx.fillRect(i, this.y - 3, 2, 5);
      }
    }

    // Hanging Vines
    for(let vi = this.x + 20; vi < this.x + this.w - 20; vi += 60){
      ctx.strokeStyle = `rgba(${theme.grass[0]},${theme.grass[1]},${theme.grass[2]},0.5)`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(vi, this.y + this.h);
      ctx.quadraticCurveTo(vi + 4, this.y + this.h + 8, vi - 2, this.y + this.h + 16);
      ctx.stroke();
    }

    // Torch Brazier
    if(this.hasTorch){
      const tx = this.torchX;
      ctx.fillStyle = '#222'; ctx.fillRect(tx - 3, this.y - 12, 6, 12);
      ctx.fillStyle = '#444'; ctx.fillRect(tx - 5, this.y - 16, 10, 4);
      // Flame
      const fl = Math.sin(frameCount * 0.2 + tx) * 2;
      ctx.fillStyle = '#ff7700'; ctx.beginPath(); ctx.arc(tx + fl*0.5, this.y - 18, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffee00'; ctx.beginPath(); ctx.arc(tx + fl*0.3, this.y - 19, 3, 0, Math.PI * 2); ctx.fill();
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.strokeRect(this.x, this.y, this.w, this.h);
    ctx.restore();
  }
}

function generateLevel(waveNum){
  const plats = [new Platform(0, H - 60, W, 60, 'solid')];
  const tiers = [H - 200, H - 340, H - 480, H - 620];
  tiers.forEach(y => {
    const count = y > H - 500 ? (Math.random() > 0.4 ? 2 : 3) : (Math.random() > 0.5 ? 1 : 2);
    const types = ['solid', 'solid', 'solid'];
    if(waveNum >= 2 && Math.random() > 0.5) types.push('bouncy');
    if(waveNum >= 3 && Math.random() > 0.6) types.push('crumble');
    if(waveNum >= 4 && Math.random() > 0.7) types.push('moving');
    const pickType = () => types[Math.floor(Math.random() * types.length)];

    if(count === 1){
      const w = 280 + Math.random() * 120;
      plats.push(new Platform(220 + Math.random() * (W - w - 440), y, w, 24, pickType()));
    } else if(count === 2){
      const w1 = 210 + Math.random() * 90, w2 = 210 + Math.random() * 90;
      plats.push(new Platform(60 + Math.random() * (W/2 - w1 - 60), y, w1, 24, pickType()));
      plats.push(new Platform(W/2 + 40 + Math.random() * (W/2 - w2 - 80), y, w2, 24, pickType()));
    } else {
      const w1 = 160 + Math.random() * 70, w2 = 180 + Math.random() * 70, w3 = 160 + Math.random() * 70;
      plats.push(new Platform(40 + Math.random() * 200, y, w1, 24, pickType()));
      plats.push(new Platform(420 + Math.random() * 200, y, w2, 24, pickType()));
      plats.push(new Platform(820 + Math.random() * (W - w3 - 860), y, w3, 24, pickType()));
    }
  });
  return plats;
}

// ----------------------------------------------------------------------------
// Pickups
// ----------------------------------------------------------------------------
class Pickup {
  constructor(x, y, type=null){
    this.x = x; this.y = y; this.vx = (Math.random() - 0.5) * 3; this.vy = -4;
    const pool = ['coin', 'gem', 'heal', 'shield', 'frenzy', 'freeze', 'nuke'];
    const weights = [0.4, 0.25, 0.12, 0.08, 0.07, 0.05, 0.03];
    this.type = type || this.weightedPick(pool, weights);
    this.life = 450; this.bobTimer = Math.random() * 10; this.radius = 13;
  }
  weightedPick(items, weights){
    const r = Math.random(); let sum = 0;
    for(let i=0; i<items.length; i++){ sum += weights[i]; if(r <= sum) return items[i]; }
    return items[0];
  }
  update(platforms, player){
    this.bobTimer += 0.08; this.life--;
    const dx = player.x - this.x, dy = player.y - this.h/2 - this.y;
    const dist = Math.hypot(dx, dy);
    const magnetRange = player.perks.magnet > 0 ? 300 : 75;
    if(dist < magnetRange && dist > 0){
      const spd = player.perks.magnet > 0 ? 8 : 4;
      this.vx += (dx / dist) * spd * 0.15; this.vy += (dy / dist) * spd * 0.15;
    }
    this.x += this.vx; this.y += this.vy;
    this.vx *= 0.95; this.vy += 0.25;
    for(const p of platforms){
      if(!p.isBroken && this.x > p.left && this.x < p.right && this.y + this.radius >= p.top && this.y < p.bottom){
        this.y = p.top - this.radius; this.vy = 0; break;
      }
    }
    return this.life > 0;
  }
  draw(){
    if(this.life < 90 && Math.floor(this.life / 6) % 2 === 0) return;
    const cy = this.y + Math.sin(this.bobTimer) * 3;
    const colors = {heal:[50,220,90], shield:[45,215,255], nuke:[255,215,0], freeze:[180,230,255], frenzy:[255,140,20], gem:[180,70,240], coin:[255,220,50]};
    const c = colors[this.type] || [255,255,255];
    ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},0.3)`;
    ctx.beginPath(); ctx.arc(this.x, cy, this.radius * 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.beginPath(); ctx.arc(this.x, cy, this.radius, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(this.x, cy, this.radius - 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const syms = {heal:'♥', shield:'🛡', nuke:'💣', freeze:'❄', frenzy:'⚡', gem:'✦', coin:'●'};
    ctx.fillText(syms[this.type] || '?', this.x, cy);
  }
}

// ----------------------------------------------------------------------------
// Projectiles & Ultra VFX
// ----------------------------------------------------------------------------
class Projectile {
  constructor(x, y, angle, spellType='fireball', dmgMult=1.0, sizeMult=1.0){
    this.x = x; this.y = y; this.spellType = spellType; this.angle = angle;
    this.dmgMult = dmgMult;
    this.pierceLeft = spellType === 'ice' || spellType === 'laser' ? 3 : (spellType === 'vortex' ? 10 : 0);
    this.trail = [];
    if(spellType === 'lightning'){
      this.speed = 22; this.radius = 8 * sizeMult; this.life = 45; this.color = [45,215,255]; this.baseDmg = 2.5;
    } else if(spellType === 'ice'){
      this.speed = 14; this.radius = 10 * sizeMult; this.life = 60; this.color = [180,230,255]; this.baseDmg = 1.8;
    } else if(spellType === 'meteor'){
      this.speed = 10; this.radius = 16 * sizeMult; this.life = 85; this.color = [180,70,240]; this.baseDmg = 5.0;
    } else if(spellType === 'vortex'){
      this.speed = 8; this.radius = 18 * sizeMult; this.life = 100; this.color = [220,80,255]; this.baseDmg = 3.2;
    } else if(spellType === 'laser'){
      this.speed = 28; this.radius = 10 * sizeMult; this.life = 35; this.color = [255,230,50]; this.baseDmg = 4.0;
    } else {
      this.speed = 15; this.radius = 12 * sizeMult; this.life = 70; this.color = [255,120,30]; this.baseDmg = 2.0;
    }
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;
    if(spellType === 'meteor') this.vy -= 2;
  }
  get rect(){ return {x:this.x-this.radius, y:this.y-this.radius, w:this.radius*2, h:this.radius*2}; }
  update(platforms){
    this.trail.push({x:this.x, y:this.y});
    if(this.trail.length > 8) this.trail.shift();
    if(this.spellType === 'meteor') this.vy += 0.25;
    this.x += this.vx; this.y += this.vy; this.life--;
    const r = this.rect;
    for(const p of platforms){
      if(!p.isBroken && r.x < p.right && r.x + r.w > p.left && r.y < p.bottom && r.y + r.h > p.top && this.spellType !== 'laser' && this.spellType !== 'vortex') return false;
    }
    return this.life > 0 && this.x >= 0 && this.x <= W && this.y >= 0 && this.y <= H;
  }
  draw(){
    for(let i=0; i<this.trail.length; i++){
      const a = (i / this.trail.length) * 0.45;
      const sz = Math.max(2, this.radius * (i / this.trail.length));
      ctx.fillStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},${a})`;
      ctx.beginPath(); ctx.arc(this.trail[i].x, this.trail[i].y, sz, 0, Math.PI * 2); ctx.fill();
    }
    // Outer Glow
    ctx.fillStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},0.4)`;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius * 2.0, 0, Math.PI * 2); ctx.fill();
    // Inner Radiant Core
    ctx.fillStyle = `rgb(${this.color[0]},${this.color[1]},${this.color[2]})`;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(this.x, this.y, Math.max(2, this.radius - 4), 0, Math.PI * 2); ctx.fill();
  }
}

// ----------------------------------------------------------------------------
// Riley (Player Character Art & Animation)
// ----------------------------------------------------------------------------
class Riley {
  constructor(){
    this.x = W / 2; this.y = H - 120; this.w = 44; this.h = 58;
    this.vx = 0; this.vy = 0; this.speed = 7.4; this.jumpPower = -16.2;
    this.gravity = 0.68; this.onGround = false; this.onWall = 0;
    this.doubleJumpReady = true; this.facing = 1;
    this.cooldown = 0; this.meleeCooldown = 0; this.invincible = 0; this.hitFlash = 0;
    this.dashCooldown = 0; this.dashTimer = 0; this.slamming = false;
    this.coyoteTimer = 0; this.activeSpell = 'fireball';
    this.rageMeter = 0; this.maxRage = 100; this.combo = 0; this.comboTimer = 0;
    this.animTimer = 0; this.shieldActive = false;
    this.perks = {multiCast:0, explosiveCore:0, slamMastery:0, blizzard:0, chainStun:0, hyperDash:0, magnet:0, vampirism:0, doubleJump:1};
  }
  get rect(){ return {x:this.x - this.w/2, y:this.y - this.h, w:this.w, h:this.h}; }
  triggerMelee(zombies, enemyProjs, particles, floatingTexts){
    if(this.meleeCooldown > 0) return;
    this.meleeCooldown = 20; audio.melee();
    const hitbox = {x:this.x + (this.facing > 0 ? 10 : -60), y:this.y - this.h/2 - 25, w:50, h:50};

    for(const ep of enemyProjs){
      if(ep.x > hitbox.x && ep.x < hitbox.x + hitbox.w && ep.y > hitbox.y && ep.y < hitbox.y + hitbox.h){
        ep.vx = -ep.vx * 1.5; ep.vy = -ep.vy * 1.5;
        floatingTexts.push(new FloatingText("DEFLECT!", ep.x, ep.y - 10, '#2dd4ff', 24));
      }
    }
    for(const z of zombies){
      if(z.alive && hitbox.x < z.rect.x + z.rect.w && hitbox.x + hitbox.w > z.rect.x && hitbox.y < z.rect.y + z.rect.h && hitbox.y + hitbox.h > z.rect.y){
        z.takeDamage(4.0, 'melee', particles);
        z.vx = this.facing * 8;
        floatingTexts.push(new FloatingText("STAFF SMASH!", z.x + z.w/2, z.y - 10, '#ffd700', 26));
      }
    }
    for(let i=0; i<12; i++) particles.push(new Particle(this.x + this.facing * 30, this.y - this.h/2, [255,240,90], 5, 6, 16, 0.1, true));
  }
  triggerSlam(){
    if(!this.onGround && !this.slamming){ this.slamming = true; this.vy = 25; audio.dash(); }
  }
  triggerDash(){
    const cdLimit = this.perks.hyperDash > 0 ? 24 : 40;
    if(this.dashCooldown <= 0 && this.dashTimer <= 0){
      this.dashTimer = 10; this.dashCooldown = cdLimit;
      this.invincible = Math.max(this.invincible, 14); audio.dash();
    }
  }
  switchSpell(spell){ this.activeSpell = spell; audio.pickup(); }
  update(keys, platforms, particles, floatingTexts, rings){
    this.animTimer++;
    if(this.cooldown > 0) this.cooldown--;
    if(this.meleeCooldown > 0) this.meleeCooldown--;
    if(this.invincible > 0) this.invincible--;
    if(this.hitFlash > 0) this.hitFlash--;
    if(this.dashCooldown > 0) this.dashCooldown--;
    if(this.comboTimer > 0) this.comboTimer--; else this.combo = 0;

    if(this.onGround){ this.coyoteTimer = 6; this.doubleJumpReady = true; }
    else if(this.coyoteTimer > 0) this.coyoteTimer--;

    this.vx = 0;
    if(this.dashTimer > 0){
      this.dashTimer--;
      this.vx = this.facing * (this.perks.hyperDash > 0 ? 22 : 18);
      particles.push(new Particle(this.x, this.y - this.h/2, [45,215,255], 6, 2, 12, 0, true));
    } else {
      if(keys['ArrowLeft'] || keys['KeyA']) { this.vx = -this.speed; this.facing = -1; }
      if(keys['ArrowRight'] || keys['KeyD']) { this.vx = this.speed; this.facing = 1; }
    }

    if(keys['ArrowUp'] || keys['KeyW']){
      if(this.coyoteTimer > 0){
        this.vy = this.jumpPower; this.onGround = false; this.coyoteTimer = 0; audio.jump();
        for(let i=0; i<6; i++) particles.push(new Particle(this.x, this.y, [255,255,255], 3, 3, 15));
      } else if(this.onWall !== 0){
        this.vy = this.jumpPower * 0.95; this.vx = -this.onWall * this.speed * 1.4;
        this.facing = -this.onWall; this.onWall = 0; audio.jump();
        floatingTexts.push(new FloatingText("WALL JUMP!", this.x, this.y - this.h/2, '#2dd4ff', 22));
      } else if(this.doubleJumpReady && this.perks.doubleJump > 0){
        this.vy = this.jumpPower * 0.88; this.doubleJumpReady = false; audio.jump();
        floatingTexts.push(new FloatingText("DOUBLE JUMP!", this.x, this.y - this.h/2, '#ffd700', 22));
      }
    }

    if(!this.slamming){
      if(this.onWall !== 0 && this.vy > 0){
        this.vy += this.gravity * 0.35; if(this.vy > 4) this.vy = 4;
      } else {
        this.vy += this.gravity; if(this.vy > 18) this.vy = 18;
      }
    } else {
      this.vy = 26;
      particles.push(new Particle(this.x, this.y, [255,215,0], 5, 2, 10, 0, true));
    }

    this.x += this.vx;
    this.onWall = 0;
    let r = this.rect;
    for(const p of platforms){
      if(!p.isBroken && r.x < p.right && r.x + r.w > p.left && r.y < p.bottom && r.y + r.h > p.top){
        if(this.vx > 0){ this.x = p.left - this.w/2; if(!this.onGround) this.onWall = 1; }
        else if(this.vx < 0){ this.x = p.right + this.w/2; if(!this.onGround) this.onWall = -1; }
      }
    }

    this.y += this.vy; this.onGround = false;
    r = this.rect;
    for(const p of platforms){
      if(!p.isBroken && r.x < p.right && r.x + r.w > p.left && r.y < p.bottom && r.y + r.h > p.top){
        if(this.vy > 0){
          this.y = p.top; this.vy = 0; this.onGround = true;
          if(this.slamming){
            this.slamming = false; audio.slam();
            rings.push(new ShockwaveRing(this.x, this.y, [255,215,0], 140, 24));
            floatingTexts.push(new FloatingText("⚡ SEISMIC SLAM!", this.x, this.y - this.h - 15, '#ffd700', 32));
            for(let i=0; i<35; i++){
              particles.push(new Particle(this.x, this.y, [255,215,0], 6, 8, 28, 0.2, true));
              particles.push(new Particle(this.x, this.y, [255,120,30], 5, 6, 22));
            }
          }
          if(p.type === 'bouncy'){
            this.vy = this.jumpPower * 1.55; this.onGround = false; audio.jump();
            rings.push(new ShockwaveRing(this.x, this.y, [255,50,180], 70, 18));
            for(let i=0; i<12; i++) particles.push(new Particle(this.x, this.y, [255,50,180], 5, 6, 20, 0.1, true));
          } else if(p.type === 'crumble' && p.crumbleTimer === 0){
            p.crumbleTimer = 60;
          }
        } else if(this.vy < 0){
          this.y = p.bottom + this.h; this.vy = 0;
        }
      }
    }
    this.x = Math.max(this.w/2, Math.min(W - this.w/2, this.x));
  }
  shoot(dx=0, dy=0){
    if(this.cooldown > 0) return [];
    const projs = [];
    const angle = (dx !== 0 || dy !== 0) ? Math.atan2(dy, dx) : (this.facing > 0 ? 0 : Math.PI);
    const count = 1 + this.perks.multiCast;
    const spread = 0.18;
    const dmgMult = 1.0 + (this.combo > 0 ? Math.min(3.0, 0.25 * this.combo) : 0);
    const szMult = this.perks.explosiveCore > 0 ? 1.4 : 1.0;

    for(let i=0; i<count; i++){
      const off = angle + (i - (count - 1)/2) * spread;
      projs.push(new Projectile(this.x + this.facing * 20, this.y - this.h/2 - 5, off, this.activeSpell, dmgMult, szMult));
    }
    const cdMap = {fireball:12, lightning:16, ice:14, meteor:28, vortex:35, laser:8};
    this.cooldown = cdMap[this.activeSpell] || 12;

    if(this.activeSpell === 'fireball') audio.castFire();
    else if(this.activeSpell === 'lightning') audio.castLightning();
    else if(this.activeSpell === 'ice') audio.castIce();
    else if(this.activeSpell === 'meteor') audio.castMeteor();
    else if(this.activeSpell === 'vortex') audio.castVortex();
    else if(this.activeSpell === 'laser') audio.castLaser();
    return projs;
  }
  draw(){
    if(this.hitFlash > 0 && Math.floor(this.hitFlash / 4) % 2 === 0) return;
    const x = this.x, y = this.y, f = this.facing;
    const bob = (this.onGround && this.vx === 0) ? Math.sin(this.animTimer * 0.18) * 2 : 0;

    // Ambient Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath(); ctx.ellipse(x, y - 2, 22, 6, 0, 0, Math.PI * 2); ctx.fill();

    // Flowing Cape
    ctx.fillStyle = '#1e2470';
    ctx.beginPath();
    ctx.moveTo(x - f * 8, y - 36 + bob);
    ctx.quadraticCurveTo(x - f * 24 - this.vx * 2, y - 18, x - f * 18 - this.vx * 3, y - 2);
    ctx.lineTo(x - f * 4, y - 2);
    ctx.closePath(); ctx.fill();

    // Robe with Runic Trim
    const robeGrad = ctx.createLinearGradient(x, y - 36, x, y);
    robeGrad.addColorStop(0, '#3248c8'); robeGrad.addColorStop(1, '#1b2678');
    ctx.fillStyle = robeGrad;
    ctx.beginPath();
    ctx.moveTo(x - 18, y); ctx.lineTo(x + 18, y);
    ctx.lineTo(x + 13, y - 34 + bob); ctx.lineTo(x - 13, y - 34 + bob);
    ctx.closePath(); ctx.fill();

    // Golden Sash & Rune Glyphs
    ctx.fillStyle = '#ffd700'; ctx.fillRect(x - 13, y - 18 + bob, 26, 3);
    ctx.fillStyle = 'rgba(45,212,255,0.7)';
    for(let rx = x - 12; rx <= x + 10; rx += 6){
      ctx.fillRect(rx, y - 6, 2, 2);
    }

    // Head & Hair
    ctx.fillStyle = '#ffd2b4'; ctx.beginPath(); ctx.arc(x, y - 40 + bob, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e63c1e';
    ctx.beginPath();
    ctx.moveTo(x - 12, y - 48 + bob); ctx.lineTo(x + 12, y - 48 + bob); ctx.lineTo(x, y - 58 + bob);
    ctx.closePath(); ctx.fill();

    // Glasses Glint
    const ex = x + f * 4, ey = y - 40 + bob;
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ex, ey, 6, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#288cff'; ctx.beginPath(); ctx.arc(ex + f, ey, 2, 0, Math.PI * 2); ctx.fill();

    // Wizard Hat
    const hb = y - 50 + bob;
    ctx.fillStyle = '#3a20a0';
    ctx.beginPath(); ctx.ellipse(x, hb - 2, 22, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 14, hb); ctx.lineTo(x + 14, hb); ctx.lineTo(x + f * 6, hb - 36); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(x + f * 6, hb - 36, 4, 0, Math.PI * 2); ctx.fill();

    // Staff & Rotating Arcane Gem
    const sx = x + f * 18, sy = y - 28 + bob;
    ctx.strokeStyle = '#703c14'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x + f * 6, y - 22 + bob); ctx.lineTo(sx, sy - 10); ctx.stroke();

    const spellCols = {fireball:[255,120,30], lightning:[45,215,255], ice:[180,230,255], meteor:[180,70,240], vortex:[220,80,255], laser:[255,230,50]};
    const sc = spellCols[this.activeSpell] || [255,215,0];
    const pulse = 0.6 + 0.4 * Math.sin(this.animTimer * 0.2);

    // Glowing staff orb
    ctx.fillStyle = `rgba(${sc[0]},${sc[1]},${sc[2]},${pulse * 0.5})`;
    ctx.beginPath(); ctx.arc(sx, sy - 10, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgb(${sc[0]},${sc[1]},${sc[2]})`;
    ctx.beginPath(); ctx.arc(sx, sy - 10, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(sx, sy - 10, 2.5, 0, Math.PI * 2); ctx.fill();
  }
}

// ----------------------------------------------------------------------------
// Zombies (Detailed Shading & Animation)
// ----------------------------------------------------------------------------
class Zombie {
  constructor(type, plat){
    this.type = type; this.platform = plat; this.alive = true;
    this.hitTimer = 0; this.animFrame = Math.random() * 100; this.frozenTimer = 0;
    this.isElite = Math.random() < 0.15 && !type.startsWith('boss');

    if(type === 'runner'){
      this.w = 28; this.h = 32; this.speed = 3.6; this.hp = this.maxHp = 2.0; this.color = [190,45,60]; this.scoreVal = 30; this.name = "Ghoul Runner";
    } else if(type === 'spitter'){
      this.w = 36; this.h = 36; this.speed = 1.4; this.hp = this.maxHp = 3.5; this.color = [140,255,30]; this.scoreVal = 45; this.name = "Acid Spitter"; this.spitCd = 60 + Math.random() * 60;
    } else if(type === 'boomer'){
      this.w = 38; this.h = 38; this.speed = 2.2; this.hp = this.maxHp = 2.5; this.color = [240,140,20]; this.scoreVal = 50; this.name = "Explosive Boomer";
    } else if(type === 'gargoyle'){
      this.w = 34; this.h = 30; this.speed = 3.0; this.hp = this.maxHp = 3.0; this.color = [90,110,150]; this.scoreVal = 60; this.name = "Gargoyle"; this.altitude = 150 + Math.random() * 200;
    } else if(type === 'shield_skeleton'){
      this.w = 34; this.h = 40; this.speed = 1.5; this.hp = this.maxHp = 5.0; this.color = [210,210,200]; this.scoreVal = 70; this.name = "Shield Skeleton";
    } else if(type === 'brute'){
      this.w = 52; this.h = 52; this.speed = 1.1; this.hp = this.maxHp = 8.0; this.color = [130,40,170]; this.scoreVal = 80; this.name = "Armored Goliath";
    } else if(type === 'necromancer'){
      this.w = 34; this.h = 44; this.speed = 1.6; this.hp = this.maxHp = 5.0; this.color = [75,25,120]; this.scoreVal = 100; this.name = "Necromancer"; this.summonCd = 180;
    } else if(type === 'boss_abomination'){
      this.w = 96; this.h = 96; this.speed = 1.8; this.hp = this.maxHp = 60.0; this.color = [180,25,45]; this.scoreVal = 500; this.name = "ABOMINATION TITAN";
    } else if(type === 'boss_necrolord'){
      this.w = 88; this.h = 92; this.speed = 2.0; this.hp = this.maxHp = 90.0; this.color = [110,20,160]; this.scoreVal = 1000; this.name = "NECROLORD OF THE DAMNED";
    } else if(type === 'boss_void_lich'){
      this.w = 104; this.h = 104; this.speed = 2.2; this.hp = this.maxHp = 140.0; this.color = [50,10,90]; this.scoreVal = 2000; this.name = "VOID CYCLOPS LICH-KING";
    } else {
      this.w = 32; this.h = 36; this.speed = 1.8; this.hp = this.maxHp = 2.0; this.color = [60,180,75]; this.scoreVal = 20; this.name = "Undead Walker";
    }

    if(this.isElite){ this.speed *= 1.4; this.hp *= 1.5; this.maxHp *= 1.5; this.scoreVal *= 2; }
    this.x = plat.left + 20 + Math.random() * Math.max(10, plat.w - 40 - this.w);
    this.y = type === 'gargoyle' ? this.altitude : plat.top - this.h;
    this.vx = (Math.random() > 0.5 ? 1 : -1) * this.speed;
  }
  get rect(){ return {x:this.x, y:this.y, w:this.w, h:this.h}; }
  update(playerRect, enemyProjs, spawnedZombies){
    if(!this.alive) return;
    this.animFrame++;
    if(this.hitTimer > 0) this.hitTimer--;
    if(this.frozenTimer > 0){ this.frozenTimer--; return; }

    const cx = this.x + this.w/2;
    if(this.type === 'gargoyle'){
      const dx = playerRect.x + playerRect.w/2 - cx;
      this.vx = dx > 0 ? this.speed : -this.speed;
      this.y += Math.sin(this.animFrame * 0.1) * 2;
    } else if(this.type === 'runner' || this.type === 'boomer' || this.type.startsWith('boss')){
      this.vx = playerRect.x + playerRect.w/2 > cx ? this.speed : -this.speed;
    } else if(this.type === 'spitter'){
      if(Math.abs((playerRect.x + playerRect.w/2) - cx) < 180){
        this.vx = (playerRect.x + playerRect.w/2 > cx) ? -this.speed : this.speed;
      } else {
        this.vx = 0;
      }
      this.spitCd--;
      if(this.spitCd <= 0){
        this.spitCd = 90 + Math.random() * 60;
        const ang = Math.atan2((playerRect.y + playerRect.h/2) - (this.y + 10), (playerRect.x + playerRect.w/2) - cx);
        enemyProjs.push({x:cx, y:this.y+10, vx:Math.cos(ang)*7.5, vy:Math.sin(ang)*7.5, r:7, color:[140,255,30], life:90});
      }
    } else if(this.type === 'necromancer'){
      this.summonCd--;
      if(this.summonCd <= 0){
        this.summonCd = 200; spawnedZombies.push(new Zombie('runner', this.platform));
      }
    } else {
      if(this.x <= this.platform.left) this.vx = this.speed;
      else if(this.x + this.w >= this.platform.right) this.vx = -this.speed;
    }
    this.x += this.vx;
  }
  takeDamage(amount, damageType='fireball', particles=[]){
    this.hp -= amount; this.hitTimer = 8; audio.hit();
    if(damageType === 'ice') this.frozenTimer = 70;
    const splatCol = this.type === 'spitter' ? [140,255,30] : [200,30,40];
    for(let i=0; i<8; i++) particles.push(new Particle(this.x + this.w/2, this.y + this.h/2, splatCol, 4, 5, 20));

    if(this.hp <= 0){
      this.alive = false; audio.splat(); return true;
    }
    return false;
  }
  draw(){
    if(!this.alive) return;
    const cx = this.x + this.w/2, bot = this.y + this.h;
    const bob = Math.sin(this.animFrame * 0.15) * 2;
    let c = this.hitTimer > 0 ? [255,255,255] : (this.frozenTimer > 0 ? [140,210,255] : this.color);

    if(this.isElite){
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(cx, bot - this.h/2 + bob, this.w/2 + 6, this.h/2 + 6, 0, 0, Math.PI * 2); ctx.stroke();
    }

    // Shaded Zombie Body
    const zGrad = ctx.createRadialGradient(cx, bot - this.h/2 + bob, this.w/6, cx, bot - this.h/2 + bob, this.w/2);
    zGrad.addColorStop(0, `rgb(${Math.min(255, c[0]+40)},${Math.min(255, c[1]+40)},${Math.min(255, c[2]+40)})`);
    zGrad.addColorStop(1, `rgb(${c[0]},${c[1]},${c[2]})`);
    ctx.fillStyle = zGrad;
    ctx.beginPath(); ctx.ellipse(cx, bot - this.h/2 + bob, this.w/2, this.h/2, 0, 0, Math.PI * 2); ctx.fill();

    // Glowing Menacing Eyes
    const ed = this.vx > 0 ? 1 : -1;
    ctx.fillStyle = this.type === 'boomer' ? '#ffeb3b' : '#ff1744';
    ctx.beginPath(); ctx.arc(cx + ed * 5, this.y + 12 + bob, Math.max(2, this.w/7), 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx + ed * 6, this.y + 12 + bob, Math.max(1, this.w/12), 0, Math.PI * 2); ctx.fill();

    // Arms with ragged sleeves
    ctx.strokeStyle = `rgb(${c[0]},${c[1]},${c[2]})`; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx, bot - this.h/2 + bob); ctx.lineTo(cx + ed * (this.w/2 + 4), bot - this.h/2 - 4 + bob); ctx.stroke();

    // HP Bar
    if(this.maxHp > 2.0){
      const bw = this.w * 1.3, bx = cx - bw/2, by = this.y - 14 + bob;
      ctx.fillStyle = '#000'; ctx.fillRect(bx, by, bw, 6);
      const pct = Math.max(0, this.hp / this.maxHp);
      ctx.fillStyle = pct > 0.5 ? '#39ff14' : (pct > 0.25 ? '#ffeb3b' : '#ff1744');
      ctx.fillRect(bx, by, bw * pct, 6);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, bw, 6);
    }
  }
}

// ----------------------------------------------------------------------------
// Game State Manager
// ----------------------------------------------------------------------------
let gameState = 'start';
let wave = 1, score = 0, lives = 5, maxLives = 5, gold = 0;
let screenShake = 0, shakeIntensity = 0, frameCount = 0;
let player = new Riley();
let platforms = [], zombies = [], projectiles = [], enemyProjectiles = [];
let pickups = [], particles = [], shockwaves = [], bones = [], floatingTexts = [], banners = [];
let weather = new WeatherSystem();
let shopOptions = [], selectedShopIdx = 0;
let totalZombiesKilled = 0, isPaused = false;
let unlockedAchievements = new Set();
let keys = {};

function triggerScreenShake(frames=15, intensity=8){
  screenShake = frames; shakeIntensity = intensity;
}

function checkAchievement(id, title, desc){
  if(!unlockedAchievements.has(id)){
    unlockedAchievements.add(id);
    banners.push(new AchievementBanner(title, desc));
    audio.achievement();
  }
}

function getBiome(){
  return BIOMES[(wave - 1) % BIOMES.length];
}

function setupWave(){
  platforms = generateLevel(wave);
  zombies = []; enemyProjectiles = [];
  if(wave % 5 === 0){
    const bType = wave >= 15 ? 'boss_void_lich' : (wave >= 10 ? 'boss_necrolord' : 'boss_abomination');
    const boss = new Zombie(bType, platforms[0]);
    zombies.push(boss);
    audio.bossRoar();
    floatingTexts.push(new FloatingText(`⚠️ BOSS ENCOUNTER: ${boss.name}!`, W/2, H/3, '#ff1744', 44, 90));
    for(let i=0; i<4; i++) zombies.push(new Zombie('runner', platforms[1 + Math.floor(Math.random()*(platforms.length-1))]));
  } else {
    const count = Math.min(25, 4 + wave * 3);
    for(let i=0; i<count; i++){
      const plat = platforms[1 + Math.floor(Math.random()*(platforms.length-1))];
      const zTypes = ['standard','runner','spitter','boomer','gargoyle','shield_skeleton','brute','necromancer'];
      const zType = zTypes[Math.floor(Math.random() * zTypes.length)];
      zombies.push(new Zombie(zType, plat));
    }
  }
  floatingTexts.push(new FloatingText(`Wave ${wave}: ${getBiome().name}`, W/2, H/2 - 50, '#ffd700', 48, 80));
}

function openShop(){
  gameState = 'shop';
  const allPerks = [
    {id:'multiCast', name:'Arcane Split Shot', desc:'Fires +1 extra projectile per spell cast.', cost:120},
    {id:'explosiveCore', name:'Infernal Core', desc:'Spell explosion radius & impact area +50%.', cost:150},
    {id:'slamMastery', name:'Titan Ground Slam', desc:'Ground slam shockwave damage and range +100%.', cost:140},
    {id:'blizzard', name:'Frostbite Mastery', desc:'Ice spells freeze enemies 2x longer with bonus shatter.', cost:110},
    {id:'chainStun', name:'Tesla Voltage', desc:'Lightning arcs to 2 additional targets with stun.', cost:130},
    {id:'hyperDash', name:'Chrono Warp Dash', desc:'Dash cooldown reduced by 40% with longer invulnerability.', cost:100},
    {id:'magnet', name:'Arcane Magnet', desc:'Loot & powerups are automatically drawn to Riley.', cost:90},
    {id:'vampirism', name:'Vampiric Blast', desc:'High combos grant a chance to heal +1 Life.', cost:160},
    {id:'extraLife', name:'Elixir of Life', desc:'Restores missing hearts and raises Max Life by 1.', cost:180}
  ];
  shopOptions = allPerks.sort(() => 0.5 - Math.random()).slice(0, 3);
  selectedShopIdx = 0;
  audio.powerup();
}

function applyPerk(perk){
  if(gold < perk.cost) return false;
  gold -= perk.cost;
  if(perk.id === 'extraLife'){ maxLives++; lives = maxLives; }
  else { player.perks[perk.id] = (player.perks[perk.id] || 0) + 1; }
  audio.pickup();
  floatingTexts.push(new FloatingText(`Acquired ${perk.name}!`, W/2, H/2, '#39ff14', 40));
  return true;
}

function resetGame(){
  gameState = 'playing'; wave = 1; score = 0; lives = 5; maxLives = 5; gold = 0;
  totalZombiesKilled = 0; player = new Riley();
  projectiles = []; enemyProjectiles = []; pickups = []; particles = []; shockwaves = []; bones = []; floatingTexts = []; banners = [];
  setupWave();
}

// ----------------------------------------------------------------------------
// Controls
// ----------------------------------------------------------------------------
window.addEventListener('keydown', e => {
  audio.init();
  keys[e.code] = true;

  if(gameState === 'start'){
    if(e.code === 'Space' || e.code === 'Enter') resetGame();
  } else if(gameState === 'playing'){
    if(e.code === 'Digit1') player.switchSpell('fireball');
    if(e.code === 'Digit2') player.switchSpell('lightning');
    if(e.code === 'Digit3') player.switchSpell('ice');
    if(e.code === 'Digit4') player.switchSpell('meteor');
    if(e.code === 'Digit5') player.switchSpell('vortex');
    if(e.code === 'Digit6') player.switchSpell('laser');

    if(e.code === 'ShiftLeft' || e.code === 'ShiftRight') player.triggerDash();
    if(e.code === 'ArrowDown' || e.code === 'KeyS') player.triggerSlam();
    if(e.code === 'KeyF' || e.code === 'KeyE') player.triggerMelee(zombies, enemyProjectiles, particles, floatingTexts);

    if(e.code === 'Space'){
      e.preventDefault();
      const tdx = player.facing, tdy = (keys['ArrowUp']||keys['KeyW']) ? -1 : ((keys['ArrowDown']||keys['KeyS']) ? 1 : 0);
      projectiles.push(...player.shoot(tdx, tdy));
    }
    if(e.code === 'KeyR' && player.rageMeter >= player.maxRage){
      player.rageMeter = 0; triggerScreenShake(30, 14); audio.castMeteor();
      shockwaves.push(new ShockwaveRing(W/2, H/2, [255,215,0], 400, 35));
      floatingTexts.push(new FloatingText("💥 APOCALYPSE METEOR SMASH!", W/2, H/3, '#ffd700', 50));
      for(const z of zombies){
        if(z.alive){ z.takeDamage(30.0, 'meteor', particles); score += z.scoreVal * 2; gold += 15; }
      }
    }
    if(e.code === 'KeyP') isPaused = !isPaused;
  } else if(gameState === 'shop'){
    if(e.code === 'ArrowLeft' || e.code === 'KeyA') selectedShopIdx = (selectedShopIdx + 2) % 3;
    if(e.code === 'ArrowRight' || e.code === 'KeyD') selectedShopIdx = (selectedShopIdx + 1) % 3;
    if(e.code === 'Space' || e.code === 'Enter'){
      if(applyPerk(shopOptions[selectedShopIdx])){ gameState = 'playing'; setupWave(); }
    }
    if(e.code === 'Escape'){ gameState = 'playing'; setupWave(); }
  } else if(gameState === 'gameover'){
    if(e.code === 'Space' || e.code === 'Enter') resetGame();
  }
});

window.addEventListener('keyup', e => { keys[e.code] = false; });

function bindTouch(id, onStart, onEnd=null){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('touchstart', e => { e.preventDefault(); audio.init(); onStart(); }, {passive:false});
  if(onEnd) el.addEventListener('touchend', e => { e.preventDefault(); onEnd(); }, {passive:false});
}

bindTouch('btnLeft', () => { keys['ArrowLeft'] = true; }, () => { keys['ArrowLeft'] = false; });
bindTouch('btnRight', () => { keys['ArrowRight'] = true; }, () => { keys['ArrowRight'] = false; });
bindTouch('btnJump', () => {
  if(gameState === 'start' || gameState === 'gameover') resetGame();
  else if(gameState === 'playing'){
    if(player.coyoteTimer > 0){
      player.vy = player.jumpPower; player.onGround = false; player.coyoteTimer = 0; audio.jump();
    } else if(player.onWall !== 0){
      player.vy = player.jumpPower * 0.95; player.vx = -player.onWall * player.speed * 1.4;
      player.facing = -player.onWall; player.onWall = 0; audio.jump();
    } else if(player.doubleJumpReady){
      player.vy = player.jumpPower * 0.88; player.doubleJumpReady = false; audio.jump();
    }
  }
});
bindTouch('btnSlam', () => { if(gameState === 'playing') player.triggerSlam(); });
bindTouch('btnMelee', () => { if(gameState === 'playing') player.triggerMelee(zombies, enemyProjectiles, particles, floatingTexts); });
bindTouch('btnDash', () => { if(gameState === 'playing') player.triggerDash(); });
bindTouch('btnShoot', () => {
  if(gameState === 'start' || gameState === 'gameover') resetGame();
  else if(gameState === 'playing') projectiles.push(...player.shoot(player.facing, 0));
});
bindTouch('btnUlt', () => {
  if(gameState === 'playing' && player.rageMeter >= player.maxRage){
    player.rageMeter = 0; triggerScreenShake(30, 14); audio.castMeteor();
    shockwaves.push(new ShockwaveRing(W/2, H/2, [255,215,0], 400, 35));
    floatingTexts.push(new FloatingText("💥 APOCALYPSE METEOR SMASH!", W/2, H/3, '#ffd700', 50));
    for(const z of zombies){
      if(z.alive){ z.takeDamage(30.0, 'meteor', particles); score += z.scoreVal * 2; gold += 15; }
    }
  }
});
bindTouch('btnSpell1', () => player.switchSpell('fireball'));
bindTouch('btnSpell2', () => player.switchSpell('lightning'));
bindTouch('btnSpell3', () => player.switchSpell('ice'));
bindTouch('btnSpell4', () => player.switchSpell('meteor'));
bindTouch('btnSpell5', () => player.switchSpell('vortex'));
bindTouch('btnSpell6', () => player.switchSpell('laser'));
document.getElementById('pauseToggle').addEventListener('click', () => { isPaused = !isPaused; });

// ----------------------------------------------------------------------------
// Render & Dynamic Lighting Loop
// ----------------------------------------------------------------------------
function updateHUD(){
  document.getElementById('scoreVal').textContent = 'Score: ' + score.toLocaleString();
  document.getElementById('waveVal').textContent = 'Wave: ' + wave;
  document.getElementById('goldVal').textContent = '🪙 ' + gold;
  document.getElementById('livesVal').textContent = '♥'.repeat(Math.max(0, lives));
}

function gameLoop(){
  frameCount++;
  const biome = getBiome();
  weather.update(biome.weather);

  if(gameState === 'playing' && !isPaused){
    for(const p of platforms) p.update();
    player.update(keys, platforms, particles, floatingTexts, shockwaves);

    const spawned = [];
    for(const z of zombies) z.update(player.rect, enemyProjectiles, spawned);
    zombies.push(...spawned);

    if(player.invincible <= 0){
      const pr = player.rect;
      for(const z of zombies){
        if(z.alive && pr.x < z.rect.x + z.rect.w && pr.x + pr.w > z.rect.x && pr.y < z.rect.y + z.rect.h && pr.y + pr.h > z.rect.y){
          if(player.shieldActive){
            player.shieldActive = false; player.invincible = 45;
            shockwaves.push(new ShockwaveRing(player.x, player.y - player.h/2, [45,215,255], 60, 18));
            floatingTexts.push(new FloatingText("SHIELD BROKEN!", player.x, player.y - player.h - 15, '#2dd4ff', 28));
            audio.dash();
          } else {
            lives--; player.invincible = 60; player.hitFlash = 35;
            triggerScreenShake(15, 8); audio.hurt();
            floatingTexts.push(new FloatingText("-1 LIFE", player.x, player.y - player.h - 15, '#ff1744', 32));
            if(lives <= 0){ gameState = 'gameover'; audio.castMeteor(); }
          }
          break;
        }
      }
    }

    for(let i = projectiles.length - 1; i >= 0; i--){
      const proj = projectiles[i];
      if(!proj.update(platforms)){
        for(let j=0; j<8; j++) particles.push(new Particle(proj.x, proj.y, proj.color, 4, 4, 15));
        projectiles.splice(i, 1); continue;
      }
      const pr = proj.rect;
      for(const z of zombies){
        if(z.alive && pr.x < z.rect.x + z.rect.w && pr.x + pr.w > z.rect.x && pr.y < z.rect.y + z.rect.h && pr.y + pr.h > z.rect.y){
          const dmg = proj.baseDmg * proj.dmgMult;
          const killed = z.takeDamage(dmg, proj.spellType, particles);
          player.combo++; player.comboTimer = 140;
          player.rageMeter = Math.min(player.maxRage, player.rageMeter + 4.5);

          const crit = proj.dmgMult > 1.5;
          floatingTexts.push(new FloatingText((crit ? "CRIT " : "") + Math.floor(dmg * 10), z.x + z.w/2, z.y - 10, crit ? '#ffd700' : '#fff', crit ? 28 : 22));

          if(killed){
            totalZombiesKilled++;
            const mult = 1 + Math.floor(player.combo / 3);
            score += z.scoreVal * mult; gold += Math.floor(3 + Math.random() * 6);
            shockwaves.push(new ShockwaveRing(z.x + z.w/2, z.y + z.h/2, [255,200,80], 45, 15));
            for(let k=0; k<3; k++) bones.push(new BoneDebris(z.x + z.w/2, z.y + z.h/2));
            if(Math.random() < 0.35) pickups.push(new Pickup(z.x + z.w/2, z.y + z.h/2));

            if(totalZombiesKilled >= 1) checkAchievement('first_blood', 'First Blood', 'Smashed your very first zombie!');
            if(totalZombiesKilled >= 50) checkAchievement('slayer', 'Zombie Slayer', 'Smashed 50 undead abominations!');
            if(player.combo >= 10) checkAchievement('combo', 'Combo King', 'Achieved a 10x Smash Streak!');
          }
          if(proj.pierceLeft > 0) proj.pierceLeft--;
          else { projectiles.splice(i, 1); break; }
        }
      }
    }

    for(let i = enemyProjectiles.length - 1; i >= 0; i--){
      const ep = enemyProjectiles[i];
      ep.x += ep.vx; ep.y += ep.vy; ep.life--;
      if(ep.life <= 0 || ep.x < 0 || ep.x > W || ep.y > H){ enemyProjectiles.splice(i, 1); continue; }
      const pr = player.rect;
      if(player.invincible <= 0 && ep.x >= pr.x && ep.x <= pr.x + pr.w && ep.y >= pr.y && ep.y <= pr.y + pr.h){
        if(player.shieldActive){ player.shieldActive = false; player.invincible = 40; }
        else {
          lives--; player.invincible = 50; player.hitFlash = 30;
          triggerScreenShake(12, 6); audio.hurt();
          if(lives <= 0){ gameState = 'gameover'; }
        }
        enemyProjectiles.splice(i, 1);
      }
    }

    for(let i = pickups.length - 1; i >= 0; i--){
      const pk = pickups[i];
      if(!pk.update(platforms, player)){ pickups.splice(i, 1); continue; }
      const dist = Math.hypot(player.x - pk.x, (player.y - player.h/2) - pk.y);
      if(dist < pk.radius + 26){
        audio.pickup();
        if(pk.type === 'heal'){ lives = Math.min(maxLives, lives + 1); floatingTexts.push(new FloatingText("+1 HEAL", player.x, player.y - player.h - 15, '#39ff14', 28)); }
        else if(pk.type === 'shield'){ player.shieldActive = true; floatingTexts.push(new FloatingText("ARCANE SHIELD!", player.x, player.y - player.h - 15, '#2dd4ff', 28)); }
        else if(pk.type === 'coin'){ gold += 10; score += 50; }
        else if(pk.type === 'gem'){ gold += 25; score += 150; }
        else if(pk.type === 'nuke'){
          audio.castMeteor(); triggerScreenShake(25, 12);
          shockwaves.push(new ShockwaveRing(W/2, H/2, [255,255,255], 500, 30));
          for(const z of zombies){ if(z.alive && !z.type.startsWith('boss')) z.takeDamage(50, 'fireball', particles); }
        } else if(pk.type === 'freeze'){
          for(const z of zombies) z.frozenTimer = 180;
        } else if(pk.type === 'frenzy'){
          player.rageMeter = player.maxRage;
        }
        pickups.splice(i, 1);
      }
    }

    const aliveZombies = zombies.filter(z => z.alive);
    if(aliveZombies.length === 0){
      wave++; score += 250; gold += 35;
      if(wave > 5) checkAchievement('titan', 'Titan Smasher', 'Defeated the Abomination Boss!');
      openShop();
    }

    particles = particles.filter(p => p.update());
    shockwaves = shockwaves.filter(sw => sw.update());
    bones = bones.filter(b => b.update(platforms));
    floatingTexts = floatingTexts.filter(ft => ft.update());
    banners = banners.filter(b => b.update());
    if(screenShake > 0) screenShake--;
  }

  // --------------------------------------------------------------------------
  // Main Render Pass
  // --------------------------------------------------------------------------
  ctx.save();
  if(screenShake > 0){
    ctx.translate((Math.random() - 0.5) * shakeIntensity * 2, (Math.random() - 0.5) * shakeIntensity * 2);
  }

  // 1. Parallax Deep Sky & Atmosphere
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, `rgb(${biome.skyTop[0]},${biome.skyTop[1]},${biome.skyTop[2]})`);
  grad.addColorStop(1, `rgb(${biome.skyBot[0]},${biome.skyBot[1]},${biome.skyBot[2]})`);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

  // Twinkling Star Field
  for(const s of STARS){
    const br = 0.4 + 0.5 * Math.sin(s.t + frameCount * s.spd);
    ctx.fillStyle = `rgba(255,255,255,${br})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
  }

  // Glowing Celestial Moon
  const moonX = W - 180, moonY = 120;
  const moonGlow = ctx.createRadialGradient(moonX, moonY, 15, moonX, moonY, 100);
  moonGlow.addColorStop(0, biome.moonCol); moonGlow.addColorStop(0.5, 'rgba(255,255,255,0.15)'); moonGlow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = moonGlow; ctx.beginPath(); ctx.arc(moonX, moonY, 100, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = biome.moonCol; ctx.beginPath(); ctx.arc(moonX, moonY, 34, 0, Math.PI * 2); ctx.fill();
  // Moon Craters
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath(); ctx.arc(moonX - 8, moonY - 6, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(moonX + 12, moonY + 8, 10, 0, Math.PI * 2); ctx.fill();

  // 2. Parallax Distant Gothic Castle Silhouettes
  ctx.fillStyle = `rgba(${Math.max(5, biome.skyTop[0]-5)},${Math.max(5, biome.skyTop[1]-5)},${Math.max(10, biome.skyTop[2]-5)},0.65)`;
  ctx.beginPath();
  ctx.moveTo(0, H - 180);
  for(let x=0; x<=W; x+=140){
    const py = H - 220 - Math.sin(x*0.015) * 45;
    ctx.lineTo(x, py);
    ctx.lineTo(x + 30, py - 40); // Spire peak
    ctx.lineTo(x + 60, py);
  }
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

  // 3. Volumetric Fog & Weather
  weather.draw(biome);

  // 4. Platforms & Environment
  for(const p of platforms) p.draw(biome, frameCount);
  for(const b of bones) b.draw();
  for(const pk of pickups) pk.draw();
  for(const z of zombies) z.draw();

  for(const ep of enemyProjectiles){
    ctx.fillStyle = `rgb(${ep.color[0]},${ep.color[1]},${ep.color[2]})`;
    ctx.beginPath(); ctx.arc(ep.x, ep.y, ep.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ep.x, ep.y, Math.max(1, ep.r - 3), 0, Math.PI * 2); ctx.fill();
  }

  for(const proj of projectiles) proj.draw();
  for(const sw of shockwaves) sw.draw();
  for(const part of particles) part.draw();
  if(gameState === 'playing' || gameState === 'shop') player.draw();
  for(const ft of floatingTexts) ft.draw();
  for(const b of banners) b.draw();

  // --------------------------------------------------------------------------
  // Dynamic Lighting Pass (Radial Lights blending)
  // --------------------------------------------------------------------------
  lightCtx.clearRect(0, 0, W, H);
  lightCtx.fillStyle = `rgba(5,5,15,${biome.darkLevel})`;
  lightCtx.fillRect(0, 0, W, H);
  lightCtx.globalCompositeOperation = 'destination-out';

  // Light around Player
  if(gameState === 'playing' || gameState === 'shop'){
    const pGlow = lightCtx.createRadialGradient(player.x, player.y - player.h/2, 20, player.x, player.y - player.h/2, 160);
    pGlow.addColorStop(0, 'rgba(0,0,0,1)'); pGlow.addColorStop(1, 'rgba(0,0,0,0)');
    lightCtx.fillStyle = pGlow; lightCtx.beginPath(); lightCtx.arc(player.x, player.y - player.h/2, 160, 0, Math.PI * 2); lightCtx.fill();
  }

  // Light around Projectiles
  for(const proj of projectiles){
    const prGlow = lightCtx.createRadialGradient(proj.x, proj.y, 5, proj.x, proj.y, 90);
    prGlow.addColorStop(0, 'rgba(0,0,0,1)'); prGlow.addColorStop(1, 'rgba(0,0,0,0)');
    lightCtx.fillStyle = prGlow; lightCtx.beginPath(); lightCtx.arc(proj.x, proj.y, 90, 0, Math.PI * 2); lightCtx.fill();
  }

  // Light around Torches
  for(const p of platforms){
    if(p.hasTorch){
      const tGlow = lightCtx.createRadialGradient(p.torchX, p.y - 18, 5, p.torchX, p.y - 18, 80);
      tGlow.addColorStop(0, 'rgba(0,0,0,0.85)'); tGlow.addColorStop(1, 'rgba(0,0,0,0)');
      lightCtx.fillStyle = tGlow; lightCtx.beginPath(); lightCtx.arc(p.torchX, p.y - 18, 80, 0, Math.PI * 2); lightCtx.fill();
    }
  }
  lightCtx.globalCompositeOperation = 'source-over';
  ctx.drawImage(lightCanvas, 0, 0);

  // --------------------------------------------------------------------------
  // HUD & UI Overlays
  // --------------------------------------------------------------------------
  if(gameState === 'playing'){
    if(player.combo > 1){
      ctx.fillStyle = '#ffd700'; ctx.font = '900 36px sans-serif'; ctx.textAlign = 'center';
      ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 12;
      ctx.fillText(`${player.combo}x COMBO!`, W/2, 80);
      ctx.shadowBlur = 0;
    }

    // Hotbar (1-6)
    const spellNames = [
      ['1:Fire', 'fireball', '#ff7800'],
      ['2:Spark', 'lightning', '#2dd4ff'],
      ['3:Frost', 'ice', '#a8e6cf'],
      ['4:Meteor', 'meteor', '#d070ff'],
      ['5:Vortex', 'vortex', '#f050ff'],
      ['6:Laser', 'laser', '#ffe600']
    ];
    for(let i=0; i<spellNames.length; i++){
      const [lbl, sId, sCol] = spellNames[i];
      const bx = W/2 - 270 + i * 90, by = 20;
      const isAct = (player.activeSpell === sId);
      ctx.fillStyle = isAct ? 'rgba(50,50,90,0.9)' : 'rgba(20,20,35,0.7)';
      ctx.fillRect(bx, by, 82, 30);
      ctx.strokeStyle = isAct ? sCol : 'rgba(255,255,255,0.2)';
      ctx.lineWidth = isAct ? 3 : 1;
      ctx.strokeRect(bx, by, 82, 30);
      ctx.fillStyle = isAct ? sCol : '#fff';
      ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(lbl, bx + 41, by + 19);
    }
  }

  // Upgrade Emporium Modal
  if(gameState === 'shop'){
    ctx.fillStyle = 'rgba(8,8,20,0.92)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd700'; ctx.font = '900 52px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText("ARCANE UPGRADE EMPORIUM", W/2, 110);
    ctx.fillStyle = '#e6faff'; ctx.font = '22px sans-serif';
    ctx.fillText(`Wave ${wave-1} Cleared! Choose an arcane upgrade | Gold: ${gold} 🪙`, W/2, 170);

    for(let i=0; i<shopOptions.length; i++){
      const perk = shopOptions[i];
      const cx = W/2 - 360 + i * 360, cy = 230, cw = 320, ch = 360;
      const isSel = (i === selectedShopIdx);
      ctx.fillStyle = isSel ? '#252548' : '#141424';
      ctx.fillRect(cx, cy, cw, ch);
      ctx.strokeStyle = isSel ? '#ffd700' : 'rgba(255,255,255,0.2)';
      ctx.lineWidth = isSel ? 4 : 2;
      ctx.strokeRect(cx, cy, cw, ch);

      ctx.fillStyle = isSel ? '#ffd700' : '#fff'; ctx.font = 'bold 24px sans-serif';
      ctx.fillText(perk.name, cx + cw/2, cy + 45);

      const canAfford = gold >= perk.cost;
      ctx.fillStyle = canAfford ? '#39ff14' : '#ff4d6d'; ctx.font = 'bold 20px sans-serif';
      ctx.fillText(`Cost: ${perk.cost} 🪙`, cx + cw/2, cy + 90);

      ctx.fillStyle = '#ccc'; ctx.font = '16px sans-serif';
      ctx.fillText(perk.desc, cx + cw/2, cy + 160, cw - 40);

      ctx.fillStyle = canAfford ? '#28a745' : '#444';
      ctx.fillRect(cx + 30, cy + ch - 65, cw - 60, 42);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif';
      ctx.fillText(canAfford ? "TAP / SPACE TO BUY" : "LOCKED", cx + cw/2, cy + ch - 38);
    }
    ctx.fillStyle = '#aaa'; ctx.font = '16px sans-serif';
    ctx.fillText("[← / →] Select | [SPACE] Purchase | [ESC] Skip", W/2, H - 70);
  }

  // Start Screen
  if(gameState === 'start'){
    ctx.fillStyle = 'rgba(8,8,20,0.88)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd700'; ctx.font = '900 58px sans-serif'; ctx.textAlign = 'center';
    ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 18;
    ctx.fillText("RILEY SMASHES THE ZOMBIES", W/2, 190);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#2dd4ff'; ctx.font = 'bold 24px sans-serif';
    ctx.fillText("Ultra HD Graphics Edition", W/2, 250);

    ctx.fillStyle = '#fff'; ctx.font = '19px sans-serif';
    ctx.fillText("[A/D] Move | [W] Jump/Wall Jump | [S] Ground Slam | [F] Staff Melee/Deflect", W/2, 340);
    ctx.fillText("[1-6] Switch Spells | [SPACE] Cast Spell | [SHIFT] Warp Dash", W/2, 390);
    ctx.fillText("[R] Unleash Apocalypse Meteor Smash when rage is full!", W/2, 440);

    ctx.fillStyle = '#39ff14'; ctx.font = '900 30px sans-serif';
    ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 12;
    ctx.fillText("Press SPACE, ENTER or TAP to Begin", W/2, 550);
    ctx.shadowBlur = 0;
  }

  // Game Over
  if(gameState === 'gameover'){
    ctx.fillStyle = 'rgba(18,4,8,0.92)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff1744'; ctx.font = '900 68px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText("GAME OVER", W/2, H/2 - 90);
    ctx.fillStyle = '#ffd700'; ctx.font = 'bold 34px sans-serif';
    ctx.fillText(`Final Score: ${score.toLocaleString()}`, W/2, H/2 - 20);
    ctx.fillStyle = '#fff'; ctx.font = '22px sans-serif';
    ctx.fillText(`Waves Survived: ${wave} | Zombies Smashed: ${totalZombiesKilled}`, W/2, H/2 + 40);
    ctx.fillStyle = '#39ff14'; ctx.font = 'bold 26px sans-serif';
    ctx.fillText("Press SPACE, ENTER or TAP to Rise Again", W/2, H/2 + 110);
  }

  // Pause
  if(isPaused && gameState === 'playing'){
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 54px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText("PAUSED", W/2, H/2);
    ctx.fillStyle = '#aaa'; ctx.font = '20px sans-serif';
    ctx.fillText("Press P or Tap ⏸️ to Resume", W/2, H/2 + 50);
  }

  ctx.restore();
  updateHUD();
  requestAnimationFrame(gameLoop);
}

gameLoop();
})();
</script>
</body>
</html>
