name: Content / SEO
description: A copy, link, structured-data, accessibility, or SEO issue that isn't a broken tool.
title: "[Content/SEO] "
labels: ["content", "seo"]

body:
  - type: markdown
    attributes:
      value: |
        Use this template for anything that is not a "the number is wrong"
        bug or a tool request: copy, links, structured data, sitemap,
        translations, accessibility, mobile layout, page speed, etc.

  - type: input
    id: page
    attributes:
      label: URL
      description: |
        The page the issue is on. (If you mean a card, link to the
        standalone viewer: `tool.html?card=<slug>`.)
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind of issue
      options:
        - Copy / wording / grammar
        - Broken link
        - Slug or URL inconsistency
        - Structured data (JSON-LD)
        - Sitemap / RSS / llms.txt / robots.txt
        - Meta tags (title / description / og:* / twitter:*)
        - Accessibility (contrast / keyboard / screen reader)
        - Mobile layout
        - Translation / hreflang
        - Other (describe)
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: What's wrong?
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Suggested fix (optional)
      description: |
        If you have a concrete suggestion, paste it. If not, leave
        blank and the reviewer will take it from here.
    validations:
      required: false
