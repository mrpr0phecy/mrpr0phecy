name: Bug
description: A tool or page is broken, wrong, or behaving unexpectedly.
title: "[Bug] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        A bug means a tool gives the wrong number, a page doesn't load,
        or something in the UI doesn't work the way the docs/UX imply.
        For "the tool doesn't exist", please file a tool request instead.

  - type: input
    id: page
    attributes:
      label: Page or tool
      description: |
        Which page or tool? Either the URL, the tool slug, or the
        human-readable name.
      placeholder: |
        https://www.themostusefulsiteintheworld.com/tool.html?card=mortgage
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Wrong number / wrong result (high)"
        - "Page or tool won't load (high)"
        - "UI broken but the math is right (medium)"
        - "Cosmetic / accessibility / mobile-only (low)"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: |
        The exact inputs and steps to reproduce. For "page won't load",
        paste the URL and the browser console errors.
      placeholder: |
        1. Open `tool.html?card=mortgage`
        2. Enter principal £250,000, rate 4.5%, term 25
        3. Click Calculate
        4. Expected: monthly payment around £1,389
        5. Actual: £1,372 (too low)
    validations:
      required: true

  - type: input
    id: expected
    attributes:
      label: Expected
      description: |
        What you expected. (Or: "I don't know what the right answer is,
        but the value shouldn't change when I change the rate by 0.1%"
        — anything that helps the reviewer verify.)
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser / OS
      description: |
        E.g. "Chrome 128 on macOS 14" or "Safari 17 on iOS 17". Skip
        if the bug is not browser-specific.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
    validations:
      required: false
