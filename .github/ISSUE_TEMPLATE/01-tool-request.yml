name: Tool request
description: Suggest a new tool for the catalogue. Will be reviewed and (if accepted) added in a future commit.
title: "[Tool request] "
labels: ["enhancement", "tool-request"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. A few quick questions help us decide
        whether and how to build the tool. Please answer what you can —
        partial answers are still useful.

  - type: input
    id: name
    attributes:
      label: Tool name (one or two words)
      description: |
        What should the tool be called? (We'll generate the URL slug from
        this — kebab-case, lowercase, no spaces.)
      placeholder: e.g. "Rental yield"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: |
        Which of the 23 existing categories does this fit? (If we don't
        have a fitting one, we'll add it to the closest fit rather than
        invent a new category.)
      options:
        - Finance & Money
        - Mathematics
        - Science & Engineering
        - Health & Fitness
        - Culinary & Food Science
        - Writing & Language
        - Home & DIY
        - Productivity & Lifestyle
        - Music & Audio
        - Astronomy & Space
        - Birds & Birdwatching
        - Dogs & Canine Care
        - Aquariums & Fishkeeping
        - Anime & Otaku
        - Boxing & Scoring
        - Natural Remedies & Herbs
        - AI & Autonomous Agents
        - SaaS & Business Killers
        - Virtual Worlds & Gaming
        - Interactive Art & Living Worlds
        - Museum & Collection
        - MrProphecy Arcade
        - Wellbeing & Community
        - Lucid Dreaming & Sleep
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        What are you actually trying to do? Describe the situation
        first; the inputs and outputs follow from that.
      placeholder: |
        I run a small rental portfolio and wanted to compare the yield on
        two flats I was considering. The existing mortgage calculator is
        great for the loan math but doesn't help with the yield side —
        gross yield, net yield, cap rate, and the cash-on-cash number
        after the deposit and refurb.
    validations:
      required: true

  - type: textarea
    id: existing
    attributes:
      label: Have you checked we don't already have it?
      description: |
        We have 562 tools. Search `/tools` (or just the home page) before
        filing. If a similar tool exists, link to it here and say what's
        different.
      placeholder: |
        The closest existing tool is `mortgage`, but it's loan-side only.
        A separate `rental-yield` tool would handle the income/expense
        side. If you'd rather extend `mortgage`, that would also work.
    validations:
      required: false

  - type: textarea
    id: inputs
    attributes:
      label: Inputs (best guess — we'll refine)
      description: |
        What would the user type in? Optional, but a few examples help
        scope the work.
    validations:
      required: false

  - type: textarea
    id: outputs
    attributes:
      label: Outputs (best guess — we'll refine)
      description: |
        What should the tool show? Numbers, a chart, a recommendation,
        a comparison?
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References / sources
      description: |
        A formula, a spec, a paper, a calculator on another site that
        you trust. Especially important for finance, science, and
        medical/health tools.
    validations:
      required: false
