version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    # Keep the actions/checkout version in step with the existing workflow.
    # We don't currently use any npm/pip packages; bump this file's
    # ecosystems if that changes.

  # We deliberately do not enable Dependabot for npm/pip: this repo has
  # no build step, no package manifest, and a 100 MB workspace budget.
  # Adding package ecosystems here without a real manifest will just
  # generate noise. See AGENTS.md §2.
