name: Agent guardrails

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run verify.sh
        run: bash scripts/verify.sh
      - name: Tool-count claims
        if: always()
        run: python3 scripts/sync-counts.py --check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sitemap freshness
        if: always()
        run: python3 scripts/build-sitemap.py --check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Accessibility scan
        if: always()
        run: python3 scripts/check-a11y.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Network egress scan (D-009)
        if: always()
        run: python3 scripts/check-egress.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Design audit
        if: always()
        run: node scripts/design-audit.js | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Attach catalogue report
        if: always()
        run: python3 scripts/check-cards.py | tee -a "$GITHUB_STEP_SUMMARY"
