name: Agent guardrails

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Run verify.sh (includes staff configuration and regression tests)
        run: bash scripts/verify.sh
      - name: Attach catalogue report
        if: always()
        run: python3 scripts/check-cards.py | tee -a "$GITHUB_STEP_SUMMARY"
