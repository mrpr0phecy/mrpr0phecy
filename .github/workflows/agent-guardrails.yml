name: Agent guardrails

# Two tiers (AGENTS.md §1):
#   Repo checks        the 7-check gate — PRs and pushes. A one-tool edit must
#                      not wait for the whole catalogue's audits.
#   Repo checks (deep) gate + full audits (egress, a11y, collisions, CSS
#                      leaks, drift, card-JS sweep, tests, quality floors) —
#                      merge (push to main, the deploy) and nightly.
#
# Keep the job name "Repo checks": it is the required status check on PRs.
# Local validation is task-based; don't duplicate this for every local edit.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '32 4 * * *'   # nightly deep sweep, away from the production monitor's 17-minute run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # jsdom is deliberately not a repository dependency (AGENTS.md §2), and
      # the suites skip loudly without it — install it outside the checkout,
      # where every script looks first.
      - name: Install jsdom (outside the repository)
        run: |
          mkdir -p /tmp/tenv
          cd /tmp/tenv
          npm init -y >/dev/null 2>&1
          npm install jsdom --no-audit --no-fund --loglevel=error
      - name: Verify (the gate)
        run: bash scripts/verify.sh
      - name: Attach catalogue report
        if: always()
        run: python3 scripts/check-cards.py | tee -a "$GITHUB_STEP_SUMMARY"

  verify-deep:
    name: Repo checks (deep)
    # Merge + nightly, not per-PR: the audits cost ~75 s of the ~2 min a small
    # PR used to wait for, and they change nothing about an edit in progress.
    # main is the deploy, so the full gate still stands between any change and
    # the live site — the production monitor then probes the deployed site.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install jsdom (outside the repository)
        run: |
          mkdir -p /tmp/tenv
          cd /tmp/tenv
          npm init -y >/dev/null 2>&1
          npm install jsdom --no-audit --no-fund --loglevel=error
      - name: Verify (gate + deep audits)
        run: bash scripts/verify.sh --deep
      - name: Attach catalogue report
        if: always()
        run: python3 scripts/check-cards.py | tee -a "$GITHUB_STEP_SUMMARY"
