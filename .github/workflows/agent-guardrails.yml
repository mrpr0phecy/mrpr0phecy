name: Agent guardrails

# Keep the full deep gate on PRs and pushes to main. Local validation is
# task-based (AGENTS.md §1); no need to duplicate this for every local edit.
# Keep the workflow/job names stable for required status checks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # The card checks (inline handlers, and anything driven through jsdom)
      # need jsdom, which is deliberately NOT a repository dependency — the site
      # ships zero dependencies and AGENTS.md keeps the module out of the tree.
      # The suites SKIP loudly without it, which meant "repo checks passed"
      # while the handler sweep had not run at all. Install it outside the
      # checkout, where every script already looks first.
      - name: Install jsdom (outside the repository)
        run: |
          mkdir -p /tmp/tenv
          cd /tmp/tenv
          npm init -y >/dev/null 2>&1
          npm install jsdom --no-audit --no-fund --loglevel=error
      - name: Verify (gate + deep audits)
        run: bash scripts/verify.sh --deep
      - name: Attach catalogue report
        if: always()
        run: python3 scripts/check-cards.py | tee -a "$GITHUB_STEP_SUMMARY"
