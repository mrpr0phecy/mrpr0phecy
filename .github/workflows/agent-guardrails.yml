name: Agent guardrails

# 2026-09-19, owner request: the automatic suite was seriously slowing
# AI-driven work on the site. Every push and every PR ran the full
# 21-section scripts/verify.sh (~3 minutes per run, re-triggered on every
# push, and agents in this repo are instructed to `gh pr checks --watch`
# before merging). Automatic runs are now a fast pass that completes in
# seconds and cannot block.
#
# 2026-09-20 update: the suite itself is ~2.6x faster (22 sections, ~13 s on
# two cores, ~34 s serial — the per-section timing table at the end of a run
# names the slowest ones). The fast pass stays as the owner decided; this note
# is only so nobody reads "~3 minutes" above as the current cost.
#
# The full gate is still available, deliberately invoked:
#   * local:        bash scripts/verify.sh
#   * in CI:        Actions → Agent guardrails → Run workflow → full: true
#                   (gh workflow run "Agent guardrails" -f full=true)
#   * still automatic, off the developer loop: the scheduled AI Developer
#     facility runs all staff checks Mon & Thu, and the production monitor
#     probes the deployed site after merges and every six hours.
#
# The workflow and job names are unchanged so a "Repo checks" required
# status check in branch protection keeps resolving — it just resolves in
# seconds now.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the complete verify.sh suite instead of the fast pass'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fast pass — automatic suite disabled
        if: github.event_name != 'workflow_dispatch' || !inputs.full
        run: |
          echo "::notice title=Fast pass::The automatic verify.sh suite is disabled by owner request (2026-09-19) to keep agent sessions fast. Run the full suite manually: Actions → Agent guardrails → full=true, or bash scripts/verify.sh locally."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch' && inputs.full
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event_name == 'workflow_dispatch' && inputs.full
        with:
          node-version: '22'
      # Section 23 of verify.sh injects every tool card through the real
      # renderCardContent() path and fails on the ones whose JavaScript throws.
      # It needs jsdom, and without it the section prints a NOTE and proves
      # nothing — so this gate would report green while checking no cards at
      # all. 26 cards shipped dead in exactly that blind spot. Pinned to an
      # exact version for the same reason the actions above are pinned by SHA.
      - name: Install jsdom (card runtime sweep)
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: npm install --no-save --no-audit --no-fund jsdom@30.1.0
      - name: Run verify.sh (exhaustive — includes staff configuration and regression tests)
        if: github.event_name == 'workflow_dispatch' && inputs.full
        env:
          # VERIFY_FULL=1 opts into the exhaustive checks (the full
          # ~1,200-card JS sweep) so the on-demand CI gate stays strict
          # even though local/push-time runs use the fast path.
          VERIFY_FULL: "1"
        run: bash scripts/verify.sh
      - name: Attach catalogue report
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.full }}
        run: python3 scripts/check-cards.py | tee -a "$GITHUB_STEP_SUMMARY"
