name: TEMP live probe validation

# TEMPORARY — not for merge. Validates the new production monitor against the
# real deployed site from a runner (the authoring sandbox has no egress), proves
# the checks are not vacuous with negative controls, and exercises the alert
# job's shell logic without creating an issue. Deleted before merge.
on:
  push:
    branches: [arena/01a0a723-mrpr0phecy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Full contract against production
        id: real
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          node scripts/check-production.js --sample 12 \
            --json "$RUNNER_TEMP/production-report.json" \
            --summary "$RUNNER_TEMP/production-summary.md"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assert the report is real, not vacuous
        run: |
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/production-report.json", "utf8"));
            const s = report.summary;
            const surfaces = report.checks.map(c => c.surface);
            const fail = m => { console.error("ASSERTION FAILED: " + m); process.exit(1); };
            console.log("checks:", s.checks, "passed:", s.passed, "failed:", s.failed, "warned:", s.warned, "skipped:", s.skipped);
            if (s.checks < 15) fail("too few checks ran: " + s.checks);
            if (s.failed !== 0) fail("failures: " + JSON.stringify(report.checks.filter(c => !c.ok && c.severity === "fail"), null, 1));
            for (const need of ["index.html", "tool.html", "listen.html", "404.html", "robots.txt", "tools/bmi.html", "cards/cards.json", "sitemap.xml", "catalogue integrity", "sitemap integrity", "404 handling", "https enforcement", "apex host"]) {
              if (!surfaces.includes(need)) fail("expected surface missing: " + need);
            }
            const skips = report.checks.filter(c => c.skipped).map(c => c.surface);
            if (skips.length) fail("against the real origin nothing should be skipped, got: " + skips.join(", "));
            const https = report.checks.find(c => c.surface === "https enforcement");
            const apex = report.checks.find(c => c.surface === "apex host");
            console.log("https enforcement:", https.ok ? "PASS" : "FAIL", "-", https.detail);
            console.log("apex host:", apex.ok ? "PASS" : "FAIL", "-", apex.detail);
            if (!https.ok) fail("https enforcement did not hold on the live site");
            const hashes = report.checks.filter(c => c.evidence && c.evidence.repoHash).length;
            if (hashes < 12) fail("expected at least 12 hashed comparisons, got " + hashes);
            console.log("hashed comparisons:", hashes, "| cards sampled:", report.sample.cards.length);
            console.log("slowest:", s.slowestTtfbMs + "ms on " + s.slowestSurface);
          '

      - name: Negative control — a repository that differs must fail, naming the file
        run: |
          set -euo pipefail
          cp index.html "$RUNNER_TEMP/index.html.orig"
          printf '\n<!-- negative control: pretend this commit was never deployed -->\n' >> index.html
          set +e
          node scripts/check-production.js --sample 1 --compare index.html --json "$RUNNER_TEMP/negative.json" --quiet
          code=$?
          set -e
          mv "$RUNNER_TEMP/index.html.orig" index.html
          echo "drifted local copy -> exit $code (expected 1)"
          [ "$code" = "1" ] || { echo "::error::byte-identity did not notice a drifted file"; exit 1; }
          node -e '
            const r = require(process.env.RUNNER_TEMP + "/negative.json");
            const hit = r.checks.find(c => c.surface === "index.html" && !c.ok);
            if (!hit || !/live bytes differ/.test(hit.detail)) { console.error("expected a byte-identity failure for index.html"); process.exit(1); }
            console.log("negative control named the file:", hit.detail);
          '
          git diff --exit-code --stat index.html && echo "working tree restored"

      - name: Exit paths — a missing page fails, a bad flag cannot run
        run: |
          set -euo pipefail
          set +e
          node scripts/check-production.js --probe __monitor-self-test-missing__.html --sample 1 --quiet
          probe_code=$?
          node scripts/check-production.js --not-a-real-flag --quiet
          arg_code=$?
          set -e
          echo "missing page -> exit $probe_code (expected 1); bad flag -> exit $arg_code (expected 2)"
          [ "$probe_code" = "1" ] || { echo "::error::missing page did not fail"; exit 1; }
          [ "$arg_code" = "2" ] || { echo "::error::bad invocation was not exit 2"; exit 1; }

      - name: Alert logic dry run (no issue created)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE_PREFIX: 'Production monitor:'
        run: |
          set -euo pipefail
          echo "Existing alert issues matching the prefix:"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$TITLE_PREFIX\"" --json number,title --jq '.[] | "#\(.number) \(.title)"' || true
          echo "Repository issue-writing permission for this token: $(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_issues') (has_issues)"
          echo "Alert dry run complete — the real create/close path stays in production-monitor.yml."

      - name: Report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/production-summary.md" ]; then cat "$RUNNER_TEMP/production-summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "Full-contract exit code: ${{ steps.real.outputs.exit_code }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: temp-live-probe
          path: |
            ${{ runner.temp }}/production-report.json
            ${{ runner.temp }}/production-summary.md
            ${{ runner.temp }}/negative.json
          if-no-files-found: warn
      - name: Fail if production did not match
        if: steps.real.outputs.exit_code != '0'
        run: exit 1
