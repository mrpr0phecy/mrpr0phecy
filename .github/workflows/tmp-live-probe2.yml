name: TEMP live surface probe

# TEMPORARY. Deleted once it has answered the question: which of the site's
# advertised machine-readable endpoints does the deployed site actually serve?
# GitHub Pages' legacy build runs Jekyll, which skips paths beginning with
# "_" or ".", so .well-known/ and _build/ are suspects.

on:
  push:
    branches:
      - arena/01a0a723-mrpr0phecy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe the deployed surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Probe every advertised endpoint
        run: node scripts/tmp-probe-live.js
