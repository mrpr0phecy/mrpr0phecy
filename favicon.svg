<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="The Most Useful Site in the World">
  <title>The Most Useful Site in the World</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ff0ff"/>
      <stop offset="42%" stop-color="#2dd4ff"/>
      <stop offset="100%" stop-color="#2f6bff"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2000"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0758"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0000"/>
    </linearGradient>
  </defs>
  <!-- The tile: the site's own accent gradient, with the same white sheen the
       raster icons carry. -->
  <rect width="32" height="32" rx="9.4" fill="url(#tile)"/>
  <rect width="32" height="32" rx="9.4" fill="url(#gloss)"/>
  <g transform="translate(16 16) scale(0.94) translate(-16 -16)">
    <!-- Lens: a dark well inside a white ring, so the ring reads on the tile. -->
    <circle cx="14" cy="14" r="6.9" fill="rgb(7,21,44)" fill-opacity="0.65"/>
    <circle cx="14" cy="14" r="6.9" fill="none" stroke="#ffffff" stroke-width="2.8"/>
    <!-- Handle. -->
    <path d="M19.3 19.3 L24.75 24.75"
          stroke="#ffffff" stroke-width="3.1" stroke-linecap="round" fill="none"/>
    <!-- Spark: the answer in the lens. Four tips, quadratic sides. -->
    <path d="M14.000 10.050 Q15.216 12.784 17.950 14.000 Q15.216 15.216 14.000 17.950 Q12.784 15.216 10.050 14.000 Q12.784 12.784 14.000 10.050 Z"
          fill="#ffffff"/>
  </g>
</svg>
