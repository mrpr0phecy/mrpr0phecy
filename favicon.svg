<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="The Most Useful Site in the World">
  <title>The Most Useful Site in the World</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ff0ff"/>
      <stop offset="42%" stop-color="#2dd4ff"/>
      <stop offset="100%" stop-color="#2f6bff"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1600"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0606"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0000"/>
    </linearGradient>
  </defs>
  <!-- The tile: the site's own accent gradient, with the same white sheen the
       raster icons carry. -->
  <rect width="32" height="32" rx="9.2" fill="url(#tile)"/>
  <rect width="32" height="32" rx="9.2" fill="url(#gloss)"/>
  <!-- The aperture: opaque ink, so the spark reads as a knockout at every size
       instead of tinting toward the tile. -->
  <circle cx="16" cy="16" r="7.8" fill="#071019"/>
  <!-- The answer. -->
  <path d="M16.000 11.150 Q17.626 14.374 20.850 16.000 Q17.626 17.626 16.000 20.850 Q14.374 17.626 11.150 16.000 Q14.374 14.374 16.000 11.150 Z" fill="#ffffff"/>
  <!-- The needle: out of the disc's own edge, on the diagonal. -->
  <path d="M21.5 21.5 L25.9 25.9" stroke="#071019" stroke-width="2.9" stroke-linecap="round" fill="none"/>
</svg>
